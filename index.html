  {c:"Spring",d:"★★★",q:"Spring IOC 的理解？DI 的方式有哪些？",
   a:`<p><strong>IOC（控制反转）</strong>说白了就是：以前咱们自己 new 对象、自己管依赖关系，现在把这些活儿交给 Spring 容器来干，咱只管用。好处是代码解耦了。<strong>DI（依赖注入）</strong>是 IOC 的实现手段——容器主动把依赖塞给对象。</p>
      <p>三种注入方式：</p>
      <ul>
        <li><strong>构造器注入</strong>（推荐）：通过构造方法传依赖。</li>
        <li><strong>Setter 注入</strong>：通过 setter 方法。</li>
        <li><strong>字段注入</strong>：直接 @Autowired 打在字段上（简单但不推荐）。</li>
      </ul>
      <blockquote>为什么推荐构造器注入？字段能声明成 final（不可变更安全）、不会出现依赖为 null、方便单元测试。而且构造器注入如果出现循环依赖，Spring 会直接报错暴露问题，不会像字段注入那样藏着。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. IOC 的本质</strong></p>
      <p>控制反转：对象创建和依赖管理的"控制权"从应用代码<strong>反转</strong>给 Spring 容器。传统：A 类里 new B（A 主动控制）；IOC：容器创建 A 和 B，把 B 注入给 A（A 被动接收）。核心目的：<strong>解耦</strong>，符合依赖倒置原则（面向接口编程）。</p>
      <p><strong>2. DI 是 IOC 的实现</strong></p>
      <p>IOC 是思想，DI（Dependency Injection）是实现方式：容器在运行时把依赖"注入"到对象。没有 DI，IOC 就是空谈。</p>
      <p><strong>3. 三种注入方式</strong></p>
      <ul>
        <li><strong>构造器注入（官方推荐）</strong>：通过构造方法传依赖。优点：字段可 final（不可变）、无 NPE、易测试、能在启动期暴露循环依赖。</li>
        <li><strong>Setter 注入</strong>：setXxx 方法。适合可选依赖（可设 @Autowired(required=false)）。</li>
        <li><strong>字段注入</strong>：@Autowired 打字段上。简单但不推荐：不能 final、隐藏依赖关系、难测试、不能脱离容器。</li>
      </ul>
      <p><strong>4. BeanFactory vs ApplicationContext</strong></p>
      <p>BeanFactory 是 IOC 顶层接口（基础 Bean 管理，懒加载）；ApplicationContext 继承它，扩展事件、国际化、AOP，且<strong>预实例化</strong>（启动时创建所有 singleton）。日常用 ApplicationContext。</p>
      <p><strong>5. 构造器注入的循环依赖问题</strong></p>
      <p>构造器注入无法解决循环依赖（对象都没实例化完，三级缓存用不上），Spring 启动直接报错 BeanCurrentlyInCreationException，这反而促使开发者重构代码。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>IOC 是控制反转（对象创建权交给容器，解耦），DI 是其实现（容器注入依赖）。三方式：构造器（推荐，final不可变易测试）、Setter（可选依赖）、字段（不推荐）。BeanFactory 基础懒加载，ApplicationContext 增强预实例化。</p>`},
  {c:"Spring",d:"★★★",q:"Spring AOP 的原理？JDK 动态代理和 CGLIB 的区别？",
   a:`<p><strong>AOP</strong> 就是在不改动原来业务代码的前提下，给方法加上一些通用功能（比如打印日志、开事务、做权限校验）。原理是给目标对象生成一个<strong>代理对象</strong>，由代理对象来"包一层"。</p>
      <p>生成代理有两种方式：</p>
      <ul>
        <li><strong>JDK 动态代理</strong>：基于接口，目标类必须实现接口才能用。</li>
        <li><strong>CGLIB</strong>：基于继承，生成目标类的子类，所以<strong>不能代理 final 类和 final 方法</strong>。不需要接口。</li>
      </ul>
      <blockquote>注意一个坑：Spring 原生是"有接口用 JDK、没接口用 CGLIB"，但 <strong>Spring Boot 2.0 以后默认全用 CGLIB</strong>（把 proxyTargetClass 设成了 true）。面试经常问这个区别。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. AOP 核心概念</strong></p>
      <ul>
        <li><strong>切面 Aspect</strong>：横切关注点的模块化（如日志切面、事务切面）。</li>
        <li><strong>切点 Pointcut</strong>：定义"在哪些方法上"切入（如 execution(* com.xxx.*.*(..))）。</li>
        <li><strong>通知 Advice</strong>：要织入的逻辑。Before/After/Around/AfterReturning/AfterThrowing。</li>
        <li><strong>织入 Weaving</strong>：Spring 在<strong>运行时</strong>通过动态代理织入（区别于 AspectJ 的编译期/类加载期）。</li>
        <li><strong>目标对象 Target</strong>：被代理的原始对象。</li>
      </ul>
      <p><strong>2. 代理生成的入口</strong></p>
      <p>AnnotationAwareAspectJAutoProxyCreator（一个 BeanPostProcessor），在 postProcessAfterInitialization 阶段判断 Bean 是否需要增强，需要就用代理对象替换原始 Bean。</p>
      <p><strong>3. JDK 动态代理</strong></p>
      <ul>
        <li>基于<strong>接口</strong>：java.lang.reflect.Proxy.newProxyInstance。目标类必须实现接口。</li>
        <li>生成一个实现了相同接口的代理类，InvocationHandler.invoke 拦截。</li>
        <li>优点：JDK 内置，无额外依赖。</li>
        <li>缺点：必须有接口。</li>
      </ul>
      <p><strong>4. CGLIB（Code Generation Library）</strong></p>
      <ul>
        <li>基于<strong>继承</strong>：用 ASM 生成目标类的子类，重写方法织入增强。</li>
        <li>不需要接口。</li>
        <li>限制：不能代理 final 类（继承不了）、final 方法（重写不了）、private 方法。</li>
        <li>优点：适用面广。缺点：创建慢（生成字节码），但调用快（直接调）。</li>
      </ul>
      <p><strong>5. Spring 的选择策略</strong></p>
      <ul>
        <li>Spring Framework：有接口默认 JDK 代理，无接口用 CGLIB。可用 @EnableAspectJAutoProxy(proxyTargetClass=true) 强制 CGLIB。</li>
        <li><strong>Spring Boot 2.0+ 默认 proxyTargetClass=true，即默认全用 CGLIB</strong>（AopAutoConfiguration 设置）。这是常见考点。</li>
      </ul>
      <p><strong>6. 通知执行顺序</strong></p>
      <p>@Around(前) → @Before → 业务方法 → @AfterReturning/@AfterThrowing → @After → @Around(后)。@After 无论异常都执行。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>AOP 运行时动态代理实现。JDK 代理基于接口（Proxy.newProxyInstance），CGLIB 基于继承生成子类（不能代理 final）。Spring Framework 有接口默认JDK，Spring Boot 2.0+ 默认 CGLIB。代理在 BeanPostProcessor 的 after 阶段生成。</p>`},
  {c:"Spring",d:"★★★",q:"Spring Bean 的生命周期？",
   a:`<p>简单记就是五个阶段：<strong>实例化 → 属性赋值 → 初始化 → 使用 → 销毁</strong>。</p>
      <p>其中"初始化"这一步最复杂，顺序是：</p>
      <ol>
        <li>调用一系列 Aware 接口（让 Bean 知道自己的名字、容器等）。</li>
        <li>BeanPostProcessor 的 before 方法（@PostConstruct 注解就在这步执行）。</li>
        <li>InitializingBean 的 afterPropertiesSet，或者你自定义的 init-method。</li>
        <li>BeanPostProcessor 的 after 方法（<strong>AOP 就是在这步生成代理对象的</strong>）。</li>
      </ol>
      <blockquote>面试常问：AOP 的代理对象是在生命周期的哪一步生成的？答案是<strong>初始化阶段最后</strong>（BeanPostProcessor 的 postProcessAfterInitialization）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 完整生命周期（核心源码 doCreateBean）</strong></p>
      <ol>
        <li><strong>实例化 instantiate</strong>：createBeanInstance，反射调构造方法。对象已分配内存但属性为空。
          <ul><li>钩子：InstantiationAwareBeanPostProcessor.postProcessBeforeInstantiation（实例化前，可短路返回代理）。</li></ul>
        </li>
        <li><strong>属性赋值 populate</strong>：populateBean，注入 @Autowired/@Value。
          <ul><li>入口：AutowiredAnnotationBeanPostProcessor.postProcessProperties。</li></ul>
        </li>
        <li><strong>初始化 initialize</strong>：initializeBean，严格顺序：
          <ul>
            <li>① <strong>Aware 回调</strong>：BeanNameAware → BeanClassLoaderAware → BeanFactoryAware。（ApplicationContextAware 等通过 ApplicationContextAwareProcessor 在 before 阶段触发）。</li>
            <li>② <strong>BeanPostProcessor.postProcessBeforeInitialization</strong>：@PostConstruct（CommonAnnotationBeanPostProcessor）在此触发。</li>
            <li>③ <strong>InitializingBean.afterPropertiesSet()</strong> → 自定义 init-method。</li>
            <li>④ <strong>BeanPostProcessor.postProcessAfterInitialization</strong>：<strong>⭐ AOP 代理在此生成</strong>（AbstractAutoProxyCreator.wrapIfNecessary）。</li>
          </ul>
        </li>
        <li><strong>使用</strong>：放入 singletonObjects 一级缓存，对外提供服务。</li>
        <li><strong>销毁</strong>：容器 close 时。@PreDestroy → DisposableBean.destroy() → destroy-method。</li>
      </ol>
      <p><strong>2. BeanPostProcessor 的两个回调时机（高频考点）</strong></p>
      <ul>
        <li>postProcessBeforeInitialization：在 afterPropertiesSet/init-method <strong>之前</strong>。@PostConstruct 在此。</li>
        <li>postProcessAfterInitialization：在<strong>之后</strong>，是 <strong>AOP 代理生成的入口</strong>。</li>
      </ul>
      <p><strong>3. 循环依赖与生命周期</strong></p>
      <p>A 实例化后（步骤1完成）就把 ObjectFactory 放入三级缓存；属性注入 B 时，B 注入 A 从三级缓存拿早期 A。AOP 代理也可能在此提前生成（getEarlyBeanReference）。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>五阶段：实例化→属性赋值→初始化→使用→销毁。初始化内：Aware回调→BeanPostProcessor.before(@PostConstruct)→afterPropertiesSet/init-method→BeanPostProcessor.after(AOP代理生成)。BeanPostProcessor的after是AOP入口。</p>`},
  {c:"Spring",d:"★★★",q:"Spring Bean 的作用域有哪些？",
   a:`<ul>
        <li><strong>singleton</strong>（默认）：整个容器里只有一个实例。</li>
        <li><strong>prototype</strong>：每次获取都新建一个。</li>
        <li><strong>request</strong> / <strong>session</strong> / <strong>application</strong>：Web 环境下，分别对应一次请求、一个会话、整个应用。</li>
      </ul>
      <blockquote>有个经典坑：singleton 里面注入 prototype，prototype 只会创建一次（因为注入就发生一次），就失去了"每次新建"的意义。解决办法是用 @Lookup 注解或者 ObjectFactory。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 六种作用域</strong></p>
      <ul>
        <li><strong>singleton（默认）</strong>：整个容器一个实例。无状态 Bean（Service/DAO）用这个。</li>
        <li><strong>prototype</strong>：每次 getBean/注入都新建。有状态 Bean 用。</li>
        <li><strong>request</strong>（Web）：每个 HTTP 请求一个实例。</li>
        <li><strong>session</strong>（Web）：每个 HTTP Session 一个。</li>
        <li><strong>application</strong>（Web）：ServletContext 级别（整个 Web 应用）。</li>
        <li><strong>websocket</strong>（Web 4.3+）：每个 WebSocket 会话一个。</li>
      </ul>
      <p><strong>2. singleton 注入 prototype 的失效问题（经典坑）</strong></p>
      <p>singleton Bean 注入 prototype Bean 时，<strong>依赖注入只发生一次</strong>（singleton 初始化时），所以注入的 prototype 被固定成那一个实例，之后每次访问都是同一个，prototype 的"每次新建"语义失效。</p>
      <p><strong>3. 解决方案</strong></p>
      <ul>
        <li><strong>@Lookup 方法注入（推荐）</strong>：在 singleton 定义抽象方法标 @Lookup，Spring 用 CGLIB 覆盖该方法，每次调用返回新 prototype 实例。限制：方法非 final、类非 final。</li>
        <li><strong>ObjectFactory/Provider</strong>：注入 ObjectFactory&lt;T&gt;，每次 getObject() 获取新实例。</li>
        <li><strong>Scoped Proxy</strong>：@Scope(value="prototype", proxyMode=ScopedProxyMode.TARGET_CLASS)，注入的是代理，方法调用时才取真实实例。</li>
        <li><strong>ApplicationContext.getBean</strong>：直接每次 getBean（耦合容器，不优雅）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>6 种：singleton（默认）、prototype、request/session/application/websocket（Web）。坑：singleton 注入 prototype 失效（注入只一次）。解决：@Lookup 方法注入、ObjectFactory、Scoped Proxy。</p>`},
  {c:"Spring",d:"★★★",q:"Spring 事务的传播行为有哪些？",
   a:`<p>传播行为就是：一个事务方法被另一个事务方法调用时，事务该怎么处理。常用的有三种：</p>
      <ul>
        <li><strong>REQUIRED</strong>（默认）：有事务就加入，没有就新建。</li>
        <li><strong>REQUIRES_NEW</strong>：不管有没有，都新建一个<strong>独立事务</strong>，把当前事务挂起。两个事务互不影响。</li>
        <li><strong>NESTED</strong>：嵌套事务，在当前事务里建一个保存点，子事务回滚不影响外层。</li>
      </ul>
      <p>另外还有 SUPPORTS（有就加入没有就非事务）、NOT_SUPPORTED（不用事务）、MANDATORY（必须有事务否则报错）、NEVER（不能有事务）。</p>
      <blockquote>重点区分 REQUIRES_NEW 和 NESTED：前者是两个独立事务（各回各的），后者是同一个事务里的局部回滚（外层挂了内层也跟着挂）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 传播行为的含义</strong></p>
      <p>当事务方法 A 调用事务方法 B 时，B 的事务如何处理（加入/新建/挂起/嵌套）。Spring 提供了 7 种（在 Propagation 枚举）。</p>
      <p><strong>2. 七种传播行为（外层有/无事务两种情况）</strong></p>
      <ul>
        <li><strong>REQUIRED（默认）</strong>：有则加入，无则新建。最常用。</li>
        <li><strong>REQUIRES_NEW</strong>：无则新建；有则<strong>挂起当前事务，新建独立新事务</strong>。B 独立提交/回滚，不影响 A。</li>
        <li><strong>NESTED</strong>：无则新建；有则在当前事务内建<strong>保存点（savepoint）</strong>。B 回滚到 savepoint，A 可继续；但 A 回滚 B 也回滚（同一物理事务）。</li>
        <li><strong>SUPPORTS</strong>：有则加入，无则非事务执行。</li>
        <li><strong>NOT_SUPPORTED</strong>：有则挂起当前事务，以非事务方式执行 B。</li>
        <li><strong>MANDATORY</strong>：有则加入，无则<strong>抛异常</strong>。</li>
        <li><strong>NEVER</strong>：有则<strong>抛异常</strong>，无则非事务执行。</li>
      </ul>
      <p><strong>3. REQUIRES_NEW vs NESTED（高频追问）</strong></p>
      <ul>
        <li><strong>REQUIRES_NEW</strong>：B 是<strong>全新的独立物理事务</strong>（Connection 不同），A 被挂起。B 提交后 A 恢复。B 提交了即使 A 后续回滚，B 也不回滚。两笔独立事务。</li>
        <li><strong>NESTED</strong>：B 和 A 是<strong>同一物理事务</strong>，B 靠 JDBC savepoint 实现"局部回滚"。B 失败回滚到 savepoint，A 可选择继续或也回滚；但 A 回滚 B 必然回滚（同事务）。依赖数据库支持 savepoint（MySQL 支持）。</li>
      </ul>
      <p><strong>4. 使用场景</strong></p>
      <ul>
        <li>REQUIRED：默认，大部分业务。</li>
        <li>REQUIRES_NEW：日志记录（即使主业务回滚也要记日志）、独立子流程。</li>
        <li>NESTED：部分业务可独立回滚但整体要一致的场景。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>7种：REQUIRED（默认有则加入无则新建）、REQUIRES_NEW（挂起当前新建独立事务）、NESTED（savepoint嵌套，同物理事务局部回滚）、SUPPORTS/NOT_SUPPORTED/MANDATORY/NEVER。重点区分REQUIRES_NEW（独立物理事务）和NESTED（同事务savepoint局部回滚）。</p>`},
  {c:"Spring",d:"★★★",q:"Spring 事务什么时候会失效？",
   a:`<p>常见失效场景：</p>
      <ol>
        <li><strong>方法不是 public</strong>：Spring 默认只给 public 方法加事务。</li>
        <li><strong>自调用</strong>：同一个类里 A 方法调用 B 方法（B 上有 @Transactional），事务失效——因为走的是 this 而不是代理对象。</li>
        <li><strong>异常被 catch 吞掉</strong>：没抛出来事务感知不到。</li>
        <li><strong>异常类型不对</strong>：默认只回滚 RuntimeException 和 Error，其他异常（比如 IOException）默认不回滚。</li>
        <li><strong>对象不是 Spring 管理的</strong>（自己 new 的）。</li>
        <li><strong>数据库引擎不支持事务</strong>（比如 MyISAM）。</li>
      </ol>
      <blockquote>两个最容易答错的点：① 自调用失效的根本原因是 <strong>this 不是代理对象</strong>；② 想让所有异常都回滚，要写 <code>@Transactional(rollbackFor = Exception.class)</code>。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 自调用失效（最经典）</strong></p>
      <p>类内 A 方法调同类 @Transactional 方法 B（this.B()）。调用走的是 <strong>this（目标对象本身），不是代理对象</strong>，TransactionInterceptor 拦截器不触发，事务失效。</p>
      <p><strong>根因</strong>：AOP 代理只拦截"从外部调用"的方法。this.B() 是目标对象内部调用，绕过了代理。</p>
      <p><strong>解决</strong>：① 自我注入 <code>@Autowired @Lazy private XxxService self;</code> 再 self.B()；② AopContext.currentProxy()（需 @EnableAspectJAutoProxy(exposeProxy=true)）；③ 拆到不同类。</p>
      <p><strong>2. 方法非 public</strong></p>
      <p>Spring 默认只对 public 方法创建事务切面（AbstractFallbackTransactionAttributeSource.allowPublicMethodsOnly 默认 true）。private/protected/package 方法事务失效。</p>
      <p><strong>3. rollbackFor 默认值（极易答错）</strong></p>
      <p>@Transactional 默认 <strong>只回滚 RuntimeException 和 Error</strong>，<strong>Checked Exception（如 IOException、SQLException）默认不回滚</strong>。要回滚 checked 必须显式 @Transactional(rollbackFor = Exception.class)。</p>
      <p><strong>4. 异常被 catch 吞掉</strong></p>
      <p>事务靠感知抛出的异常来决定回滚。如果异常在方法内被 catch 没抛出，事务感知不到，不回滚。如需回滚要手动 TransactionAspectSupport.currentTransactionStatus().setRollbackOnly()。</p>
      <p><strong>5. Bean 未被 Spring 管理</strong></p>
      <p>类没加 @Service/@Component，或对象是 new 出来的，没有代理，事务无效。</p>
      <p><strong>6. 数据库引擎不支持事务</strong></p>
      <p>如 MySQL 的 MyISAM 不支持事务，事务配置无效。要用 InnoDB。</p>
      <p><strong>7. 传播行为配错</strong></p>
      <p>如 NOT_SUPPORTED（以非事务执行）、NEVER（有事务抛异常），会导致无事务。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>失效场景：自调用（this非代理，用self注入/AopContext解决）、非public、rollbackFor默认只回滚Runtime+Error（checked要显式配置）、异常被catch、非Spring Bean、MyISAM引擎、传播行为配错。</p>`},
  {c:"Spring",d:"★★",q:"Spring 中的循环依赖是怎么解决的？",
   a:`<p>循环依赖就是 A 依赖 B、B 又依赖 A。Spring 用<strong>三级缓存</strong>来解决（针对单例、setter/字段注入的情况）：</p>
      <ul>
        <li><strong>一级缓存</strong>：存完整的 Bean（创建好的）。</li>
        <li><strong>二级缓存</strong>：存提前暴露的半成品 Bean。</li>
        <li><strong>三级缓存</strong>：存一个工厂（ObjectFactory），用来生成早期引用（如果需要代理就在这里提前生成）。</li>
      </ul>
      <p>流程大概是：A 创建到一半时，把自己的工厂放进三级缓存；然后去注入 B；B 又需要 A，就从三级缓存里拿到 A 的早期引用，B 就能创建完了；最后 A 也完成创建。</p>
      <blockquote>注意：① 只能解决 setter/字段注入的循环依赖，<strong>构造器注入解决不了</strong>（因为对象都还没 new 出来）；② <strong>Spring Boot 2.6 以后默认禁止循环依赖</strong>了，建议重构代码。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三级缓存结构（DefaultSingletonBeanRegistry）</strong></p>
      <table><tr><th>缓存</th><th>类型</th><th>存什么</th></tr>
      <tr><td>一级 singletonObjects</td><td>ConcurrentHashMap</td><td>完整的单例 Bean（生命周期走完）</td></tr>
      <tr><td>二级 earlySingletonObjects</td><td>HashMap</td><td>提前暴露的早期 Bean 引用（可能是代理）</td></tr>
      <tr><td>三级 singletonFactories</td><td>HashMap</td><td><strong>ObjectFactory&lt;?&gt;（Lambda）</strong>，调用 getObject 触发 getEarlyBeanReference</td></tr></table>
      <p><strong>2. 解决流程（A 依赖 B，B 依赖 A）</strong></p>
      <ol>
        <li>创建 A：createBeanInstance 实例化 A（构造完，半成品）。</li>
        <li>addSingletonFactory(A, () -&gt; getEarlyBeanReference(A))：把 A 的 ObjectFactory 放入<strong>三级缓存</strong>。</li>
        <li>populateBean(A) 属性注入：A 需要 B，去创建 B。</li>
        <li>创建 B：实例化 B，addSingletonFactory(B) 放三级缓存。</li>
        <li>populateBean(B)：B 需要 A，调 getSingleton(A)：
          <ul>
            <li>一级缓存没有 → 二级缓存没有 → 三级缓存有 A 的 ObjectFactory。</li>
            <li>调用 ObjectFactory.getObject() → getEarlyBeanReference：<strong>若有 AOP 则提前生成 A 的代理对象</strong>。</li>
            <li>结果放入二级缓存（earlySingletonObjects），三级缓存移除。</li>
          </ul>
        </li>
        <li>B 拿到 A 的早期引用，B 完成，放入一级缓存。</li>
        <li>A 的 populateBean 完成（注入了 B），A 继续初始化，完成后放入一级缓存。</li>
      </ol>
      <p><strong>3. 为什么是三级不是两级</strong></p>
      <p>为了 <strong>AOP 代理</strong>。两级缓存无法兼顾"按需代理"和"代理唯一性"：</p>
      <ul>
        <li>三级缓存存 ObjectFactory（工厂），只在<strong>真正被循环依赖引用时</strong>才调用工厂生成代理（延迟代理）。</li>
        <li>二级缓存缓存这个早期代理，保证<strong>多次获取都是同一个代理</strong>（不会因多次调用工厂产生多个代理）。</li>
        <li>如果没有 AOP，两级够用；有 AOP 必须三级。</li>
      </ul>
      <p><strong>4. 局限：构造器注入无法解决</strong></p>
      <p>构造器注入时，A 构造需要 B，B 构造需要 A，两者都无法先完成实例化，ObjectFactory 无从放入缓存，死锁。Spring 抛 BeanCurrentlyInCreationException。解决：@Lazy（注入代理）或重构。</p>
      <p><strong>5. Spring Boot 2.6+ 默认禁止</strong></p>
      <p>spring.main.allow-circular-references 默认 false，有循环依赖启动报错。Spring Framework 仍默认允许。鼓励重构消除循环依赖。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>三级缓存：一级完整Bean、二级早期引用、三级ObjectFactory工厂。流程：A实例化后放三级→注入B→B注入A时从三级调工厂(getEarlyBeanReference，有AOP提前生成代理)放入二级→B完成→A完成。三级非两级是为AOP延迟代理+保证代理唯一。构造器注入无解。SB2.6默认禁止。</p>`},
  {c:"Spring",d:"★★",q:"Spring Boot 的自动配置原理？",
   a:`<p>核心链路：<code>@SpringBootApplication</code> 里有个 <code>@EnableAutoConfiguration</code>，它会导入一个选择器，去读取 jar 包里的配置文件，加载一堆"自动配置类"，然后根据 <code>@Conditional</code> 注解判断哪些配置该生效，生效的就往容器里注册 Bean。</p>
      <p>说白了就是"约定大于配置"：你引入了什么 starter（比如 spring-boot-starter-web），Spring Boot 就自动给你配好相关的 Bean，你只需要改改 application.yml 就能调整默认行为。</p>
      <blockquote>一个小知识点：自动配置的注册文件，2.7 之前是 spring.factories，2.7 之后新增了 AutoConfiguration.imports 文件，3.0 彻底只用新文件了。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心链路</strong></p>
      <p>@SpringBootApplication 包含 @EnableAutoConfiguration，后者 @Import(AutoConfigurationImportSelector.class)。这个 Selector 在容器启动时加载自动配置类。</p>
      <p><strong>2. AutoConfigurationImportSelector 流程</strong></p>
      <ol>
        <li>调用 SpringFactoriesLoader.loadFactoryNames（2.6-）或 ImportCandidates.load（2.7+）读取自动配置类的全限定名。</li>
        <li>对每个候选类，用 @Conditional 系列注解判断是否生效。</li>
        <li>生效的配置类通过 @Bean 方法注册 Bean 到容器。</li>
      </ol>
      <p><strong>3. 配置文件的版本演进（高频考点）</strong></p>
      <table><tr><th>版本</th><th>注册文件</th></tr>
      <tr><td>&lt; 2.7</td><td>META-INF/spring.factories，键 EnableAutoConfiguration=类名列表</td></tr>
      <tr><td>2.7 ~ 3.0</td><td>新增 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports（每行一个类名），新旧并存，优先新文件</td></tr>
      <tr><td>≥ 3.0</td><td>彻底移除 spring.factories 中的自动配置项，只认 imports 文件</td></tr></table>
      <p>注意：spring.factories 的其他类型（ApplicationListener、ApplicationContextInitializer）仍保留，只是 EnableAutoConfiguration 这个 key 迁走了。</p>
      <p><strong>4. @Conditional 系列（决定是否生效）</strong></p>
      <ul>
        <li>@ConditionalOnClass：类路径存在指定类才生效。</li>
        <li><strong>@ConditionalOnMissingBean（核心）</strong>：容器无指定 Bean 才生效——让用户配置覆盖默认。</li>
        <li>@ConditionalOnProperty：配置项满足条件（prefix、havingValue）。</li>
        <li>@ConditionalOnBean / @ConditionalOnMissingClass / @ConditionalOnWebApplication。</li>
      </ul>
      <p><strong>5. 为什么迁移</strong></p>
      <p>① spring.factories 与 GraalVM Native Image 不兼容；② 性能（新机制启动快、内存小）；③ 职责清晰（Spring Boot Issue #29872）。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>@SpringBootApplication→@EnableAutoConfiguration→@Import(AutoConfigurationImportSelector)→读取配置文件加载自动配置类→@Conditional判断生效。文件：2.7前spring.factories，2.7+新增AutoConfiguration.imports，3.0只用新文件。@ConditionalOnMissingBean让用户覆盖默认。</p>`},
  {c:"Spring",d:"★★",q:"Spring Boot 启动流程？",
   a:`<p>大致流程：<code>SpringApplication.run()</code> 启动后：</p>
      <ol>
        <li>创建 SpringApplication 对象，判断应用类型（Servlet/响应式/普通），加载一些初始化器和监听器。</li>
        <li>准备运行环境，加载 application.yml/properties 配置。</li>
        <li>创建 ApplicationContext 容器。</li>
        <li><strong>refresh 容器（最核心）</strong>：执行自动配置、实例化所有 Bean、启动内嵌的 Tomcat。</li>
        <li>发布启动完成事件，执行 ApplicationRunner、CommandLineRunner。</li>
      </ol>
      <blockquote>一个细节：内嵌 Tomcat 是在 refresh 过程中启动的，而且<strong>比业务 Bean 实例化还早</strong>（Web 服务器先就绪，业务 Bean 后创建）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. new SpringApplication() 构造阶段</strong></p>
      <ul>
        <li>deduceFromClasspath：推断应用类型（SERVLET/REACTIVE/NONE，看 classpath 有无相关类）。</li>
        <li>从 spring.factories 加载 ApplicationContextInitializer、ApplicationListener。</li>
        <li>deduceMainApplicationClass：推断主类（找 main 方法所在类）。</li>
      </ul>
      <p><strong>2. run() 流程</strong></p>
      <ol>
        <li>获取 SpringApplicationRunListener（从 spring.factories，默认 EventPublishingRunListener），触发 starting 事件。</li>
        <li>prepareEnvironment：创建 Environment，加载 application.yml/properties、命令行参数、环境变量；触发 environmentPrepared。</li>
        <li>打印 Banner。</li>
        <li>createApplicationContext：按应用类型创建（Servlet 用 AnnotationConfigServletWebServerApplicationContext）。</li>
        <li>prepareContext：设置 Environment、执行 ApplicationContextInitializer、注册主类（@SpringBootApplication 标的类）、触发 contextLoaded。</li>
        <li><strong>refreshContext（核心）</strong>：调用 AbstractApplicationContext.refresh()。</li>
        <li>afterRefresh：空钩子。</li>
        <li>callRunners：调用 ApplicationRunner 和 CommandLineRunner（按 @Order）。</li>
        <li>发布 ApplicationReadyEvent，打印启动耗时。</li>
      </ol>
      <p><strong>3. refresh() 核心步骤</strong></p>
      <ul>
        <li>prepareBeanFactory、postProcessBeanFactory。</li>
        <li>invokeBeanFactoryPostProcessors：<strong>执行自动配置</strong>（加载 AutoConfiguration）。</li>
        <li>registerBeanPostProcessors：注册 BeanPostProcessor（含 AOP 代理生成器）。</li>
        <li><strong>onRefresh</strong>：ServletWebServerApplicationContext 重写，createWebServer → 创建并初始化内嵌 Tomcat。</li>
        <li><strong>finishBeanFactoryInitialization</strong>：实例化所有非懒加载 singleton Bean（最耗时）。</li>
        <li>finishRefresh：Tomcat.start 真正监听端口，发布 ContextRefreshedEvent。</li>
      </ul>
      <p><strong>4. Tomcat 启动时机（易错点）</strong></p>
      <p>Tomcat 在 <strong>onRefresh</strong> 创建并初始化，<strong>早于</strong> finishBeanFactoryInitialization（业务 Bean 实例化）。即 Web 服务器先就绪，业务 Bean 后创建。真正端口监听在 finishRefresh。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>new SpringApplication（推断类型、加载Initializer/Listener）→ run：准备Environment加载配置→创建Context→prepareContext注册主类→refreshContext（核心：自动配置+Tomcat onRefresh启动+Bean实例化finishBeanFactoryInitialization）→ApplicationRunner。Tomcat在onRefresh启动，早于业务Bean。</p>`},
  {c:"Spring",d:"★★",q:"Spring MVC 的请求处理流程？",
   a:`<p>一个请求过来，全由 <strong>DispatcherServlet</strong>（前端控制器）统一接管，流程是：</p>
      <ol>
        <li>请求到达 DispatcherServlet。</li>
        <li>DispatcherServlet 调 <strong>HandlerMapping</strong>，根据 URL 找到对应的 Controller 方法（和拦截器）。</li>
        <li>调 <strong>HandlerAdapter</strong> 去执行这个 Controller 方法。</li>
        <li>Controller 返回结果。如果是前后端分离（@ResponseBody），直接把数据转成 JSON 返回；如果是页面，就走 ViewResolver 解析视图再渲染。</li>
      </ol>
      <blockquote>为什么要有 HandlerAdapter？因为 Controller 的写法有好几种（注解、接口、HttpRequestHandler），DispatcherServlet 没法统一调用，就用适配器模式包一层。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 完整流程（DispatcherServlet.doDispatch）</strong></p>
      <ol>
        <li>请求 → DispatcherServlet（前端控制器，所有请求入口）。</li>
        <li>DispatcherServlet → MultipartResolver：判断是否文件上传（是则包装成 MultipartHttpServletRequest）。</li>
        <li>DispatcherServlet → <strong>HandlerMapping</strong>：根据 URL 找到 Handler，返回 HandlerExecutionChain（Handler + 拦截器链）。常见实现 RequestMappingHandlerMapping。</li>
        <li>DispatcherServlet → <strong>HandlerAdapter</strong>：适配器模式包装执行（因 Handler 类型多样：@RequestMapping 方法、HttpRequestHandler、Controller 接口）。RequestMappingHandlerAdapter 是注解版。</li>
        <li><strong>拦截器 preHandle</strong> → 执行 Controller 方法 → <strong>拦截器 postHandle</strong>。</li>
        <li>（异常）DispatcherServlet → HandlerExceptionResolver 解析异常。</li>
        <li>Controller 返回 ModelAndView（前后端分离 @ResponseBody 走 RequestResponseBodyMethodProcessor，直接写响应体，跳过 ViewResolver）。</li>
        <li>（页面）ViewResolver 解析视图名 → View 渲染。</li>
        <li><strong>拦截器 afterCompletion</strong> → 返回响应。</li>
      </ol>
      <p><strong>2. 为什么需要 HandlerAdapter</strong></p>
      <p>Handler 有多种形式（注解方法、实现 Controller 接口、HttpRequestHandler），DispatcherServlet 无法用统一方式调用它们。用适配器模式，每种 Handler 对应一个 Adapter，DispatcherServlet 只调 Adapter.handle()。</p>
      <p><strong>3. 九大组件（DispatcherServlet.initStrategies/onRefresh 初始化）</strong></p>
      <p>MultipartResolver、LocaleResolver、ThemeResolver、HandlerMapping、HandlerAdapter、HandlerExceptionResolver、RequestToViewNameTranslator、ViewResolver、FlashMapManager。</p>
      <p><strong>4. @ResponseBody 的处理</strong></p>
      <p>方法标 @ResponseBody 时，HandlerAdapter 用 RequestResponseBodyMethodProcessor，通过 HttpMessageConverter（如 MappingJackson2HttpMessageConverter）把返回对象序列化成 JSON 写入响应。不走 ViewResolver。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>请求→DispatcherServlet→HandlerMapping找Handler(返回执行链含拦截器)→HandlerAdapter执行(preHandle→Controller→postHandle)→返回ModelAndView→(@ResponseBody则HttpMessageConverter直接写JSON/否则ViewResolver渲染)→afterCompletion。HandlerAdapter用适配器模式统一不同Handler。九大组件。</p>`},

  {c:"MySQL",d:"★★★",q:"MySQL 索引的底层数据结构为什么是 B+ 树？",
   a:`<p>对比几种结构的不足：</p>
      <ul>
        <li>二叉树/BST：可能退化成链表。</li>
        <li>红黑树：高度仍然太高（数据多时）。</li>
        <li>Hash：等值查询 O(1) 快，但不支持范围查询、排序。</li>
        <li>B 树：每个节点都存数据，单节点能存的关键字少，树更高。</li>
      </ul>
      <p><strong>B+ 树优势</strong>：</p>
      <ul>
        <li>非叶子节点只存索引不存数据 → 单页能存更多关键字 → 树更矮（3 层可存千万级）→ 磁盘 IO 少。</li>
        <li>所有数据都在叶子节点，且<strong>叶子节点形成有序双向链表</strong> → 范围查询和排序极快。</li>
        <li>查询性能稳定（都必须到叶子节点）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么不用其他数据结构</strong></p>
      <ul>
        <li><strong>二叉搜索树 BST</strong>：极端情况退化成链表，O(n)。</li>
        <li><strong>AVL/红黑树</strong>：自平衡，但二叉树高度太高。存 1000 万数据高度约 23 层，每次查询 23 次磁盘 IO，太慢。</li>
        <li><strong>Hash 表</strong>：等值查询 O(1) 极快（Memory 引擎用），但<strong>不支持范围查询、排序、最左前缀</strong>。MySQL 有自适应哈希索引（AHI）作为补充。</li>
        <li><strong>B 树</strong>：每个节点（含非叶子）都存数据，单页（16KB）能存的关键字少，树更高。</li>
      </ul>
      <p><strong>2. B+ 树的设计（核心优势）</strong></p>
      <ul>
        <li><strong>非叶子节点只存索引（键值+指针），不存数据</strong>：一个 16KB 的页能存上千个键值（如索引是 bigint 8字节+指针6字节 ≈ 14字节，16384/14≈1170 个）。所以 3 层 B+ 树能存 1170×1170×16 ≈ 2000 万行，查询只需 3 次磁盘 IO。</li>
        <li><strong>数据都在叶子节点，且叶子形成有序双向链表</strong>：范围查询（where id between 10 and 100）和排序（order by）只需定位起点，沿链表遍历即可，极快。</li>
        <li><strong>查询性能稳定</strong>：任何查询都要走到叶子节点，时间复杂度稳定 O(logN)，不像 B 树（数据可能在上层，快慢不一）。</li>
      </ul>
      <p><strong>3. InnoDB 的页</strong></p>
      <p>InnoDB 以<strong>页（page，16KB）</strong>为单位管理存储，B+ 树的一个节点就是一个页。页是磁盘 IO 的最小单位（一次读一页）。</p>
      <p><strong>4. 一个 B+ 树能存多少行</strong></p>
      <p>非叶子节点能存约 1170 个键，叶子节点一个页存约 16 行（单行 1KB）。3 层：1170×1170×16 ≈ 2189 万行。所以"3 层 B+ 树存千万级数据"就是这么算的。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>不用二叉树（高）、Hash（不支持范围）、B 树（节点存数据导致矮度有限）。B+ 树：非叶子只存索引（单页上千键，3层存千万级）、数据在叶子且成双向链表（范围查询快）、查询稳定 O(logN)。</p>`},
  {c:"MySQL",d:"★★★",q:"聚簇索引和非聚簇索引（二级索引）的区别？回表是什么？",
   a:`<p><strong>聚簇索引</strong>：叶子节点存的是<strong>完整数据行</strong>。InnoDB 的主键索引就是聚簇索引。一张表只有一个。</p>
      <p><strong>非聚簇索引（二级索引）</strong>：叶子节点存的是索引列值 + 主键值。可以有多个。</p>
      <p><strong>回表</strong>：通过二级索引查到主键，再用主键去聚簇索引查完整数据，需要两次 B+ 树查找。</p>
      <blockquote>避免回表：<strong>覆盖索引</strong>——查询字段都在二级索引中，直接返回，不用回表。</blockquote>
      <p>MyISAM 是非聚簇的（数据和索引分离）；InnoDB 必须有主键（没显式定义则选唯一非空索引，再没有就生成隐藏 6 字节 ROWID）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 聚簇索引（Clustered Index）</strong></p>
      <p>叶子节点直接存<strong>完整的数据行</strong>，索引和数据物理上在一起（聚簇）。一张表只能有一个聚簇索引。InnoDB 的<strong>主键索引就是聚簇索引</strong>。</p>
      <p>聚簇索引的选择规则：① 显式 PRIMARY KEY；② 第一个非空唯一索引；③ 隐藏的 6 字节 ROWID（GEN_CLUST_INDEX）。所以 InnoDB 表"必须"有主键（没有的话也隐式生成）。</p>
      <p><strong>2. 二级索引 / 非聚簇索引（Secondary Index）</strong></p>
      <p>叶子节点存<strong>索引列的值 + 对应的主键值</strong>（不存完整数据）。一张表可以有多个二级索引。如给 name 建索引，叶子存 (name, id)。</p>
      <p><strong>3. 回表（Table Lookup）</strong></p>
      <p>通过二级索引查询时：① 先在二级索引 B+ 树找到 name 对应的主键 id；② 再用 id 去聚簇索引 B+ 树查完整数据行。<strong>两次 B+ 树查找</strong>，这就是回表。</p>
      <p>查询 <code>select * from user where name='张三'</code>（name 有二级索引）：回表。</p>
      <p><strong>4. 覆盖索引（避免回表）</strong></p>
      <p>如果查询的字段都在二级索引里，就不用回表。如 <code>select id, name from user where name='张三'</code>，id 和 name 都在 name 索引的叶子节点，直接返回。EXPLAIN 的 Extra 显示 <strong>Using index</strong>。</p>
      <p><strong>5. InnoDB vs MyISAM</strong></p>
      <ul>
        <li>InnoDB：主键索引是聚簇的（数据和主键索引在一起），二级索引存主键。</li>
        <li>MyISAM：<strong>非聚簇</strong>，数据和所有索引分离，索引叶子存数据的物理地址（行指针）。</li>
      </ul>
      <p><strong>6. 为什么建议用自增主键</strong></p>
      <p>聚簇索引按主键顺序存数据。自增主键插入时数据追加到末尾，顺序写，快。UUID 主键无序，插入要在中间找位置，导致<strong>页分裂</strong>（数据搬运），慢且碎片多。自增主键还更省空间（int 4 字节 vs UUID 36 字节，二级索引存主键，主键越长二级索引越大）。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>聚簇索引叶子存完整数据（InnoDB 主键索引），一张表一个；二级索引叶子存主键值，查非索引字段要回表（用主键查聚簇索引）。覆盖索引避免回表。InnoDB 聚簇、MyISAM 非聚簇。建议自增主键（顺序写、省空间、避免页分裂）。</p>`},
  {c:"MySQL",d:"★★★",q:"索引失效的常见场景有哪些？",
   a:`<ol>
        <li><strong>对索引列做函数/运算</strong>：where year(create_time) 或 where id+1=5。</li>
        <li><strong>隐式类型转换</strong>：字段是 varchar，where phone=13800000000（数字）。</li>
        <li><strong>最左前缀不满足</strong>：联合索引 (a,b,c)，没用 a 直接用 b/c。</li>
        <li><strong>范围查询右边失效</strong>：(a,b,c) 中 a 用范围，b/c 失效。</li>
        <li><strong>like 以 % 开头</strong>：like '%abc'。'abc%' 可以用索引。</li>
        <li><strong>or 两边不全有索引</strong>（全表扫描更优时）。</li>
        <li><strong>!=、not in、is not null</strong>（视数据分布，优化器判断）。</li>
      </ol>
      <blockquote>用 EXPLAIN 看 type 和 key 字段判断是否走索引。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 对索引列做函数或运算</strong></p>
      <p>B+ 树是按原始列值排序的，函数/运算后值变了，索引失效。</p>
      <ul>
        <li><code>where YEAR(create_time)='2023'</code> ❌ → 改 <code>where create_time &gt;= '2023-01-01' and create_time &lt; '2024-01-01'</code> ✅</li>
        <li><code>where id+1=5</code> ❌ → <code>where id=4</code> ✅</li>
        <li><code>where left(name,3)='abc'</code> ❌</li>
      </ul>
      <p><strong>2. 隐式类型转换</strong></p>
      <p>字段是 varchar，查询传数字：MySQL 会把字段转成数字比较（相当于加了函数），索引失效。</p>
      <p><code>where phone=13800000000</code>（phone 是 varchar）❌ → <code>where phone='13800000000'</code> ✅</p>
      <p><strong>3. 联合索引不满足最左前缀</strong></p>
      <p>联合索引 (a,b,c) 按顺序建立。查询必须从 a 开始，跳过 a 直接用 b/c 失效。</p>
      <p><code>where b=1 and c=2</code> ❌（没用 a）。MySQL 8.0 有索引跳跃扫描优化部分场景。</p>
      <p><strong>4. 范围查询导致右边失效</strong></p>
      <p>范围查询后的列无法用索引（B+ 树在该范围无序）。索引 (a,b,c)，<code>where a&gt;1 and b=2</code>，a 用范围后 b 失效。把范围列放最后。</p>
      <p><strong>5. like 以 % 开头</strong></p>
      <p>B+ 树按字符串前缀排序。'abc%' 能用（前缀确定）；'%abc' 或 '%abc%' 不能用（前缀不确定）。</p>
      <p><strong>6. or 连接的条件</strong></p>
      <p>or 两边必须都有索引才会用索引，否则全表扫描。<code>where a=1 or b=2</code>，如果 b 没索引，整个走全表。</p>
      <p><strong>7. !=、&lt;&gt;、not in、is not null</strong></p>
      <p>这些"否定"条件，优化器评估全表扫描成本可能更低，可能不用索引（取决于数据分布）。一般 distinct 值少的列（如性别）这种情况肯定全表。</p>
      <p><strong>8. 优化器评估全表更快</strong></p>
      <p>如果查询要返回大部分数据（如 where id &gt; 1 返回 90% 行），优化器判断全表扫描比回表快，就不用索引。</p>
      <p><strong>9. EXPLAIN 验证</strong></p>
      <p>看 type（是否是 ref/range/const）、key（实际索引）、rows（扫描行数）、Extra（Using index 好，Using filesort/temporary 需优化）。</p>
      <p><strong>10. 面试标准答法</strong></p>
      <p>失效场景：索引列加函数/运算、隐式类型转换、不满足最左前缀、范围查询右边失效、like '%xx'、or 一边没索引、!=/not in（视分布）。用 EXPLAIN 的 type/key/Extra 判断。</p>`},
  {c:"MySQL",d:"★★★",q:"MySQL 事务的 ACID 特性？隔离级别？",
   a:`<p><strong>ACID</strong>：原子性 Atomicity、一致性 Consistency、隔离性 Isolation、持久性 Durability。</p>
      <p><strong>并发问题</strong>：脏读（读到未提交）、不可重复读（同一事务两次读不一致，针对 update）、幻读（针对 insert/delete）。</p>
      <p><strong>四种隔离级别</strong>（从低到高）：</p>
      <ul>
        <li>读未提交（Read Uncommitted）：啥问题都有。</li>
        <li><strong>读已提交（Read Committed）</strong>：解决脏读。Oracle/SQL Server 默认。</li>
        <li><strong>可重复读（Repeatable Read）</strong>：解决脏读、不可重复读。<strong>MySQL 默认</strong>。</li>
        <li>串行化（Serializable）：解决所有问题，性能差。</li>
      </ul>
      <blockquote>MySQL 在 RR 级别下用<strong>临键锁（next-key lock）</strong>解决了幻读（标准 RR 不解决幻读）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ACID 四大特性</strong></p>
      <ul>
        <li><strong>原子性 Atomicity</strong>：事务内操作要么全成功要么全失败回滚。靠 undo log 实现。</li>
        <li><strong>一致性 Consistency</strong>：事务前后数据合法一致（如转账总金额不变）。是最终目标，由 AID 保证。</li>
        <li><strong>隔离性 Isolation</strong>：并发事务互不干扰。靠锁 + MVCC 实现。</li>
        <li><strong>持久性 Durability</strong>：事务提交后永久保存，宕机不丢。靠 redo log 实现。</li>
      </ul>
      <p><strong>2. 并发事务的问题</strong></p>
      <ul>
        <li><strong>脏读 Dirty Read</strong>：读到其他事务<strong>未提交</strong>的修改（对方回滚后你读到的是脏数据）。</li>
        <li><strong>不可重复读 Non-Repeatable Read</strong>：同一事务两次读同一行，结果不同（其他事务 UPDATE 提交了）。针对<strong>修改</strong>。</li>
        <li><strong>幻读 Phantom Read</strong>：同一事务两次范围查询，行数不同（其他事务 INSERT/DELETE 了）。针对<strong>新增/删除</strong>。</li>
      </ul>
      <p>区别：不可重复读侧重单行被改，幻读侧重行数变化（INSERT/DELETE）。</p>
      <p><strong>3. 四种隔离级别</strong></p>
      <ul>
        <li><strong>读未提交 READ UNCOMMITTED</strong>：脏读、不可重复读、幻读都有。基本不用。</li>
        <li><strong>读已提交 READ COMMITTED（RC）</strong>：解决脏读。Oracle/SQL Server 默认。</li>
        <li><strong>可重复读 REPEATABLE READ（RR）</strong>：解决脏读、不可重复读。<strong>MySQL 默认</strong>。</li>
        <li><strong>串行化 SERIALIZABLE</strong>：解决所有，但所有事务串行，性能差。</li>
      </ul>
      <p>隔离级别越高，一致性越强但并发越低。</p>
      <p><strong>4. MySQL 的特别之处</strong></p>
      <p>标准 SQL 的 RR 不解决幻读，但 <strong>MySQL 的 RR 用临键锁（next-key lock）+ MVCC 解决了幻读</strong>（当前读加间隙锁防插入，快照读用 MVCC）。这是 MySQL 比标准更严格的地方。</p>
      <p><strong>5. 查看和设置隔离级别</strong></p>
      <pre><code>SELECT @@transaction_isolation;  -- 查看
SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;  -- 设置</code></pre>
      <p><strong>6. 面试标准答法</strong></p>
      <p>ACID：原子性（undo log 回滚）、一致性（目标）、隔离性（锁+MVCC）、持久性（redo log）。并发问题：脏读、不可重复读（UPDATE）、幻读（INSERT）。四级别：读未提交、RC（解脏读）、RR（MySQL默认，解不可重复读，并用间隙锁解幻读）、串行化。</p>`},
  {c:"MySQL",d:"★★★",q:"MySQL 的 MVCC（多版本并发控制）原理？",
   a:`<p>MVCC 让读不加锁也能保证一致性，提升并发。基于<strong>隐藏字段 + Undo Log 版本链 + ReadView</strong>。</p>
      <p><strong>每行隐藏字段</strong>：DB_TRX_ID（最近修改的事务ID）、DB_ROLL_PTR（指向 undo log 的指针）。</p>
      <p><strong>版本链</strong>：每次修改生成一条 undo log，串成链表（旧版本）。</p>
      <p><strong>ReadView</strong>：事务发起查询时生成，含当前活跃事务列表。可见性判断规则：</p>
      <ul>
        <li>行的 trx_id &lt; 最小活跃事务 → 可见。</li>
        <li>trx_id 在活跃列表中 → 不可见，顺链找下一版本。</li>
        <li>trx_id &gt; 最大事务 → 不可见。</li>
      </ul>
      <blockquote>RC 级别每次 select 都生成新 ReadView（所以能读到最新提交）；RR 级别第一次 select 生成后复用（所以可重复读）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. MVCC 是什么</strong></p>
      <p>Multi-Version Concurrency Control，多版本并发控制。让<strong>读不加锁</strong>也能保证一致性视图，读写不冲突，提升并发性能。用于 RC 和 RR 隔离级别的<strong>快照读</strong>（普通 select）。</p>
      <p><strong>2. 三大组件</strong></p>
      <ul>
        <li><strong>隐藏字段</strong>（每行 InnoDB 自动加）：
          <ul>
            <li><strong>DB_TRX_ID（6字节）</strong>：最近修改/插入该行的事务 ID。</li>
            <li><strong>DB_ROLL_PTR（7字节）</strong>：回滚指针，指向 undo log 中该行的上一版本。</li>
            <li>DB_ROW_ID（6字节）：隐藏主键（无主键时）。</li>
          </ul>
        </li>
        <li><strong>Undo Log 版本链</strong>：每次 UPDATE/DELETE 生成一条 undo log（记录修改前的值），用 DB_ROLL_PTR 串成链表，形成<strong>历史版本链</strong>。</li>
        <li><strong>ReadView（读视图）</strong>：事务执行快照读时生成的"一致性视图快照"，包含：
          <ul>
            <li>m_ids：生成时当前活跃（未提交）事务 ID 列表。</li>
            <li>min_trx_id：m_ids 中最小值。</li>
            <li>max_trx_id：下一个要分配的事务 ID。</li>
            <li>creator_trx_id：创建 ReadView 的事务 ID。</li>
          </ul>
        </li>
      </ul>
      <p><strong>3. 可见性判断规则</strong></p>
      <p>对一行的 DB_TRX_ID 判断：</p>
      <ul>
        <li><strong>trx_id == creator_trx_id</strong>：自己改的，可见。</li>
        <li><strong>trx_id &lt; min_trx_id</strong>：修改在 ReadView 前已提交，可见。</li>
        <li><strong>trx_id &gt;= max_trx_id</strong>：ReadView 之后才开始的事务，不可见。</li>
        <li><strong>trx_id 在 m_ids 中</strong>：修改事务还未提交，不可见，顺 DB_ROLL_PTR 找上一版本继续判断。</li>
        <li><strong>trx_id 不在 m_ids 中但 &lt; max</strong>：已提交，可见。</li>
      </ul>
      <p><strong>4. RC vs RR 的区别（核心）</strong></p>
      <ul>
        <li><strong>RC（读已提交）</strong>：每次 select 都生成<strong>新的 ReadView</strong>，所以能读到最新提交的数据（不可重复读）。</li>
        <li><strong>RR（可重复读）</strong>：事务第一次 select 时生成 ReadView，<strong>整个事务复用</strong>，所以多次读结果一致（可重复读）。</li>
      </ul>
      <p>这就是 RR 可重复读的原理——同一 ReadView 看到的是同一快照。</p>
      <p><strong>5. 当前读 vs 快照读</strong></p>
      <ul>
        <li><strong>快照读</strong>：普通 select，读 MVCC 版本，不加锁。</li>
        <li><strong>当前读</strong>：select for update、update、delete 等，读最新数据并加锁。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>MVCC 基于隐藏字段（trx_id、roll_ptr）+ undo log 版本链 + ReadView。读时用 ReadView 判断版本可见性。RC 每次 select 新 ReadView（读最新），RR 复用第一次的 ReadView（可重复读）。只用于快照读，当前读加锁。</p>`},
  {c:"MySQL",d:"★★★",q:"MySQL 的锁有哪些？",
   a:`<p>按粒度：</p>
      <ul>
        <li><strong>全局锁</strong>：FTWRL，整个库只读。备份用。</li>
        <li><strong>表锁</strong>：lock tables / 元数据锁 MDL / 意向锁（IS/IX，行锁前先加表级意向）。</li>
        <li><strong>行锁</strong>：InnoDB 独有。
          <ul>
            <li>记录锁 Record Lock：锁单行。</li>
            <li>间隙锁 Gap Lock：锁区间，防幻读（RR 级别）。</li>
            <li>临键锁 Next-Key Lock：记录锁+间隙锁，左开右闭。</li>
          </ul>
        </li>
      </ul>
      <p>按类型：共享锁 S（读锁 lock in share mode）、排他锁 X（写锁 for update）。</p>
      <blockquote>重要：InnoDB 行锁锁的是<strong>索引</strong>，不是数据本身！没有走索引的更新会升级为表锁。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 按粒度分</strong></p>
      <p><strong>全局锁</strong>：FLUSH TABLES WITH READ LOCK，整个数据库只读。用于一致性备份（mysqldump --single-transaction 用事务替代）。</p>
      <p><strong>表级锁</strong>：</p>
      <ul>
        <li><strong>表锁</strong>：lock tables read/write。粒度大，并发低，少用。</li>
        <li><strong>元数据锁 MDL（Metadata Lock）</strong>：防止 DDL 和 DML 冲突。事务中访问表自动加 MDL 读锁，修改表结构加 MDL 写锁。</li>
        <li><strong>意向锁 IS/IX（Intention Shared/Exclusive）</strong>：行锁前先加表级意向锁，目的是<strong>快速判断表里有没有行锁</strong>，避免逐行检查。如要加表锁时，看有意向锁就知道有事务在用行，不用扫所有行。</li>
        <li><strong>AUTO-INC 锁</strong>：自增列分配用的，保证自增连续。</li>
      </ul>
      <p><strong>行级锁（InnoDB 独有）</strong>：</p>
      <ul>
        <li><strong>记录锁 Record Lock</strong>：锁住索引上的<strong>单条记录</strong>。</li>
        <li><strong>间隙锁 Gap Lock</strong>：锁住索引记录间的<strong>间隙</strong>（如锁 (10,20) 区间），防止其他事务在此插入。只在 RR 级别，解决幻读。</li>
        <li><strong>临键锁 Next-Key Lock</strong>：Record Lock + Gap Lock，锁住<strong>记录 + 记录前面的间隙</strong>（左开右闭 (10,20]）。InnoDB 在 RR 下默认用这个。</li>
        <li><strong>插入意向锁</strong>：INSERT 前加，表示想在某个间隙插入，互相不冲突（不同位置）。</li>
      </ul>
      <p><strong>2. 按类型分（兼容性）</strong></p>
      <ul>
        <li><strong>共享锁 S（读锁）</strong>：select ... lock in share mode。多个 S 兼容。</li>
        <li><strong>排他锁 X（写锁）</strong>：select ... for update、update/delete/insert。X 与任何锁互斥。</li>
      </ul>
      <p>S-S 兼容，S-X/X-X 互斥。</p>
      <p><strong>3. 关键：行锁锁的是索引</strong></p>
      <p>InnoDB 的行锁是<strong>加在索引上的</strong>，不是数据行本身！如果 update/delete 没走索引（全表扫描），会对每行加锁，相当于<strong>表锁</strong>。所以 update/delete 必须走索引。</p>
      <p><strong>4. 死锁</strong></p>
      <p>两个事务互相持有对方需要的锁。如 T1 锁 A 等 B，T2 锁 B 等 A。InnoDB 有<strong>死锁检测</strong>（innodb_deadlock_detect 默认开），回滚代价小的事务。也可设 innodb_lock_wait_timeout 超时。</p>
      <p><strong>5. 查看锁</strong></p>
      <p>information_schema.INNODB_TRX（事务）、INNODB_LOCKS（锁）、INNODB_LOCK_WAITS（等待）。SHOW ENGINE INNODB STATUS 看死锁日志。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>粒度：全局（FTWRL）、表（lock/MDL/意向锁IS-IX）、行（Record记录锁、Gap间隙锁、Next-Key临键锁=记录+间隙）。类型：S共享读锁、X排他写锁。重点：行锁加在索引上，不走索引变表锁。RR 用 next-key 防幻读。</p>`},
  {c:"MySQL",d:"★★",q:"redo log、undo log、binlog 的区别？",
   a:`<ul>
        <li><strong>redo log</strong>（InnoDB 引擎层）：记录"数据页的物理修改"，保证<strong>持久性</strong>（crash recovery）。WAL 机制，先写日志再写磁盘。循环写。</li>
        <li><strong>undo log</strong>（InnoDB）：记录"修改前的反向操作"，用于<strong>回滚</strong>（原子性）和 MVCC 版本链。</li>
        <li><strong>binlog</strong>（Server 层）：记录所有"逻辑修改"（DDL+DML），用于<strong>主从复制和数据恢复</strong>。追加写。</li>
      </ul>
      <blockquote>两阶段提交：redo log prepare → 写 binlog → redo log commit。保证两者一致性，主从复制不丢数据。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. redo log（重做日志）</strong></p>
      <ul>
        <li><strong>归属</strong>：InnoDB 引擎层（独有的）。</li>
        <li><strong>内容</strong>：数据页的<strong>物理修改</strong>（哪个页 offset 改成什么），偏底层。</li>
        <li><strong>作用</strong>：保证<strong>持久性</strong>。crash 后用 redo log 恢复已提交但未刷盘的数据。</li>
        <li><strong>WAL（Write-Ahead Logging）</strong>：先写 redo log 再改数据页。redo log 顺序写（快），数据页随机写（慢）。</li>
        <li><strong>循环写</strong>：固定大小（如两个文件循环），write pos 追 check pos。写满就强制刷盘。</li>
        <li><strong>刷盘策略</strong>：innodb_flush_log_at_trx_commit（0/1/2），1 最安全（每次提交刷盘）。</li>
      </ul>
      <p><strong>2. undo log（回滚日志）</strong></p>
      <ul>
        <li><strong>归属</strong>：InnoDB 引擎层。</li>
        <li><strong>内容</strong>：修改前的<strong>反向操作</strong>（逻辑日志，如旧值）。</li>
        <li><strong>作用</strong>：① <strong>事务回滚</strong>（原子性）：失败时用 undo 恢复；② <strong>MVCC</strong>：存历史版本构建版本链。</li>
        <li><strong>由 purge 线程清理</strong>：当没有事务需要旧版本时，undo log 才能删除。</li>
      </ul>
      <p><strong>3. binlog（归档日志）</strong></p>
      <ul>
        <li><strong>归属</strong>：Server 层（所有引擎共用）。</li>
        <li><strong>内容</strong>：所有<strong>逻辑修改</strong>（SQL 语句或行变更），DDL+DML 都记。</li>
        <li><strong>作用</strong>：① <strong>主从复制</strong>：master 写 binlog，slave 拉取重放；② <strong>数据恢复</strong>：按时间点恢复（PITR）。</li>
        <li><strong>追加写</strong>：文件滚动（达到大小切新文件），不覆盖。</li>
        <li><strong>三种格式</strong>：Statement（SQL）、Row（行变更）、Mixed（混合）。</li>
      </ul>
      <p><strong>4. redo log vs binlog</strong></p>
      <table><tr><th></th><th>redo log</th><th>binlog</th></tr>
      <tr><td>层级</td><td>InnoDB 引擎</td><td>Server 层</td></tr>
      <tr><td>内容</td><td>物理日志（页修改）</td><td>逻辑日志（SQL/行变更）</td></tr>
      <tr><td>写入</td><td>循环写</td><td>追加写</td></tr>
      <tr><td>用途</td><td>崩溃恢复（持久性）</td><td>复制+归档恢复</td></tr>
      <tr><td>强制</td><td>InnoDB 必须</td><td>可关闭</td></tr></table>
      <p><strong>5. 两阶段提交（保证 redo 和 binlog 一致）</strong></p>
      <ol>
        <li>写 redo log，置 <strong>prepare</strong> 状态。</li>
        <li>写 binlog。</li>
        <li>redo log 置 <strong>commit</strong> 状态。</li>
      </ol>
      <p>崩溃恢复：redo 是 commit 直接提交；redo 是 prepare，看 binlog 是否完整（写完）——完整则提交，不完整则回滚。这样保证主从数据一致（binlog 和 redo 都成功或都失败）。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>redo（InnoDB物理日志，循环写，崩溃恢复保证持久性，WAL）、undo（InnoDB反向操作，回滚+MVCC）、binlog（Server逻辑日志，追加写，复制+恢复）。两阶段提交保证 redo 和 binlog 一致：redo prepare→写 binlog→redo commit。</p>`},
  {c:"MySQL",d:"★★",q:"如何分析慢 SQL？如何优化？",
   a:`<p><strong>分析</strong>：开启慢查询日志 → 用 EXPLAIN 看执行计划：</p>
      <ul>
        <li>type：访问类型，从好到差 const&gt;eq_ref&gt;ref&gt;range&gt;index&gt;ALL。至少到 range。</li>
        <li>key：实际用的索引。Extra：Using index（覆盖索引好）、Using filesort（需优化）、Using temporary（需优化）。</li>
        <li>rows：扫描行数。</li>
      </ul>
      <p><strong>优化手段</strong>：</p>
      <ul>
        <li>合理建索引（覆盖索引、联合索引最左前缀）。</li>
        <li>避免 select *，只查需要的列。</li>
        <li>大分页用游标/延迟关联（深分页 limit 1000000,10 慢）。</li>
        <li>避免索引失效写法。</li>
        <li>大表考虑分库分表、读写分离。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 定位慢 SQL</strong></p>
      <ul>
        <li><strong>慢查询日志</strong>：开启 slow_query_log，设 long_query_time（如 1 秒），记录超时的 SQL。</li>
        <li><strong>show processlist</strong>：看当前正在执行的 SQL，定位卡住的。</li>
        <li><strong>SHOW PROFILE</strong>：分析单条 SQL 各阶段耗时。</li>
        <li>监控告警（Prometheus + Grafana）。</li>
      </ul>
      <p><strong>2. EXPLAIN 执行计划关键字段</strong></p>
      <ul>
        <li><strong>id</strong>：执行顺序，id 大的先执行。</li>
        <li><strong>type（最关键）</strong>：访问类型，性能从好到差：system &gt; const &gt; eq_ref &gt; ref &gt; range &gt; index &gt; ALL。生产至少到 range/ref，避免 ALL（全表扫描）。</li>
        <li><strong>possible_keys</strong>：可能用的索引。</li>
        <li><strong>key</strong>：实际用的索引（NULL 表示没用索引）。</li>
        <li><strong>key_len</strong>：索引用了的字节数（判断联合索引用了几列）。</li>
        <li><strong>rows</strong>：预估扫描行数，越少越好。</li>
        <li><strong>filtered</strong>：过滤后剩余比例。</li>
        <li><strong>Extra（重要）</strong>：
          <ul>
            <li><strong>Using index</strong>：覆盖索引，好。</li>
            <li><strong>Using where</strong>：用 where 过滤（一般）。</li>
            <li><strong>Using index condition</strong>：索引下推（ICP）。</li>
            <li><strong>Using filesort</strong>：额外排序，<strong>需优化</strong>（给 order by 列加索引）。</li>
            <li><strong>Using temporary</strong>：用临时表，<strong>需优化</strong>（group by/distinct 常见）。</li>
          </ul>
        </li>
      </ul>
      <p><strong>3. 优化手段</strong></p>
      <ul>
        <li><strong>建合适的索引</strong>：高频查询条件、排序、分组字段。优先联合索引（覆盖多场景），遵循最左前缀。</li>
        <li><strong>覆盖索引</strong>：查询字段都在索引里，避免回表。</li>
        <li><strong>避免 select *</strong>：只查需要的列，减少 IO，可能触发覆盖索引。</li>
        <li><strong>避免索引失效</strong>：不加函数、不做运算、注意类型转换、范围查询放最后。</li>
        <li><strong>大分页优化</strong>：limit 1000000,10 → 延迟关联（先查主键再 join）或游标分页（where id &gt; last_id）。</li>
        <li><strong>避免大事务</strong>：长事务持锁久、占用 undo log。</li>
        <li><strong>表设计</strong>：合适字段类型（小优先）、避免 NULL、适度反范式（冗余字段减少 join）。</li>
        <li><strong>架构优化</strong>：读写分离、分库分表、加缓存（Redis）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>慢查询日志定位 → EXPLAIN 分析（type 至少 range、key 看索引、Extra 看 Using filesort/temporary 需优化、rows 越少越好）。优化：建合适索引（覆盖+最左前缀）、避免 select *、避免索引失效、大分页用游标/延迟关联、读写分离分库分表。</p>`},
  {c:"MySQL",d:"★★",q:"MySQL 主从复制原理？",
   a:`<p><strong>三个步骤</strong>：</p>
      <ol>
        <li>Master 把数据变更写入 <strong>binlog</strong>。</li>
        <li>Slave 的 IO 线程把 Master 的 binlog 拉过来，写到本地 <strong>relay log（中继日志）</strong>。</li>
        <li>Slave 的 SQL 线程读 relay log，重放 SQL 到从库。</li>
      </ol>
      <blockquote>三种复制方式：异步（默认，可能丢数据）、半同步（至少一个从库 ack）、组复制 MGR（基于 Paxos，强一致）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 主从复制的作用</strong></p>
      <ul>
        <li><strong>读写分离</strong>：主库写，从库读，分担压力。</li>
        <li><strong>数据备份/容灾</strong>：主挂了切从。</li>
        <li><strong>高可用</strong>：配合 MHA/MGR 实现故障切换。</li>
      </ul>
      <p><strong>2. 复制原理（三线程）</strong></p>
      <ol>
        <li><strong>Master 的 binlog dump 线程</strong>：事务提交时把变更写入 binlog，当 slave 连接时把 binlog 发给 slave。</li>
        <li><strong>Slave 的 IO 线程</strong>：连接 master，拉取 binlog，写到本地的 <strong>relay log（中继日志）</strong>。</li>
        <li><strong>Slave 的 SQL 线程</strong>：读 relay log，重放（执行）里面的 SQL/事件，应用到从库数据。</li>
      </ol>
      <p>核心：<strong>binlog（master）→ relay log（slave）→ 重放</strong>。</p>
      <p><strong>3. 复制的三种方式</strong></p>
      <ul>
        <li><strong>异步复制（默认）</strong>：master 写完 binlog 就返回，不等 slave。性能高，但 master 挂了未同步的数据丢失。</li>
        <li><strong>半同步复制</strong>：master 写 binlog 后，至少等<strong>一个 slave ack</strong>（收到 relay log）才返回。性能略降，数据更安全（至少有一份）。</li>
        <li><strong>组复制 MGR（MySQL Group Replication）</strong>：基于 Paxos 协议，多 master 强一致。数据不丢，但写性能受限。</li>
      </ul>
      <p><strong>4. 同步延迟问题</strong></p>
      <p>slave 的 SQL 线程是单线程重放（5.7+ 支持并行复制），master 写快时 slave 跟不上，导致延迟。表现：刚写入的数据从库读不到。</p>
      <p>解决：并行复制（基于组提交/WriteSet）、从库用更好的硬件、减少主库大事务。</p>
      <p><strong>5. binlog 格式对复制的影响</strong></p>
      <ul>
        <li>Statement：记 SQL，小但有不安全函数（now()、uuid()）。</li>
        <li>Row：记行变更，安全但大。推荐。</li>
        <li>Mixed：混合。</li>
      </ul>
      <p><strong>6. 主从一致性保障</strong></p>
      <p>两阶段提交（redo + binlog）保证 master 崩溃不丢 binlog；半同步保证 slave 收到；GTID（全局事务 ID）保证不漏事务、方便故障切换。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>三线程：master 的 binlog dump（发 binlog）、slave 的 IO 线程（收 binlog 写 relay log）、slave 的 SQL 线程（重放 relay log）。三种方式：异步（默认可能丢）、半同步（等一个 ack）、MGR（Paxos 强一致）。注意 SQL 线程单线程的延迟问题（5.7+ 并行复制）。</p>`},

  {c:"Redis",d:"★★★",q:"Redis 为什么这么快？",
   a:`<ul>
        <li><strong>纯内存</strong>操作，无磁盘 IO。</li>
        <li><strong>单线程</strong>（核心命令执行），避免线程切换和加锁开销。Redis 6.0 后网络 IO 多线程，命令仍单线程。</li>
        <li>IO 多路复用（epoll），单线程处理大量连接。</li>
        <li>高效数据结构：SDS、跳表、压缩列表、哈希表。</li>
        <li>自己实现的事件驱动框架（Reactor 模式）。</li>
      </ul>
      <blockquote>注意：单线程指命令执行；持久化（bgsave）、AOF 重写、删除大 key 用异步线程（BIO）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 基于内存</strong></p>
      <p>所有数据存在内存，读写无磁盘 IO，这是最根本的原因（内存访问 ns 级，磁盘 ms 级，差 10 万倍）。</p>
      <p><strong>2. 单线程（命令执行）</strong></p>
      <p>核心命令在一个线程串行执行，避免了：① 多线程的上下文切换开销；② 加锁/解锁的同步开销；③ 并发安全问题。单线程 + 非阻塞 IO 反而高效，因为 Redis 的瓶颈不在 CPU（命令简单快），而在内存和网络。</p>
      <p>单线程为什么还能快？因为命令本身执行极快（内存操作），单线程也够用，省去了线程切换的开销。</p>
      <p><strong>3. IO 多路复用（epoll）</strong></p>
      <p>用 epoll 一个线程监听大量客户端 socket，哪个有事件（读写就绪）就处理哪个，避免每个连接一个线程的阻塞模型。Reactor 事件驱动模式。</p>
      <p><strong>4. 高效的数据结构</strong></p>
      <p>Redis 自己实现的 SDS（O(1) 取长度、二进制安全）、跳表（O(logN) 有序操作）、压缩列表（小数据省内存）、字典（渐进式 rehash）等，针对不同场景优化。</p>
      <p><strong>5. Redis 6.0 多线程</strong></p>
      <p>6.0 引入<strong>网络 IO 多线程</strong>（读取请求、发送响应），但<strong>命令执行仍单线程</strong>。因为网络 IO 成了瓶颈（高并发下读写 socket 耗时），多线程处理 IO + 单线程执行命令，既提升吞吐又保证安全。</p>
      <p><strong>6. 单线程的例外（BIO）</strong></p>
      <p>这些操作用后台线程：① 持久化 bgsave/aof rewrite（fork 子进程）；② 异步删除大 key（UNLINK、lazyfree）；③ 关闭文件等。所以"单线程"严格说是命令执行单线程。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>Redis 快因为：内存操作 + 单线程（无切换无锁）+ epoll 多路复用 + 高效数据结构。6.0 网络IO多线程但命令仍单线程。单线程指命令执行，持久化/删除大key用 BIO 后台线程。</p>`},
  {c:"Redis",d:"★★★",q:"Redis 有哪些数据类型？分别什么场景？",
   a:`<p>5 种基础 + 3 种扩展：</p>
      <ul>
        <li><strong>String</strong>：缓存对象（序列化/JSON）、计数器（incr）、分布式锁（setnx）。</li>
        <li><strong>List</strong>：消息队列、最新列表、栈（lpush+rpop）。</li>
        <li><strong>Hash</strong>：对象存储（user:{id} → name/age），比 String 存对象更省内存。</li>
        <li><strong>Set</strong>：去重、共同好友、标签、抽奖。</li>
        <li><strong>ZSet（有序集合）</strong>：排行榜、延迟队列、带权重的标签。底层跳表+哈希表。</li>
      </ul>
      <p>扩展（Redis 2.8+ / 模块）：</p>
      <ul>
        <li><strong>Bitmap</strong>：签到、活跃用户统计。</li>
        <li><strong>HyperLogLog</strong>：UV 去重统计（误差 0.81%）。</li>
        <li><strong>Geo</strong>：地理位置（附近的人）。</li>
        <li><strong>Stream</strong>（5.0+）：消息队列，带消费组。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 五大基础类型及底层</strong></p>
      <ul>
        <li><strong>String</strong>：底层 SDS（简单动态字符串）。最大 512MB。场景：缓存对象（JSON）、计数器（INCR）、分布式锁（SETNX）、限流、验证码。</li>
        <li><strong>List</strong>：底层 quicklist（ziplist + linkedlist）。场景：消息队列（LPUSH+BRPOP）、最新 N 条记录、文章列表。</li>
        <li><strong>Hash</strong>：底层 ziplist（小）或 hashtable（大）。场景：存对象（user:1 → {name, age, email}），比 String 存整个对象更灵活省内存（可单独改字段）。</li>
        <li><strong>Set</strong>：底层 intset（纯整数）或 hashtable。场景：去重（UV）、标签、共同好友（SINTER）、抽奖（SRANDMEMBER）。</li>
        <li><strong>ZSet</strong>：底层 ziplist 或 skiplist+hashtable。场景：排行榜（ZADD/ZREVRANGE）、延迟队列（score=执行时间）、带权重排序。</li>
      </ul>
      <p><strong>2. 特殊类型</strong></p>
      <ul>
        <li><strong>Bitmap</strong>：基于 String 的位操作。场景：签到（SETBIT user:1 日期 1）、活跃统计、布隆过滤器。</li>
        <li><strong>HyperLogLog</strong>：基数估算（去重计数），固定 12KB，误差 0.81%。场景：UV、PV 去重。比 Set 省内存。</li>
        <li><strong>Geo</strong>：基于 ZSet，GeoHash 编码。场景：附近的人/店（GEOSEARCH）、距离计算。</li>
        <li><strong>Stream</strong>（5.0+）：消息队列，支持消费组、ACK。场景：轻量消息队列（替代 Kafka/RabbitMQ 的简单场景）。</li>
      </ul>
      <p><strong>3. 类型选择建议</strong></p>
      <ul>
        <li>缓存对象：小对象用 String（JSON），大对象/需改字段用 Hash。</li>
        <li>排行榜：ZSet。</li>
        <li>去重：Set（精确，小数据）或 HyperLogLog（大数据，近似）或 Bitmap（整数 ID）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>5基础：String（缓存/计数/锁）、List（队列）、Hash（对象）、Set（去重/交集）、ZSet（排行榜，跳表）。特殊：Bitmap（签到）、HyperLogLog（UV近似去重）、Geo（LBS）、Stream（消息队列）。</p>`},
  {c:"Redis",d:"★★★",q:"缓存穿透、击穿、雪崩的区别和解决方案？",
   a:`<table>这是高频必问：</table>
      <p><strong>穿透</strong>：查询<strong>根本不存在</strong>的数据，缓存和 DB 都没有，每次都查 DB（恶意攻击）。</p>
      <p>解决：① 缓存空值（短过期）；② 布隆过滤器拦截。</p>
      <p><strong>击穿</strong>：<strong>一个热点 key 突然过期</strong>，瞬间大量请求打到 DB。</p>
      <p>解决：① 互斥锁（只放一个线程查 DB 回填）；② 热点 key 永不过期（后台异步更新）。</p>
      <p><strong>雪崩</strong>：<strong>大量 key 同时过期</strong>，或 Redis 宕机，请求全打到 DB。</p>
      <p>解决：① 过期时间加随机值；② 多级缓存；③ Redis 高可用（哨兵/集群）；④ 服务降级熔断。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 缓存穿透（Penetration）</strong></p>
      <p>查询<strong>根本不存在</strong>的数据（如 id=-1 或恶意构造的 id），缓存和数据库都没有，每次请求都穿透到 DB。常被恶意攻击（爬虫、刷接口）。</p>
      <p><strong>解决</strong>：</p>
      <ul>
        <li><strong>缓存空值</strong>：DB 查不到也缓存 null（设短过期如 60s），下次直接返回。简单但有内存浪费、短期不一致。</li>
        <li><strong>布隆过滤器</strong>：请求前先过布隆过滤器，不存在直接拒绝。准确（不存在100%准），但有一定误判率（存在可能误判），且删除困难。</li>
        <li>参数校验：非法参数（负数 id）直接拒绝。</li>
      </ul>
      <p><strong>2. 缓存击穿（Breakdown）</strong></p>
      <p><strong>一个热点 key</strong>（如秒杀商品）在过期瞬间，大量并发请求同时查 DB（缓存没了），DB 瞬间压力大。</p>
      <p><strong>解决</strong>：</p>
      <ul>
        <li><strong>互斥锁（推荐）</strong>：缓存 miss 后，用 setnx 加锁，只让一个线程查 DB 回填缓存，其他等待重试。避免大量请求打 DB。</li>
        <li><strong>逻辑过期（永不过期）</strong>：key 不设 TTL，value 里存逻辑过期时间。查询时发现逻辑过期，异步更新，当前返回旧值。不阻塞但要处理不一致。</li>
        <li><strong>热点 key 预热</strong>：提前加载到缓存。</li>
      </ul>
      <p><strong>3. 缓存雪崩（Avalanche）</strong></p>
      <p><strong>大量 key 同时过期</strong>，或 Redis 宕机，请求全部打到 DB，导致 DB 也崩溃（雪崩）。</p>
      <p><strong>解决</strong>：</p>
      <ul>
        <li><strong>过期时间加随机值</strong>：避免同时过期（如 base + random(0, 300s)）。</li>
        <li><strong>多级缓存</strong>：本地缓存（Caffeine）+ Redis，Redis 挂了本地还能扛。</li>
        <li><strong>Redis 高可用</strong>：哨兵/Cluster，避免单点宕机。</li>
        <li><strong>熔断降级</strong>：DB 压力大时降级（返回默认值/兜底），保护系统。</li>
      </ul>
      <p><strong>4. 三者对比</strong></p>
      <ul>
        <li>穿透：数据<strong>不存在</strong>（被攻击）。→ 布隆过滤器/空值。</li>
        <li>击穿：<strong>单个热点</strong>过期。→ 互斥锁/逻辑过期。</li>
        <li>雪崩：<strong>大量 key</strong>过期或 Redis 宕机。→ 随机过期/多级缓存/高可用/熔断。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>穿透是查不存在的数据（布隆过滤器/缓存空值）；击穿是单热点key过期（互斥锁/逻辑过期）；雪崩是大量key同时过期或Redis宕机（随机过期/多级缓存/高可用/熔断）。</p>`},
  {c:"Redis",d:"★★★",q:"Redis 的持久化机制？RDB 和 AOF 的区别？",
   a:`<ul>
        <li><strong>RDB</strong>（默认）：把内存快照 dump 成二进制文件 dump.rdb。
          <ul><li>触发：save（阻塞）/ bgsave（fork 子进程）/ 自动配置。</li>
          <li>优点：体积小、恢复快、适合备份。</li>
          <li>缺点：两次保存之间宕机会丢数据。</li></ul>
        </li>
        <li><strong>AOF</strong>：记录每条写命令到 appendonly.aof。
          <ul><li>刷盘策略：always（最安全慢）/ everysec（默认，平衡）/ no。</li>
          <li>优点：丢数据少（最多 1 秒）。</li>
          <li>缺点：文件大、恢复慢。</li>
          <li>AOF 重写：文件太大时压缩（只保留最终状态）。</li></ul>
        </li>
      </ul>
      <blockquote>Redis 4.0+ 支持<strong>混合持久化</strong>：AOF 重写时先以 RDB 格式写全量，再追加增量命令。兼顾速度和数据安全。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. RDB（Redis Database）快照</strong></p>
      <p>把某个时间点的全部内存数据 dump 成二进制文件 dump.rdb。</p>
      <ul>
        <li><strong>触发方式</strong>：① 手动 save（阻塞主线程，生产别用）/ bgsave（fork 子进程，推荐）；② 配置自动触发（save 900 1：900秒内1个变更）；③ shutdown/主从全量同步时触发。</li>
        <li><strong>原理</strong>：bgsave fork 子进程（写时复制 COW），子进程遍历内存写 RDB，主进程继续服务。</li>
        <li><strong>优点</strong>：文件小（二进制压缩）、恢复快、适合备份/容灾。</li>
        <li><strong>缺点</strong>：两次 RDB 之间宕机会丢数据（非实时）；fork 大内存耗时。</li>
      </ul>
      <p><strong>2. AOF（Append Only File）追加日志</strong></p>
      <p>记录每条写命令到 appendonly.aof（先执行后记录）。</p>
      <ul>
        <li><strong>刷盘策略 appendfsync</strong>：① always（每次写都 fsync，最安全但慢）；② <strong>everysec（默认，每秒 fsync，最多丢1秒）</strong>；③ no（交给 OS，可能丢较多）。</li>
        <li><strong>优点</strong>：丢数据少（everysec 最多丢 1 秒）。</li>
        <li><strong>缺点</strong>：文件大、恢复慢（要重放命令）。</li>
        <li><strong>AOF 重写</strong>：文件太大时，fork 子进程生成精简版（只保留最终状态，如多次 INCR 合并成一个 SET）。auto-aof-rewrite-percentage 自动触发。</li>
      </ul>
      <p><strong>3. RDB vs AOF 对比</strong></p>
      <table><tr><th></th><th>RDB</th><th>AOF</th></tr>
      <tr><td>内容</td><td>二进制数据快照</td><td>写命令日志</td></tr>
      <tr><td>体积</td><td>小</td><td>大</td></tr>
      <tr><td>恢复速度</td><td>快</td><td>慢</td></tr>
      <tr><td>数据安全</td><td>可能丢（两次间）</td><td>好（最多1秒）</td></tr>
      <tr><td>性能影响</td><td>fork 时</td><td>每次写追加</td></tr></table>
      <p><strong>4. 混合持久化（4.0+）</strong></p>
      <p>AOF 重写时，<strong>先以 RDB 格式写全量数据，再追加增量 AOF 命令</strong>。恢复时先加载 RDB（快）再重放 AOF（少）。兼顾恢复速度和数据安全。4.0+ aof-use-rdb-preamble 默认开启。</p>
      <p><strong>5. 选择建议</strong></p>
      <ul>
        <li>只用缓存（丢数据无所谓）：RDB 或关闭持久化。</li>
        <li>不能丢数据（如订单）：AOF everysec。</li>
        <li>推荐：混合持久化（4.0+）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>RDB 是快照（fork子进程，体积小恢复快但可能丢数据）；AOF 是命令日志（everysec最多丢1秒，文件大恢复慢，有重写）。4.0+混合持久化：AOF重写时先RDB全量再追加增量。生产用 AOF everysec 或混合。</p>`},
  {c:"Redis",d:"★★★",q:"如何用 Redis 实现分布式锁？有什么问题？",
   a:`<p><strong>基础版</strong>：</p>
      <pre><code>SET lock_key uuid NX EX 30  // 加锁（原子）</code></pre>
      <p>释放锁用 Lua 脚本保证"判断+删除"原子。</p>
      <p><strong>三个问题</strong>：</p>
      <ol>
        <li><strong>锁过期但业务没执行完</strong>：开后台线程<strong>看门狗续期</strong>（Redisson 的 watchdog，每 1/3 过期时间续）。</li>
        <li><strong>误删别人的锁</strong>：value 用唯一 uuid，删除前判断（Lua 脚本）。</li>
        <li><strong>主从切换丢锁</strong>：主节点加锁还没同步到从就宕机，新主没锁。Redis 作者提出 <strong>RedLock</strong>（多数节点加锁），但有争议。</li>
      </ol>
      <blockquote>生产推荐 Redisson。强一致场景用 ZooKeeper / etcd（基于 CP，临时顺序节点）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 基础实现（原子加锁）</strong></p>
      <pre><code>-- 加锁（SET 的 NX EX 保证原子）
SET lock_key {uuid} NX EX 30
-- 解锁（Lua 保证"判断value+删除"原子）
if redis.call('get', KEYS[1]) == ARGV[1] then
    return redis.call('del', KEYS[1])
else
    return 0
end</code></pre>
      <p>关键点：① NX（不存在才设）；② EX（设过期，防死锁）；③ value 用唯一 uuid（防误删）；④ 解锁用 Lua（判断+删除原子）。</p>
      <p><strong>2. 三个经典问题</strong></p>
      <ul>
        <li><strong>问题一：业务执行时间超过锁过期时间</strong>。锁自动释放，其他线程拿到锁，原线程执行完误删别人的锁。
          <br><strong>解决</strong>：① value 用 uuid + Lua 判断删除（防误删）；② <strong>看门狗自动续期</strong>（Redisson 的 watchdog：后台线程每隔 1/3 过期时间检查锁还在就续期）。</li>
        <li><strong>问题二：误删别人锁</strong>。锁过期后别人拿到，原线程执行完删除时删了别人的。
          <br><strong>解决</strong>：value 存 uuid，删除前用 Lua 判断是不是自己的锁。</li>
        <li><strong>问题三：主从切换丢锁（Redis 异步复制）</strong>。master 加锁还没同步到 slave 就宕机，slave 升级为 master 没有这把锁，其他线程加锁成功 → 两个线程持锁。
          <br><strong>解决</strong>：<strong>RedLock 算法</strong>（Redis 作者提出）：向 N（奇数，如5）个独立 Redis 实例加锁，超过半数（N/2+1）成功才算加锁成功。但有争议（时钟漂移、GC 停顿问题），Martin Kleppmann 批评过。</li>
      </ul>
      <p><strong>3. Redisson 的实现</strong></p>
      <p>生产推荐 Redisson，它解决了上述问题：</p>
      <ul>
        <li>加锁用 Lua 脚本（原子）。</li>
        <li><strong>看门狗（watchdog）</strong>：默认 30 秒过期，后台线程每 10 秒续期（持有期间不过期）。</li>
        <li>支持可重入（hash 结构记重入次数）。</li>
        <li>支持 RedLock（RedissonRedLock）。</li>
      </ul>
      <p><strong>4. 对比其他方案</strong></p>
      <ul>
        <li><strong>ZooKeeper</strong>：临时顺序节点 + Watch，CP 强一致，客户端宕机锁自动释放。可靠性高但性能低。</li>
        <li><strong>etcd</strong>：Lease 租约，类似 ZK。</li>
        <li><strong>数据库</strong>：唯一索引/for update。简单但性能差。</li>
      </ul>
      <p>选型：性能优先 Redis + Redisson；强一致优先 ZK/etcd。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>SET key uuid NX EX 加锁，Lua 解锁。三问题：① 业务超时（看门狗续期）；② 误删（uuid+Lua 判断）；③ 主从切换丢锁（RedLock 有争议）。生产用 Redisson（自带看门狗+可重入）。强一致用 ZK。</p>`},
  {c:"Redis",d:"★★★",q:"Redis 的过期删除策略和内存淘汰策略？",
   a:`<p><strong>过期删除</strong>（key 设置了 TTL 后）：</p>
      <ul>
        <li><strong>惰性删除</strong>：访问时才检查过期，过期才删。优点省 CPU，缺点可能堆积大量过期 key。</li>
        <li><strong>定期删除</strong>：每隔一段时间随机抽一批 key 检查删除过期。两者配合。</li>
      </ul>
      <p><strong>内存淘汰策略</strong>（达到 maxmemory 时）8 种：</p>
      <ul>
        <li>noeviction：不淘汰，写入报错（默认）。</li>
        <li>allkeys-lru / volatile-lru：最近最少使用（全部 / 设了 TTL 的）。</li>
        <li>allkeys-lfu / volatile-lfu（4.0+）：最不常用。</li>
        <li>allkeys-random / volatile-random：随机。</li>
        <li>volatile-ttl：即将过期的优先淘汰。</li>
      </ul>
      <blockquote>缓存场景常用 allkeys-lru / allkeys-lfu。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 过期 key 的删除策略（TTL 管理）</strong></p>
      <p>设置了过期时间的 key，Redis 用两种策略配合删除：</p>
      <ul>
        <li><strong>惰性删除</strong>：每次访问 key 时（GET/SET 等）检查是否过期，过期则删除返回 nil。优点：不额外占 CPU。缺点：长期不访问的过期 key 会堆积（内存泄漏）。</li>
        <li><strong>定期删除</strong>：每隔一段时间（hz 配置，默认10次/秒），随机抽取一批设置了过期的 key 检查，删除过期的。如果过期比例高，多删些；低了就停。限制 CPU 占用。</li>
      </ul>
      <p>两者配合：惰性保证访问时清理，定期清理不访问的。</p>
      <p><strong>2. 内存淘汰策略（8 种，maxmemory 满时）</strong></p>
      <p>当内存达到 maxmemory 限制且无法再分配时，Redis 根据策略淘汰 key。8 种：</p>
      <ul>
        <li><strong>noeviction</strong>（默认）：不淘汰，写入命令报错（OOM）。适合不能丢数据的场景。</li>
        <li><strong>allkeys-lru</strong>：所有 key 中淘汰最近最少使用的。缓存常用。</li>
        <li><strong>volatile-lru</strong>：设了过期的 key 中淘汰 LRU。</li>
        <li><strong>allkeys-lfu</strong>（4.0+）：所有 key 中淘汰最不常用（按使用频率）。</li>
        <li><strong>volatile-lfu</strong>（4.0+）：设了过期的中淘汰 LFU。</li>
        <li><strong>allkeys-random</strong>：所有 key 随机淘汰。</li>
        <li><strong>volatile-random</strong>：设了过期的中随机淘汰。</li>
        <li><strong>volatile-ttl</strong>：设了过期的中，优先淘汰快过期的（TTL 小的）。</li>
      </ul>
      <p><strong>3. LRU vs LFU</strong></p>
      <ul>
        <li><strong>LRU（Least Recently Used）</strong>：淘汰最久没用的。基于"时间"。缺点：偶发访问（如扫描）会把热点数据挤掉。</li>
        <li><strong>LFU（Least Frequently Used，4.0+）</strong>：淘汰使用频率最低的。基于"次数"。更准确反映热度，适合稳定热点。Redis 的 LFU 用概率计数衰减（防历史数据永久占优）。</li>
      </ul>
      <p>Redis 的 LRU 是<strong>近似 LRU</strong>（随机采样 5 个淘汰最旧的，不是严格 LRU），省内存。</p>
      <p><strong>4. 选择建议</strong></p>
      <ul>
        <li>纯缓存（全可丢）：allkeys-lru 或 allkeys-lfu。</li>
        <li>缓存+持久数据混合：volatile-lru（只淘汰设了过期的，保护重要数据）。</li>
        <li>不能丢任何数据：noeviction（但要监控内存）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>过期删除：惰性（访问时检查）+ 定期（抽样清理）配合。淘汰策略8种：noeviction（默认不淘汰）、allkeys-lru/volatile-lru（LRU最近最少）、allkeys-lfu/volatile-lfu（LFU最不常用）、random、volatile-ttl。缓存用 allkeys-lru/lfu。</p>`},
  {c:"Redis",d:"★★",q:"Redis 集群方案？主从、哨兵、Cluster 的区别？",
   a:`<ul>
        <li><strong>主从复制</strong>：一主多从，读写分离，<strong>不能自动故障转移</strong>。</li>
        <li><strong>哨兵 Sentinel</strong>：在主从基础上增加哨兵集群监控，主挂自动选举新主。<strong>高可用</strong>，但单 master 写性能瓶颈。</li>
        <li><strong>Cluster</strong>：分布式方案，多 master 多 slave。
          <ul>
            <li>数据分片：<strong>16384 个哈希槽</strong>，CRC16(key) % 16384 定位节点。</li>
            <li>去中心化，节点间 Gossip 协议通信。</li>
            <li>支持自动故障转移。</li>
            <li>限制：跨槽操作受限（mset/multi），需 hash tag {} 路由到同槽。</li>
          </ul>
        </li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 主从复制（Replication）</strong></p>
      <ul>
        <li>一主多从，master 写，slave 同步 master 数据。</li>
        <li>读写分离：master 写，slave 读，分担读压力。</li>
        <li>数据冗余备份。</li>
        <li><strong>缺点</strong>：master 宕机要<strong>手动</strong>切换 slave 为 master，不能自动故障转移。</li>
      </ul>
      <p><strong>2. 哨兵 Sentinel（高可用）</strong></p>
      <p>在主从基础上增加 Sentinel（哨兵）集群（奇数个，如3个），负责监控和自动故障转移。</p>
      <ul>
        <li><strong>监控</strong>：实时检测 master/slave 存活。</li>
        <li><strong>通知</strong>：故障时通知运维或客户端。</li>
        <li><strong>自动故障转移</strong>：master 挂了，Sentinel 选举新 master，通知其他 slave 和客户端切换。</li>
        <li><strong>配置中心</strong>：客户端连 Sentinel 获取 master 地址。</li>
      </ul>
      <p>故障转移流程：主观下线（单个哨兵判断）→ 客观下线（quorum 多数同意）→ 选举 leader 哨兵 → 选新 master（优先级、offset、runid）→ 通知切换。</p>
      <p><strong>缺点</strong>：单 master 写（写性能瓶颈），数据全在一个 master。</p>
      <p><strong>3. Cluster（分布式）</strong></p>
      <p>解决单 master 瓶颈，支持数据分片 + 高可用。</p>
      <ul>
        <li><strong>多 master 多 slave</strong>：数据分散在多个 master，每个 master 有 slave 做备份+故障转移。</li>
        <li><strong>数据分片</strong>：16384 个哈希槽分配到各 master，CRC16(key) % 16384 定位 key 在哪个槽（哪个节点）。</li>
        <li><strong>去中心化</strong>：无中心节点，节点间用 Gossip 协议通信（PING/PONG 交换状态）。</li>
        <li><strong>自动故障转移</strong>：master 挂了，它的 slave 自动升级（类似哨兵但集成在集群）。</li>
        <li><strong>限制</strong>：跨槽操作受限（如 mset 多 key 要在不同槽会报错，除非用 hash tag {} 强制同槽）；不支持跨节点事务（multi）；客户端要支持集群协议（重定向 MOVED/ASK）。</li>
      </ul>
      <p><strong>4. 三者对比</strong></p>
      <table><tr><th></th><th>主从</th><th>哨兵</th><th>Cluster</th></tr>
      <tr><td>数据分片</td><td>否（全在一个master）</td><td>否</td><td>是（16384槽）</td></tr>
      <tr><td>高可用</td><td>否（手动）</td><td>是（自动转移）</td><td>是</td></tr>
      <tr><td>写性能</td><td>单master瓶颈</td><td>单master瓶颈</td><td>多master，高</td></tr></table>
      <p><strong>5. 面试标准答法</strong></p>
      <p>主从：读写分离但手动故障转移。哨兵：主从+哨兵监控自动故障转移，但单master写瓶颈。Cluster：多master分片（16384槽CRC16定位）+去中心化Gossip+自动故障转移，解决写瓶颈。限制：跨槽操作需hash tag。</p>`},
  {c:"Redis",d:"★★",q:"缓存和数据库一致性怎么保证？",
   a:`<p>四种策略及权衡：</p>
      <ul>
        <li><strong>Cache Aside（旁路缓存，最常用）</strong>：先更新 DB，再删除缓存。读时缓存 miss 查 DB 回填。</li>
        <li><strong>延迟双删</strong>：删缓存→更新DB→延迟一段时间再删缓存。解决并发旧值回填。</li>
        <li><strong>消息队列 + Canal</strong>：Canal 订阅 binlog 异步删缓存，保证最终一致。</li>
        <li><strong>强一致</strong>：分布式锁（DB 写时锁住缓存）+ 双写事务，性能差。</li>
      </ul>
      <blockquote>为什么是"删除"缓存不是"更新"？删除是幂等的，且避免并发更新导致数据不一致。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Cache Aside（旁路缓存，最常用）</strong></p>
      <p>读：先查缓存，miss 则查 DB 并回填缓存。写：<strong>先更新 DB，再删除缓存</strong>（不是更新缓存）。</p>
      <p>为什么删除而不是更新缓存？① 删除幂等（多次删效果一样）；② 避免并发更新顺序导致脏数据；③ 更新缓存可能浪费（写了不读）。缺点：删缓存失败会有短暂不一致。</p>
      <p>为什么先 DB 后缓存（而不是先缓存后 DB）？减少不一致窗口（先删缓存后写DB期间，其他读会回填旧值）。</p>
      <p><strong>2. Cache Aside 的并发不一致问题</strong></p>
      <ul>
        <li>写线程删缓存 → 还没更新DB → 读线程 miss 查到旧值回填 → 写线程更新DB → 缓存是旧值（不一致）。发生概率低（读要比写快）。</li>
      </ul>
      <p><strong>3. 延迟双删</strong></p>
      <p>解决上述问题：删缓存 → 更新 DB → <strong>延迟一段时间（如 500ms）再删一次缓存</strong>。第二次删清掉并发读回填的旧值。</p>
      <pre><code>deleteCache(key);      // 1. 先删
updateDB(data);        // 2. 更新DB
sleep(500ms);          // 3. 延迟
deleteCache(key);      // 4. 再删</code></pre>
      <p>缺点：延迟时间难定（要大于读回填耗时）。</p>
      <p><strong>4. 消息队列 + Canal（推荐，最终一致）</strong></p>
      <p>不主动删缓存，而是用 Canal 订阅 MySQL binlog，DB 变更时 Canal 发消息到 MQ，消费者收到后删缓存。</p>
      <p>优点：解耦（业务代码不管缓存）、保证最终一致（binlog 顺序可靠）。缺点：引入额外组件，有延迟。</p>
      <p><strong>5. 强一致性方案（性能差）</strong></p>
      <ul>
        <li>分布式锁：更新时锁住 key，读也加锁（串行化）。</li>
        <li>双写事务（DB + 缓存同一事务，但 Redis 不支持 XA）。</li>
        <li>串行化代价高，一般不追求强一致。</li>
      </ul>
      <p><strong>6. 实际建议</strong></p>
      <ul>
        <li>大部分场景：Cache Aside（先DB后删缓存）+ 缓存设过期（兜底）。</li>
        <li>高一致要求：Cache Aside + 延迟双删 或 Canal 异步删。</li>
        <li>不强求强一致，接受"最终一致 + 过期兜底"。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>Cache Aside（先更新DB再删缓存，删除幂等）。并发不一致用延迟双删。强一致用 Canal 订阅binlog异步删缓存（最终一致）。强一致用分布式锁（性能差）。一般是最终一致+过期兜底。</p>`},
