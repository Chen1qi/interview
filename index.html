  {c:"集合",d:"★★★",q:"HashMap 的 put 完整流程是怎样的？",
   a:`<p>JDK 1.8 的 put 流程：</p>
      <ol>
        <li>先算 key 的 hash（扰动：<code>hash = (h=key.hashCode()) ^ (h&gt;&gt;&gt;16)</code>）。</li>
        <li>如果数组是空的，先初始化（默认容量 16）。</li>
        <li>用 <code>(n-1) &amp; hash</code> 算出桶下标，如果桶是空的，直接放进去。</li>
        <li>如果桶不空，判断第一个节点的 key 是否相等（equals），相等就覆盖 value。</li>
        <li>不相等就看是链表还是红黑树：链表就尾插（同时判断长度 ≥8 要转树），红黑树就按树的方式插入。</li>
        <li>插入后检查元素总数是否超过阈值（容量×0.75），超过就扩容。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. hash 计算（扰动）</strong></p>
      <p><code>static final int hash(Object key) { int h; return (key==null)?0:(h=key.hashCode())^(h&gt;&gt;&gt;16); }</code>。null 的 hash 是 0。高 16 位异或低 16 位，让高位也参与下标计算。</p>
      <p><strong>2. 完整 putVal 流程（源码级）</strong></p>
      <ol>
        <li>数组为空先 resize 初始化（懒初始化，默认 16）。</li>
        <li>算桶下标 <code>i = (n-1) &amp; hash</code>（位运算替代取模，要求 n 是 2 的幂）。</li>
        <li><strong>桶为空</strong>：直接 newNode 放进去。</li>
        <li><strong>桶不空</strong>：
          <ul>
            <li>首节点 key equals 相等 → 记录 oldValue，覆盖 value（put 是替换）。</li>
            <li>首节点是 TreeNode（红黑树）→ 调用 putTreeVal 树插入。</li>
            <li>否则遍历链表：找到相等的 key 就覆盖；找不到就尾插新节点。链表长度 ≥8 时调 treeifyBin（数组长度&lt;64 时先扩容，≥64 才树化）。</li>
          </ul>
        </li>
        <li>++modCount，++size &gt; threshold 触发 resize 扩容。</li>
        <li>返回 oldValue（之前有这个 key）或 null。</li>
      </ol>
      <p><strong>3. 树化条件</strong></p>
      <p>链表长度 ≥8 <strong>且</strong> 数组长度 ≥64 才转红黑树。数组长度&lt;64 时优先扩容（不树化）。退化阈值 6（&lt;=6 退化回链表）。</p>
      <p><strong>4. 为什么 1.8 改尾插</strong></p>
      <p>1.7 头插在扩容时可能成环导致死循环；尾插且 1.8 扩容用 e.hash&amp;oldCap 判断新位置，不成环。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>hash 扰动 → 数组为空先初始化 → (n-1)&hash 定位桶 → 空桶直接放 → 非空比 equals 覆盖或尾插链表/红黑树 → 链表≥8且数组≥64 树化 → size 超阈值（容量×0.75）扩容。</p>`},
  {c:"集合",d:"★★★",q:"HashMap 的扩容机制是怎样的？",
   a:`<p>当元素数量超过<strong>阈值</strong>（容量 × 负载因子 0.75）时触发扩容：</p>
      <ol>
        <li>容量翻倍（newCap = oldCap &lt;&lt; 1）。</li>
        <li>新建一个 2 倍大的数组。</li>
        <li>把所有元素重新 hash 分配到新数组（rehash）。</li>
      </ol>
      <p>JDK 1.8 的优化：因为容量是 2 的幂，元素要么留在原位置，要么移到"原位置+旧容量"的位置，不用重新算 hash，只需判断 <code>e.hash &amp; oldCap</code> 是 0 还是 1，迁移效率高。</p>
      <blockquote>扩容是很耗时的操作（要搬运所有元素），所以如果能预估数据量，建议初始化时指定容量，避免频繁扩容。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 触发时机</strong></p>
      <p>put 后 size &gt; threshold（threshold = capacity × loadFactor）时触发 resize。也可在树化时数组长度&lt;64 触发扩容（优先扩容而非树化）。</p>
      <p><strong>2. 扩容大小</strong></p>
      <p>容量翻倍：newCap = oldCap &lt;&lt; 1（左移1位）。newThr = newCap × 0.75。最大容量 1&lt;&lt;30（2^30）。</p>
      <p><strong>3. 1.7 的 rehash（重新计算下标）</strong></p>
      <p>1.7 对每个元素重新算 hash & index，要遍历所有元素重新定位。扩容是 O(n) 全量搬运。</p>
      <p><strong>4. 1.8 的优化（JDK 加分项）</strong></p>
      <p>容量是 2 的幂，扩容后元素位置有规律：</p>
      <pre><code>// 判断元素新位置
if ((e.hash &amp; oldCap) == 0) {
    // 留在原下标
} else {
    // 新下标 = 原下标 + oldCap
}</code></pre>
      <p>原理：容量翻倍后，n-1 多了一个高位 1（如 15=1111 → 31=11111），hash 在这个新高位是 0 则留原位，是 1 则移到原位+oldCap。无需重新算 hash，分两组迁移即可。</p>
      <p>1.8 还把链表按高低位拆成两组（loHead/loTail、hiHead/hiTail）迁移，保持顺序，避免成环。</p>
      <p><strong>5. 性能影响与优化</strong></p>
      <ul>
        <li>扩容是 O(n)，要拷贝所有元素，会卡顿。</li>
        <li>优化：预估数据量用 <code>new HashMap&lt;&gt;(expectedSize / 0.75 + 1)</code> 或 Guava Maps.newHashMapWithExpectedSize 预分配，避免扩容。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>size 超阈值（容量×0.75）触发扩容，容量翻倍。1.7 重新 hash 全量迁移；1.8 用 e.hash&amp;oldCap 判断，元素要么留原位要么移到原位+oldCap，拆两组迁移高效且不成环。</p>`},
  {c:"集合",d:"★★",q:"HashMap 的 hash 扰动函数为什么是 (h ^ h>>>16)？",
   a:`<p>扰动函数 <code>(h = key.hashCode()) ^ (h &gt;&gt;&gt; 16)</code> 的作用：把 hashCode 的高 16 位和低 16 位<strong>异或</strong>一下，让高位也参与到下标计算中。</p>
      <p>因为算桶下标用的是 <code>(n-1) &amp; hash</code>，n 一般是 16，那 n-1 就是 15（低 4 位是 1），如果 hash 高位变化大、低位都一样，下标就会全挤在一起。扰动一下能让 hash 分布更均匀，减少哈希冲突。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 扰动函数源码</strong></p>
      <pre><code>static final int hash(Object key) {
    int h;
    return (key == null) ? 0 : (h = key.hashCode()) ^ (h &gt;&gt;&gt; 16);
}</code></pre>
      <p>把 hashCode 高 16 位无符号右移，再和原 hashCode 异或，让高位信息"混入"低位。</p>
      <p><strong>2. 为什么要扰动</strong></p>
      <p>桶下标计算：<code>index = (n-1) &amp; hash</code>。当 n=16 时，n-1=15（二进制 1111），<strong>只用了 hash 的低 4 位</strong>决定下标。</p>
      <p>如果 hashCode 的高位变化大、低位相同（比如一组对象 hashCode 高位不同低位都是 0），所有元素会落到同一桶，退化为链表，性能从 O(1) 变 O(n)。扰动让高位参与运算，分布更均匀。</p>
      <p><strong>3. 为什么是异或而不是与/或</strong></p>
      <p>异或能保证 0/1 的混合均匀（0^0=0, 0^1=1, 1^1=0）；与运算（&amp;）会让结果偏向 0，或运算（|）偏向 1，分布不均。</p>
      <p><strong>4. 为什么只扰动一次（高位右移16）</strong></p>
      <p>int 是 32 位，右移 16 让高半部分和低半部分充分混合。再多次扰动收益递减，性能开销增加不划算（时间/质量权衡）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>hash 扰动是 hashCode ^ (hashCode&gt;&gt;&gt;16)，让高位和低位混合。因为下标用 (n-1)&hash 只用到低位，扰动后避免高位不同低位相同的 hash 冲突，分布更均匀。</p>`},
  {c:"集合",d:"★★",q:"HashMap 的负载因子为什么是 0.75？容量为什么是 2 的幂？",
   a:`<p><strong>负载因子 0.75</strong>：是时间和空间的折衷。太小（如 0.5）空间浪费多；太大（如 1）冲突多、查询慢。0.75 是经过统计学计算（泊松分布）和实测的平衡点。</p>
      <p><strong>容量是 2 的幂</strong>：这样算桶下标时能用位运算 <code>(n-1) &amp; hash</code> 替代取模 <code>hash % n</code>，位运算比取模快得多。而且扩容时元素分布有规律（要么留原位要么+oldCap）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 负载因子 0.75 的依据</strong></p>
      <ul>
        <li><strong>空间 vs 时间折衷</strong>：负载因子小（如 0.5）→ 空间利用率低（很早就扩容）；大（如 1）→ 冲突多，链表长查询慢。0.75 是平衡点。</li>
        <li><strong>泊松分布概率</strong>：HashMap 源码注释里，理想 hash 下桶中节点数服从泊松分布，0.75 负载因子下，桶里 8 个以上节点的概率约 0.00000006（千万分之一），所以选 8 作为树化阈值。</li>
        <li><strong>数学性质</strong>：0.75 = 3/4，threshold = capacity × 0.75 在容量是 2 的幂时总是整数（如 16×0.75=12）。</li>
      </ul>
      <p><strong>2. 负载因子可调</strong></p>
      <p>new HashMap&lt;&gt;(initCap, loadFactor) 可指定。调大（如 1）省空间但查询慢；调小（如 0.5）查询快但费空间。一般默认 0.75，特殊场景可调。</p>
      <p><strong>3. 容量为什么是 2 的幂</strong></p>
      <ul>
        <li><strong>位运算代替取模</strong>：index = (n-1) & hash 替代 hash % n。当 n 是 2 的幂时，n-1 的二进制全是 1（如 16-1=1111），位与等价于取模，但快得多（CPU 位运算 vs 除法）。</li>
        <li><strong>扩容分布规律</strong>：容量翻倍后元素要么留原位要么移到原位+oldCap（e.hash&oldCap 判断），迁移高效。</li>
        <li><strong>均匀分布</strong>：n-1 全 1 时，hash 的每一位都参与下标计算，分布均匀。</li>
      </ul>
      <p><strong>4. tableSizeFor（保证容量是 2 的幂）</strong></p>
      <p>new HashMap&lt;&gt;(100) 实际容量不是 100，而是 tableSizeFor 算出的 ≥100 的最小 2 的幂 = 128。源码用位运算把最高位以下全置 1 再 +1。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>负载因子 0.75 是空间时间折衷（泊松分布下冲突率低）。容量是 2 的幂是为了用 (n-1)&hash 位运算代替取模，且扩容时元素分布有规律。指定初始容量时 tableSizeFor 会向上取最近的 2 的幂。</p>`},
  {c:"集合",d:"★★",q:"ConcurrentHashMap 的 put 流程（JDK 1.8）？",
   a:`<p>1.8 的 ConcurrentHashMap 用 CAS + synchronized 实现并发安全：</p>
      <ol>
        <li>算 hash，定位桶下标。</li>
        <li>如果桶是空的，用 <strong>CAS</strong> 把节点放进去（无锁，快）。</li>
        <li>如果 CAS 失败（有人竞争）或桶不空，<strong>synchronized 锁住桶的头节点</strong>，往链表或红黑树里插。</li>
        <li>判断是否要转红黑树、是否要扩容。</li>
      </ol>
      <p>锁粒度是<strong>单个桶的头节点</strong>，不同桶之间互不影响，并发度很高。get 完全无锁（volatile 读）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. putVal 完整流程（源码级）</strong></p>
      <pre><code>final V putVal(K key, V value, boolean onlyIfAbsent) {
    int hash = spread(key.hashCode());  // 扰动，类似HashMap
    for (Node&lt;K,V&gt;[] tab = table;;) {
        Node&lt;K,V&gt; f; int n, i, fh;
        if (tab == null || (n=tab.length)==0)
            tab = initTable();  // 1. 数组为空，用CAS自旋初始化
        else if ((f = tabAt(tab, i = (n-1)&hash)) == null) {
            // 2. 桶为空，CAS直接放入（无锁）
            if (casTabAt(tab, i, null, new Node&lt;&gt;(hash,key,value,null))) break;
        }
        else if ((fh = f.hash) == MOVED) {
            tab = helpTransfer(tab, f);  // 3. 正在扩容，帮忙迁移
        }
        else {
            synchronized (f) {  // 4. 锁住桶头节点
                if (tabAt(tab, i) == f) {  // 二次检查
                    // 链表或红黑树插入...
                }
            }
            if (binCount != 0) {
                if (binCount &gt;= TREEIFY_THRESHOLD) treeifyBin(tab, i);  // 树化
                break;
            }
        }
    }
    addCount(1L, binCount);  // 5. 用CounterCell分槽计数
    return null;
}</code></pre>
      <p><strong>2. 关键并发控制</strong></p>
      <ul>
        <li><strong>空桶用 CAS</strong>（casTabAt）：无锁竞争，性能高。CAS 失败则 for 循环重试。</li>
        <li><strong>非空桶用 synchronized(头节点)</strong>：锁粒度细到单桶，不同桶并发度高。锁前二次检查（tabAt==f）防 ABA。</li>
        <li><strong>扩容期间帮助迁移</strong>：检测到 MOVED 节点（ForwardingNode）调 helpTransfer 多线程协助扩容。</li>
      </ul>
      <p><strong>3. get 为什么无锁</strong></p>
      <p>Node 的 val 和 next 是 volatile，保证可见性。读取时直接 volatile 读，无需加锁。数组引用也是 volatile（tabAt 用 Unsafe 的 volatile 语义）。</p>
      <p><strong>4. size 怎么统计</strong></p>
      <p>用 LongAdder 思想：baseCount + CounterCell[] 分槽计数。竞争小时用 baseCount CAS，竞争大时分散到多个槽，最后 sumCount 求和。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>hash 定位桶 → 空桶 CAS 放入 → 非空桶 synchronized 锁头节点 → 插入链表/红黑树 → addCount 计数判断扩容。get 无锁（volatile 读）。锁粒度是桶头节点，并发度高。</p>`},
  {c:"集合",d:"★★",q:"CopyOnWriteArrayList 的原理？适合什么场景？",
   a:`<p><strong>原理</strong>：写时复制。每次写操作（add/set/remove），都<strong>复制一份新数组</strong>，写完再把引用指向新数组。读操作直接读当前数组，不加锁。</p>
      <p><strong>优点</strong>：读完全无锁，性能极高，且读到的永远是最终一致的结果。</p>
      <p><strong>缺点</strong>：写操作开销大（要复制整个数组）、内存占用高、弱一致性（读可能读到旧数据）。</p>
      <blockquote><strong>适合场景</strong>：读多写少，比如监听器列表、配置缓存。不适合写频繁的场景。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心原理：写时复制（Copy-On-Write）</strong></p>
      <p>内部用一个 volatile 数组存数据（Object[] array）。读操作直接读 array（volatile 读，无锁）。写操作加 ReentrantLock，<strong>先复制一份新数组，改完把 array 引用指向新数组</strong>。</p>
      <pre><code>public boolean add(E e) {
    final ReentrantLock lock = this.lock;
    lock.lock();
    try {
        Object[] elements = getArray();
        int len = elements.length;
        Object[] newElements = Arrays.copyOf(elements, len + 1);  // 复制
        newElements[len] = e;  // 写入新数组
        setArray(newElements);  // 指向新数组
        return true;
    } finally { lock.unlock(); }
}</code></pre>
      <p><strong>2. 为什么读无锁还安全</strong></p>
      <p>array 是 volatile，写完后 setArray 保证对其他线程立即可见。读线程读到的要么是旧数组（一致性弱但安全），要么是新数组，不会读到中间状态。</p>
      <p><strong>3. 优缺点</strong></p>
      <ul>
        <li><strong>优点</strong>：读性能极高（无锁无 CAS），读多写少场景无敌；线程安全。</li>
        <li><strong>缺点</strong>：① 写开销大（每次复制整个数组 O(n)）；② 内存占用高（写时双份数据）；③ 弱一致性（读可能读到旧数据）；④ 不适合实时数据。</li>
      </ul>
      <p><strong>4. 迭代器特性</strong></p>
      <p>迭代器创建时拷贝一份当前数组引用，遍历的是<strong>快照</strong>。遍历期间其他线程的修改不影响迭代器，也不会抛 ConcurrentModificationException（fail-safe）。但也意味着读不到最新数据。</p>
      <p><strong>5. 适用场景</strong></p>
      <ul>
        <li>读远多于写：监听器/观察者列表、配置缓存、白名单。</li>
        <li>不适合写频繁、数据量大（写性能差 + 内存爆炸）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>CopyOnWriteArrayList 写时复制：写加锁复制整个数组再换引用，读无锁直接 volatile 读。读多写少场景性能极佳，弱一致性。适合监听器列表、配置，不适合写频繁。</p>`},

  // ============ 并发补充 ============
  {c:"并发",d:"★★★",q:"线程池的工作流程（执行任务的过程）是怎样的？",
   a:`<p>一个任务提交给线程池后的处理流程：</p>
      <ol>
        <li>如果<strong>核心线程数没满</strong>，创建核心线程执行任务。</li>
        <li>如果核心线程满了，把任务放进<strong>阻塞队列</strong>排队。</li>
        <li>如果队列也满了，且<strong>没到最大线程数</strong>，创建非核心线程执行。</li>
        <li>如果线程数到了最大值还放不下，执行<strong>拒绝策略</strong>。</li>
      </ol>
      <blockquote>口诀：核心 → 队列 → 最大 → 拒绝。注意顺序：不是先开满最大线程再进队列，而是<strong>先填满队列再扩容</strong>，这点经常考。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. execute 源码逻辑（核心→队列→最大→拒绝）</strong></p>
      <pre><code>public void execute(Runnable cmd) {
    int c = ctl.get();
    if (workerCountOf(c) &lt; corePoolSize) {
        if (addWorker(cmd, true))  // 1. 核心线程数未满，新建核心线程
            return;
    }
    if (isRunning(c) && workQueue.offer(cmd)) {  // 2. 入队
        if (...) reject(cmd);  // 二次检查，池已停则拒绝
    }
    else if (!addWorker(cmd, false))  // 3. 队列满，扩到非核心线程
        reject(cmd);  // 4. 还满，拒绝
}</code></pre>
      <p><strong>2. 为什么先队列再扩容（关键设计）</strong></p>
      <p>因为创建线程开销大（系统调用），而任务排队是廉价的对象入队。所以默认策略是优先用少量核心线程 + 队列缓冲，扛不住才扩容线程。这是性能和资源使用的权衡。</p>
      <p><strong>3. ctl 的设计</strong></p>
      <p>ThreadPoolExecutor 用一个 AtomicInteger ctl 同时存"线程池状态（高3位）"和"线程数（低29位）"，CAS 保证原子更新。</p>
      <p><strong>4. submit vs execute</strong></p>
      <ul>
        <li>execute(Runnable)：无返回值，异常直接抛给 UncaughtExceptionHandler。</li>
        <li>submit(Runnable/Callable)：返回 Future，异常封装在 Future 里（get 时抛 ExecutionException）。</li>
      </ul>
      <p><strong>5. 不同线程池的流程差异</strong></p>
      <ul>
        <li>FixedThreadPool：核心=最大，无界队列 → 任务全排队，永不扩容永不拒绝（易 OOM）。</li>
        <li>CachedThreadPool：核心0、最大MAX、SynchronousQueue → 来任务就建新线程，空闲回收。</li>
        <li>ScheduledThreadPool：延时/周期执行，用 DelayedWorkQueue。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>核心线程未满→建核心线程；满了→入队；队列满→扩到最大线程；最大满→拒绝。注意是先满队列再扩容。submit 返回 Future，execute 无返回值。</p>`},
  {c:"并发",d:"★★",q:"线程池的大小（线程数）应该怎么设置？",
   a:`<p>分两类任务：</p>
      <ul>
        <li><strong>CPU 密集型</strong>（计算多，如加密、压缩）：线程数 = CPU 核心数 + 1（+1 是为了在某个线程偶尔阻塞时有替补）。</li>
        <li><strong>IO 密集型</strong>（网络、磁盘等待多，如 Web 请求、数据库查询）：线程数 = CPU 核心数 × (1 + 平均等待时间/平均计算时间)，一般凭经验设 2~10 倍 CPU 核数。</li>
      </ul>
      <p>实际中要<strong>压测</strong>调整，没有万能公式。混合型任务建议拆成两个线程池分别处理。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 经典公式（Brian Goetz）</strong></p>
      <p>线程数 = CPU 核心数 × (1 + 平均等待时间 / 平均计算时间) = CPU 核心数 × (1 + 阻塞系数)。</p>
      <p>本质：让 CPU 不闲着——线程在 IO 等待时让出 CPU 给其他线程用，线程数取决于"等待/计算"比例。</p>
      <p><strong>2. CPU 密集型（纯计算）</strong></p>
      <p>线程数 = N+1（N=CPU 逻辑核数）。因为基本不阻塞，多线程反而增加切换开销。+1 是为了偶发的上下文切换/缺页中断时有线程顶上。</p>
      <p><strong>3. IO 密集型（网络/磁盘/DB）</strong></p>
      <p>线程数 = 2N 或更高（阻塞系数高）。实际靠压测，一般 2N~10N。线程在 IO 时阻塞，CPU 闲着，所以可以多开线程。</p>
      <p><strong>4. 混合型任务</strong></p>
      <p>拆成两个线程池：一个 CPU 密集（少线程）、一个 IO 密集（多线程），避免互相影响。</p>
      <p><strong>5. 获取 CPU 核数</strong></p>
      <p>Runtime.getRuntime().availableProcessors()。注意容器环境（Docker）要正确识别（Java 10+ 支持容器 cgroup 限制）。</p>
      <p><strong>6. 动态调整</strong></p>
      <p>美团开源的 DynamicTp、部分场景用 setCorePoolSize 动态调整。配合监控（队列长度、活跃线程数、拒绝次数）调优。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>CPU 密集型线程数 = N+1；IO 密集型 = 2N（或公式 N×(1+等待/计算)）。本质是让 CPU 不闲着。实际要压测，混合任务拆分线程池。</p>`},
  {c:"并发",d:"★★",q:"常见的阻塞队列有哪些？分别什么特点？",
   a:`<ul>
        <li><strong>ArrayBlockingQueue</strong>：基于数组的有界队列，FIFO。</li>
        <li><strong>LinkedBlockingQueue</strong>：基于链表，默认是无界的（Integer.MAX_VALUE）， Executors.newFixedThreadPool 用它——坑点所在。</li>
        <li><strong>SynchronousQueue</strong>：不存元素，每个 put 必须等一个 take。Executors.newCachedThreadPool 用它。</li>
        <li><strong>PriorityBlockingQueue</strong>：支持优先级的无界队列。</li>
        <li><strong>DelayQueue</strong>：延时队列，元素到时间才能取（定时任务用）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. BlockingQueue 核心方法</strong></p>
      <ul>
        <li>抛异常：add/remove/element（满了/空了抛异常）。</li>
        <li>返回特殊值：offer/poll/peek（满了/空了返回 false/null）。</li>
        <li>阻塞：put/take（满了/空了阻塞等待）。</li>
        <li>超时：offer(timeout)/poll(timeout)。</li>
      </ul>
      <p><strong>2. 常见实现详解</strong></p>
      <ul>
        <li><strong>ArrayBlockingQueue</strong>：基于数组的有界队列（构造必须指定容量），FIFO。一把 ReentrantLock + 两个 Condition（notFull/notEmpty）。生产/消费用同一把锁。</li>
        <li><strong>LinkedBlockingQueue</strong>：基于链表，<strong>默认无界（Integer.MAX_VALUE）</strong>，可指定容量。两把锁（putLock/takeLock）分离生产和消费，吞吐量比 Array 高。Executors.newFixedThreadPool 用它（无界，OOM 隐患）。</li>
        <li><strong>SynchronousQueue</strong>：容量 0，不存元素。每个 put 必须等一个 take（直接交付）。Executors.newCachedThreadPool 用它。适合"传递"而非"缓冲"。</li>
        <li><strong>PriorityBlockingQueue</strong>：支持 Comparator 优先级的无界队列（基于堆）。任务有优先级时用。</li>
        <li><strong>DelayQueue</strong>：延时队列，元素到 delay 时间才能被 take。元素实现 Delayed。定时任务（ScheduledThreadPool）底层用 DelayedWorkQueue（类似）。</li>
        <li><strong>LinkedTransferQueue</strong>：无界，transfer 方法直接交付（生产者阻塞直到消费者取）。</li>
      </ul>
      <p><strong>3. 在线程池中的应用</strong></p>
      <ul>
        <li>FixedThreadPool/SingleThread：LinkedBlockingQueue（无界）。</li>
        <li>CachedThreadPool：SynchronousQueue（直接交接）。</li>
        <li>ScheduledThreadPool：DelayedWorkQueue。</li>
        <li>自定义：建议 ArrayBlockingQueue（有界，防 OOM）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Array（有界一把锁）、Linked（默认无界两把锁分离）、Synchronous（不存直接交付）、Priority（优先级无界堆）、Delay（延时取）。Fixed 用 Linked 无界易 OOM，Cached 用 Synchronous。</p>`},
  {c:"并发",d:"★★★",q:"sleep() 和 wait() 的区别？",
   a:`<table><tr><th></th><th>sleep</th><th>wait</th></tr>
      <tr><td>所属</td><td>Thread 类</td><td>Object 类</td></tr>
      <tr><td>释放锁</td><td><strong>不释放</strong></td><td><strong>释放锁</strong></td></tr>
      <tr><td>使用位置</td><td>任意</td><td>必须在 synchronized 块里</td></tr>
      <tr><td>唤醒方式</td><td>时间到 / 中断</td><td>notify/notifyAll/超时</td></tr></table>
      <blockquote>核心区别：sleep 是抱着锁睡，wait 是放下锁等。wait/notify 用于线程间通信，sleep 就是单纯暂停。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 所属不同</strong></p>
      <p>sleep 是 Thread 类的静态方法；wait 是 Object 的实例方法（每个对象都有）。所以 wait/notify 是和对象 monitor 绑定的。</p>
      <p><strong>2. 是否释放锁（核心区别）</strong></p>
      <p>sleep <strong>不释放锁</strong>（抱着锁睡）；wait <strong>释放锁</strong>（放下锁等待）。所以 sleep 期间其他线程拿不到这个锁，wait 期间可以。</p>
      <p><strong>3. 使用位置</strong></p>
      <p>sleep 任意位置都能调；wait 必须在 synchronized 块里（持有 monitor），否则抛 IllegalMonitorStateException。</p>
      <p><strong>4. 唤醒方式</strong></p>
      <p>sleep：时间到或被 interrupt 中断（抛 InterruptedException）；wait：被 notify/notifyAll 唤醒、超时、或被中断。</p>
      <p><strong>5. 状态</strong></p>
      <p>sleep 进入 TIMED_WAITING；wait(无参)进入 WAITING，wait(ms)进入 TIMED_WAITING。</p>
      <p><strong>6. wait 的底层</strong></p>
      <p>wait 调用时：线程<strong>释放 monitor 锁</strong>，进入该对象的 _waitSet 等待；被 notify 移到 _entryList，<strong>重新竞争锁</strong>后才继续执行 wait 之后的代码。</p>
      <p><strong>7. 注意事项</strong></p>
      <ul>
        <li>wait/notify 应放在 while 循环里（防止虚假唤醒）。</li>
        <li>LockSupport.park/unpark 是更现代的线程阻塞工具（先 unpark 后 park 不死锁，wait 必须先 notify）。</li>
      </ul>
      <p><strong>8. 面试标准答法</strong></p>
      <p>sleep 是 Thread 静态方法不释放锁任意位置用；wait 是 Object 方法释放锁必须 synchronized 内用。sleep 抱锁睡，wait 放锁等用于线程通信。</p>`},
  {c:"并发",d:"★★",q:"start() 和 run() 的区别？能重复调用 start() 吵？",
   a:`<p><strong>start()</strong> 会<strong>启动一个新线程</strong>并自动调用 run()；直接调用 <strong>run()</strong> 只是普通方法调用，<strong>不会新建线程</strong>，是在当前线程里同步执行的。</p>
      <p>所以要让代码在多线程下运行，必须调 start()，不能直接调 run()。</p>
      <blockquote>start() <strong>不能重复调用</strong>，线程启动后再调会抛 IllegalThreadStateException。但 run() 可以当普通方法重复调用。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. start 的作用</strong></p>
      <p>start() 做两件事：① 把线程状态从 NEW 改为 RUNNABLE；② 调用本地方法 start0() 让 JVM 创建操作系统线程，新线程会自动调用 run()。所以 start() 才是真正启动新线程。</p>
      <p><strong>2. run 的作用</strong></p>
      <p>run() 就是普通的方法，包含你要执行的逻辑。直接调 run() 不会新建线程，是在当前线程（调用者线程）里同步执行，跟普通方法调用没区别。</p>
      <p><strong>3. start0 的 JVM 绑定</strong></p>
      <p>start0 是 native 方法，JVM 实现里会 pthread_create（Linux）创建系统线程，把 Java 线程对象和系统线程绑定，最终在新线程里执行 run()。</p>
      <p><strong>4. 为什么不能重复 start</strong></p>
      <p>Thread 内部有 threadStatus 记录状态。start() 检查如果不是 NEW 状态，抛 IllegalThreadStateException。一个线程对象只能 start 一次，重复使用要 new 新的 Thread。</p>
      <p><strong>5. run 可以重复调用</strong></p>
      <p>run() 是普通方法，可以像普通方法一样重复调用（虽然没意义）。也能直接被其他对象调用（如果是 public）。</p>
      <p><strong>6. 常见坑：误调 run()</strong></p>
      <p>新手常写 <code>thread.run()</code> 以为是多线程，实际是单线程同步执行。必须 start() 才是多线程。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>start 启动新线程并自动调 run；直接调 run 是普通方法调用不新建线程。start 只能调一次（重复抛 IllegalThreadStateException），run 可重复调。多线程必须 start。</p>`},
  {c:"并发",d:"★★",q:"什么是 happens-before 规则？",
   a:`<p>happens-before 是 Java 内存模型（JMM）规定的一组<strong>前操作对后操作可见</strong>的规则。意思是：如果 A happens-before B，那 A 的操作结果对 B 一定可见。</p>
      <p>主要的几条规则：</p>
      <ul>
        <li><strong>程序顺序规则</strong>：同一线程内，前面的操作 happens-before 后面的。</li>
        <li><strong>锁规则</strong>：unlock happens-before 后续对同一个锁的 lock。</li>
        <li><strong>volatile 规则</strong>：对 volatile 变量的写 happens-before 后续的读。</li>
        <li><strong>线程启动规则</strong>：start() happens-before 线程内的所有操作。</li>
        <li><strong>传递性</strong>：A happens-before B，B happens-before C，则 A happens-before C。</li>
      </ul>
      <blockquote>作用：让开发者不用懂底层内存屏障，只要按规则写代码，就能保证多线程下的内存可见性。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. happens-before 是什么</strong></p>
      <p>JMM 定义的偏序关系。如果 A happens-before B，那么 A 的操作结果对 B 可见（内存可见性保证），且 A 的执行顺序在 B 前（有序性）。</p>
      <p>本质：JMM 通过 happens-before 向开发者屏蔽了底层内存屏障，让程序员按规则写代码就能保证可见性。</p>
      <p><strong>2. 八大规则（JLS §17.4.5）</strong></p>
      <ol>
        <li><strong>程序顺序规则</strong>：同一线程内，按代码顺序前面的 HB 后面的（as-if-serial，单线程语义不变）。</li>
        <li><strong>监视器锁规则</strong>：一个锁的 unlock HB 后续对同一个锁的 lock。</li>
        <li><strong>volatile 规则</strong>：对 volatile 字段的写 HB 后续对它的读。</li>
        <li><strong>线程启动规则</strong>：主线程 A 调 B.start()，A 的操作 HB B 线程内的任意操作。</li>
        <li><strong>线程终止规则</strong>：线程 B 的所有操作 HB 主线程 A 检测到 B 终止（B.join() 返回、B.isAlive()==false）。</li>
        <li><strong>中断规则</strong>：thread.interrupt() HB 被中断线程检测到中断（抛 InterruptedException）。</li>
        <li><strong>对象终结规则</strong>：对象的构造函数执行结束 HB 它的 finalize() 开始。</li>
        <li><strong>传递性</strong>：A HB B，B HB C，则 A HB C。</li>
      </ol>
      <p><strong>3. 为什么需要 happens-before</strong></p>
      <p>多线程下有可见性问题（缓存）、有序性问题（重排序）。开发者如果直接管内存屏障太复杂，happens-before 提供了"高阶规则"，只要遵守就能保证正确性。</p>
      <p><strong>4. 典型应用</strong></p>
      <ul>
        <li>volatile：写 HB 读，保证可见。</li>
        <li>synchronized：unlock HB lock，保证锁内修改对下个获锁线程可见。</li>
        <li>线程启动：start 前的初始化对子线程可见。</li>
        <li>线程 join：子线程的修改对 join 后的父线程可见。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>happens-before 是 JMM 定义的可见性+有序性规则：A HB B 则 A 对 B 可见。八大规则：程序顺序、锁、volatile、线程启动/终止、中断、终结、传递性。开发者遵守这些规则就能保证多线程正确性，不用管底层内存屏障。</p>`},
  {c:"并发",d:"★★",q:"ReentrantReadWriteLock 读写锁是什么？",
   a:`<p>读写锁把锁分成<strong>读锁和写锁</strong>，规则是：</p>
      <ul>
        <li><strong>读读共享</strong>：多个线程可以同时读（读不冲突）。</li>
        <li><strong>读写互斥</strong>：读和写不能同时。</li>
        <li><strong>写写互斥</strong>：写和写不能同时。</li>
      </ul>
      <p>适合<strong>读多写少</strong>的场景（比如缓存），读多的时候并发度高很多。</p>
      <blockquote>注意：读写锁支持<strong>锁降级</strong>（持有写锁时可以再获取读锁，然后释放写锁），但<strong>不支持锁升级</strong>（持有读锁时不能获取写锁，会死锁）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 读写锁的并发规则</strong></p>
      <ul>
        <li><strong>读读共享</strong>：多个线程可同时持有读锁。</li>
        <li><strong>读写互斥</strong>：有读锁时不能获取写锁，反之亦然。</li>
        <li><strong>写写互斥</strong>：写锁独占。</li>
      </ul>
      <p>读多写少场景（缓存、配置），读并发度高，性能远超独占锁。</p>
      <p><strong>2. 实现（基于 AQS）</strong></p>
      <p>AQS 的 state 是 int（32 位），读写锁拆成两部分：<strong>高 16 位表示读锁持有数（共享），低 16 位表示写锁重入数（独占）</strong>。再加一个 firstReader 和 cachedHoldCounter 记录读锁持有线程。</p>
      <p><strong>3. 公平 vs 非公平</strong></p>
      <ul>
        <li>公平：读锁也要排队，避免写饥饿。吞吐低。</li>
        <li>非公平（默认）：读锁可"插队"（读不互斥），但为避免写饥饿，有策略限制（如果队列首是写线程，读等待）。吞吐高。</li>
      </ul>
      <p><strong>4. 锁降级 vs 锁升级</strong></p>
      <ul>
        <li><strong>锁降级（允许）</strong>：持有写锁 → 获取读锁 → 释放写锁。这样在改完数据后还能安全地读，并让其他读线程看到。</li>
        <li><strong>锁升级（不允许，会死锁）</strong>：持有读锁 → 试图获取写锁。因为写锁要等其他所有读锁释放，而自己持有读锁不放，永久等不到 → 死锁。</li>
      </ul>
      <p><strong>5. StampedLock（Java 8 优化）</strong></p>
      <p>读写锁的升级版，引入<strong>乐观读</strong>：先乐观读（不加锁），读完校验 stamp 是否变化，没变直接用（性能高）；变了再升级为悲观读锁。吞吐比 ReentrantReadWriteLock 高，但不可重入、不支持 Condition，使用复杂。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>读写锁分读锁（共享）和写锁（独占），读读共享读写/写写互斥。基于 AQS，state 高16位读低16位写。支持锁降级（写→读）不支持锁升级（会死锁）。读多写少用，StampedLock 更高性能（乐观读）。</p>`},
  {c:"并发",d:"★★",q:"为什么阿里巴巴禁止用 Executors 创建线程池？",
   a:`<p>因为 Executors 提供的几个便捷方法都有 OOM 风险：</p>
      <ul>
        <li><strong>newFixedThreadPool / newSingleThreadExecutor</strong>：用的是 LinkedBlockingQueue，<strong>队列无界</strong>，任务堆积会 OOM。</li>
        <li><strong>newCachedThreadPool</strong>：最大线程数是 Integer.MAX_VALUE，<strong>线程数无上限</strong>，会创建大量线程导致 OOM。</li>
      </ul>
      <p>正确做法：用 <code>new ThreadPoolExecutor(...)</code> 手动创建，明确指定核心线程数、最大线程数、有界队列、拒绝策略，参数自己把控。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Executors 的隐患（阿里规约明确禁止）</strong></p>
      <ul>
        <li><strong>newFixedThreadPool(n) / newSingleThreadExecutor()</strong>：用 <strong>LinkedBlockingQueue（无界，Integer.MAX_VALUE）</strong>。任务堆积时队列无限增长 → <strong>java.lang.OutOfMemoryError: Java heap space</strong>。</li>
        <li><strong>newCachedThreadPool()</strong>：最大线程数 = <strong>Integer.MAX_VALUE</strong>，用 SynchronousQueue（不缓冲）。突发流量会创建大量线程 → <strong>OutOfMemoryError: unable to create new native thread</strong>（系统线程耗尽）。</li>
        <li><strong>newScheduledThreadPool(n)</strong>：最大线程数也是 Integer.MAX_VALUE，同样有风险。</li>
      </ul>
      <p><strong>2. 源码佐证</strong></p>
      <pre><code>public static ExecutorService newFixedThreadPool(int n) {
    return new ThreadPoolExecutor(n, n, 0L, TimeUnit.MILLISECONDS,
        new LinkedBlockingQueue&lt;Runnable&gt;());  // 无界队列！
}
public static ExecutorService newCachedThreadPool() {
    return new ThreadPoolExecutor(0, Integer.MAX_VALUE, 60L, TimeUnit.SECONDS,
        new SynchronousQueue&lt;Runnable&gt;());  // 最大线程 MAX_VALUE！
}</code></pre>
      <p><strong>3. 正确做法：手动 ThreadPoolExecutor</strong></p>
      <pre><code>new ThreadPoolExecutor(
    corePoolSize,
    maximumPoolSize,
    keepAliveTime, TimeUnit.SECONDS,
    new ArrayBlockingQueue&lt;&gt;(capacity),  // 必须有界
    new ThreadFactoryBuilder().setNameFormat("biz-pool-%d").build(),  // 命名
    new ThreadPoolExecutor.CallerRunsPolicy()  // 明确拒绝策略
);</code></pre>
      <p><strong>4. 自定义的好处</strong></p>
      <ul>
        <li>有界队列防 OOM。</li>
        <li>合理的最大线程数防系统崩溃。</li>
        <li>自定义线程名（线程池命名），方便排查（jstack 时能认出）。</li>
        <li>明确的拒绝策略（业务可处理的兜底）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Executors 的 Fixed/Single 用无界 LinkedBlockingQueue 易堆 OOM；Cached 最大线程 MAX_VALUE 易创建线程过多 OOM。阿里规约要求手动 new ThreadPoolExecutor，指定有界队列、合理线程数、命名线程、明确拒绝策略。</p>`},

  // ============ JVM 补充 ============
  {c:"JVM",d:"★★★",q:"方法区、永久代、元空间有什么区别？",
   a:`<ul>
        <li><strong>方法区</strong>：是 JVM 规范定义的一个逻辑区域，存类信息、常量、静态变量。和堆一样是线程共享的。</li>
        <li><strong>永久代（PermGen）</strong>：JDK 7 及以前，HotSpot 用永久代来实现方法区，大小固定容易 OOM。</li>
        <li><strong>元空间（Metaspace）</strong>：JDK 8 开始，永久代被移除，方法区改用<strong>元空间</strong>实现，<strong>用的是本地内存</strong>（不是 JVM 堆），大小受限于物理内存，不容易 OOM。</li>
      </ul>
      <blockquote>常量池也在变迁：JDK 7 字符串常量池从永久代移到堆，JDK 8 整个永久代消失改用元空间。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三者关系（规范 vs 实现）</strong></p>
      <ul>
        <li><strong>方法区（Method Area）</strong>：JVM 规范定义的<strong>逻辑区域</strong>，和堆一样线程共享。存类信息、常量池、静态变量、JIT 编译代码。规范没规定怎么实现。</li>
        <li><strong>永久代（PermGen）</strong>：HotSpot 对方法区的<strong>实现</strong>（JDK 7 及以前）。在堆中，大小固定（-XX:MaxPermSize），动态生成类多时易 OOM。</li>
        <li><strong>元空间（Metaspace）</strong>：JDK 8 起 HotSpot 对方法区的<strong>新实现</strong>，替代永久代。<strong>用本地内存</strong>（非 JVM 堆），大小受物理内存限制，不易 OOM（-XX:MaxMetaspaceSize 可限）。</li>
      </ul>
      <p>类比：方法区是"接口"，永久代/元空间是不同版本的"实现"。</p>
      <p><strong>2. 为什么废除永久代</strong></p>
      <ul>
        <li>永久代大小固定，动态生成类（CGLIB、Groovy）容易 OOM（PermGen space）。</li>
        <li>永久代 GC 效率低（和老年代绑在一起 Full GC）。</li>
        <li>其他 JVM（J9、JRockit）没有永久代概念，HotSpot 改用元空间统一规范。</li>
      </ul>
      <p><strong>3. 字符串常量池的变迁</strong></p>
      <ul>
        <li>JDK 6：字符串常量池在永久代。</li>
        <li><strong>JDK 7：字符串常量池移到堆</strong>（避免 intern 频繁 OOM，intern 时只存引用不复制）。</li>
        <li>JDK 8：永久代消失，常量池仍在堆。</li>
      </ul>
      <p><strong>4. 运行时常量池</strong></p>
      <p>class 文件有常量池（Class Constant Pool，编译期）。类加载后进入方法区的<strong>运行时常量池</strong>（动态，可运行时 intern 添加）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>方法区是规范（逻辑区域），永久代（JDK7-）和元空间（JDK8+）是 HotSpot 的实现。永久代在堆大小固定易 OOM，元空间用本地内存不易 OOM。字符串常量池 JDK7 移到堆。</p>`},
  {c:"JVM",d:"★★★",q:"哪些对象可以作为 GC Roots？",
   a:`<p>GC Roots 是可达性分析的<strong>起点</strong>，从它们出发能到达的对象都算存活。常见的 GC Roots 有：</p>
      <ul>
        <li>虚拟机<strong>栈</strong>中的局部变量（方法里的引用）。</li>
        <li><strong>静态变量</strong>（类的 static 字段）。</li>
        <li><strong>常量</strong>引用（常量池里的）。</li>
        <li>本地方法栈中 JNI 的<strong>全局引用</strong>。</li>
        <li>被 synchronized <strong>持有的对象</strong>。</li>
        <li>JVM 内部的引用（基本类型对应的 Class 对象、常驻异常对象、类加载器等）。</li>
      </ul>
      <blockquote>记忆：栈里的局部变量、静态属性、常量、JNI 引用、锁持有的对象。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. GC Roots 的定义</strong></p>
      <p>可达性分析的起点对象。GC 从 GC Roots 出发，沿引用链遍历，能到达的标记为存活，不可达的标记为死亡（垃圾）。</p>
      <p><strong>2. 可以作为 GC Roots 的对象（HotSpot）</strong></p>
      <ul>
        <li><strong>虚拟机栈中引用的对象</strong>：各个线程方法栈帧的局部变量表里的对象引用（正在执行的方法的参数、局部变量）。</li>
        <li><strong>方法区中类静态属性引用的对象</strong>：Java 类的 static 变量引用的对象。</li>
        <li><strong>方法区中常量引用的对象</strong>：如字符串常量池里的引用。</li>
        <li><strong>本地方法栈中 JNI 引用</strong>：native 方法引用的 Java 对象（全局引用、局部引用）。</li>
        <li><strong>Java 虚拟机内部引用</strong>：基本数据类型对应的 Class 对象、常驻异常对象（NullPointerException 实例等）、系统类加载器。</li>
        <li><strong>被 synchronized 持有的对象</strong>：当前被锁住的对象（monitor 的 owner）。</li>
        <li><strong>JMXBean、JVMTI、GC 相关</strong>：JVM 运行时的内部数据。</li>
      </ul>
      <p><strong>3. 为什么要这些做 Roots</strong></p>
      <p>这些都是<strong>当前活动</strong>的引用，是程序"还能用到"的对象入口。从它们出发可达的就是还在用的，不可达的就是垃圾。</p>
      <p><strong>4. 记忆口诀</strong></p>
      <p>栈中局部变量、静态属性、常量、JNI 引用、锁持有对象、JVM 内部引用。</p>
      <p><strong>5. 实际排查应用</strong></p>
      <p>MAT 分析内存泄漏时，"Path to GC Roots"就是看大对象是通过哪条引用链连到 GC Roots 的，找到持有者就找到泄漏源（用 exclude weak/soft references 排除弱软引用）。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>GC Roots 是可达性分析起点。包括：栈中局部变量、静态属性、常量、JNI 引用、synchronized 持有的对象、JVM 内部引用（Class、异常、类加载器）。从 Roots 可达的存活，不可达的回收。</p>`},
  {c:"JVM",d:"★★",q:"逃逸分析、标量替换、栈上分配是什么？",
   a:`<p>这是 JVM 的优化技术：</p>
      <ul>
        <li><strong>逃逸分析</strong>：分析一个对象会不会"逃出"当前方法或线程。</li>
        <li>如果一个对象<strong>不会逃逸</strong>，JVM 可以做进一步优化：
          <ul>
            <li><strong>标量替换</strong>：把对象拆成基本类型（标量），直接用局部变量代替，不创建对象。</li>
            <li><strong>栈上分配</strong>：对象分配在栈上而不是堆上，方法结束自动回收，不用 GC。</li>
            <li><strong>锁消除</strong>：如果是同步锁但对象不逃逸，直接去掉锁。</li>
          </ul>
        </li>
      </ul>
      <blockquote>好处：减少堆内存分配和 GC 压力。所以不是所有 new 出来的对象都在堆上，HotSpot 已经默认开启逃逸分析。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 逃逸分析（Escape Analysis）</strong></p>
      <p>分析对象的动态作用域：一个对象会不会"逃出"当前方法（方法返回它/赋给外部字段/传给其他方法）或"逃出"当前线程（被其他线程访问）。</p>
      <ul>
        <li><strong>方法逃逸</strong>：对象被方法返回、赋值给成员变量、传给其他方法。逃逸到方法外。</li>
        <li><strong>线程逃逸</strong>：对象被其他线程访问（赋值给 static、被共享）。</li>
        <li><strong>未逃逸</strong>：对象只在方法内使用，不外泄。</li>
      </ul>
      <p>HotSpot 默认开启逃逸分析（-XX:+DoEscapeAnalysis）。</p>
      <p><strong>2. 基于逃逸分析的优化</strong></p>
      <p>对象未逃逸时可做三种优化（C2 编译器）：</p>
      <ul>
        <li><strong>栈上分配（Stack Allocation）</strong>：对象分配在栈上而不是堆。方法结束栈帧销毁，对象自动回收，<strong>不需要 GC</strong>。减少堆压力和 GC 频率。</li>
        <li><strong>标量替换（Scalar Replacement）</strong>：把对象拆解成"标量"（基本类型，不能再分解），用局部变量代替对象的字段，<strong>不创建对象</strong>。如 Point{int x,y} 拆成两个 int 局部变量。</li>
        <li><strong>同步消除（Lock Elision）</strong>：如果对象未逃逸，加的锁（synchronized）没有意义（不可能有竞争），JIT 直接删除锁。</li>
      </ul>
      <p><strong>3. 标量 vs 聚合量</strong></p>
      <p>标量：不可再分解的数据，如 int/long/引用。聚合量：可分解的，如对象、数组。标量替换就是聚合量拆成标量。</p>
      <p><strong>4. 实际效果</strong></p>
      <ul>
        <li>日常 new 的临时对象（只在方法内用），很多被标量替换或栈上分配，根本没进堆。</li>
        <li>StringBuffer/StringBuilder 的同步锁（StringBuffer）在单线程使用时会被锁消除。</li>
      </ul>
      <p><strong>5. 注意</strong></p>
      <p>逃逸分析本身有开销（要分析对象引用流）。如果对象确实逃逸，分析就是浪费。但整体收益正向。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>逃逸分析判断对象是否逃逸出方法/线程。未逃逸可优化：栈上分配（不进堆免GC）、标量替换（对象拆成基本类型不创建对象）、锁消除（无竞争的锁删掉）。HotSpot 默认开启。所以不是所有 new 都在堆上。</p>`},
  {c:"JVM",d:"★★",q:"三色标记法是什么？有什么问题？",
   a:`<p>三色标记是并发垃圾回收（CMS、G1）用来标记存活对象的算法。对象分三种颜色：</p>
      <ul>
        <li><strong>白色</strong>：还没被标记（可能是垃圾）。</li>
        <li><strong>灰色</strong>：自己标记了，但它的引用还没扫描完。</li>
        <li><strong>黑色</strong>：自己和引用都标记完了（确定存活）。</li>
      </ul>
      <p><strong>漏标问题</strong>：并发标记时，业务线程还在改引用，可能把"黑色对象的引用"指向"白色对象"，导致白色对象被误当垃圾回收。</p>
      <p>解决办法：</p>
      <ul>
        <li>CMS 用<strong>增量更新</strong>（关注新增引用）。</li>
        <li>G1 用 <strong>SATB</strong>（关注引用消失，Snapshot-At-The-Beginning）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三色标记法（Tri-color Marking）</strong></p>
      <p>并发标记（GC 线程标记时业务线程还在跑）用的算法，把对象分三色：</p>
      <ul>
        <li><strong>白色 White</strong>：未被标记，可能是垃圾。</li>
        <li><strong>灰色 Gray</strong>：自己被标记了，但它的字段引用还没扫描完（待处理）。</li>
        <li><strong>黑色 Black</strong>：自己和引用都标记完，确定存活。</li>
      </ul>
      <p>流程：初始全白 → GC Roots 标灰 → 灰色对象的引用标灰、自己标黑 → 直到没灰色 → 剩下的白色是垃圾。</p>
      <p><strong>2. 漏标问题（并发标记的核心难题）</strong></p>
      <p>并发标记时业务线程改引用，会破坏"黑色不会指向白色"的不变量，导致漏标：</p>
      <ul>
        <li>业务把<strong>黑色对象的字段指向白色对象</strong>（A.black.f = whiteObj），白色对象应该存活，但黑色不会再扫描，白色被误回收。</li>
        <li>同时删除灰色对象到白色的引用。</li>
      </ul>
      <p>漏标会导致存活对象被误回收（严重 bug）。</p>
      <p><strong>3. 解决漏标：两种思路</strong></p>
      <ul>
        <li><strong>增量更新（CMS 用）</strong>：关注"新增引用"——业务线程给黑色对象加指向白色的引用时，记录这个黑色对象（变灰），重新标记阶段重新扫描它的引用。</li>
        <li><strong>SATB（G1 用，Snapshot-At-The-Beginning）</strong>：关注"引用消失"——业务线程删除引用前，把旧的引用关系记录下来（写屏障 pre-write barrier），重新标记时按"开始时的快照"处理，被删的白色也保护。</li>
      </ul>
      <p>两者都用<strong>写屏障（Write Barrier）</strong>在引用变更时记录。</p>
      <p><strong>4. 读屏障（ZGC/Shenandoah）</strong></p>
      <p>ZGC 用<strong>读屏障 + 染色指针</strong>处理并发整理，每次读引用时检查并修正，实现并发移动对象。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>三色标记：白（未标记）、灰（自己标了引用没扫）、黑（全标完）。漏标：并发时黑色指向白色导致白色被误回收。解决：CMS 增量更新（记新增引用），G1 SATB（记删除的引用，初始快照）。都用写屏障。</p>`},
  {c:"JVM",d:"★★★",q:"G1 和 CMS 有什么区别？",
   a:`<table><tr><th></th><th>CMS</th><th>G1</th></tr>
      <tr><td>内存划分</td><td>新生代/老年代物理隔离</td><td>分成多个 Region，每个 Region 可动态充当 Eden/Survivor/Old/Humongous</td></tr>
      <tr><td>算法</td><td>标记-清除（有碎片）</td><td>整体标记-整理 + 局部复制（无碎片）</td></tr>
      <tr><td>停顿</td><td>尽力低延迟但不预测</td><td>可预测停顿（-XX:MaxGCPauseMillis）</td></tr>
      <tr><td>适用</td><td>中等堆</td><td>大堆（6GB+）</td></tr>
      <tr><td>状态</td><td>JDK 9 标记废弃，14 移除</td><td>JDK 9 起默认</td></tr></table>
      <blockquote>G1 的核心优势：能控制 GC 停顿时间（比如设成 200ms），适合对延迟敏感的大堆应用。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 内存划分</strong></p>
      <ul>
        <li><strong>CMS</strong>：传统分代，新生代（Eden+S0+S1）和老年代<strong>物理隔离</strong>，连续内存块。</li>
        <li><strong>G1</strong>：堆分成多个大小相等的 <strong>Region</strong>（1~32MB），每个 Region 可动态充当 Eden、Survivor、Old、Humongous（大对象）。不再物理分代，逻辑分代。</li>
      </ul>
      <p><strong>2. 算法</strong></p>
      <ul>
        <li><strong>CMS</strong>：老年代用<strong>标记-清除</strong>，<strong>有内存碎片</strong>。大对象分配时碎片多会触发提前 Full GC。</li>
        <li><strong>G1</strong>：<strong>整体看是标记-整理（Region 间），局部是复制（Region 内）</strong>。无碎片。回收时把存活对象从一个 Region 复制到另一个空的 Region。</li>
      </ul>
      <p><strong>3. 停顿模型</strong></p>
      <ul>
        <li><strong>CMS</strong>：尽力降低停顿，但<strong>无法预测</strong>停顿时间。Concurrent Mode Failure 会退化成 Serial Old Full GC（长停顿）。</li>
        <li><strong>G1</strong>：<strong>可预测停顿模型</strong>（-XX:MaxGCPauseMillis=200）。用户设定期望停顿，G1 优先回收垃圾最多的 Region（Garbage First），在停顿时间内尽量多回收。这是 G1 名字由来。</li>
      </ul>
      <p><strong>4. GC 类型</strong></p>
      <ul>
        <li><strong>CMS</strong>：Young GC（ParNew）+ Old GC（CMS）+ Full GC（兜底）。</li>
        <li><strong>G1</strong>：Young GC + <strong>Mixed GC</strong>（新生代 + 部分老年代 Region，这是 G1 特色）+ Full GC（兜底，单线程 Serial）。</li>
      </ul>
      <p><strong>5. 适用场景</strong></p>
      <ul>
        <li>CMS：6GB 以下中等堆，低延迟。</li>
        <li>G1：6GB 以上大堆，延迟敏感，要可控停顿。</li>
      </ul>
      <p><strong>6. 生命周期</strong></p>
      <ul>
        <li>CMS：JDK 9 标记 deprecated，JDK 14 完全移除。</li>
        <li>G1：JDK 9 起默认收集器。</li>
      </ul>
      <p><strong>7. G1 的优势总结</strong></p>
      <ul>
        <li>无碎片（整理算法）。</li>
        <li>停顿可控（MaxGCPauseMillis）。</li>
        <li>大堆友好（Region 化，避免全堆扫描）。</li>
        <li>Mixed GC 回收老年代，不用等 Full GC。</li>
      </ul>
      <p><strong>8. 面试标准答法</strong></p>
      <p>CMS 物理分代+标记清除（有碎片）+不可预测停顿，G1 Region 化+标记整理（无碎片）+可预测停顿（Garbage First）。CMS JDK14 移除，G1 JDK9 默认。G1 适合大堆低延迟。</p>`},
  {c:"JVM",d:"★★★",q:"JMM（Java 内存模型）是什么？",
   a:`<p>JMM 规定了多线程程序中，变量（共享变量）如何<strong>从主内存读到工作内存</strong>、又<strong>如何写回主内存</strong>的规则。</p>
      <ul>
        <li>每个线程有自己的<strong>工作内存</strong>（CPU 缓存的抽象），存放变量的副本。</li>
        <li>所有共享变量存在<strong>主内存</strong>里。</li>
        <li>线程不能直接读写主内存，必须经过工作内存中转。</li>
      </ul>
      <p>这导致三个问题：<strong>可见性</strong>（一个线程改了，另一个看不到）、<strong>原子性</strong>（操作被中断）、<strong>有序性</strong>（指令重排）。</p>
      <blockquote>对应解决：synchronized 保证三者、volatile 保证可见性和有序性（不保证原子性）。JMM 围绕这些特性定义了 happens-before 等规则。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. JMM 是什么（注意区分 JVM 内存结构）</strong></p>
      <p><strong>JMM（Java Memory Model）</strong>是 Java 内存模型，规范多线程下共享变量的访问规则（可见性、原子性、有序性）。它是一个抽象规范，不是真实的内存区域。不要和"JVM 内存结构"（堆、栈、方法区）混淆。</p>
      <p><strong>2. 主内存 vs 工作内存</strong></p>
      <p>JMM 抽象出两层：</p>
      <ul>
        <li><strong>主内存</strong>：所有共享变量存这里（对应物理内存）。</li>
        <li><strong>工作内存</strong>：每个线程私有，存变量的副本（对应 CPU 缓存/寄存器）。</li>
      </ul>
      <p>线程不能直接读写主内存，必须先 read/load 到工作内存，操作完 store/write 回主内存。这抽象了"CPU 缓存导致可见性问题"。</p>
      <p><strong>3. 三大特性</strong></p>
      <ul>
        <li><strong>可见性</strong>：一个线程修改共享变量，其他线程能立即看到。问题：工作内存副本导致看不到。解决：volatile（强制刷主内存+失效缓存）、synchronized（解锁前刷主内存）。</li>
        <li><strong>原子性</strong>：一个或多个操作不可分割（不被中断）。问题：i++ 是读-改-写三步，可被打断。解决：synchronized、Lock、Atomic（CAS）。</li>
        <li><strong>有序性</strong>：程序执行顺序符合预期（防指令重排）。问题：编译器/CPU 为优化会重排指令。解决：volatile（禁止重排）、synchronized（保证块内有序）。</li>
      </ul>
      <p><strong>4. volatile 的语义</strong></p>
      <ul>
        <li>可见性：写后立即刷主内存+其他副本失效；读时强制从主内存读。</li>
        <li>有序性：插内存屏障禁止重排。</li>
        <li>不保证原子性（i++ 仍不安全）。</li>
      </ul>
      <p><strong>5. synchronized 的语义</strong></p>
      <p>同一把锁的 unlock happens-before 后续 lock，保证可见性；锁内代码串行，保证原子性有序性。</p>
      <p><strong>6. happens-before（JMM 的规则）</strong></p>
      <p>JMM 用 happens-before 向开发者表达上述保证：A happens-before B 则 A 对 B 可见。规则有程序顺序、锁、volatile、线程启动/终止、传递性等（详见并发分类 happens-before 题）。</p>
      <p><strong>7. long/double 的特殊问题</strong></p>
      <p>64 位的 long/double 读写可能不是原子的（分两次 32 位写），导致读到"半值"。volatile 保证其原子性。实际现代 JVM 一般都保证 long/double 原子读。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>JMM 是抽象规范（非内存区域），规定主内存（共享变量）和工作内存（线程副本）的交互。三大特性：可见性、原子性、有序性。volatile 保证可见+有序不保证原子，synchronized 三者都保证。happens-before 是 JMM 给开发者的规则。</p>`},
  {c:"JVM",d:"★★",q:"类初始化的顺序是怎样的？",
   a:`<p>加载一个类时，初始化（执行静态变量赋值和静态代码块）的顺序：</p>
      <p><strong>父类静态 → 子类静态 → 父类非静态（构造块+构造方法）→ 子类非静态</strong></p>
      <p>详细顺序：</p>
      <ol>
        <li>父类静态变量 + 父类静态代码块（按代码顺序）。</li>
        <li>子类静态变量 + 子类静态代码块。</li>
        <li>父类非静态变量 + 父类构造代码块。</li>
        <li>父类构造方法。</li>
        <li>子类非静态变量 + 子类构造代码块。</li>
        <li>子类构造方法。</li>
      </ol>
      <blockquote>口诀：静态优先、父类优先、静态只执行一次。面试常考选择题，记住这个顺序。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 完整初始化顺序（new 子类对象时）</strong></p>
      <p>父类静态 → 子类静态 → 父类非静态 → 父类构造 → 子类非静态 → 子类构造。</p>
      <p>展开：</p>
      <ol>
        <li><strong>父类静态变量 + 父类静态代码块</strong>（按源码出现顺序）。</li>
        <li><strong>子类静态变量 + 子类静态代码块</strong>（按源码顺序）。</li>
        <li><strong>父类普通成员变量 + 父类构造代码块</strong>（按源码顺序）。</li>
        <li><strong>父类构造方法</strong>。</li>
        <li><strong>子类普通成员变量 + 子类构造代码块</strong>。</li>
        <li><strong>子类构造方法</strong>。</li>
      </ol>
      <p><strong>2. 关键原则</strong></p>
      <ul>
        <li><strong>静态优先于非静态</strong>：静态在类加载时执行一次，非静态在 new 时执行。</li>
        <li><strong>父类优先于子类</strong>：初始化子类前先初始化父类。</li>
        <li><strong>变量/代码块优先于构造方法</strong>：构造方法最后执行。</li>
        <li><strong>静态只执行一次</strong>：类只加载一次，静态初始化一次。</li>
        <li><strong>同级别的变量和代码块按源码顺序</strong>：谁写前面谁先执行。</li>
      </ul>
      <p><strong>3. 为什么是这个顺序</strong></p>
      <ul>
        <li>静态属于类，类加载时初始化（&lt;clinit&gt;），早于实例创建。</li>
        <li>子类继承父类，必须先有父类的基础（super() 在子类构造方法第一行）。</li>
        <li>构造方法依赖成员变量初始化完成，所以变量/代码块在构造方法前。</li>
      </ul>
      <p><strong>4. 构造代码块 vs 静态代码块</strong></p>
      <ul>
        <li><strong>静态代码块</strong> static {}：类加载时执行一次。</li>
        <li><strong>构造代码块</strong> {}（无 static）：每次 new 对象都执行，先于构造方法。</li>
      </ul>
      <p><strong>5. 经典面试题</strong></p>
      <p>给定父子类各有静态变量、静态块、成员变量、构造块、构造方法，问输出顺序。按上述 6 步走即可。</p>
      <p><strong>6. 注意</strong></p>
      <ul>
        <li>静态内部类的初始化在首次使用时（懒加载），不是外部类加载时就初始化。</li>
        <li>子类构造方法若不显式调 super()，编译器默认加 super()（无参），父类无无参构造需显式 super(参数)。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>父类静态→子类静态→父类非静态(变量+构造块)→父类构造→子类非静态→子类构造。原则：静态优先、父类优先、变量优先于构造、静态只执行一次、同级按源码顺序。</p>`},
  {c:"JVM",d:"★★",q:"SPI 机制是什么？",
   a:`<p><strong>SPI（Service Provider Interface）</strong>是 Java 提供的一种<strong>服务发现机制</strong>：框架定义接口，第三方写实现，程序运行时自动加载实现类。</p>
      <p>用法：在 <code>META-INF/services/</code> 目录下放一个以接口全限定名为文件名的文件，里面写实现类的全限定名。用 <code>ServiceLoader.load(接口.class)</code> 就能加载所有实现。</p>
      <p><strong>典型应用</strong>：JDBC 驱动、SLF4J 日志门面、Dubbo 的扩展机制、Spring Boot 的自动配置。</p>
      <blockquote>和 API 的区别：API 是"调用方依赖接口"，SPI 是"接口定义方反向找实现"。SPI 还打破了双亲委派（用线程上下文类加载器加载）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. SPI 是什么</strong></p>
      <p>Service Provider Interface，服务发现机制。<strong>框架定义接口，第三方写实现，运行时按约定自动加载实现类</strong>。实现接口定义方和实现的解耦，方便扩展。</p>
      <p><strong>2. Java SPI 的用法（java.util.ServiceLoader）</strong></p>
      <ol>
        <li>定义接口：如 com.example.Driver。</li>
        <li>实现类：com.mysql.MysqlDriver implements Driver。</li>
        <li>在 jar 包的 <code>META-INF/services/</code> 目录放文件，文件名是接口全限定名（com.example.Driver），内容是实现类全限定名（每行一个）：com.mysql.MysqlDriver。</li>
        <li>调用方：<code>ServiceLoader&lt;Driver&gt; loader = ServiceLoader.load(Driver.class);</code>，迭代获取所有实现。</li>
      </ol>
      <p><strong>3. API vs SPI</strong></p>
      <ul>
        <li><strong>API</strong>：调用方依赖接口和实现，主动调用。</li>
        <li><strong>SPI</strong>：调用方只依赖接口，<strong>被动发现</strong>实现（运行时 ServiceLoader 加载）。接口和实现完全解耦，可替换实现不改代码。</li>
      </ul>
      <p><strong>4. 典型应用</strong></p>
      <ul>
        <li><strong>JDBC</strong>：java.sql.Driver 接口（Bootstrap 加载），各数据库厂商（MySQL/Oracle）在驱动 jar 的 META-INF/services 注册实现。Class.forName 早期需要，新版 SPI 自动加载。</li>
        <li><strong>SLF4J</strong>：日志门面，绑定 logback/log4j2 实现。</li>
        <li><strong>Dubbo SPI</strong>：增强版，支持 IoC/AOP/自适应扩展（按 key 加载单个实现）。</li>
        <li><strong>Spring Boot 自动配置</strong>：spring.factories / AutoConfiguration.imports 本质类似。</li>
      </ul>
      <p><strong>5. SPI 打破双亲委派</strong></p>
      <p>问题：JDBC 的 Driver 接口在 rt.jar（BootstrapClassLoader 加载），但实现类在 classpath（AppClassLoader）。Bootstrap 加载不到 classpath 的类。</p>
      <p>解决：用<strong>线程上下文类加载器（TCCL，Thread Context ClassLoader）</strong>，它是 AppClassLoader。ServiceLoader 用 TCCL 加载实现类，实现"父加载器委托子加载器加载"，打破双亲委派。</p>
      <p><strong>6. Java SPI 的缺点</strong></p>
      <ul>
        <li>一次性加载所有实现（ServiceLoader 全部实例化），无法按需加载。</li>
        <li>不支持依赖注入（Dubbo SPI 改进了这点）。</li>
        <li>不获取失败原因清晰。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>SPI 是服务发现机制：META-INF/services 文件声明实现，ServiceLoader 运行时加载。典型：JDBC、SLF4J、Dubbo。和 API 区别：被动发现实现。打破双亲委派（用 TCCL 加载 classpath 的实现）。</p>`},
  {c:"JVM",d:"★★",q:"Tomcat 是怎么破坏双亲委派模型的？",
   a:`<p>双亲委派要求"先委派给父加载器加载"。但 Tomcat 的需求是：<strong>每个 Web 应用要相互隔离</strong>（应用 A 用的 Spring5 和应用 B 用的 Spring4 不能冲突）。</p>
      <p>如果严格遵循双亲委派，两个应用的类都会被同一个 AppClassLoader 加载，没法隔离。所以 Tomcat 自己写了一个 <strong>WebAppClassLoader</strong>，加载类时<strong>优先自己加载</strong>（而不是先委派给父加载器），这样每个 Web 应用的类都被各自的类加载器加载，实现隔离。</p>
      <blockquote>注意：Tomcat 只对"自己应用目录下的类"打破双亲委派，对于核心类（如 java.\* 包）仍然委派给父加载器，保证安全。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Tomcat 为什么需要破坏双亲委派</strong></p>
      <p>需求：一个 Tomcat 部署多个 Web 应用，它们要<strong>相互隔离</strong>（应用 A 用 Spring 5.0，应用 B 用 Spring 4.0，类的全限定名相同但不能冲突）。</p>
      <p>双亲委派下，类全限定名相同会被同一个类加载器加载，无法隔离。所以 Tomcat 要给每个 Web 应用一个独立的类加载器。</p>
      <p><strong>2. Tomcat 的类加载器结构</strong></p>
      <ul>
        <li><strong>CommonClassLoader</strong>：Tomcat 公共类（lib），所有应用共享。</li>
        <li><strong>CatalinaClassLoader</strong>：Tomcat 自身的类。</li>
        <li><strong>SharedClassLoader</strong>：所有 Web 应用共享的类。</li>
        <li><strong>WebAppClassLoader（每个应用一个）</strong>：加载该应用的 /WEB-INF/classes 和 /WEB-INF/lib。</li>
      </ul>
      <p>层级：Bootstrap → Extension → Application → Common → WebApp（每个 webapp 独立）。</p>
      <p><strong>3. WebAppClassLoader 如何破坏双亲委派</strong></p>
      <p>标准双亲委派：loadClass 先委派父加载器，父失败才自己加载。WebAppClassLoader 重写 loadClass，<strong>先自己找（WEB-INF/classes、WEB-INF/lib）</strong>，找不到再委派父加载器。</p>
      <pre><code>// WebAppClassLoader 简化逻辑
protected Class&lt;?&gt; loadClass(String name) {
    Class&lt;?&gt; c = findLoadedClass(name);
    if (c == null) {
        try { c = findClass(name); }  // 1. 先自己找（破坏双亲委派）
        catch (ClassNotFoundException e) {
            c = super.loadClass(name);  // 2. 找不到再委派父加载器
        }
    }
    return c;
}</code></pre>
      <p>这样应用 A 的 Spring 类由 A 的 WebAppClassLoader 加载，应用 B 的由 B 的加载，全限定名相同但 Class 对象不同，<strong>实现隔离</strong>。</p>
      <p><strong>4. 例外（仍委派父加载器的类）</strong></p>
      <p>对于 Java 核心类（java.\*、javax.\*）、Tomcat 内部类、servlet API 等，WebAppClassLoader 仍委派给父加载器，保证安全和一致性。避免应用用自己的 java.lang.String 替代核心类。</p>
      <p><strong>5. 其他破坏双亲委派的场景</strong></p>
      <ul>
        <li>JDBC：用 TCCL（线程上下文类加载器）。</li>
        <li>OSGi：网状类加载结构。</li>
        <li>热部署：JSP 政编译时用新类加载器重新加载。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Tomcat 要让多 webapp 隔离（相同类名不冲突）。每个 webapp 一个 WebAppClassLoader，重写 loadClass 先自己加载 WEB-INF 再委派父加载器，破坏双亲委派。但核心类（java.\*）仍委派父加载器保证安全。</p>`},
  {c:"JVM",d:"★★",q:"线上 CPU 100% 怎么排查？",
   a:`<p>排查步骤：</p>
      <ol>
        <li><code>top</code> 找出占 CPU 最高的 Java 进程 PID。</li>
        <li><code>top -Hp PID</code> 找出该进程里占 CPU 最高的线程 ID（十进制）。</li>
        <li>把线程 ID 转成<strong>十六进制</strong>（printf "%x\\n" TID）。</li>
        <li><code>jstack PID | grep 十六进制线程ID</code>，找到对应的线程堆栈。</li>
        <li>看堆栈定位到具体代码，分析为什么死循环或频繁 GC。</li>
      </ol>
      <p>常见原因：死循环、频繁 Full GC（用 jstat 看 GC 情况）、正则回溯、序列化/反序列化大量数据。</p>
      <blockquote>也可以用 arthas 一键诊断：thread -n 3 直接看最忙的3个线程，更方便。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 排查步骤（经典 5 步）</strong></p>
      <ol>
        <li><strong>top</strong>：找到 CPU 占用最高的 Java 进程 PID。</li>
        <li><strong>top -Hp PID</strong>：看该进程内各线程 CPU，找占最高的线程 TID（十进制）。</li>
        <li><strong>printf "%x\\n" TID</strong>：十进制线程 ID 转十六进制（jstack 里 nid 是十六进制）。</li>
        <li><strong>jstack PID | grep 十六进制 -A 30</strong>：找到该线程的堆栈，看在执行什么代码。</li>
        <li>根据堆栈分析：死循环？GC？正则？序列化？</li>
      </ol>
      <p><strong>2. 常见 CPU 高的原因</strong></p>
      <ul>
        <li><strong>死循环/无限重试</strong>：代码 bug 导致 while(true) 或递归。</li>
        <li><strong>频繁 Full GC</strong>：GC 线程疯狂工作。用 jstat -gcutil 看 GC 频次，结合内存排查（可能内存泄漏）。</li>
        <li><strong>正则回溯</strong>：复杂正则匹配长字符串，回溯爆炸。</li>
        <li><strong>序列化/反序列化大对象</strong>：JSON 解析超大 JSON。</li>
        <li><strong>加密/压缩</strong>：CPU 密集操作大量执行。</li>
        <li><strong>死锁</strong>：虽不直接 CPU 100%，但线程阻塞，可能触发其他线程空转。jstack 看 deadlock。</li>
      </ul>
      <p><strong>3. jstack 堆栈关键字</strong></p>
      <ul>
        <li><strong>RUNNABLE</strong>：在运行（占 CPU 的可能是它）。</li>
        <li><strong>BLOCKED/WAITING</strong>：阻塞/等待，一般不占 CPU（除非频繁唤醒）。</li>
        <li><strong>GC 相关线程</strong>：如 "GC task thread"，频繁出现说明 GC 频繁。</li>
      </ul>
      <p><strong>4. arthas（推荐，更简单）</strong></p>
      <ul>
        <li><strong>thread -n 3</strong>：直接列出 CPU 占用最高的 3 个线程及堆栈。</li>
        <li><strong>dashboard</strong>：实时看线程、内存、GC。</li>
        <li><strong>trace 类 方法</strong>：看方法内部耗时。</li>
        <li><strong>profiler start/generate</strong>：火焰图，定位热点方法。</li>
      </ul>
      <p><strong>5. 火焰图（Flame Graph）</strong></p>
      <p>用 arthas profiler 或 async-profiler 生成火焰图，横轴是调用栈、宽度是耗时，一眼看出哪个方法占 CPU 最多。</p>
      <p><strong>6. 容器环境（Docker/K8s）</strong></p>
      <p>容器内可能没有 top/jstack，要进入容器（docker exec）或用宿主机工具。arthas 支持容器内 attach。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>top 找进程 → top -Hp 找线程 → 线程 ID 转十六进制 → jstack grep 找堆栈 → 看代码。常见原因：死循环、频繁 Full GC（jstat 看）、正则回溯、序列化大对象。arthas thread -n 3 一键搞定。</p>`},
