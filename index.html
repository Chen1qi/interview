  {c:"框架",d:"★★★",q:"Kafka 的架构是怎样的？核心概念有哪些？",
   a:`<p>Kafka 是分布式消息队列，核心概念：</p>
      <ul>
        <li><strong>Broker</strong>：Kafka 服务器节点。</li>
        <li><strong>Topic</strong>：消息主题，逻辑分类（类似数据库的表）。</li>
        <li><strong>Partition（分区）</strong>：一个 Topic 分成多个分区，分布在不同 Broker 上，是 Kafka 并发和扩展的基本单位。每个分区是一个有序的、不可变的日志。</li>
        <li><strong>Replica（副本）</strong>：每个分区有多个副本，保证高可用。分 Leader（读写）和 Follower（同步）。</li>
        <li><strong>Producer/Consumer</strong>：生产者和消费者。</li>
        <li><strong>Consumer Group</strong>：消费者组，组内每个分区只被一个消费者消费。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心概念</strong></p>
      <ul>
        <li><strong>Broker</strong>：Kafka 服务器节点。多个 Broker 组成集群。</li>
        <li><strong>Topic</strong>：消息主题，逻辑分类。生产者发到 Topic，消费者订阅 Topic。</li>
        <li><strong>Partition（分区）</strong>：Topic 分成多个分区，分布在各 Broker。<strong>并发和扩展的基本单位</strong>。每个分区是有序、不可变的追加日志（顺序写磁盘，快）。分区数决定并发度。</li>
        <li><strong>Replica（副本）</strong>：每个分区有多个副本（Leader + Follower）。Leader 处理读写，Follower 同步。Leader 挂了从 Follower 选新 Leader。</li>
        <li><strong>Producer</strong>：生产者，发消息到 Topic 的某分区（按 key hash 或轮询）。</li>
        <li><strong>Consumer / Consumer Group</strong>：消费者组，组内每个分区只被一个消费者消费（实现负载均衡）。</li>
        <li><strong>ZooKeeper / KRaft</strong>：旧版用 ZK 管理集群元数据、Leader 选举；新版（2.8+）用 KRaft（内置 Raft）替代 ZK。</li>
      </ul>
      <p><strong>2. 高吞吐的原因</strong></p>
      <ul>
        <li><strong>顺序写磁盘</strong>（分区是追加日志，磁盘顺序写比随机写快）。</li>
        <li><strong>零拷贝（Zero Copy）</strong>（sendfile，数据不经过用户态）。</li>
        <li><strong>PageCache</strong>（利用操作系统页缓存）。</li>
        <li><strong>批量发送 + 压缩</strong>（Producer 攒一批发，省网络）。</li>
        <li><strong>分区并行</strong>（多分区并发读写）。</li>
      </ul>
      <p><strong>3. 面试标准答法</strong></p>
      <p>Broker(节点)、Topic(主题)、Partition(分区，有序日志，并发基本单位)、Replica(Leader/Follower副本)、Producer/Consumer、Consumer Group(组内一分区一消费者)。高吞吐：顺序写+零拷贝+PageCache+批量压缩+分区并行。</p>`},
  {c:"框架",d:"★★★",q:"Kafka 怎么保证消息的顺序性？",
   a:`<p>Kafka <strong>只保证单个分区内有序</strong>，不保证全局有序（多分区无法保证顺序）。</p>
      <p>要保证一组相关消息的顺序：</p>
      <ul>
        <li>把这些消息<strong>发到同一个分区</strong>。方法：发送时指定相同的 <strong>key</strong>（比如订单ID），Kafka 会按 key 哈希到固定分区。</li>
        <li>消费端：<strong>一个分区只能被消费者组内的一个消费者消费</strong>，保证消费也按顺序。</li>
      </ul>
      <blockquote>注意：如果用多线程消费一个分区，又会破坏顺序。要严格顺序就单线程消费，或按 key 分发到不同线程（每个线程内有序）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Kafka 的顺序保证范围</strong></p>
      <p>Kafka <strong>只保证单个分区内消息有序</strong>（因为分区是有序日志）。不保证跨分区、全局有序（多分区并行，无法保证）。</p>
      <p><strong>2. 如何保证一组消息有序</strong></p>
      <ul>
        <li><strong>生产端</strong>：发送时指定<strong>相同 key</strong>（如 orderId），Kafka 按 key hash 路由到<strong>固定分区</strong>。同一 key 的消息都在同一分区，自然有序。</li>
        <li><strong>消费端</strong>：消费者组内<strong>一个分区只被一个消费者消费</strong>，保证消费也按分区顺序。</li>
      </ul>
      <p><strong>3. 消费端破坏顺序的情况</strong></p>
      <ul>
        <li><strong>多线程消费一个分区</strong>：会把消息分发到多线程并行处理，破坏顺序。</li>
        <li>解决：① 单线程消费（严格顺序，但吞吐低）；② 按 key 分发到不同线程（每个线程内有序，线程间无序）。RocketMQ 用 MessageQueueSelector + 线程池实现。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Kafka只保证单分区内有序。保证一组有序：同key发同分区(hash路由)+一个分区一个消费者。消费多线程会破坏顺序，要单线程或按key分发线程(每线程内有序)。</p>`},
  {c:"框架",d:"★★★",q:"Kafka 怎么保证消息不丢失？",
   a:`<p>消息从生产到消费三个环节都要保证：</p>
      <ul>
        <li><strong>生产者</strong>：设置 <code>acks=all</code>（所有副本都确认才算成功），配合 retries 重试。</li>
        <li><strong>Broker</strong>：设置分区副本数 &gt;1，关闭 unclean leader 选举，min.insync.replicas ≥ 2。</li>
        <li><strong>消费者</strong>：关闭自动提交 offset（enable.auto.commit=false），处理完业务逻辑后<strong>手动提交</strong> offset。</li>
      </ul>
      <blockquote>本质是"先确保消息持久化，再确认"。acks=all 是关键，表示 Leader 和所有 ISR 副本都写入才算成功。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三个环节都可能丢消息</strong></p>
      <p>生产者→Broker→消费者，任一环节处理不当都可能丢。</p>
      <p><strong>2. 生产者端</strong></p>
      <ul>
        <li><strong>acks=all（最关键）</strong>：消息要被 Leader 和所有 ISR 副本都确认才算写入成功。acks=0（不等确认，可能丢）、acks=1（Leader确认，Leader挂了丢）。</li>
        <li><strong>retries &gt; 0</strong>：发送失败自动重试（配合幂等 Producer 防重复）。</li>
        <li><strong>使用回调</strong>：send 的回调处理失败（记录日志/重发）。</li>
        <li><strong>retries + max.in.flight.requests.per.connection=1</strong>（或开启幂等）防重试乱序。</li>
      </ul>
      <p><strong>3. Broker 端</strong></p>
      <ul>
        <li><strong>分区副本数 replication.factor ≥ 3</strong>：多副本冗余。</li>
        <li><strong>min.insync.replicas ≥ 2</strong>：至少 2 个副本同步成功才算写入（配合 acks=all）。</li>
        <li><strong>关闭 unclean.leader.election</strong>：不允许非 ISR 的副本当 Leader（防数据少的副本当Leader丢数据）。</li>
        <li><strong>持久化</strong>：消息落盘（log.flush，一般靠操作系统刷盘）。</li>
      </ul>
      <p><strong>4. 消费者端</strong></p>
      <ul>
        <li><strong>关闭自动提交 enable.auto.commit=false</strong>：自动提交可能业务没处理完就提交了，崩溃丢消息。</li>
        <li><strong>手动提交 offset</strong>：业务处理完（落库/处理成功）后再手动 commit offset。失败不提交，下次重新消费（配合幂等防重复）。</li>
        <li><strong>at-least-once</strong>：手动提交实现至少一次（可能重复，业务幂等）。at-most-once（自动提交前）可能丢。exactly-once 需要事务（Kafka 事务/幂等 Producer）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>三环节防丢：生产者acks=all(所有ISR副本确认)+retries重试；Broker副本数≥3+min.insync.replicas≥2+关闭unclean选举；消费者关闭自动提交+手动提交offset(业务完再提交)。本质先持久化再确认。配合幂等防重复。</p>`},
  {c:"框架",d:"★★",q:"Kafka 的 ISR 机制是什么？",
   a:`<p><strong>ISR（In-Sync Replicas）</strong>是与 Leader 保持同步的副本集合。Leader 会维护一个 ISR 列表，Follower 同步落后太多（超过 replica.lag.time.max.ms）会被踢出 ISR，追上后再加回来。</p>
      <p>作用：</p>
      <ul>
        <li><strong>Leader 挂了，从 ISR 里选新 Leader</strong>，保证数据不丢。</li>
        <li>配合 <code>acks=all</code>：消息要被 ISR 所有副本确认才算写入成功，保证可靠性。</li>
      </ul>
      <p>还有 HW（High Watermark，所有副本都有的最大 offset，消费者只能读到 HW）和 LEO（Log End Offset，每个副本的最新 offset）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ISR 是什么</strong></p>
      <p>In-Sync Replicas，与 Leader 保持<strong>同步的副本集合</strong>。Leader 维护 ISR 列表。Follower 持续从 Leader 拉取数据同步，如果同步落后超过 replica.lag.time.max.ms（如10秒），被<strong>踢出 ISR</strong>；追上后加回。</p>
      <p><strong>2. ISR 的作用</strong></p>
      <ul>
        <li><strong>Leader 选举</strong>：Leader 挂了，从 ISR 里选数据最新的当新 Leader，保证数据不丢。</li>
        <li><strong>acks=all 配合</strong>：消息被 ISR 所有副本确认才算写入成功。ISR 保证了这些副本数据是最新的。</li>
      </ul>
      <p><strong>3. HW（High Watermark）和 LEO</strong></p>
      <ul>
        <li><strong>LEO（Log End Offset）</strong>：每个副本的<strong>最新 offset</strong>（下一条要写的位置）。各副本 LEO 可能不同。</li>
        <li><strong>HW（High Watermark）</strong>：所有 ISR 副本中最小的 LEO。<strong>消费者只能读到 HW</strong>（保证读到的是所有副本都确认的数据）。HW 随 ISR 副本同步而推进。</li>
        <li>消息写入：Leader 收到消息 LEO+1 → Follower 同步 → 所有 ISR LEO 达到该位置 → HW 推进 → 消费者可见。</li>
      </ul>
      <p><strong>4. unclean.leader.election</strong></p>
      <p>如果 ISR 全挂，是否允许非 ISR 副本（数据落后的）当 Leader。开启可能丢数据（落后的没新消息），关闭则等 ISR 恢复（牺牲可用性）。金融场景关闭。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>ISR是与Leader同步的副本集合(落后超时踢出追上回)。作用：Leader挂了从ISR选新Leader防丢数据+acks=all要ISR全确认。HW=ISR中最小LEO(消费者只读到HW保证已确认)。LEO=副本最新offset。关闭unclean选举防丢数据。</p>`},
  {c:"框架",d:"★★",q:"RocketMQ 的事务消息是怎么实现的？",
   a:`<p>RocketMQ 的事务消息用来解决<strong>本地事务和发消息的原子性</strong>（比如扣库存+发消息要一起成功失败）。流程：</p>
      <ol>
        <li>生产者先发<strong>半消息（half message）</strong>到 Broker，此时消费者<strong>看不到</strong>。</li>
        <li>半消息发送成功后，执行<strong>本地事务</strong>（如扣库存）。</li>
        <li>根据本地事务结果：
          <ul>
            <li>成功 → 给 Broker 发 commit，半消息变成正常消息，消费者能消费。</li>
            <li>失败 → 发 rollback，半消息被删除。</li>
          </ul>
        </li>
        <li><strong>回查机制</strong>：如果 commit/rollback 丢失（网络问题），Broker 会定期回查生产者"这个事务到底成没成"，生产者根据状态回复。</li>
      </ol>
      <blockquote>本质：两阶段提交 + 回查兜底。保证"本地事务成功，消息一定发出；失败，消息一定不发"。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 解决什么问题</strong></p>
      <p>业务操作（如扣库存）和发消息要原子性——要么都成功要么都失败。如果先扣库存再发消息，发消息失败会导致下游不知道（不一致）；先发消息再扣库存，扣失败下游已处理（不一致）。事务消息解决这个。</p>
      <p><strong>2. 流程（两阶段 + 回查）</strong></p>
      <ol>
        <li><strong>发半消息（Half Message）</strong>：Producer 发半消息到 Broker，存入特殊 topic（RMQ_SYS_TRANS_HALF_TOPIC），<strong>消费者看不到</strong>。</li>
        <li><strong>执行本地事务</strong>：半消息发送成功后，Producer 执行本地事务（扣库存）。</li>
        <li><strong>提交/回滚</strong>：
          <ul>
            <li>本地事务成功 → Producer 发 <strong>commit</strong> → Broker 把半消息转到真实 topic，消费者可见。</li>
            <li>本地事务失败 → Producer 发 <strong>rollback</strong> → Broker 删除半消息。</li>
          </ul>
        </li>
        <li><strong>事务回查（CheckBack）</strong>：如果 commit/rollback 丢失（网络问题/Producer 挂了），Broker 定期（如60秒）<strong>回查</strong> Producer："这个事务（按事务ID）到底成没成？"。Producer 实现回查逻辑，查本地事务状态返回 commit/rollback/unknown。</li>
      </ul>
      <p><strong>3. 关键点</strong></p>
      <ul>
        <li><strong>半消息对消费者不可见</strong>，保证本地事务执行期间不会被消费。</li>
        <li><strong>回查兜底</strong>：补偿 commit/rollback 丢失的情况，保证最终一致。</li>
        <li>Producer 要实现两个回调：executeLocalTransaction（执行本地事务）、checkLocalTransaction（回查）。</li>
      </ul>
      <p><strong>4. 对比其他分布式事务</strong></p>
      <p>比 2PC/TCC 轻量（不锁资源）。适合"本地事务 + 发消息"的场景。和本地消息表类似，但消息一致性交给 MQ 保证。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>事务消息解决本地事务和发消息的原子性。流程：发半消息(消费者看不到)→执行本地事务→commit(转正常消息)/rollback(删除)→回查兜底(网络丢commit/rollback时Broker回查Producer)。本质两阶段+回查，保证最终一致。</p>`},
  {c:"框架",d:"★★",q:"RabbitMQ 的工作模型是怎样的？",
   a:`<p>RabbitMQ 模型：Producer → Exchange → Queue → Consumer。</p>
      <ul>
        <li><strong>Exchange（交换机）</strong>：接收消息，按规则路由到队列。四种类型：
          <ul>
            <li><strong>Direct</strong>：按 routing key 精确匹配。</li>
            <li><strong>Fanout</strong>：广播到所有绑定的队列（忽略 key）。</li>
            <li><strong>Topic</strong>：按 routing key 模式匹配（支持通配符 * 和 #）。</li>
            <li><strong>Headers</strong>：按消息头属性匹配（少用）。</li>
          </ul>
        </li>
        <li><strong>Queue（队列）</strong>：存消息。</li>
        <li><strong>Binding（绑定）</strong>：Exchange 和 Queue 的关联关系。</li>
      </ul>
      <blockquote>RabbitMQ 的核心特色就是 Exchange 灵活的路由能力。和 Kafka 比：RabbitMQ 路由灵活、延迟低，适合复杂业务路由；Kafka 吞吐高、适合日志、大数据。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心模型</strong></p>
      <p>Producer → Exchange →（Binding）→ Queue → Consumer。</p>
      <ul>
        <li><strong>Producer</strong>：发消息到 Exchange（不直接发队列）。</li>
        <li><strong>Exchange（交换机）</strong>：接收消息，按 routing key 和 binding 规则路由到队列。RabbitMQ 的<strong>核心特色</strong>。</li>
        <li><strong>Queue（队列）</strong>：存消息，消费者从队列取。</li>
        <li><strong>Binding（绑定）</strong>：Exchange 和 Queue 的关联（含 routing key）。</li>
        <li><strong>Consumer</strong>：订阅队列消费消息。</li>
      </ul>
      <p><strong>2. Exchange 的四种类型</strong></p>
      <ul>
        <li><strong>Direct</strong>：按 routing key <strong>精确匹配</strong>。key="error" 只路由到绑定了 error 的队列。点对点。</li>
        <li><strong>Fanout</strong>：<strong>广播</strong>到所有绑定的队列（忽略 routing key）。如日志广播到多个系统。</li>
        <li><strong>Topic</strong>：按 routing key <strong>模式匹配</strong>（通配符 * 匹配一个词、# 匹配多个词）。如 "order.*.created" 匹配 order.payment.created。最灵活，常用。</li>
        <li><strong>Headers</strong>：按消息头（x-match=all/any）匹配。性能差，少用。</li>
      </ul>
      <p><strong>3. 可靠性机制</strong></p>
      <ul>
        <li><strong>生产端 confirm 模式</strong>：消息到达 Exchange/Queue 后回调确认。</li>
        <li><strong>return 机制</strong>：消息无法路由时退回。</li>
        <li><strong>持久化</strong>：Exchange、Queue、Message 都可持久化（durable）。</li>
        <li><strong>消费端手动 ack</strong>：处理完手动确认，失败 nack 重投。</li>
      </ul>
      <p><strong>4. vs Kafka</strong></p>
      <p>RabbitMQ：路由灵活（Exchange）、延迟低（微秒）、中小规模、企业应用。Kafka：吞吐高、分区有序、适合日志/大数据。RabbitMQ 不保证顺序消费（除非单队列单消费者）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>模型：Producer→Exchange→(Binding)→Queue→Consumer。Exchange四种：Direct(精确匹配)、Fanout(广播)、Topic(模式匹配*#，最灵活)、Headers。可靠性：confirm确认+持久化+手动ack。vs Kafka：路由灵活延迟低，吞吐低。</p>`},
  {c:"框架",d:"★★",q:"消息积压了怎么处理？",
   a:`<p>消息积压就是消费速度跟不上生产速度，消息堆在队列里。处理思路：</p>
      <ol>
        <li><strong>紧急扩容</strong>：增加消费者数量。但要注意分区数限制（Kafka 消费者数不能超过分区数）。</li>
        <li><strong>临时方案</strong>：如果消息体大或处理慢，可以先简单消费（只接收不处理），转储到另一个 topic/队列，后续慢慢处理。</li>
        <li><strong>优化消费逻辑</strong>：批量处理、异步处理、减少单条消息处理时间、避免长耗时操作（如同步调远程接口）。</li>
        <li><strong>排查根因</strong>：消费者是不是挂了、有 Bug 卡住、下游依赖慢、还是流量突增。</li>
        <li><strong>预防</strong>：做好监控告警、设置合理的消费超时、上下游限流。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 什么是积压</strong></p>
      <p>消费速度 &lt; 生产速度，消息在队列堆积。积压过多会导致：延迟高、磁盘满、消息过期丢失、影响业务实时性。</p>
      <p><strong>2. 紧急处理</strong></p>
      <ol>
        <li><strong>扩容消费者</strong>：增加消费者实例。注意 Kafka 消费者数 ≤ 分区数（超出无效），可能要先扩分区。</li>
        <li><strong>临时转发</strong>：如果消费逻辑慢，先简单消费（只接收不做业务），转储到另一个 topic（分区更多），新消费者慢慢处理。先消化积压。</li>
        <li><strong>排查根因</strong>：消费者挂了（重启）、有 Bug（修复）、下游依赖慢（DB慢/API超时）、流量突增（限流）。</li>
        <li><strong>优化消费逻辑</strong>：批量处理（攒一批）、异步化（非核心逻辑异步）、减少单条耗时（避免同步调远程接口、避免大对象）、增加并发。</li>
        <li><strong>限流上游</strong>：让生产端降速（限流），给消费端喘息时间。</li>
      </ol>
      <p><strong>3. 长期预防</strong></p>
      <ul>
        <li><strong>监控告警</strong>：积压量（Lag）监控，超阈值告警。</li>
        <li><strong>合理分区/消费者数</strong>：按峰值流量规划。</li>
        <li><strong>消费超时设置</strong>：避免单消息卡住。</li>
        <li><strong>消费幂等</strong>：失败重试不产生副作用。</li>
        <li><strong>死信队列</strong>：处理不了的消息进死信，不阻塞主队列。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>积压=消费慢于生产。紧急：扩消费者(Kafka注意不超分区数)、临时转发到新topic先消化、限流上游。排查：消费者挂/Bug/下游慢/流量突增。优化：批量/异步/减少单条耗时。预防：监控Lag告警、合理分区、死信队列。</p>`},
  {c:"框架",d:"★★",q:"ElasticSearch 为什么查询快？倒排索引是什么？",
   a:`<p><strong>倒排索引</strong>是 ES 搜索快的核心。传统数据库是"正排"（文档ID→内容），ES 是"倒排"（<strong>单词→文档ID列表</strong>）。</p>
      <p>比如两个文档："Java is good"、"Java is fun"，ES 会建：</p>
      <pre><code>java  → [文档1, 文档2]
good  → [文档1]
fun   → [文档2]</code></pre>
      <p>搜索 "java" 时，直接从索引里拿到 [文档1, 文档2]，不用扫描所有文档。</p>
      <p>底层还用了 <strong>FST（有限状态机）</strong>压缩词典（省内存，前缀共享），Posting List 压缩文档列表。</p>
      <blockquote>所以 ES 适合全文检索、模糊查询、聚合分析，比 MySQL 的 LIKE 快得多。但 ES 不适合频繁更新、强事务，一般用 MySQL 存、ES 查。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 倒排索引（Inverted Index）原理</strong></p>
      <p>正排索引（传统DB）：文档ID → 文档内容。查询要扫描所有文档匹配关键词（慢，如 LIKE）。</p>
      <p>倒排索引（ES）：分词后的<strong>单词 → 包含该词的文档ID列表</strong>。</p>
      <pre><code>// 文档1: "Java is good"  文档2: "Java is fun"
// 倒排索引
java → [1, 2]
good → [1]
fun  → [2]
is   → [1, 2]</code></pre>
      <p>搜索 "java" 直接从索引拿到 [1,2]，O(1) 查找，不用扫描。这就是 ES 快的核心。</p>
      <p><strong>2. 倒排索引的组成</strong></p>
      <ul>
        <li><strong>Term Dictionary（词典）</strong>：所有分词后的词项。用 <strong>FST（Finite State Transducer）</strong>压缩存储（前缀共享，省内存，快速查找）。</li>
        <li><strong>Term Index（词典索引）</strong>：词典的索引（快速定位词项在词典的位置），用 FST 常驻内存。</li>
        <li><strong>Posting List（倒排表）</strong>：每个词对应的文档列表。用 <strong>Frame of Reference（FOR）</strong>压缩（存差值）、<strong>Roaring Bitmap</strong>（位图，集合运算快）。</li>
      </ul>
      <p><strong>3. ES 查询流程</strong></p>
      <p>查询词 → Term Index 定位（FST，内存）→ Term Dictionary 找到词 → 取 Posting List（文档列表）→ 按相关性打分（TF-IDF/BM25）排序 → 返回。</p>
      <p><strong>4. 为什么比 MySQL LIKE 快</strong></p>
      <p>MySQL LIKE '%java%' 要<strong>全表扫描</strong>（每行检查），O(n)。ES 倒排索引直接定位，O(1) 找文档列表。且 ES 支持分词、相关性排序、聚合。</p>
      <p><strong>5. ES 的特点</strong></p>
      <ul>
        <li><strong>擅长</strong>：全文检索、模糊查询（前缀/通配/fuzzy）、多字段、聚合分析、近实时。</li>
        <li><strong>不擅长</strong>：频繁更新（更新要重建倒排，慢）、强事务（无 ACID）、关联查询弱。</li>
        <li>常见架构：MySQL 存（事务/更新）+ ES 查（搜索），通过 Canal/MQ 同步数据。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>倒排索引=词→文档ID列表(正排是文档→内容)。搜索直接查索引拿文档列表O(1)，不用全表扫描。词典用FST压缩(前缀共享内存)，Posting List用FOR/RoaringBitmap压缩。ES擅长全文检索/聚合，弱于更新/事务，一般MySQL存+ES查。</p>`},
  {c:"框架",d:"★★",q:"Docker 是什么？和虚拟机有什么区别？",
   a:`<p>Docker 是<strong>容器化</strong>技术，把应用和它的依赖打包成一个"容器"，能在任何环境一致运行。</p>
      <table><tr><th></th><th>Docker 容器</th><th>虚拟机</th></tr>
      <tr><td>原理</td><td>操作系统级虚拟化（共用宿主内核）</td><td>硬件级虚拟化（每个 VM 有自己的内核）</td></tr>
      <tr><td>启动</td><td>秒级</td><td>分钟级</td></tr>
      <tr><td>资源占用</td><td>少（MB级）</td><td>多（GB级）</td></tr>
      <tr><td>隔离性</td><td>较弱（共享内核）</td><td>强</td></tr></table>
      <p>Docker 底层靠 Linux <strong>Namespace</strong>（隔离：进程、网络、文件系统）+ <strong>Cgroups</strong>（资源限制：CPU、内存）+ <strong>UnionFS</strong>（联合文件系统，分层镜像）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Docker 是什么</strong></p>
      <p>容器化平台。把应用 + 依赖（库、环境、配置）打包成<strong>镜像</strong>，运行成<strong>容器</strong>。解决"在我机器上能跑"的问题，实现<strong>一次构建到处运行</strong>。</p>
      <p><strong>2. 核心概念</strong></p>
      <ul>
        <li><strong>镜像 Image</strong>：只读模板（含应用+环境），分层存储。</li>
        <li><strong>容器 Container</strong>：镜像运行的实例（可读写）。</li>
        <li><strong>仓库 Registry</strong>：存镜像（Docker Hub、私有 Harbor）。</li>
        <li><strong>Dockerfile</strong>：构建镜像的脚本。</li>
      </ul>
      <p><strong>3. vs 虚拟机</strong></p>
      <table><tr><th></th><th>Docker 容器</th><th>虚拟机 VM</th></tr>
      <tr><td>虚拟化层级</td><td>操作系统级（共用宿主内核）</td><td>硬件级（Hypervisor 模拟硬件，每个 VM 有自己内核）</td></tr>
      <tr><td>启动</td><td>秒级（启动进程）</td><td>分钟级（启动整个 OS）</td></tr>
      <tr><td>资源</td><td>MB 级（共享内核）</td><td>GB 级（每个完整 OS）</td></tr>
      <tr><td>隔离</td><td>较弱（共享内核，有逃逸风险）</td><td>强（独立内核）</td></tr>
      <tr><td>密度</td><td>单机可跑几百个</td><td>单机几十个</td></tr></table>
      <p><strong>4. Docker 底层技术</strong></p>
      <ul>
        <li><strong>Namespace（命名空间）</strong>：隔离。PID（进程）、NET（网络）、MNT（挂载点）、UTS（主机名）、IPC、USER。让容器看不到宿主和其他容器。</li>
        <li><strong>Cgroups（控制组）</strong>：资源限制。CPU、内存、IO、网络。防容器吃光宿主资源。</li>
        <li><strong>UnionFS（联合文件系统）</strong>：分层镜像。镜像由多层只读层叠加，容器加一层可写层。Copy-on-Write。共享基础层省空间。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Docker容器化(应用+依赖打包成镜像运行)。vs VM：操作系统级(共享内核，秒级启动MB级资源弱隔离)vs硬件级(独立内核分钟级GB级强隔离)。底层：Namespace隔离(进程/网络/文件系统)+Cgroups限制资源+UnionFS分层镜像。</p>`},
  {c:"框架",d:"★",q:"Dockerfile 的常用指令有哪些？",
   a:`<ul>
        <li><strong>FROM</strong>：基础镜像（如 openjdk:8）。</li>
        <li><strong>RUN</strong>：构建时执行的命令（如安装依赖）。</li>
        <li><strong>COPY/ADD</strong>：把本地文件拷进镜像（ADD 能解压、下载URL，一般用 COPY）。</li>
        <li><strong>WORKDIR</strong>：工作目录。</li>
        <li><strong>ENV</strong>：环境变量。</li>
        <li><strong>EXPOSE</strong>：声明端口（只是声明，真正映射用 -p）。</li>
        <li><strong>CMD</strong>：容器启动默认命令（可被 docker run 参数覆盖）。</li>
        <li><strong>ENTRYPOINT</strong>：容器启动入口命令（不易被覆盖，CMD 的参数会传给它）。</li>
      </ul>
      <blockquote>CMD vs ENTRYPOINT：CMD 容易被覆盖，ENTRYPOINT 固定执行。多阶段构建（FROM ... AS build）能减小最终镜像体积。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 常用指令</strong></p>
      <ul>
        <li><strong>FROM</strong>：基础镜像（如 openjdk:17、ubuntu:22.04）。第一条非注释指令。</li>
        <li><strong>RUN</strong>：构建镜像时执行的命令（安装软件、编译等）。每条 RUN 产生一层，建议用 &amp;&amp; 合并减少层数。</li>
        <li><strong>COPY</strong>：把本地文件/目录拷进镜像。推荐用（明确）。</li>
        <li><strong>ADD</strong>：类似 COPY，但额外能：自动解压 tar、下载 URL。一般用 COPY，需要解压才用 ADD。</li>
        <li><strong>WORKDIR</strong>：设置工作目录（后续命令的相对路径基准）。</li>
        <li><strong>ENV</strong>：设置环境变量（构建时和运行时都可用）。</li>
        <li><strong>ARG</strong>：构建时变量（--build-arg，只在构建期有效）。</li>
        <li><strong>EXPOSE</strong>：声明容器监听端口（只是文档声明，真正映射要 docker run -p）。</li>
        <li><strong>VOLUME</strong>：声明挂载点（数据持久化）。</li>
        <li><strong>CMD</strong>：容器启动默认命令。<strong>可被 docker run 参数覆盖</strong>。一个 Dockerfile 只一个生效（最后一个）。</li>
        <li><strong>ENTRYPOINT</strong>：容器启动入口命令。<strong>不易被覆盖</strong>（docker run 的参数作为它的参数）。适合固定执行的程序。</li>
        <li><strong>USER</strong>：指定运行用户（安全，不用 root）。</li>
      </ul>
      <p><strong>2. CMD vs ENTRYPOINT（重点）</strong></p>
      <ul>
        <li><strong>CMD</strong>：docker run 时如果带了命令参数，<strong>会完全替换 CMD</strong>。</li>
        <li><strong>ENTRYPOINT</strong>：docker run 的参数<strong>追加到 ENTRYPOINT 后</strong>（作为参数），不替换。</li>
        <li><strong>组合</strong>：ENTRYPOINT 定执行程序，CMD 定默认参数。如 ENTRYPOINT ["java","-jar","app.jar"] + CMD ["--spring.profiles.active=prod"]，docker run 可覆盖 CMD 参数。</li>
      </ul>
      <p><strong>3. 多阶段构建（Multi-stage Build）</strong></p>
      <p>用多个 FROM（AS 别名），前一阶段编译（如 maven build），后一阶段只 COPY 产物到运行镜像。最终镜像不含编译工具，体积小。</p>
      <pre><code>FROM maven AS build
COPY . . &amp;&amp; RUN mvn package
FROM openjdk:17
COPY --from=build /target/app.jar /app.jar
CMD ["java","-jar","/app.jar"]</code></pre>
      <p><strong>4. 面试标准答法</strong></p>
      <p>FROM基础镜像/RUN构建命令/COPY拷文件/WORKDIR工作目录/ENV环境变量/EXPOSE声明端口/CMD启动命令(可覆盖)/ENTRYPOINT入口(不易覆盖，参数追加)。CMD vs ENTRYPOINT：CMD被docker run参数替换，ENTRYPOINT参数追加。多阶段构建减小镜像。</p>`},

  {c:"数据结构与算法",d:"★★",q:"两数之和（LeetCode 1）怎么做？",

   a:`<p>题意：数组里找两个数，加起来等于目标值，返回它们的下标。</p>
      <p><strong>最优解：哈希表一次遍历，O(n)。</strong> 边遍历边用 HashMap 记录"值→下标"，对每个数，看 target-当前值 在不在表里。</p>
      <pre><code>public int[] twoSum(int[] nums, int target) {
    Map&lt;Integer,Integer&gt; map = new HashMap&lt;&gt;();
    for (int i = 0; i &lt; nums.length; i++) {
        int need = target - nums[i];
        if (map.containsKey(need)) {
            return new int[]{map.get(need), i};
        }
        map.put(nums[i], i);
    }
    return null;
}</code></pre>
      <blockquote>暴力法 O(n²) 双重循环也能过，但哈希表更优。面试先说思路（暴力→优化）再写代码。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路演进</strong>：暴力双重循环 O(n²) → 哈希表 O(n)。</p>
      <p><strong>2. 为什么边遍历边存</strong>：先查 target-num 在不在表，再存当前值，避免同一元素用两次。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n)，空间 O(n)。扩展：有序数组用双指针 O(n)。</p>
      <p><strong>4. 面试技巧</strong>：先说暴力（展示思路），再优化哈希表。注意返回下标不是值。</p>`},
  {c:"数据结构与算法",d:"★★",q:"合并两个有序链表怎么做？",

   a:`<p><strong>思路：哑节点 + 双指针比较。</strong> 建一个哨兵节点（dummy），用两个指针分别遍历两个链表，每次比较，小的接在结果后面。</p>
      <pre><code>public ListNode mergeTwoLists(ListNode l1, ListNode l2) {
    ListNode dummy = new ListNode(0), cur = dummy;
    while (l1 != null && l2 != null) {
        if (l1.val &lt;= l2.val) { cur.next = l1; l1 = l1.next; }
        else { cur.next = l2; l2 = l2.next; }
        cur = cur.next;
    }
    cur.next = (l1 != null) ? l1 : l2;  // 接上剩余
    return dummy.next;
}</code></pre>
      <blockquote>哑节点（dummy）技巧很重要：处理头节点时不用特殊判断。时间 O(n+m)，空间 O(1)。归并排序的合并步骤就是这个。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路</strong>：哑节点(dummy)简化头节点处理 + 双指针比较，小的接上，最后接剩余。</p>
      <p><strong>2. 哑节点作用</strong>：避免单独处理头节点，统一逻辑，返回 dummy.next。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n+m)，空间 O(1)。归并排序的合并步骤。</p>
      <p><strong>4. 面试技巧</strong>：链表题善用dummy哑节点。扩展：合并K个有序链表(小顶堆/分治)。</p>`},
  {c:"数据结构与算法",d:"★★",q:"有效的括号（LeetCode 20）怎么做？",

   a:`<p>题意：判断括号字符串是否匹配，如 "()[]{}" 有效，"([)]" 无效。</p>
      <p><strong>思路：用栈。</strong> 遇到左括号入栈，遇到右括号就弹栈看是否匹配。</p>
      <pre><code>public boolean isValid(String s) {
    Stack&lt;Character&gt; stack = new Stack&lt;&gt;();
    for (char c : s.toCharArray()) {
        if (c == '(') stack.push(')');
        else if (c == '[') stack.push(']');
        else if (c == '{') stack.push('}');
        else if (stack.isEmpty() || stack.pop() != c) return false;
    }
    return stack.isEmpty();
}</code></pre>
      <blockquote>小技巧：遇到左括号时，把"对应的右括号"入栈，这样比较时直接和当前右括号比对即可，代码简洁。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路</strong>：栈。遇到左括号入栈对应右括号，遇到右括号弹栈匹配。</p>
      <p><strong>2. 不匹配的3种情况</strong>：①弹栈时栈空（右多了）；②弹出不等于当前（类型不配）；③遍历完栈非空（左多了）。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n)，空间 O(n)。栈的经典应用。</p>
      <p><strong>4. 面试技巧</strong>：注意空字符串、单括号边界。扩展：最长有效括号（DP/栈）。</p>`},
  {c:"数据结构与算法",d:"★★",q:"爬楼梯（LeetCode 70，动态规划入门）？",

   a:`<p>题意：n 级台阶，每次能爬 1 或 2 级，问有多少种爬法。</p>
      <p><strong>思路：斐波那契变形。</strong> 到第 n 级，只能从第 n-1 级爬 1 步，或从第 n-2 级爬 2 步。所以 <code>dp[n] = dp[n-1] + dp[n-2]</code>。</p>
      <pre><code>public int climbStairs(int n) {
    if (n &lt;= 2) return n;
    int a = 1, b = 2;  // dp[1], dp[2]
    for (int i = 3; i &lt;= n; i++) {
        int c = a + b;
        a = b; b = c;
    }
    return b;
}</code></pre>
      <blockquote>这是动态规划的经典入门题。优化：只用两个变量存前两个状态，省掉数组，空间 O(1)。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路</strong>：到第n级只能从n-1爬1步或n-2爬2步。dp[n]=dp[n-1]+dp[n-2]（斐波那契）。</p>
      <p><strong>2. 空间优化</strong>：只需前两个状态，用两个变量滚动 O(1) 空间。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n)，空间 O(n)→优化 O(1)。</p>
      <p><strong>4. 面试技巧</strong>：DP入门题。递归→记忆化→DP数组→空间优化，展示思路演进。</p>`},
  {c:"数据结构与算法",d:"★★",q:"买卖股票的最佳时机（LeetCode 121）？",

   a:`<p>题意：给股票每天价格，只能买卖一次，求最大利润。</p>
      <p><strong>思路：一次遍历，记录历史最低价，算每天卖出的利润。</strong></p>
      <pre><code>public int maxProfit(int[] prices) {
    int minPrice = Integer.MAX_VALUE, maxProfit = 0;
    for (int price : prices) {
        if (price &lt; minPrice) minPrice = price;
        else if (price - minPrice &gt; maxProfit) maxProfit = price - minPrice;
    }
    return maxProfit;
}</code></pre>
      <blockquote>逻辑：到第 i 天，要么是新的最低价（更新），要么算"今天卖"的利润（和历史最大比）。O(n) 一次遍历。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路</strong>：一次遍历，记录历史最低价minPrice，每天算"今天卖"利润=price-minPrice，更新最大利润。</p>
      <p><strong>2. 为什么对</strong>：对每个卖出日，最佳买入是之前的最低价。维护minPrice即可。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n)，空间 O(1)。贪心思想。</p>
      <p><strong>4. 面试技巧</strong>：扩展：多次买卖(贪心累加上升段)、含手续费/冷冻期(DP)。</p>`},
  {c:"数据结构与算法",d:"★★",q:"二叉树的最大深度（LeetCode 104）？",

   a:`<p>题意：求二叉树的最大深度（根节点到最远叶子节点的层数）。</p>
      <p><strong>思路：递归。</strong> 一棵树的最大深度 = 左右子树最大深度 + 1。</p>
      <pre><code>public int maxDepth(TreeNode root) {
    if (root == null) return 0;
    int left = maxDepth(root.left);
    int right = maxDepth(root.right);
    return Math.max(left, right) + 1;
}</code></pre>
      <blockquote>也可以用 BFS 层序遍历，记录层数。递归（DFS）最简洁。这是二叉树递归思维的入门题，必须会。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路（递归/DFS）</strong>：maxDepth(root)=max(maxDepth(left),maxDepth(right))+1。</p>
      <p><strong>2. 也可BFS（层序）</strong>：记录层数，遍历完层数就是深度。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n)，空间 O(h)（h=树高，递归栈）。</p>
      <p><strong>4. 面试技巧</strong>：掌握"递归函数定义"思维。扩展：最小深度（注意叶子定义）。</p>`},
  {c:"数据结构与算法",d:"★★",q:"对称二叉树（LeetCode 101）？",

   a:`<p>题意：判断一棵二叉树是否镜像对称（左右子树互为镜像）。</p>
      <p><strong>思路：递归比较左右子树。</strong> 两个子树对称的条件：根值相等，且左的左 = 右的右，左的右 = 右的左。</p>
      <pre><code>public boolean isSymmetric(TreeNode root) {
    return isMirror(root.left, root.right);
}
private boolean isMirror(TreeNode a, TreeNode b) {
    if (a == null && b == null) return true;
    if (a == null || b == null) return false;
    return a.val == b.val
        && isMirror(a.left, b.right)
        && isMirror(a.right, b.left);
}</code></pre>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路</strong>：判断左右子树是否镜像对称。两棵树对称：值相等且 左.左=右.右、左.右=右.左（递归）。</p>
      <p><strong>2. 递归 isMirror(a,b)</strong>：都空→对称；一空一非→不对称；值不等→不对称；值等→递归。</p>
      <p><strong>3. 也可BFS（队列）</strong>：成对入队出队比较。</p>
      <p><strong>4. 复杂度</strong>：时间 O(n)，空间 O(h)。和翻转二叉树/相同树类似递归模板。</p>`},
  {c:"数据结构与算法",d:"★★",q:"手写快速排序？",

   a:`<p>快排核心：<strong>分治</strong>。选一个基准（pivot），把比它小的放左边，大的放右边，然后对左右两部分递归。</p>
      <pre><code>public void quickSort(int[] a, int l, int r) {
    if (l &gt;= r) return;
    int i = l, j = r, pivot = a[l];
    while (i &lt; j) {
        while (i &lt; j && a[j] &gt;= pivot) j--;
        while (i &lt; j && a[i] &lt;= pivot) i++;
        if (i &lt; j) { int t = a[i]; a[i] = a[j]; a[j] = t; }
    }
    a[l] = a[i]; a[i] = pivot;  // 基准归位
    quickSort(a, l, i - 1);
    quickSort(a, i + 1, r);
}</code></pre>
      <blockquote>平均 O(nlogn)，最坏 O(n²)（数组已有序时）。优化：随机选 pivot、三数取中。Arrays.sort() 基本类型用双轴快排。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心思想：分治</strong>。选pivot分区（小的左大的右），对左右递归。</p>
      <p><strong>2. 复杂度</strong>：平均 O(nlogn)，最坏 O(n²)（有序+取首尾为pivot）。</p>
      <p><strong>3. 优化</strong>：随机选pivot、三数取中、小数组用插入排序、双轴快排。</p>
      <p><strong>4. 面试技巧</strong>：必会手写。注意边界和递归终止（l&gt;=r return）。</p>`},
  {c:"数据结构与算法",d:"★★",q:"三数之和（LeetCode 15）？",

   a:`<p>题意：数组里找三个数加起来等于 0 的所有组合，不能重复。</p>
      <p><strong>思路：排序 + 双指针。</strong></p>
      <ol>
        <li>先排序。</li>
        <li>遍历每个数 a，在它后面用双指针（left、right）找 b+c = -a。</li>
        <li>和大于 0 right 左移，小于 0 left 右移。</li>
        <li>注意<strong>去重</strong>：a/b/c 跳过相邻相同的。</li>
      </ol>
      <blockquote>时间 O(n²)。为什么排序后用双指针？因为排序后可以用"和太大就缩小 right，太小就增大 left"快速调整，比暴力三重循环 O(n³) 高效。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路：排序+双指针</strong>。排序后遍历每个数a，在a后面用双指针(left,right)找b+c=-a。</p>
      <p><strong>2. 去重（关键）</strong>：①nums[i]==nums[i-1]跳过；②找到一组后left/right跳过相同值。</p>
      <p><strong>3. 复杂度</strong>：排序O(nlogn)+双指针O(n²)=O(n²)。</p>
      <p><strong>4. 面试技巧</strong>：排序让去重方便。扩展：四数之和（两层循环+双指针）。</p>`},
  {c:"数据结构与算法",d:"★★",q:"无重复字符的最长子串（LeetCode 3，滑动窗口）？",
   a:`<p>题意：找字符串里不含重复字符的最长子串长度，如 "abcabcbb" 答案是 3（"abc"）。</p>
      <p><strong>思路：滑动窗口 + HashSet。</strong> 用两个指针表示窗口左右，右指针不断右移扩展，遇到重复字符就左指针右移收缩，直到没重复。</p>
      <pre><code>public int lengthOfLongestSubstring(String s) {
    Set&lt;Character&gt; set = new HashSet&lt;&gt;();
    int left = 0, max = 0;
    for (int right = 0; right &lt; s.length(); right++) {
        while (set.contains(s.charAt(right))) {
            set.remove(s.charAt(left++));
        }
        set.add(s.charAt(right));
        max = Math.max(max, right - left + 1);
    }
    return max;
}</code></pre>
      <blockquote>滑动窗口是高频考点：双指针维护一个"窗口"，根据条件扩展或收缩。O(n)。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 思路：滑动窗口+HashSet</strong>。双指针[left,right]维护窗口，right扩展遇重复则left收缩。</p>
      <p><strong>2. 优化：HashMap存字符→位置</strong>，重复时left直接跳到重复字符+1。</p>
      <p><strong>3. 复杂度</strong>：时间 O(n)，空间 O(字符集大小)。</p>
      <p><strong>4. 面试技巧</strong>：滑动窗口高频套路(双指针维护窗口按条件扩展/收缩)。扩展：最小覆盖子串。</p>`},

  // ============ 场景实战 ============
  {c:"场景实战",d:"★★★",q:"线上 OOM（内存溢出）怎么排查？",
   a:`<p><strong>排查步骤</strong>：</p>
      <ol>
        <li><strong>确认 OOM 类型</strong>：看报错信息——Java heap space（堆溢出）、Metaspace（元空间）、Direct buffer memory（直接内存）、GC overhead limit（GC 回收不动）。</li>
        <li><strong>拿到堆 dump</strong>：① 启动时配 <code>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heap.hprof</code> 自动 dump；② 运行时 <code>jmap -dump:format=b,file=heap.hprof PID</code> 手动 dump；③ arthas <code>heapdump</code>。</li>
        <li><strong>MAT 分析</strong>：用 Eclipse MAT 打开 hprof → 看 Leak Suspects 报告 → Dominator Tree 找占内存最大的对象 → 看 GC Roots 引用链定位泄漏源头。</li>
        <li><strong>常见原因</strong>：静态集合只增不减、ThreadLocal 没 remove、大查询一次加载太多、缓存无淘汰、内存泄漏。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. OOM 类型与排查方向</strong></p>
      <ul>
        <li><strong>Java heap space</strong>：堆不够。查大对象、内存泄漏。调大 -Xmx 或排查泄漏。</li>
        <li><strong>Metaspace</strong>：动态生成类太多（CGLIB/反射/Groovy）。调大 MaxMetasSize 或查类泄漏。</li>
        <li><strong>Direct buffer memory</strong>：NIO 直接内存。检查 Netty/ByteBuffer 使用。</li>
        <li><strong>unable to create new native thread</strong>：线程数超限。查线程池泄漏。</li>
        <li><strong>GC overhead limit</strong>：GC 花 98% 时间回收不到 2%。快 OOM 的预警。</li>
      </ul>
      <p><strong>2. 实战排查流程</strong></p>
      <ol>
        <li>收到告警（监控/日志报 OOM）→ 确认是哪个服务、哪个实例。</li>
        <li>如果有自动 dump 文件 → 拿到 hprof。没有 → 看能否重启前先 jmap dump（注意 STW 风险）。</li>
        <li>MAT 打开：① Leak Suspects 自动找嫌疑；② Histogram 按类统计对象数；③ Dominator Tree 找最大对象；④ Path to GC Roots 看谁一直引用它。</li>
        <li>定位到代码：比如发现一个 static ConcurrentHashMap 不断 put 不 remove → 内存泄漏。</li>
        <li>修复 + 调整参数（如加大堆、加缓存淘汰、限制查询条数）。</li>
      </ol>
      <p><strong>3. 常见内存泄漏场景</strong>：静态集合只增不减、ThreadLocal（线程池场景）、监听器/回调未注销、连接/流未关闭、缓存无过期。</p>
      <p><strong>4. 预防</strong>：上线配 HeapDumpOnOutOfMemoryError、监控堆内存趋势（Grafana）、压测验证。</p>
      <p><strong>5. 面试标准答法</strong>：先看OOM类型(heap/Metaspace/Direct/线程)→拿dump(HeapDumpOnOutOfMemoryError或jmap)→MAT分析(LeakSuspects/DominatorTree/GCRoots引用链)→定位泄漏源→修复(静态集合/ThreadLocal/缓存/大查询)。</p>`},
  {c:"场景实战",d:"★★★",q:"线上 CPU 100% 怎么排查？",
   a:`<p><strong>5 步排查法</strong>：</p>
      <ol>
        <li><code>top</code> → 找到 CPU 最高的 Java 进程 PID。</li>
        <li><code>top -Hp PID</code> → 找到该进程内 CPU 最高的线程 TID（十进制）。</li>
        <li><code>printf "%x\n" TID</code> → 转十六进制。</li>
        <li><code>jstack PID | grep 十六进制 -A 30</code> → 找到该线程堆栈。</li>
        <li>看堆栈定位代码 → 分析原因（死循环/频繁GC/正则回溯/大量计算）。</li>
      </ol>
      <blockquote>也可以用 arthas：thread -n 3 直接看最忙的 3 个线程。更方便。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 常见 CPU 高的原因</strong></p>
      <ul>
        <li><strong>死循环/无限重试</strong>：代码 bug（while(true) 无退出、递归无限）。</li>
        <li><strong>频繁 Full GC</strong>：GC 线程疯狂工作。用 jstat -gcutil 看 GC 频率。</li>
        <li><strong>正则回溯</strong>：复杂正则匹配长字符串，回溯爆炸。</li>
        <li><strong>大量计算</strong>：加密/压缩/序列化大对象。</li>
        <li><strong>死锁自旋</strong>：虽然死锁线程不占 CPU，但等待的线程可能忙等。</li>
      </ul>
      <p><strong>2. 排查步骤（经典 5 步）</strong></p>
      <ol>
        <li><strong>top</strong>：确认是哪个 Java 进程。</li>
        <li><strong>top -Hp PID</strong>：看该进程内各线程 CPU，找到最忙的线程。</li>
        <li><strong>printf "%x\n" TID</strong>：十进制线程 ID 转十六进制（jstack 里 nid 是十六进制）。</li>
        <li><strong>jstack PID | grep 十六进制 -A 30</strong>：找到线程堆栈，看在执行什么代码。</li>
        <li>根据堆栈分析原因并修复。</li>
      </ol>
      <p><strong>3. arthas（更方便）</strong></p>
      <ul>
        <li><strong>thread -n 3</strong>：直接列出 CPU 最高的 3 个线程及堆栈。</li>
        <li><strong>dashboard</strong>：实时看线程、内存、GC。</li>
        <li><strong>profiler start → profiler generate</strong>：火焰图定位热点方法。</li>
      </ul>
      <p><strong>4. 如果是 GC 导致</strong>：jstat -gcutil PID 1000 看 GC 统计 → 如果 FGC 频繁 → 查内存（可能泄漏或堆太小）→ MAT 分析。</p>
      <p><strong>5. 面试标准答法</strong>：top找进程→top -Hp找线程→转十六进制→jstack grep找堆栈→定位代码(死循环/GC/正则/大计算)。或arthas thread -n 3。GC导致用jstat看。</p>`},
  {c:"场景实战",d:"★★",q:"频繁 Full GC 怎么排查和解决？",
   a:`<p><strong>排查步骤</strong>：</p>
      <ol>
        <li><strong>jstat -gcutil PID 1000</strong>：每秒看各区使用率和 GC 次数/耗时。O（老年代）持续涨、FGC 次数猛增 → 确认频繁 Full GC。</li>
        <li><strong>查原因</strong>：① 内存泄漏（老年代对象清不掉）；② 大对象直接进老年代；③ 空间太小（新生代/老年代比例不合理）；④ System.gc() 被调用；⑤ Metaspace 不足触发。</li>
        <li><strong>解决</strong>：① 加大堆或调比例（-Xmn、NewRatio）；② 修复泄漏；③ 避免大对象；④ 检查是否手动调 System.gc()（加 -XX:+DisableExplicitGC）；⑤ 换 G1/ZGC。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Full GC 触发原因</strong></p>
      <ul>
        <li><strong>老年代空间不足</strong>：对象晋升、大对象直接分配、内存泄漏。</li>
        <li><strong>Metaspace 空间不足</strong>：加载类太多（动态代理、Groovy）。</li>
        <li><strong>System.gc()</strong>：代码手动调（建议 -XX:+DisableExplicitGC 禁用）。</li>
        <li><strong>CMS 的 Concurrent Mode Failure</strong>：CMS 回收速度跟不上，退化成 Serial Old 单线程 Full GC。</li>
        <li><strong>分配担保失败</strong>：Minor GC 前检查老年代连续空间不够。</li>
      </ul>
      <p><strong>2. 排查流程</strong></p>
      <ol>
        <li><strong>jstat -gcutil PID 1000</strong>：看 EU（Eden）、OU（老年代）、MC（Metaspace）、YGC/FGC 次数、GCT 耗时。</li>
        <li>OU 持续涨不降 → 老年代有问题（泄漏/大对象）。</li>
        <li>MC 涨 → Metaspace 问题（类太多）。</li>
        <li><strong>dump 分析</strong>：jmap -dump + MAT 看老年代里是什么对象。</li>
        <li><strong>GC 日志</strong>：-Xlog:gc*（JDK9+）或 -XX:+PrintGCDetails（JDK8），分析停顿原因。</li>
      </ol>
      <p><strong>3. 解决方案</strong></p>
      <ul>
        <li><strong>内存泄漏</strong>：MAT 找泄漏源，修复。</li>
        <li><strong>堆太小</strong>：加大 -Xmx。-Xms 设成与 -Xmx 相同（避免动态扩缩抖动）。</li>
        <li><strong>新生代太小</strong>：对象过早晋升老年代 → 调大 -Xmn 或 NewRatio。</li>
        <li><strong>大对象</strong>：-XX:PretenureSizeThreshold 控制（或代码避免）。</li>
        <li><strong>System.gc()</strong>：-XX:+DisableExplicitGC 禁用。</li>
        <li><strong>换收集器</strong>：Parallel → G1（更好的停顿控制）→ ZGC（超低延迟）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：jstat -gcutil看老年代和GC频率→查原因(泄漏/大对象/堆小/System.gc/Metaspace)→dump+MAT分析老年代对象→解决(修泄漏/调堆/禁System.gc/换G1)。GC日志辅助分析。</p>`},
  {c:"场景实战",d:"★★★",q:"接口响应慢怎么排查优化？",
   a:`<p><strong>排查思路（从外到内）</strong>：</p>
      <ol>
        <li><strong>网络/网关层</strong>：带宽打满？Nginx/网关延迟？CDN 命中率？</li>
        <li><strong>应用层</strong>：arthas trace 看方法耗时、看线程池是否满、GC 是否频繁。</li>
        <li><strong>数据库</strong>：慢查询日志、EXPLAIN 分析、索引是否命中、连接池是否满。</li>
        <li><strong>缓存</strong>：Redis 命中率、是否有大 key、热点 key。</li>
        <li><strong>下游调用</strong>：调第三方/RPC 接口慢（超时设置、串行调改并行）。</li>
      </ol>
      <p><strong>优化手段</strong>：加索引/覆盖索引、加缓存、异步化、批量化、CDN、分页、连接池调优。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 全链路排查思路</strong></p>
      <p>一个请求慢，可能是任何一环：网络 → 网关 → 应用 → DB → 缓存 → 下游。</p>
      <p><strong>2. 用链路追踪定位</strong></p>
      <ul>
        <li><strong>SkyWalking/Zipkin</strong>：看 Trace 树，每个 Span 的耗时，一眼定位最慢的环节。</li>
        <li><strong>arthas trace</strong>：trace 类 方法，看方法内部每个子调用耗时。</li>
      </ul>
      <p><strong>3. 各层常见瓶颈与优化</strong></p>
      <table><tr><th>层</th><th>常见原因</th><th>优化</th></tr>
      <tr><td>DB</td><td>慢查询、缺索引、全表扫描、锁等待</td><td>加索引、覆盖索引、EXPLAIN 分析、分页优化</td></tr>
      <tr><td>缓存</td><td>未命中、缓存击穿、大 key</td><td>加缓存、布隆过滤器、热点预热</td></tr>
      <tr><td>应用</td><td>频繁 GC、线程池满、串行调用</td><td>调 JVM、扩线程池、CompletableFuture 并行</td></tr>
      <tr><td>下游</td><td>RPC/HTTP 调用慢</td><td>设超时、异步化、缓存结果</td></tr>
      <tr><td>网络</td><td>带宽、跨地域</td><td>CDN、就近部署、减少 payload</td></tr></table>
      <p><strong>4. 典型优化案例</strong></p>
      <ul>
        <li>接口查 DB 慢 → 加索引 + 缓存（Redis），从 2s → 50ms。</li>
        <li>串行调 3 个下游 → CompletableFuture 并行，总耗时从 sum → max。</li>
        <li>深度分页慢 → 游标分页 / 延迟关联。</li>
        <li>大列表序列化慢 → 只返回需要的字段 + Protobuf 替代 JSON。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong>：用链路追踪(SkyWalking)定位最慢环节→分层排查(DB慢查询/缓存未命中/频繁GC/下游超时/网络)→对症优化(加索引+缓存/并行化/异步化/CDN)。arthas trace辅助。</p>`},
  {c:"场景实战",d:"★★",q:"秒杀系统怎么设计？",
   a:`<p>秒杀核心：<strong>高并发、防超卖、防刷</strong>。</p>
      <ol>
        <li><strong>前端</strong>：按钮防连点、验证码、静态页 CDN、倒计时。</li>
        <li><strong>网关层</strong>：限流（令牌桶）、IP 限流、黑名单。</li>
        <li><strong>缓存层</strong>：库存预热到 Redis，扣减用 Lua 脚本保证原子。库存为 0 直接拒绝。</li>
        <li><strong>消息队列</strong>：下单请求进 MQ 异步处理（削峰），消费端串行扣库存。</li>
        <li><strong>数据库</strong>：最终落库，扣减 where stock&gt;0（乐观锁/唯一索引防重）。</li>
      </ol>
      <p>核心思路：<strong>层层拦截，尽量少的请求到 DB</strong>。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 秒杀的挑战</strong>：瞬时高并发（几万人抢 100 件）、防超卖、防黄牛、保证一致性。</p>
      <p><strong>2. 架构设计（层层拦截）</strong></p>
      <ul>
        <li><strong>第一层：前端</strong>：① 按钮防连点（点一次置灰几秒）；② 验证码（拖慢请求、防机器）；③ 静态页 CDN（减少服务端压力）；④ 答题/验证码错开请求时间。</li>
        <li><strong>第二层：网关/Nginx</strong>：① IP 限流（同一 IP 每秒 N 次）；② 用户级限流（同一用户只能抢一次）；③ 黑名单（黄牛）；④ 恶意请求拒绝。</li>
        <li><strong>第三层：Redis（核心）</strong>：① 库存预热到 Redis（activity:{id}:stock = 100）；② 扣库存用 <strong>Lua 脚本</strong>（判断&gt;0 则-1，原子）；③ 库存=0 后直接拒绝（不再到下游）；④ 用户去重（SET 已抢用户，防重复抢）；⑤ 生成订单号存 Redis（异步落库）。</li>
        <li><strong>第四层：MQ 削峰</strong>：抢到的请求进 MQ（RocketMQ/Kafka），消费端按 DB 能力消费创建订单。<strong>异步削峰</strong>，DB 不被冲垮。</li>
        <li><strong>第五层：数据库</strong>：① 扣库存 <code>UPDATE stock SET num=num-1 WHERE id=? AND num&gt;0</code>（防超卖）；② 唯一索引防重复下单（user_id+activity_id）；③ 分库分表（高并发）。</li>
      </ul>
      <p><strong>3. 关键技术点</strong></p>
      <ul>
        <li><strong>防超卖</strong>：Redis Lua 原子扣减 + DB 乐观锁（num&gt;0）。</li>
        <li><strong>防重复</strong>：Redis 用户去重 + DB 唯一索引。</li>
        <li><strong>一致性</strong>：Redis 扣减成功 → MQ → DB 最终一致。MQ 消费失败重试 + 幂等。</li>
        <li><strong>限流</strong>：Sentinel/网关 令牌桶。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：层层拦截。前端(防连点/验证码/CDN)→网关(IP/用户限流/黑名单)→Redis(Lua原子扣库存+用户去重+库存为0拒绝)→MQ削峰异步下单→DB(乐观锁num&gt;0+唯一索引防重)。核心：尽量少请求到DB。</p>`},
  {c:"场景实战",d:"★★",q:"数据库连接池满了怎么排查？",
   a:`<p>报错通常是 <code>HikariPool-1 - Connection is not available</code>。</p>
      <p><strong>排查</strong>：</p>
      <ol>
        <li><strong>连接泄漏</strong>：连接没归还（忘记 close、事务没提交）。查代码有没有 try-with-resources 或 @Transactional。</li>
        <li><strong>慢 SQL</strong>：连接被慢查询占着不释放。查慢查询日志。</li>
        <li><strong>连接池太小</strong>：并发量超过池大小。调大 maximum-pool-size。</li>
        <li><strong>死锁</strong>：事务互相等待。jstack 看死锁。</li>
      </ol>
      <p><strong>解决</strong>：修复泄漏、优化慢 SQL、调大连接池、设连接超时（connection-timeout）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 常见原因</strong></p>
      <ul>
        <li><strong>连接泄漏</strong>：手动获取连接（dataSource.getConnection()）后忘记 close。或事务异常没回滚导致连接不释放。</li>
        <li><strong>慢 SQL 占连接</strong>：大查询/缺索引导致连接长时间被占用。连接池的连接都被慢查询占了。</li>
        <li><strong>连接池配置不合理</strong>：maximum-pool-size 太小（如默认 HikariCP 10），高并发不够用。</li>
        <li><strong>死锁</strong>：事务互相等待锁，连接一直阻塞。</li>
        <li><strong>大事务</strong>：事务里做远程调用（HTTP/RPC），调用慢导致连接长时间持有。</li>
      </ul>
      <p><strong>2. 排查步骤</strong></p>
      <ol>
        <li><strong>看报错</strong>：Connection is not available, request timed out after Xms。</li>
        <li><strong>查活跃连接</strong>：show processlist（MySQL）看哪些查询占着连接。</li>
        <li><strong>慢查询日志</strong>：看是否有慢 SQL。</li>
        <li><strong>代码审查</strong>：查有没有手动 getConnection 没 close、大事务里调远程接口。</li>
        <li><strong>jstack</strong>：看线程是不是在等数据库连接（BLOCKED on HikariPool）。</li>
      </ol>
      <p><strong>3. 解决</strong></p>
      <ul>
        <li>修复泄漏：用 try-with-resources 或框架管理事务（@Transactional）。</li>
        <li>优化慢 SQL：加索引、避免全表扫描。</li>
        <li>调大连接池：HikariCP maximum-pool-size（建议 (core*2 + effective_spindle_count)）。</li>
        <li>设超时：connection-timeout（获取连接超时）、MySQL wait_timeout（连接最大空闲）。</li>
        <li>避免大事务：事务里别调远程接口、拆分大事务。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：原因(连接泄漏没close/慢SQL占连接/池太小/死锁/大事务含远程调用)。排查(show processlist看占连接的SQL/慢日志/jstack看等连接)。解决(修泄漏/优化慢SQL/调大池/设超时/拆大事务)。</p>`},
  {c:"场景实战",d:"★★",q:"如何设计一个短链系统？",
   a:`<p><strong>核心流程</strong>：长链 → 发号器生成短码 → 存映射关系（短码→长链）→ 访问短码时 302 重定向到长链。</p>
      <p><strong>短码生成方案</strong>：</p>
      <ul>
        <li><strong>发号器 + Base62</strong>：自增 ID → 转 62 进制（0-9a-zAZa）→ 6 位短码（可表达 568 亿）。</li>
        <li><strong>哈希（MD5/MurmurHash）取前 6 位</strong>：可能冲突，要查重。</li>
      </ul>
      <p><strong>存储</strong>：MySQL（短码→长链映射，短码唯一索引）+ Redis 缓存（加速查询）。</p>
      <p><strong>访问优化</strong>：Redis 缓存 + 布隆过滤器（短码不存在直接拒绝）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 短链原理</strong>：短码（如 t.cn/abc123）→ 查映射表 → 302 重定向到长链。302（临时）而非 301（永久），方便统计跳转、支持长链更新。</p>
      <p><strong>2. 短码生成方案</strong></p>
      <ul>
        <li><strong>方案一：自增 ID + Base62</strong>。分布式发号器（雪花算法/号段模式）拿到唯一 ID → 转 62 进制（0-9+a-z+A-Z，6 位表达 62^6≈568 亿）。无冲突、有序。缺点：可预测（可枚举）。</li>
        <li><strong>方案二：MurmurHash + 查重</strong>。长链哈希取前 6 位 Base62。可能冲突（哈希碰撞），存时要查重。</li>
        <li><strong>方案三：预生成</strong>。提前生成一批短码存 KGS（Key Generating Service），用时取一个。</li>
      </ul>
      <p><strong>3. 存储设计</strong></p>
      <ul>
        <li>MySQL：id（自增）、short_code（唯一索引）、long_url、create_time、expire_time。</li>
        <li>数据量大：按 short_code 哈希分库分表。</li>
        <li>Redis 缓存：short_code → long_url（加速访问，设 TTL）。</li>
      </ul>
      <p><strong>4. 访问流程</strong>：用户访问短链 → 布隆过滤器检查短码存在 → Redis 缓存查长链 → 命中返回 302 → 未命中查 MySQL → 回填缓存 → 302 重定向。</p>
      <p><strong>5. 扩展功能</strong>：访问统计（PV/UV）、过期失效、自定义短码、防恶意、二维码生成。</p>
      <p><strong>6. 面试标准答法</strong>：发号器(雪花/号段)生成ID→Base62转6位短码→MySQL存映射(短码唯一索引)+Redis缓存→访问时302重定向。优化：布隆过滤器防穿透、分库分表、访问统计。</p>`},
  {c:"场景实战",d:"★★",q:"线上死锁怎么排查？",
   a:`<p><strong>排查步骤</strong>：</p>
      <ol>
        <li><strong>jstack PID</strong>：打印线程堆栈，会自动标注 <code>Found one Java-level deadlock</code>，列出死锁线程和持有的锁。</li>
        <li>看堆栈中的 <code>- waiting to lock &lt;0x...&gt;</code> 和 <code>- locked &lt;0x...&gt;</code>，理清谁等谁的锁。</li>
        <li><strong>MySQL 死锁</strong>：<code>SHOW ENGINE INNODB STATUS</code> 看死锁日志（LATEST DETECTED DEADLOCK），看两个事务持有和等待的锁。</li>
      </ol>
      <p><strong>预防</strong>：统一加锁顺序、tryLock 超时、减小锁粒度、避免嵌套锁。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Java 死锁排查</strong></p>
      <ul>
        <li><strong>jstack PID</strong>：自动检测并输出死锁信息：哪些线程死锁、各持有什么锁、等待什么锁。</li>
        <li><strong>arthas</strong>：thread -b 找阻塞线程，thread 查看死锁。</li>
        <li><strong>JConsole/VisualVM</strong>：图形界面"检测死锁"按钮。</li>
      </ul>
      <p><strong>2. MySQL 死锁排查</strong></p>
      <ul>
        <li><strong>SHOW ENGINE INNODB STATUS</strong>：看 LATEST DETECTED DEADLOCK 段，含两个事务执行的 SQL、持有和等待的锁。</li>
        <li><strong>information_schema.INNODB_TRX</strong>：看当前活跃事务。</li>
        <li><strong>innodb_lock_wait_timeout</strong>：锁等待超时（默认 50s），超时自动回滚一个事务。</li>
      </ul>
      <p><strong>3. 死锁常见场景</strong></p>
      <ul>
        <li>不同顺序加锁：T1 先锁 A 再 B，T2 先 B 再 A。</li>
        <li>MySQL 行锁：两个事务 UPDATE 不同行但走了同一索引/间隙锁交叉。</li>
        <li>事务里嵌套调远程接口（持锁等待外部响应）。</li>
      </ul>
      <p><strong>4. 预防</strong>：统一加锁顺序、tryLock(timeout)、减小锁粒度、避免大事务、缩短事务时间。</p>
      <p><strong>5. 面试标准答法</strong>：Java死锁jstack看"Found deadlock"+锁持有等待关系。MySQL死锁SHOW ENGINE INNODB STATUS看死锁日志。预防：统一加锁顺序、tryLock超时、减小锁粒度、缩短事务。</p>`},
  {c:"场景实战",d:"★★",q:"如何防止接口重复提交（防重复下单）？",
   a:`<p><strong>防重方案</strong>：</p>
      <ol>
        <li><strong>前端</strong>：按钮点击后置灰（disabled），防连点。</li>
        <li><strong>token 机制</strong>：提交前先获取唯一 token，提交时带 token，服务端校验+删除（Redis），第二次提交 token 没了被拒绝。</li>
        <li><strong>唯一索引</strong>：订单号/请求 ID 建唯一索引，重复插入报错。</li>
        <li><strong>分布式锁</strong>：以 user_id+biz_id 为 key 加锁，重复请求拿不到锁。</li>
        <li><strong>状态机</strong>：订单状态流转校验（待支付→已支付，重复支付时状态已变拒绝）。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 重复提交的原因</strong>：用户连点、网络重试（HTTP/Feign/MQ）、页面刷新、双击支付。</p>
      <p><strong>2. 前端防重</strong>：按钮点击后 disabled/置灰（几秒）。不能只靠前端（可绕过）。</p>
      <p><strong>3. token 机制（推荐）</strong></p>
      <pre><code>// 1. 进入页面时获取 token（Redis 存一份）
GET /api/token → server 生成 uuid 存 Redis → 返回给前端
// 2. 提交时带 token
POST /api/order (Header: X-Token: uuid)
// 3. 服务端 Lua 原子校验+删除
if redis.get(token) == ok then redis.del(token) return true
else return false // 重复提交</code></pre>
      <p><strong>4. 唯一索引（最可靠）</strong>：订单表对（user_id + biz_type + 时间窗口）建唯一索引。重复创建报 DuplicateKeyException，业务捕获处理。</p>
      <p><strong>5. 分布式锁</strong>：Redis 分布式锁 key=user_id:order，同一用户同时只能下一单。</p>
      <p><strong>6. 面试标准答法</strong>：前端置灰+后端多保险：token机制(提交前获取Redis存校验删除)、唯一索引(订单号/user+biz防重复插入)、分布式锁(user+biz加锁)、状态机(状态流转校验)。前端只防误触，后端才是根本。</p>`},
  {c:"场景实战",d:"★★",q:"系统上线后缓存雪崩了怎么紧急处理？",
   a:`<p><strong>紧急处理（线上故障处理思路）</strong>：</p>
      <ol>
        <li><strong>限流降级</strong>：Sentinel/网关 对接口限流，保护 DB 不被压垮。非核心接口降级（返回默认值）。</li>
        <li><strong>手动预热缓存</strong>：紧急把热点数据写回 Redis（脚本批量 set）。</li>
        <li><strong>查原因</strong>：大量 key 同时过期？Redis 宕机？</li>
        <li><strong>修复</strong>：过期时间加随机值防同时过期、Redis 高可用（哨兵/集群）、多级缓存。</li>

   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 缓存雪崩的原因</strong></p>
      <ul>
        <li><strong>大量 key 同时过期</strong>：批量预热的 key 设了相同 TTL，同时失效，请求全打到 DB。</li>
        <li><strong>Redis 宕机</strong>：Redis 挂了，所有请求打 DB。</li>
      </ul>
      <p><strong>2. 线上紧急处理</strong></p>
      <ol>
        <li><strong>第一步：止血——限流降级</strong>。网关/Sentinel 对接口限流，保护 DB。核心接口降级返回缓存/默认值，非核心接口直接拒绝。</li>
        <li><strong>第二步：恢复缓存</strong>。手动批量预热（脚本读 DB 灌 Redis）、或重启后自动预热。如果有多级缓存（本地 Caffeine），本地还能扛一部分。</li>
        <li><strong>第三步：查根因</strong>。看 Redis 监控（是否宕机）、看 key TTL（是否同时过期）。</li>
        <li><strong>第四步：修复预防</strong>。见下。</li>
      </ol>
      <p><strong>3. 预防措施</strong></p>
      <ul>
        <li><strong>过期时间加随机值</strong>：base + random(0, 300s)，避免同时过期。</li>
        <li><strong>Redis 高可用</strong>：哨兵/Cluster，避免单点宕机。</li>
        <li><strong>多级缓存</strong>：本地 Caffeine + Redis，Redis 挂了本地还能扛。</li>
        <li><strong>熔断降级</strong>：DB 压力大时自动降级（返回缓存/默认值）。</li>
        <li><strong>缓存永不过期 + 后台更新</strong>：热点 key 不设 TTL，后台异步更新。</li>

      <p><strong>4. 面试标准答法</strong>：紧急处理：限流降级保DB→手动预热恢复缓存→查根因(同时过期/Redis宕机)→修复(随机TTL/高可用/多级缓存/熔断降级)。体现线上故障处理思路：止血→恢复→查因→预防。</p>`},
  {c:"场景实战",d:"★★",q:"大文件上传/下载怎么处理？",
   a:`<p><strong>大文件上传</strong>：</p>
      <ul>
        <li><strong>分片上传</strong>：前端把大文件切成小块（如 5MB/片），并行上传，后端合并。</li>
        <li><strong>断点续传</strong>：记录已上传分片（Redis/DB），中断后从断点继续。</li>
        <li><strong>秒传</strong>：MD5 校验文件是否已存在，已存在则直接返回（不重复传）。</li>
        <li><strong>直传 OSS/对象存储</strong>：前端直传云存储，后端只发签名，减轻服务器压力。</li>
      </ul>
      <p><strong>大文件下载</strong>：分块下载（Range 请求头）、压缩传输（gzip）、CDN 加速、异步生成+通知。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 大文件上传方案</strong></p>
      <ul>
        <li><strong>分片上传</strong>：前端用 Blob.slice() 切片，并行上传分片（并发控制），后端合并。解决超大文件上传超时/内存问题。</li>
        <li><strong>断点续传</strong>：上传前查询已传分片（Redis 存：fileMd5 → 已传分片列表），只传缺失的。网络中断后可继续。</li>
        <li><strong>秒传</strong>：计算文件 MD5 → 查 DB/Redis 是否已存在 → 存在则跳过上传直接返回 URL。</li>
        <li><strong>直传对象存储</strong>：后端生成临时签名（STS/预签名 URL）→ 前端直传 S3/OSS → 后端不中转（省带宽+CPU）。</li>
      </ul>
      <p><strong>2. 后端处理</strong></p>
      <ul>
        <li><strong>分片接收</strong>：multipart 接收分片，存临时目录。</li>
        <li><strong>合并</strong>：所有分片到齐后合并（RandomAccessFile 或 FileChannel）。</li>
        <li><strong>MD5 校验</strong>：合并后校验 MD5 确保完整。</li>
        <li><strong>流式处理</strong>：避免一次性加载到内存（用 InputStream/Buffer）。</li>
      </ul>
      <p><strong>3. 大文件下载</strong></p>
      <ul>
        <li><strong>Range 分块下载</strong>：HTTP Range 头支持断点下载（206 Partial Content）。</li>
        <li><strong>流式输出</strong>：OutputStream 流式写，不加载到内存。</li>
        <li><strong>CDN/对象存储</strong>：文件放 OSS/CDN，客户端直接下载。</li>
        <li><strong>导出大文件</strong>：异步生成（线程/MQ）→ 生成完通知 → 下载链接。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：上传：分片(切片并行传)+断点续传(Redis记已传分片)+秒传(MD5查重)+直传OSS(签名直传不中转)。下载：Range分块+流式输出+CDN+异步生成。核心：避免大文件加载内存、利用分片和流式。</p>`},
  {c:"场景实战",d:"★★",q:"线程池满了（拒绝策略触发）怎么处理？",
   a:`<p><strong>排查</strong>：</p>
      <ol>
        <li><strong>看拒绝策略</strong>：默认 AbortPolicy 抛 RejectedExecutionException。看日志确认。</li>
        <li><strong>查原因</strong>：① 任务太多（流量突增）；② 任务执行太慢（下游慢/死循环）；③ 核心线程数/队列配置太小。</li>
        <li><strong>解决</strong>：① 调大线程数/队列；② 优化任务执行速度；③ 改拒绝策略（CallerRunsPolicy 让调用方执行降速）；④ 加监控告警（队列长度、拒绝次数）。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 线程池满了的表现</strong>：RejectedExecutionException（AbortPolicy）、任务被丢弃（DiscardPolicy）、调用方自己执行（CallerRunsPolicy）。</p>
      <p><strong>2. 排查步骤</strong></p>
      <ol>
        <li><strong>确认拒绝策略</strong>：看线程池配置的 handler。</li>
        <li><strong>看监控</strong>：活跃线程数、队列堆积数、拒绝次数（ThreadPoolExecutor 的方法 getActiveCount/getQueue.size/getRejectedCount）。</li>
        <li><strong>jstack</strong>：看线程在干什么（是卡在某个慢调用还是死循环）。</li>
        <li><strong>查流量</strong>：是否有突发流量（秒杀/故障重试风暴）。</li>
      </ol>
      <p><strong>3. 解决方案</strong></p>
      <ul>
        <li><strong>调参</strong>：增大 corePoolSize / maximumPoolSize / queueCapacity。但要考虑系统承载（线程太多上下文切换开销）。</li>
        <li><strong>优化任务</strong>：减少单任务耗时（异步化、批量化、加超时）。避免任务里调慢的下游接口。</li>
        <li><strong>改拒绝策略</strong>：CallerRunsPolicy（调用方执行，降速保护）或自定义（持久化到 MQ/DB 后续补偿）。</li>
        <li><strong>上游限流</strong>：Sentinel/网关限流，从源头控制。</li>
        <li><strong>监控告警</strong>：队列长度、拒绝次数监控，提前预警。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：看拒绝策略和监控(队列堆积/拒绝次数)→查原因(流量突增/任务慢/配置小)→解决(调大池/优化任务耗时/改CallerRunsPolicy降速/上游限流/加监控)。不能只调参数，要治本(优化任务)。</p>`},
  {c:"场景实战",d:"★",q:"如何设计一个分布式限流方案？",
   a:`<p><strong>方案</strong>：</p>
      <ul>
        <li><strong>Redis + Lua 脚本</strong>：滑动窗口（ZSet 存请求时间戳，清理过期后判断数量）。Lua 保证判断+计数原子。</li>
        <li><strong>Sentinel</strong>：阿里开源，支持集群限流（Token Server 模式），配置规则。</li>
        <li><strong>网关层</strong>：Spring Cloud Gateway RequestRateLimiter（基于 Redis 令牌桶）。</li>

      <p><strong>关键点</strong>：① 保证原子性（Lua）；② 时钟同步（NTP）；③ 降级方案（Redis 挂了怎么办）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 分布式限流的需求</strong>：多实例部署时，单机限流（Guava RateLimiter）不够（各实例独立计数），需要全局统一的限流。</p>
      <p><strong>2. Redis + Lua 方案（最常用）</strong></p>
      <ul>
        <li><strong>固定窗口</strong>：key=rate:{api}:{minute}，INCR + EXPIRE。简单但有临界突刺。</li>
        <li><strong>滑动窗口</strong>：ZSet，member=请求ID（唯一），score=时间戳。每次：ZREMRANGEBYSCORE 清理过期 → ZCARD 数量判断 → ZADD。Lua 保证原子。</li>
        <li><strong>令牌桶</strong>：Lua 实现补充令牌+消费逻辑（按时间差补充令牌，判断足够再消费）。</li>
      </ul>
      <p><strong>3. Sentinel 集群限流</strong></p>
      <ul>
        <li>Token Server 模式：一个 Token Server 集中管理限流规则，各实例作为 Client 向 Server 申请 token。</li>
        <li>优点：开箱即用、可视化控制台。缺点：Token Server 单点（需高可用）。</li>
      </ul>
      <p><strong>4. 网关层限流</strong></p>
      <ul>
        <li>Spring Cloud Gateway + RequestRateLimiter（基于 Redis 令牌桶）。</li>
        <li>Nginx limit_req（漏桶，单机限流，各 Nginx 独立）。</li>
      </ul>
      <p><strong>5. 注意事项</strong>：① 原子性（Lua 脚本）；② Redis 降级（挂了是否放行还是拒绝）；③ 时钟同步（NTP，分布式时间一致）；④ 性能（Redis 延迟，可本地缓存+定期同步）。</p>
      <p><strong>6. 面试标准答法</strong>：Redis+Lua(滑动窗口ZSet/令牌桶，Lua保证原子)。Sentinel集群限流(Token Server集中管理)。Gateway RequestRateLimiter(Redis令牌桶)。注意：原子性(Lua)、Redis降级、时钟同步、性能。</p>`},
  {c:"场景实战",d:"★",q:"消息积压了怎么紧急处理？",
   a:`<p><strong>紧急处理</strong>：</p>
      <ol>
        <li><strong>扩消费者</strong>：增加消费者实例。注意 Kafka 消费者数 ≤ 分区数（超出无效，需先扩分区）。</li>
        <li><strong>临时转发</strong>：消费逻辑慢的话，先只接收不处理，转发到新 topic（分区更多），新消费者慢慢消化。</li>
        <li><strong>查根因</strong>：消费者挂了？Bug？下游慢？流量突增？</li>

      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 积压的影响</strong>：延迟高、磁盘满、消息过期丢失、影响业务实时性。</p>
      <p><strong>2. 紧急处理（先止血）</strong></p>
      <ol>
        <li><strong>扩消费者</strong>：加 Pod/实例。Kafka 注意：消费者数 ≤ 分区数（多余的消费者空闲）。必要时先扩分区。</li>
        <li><strong>临时转发</strong>：老 topic 消费慢 → 新建一个分区更多的 topic → 老消费者只转发不处理 → 新消费者分 N 个分区消化。</li>
        <li><strong>限流上游</strong>：让生产端降速，给消费端喘息时间。</li>
      </ol>
      <p><strong>3. 查根因</strong></p>
      <ul>
        <li>消费者挂了（OOM/异常）→ 重启 + 修 Bug。</li>
        <li>消费太慢（下游 DB/接口慢）→ 优化下游、加超时、批量化。</li>
        <li>流量突增（大促/重试风暴）→ 扩容 + 限流。</li>
        <li>死信循环（消息反复失败重试）→ 死信队列 + 告警。</li>
      </ol>
      <p><strong>4. 长期预防</strong></p>
      <ul>
        <li><strong>监控告警</strong>：积压量（Lag）监控，超阈值告警。</li>
        <li><strong>合理容量规划</strong>：按峰值流量配分区和消费者。</li>
        <li><strong>消费幂等</strong>：失败重试不产生副作用。</li>
        <li><strong>死信队列</strong>：处理不了的消息进死信，不阻塞主队列。</li>
        <li><strong>批量消费</strong>：攒一批处理，减少 DB/网络开销。</li>

      <p><strong>5. 面试标准答法</strong>：紧急：扩消费者(Kafka不超分区数)、临时转发到新topic先消化、限流上游。查因：消费者挂/Bug/下游慢/流量突增。优化：批量化/异步/加超时。预防：Lag监控告警、合理容量、死信队列、幂等。</p>`}
];

// ============ 状态 ============
const STORE_KEY = 'java_interview_state_v1';
let state = {
  seen: {},        // id -> true 已练习
  mastered: {},    // id -> true 已掌握
  activeCats: [],  // 选中的分类，空=全部
  currentId: null,
  reviewMode: null, // null=正常, 'mastered'=复习已掌握, 'seen'=复习已练习
  history: [],     // 看过的题目ID历史（按顺序）
  historyIdx: -1   // 当前在历史中的位置（支持上一题回退）
};

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s) state = Object.assign(state, s);
  }catch(e){}
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify({seen:state.seen, mastered:state.mastered, activeCats:state.activeCats}));
}

// 分类列表
function getCategories(){
  const set = new Set();
  QUESTIONS.forEach(q=>set.add(q.c));
  return [...set];
}
function getFiltered(){
  // 复习模式优先：只显示已掌握/已练习的题
  if(state.reviewMode === 'mastered'){
    return QUESTIONS.filter((q,id) => state.mastered[id]);
  }
  if(state.reviewMode === 'seen'){
    return QUESTIONS.filter((q,id) => state.seen[id]);
  }
  // 正常模式：按分类过滤
  if(state.activeCats.length===0) return QUESTIONS;
  return QUESTIONS.filter(q=>state.activeCats.includes(q.c));
}

// ============ 渲染 ============
function renderChips(){
  const cats = getCategories();
  const chips = document.getElementById('chips');
  const allActive = state.activeCats.length===0;
  const totalCount = QUESTIONS.length;
  let html = `<span class="chip ${allActive?'active':''}" onclick="toggleCat('')">🌐 全部 (${totalCount})</span>`;
  // 统计每个分类的题数
  const catCount = {};
  QUESTIONS.forEach(q => catCount[q.c] = (catCount[q.c]||0)+1);
  cats.forEach(c=>{
    const active = state.activeCats.includes(c);
    html += `<span class="chip ${active?'active':''}" onclick="toggleCat('${c}')">${c} (${catCount[c]||0})</span>`;
  });
  chips.innerHTML = html;
}

function renderStats(){
  const total = QUESTIONS.length;
  const mastered = Object.keys(state.mastered).length;
  const seen = Object.keys(state.seen).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statSeen').textContent = seen;
  const pct = total>0 ? Math.round(seen/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
}

function renderQuestion(id, isBack, autoExpand){
  const q = QUESTIONS[id];
  if(!q) return;
  state.currentId = id;
  state.seen[id] = true;
  // 记录历史：只有"前进/新题"才记，回退只移动指针
  if(!isBack){
    // 如果当前不在历史末尾（之前回退过），截断后面的
    state.history = state.history.slice(0, state.historyIdx + 1);
    state.history.push(id);
    state.historyIdx = state.history.length - 1;
  }
  save();

  const tag = document.getElementById('qTag');
  tag.className = 'tag c-'+q.c;
  tag.textContent = q.c;
  document.getElementById('qLevel').textContent = q.d;
  // 按当前筛选范围计算序号和总数
  const pool = getFiltered();
  const posInPool = pool.indexOf(q) + 1;
  document.getElementById('qNum').textContent = `第 ${posInPool}/${pool.length} 题`;
  document.getElementById('question').textContent = q.q;
  document.getElementById('answer').innerHTML = q.a;
  // 八股文：有 b 字段才显示切换按钮
  const hasBagwen = !!q.b;
  const toggle = document.getElementById('bagwenToggle');
  toggle.style.display = hasBagwen ? 'block' : 'none';
  document.getElementById('bagwenBody').innerHTML = hasBagwen ? q.b : '';
  document.getElementById('actions').style.display = 'flex';

  // 默认展开答案和八股文（复习列表点进去时不展开）
  if(autoExpand !== false){
    document.getElementById('answerWrap').classList.add('show');
    document.querySelector('.btn-answer').textContent = '🙈 收起答案';
    if(hasBagwen){
      document.getElementById('bagwenBody').classList.add('show');
      document.getElementById('bagwenBtn').textContent = '🙈 收起八股文';
    }
  }else{
    document.getElementById('answerWrap').classList.remove('show');
    document.querySelector('.btn-answer').textContent = '👁 查看答案';
    document.getElementById('bagwenBody').classList.remove('show');
    document.getElementById('bagwenBtn').textContent = '📖 查看八股文详解';
  }

  // 更新掌握按钮状态
  updateMasteredBtn();
  renderStats();
  window.scrollTo({top:0, behavior:'smooth'});
}

function toggleBagwen(){
  const body = document.getElementById('bagwenBody');
  body.classList.toggle('show');
  document.getElementById('bagwenBtn').textContent = body.classList.contains('show') ? '🙈 收起八股文' : '📖 查看八股文详解';
}

// ============ 复习模式 ============
function openReview(type){
  // type: 'mastered' 或 'seen'，再点同一个取消
  if(state.reviewMode === type){
    state.reviewMode = null;  // 再点取消，回到正常
  }else{
    state.reviewMode = type;
  }
  // 清除分类筛选（复习模式不按分类）
  state.activeCats = [];
  save();
  renderChips();
  renderReviewBanner();
  // 跳到复习池第一题
  const pool = getFiltered();
  if(pool.length > 0){
    renderQuestion(QUESTIONS.indexOf(pool[0]));
    // 复习模式自动展开答案和八股文
    document.getElementById('answerWrap').classList.add('show');
    document.querySelector('.btn-answer').textContent = '🙈 收起答案';
    const bagwenToggle = document.getElementById('bagwenToggle');
    if(bagwenToggle.style.display !== 'none'){
      document.getElementById('bagwenBody').classList.add('show');
      document.getElementById('bagwenBtn').textContent = '🙈 收起八股文';
    }
  }
}
function renderReviewBanner(){
  // 在专题筛选标题处显示当前复习模式
  const title = document.querySelector('.filter-title');
  if(state.reviewMode === 'mastered'){
    title.innerHTML = '✅ 复习模式：已掌握（上下翻页复习，点"已掌握"退出）';
  }else if(state.reviewMode === 'seen'){
    title.innerHTML = '📚 复习模式：已练习（上下翻页复习，点"已练习"退出）';
  }else{
    title.innerHTML = '📚 选择专题';
  }
}
function closeReview(){
  // 兼容：关闭可能残留的弹窗
  document.body.style.overflow = '';
  document.getElementById('reviewMask').classList.remove('show');
  document.getElementById('reviewModal').classList.remove('show');
}
function pickReview(id){
  // 兼容旧弹窗调用，直接跳转
  closeReview();
  renderQuestion(id);
}

function updateMasteredBtn(){
  const btn = document.querySelector('.btn-mastered');
  if(state.currentId!=null && state.mastered[state.currentId]){
    btn.textContent = '✅ 已掌握';
    btn.style.background = '#16a34a';
  }else{
    btn.textContent = '✅ 标记掌握';
    btn.style.background = '';
  }
}

function toggleAnswer(){
  const wrap = document.getElementById('answerWrap');
  wrap.classList.toggle('show');
  const btn = document.querySelector('.btn-answer');
  btn.textContent = wrap.classList.contains('show') ? '🙈 收起答案' : '👁 查看答案';
}

function markMastered(){
  if(state.currentId==null) return;
  if(state.mastered[state.currentId]){
    delete state.mastered[state.currentId];
  }else{
    state.mastered[state.currentId] = true;
  }
  save();
  updateMasteredBtn();
  renderStats();
}

function next(){
  const pool = getFiltered();
  if(pool.length===0){ alert('该专题暂无题目'); return; }
  // 复习模式：按顺序翻
  if(state.reviewMode){
    let curIdx = pool.findIndex(q => QUESTIONS.indexOf(q) === state.currentId);
    if(curIdx === -1) curIdx = 0;
    const nextIdx = curIdx < pool.length - 1 ? curIdx + 1 : 0;
    renderQuestion(QUESTIONS.indexOf(pool[nextIdx]));
    autoExpandAnswer();
    return;
  }
  // 正常模式：优先出未掌握的，没掌握的题里随机
  const unmastered = pool.filter(q=>!state.mastered[QUESTIONS.indexOf(q)]);
  const arr = unmastered.length>0 ? unmastered : pool;
  let pick;
  let tries = 0;
  do{
    pick = arr[Math.floor(Math.random()*arr.length)];
    tries++;
  }while(QUESTIONS.indexOf(pick)===state.currentId && arr.length>1 && tries<10);
  renderQuestion(QUESTIONS.indexOf(pick));
}

function prev(){
  // 上一题：回到历史记录中的上一道题
  if(state.historyIdx > 0){
    state.historyIdx--;
    renderQuestion(state.history[state.historyIdx], true);  // isBack=true
    if(state.reviewMode) autoExpandAnswer();
    return;
  }
  // 没有更早的历史了，给提示
  // 复习模式按顺序往回翻
  if(state.reviewMode){
    const pool = getFiltered();
    if(pool.length===0) return;
    let curIdx = pool.findIndex(q => QUESTIONS.indexOf(q) === state.currentId);
    if(curIdx === -1) curIdx = 0;
    const prevIdx = curIdx > 0 ? curIdx - 1 : pool.length - 1;
    renderQuestion(QUESTIONS.indexOf(pool[prevIdx]));
    autoExpandAnswer();
    return;
  }
  // 普通模式没有更早历史，循环到随机一题
  next();
}

function autoExpandAnswer(){
  document.getElementById('answerWrap').classList.add('show');
  document.querySelector('.btn-answer').textContent = '🙈 收起答案';
  const bagwenToggle = document.getElementById('bagwenToggle');
  if(bagwenToggle.style.display !== 'none'){
    document.getElementById('bagwenBody').classList.add('show');
    document.getElementById('bagwenBtn').textContent = '🙈 收起八股文';
  }
}

function toggleCat(c){
  // 选分类时退出复习模式
  state.reviewMode = null;
  if(c===''){
    state.activeCats = [];
  }else{
    // 单选：点新的分类直接替换，再点当前的取消（回到全部）
    if(state.activeCats.length===1 && state.activeCats[0]===c){
      state.activeCats = [];  // 再点取消，回到全部
    }else{
      state.activeCats = [c];  // 单选替换
    }
  }
  save();
  renderChips();
  renderReviewBanner();
  // 选了分类后自动跳到该分类第一题
  const pool = getFiltered();
  if(pool.length > 0){
    renderQuestion(QUESTIONS.indexOf(pool[0]));
  }
}

function resetAll(){
  if(!confirm('确定要重置所有学习记录吗？这将清除已掌握和已练习标记。')) return;
  state.seen = {};
  state.mastered = {};
  save();
  renderStats();
  next();
}

// ============ 初始化 ============
load();
renderChips();
renderReviewBanner();
renderStats();
// 自动出第一题
setTimeout(()=>next(), 100);

// 键盘快捷键（电脑端）
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggleAnswer(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='m'||e.key==='M'){ markMastered(); }
});
</script>
</body>
</html>
