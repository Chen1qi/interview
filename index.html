  {c:"网络",d:"★★★",q:"Cookie、Session、Token、JWT 的区别？",
   a:`<ul>
        <li><strong>Cookie</strong>：浏览器存储的小段数据，每次请求自动带，有大小限制（4KB）。可被禁用。</li>
        <li><strong>Session</strong>：服务端存储会话信息，通过 sessionId（存在 Cookie 里）标识。服务端有状态。</li>
        <li><strong>Token</strong>：服务端生成的令牌，客户端保存（常放 Header）。服务端无状态，适合分布式。</li>
        <li><strong>JWT（JSON Web Token）</strong>：一种 Token 标准格式 = Header.Payload.Signature。
          <ul>
            <li>Payload 含用户信息（base64，可解码，别放敏感数据）。</li>
            <li>Signature 用密钥签名防篡改。</li>
            <li>无状态、跨域友好；缺点：签发后无法主动失效（除非配合黑名单）。</li>
          </ul>
        </li>
      </ul>
      <blockquote>选型：单体应用可用 Session；微服务/前后端分离/移动端推荐 JWT。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Cookie</strong></p>
      <ul>
        <li>浏览器存储的小段数据（&lt;4KB），由服务端 Set-Cookie 设置。</li>
        <li>每次同源请求<strong>自动携带</strong>（在 Header）。</li>
        <li>属性：domain/path（作用域）、expires/max-age（过期）、HttpOnly（JS读不到，防XSS）、Secure（仅HTTPS）、SameSite（防CSRF）。</li>
        <li>场景：登录态、用户偏好、跟踪（广告）。</li>
      </ul>
      <p><strong>2. Session（会话）</strong></p>
      <ul>
        <li>会话信息存在<strong>服务端</strong>（内存/Redis）。客户端拿一个 sessionId（通常在 Cookie 里）标识。</li>
        <li>服务端<strong>有状态</strong>（要存 Session）。</li>
        <li>缺点：服务端存储压力、分布式 Session 问题、CSRF 风险（Cookie 自动带）。</li>
      </ul>
      <p><strong>3. Token</strong></p>
      <ul>
        <li>服务端生成的<strong>令牌字符串</strong>，客户端保存（常放 localStorage，请求放 Header 如 Authorization: Bearer xxx）。</li>
        <li>服务端<strong>无状态</strong>（不存，验证签名即可）。适合<strong>分布式/微服务</strong>（不共享 Session）。</li>
        <li>比 Cookie+Session 更灵活（移动端、跨域友好）。</li>
      </ul>
      <p><strong>4. JWT（JSON Web Token）</strong></p>
      <p>Token 的一种标准格式：Header.Payload.Signature（三段 base64 用 . 连接）。</p>
      <ul>
        <li><strong>Header</strong>：算法类型（如 HS256）和类型（JWT）。</li>
        <li><strong>Payload</strong>：用户信息/声明（sub 用户、exp 过期、自定义）。base64 编码，<strong>可解码，别放敏感数据</strong>。</li>
        <li><strong>Signature</strong>：用密钥对 Header+Payload 签名（防篡改）。</li>
        <li><strong>验证</strong>：服务端用密钥重新算签名对比，一致则有效且未被篡改。</li>
        <li><strong>优点</strong>：无状态、自包含（含用户信息）、跨域友好。</li>
        <li><strong>缺点</strong>：① 签发后<strong>无法主动失效</strong>（要配合黑名单/短过期+refresh token）；② Payload 可被读（敏感信息别放）；③ 续期麻烦；④ 撤销难。</li>
      </ul>
      <p><strong>5. 对比与选型</strong></p>
      <ul>
        <li>单体应用：Cookie + Session（简单）。</li>
        <li>微服务/前后端分离/移动端：JWT（无状态，分布式友好）。</li>
        <li>高安全（要主动登出）：Session（或 JWT + Redis 黑名单）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Cookie浏览器存自动带(4KB)。Session服务端存sessionId(有状态，分布式难)。Token服务端发客户端存(无状态，分布式友好)。JWT=Header.Payload.Signature(自包含无状态，签名防篡改，缺点无法主动失效)。单体用Session，微服务用JWT。</p>`},
  {c:"网络",d:"★★",q:"什么是跨域？CORS 是怎么解决的？",
   a:`<p><strong>同源策略</strong>：浏览器限制 JS 发起跨源（协议/域名/端口任一不同）请求。</p>
      <p><strong>CORS（跨域资源共享）</strong>：标准方案。</p>
      <ul>
        <li><strong>简单请求</strong>：GET/HEAD/POST（特定 Content-Type）直接发送，服务端响应加 <code>Access-Control-Allow-Origin</code> 头。</li>
        <li><strong>预检请求</strong>：非简单请求（如 PUT、自定义头、application/json）浏览器先发 <strong>OPTIONS</strong> 询问，服务端同意后才发真实请求。</li>
      </ul>
      <blockquote>响应头：Access-Control-Allow-Origin、Allow-Methods、Allow-Headers、Allow-Credentials（带 Cookie 时需此头且 Origin 不能是 *）。Nginx/Spring 都可配置。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 同源策略</strong></p>
      <p>浏览器安全策略：JS 脚本只能访问<strong>同源</strong>（协议+域名+端口完全相同）的资源。不同源的请求被限制（防 CSRF、数据泄露）。这是浏览器的安全基石。</p>
      <p>跨域：协议(http vs https)、域名(a.com vs b.com)、端口(80 vs 8080)任一不同，就是跨域。</p>
      <p><strong>2. 为什么会有跨域问题</strong></p>
      <p>前端 a.com 的 JS 要访问 b.com 的 API（不同源），浏览器阻止（同源策略）。前后端分离、微服务、CDN 等场景常见。</p>
      <p><strong>3. CORS（跨域资源共享，标准方案）</strong></p>
      <p>W3C 标准，服务端配合响应头来允许跨域。分两类：</p>
      <ul>
        <li><strong>简单请求</strong>（不预检）：
          <ul>
            <li>条件：方法 GET/HEAD/POST；Content-Type 是 text/plain、multipart/form-data、application/x-www-form-urlencoded；无自定义头。</li>
            <li>浏览器直接发请求，服务端响应加 <strong>Access-Control-Allow-Origin: *</strong>（或具体域名）允许。</li>
          </ul>
        </li>
        <li><strong>预检请求 Preflight</strong>（OPTIONS）：
          <ul>
            <li>条件：非简单请求（如 PUT/DELETE 方法、application/json、自定义 Header 如 Authorization、Token）。</li>
            <li>浏览器<strong>先发 OPTIONS 请求</strong>询问服务端是否允许，服务端响应 Allow-Methods/Allow-Headers/Allow-Origin。允许后才发真实请求。</li>
          </ul>
        </li>
      </ul>
      <p><strong>4. CORS 相关响应头</strong></p>
      <ul>
        <li><strong>Access-Control-Allow-Origin</strong>：允许的源（* 或具体域名）。</li>
        <li><strong>Access-Control-Allow-Methods</strong>：允许的方法（GET,POST,PUT...）。</li>
        <li><strong>Access-Control-Allow-Headers</strong>：允许的请求头。</li>
        <li><strong>Access-Control-Allow-Credentials: true</strong>：允许带 Cookie。注意：此时 Allow-Origin <strong>不能是 *</strong>（必须具体域名）。</li>
        <li><strong>Access-Control-Max-Age</strong>：预检结果缓存时间。</li>
      </ul>
      <p><strong>5. 其他跨域方案</strong></p>
      <ul>
        <li><strong>JSONP</strong>：利用 &lt;script&gt; 标签不受同源策略限制。只支持 GET，老旧。</li>
        <li><strong>Nginx 反向代理</strong>：前端请求同源的 Nginx，Nginx 转发到跨域后端（同源了）。最常用。</li>
        <li><strong>postMessage</strong>：窗口间通信（iframe）。</li>
        <li><strong>Node 代理</strong>：开发时 webpack-dev-server proxy。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>同源策略：协议域名端口完全相同。跨域限制JS。CORS：服务端响应Access-Control-Allow-Origin。简单请求直接发，非简单(PUT/JSON/自定义头)先OPTIONS预检。带Cookie要Allow-Credentials且Origin不能*。生产用Nginx代理最常用。</p>`},
  {c:"网络",d:"★★",q:"HTTP/1.1、HTTP/2、HTTP/3 的演进？",
   a:`<ul>
        <li><strong>HTTP/1.1</strong>：持久连接（keep-alive）、管道化（但队头阻塞）、文本协议。</li>
        <li><strong>HTTP/2</strong>：二进制分帧、<strong>多路复用</strong>（一个连接并发多个请求，解决应用层队头阻塞）、头部压缩 HPACK、服务端推送。</li>
        <li><strong>HTTP/3</strong>：基于 <strong>QUIC（UDP）</strong>，解决 TCP 层队头阻塞、0-RTT 连接、连接迁移（切 WiFi 不断连）。</li>
      </ul>
      <blockquote>队头阻塞：HTTP/1.1 一个请求慢，后面的全等。HTTP/2 解决了应用层，但 TCP 丢包仍会阻塞整个连接。HTTP/3 用 QUIC 的独立流解决。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. HTTP/1.0</strong></p>
      <ul>
        <li>每次请求新建 TCP 连接（短连接），请求完断开。开销大。</li>
      </ul>
      <p><strong>2. HTTP/1.1（最广泛）</strong></p>
      <ul>
        <li><strong>持久连接 keep-alive</strong>：一个 TCP 连接可发多个请求（默认开启），减少握手开销。</li>
        <li><strong>管道化 pipelining</strong>：可同时发多个请求，但<strong>响应要按序返回</strong>（队头阻塞）。</li>
        <li><strong>文本协议</strong>：可读但解析慢、体积大。</li>
        <li><strong>队头阻塞</strong>：一个请求慢，后面的全等。</li>
        <li>Host 头：支持虚拟主机。</li>
        <li>缓存：Cache-Control、ETag。</li>
      </ul>
      <p><strong>3. HTTP/2（2015）</strong></p>
      <ul>
        <li><strong>二进制分帧</strong>：数据分成二进制帧传输（不再是文本），解析快、体积小。</li>
        <li><strong>多路复用 Multiplexing（核心）</strong>：一个 TCP 连接上<strong>并发</strong>多个请求/响应（每个流独立），解决应用层队头阻塞。</li>
        <li><strong>头部压缩 HPACK</strong>：压缩请求头（重复头只发一次），省带宽。</li>
        <li><strong>服务端推送 Server Push</strong>：服务端可主动推送资源（如 HTML 依赖的 CSS/JS）。</li>
        <li><strong>仍有的问题</strong>：底层 TCP 的<strong>队头阻塞</strong>——TCP 丢一个包，整个连接的所有流都阻塞等重传。</li>
      </ul>
      <p><strong>4. HTTP/3（2022，基于 QUIC）</strong></p>
      <ul>
        <li><strong>基于 QUIC（UDP）</strong>：不用 TCP，在 UDP 上实现可靠传输。</li>
        <li><strong>解决 TCP 队头阻塞</strong>：QUIC 的流独立，一个流丢包不影响其他流。</li>
        <li><strong>0-RTT/1-RTT 连接</strong>：复用之前的连接信息，握手 0 或 1 个 RTT（比 TCP+TLS 的 3 RTT 快很多）。</li>
        <li><strong>连接迁移</strong>：基于连接 ID 而非 IP+端口，切换网络（WiFi→4G）不断连。</li>
        <li><strong>内置 TLS 1.3</strong>：加密是强制的。</li>
      </ul>
      <p><strong>5. 队头阻塞的演进</strong></p>
      <ul>
        <li>HTTP/1.1：应用层队头阻塞（响应按序）。</li>
        <li>HTTP/2：解决应用层（多路复用），但 TCP 层队头阻塞还在。</li>
        <li>HTTP/3：QUIC 独立流，彻底解决。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>HTTP/1.1: 持久连接+文本+应用层队头阻塞。HTTP/2: 二进制分帧+多路复用(一个连接并发多请求)+HPACK头部压缩+服务端推送(解决应用层队头阻塞，但TCP层还在)。HTTP/3: 基于QUIC(UDP)+独立流(解决TCP队头阻塞)+0-RTT+连接迁移。</p>`},
  {c:"网络",d:"★★",q:"HTTPS 怎么防中间人攻击？能完全防住吗？",
   a:`<p>HTTPS 防<strong>被动窃听</strong>和<strong>篡改</strong>靠 TLS。</p>
      <p><strong>防中间人原理</strong>：证书由受信任 CA 签名，浏览器内置 CA 公钥能验签。中间人替换证书会因为签名不匹配被浏览器警告。</p>
      <p><strong>仍存在的攻击面</strong>：</p>
      <ul>
        <li><strong>伪造/钓鱼证书</strong>：CA 被入侵或用户信任了恶意 CA。</li>
        <li><strong>中间人代理</strong>：用户主动安装企业根证书（如抓包工具 Charles/Fiddler）。</li>
        <li><strong>降级攻击</strong>：强制用弱版本 TLS（已用 TLS_FALLBACK_SCSV 缓解）。</li>
      </ul>
      <blockquote>HSTS 头强制 HTTPS、证书透明度（CT）、证书钉扎（Pinning）是增强手段。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. HTTPS 防中间人（MITM）的原理</strong></p>
      <p>中间人攻击：攻击者冒充服务器和客户端通信，冒充客户端和服务器通信，窃听/篡改数据。</p>
      <p>HTTPS 靠<strong>证书 + 信任链</strong>防中间人：</p>
      <ul>
        <li>服务端证书由<strong>受信任的 CA</strong>（证书颁发机构）签名，含服务端公钥和域名。</li>
        <li>浏览器/操作系统<strong>内置 CA 根证书</strong>（公钥），能验证服务端证书的签名。</li>
        <li>中间人无法伪造 CA 签名（没有 CA 私钥），所以无法伪造合法证书。即使中间人替换证书，浏览器验签失败会<strong>警告</strong>（"不安全"）。</li>
      </ul>
      <p><strong>2. 仍存在的攻击面（不能完全防住）</strong></p>
      <ul>
        <li><strong>CA 被入侵/出错</strong>：CA 私钥泄露，攻击者可签发任意域名的合法证书。历史上发生过（如 DigiNotar 倒闭）。缓解：证书透明度 CT。</li>
        <li><strong>用户信任恶意 CA/根证书</strong>：用户主动安装了恶意根证书（如企业、抓包工具 Charles/Fiddler），攻击者就能签发被信任的伪造证书。</li>
        <li><strong>中间人代理</strong>：公司/家长控制软件让用户装根证书后可解密 HTTPS 监控。</li>
        <li><strong>降级攻击</strong>：攻击者强制降到弱版本 TLS/SSL。缓解：TLS_FALLBACK_SCSV、禁用旧版本。</li>
        <li><strong>SSL 剥离</strong>：把 HTTPS 降级成 HTTP。缓解：HSTS。</li>
        <li><strong>用户忽视警告</strong>：浏览器警告"不安全"，用户点"继续访问"。</li>
      </ul>
      <p><strong>3. 增强手段</strong></p>
      <ul>
        <li><strong>HSTS（HTTP Strict Transport Security）</strong>：服务端发 Strict-Transport-Security 头，强制浏览器只走 HTTPS（防降级剥离）。可预加载到浏览器。</li>
        <li><strong>证书透明度 CT（Certificate Transparency）</strong>：所有 CA 签发的证书记录在公开日志，可审计，发现异常签发。</li>
        <li><strong>证书钉扎 Certificate Pinning</strong>：客户端固定信任某个证书/公钥（不依赖系统 CA）。防 CA 被攻破。App 常用（移动端），Web 已废弃（HPKP）。</li>
        <li><strong>禁用弱算法</strong>：禁用 SSLv3、RC4、MD5，强制 TLS 1.2+。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>HTTPS靠CA证书+信任链防中间人(浏览器内置CA根证书验签，中间人无法伪造CA签名)。但不能完全防：CA被入侵、用户装恶意根证书(抓包工具)、降级攻击、用户忽视警告。增强：HSTS(强制HTTPS)、证书透明度CT(审计)、证书钉扎(固定信任)。</p>`},

  {c:"Redis",d:"★★",q:"Redis 的大 Key 问题怎么发现和解决？",
   a:`<p><strong>大 Key 定义</strong>（参考）：String &gt;10KB、Hash/List/Set/ZSet 元素 &gt;5000 或 &gt;10MB。</p>
      <p><strong>危害</strong>：阻塞其他请求（Redis 单线程）、网络阻塞、集群迁移卡顿、删除引发主从同步延迟、内存不均。</p>
      <p><strong>发现</strong>：redis-cli --bigkeys、memory usage key、RDB 文件分析工具（rdb-tools）。</p>
      <p><strong>解决</strong>：</p>
      <ul>
        <li>拆分：大 Hash 按字段拆、大 List 分段。</li>
        <li>压缩 value。</li>
        <li>删除用 UNLINK（异步删）而非 DEL。</li>
        <li>设置合理过期。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 大 Key 的定义</strong></p>
      <p>没有绝对标准，参考：String 类型 &gt; 10KB（有的定 1MB）；Hash/List/Set/ZSet 元素数 &gt; 5000 或整体 &gt; 10MB。具体看业务。</p>
      <p><strong>2. 危害</strong></p>
      <ul>
        <li><strong>阻塞其他请求</strong>：Redis 单线程，操作大 key（读取/删除）耗时长，期间其他命令阻塞。</li>
        <li><strong>网络拥塞</strong>：传输大 value 占用带宽。</li>
        <li><strong>集群迁移卡顿</strong>：Cluster 迁移大 key 时单 key 太大阻塞。</li>
        <li><strong>内存不均</strong>：集群中某节点因大 key 占内存过多。</li>
        <li><strong>删除引发同步</strong>：DEL 大 key 触发同步到 slave，造成延迟。</li>
        <li><strong>过期触发卡顿</strong>：大 key 过期删除耗时长。</li>
      </ul>
      <p><strong>3. 如何发现</strong></p>
      <ul>
        <li><strong>redis-cli --bigkeys</strong>：抽样统计各类别最大的 key。</li>
        <li><strong>MEMORY USAGE key</strong>：查看单个 key 占用内存。</li>
        <li><strong>rdb-tools</strong>：离线分析 RDB 文件找大 key。</li>
        <li><strong>Redis 4.0+ lazyfree</strong>：配合 UNLINK 异步删。</li>
      </ul>
      <p><strong>4. 解决方案</strong></p>
      <ul>
        <li><strong>拆分</strong>：大 Hash 按字段拆成多个小 Hash（如 user:1 → user:1:basic、user:1:detail）；大 List 按时间/范围分段。</li>
        <li><strong>压缩</strong>：value 用 gzip/protobuf 压缩。</li>
        <li><strong>异步删除</strong>：用 UNLINK（4.0+）或配置 lazyfree，删除在后台线程做，不阻塞主线程。坚决避免 DEL 大 key。</li>
        <li><strong>设置过期</strong>：避免无限堆积。</li>
        <li><strong>业务避免</strong>：设计时避免把大量数据塞一个 key。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>大key（String>10KB/集合>5000元素）危害：单线程阻塞、网络拥塞、迁移卡顿、内存不均。发现：redis-cli --bigkeys、memory usage、rdb-tools。解决：拆分、压缩、UNLINK异步删、设过期。生产避免 DEL 大key。</p>`},
  {c:"Redis",d:"★★",q:"热点 Key 问题怎么解决？",
   a:`<p><strong>热点 Key</strong>：某 key 访问量极高，导致单节点 CPU 打满、集群热点。</p>
      <p><strong>发现</strong>：monitor、热点发现工具（redis-cli --hotkeys 需开启 LFU）、客户端统计。</p>
      <p><strong>解决方案</strong>：</p>
      <ul>
        <li><strong>本地缓存</strong>：JVM 内 Caffeine/Guava 多级缓存，减少 Redis 访问。</li>
        <li><strong>分散 key</strong>：把一个 key 拆成多个副本（key_1、key_2...），客户端随机访问。</li>
        <li><strong>读写分离</strong>：多 slave 分担读。</li>
        <li>限流保护后端。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 热点 Key 是什么</strong></p>
      <p>某个 key 的访问量极高（如热门商品、热搜词），导致承载这个 key 的单节点 CPU/网络打满，其他节点却空闲——集群<strong>负载不均</strong>。</p>
      <p><strong>2. 危害</strong></p>
      <ul>
        <li>单节点 CPU 100%、网卡打满。</li>
        <li>缓存击穿（热点 key 过期瞬间打爆 DB）。</li>
        <li>集群其他节点资源浪费（流量集中）。</li>
      </ul>
      <p><strong>3. 如何发现</strong></p>
      <ul>
        <li><strong>redis-cli --hotkeys</strong>：需开启 maxmemory-policy 为 LFU，统计访问频率高的 key。</li>
        <li><strong>MONITOR</strong>：实时监控所有命令（生产慎用，影响性能）。</li>
        <li><strong>客户端统计</strong>：在应用层统计 key 访问频率。</li>
        <li><strong>代理层统计</strong>：如 Twemproxy、Codis。</li>
        <li>业务预判：秒杀商品、热搜。</li>
      </ul>
      <p><strong>4. 解决方案</strong></p>
      <ul>
        <li><strong>本地多级缓存（最有效）</strong>：JVM 内用 Caffeine/Guava 缓存热点数据，减少对 Redis 的访问。配合短过期（1-10s）保证最终一致。</li>
        <li><strong>分散热点 key</strong>：把一个 key 拆成多个副本（如 hotkey_1、hotkey_2...hotkey_N），写入时写所有副本，读取随机选一个。流量分散到不同槽/节点。</li>
        <li><strong>读写分离</strong>：热点读分散到多个 slave。</li>
        <li><strong>限流保护</strong>：对热点接口限流，保护 DB。</li>
        <li><strong>key 永不过期 + 后台刷新</strong>：避免击穿。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>热点key访问量极高导致单节点打满。发现：--hotkeys（需LFU）、客户端统计、业务预判。解决：本地多级缓存（Caffeine）、分散key副本（写多读一）、读写分离到slave、限流、永不过期+后台刷新防击穿。</p>`},
  {c:"Redis",d:"★★",q:"Redis Pipeline 是什么？和事务有什么区别？",
   a:`<p><strong>Pipeline</strong>：客户端<strong>批量打包</strong>多条命令一次性发送，服务端依次执行后一次性返回，减少<strong>网络往返（RTT）</strong>。</p>
      <ul>
        <li>不是原子的：命令在服务端仍一条条执行，中间可能穿插其他客户端命令。</li>
        <li>大幅提升吞吐（10-50 倍）。</li>
      </ul>
      <p><strong>对比 MULTI/EXEC 事务</strong>：</p>
      <ul>
        <li>事务保证命令<strong>连续执行</strong>（中间不被打断，靠排队），但不支持回滚。</li>
        <li>WATCH 实现乐观锁。</li>
        <li>事务不减少网络 RTT。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Pipeline 原理</strong></p>
      <p>正常模式：客户端发一条命令，等服务端返回，再发下一条（一问一答，每次都有网络往返 RTT）。N 条命令 N 次 RTT。</p>
      <p>Pipeline：客户端把 N 条命令<strong>打包一次性发送</strong>，服务端依次执行，结果一次性返回。N 条命令只需 1 次 RTT。大幅减少网络开销。</p>
      <p><strong>2. Pipeline 的特点</strong></p>
      <ul>
        <li><strong>非原子</strong>：命令在服务端仍逐条执行，中间可能穿插其他客户端的命令（不保证连续性）。</li>
        <li><strong>只优化网络</strong>：减少 RTT，不改变执行逻辑。</li>
        <li><strong>吞吐提升明显</strong>：10-50 倍（网络是瓶颈时）。</li>
        <li><strong>注意</strong>：打包命令别太多（占内存、阻塞），建议分批（如每 1000 条）。</li>
      </ul>
      <p><strong>3. Redis 事务（MULTI/EXEC）</strong></p>
      <ul>
        <li>MULTI 开启事务，之后的命令进入<strong>队列</strong>（不立即执行）。</li>
        <li>EXEC 一次性顺序执行队列里的命令。</li>
        <li><strong>保证连续性</strong>：EXEC 执行期间命令不会被打断（其他客户端命令排队等）。</li>
        <li><strong>不支持回滚</strong>：某条命令运行时出错（如对字符串 INCR），后续仍执行，不回滚。</li>
        <li><strong>语法错误</strong>（命令名错）会让整个事务都不执行。</li>
        <li><strong>WATCH</strong>：乐观锁，监视 key，事务执行前若被改则放弃整个事务。</li>
      </ul>
      <p><strong>4. Pipeline vs 事务</strong></p>
      <table><tr><th></th><th>Pipeline</th><th>事务 MULTI/EXEC</th></tr>
      <tr><td>目的</td><td>减少网络 RTT</td><td>保证命令连续执行</td></tr>
      <tr><td>原子性</td><td>无（中间可穿插）</td><td>有（连续执行，但不回滚）</td></tr>
      <tr><td>网络</td><td>1 次 RTT</td><td>仍是多次（命令逐条入队）</td></tr></table>
      <p><strong>5. 两者结合</strong></p>
      <p>可以在 Pipeline 里发事务命令（MULTI...EXEC），既减少 RTT 又保证连续性。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Pipeline 批量发送命令减少网络RTT（非原子，吞吐提升10-50倍）。事务 MULTI/EXEC 保证命令连续执行不被打断（但不支持回滚，语法错全部不执行）。WATCH 实现乐观锁。Pipeline 优化网络，事务保证连续性，可结合使用。</p>`},
  {c:"Redis",d:"★★",q:"Redis 主从同步（全量 + 增量）的过程？",
   a:`<p><strong>全量同步</strong>（首次或断线太久）：</p>
      <ol>
        <li>Slave 发送 PSYNC 命令。</li>
        <li>Master 执行 BGSAVE 生成 RDB，同时新写命令缓存到<strong>复制缓冲区</strong>。</li>
        <li>Master 发 RDB 给 Slave。</li>
        <li>Slave 加载 RDB。</li>
        <li>Master 发送缓冲区的增量命令。</li>
      </ol>
      <p><strong>增量同步</strong>（断线重连）：</p>
      <ul>
        <li>基于 <strong>replication offset（偏移量）</strong> 和 <strong>replid</strong>。</li>
        <li>Slave 带上自己的 offset，Master 从 backlog 环形缓冲区找断点后的命令发送。</li>
        <li>backlog 不够（覆盖了）则退化成全量同步。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 全量同步（Full Resync）</strong></p>
      <p>触发：slave 首次连接 master、断线太久（backlog 不够）、slave 主动要求。</p>
      <ol>
        <li>Slave 发送 <strong>PSYNC ? -1</strong>（首次）或 <strong>PSYNC replid offset</strong>。</li>
        <li>Master 判断需要全量同步，执行 <strong>BGSAVE</strong>（fork 子进程生成 RDB）。</li>
        <li>生成 RDB 期间，master 新收到的写命令缓存到<strong>复制缓冲区（client output buffer）</strong>。</li>
        <li>Master 把 RDB 文件发给 slave。</li>
        <li>Slave 接收并<strong>加载 RDB</strong>（清空旧数据，载入）。</li>
        <li>Master 把缓冲区的<strong>增量命令</strong>发给 slave，slave 执行追平。</li>
      </ol>
      <p>全量同步开销大（BGSAVE + 传输 + 加载），生产避免频繁触发。</p>
      <p><strong>2. 增量同步（Partial Resync，2.8+）</strong></p>
      <p>触发：slave 短暂断线重连（backlog 里还有数据）。</p>
      <ol>
        <li>Slave 重连，发送 <strong>PSYNC {replid} {offset}</strong>（带旧的 replid 和自己的 offset）。</li>
        <li>Master 检查：replid 匹配 且 offset 在 <strong>backlog</strong>（环形缓冲区）范围内 → 可以增量同步。</li>
        <li>Master 从 backlog 找到 slave 的 offset 之后的所有命令，发给 slave。</li>
        <li>Slave 执行这些命令，追平。</li>
      </ol>
      <p><strong>3. 关键组件</strong></p>
      <ul>
        <li><strong>replid（runid）</strong>：master 的唯一标识。slave 记住它，重连时带上。如果 master 变了（重启/选举新主），replid 变，slave 必须全量同步。</li>
        <li><strong>offset（复制偏移量）</strong>：master 和 slave 各自维护，表示已同步的字节位置。差值就是未同步的数据量。</li>
        <li><strong>replication backlog（复制积压缓冲区）</strong>：master 维护的环形缓冲区（默认 1MB，可调 repl-backlog-size），存最近的写命令。增量同步从这里找。太小容易不够导致全量。</li>
      </ul>
      <p><strong>4. 退化情况</strong></p>
      <ul>
        <li>backlog 太小（被覆盖）→ 全量。</li>
        <li>master 重启（replid 变）→ 全量。</li>
        <li>offset 不在 backlog 范围 → 全量。</li>
      </ul>
      <p><strong>5. 优化</strong></p>
      <ul>
        <li>调大 repl-backlog-size（如 256MB）减少全量同步概率。</li>
        <li>磁盘性能好（BGSAVE 快）。</li>
        <li>避免 master 重启（用 SHUTDOWN+NOSCRIPT 或持久化 replid）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>全量：PSYNC → BGSAVE 生成 RDB → 发 RDB → 缓存期间命令后发。增量（2.8+）：PSYNC 带 replid 和 offset，master 从 backlog 环形缓冲区找断点后命令发送。退化：replid 变/master 重启/backlog 不够 → 全量。调大 backlog 减少全量。</p>`},

  {c:"JVM",d:"★★",q:"内存泄漏和内存溢出有什么区别？怎么排查内存泄漏？",
   a:`<p><strong>内存溢出 OOM</strong>：内存不够用，无法分配。</p>
      <p><strong>内存泄漏</strong>：对象不再使用却无法回收（被持有引用），逐渐堆积最终导致 OOM。</p>
      <p>常见泄漏场景：静态集合不断 put 不 remove、ThreadLocal 没 remove、监听器/回调没注销、连接池没关。</p>
      <p><strong>排查</strong>：</p>
      <ol>
        <li>jmap -dump 导出堆，或 -XX:+HeapDumpOnOutOfMemoryError。</li>
        <li>MAT 分析支配树（Dominator Tree），找最大对象。</li>
        <li>看 GC Roots 引用链，找到泄漏源头。</li>
        <li>jstat 看老年代是否持续增长不下降。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 区别</strong></p>
      <p>内存泄漏：对象不再被使用，但仍被引用链持有，GC 无法回收，逐渐堆积。内存溢出：内存不够分配，抛 OOM。<strong>泄漏是原因，溢出是结果</strong>——长期泄漏最终导致溢出。</p>
      <p><strong>2. Java 内存泄漏的常见场景</strong></p>
      <ul>
        <li><strong>静态集合</strong>：static List/Map 不断 put 不 remove，生命周期 = JVM，永不回收。</li>
        <li><strong>ThreadLocal</strong>：线程池场景用完不 remove，Entry 的 value 强引用泄漏。</li>
        <li><strong>监听器/观察者</strong>：注册后没显式注销，发布者一直持有监听者引用。</li>
        <li><strong>资源未关闭</strong>：连接、流、文件句柄、Socket 没关。</li>
        <li><strong>内部类持有外部类</strong>：非静态内部类隐式持有外部类 this，外部类无法回收。</li>
        <li><strong>缓存无淘汰</strong>：自己写的缓存只增不减。</li>
      </ul>
      <p><strong>3. 排查方法</strong></p>
      <ol>
        <li><strong>实时监控</strong>：jstat -gcutil 看老年代使用率，持续涨不降 = 泄漏迹象。</li>
        <li><strong>dump 堆</strong>：jmap -dump:format=b,file=heap.hprof PID，或 -XX:+HeapDumpOnOutOfMemoryError 自动 dump。</li>
        <li><strong>MAT 分析</strong>：
          <ul>
            <li>Leak Suspects 报告自动找嫌疑。</li>
            <li>Dominator Tree（支配树）找占内存最大的对象。</li>
            <li>Histogram 按类统计对象数量和大小。</li>
            <li>Path to GC Roots / Merge Shortest Paths 看引用链，定位"谁一直持有它"。</li>
          </ul>
        </li>
        <li><strong>arthas</strong>：dashboard、heapdump 在线分析。</li>
      </ol>
      <p><strong>4. C++ 的内存泄漏 vs Java</strong></p>
      <p>C++ 没有 GC，new 的对象忘了 delete 就泄漏。Java 有 GC，但泄漏是"对象被引用导致无法回收"，机制不同。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>泄漏是对象不被使用却无法回收（被引用），溢出是内存不够分配。泄漏导致溢出。常见：静态集合、ThreadLocal、监听器、资源未关。排查：jstat 看老年代趋势 → jmap dump → MAT 分析支配树和 GC Roots 引用链定位。</p>`},
  {c:"JVM",d:"★★",q:"Java 的四种引用类型？分别什么用？",
   a:`<ol>
        <li><strong>强引用 Strong</strong>：普通赋值 new。只要还在就绝不回收（即使 OOM）。泄漏主因。</li>
        <li><strong>软引用 Soft</strong>：SoftReference 包装。内存不足时才回收。<strong>适合内存敏感的缓存</strong>。</li>
        <li><strong>弱引用 Weak</strong>：WeakReference。下次 GC 就回收。<strong>WeakHashMap、ThreadLocal 的 key</strong> 就是弱引用，防止内存泄漏。</li>
        <li><strong>虚引用 Phantom</strong>：PhantomReference + ReferenceQueue。get 永远返回 null，唯一作用是在对象被回收时收到通知，<strong>用于跟踪回收时机</strong>（如 NIO 直接内存释放）。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 强引用（Strong Reference）</strong></p>
      <p>最普遍：Object o = new Object()。只要强引用还在，<strong>GC 绝不回收</strong>（即使 OOM）。这是内存泄漏的主因——强引用没断开。</p>
      <p>o = null 可断开引用，让对象可被回收。</p>
      <p><strong>2. 软引用（SoftReference）</strong></p>
      <p>用 SoftReference 包装。内存充足时不回收，<strong>内存不足时（即将 OOM）才回收</strong>。适合<strong>内存敏感的缓存</strong>（如图片缓存、网页缓存）。</p>
      <pre><code>SoftReference&lt;byte[]&gt; cache = new SoftReference&lt;&gt;(new byte[1024*1024]);
byte[] data = cache.get();  // 可能为 null（被回收了）</code></pre>
      <p><strong>3. 弱引用（WeakReference）</strong></p>
      <p>用 WeakReference 包装。<strong>下一次 GC 就会被回收</strong>（不管内存够不够）。生命周期更短。</p>
      <ul>
        <li><strong>WeakHashMap</strong>：key 是弱引用，key 没强引用时整条 Entry 被回收。适合给对象附加数据。</li>
        <li><strong>ThreadLocal 的 key</strong>：ThreadLocalMap 的 Entry 继承 WeakReference，key 弱引用防 ThreadLocal 本身泄漏。</li>
      </ul>
      <p><strong>4. 虚引用（PhantomReference）</strong></p>
      <p>最弱。get() <strong>永远返回 null</strong>（拿不到对象）。必须配合 ReferenceQueue 用。唯一作用：对象被回收时收到通知（队列里出现 PhantomReference）。</p>
      <p>用途：跟踪对象回收时机，做清理。典型：<strong>NIO 的 DirectByteBuffer</strong> 用 Cleaner（基于虚引用）在对象回收时释放堆外内存。</p>
      <p><strong>5. ReferenceQueue</strong></p>
      <p>软/弱/虚引用被回收后，引用对象本身会进入关联的 ReferenceQueue，程序可从队列取出做后续清理。</p>
      <p><strong>6. 强度排序与回收时机</strong></p>
      <p>强（永不） &gt; 软（内存不足） &gt; 弱（下次GC） &gt; 虚（随时，仅跟踪）。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>强引用不回收（泄漏主因），软引用内存不足回收（缓存），弱引用下次GC回收（WeakHashMap/ThreadLocal key），虚引用跟踪回收时机（NIO 堆外内存释放）。强度依次递减。</p>`},
  {c:"JVM",d:"★★",q:"JIT 即时编译是什么？解释执行和编译执行的区别？",
   a:`<p>JVM 是<strong>解释器 + JIT 编译器</strong>的混合模式。</p>
      <ul>
        <li><strong>解释器</strong>：逐条解释字节码执行，启动快但慢。</li>
        <li><strong>JIT（Just-In-Time）</strong>：把<strong>热点代码</strong>（频繁执行）编译成机器码缓存，后续直接执行，大幅提速。</li>
      </ul>
      <p><strong>热点探测</strong>：基于方法调用计数器 + 回边计数器，超过阈值（-XX:CompileThreshold，默认 10000）触发编译。</p>
      <p><strong>编译器</strong>：C1（Client，快速编译，简单优化）、C2（Server，慢但深度优化，如逃逸分析、锁消除）。分层编译（Tiered Compilation）默认开启。</p>
      <blockquote>Graal 是基于 Java 的新 JIT（JDK 10+），性能优于 C2。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. JVM 的混合模式</strong></p>
      <p>HotSpot 用<strong>解释器 + JIT 编译器</strong>配合：解释器启动快（不用等编译），JIT 把热点代码编译成机器码提升长期运行性能。两者各取所长。</p>
      <p><strong>2. 解释器（Interpreter）</strong></p>
      <p>逐条把字节码翻译成机器码执行。<strong>优点</strong>：启动快、内存小；<strong>缺点</strong>：慢（每次都翻译，无优化）。适合启动初期和冷代码。</p>
      <p><strong>3. JIT 编译器（Just-In-Time）</strong></p>
      <p>运行时把<strong>热点代码</strong>（Hot Spot）整个方法编译成本地机器码，缓存起来后续直接执行。<strong>优点</strong>：快（编译优化 + 缓存）；<strong>缺点</strong>：编译有开销、占内存。</p>
      <p>核心思想：解释器负责启动和冷代码，JIT 负责热点代码优化，整体达到"启动快 + 运行快"。</p>
      <p><strong>4. 热点探测（Hot Spot Detection）</strong></p>
      <p>怎么知道哪些是热点？基于计数器：</p>
      <ul>
        <li><strong>方法调用计数器</strong>：方法被调用次数。超过阈值（-XX:CompileThreshold，C2 默认 10000）触发 JIT 编译。</li>
        <li><strong>回边计数器</strong>：循环回边次数。触发循环体的 OSR（栈上替换）编译。</li>
        <li>计数会随时间衰减（方法半衰期），避免冷代码被编译。</li>
      </ul>
      <p><strong>5. 两套 JIT 编译器</strong></p>
      <ul>
        <li><strong>C1（Client Compiler）</strong>：快速编译，简单优化（方法内联、去虚拟化）。追求启动速度。</li>
        <li><strong>C2（Server Compiler）</strong>：慢，深度优化（逃逸分析、标量替换、锁消除、循环展开）。追求峰值性能。</li>
        <li><strong>分层编译 Tiered Compilation</strong>（JDK 8 默认开启）：先用 C1 快速编译，热点再升级 C2 深度优化。</li>
      </ul>
      <p><strong>6. AOT vs JIT</strong></p>
      <p>JIT 是运行时编译；<strong>AOT（Ahead-Of-Time）</strong>是编译期（打包时）直接编译成机器码。JDK 9+ 的 jaotc / GraalVM Native Image 支持 AOT，启动极快（无预热）但失去跨平台和动态优化。适合 Serverless、CLI 工具。</p>
      <p><strong>7. Graal 编译器</strong></p>
      <p>JDK 10+ 用 Java 写的新 JIT（替代 C2），优化能力更强。也是 GraalVM 的基础。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>JVM 混合模式：解释器启动快，JIT 编译热点代码到机器码提升性能。热点探测靠方法/回边计数器。C1 快编译，C2 深优化，分层编译默认开。AOT 是提前编译（GraalVM Native Image）启动快但无动态优化。</p>`},
  {c:"JVM",d:"★★",q:"对象的内存布局是怎样的？",
   a:`<p>HotSpot 中对象分<strong>三部分</strong>（64 位机，开启压缩指针）：</p>
      <ol>
        <li><strong>对象头 Header</strong>：
          <ul>
            <li>Mark Word（8 字节）：hashCode、GC 分代年龄、锁状态位、偏向线程 ID。</li>
            <li>类型指针 Class Pointer（4 字节，压缩后）：指向类元数据。</li>
            <li>数组长度（仅数组对象，4 字节）。</li>
          </ul>
        </li>
        <li><strong>实例数据 Instance Data</strong>：各字段值（按类型宽度对齐排列）。</li>
        <li><strong>对齐填充 Padding</strong>：总大小需是 8 字节整数倍。</li>
      </ol>
      <blockquote>一个空 Object 占 16 字节（8 头 + 4 指针 + 4 填充）。这是 synchronized 锁、GC 分代的工作基础。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 对象三部分（HotSpot，64 位）</strong></p>
      <p>① 对象头 Header ② 实例数据 Instance Data ③ 对齐填充 Padding。</p>
      <p><strong>2. 对象头</strong></p>
      <ul>
        <li><strong>Mark Word（8 字节）</strong>：存 hashCode、GC 分代年龄、锁标志位、偏向线程 ID、epoch 等。在不同锁状态下复用这 64 位（无锁/偏向锁/轻量级锁/重量级锁存不同内容）。</li>
        <li><strong>类型指针（Class Pointer）</strong>：指向方法区的类元数据（Klass），确定对象是哪个类的实例。开启压缩指针（-XX:+UseCompressedOops，默认）占 4 字节，否则 8 字节。</li>
        <li><strong>数组长度（仅数组对象）</strong>：4 字节。因为虚拟机要从对象头知道数组长度（普通对象从类信息知道字段）。</li>
      </ul>
      <p><strong>3. 实例数据</strong></p>
      <p>对象的字段值。HotSpot 会重排字段顺序优化内存：相同宽度的字段放一起，父类字段在子类前。longs/doubles、ints、shorts/chars、bytes/booleans、oops（对象引用）分组排列。</p>
      <p><strong>4. 对齐填充</strong></p>
      <p>HotSpot 要求对象大小是 8 字节的整数倍。不够就 padding 补齐。原因是内存对齐便于硬件读取（一次总线事务读 8 字节）。</p>
      <p><strong>5. 一个空 Object 占多少</strong></p>
      <p>开启压缩指针：Mark Word 8 + Class Pointer 4 = 12，padding 到 8 的倍数 = <strong>16 字节</strong>。关闭压缩指针：8+8=16，刚好 8 的倍数。</p>
      <p>int 字段的对象：16 + 4 = 20，padding 到 24 字节。</p>
      <p><strong>6. 为什么重要</strong></p>
      <ul>
        <li>synchronized 的锁信息存在 Mark Word（锁升级的基础）。</li>
        <li>GC 的分代年龄存在 Mark Word。</li>
        <li>hashCode 缓存也在 Mark Word。</li>
      </ul>
      <p>这是 synchronized、锁升级、GC 工作的底层基础。</p>
      <p><strong>7. 对象头 = Java 并发的基石</strong></p>
      <p>Java 对象都能做锁（synchronized(lock)），就是因为每个对象都有 Mark Word 能存锁状态。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>对象三部分：对象头（Mark Word 存 hash/年龄/锁状态 + 类型指针）、实例数据（字段值）、对齐填充（8 字节倍数）。空 Object 占 16 字节。Mark Word 是 synchronized 锁升级和 GC 分代的基础。</p>`},

  {c:"分布式",d:"★★",q:"服务注册与发现的原理？Eureka 和 Nacos 有什么区别？",
   a:`<p><strong>原理</strong>：服务启动时向注册中心注册自己的地址；消费者从注册中心拉取服务列表并缓存，定期刷新；调用时按负载均衡选一个实例。</p>
      <p><strong>Eureka vs Nacos</strong>：</p>
      <ul>
        <li><strong>CAP</strong>：Eureka 是 <strong>AP</strong>（高可用，节点间复制可能短暂不一致）；Nacos 默认 <strong>AP</strong>（临时实例），可切换 <strong>CP</strong>（持久实例，Raft）。</li>
        <li><strong>健康检查</strong>：Eureka 靠客户端心跳；Nacos 支持心跳和主动探测。</li>
        <li><strong>功能</strong>：Nacos 同时是<strong>注册中心 + 配置中心</strong>；Eureka 只做注册。</li>
        <li>注册推送：Nacos 支持<strong>长轮询主动推送变更</strong>；Eureka 客户端定时全量/增量拉取。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 注册发现原理</strong></p>
      <ul>
        <li><strong>注册</strong>：Provider 启动时把自己的地址（IP:port、服务名）注册到注册中心。</li>
        <li><strong>订阅/发现</strong>：Consumer 从注册中心获取 Provider 列表，缓存在本地。</li>
        <li><strong>心跳</strong>：Provider 定期发心跳，注册中心判断存活。挂了就从列表移除。</li>
        <li><strong>通知</strong>：Provider 列表变化时，注册中心通知 Consumer 更新（推送或 Consumer 轮询）。</li>
        <li><strong>调用</strong>：Consumer 按负载均衡算法从缓存的列表选一个 Provider 调用。</li>
      </ul>
      <p><strong>2. Eureka</strong></p>
      <ul>
        <li><strong>AP</strong>：节点间 P2P 复制，追求高可用。分区时各节点数据可能不一致，但都能服务。</li>
        <li>客户端<strong>定时拉取</strong>（默认30秒）+ 心跳续约（30秒）+ 自我保护（心跳低于阈值不剔除，防误删）。</li>
        <li>缺点：拉取有延迟、2.x 停止维护。</li>
      </ul>
      <p><strong>3. Nacos（主流）</strong></p>
      <ul>
        <li>支持 <strong>AP（临时实例，心跳）和 CP（持久实例，Raft）</strong>切换。</li>
        <li>同时是<strong>注册中心 + 配置中心</strong>。</li>
        <li><strong>推送</strong>：支持长轮询主动推送变更（实时性比 Eureka 拉）。</li>
        <li>健康检查：客户端心跳 + 服务端主动探测。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Provider注册、Consumer订阅缓存、心跳保活、变更通知、负载均衡调用。Eureka=AP+拉取+自我保护+只注册。Nacos=AP/CP切换+推送+注册+配置一体+心跳和主动探测。</p>`},
  {c:"分布式",d:"★★",q:"微服务有哪些核心组件？",
   a:`<p>微服务八大组件（记住）：</p>
      <ol>

   b:`<h5>📐 八股文详解</h5>

      <p><strong>面试标准答法</strong>：注册发现(Nacos)、配置中心(Nacos/Apollo)、网关(Gateway)、服务调用(Feign/Dubbo)、负载均衡(LoadBalancer)、熔断限流(Sentinel)、分布式事务(Seata)、链路追踪(SkyWalking)。Spring Cloud Alibaba 是主流全家桶。</p>`},
  {c:"分布式",d:"★★",q:"API 网关的作用？Spring Cloud Gateway 的原理？",
   a:`<p><strong>网关作用</strong>：统一入口、路由转发、鉴权认证、限流熔断、日志监控、协议转换、跨域处理。</p>
      <p><strong>Gateway 原理</strong>（基于 Netty + Reactor 异步非阻塞）：</p>
      <ul>
        <li>核心：Route（路由）、Predicate（断言，匹配请求）、Filter（过滤器）。</li>
        <li>请求经过 Filter 链（GlobalFilter + GatewayFilter）处理。</li>
        <li>内置断言：Path、Header、Method、Host、After/Before。</li>
        <li>内置过滤器：AddRequestHeader、RewritePath、RequestRateLimiter（基于 Redis 令牌桶）。</li>
      </ul>
      <blockquote>对比 Zuul：Zuul 1.x 同步阻塞（Servlet），Gateway 异步非阻塞性能更好。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 网关的作用</strong></p>
      <ul>
        <li><strong>统一入口</strong>：所有外部请求先到网关，再转发到后端服务，隐藏内部架构。</li>
        <li><strong>路由转发</strong>：按规则（路径、Header）把请求路由到对应服务。</li>
        <li><strong>鉴权认证</strong>：统一做 token 校验、权限控制。</li>
        <li><strong>限流熔断</strong>：保护后端，防止过载。</li>
        <li><strong>日志监控</strong>：统一记录请求日志、统计。</li>
        <li><strong>协议转换</strong>：如 HTTP 转 WebSocket、外部协议转内部 RPC。</li>
        <li><strong>跨域 CORS</strong>：统一处理。</li>
        <li><strong>灰度发布</strong>：按规则路由到不同版本。</li>
      </ul>
      <p><strong>2. Spring Cloud Gateway 三大核心</strong></p>
      <ul>
        <li><strong>Route（路由）</strong>：id + 目标 URI + Predicate + Filter。一条路由规则。</li>
        <li><strong>Predicate（断言）</strong>：匹配请求的条件。内置：Path、Header、Method、Host、Query、After/Before/Between、Cookie、Weight。</li>
        <li><strong>Filter（过滤器）</strong>：对请求/响应做处理。GatewayFilter（路由级）、GlobalFilter（全局）。内置：AddRequestHeader、RewritePath、RequestRateLimiter（Redis 令牌桶限流）、Hystrix。</li>
      </ul>
      <p><strong>3. 工作流程</strong></p>
      <p>请求 → Gateway Handler Mapping（按 Predicate 匹配路由）→ Gateway Web Handler（按 Filter 链过滤）→ 代理转发到目标服务（通过 LoadBalancer 选实例）→ 响应沿 Filter 链返回。</p>
      <p><strong>4. 异步非阻塞</strong></p>
      <p>基于 Netty + Project Reactor（响应式编程）。请求处理不阻塞线程（少量线程处理大量请求），性能远高于 Zuul 1.x（Servlet 同步阻塞）。</p>
      <p><strong>5. Gateway vs Zuul</strong></p>
      <ul>
        <li>Zuul 1.x：基于 Servlet，同步阻塞，性能一般。</li>
        <li>Zuul 2.x：基于 Netty 异步，但 Spring Cloud 没集成。</li>
        <li>Gateway：Spring 官方主推，Netty 异步非阻塞，功能丰富。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>网关作用：统一入口、路由、鉴权、限流、日志、跨域。Gateway 三核心：Route(路由)、Predicate(断言匹配)、Filter(过滤器)。基于Netty异步非阻塞，Filter链处理。比Zuul1.x同步阻塞性能好。</p>`},
  {c:"分布式",d:"★★",q:"什么是链路追踪？SkyWalking 怎么工作？",
   a:`<p><strong>链路追踪</strong>：一个请求经过多个微服务，生成全局 TraceId，记录每段调用（Span）的耗时、状态，用于<strong>性能分析和故障定位</strong>。</p>
      <p><strong>SkyWalking 原理</strong>：</p>
      <ul>
        <li><strong>无侵入</strong>：Java Agent 字节码增强（启动时 -javaagent 挂载），自动埋点。</li>
        <li>采集的链路数据通过 gRPC/HTTP 发送到 OAP Server。</li>
        <li>OAP 聚合分析，存到 ElasticSearch/H2。</li>
        <li>UI 可视化：拓扑图、调用链、慢接口、JVM 监控。</li>
      </ul>
      <blockquote>对比：Zipkin（需手动埋点或 Brave）、Pinpoint（也是字节码增强）。SkyWalking 国产、社区活跃、功能全。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么需要链路追踪</strong></p>
      <p>微服务下一个请求可能经过几十个服务，出问题（慢、报错）时<strong>难以定位是哪个环节</strong>。链路追踪给每个请求生成全局 TraceId，记录每个服务调用的 Span（耗时、状态），把整条链路可视化，快速定位问题。</p>
      <p><strong>2. 核心概念（OpenTracing 标准）</strong></p>
      <ul>
        <li><strong>Trace</strong>：一次完整的请求链路，有唯一 TraceId。</li>
        <li><strong>Span</strong>：一个工作单元（如一次 RPC、一次 DB 查询）。有 SpanId、ParentSpanId，组成树状结构。</li>
        <li><strong>Annotation/Tag</strong>：Span 的附加信息（如 cs 客户端发送、sr 服务端接收）。</li>
      </ul>
      <p><strong>3. SkyWalking 架构</strong></p>
      <ul>
        <li><strong>Agent（探针）</strong>：Java Agent（-javaagent），启动时<strong>字节码增强</strong>（无侵入），自动拦截 HTTP/RPC/DB/Redis 等调用埋点，生成 Span。还采集 JVM/OS 指标。</li>
        <li><strong>OAP Server（Observability Analysis Platform）</strong>：接收 Agent 上报的数据，聚合分析（构建拓扑、统计 QPS/耗时）。支持集群。</li>
        <li><strong>存储</strong>：ElasticSearch（主流）、H2（演示）、MySQL、TiDB。</li>
        <li><strong>UI</strong>：可视化界面，看拓扑图、Trace 树、慢接口、服务/实例监控。</li>
      </ul>
      <p><strong>4. 传播机制</strong></p>
      <p>TraceId/SpanId 通过 HTTP Header（sw8）或 RPC context 在服务间传播，串联整条链路。</p>
      <p><strong>5. 对比其他方案</strong></p>
      <ul>
        <li><strong>Zipkin</strong>：Twitter 开源，需手动埋点（或 Brave 库），功能简单。</li>
        <li><strong>Jaeger</strong>：CNCF，OpenTracing 实现。</li>
        <li><strong>Pinpoint</strong>：韩国 Naver，字节码增强（无侵入），但支持语言少。</li>
        <li><strong>SkyWalking</strong>：Apache 顶级项目，国产（吴晟主导），无侵入、功能全（追踪+指标+日志）、社区活跃。<strong>国内主流</strong>。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>链路追踪：TraceId 串联一个请求经过的所有服务（Span 记录每段耗时状态），定位性能和故障。SkyWalking：Agent字节码增强无侵入埋点→gRPC上报→OAP聚合分析→ES存储→UI可视化。对比Zipkin(手动埋点)、Pinpoint(字节码)。</p>`},
  {c:"分布式",d:"★★",q:"配置中心（如 Nacos/Apollo）是怎么实现动态刷新的？",
   a:`<p><strong>Nacos 配置中心</strong>：</p>
      <ul>
        <li>客户端启动时拉取配置，并缓存本地。</li>
        <li><strong>长轮询（Long Polling）</strong>：客户端定时（默认 30s）请求 Nacos，服务端配置没变化则<strong>挂起请求最长 30s</strong>，期间有变更立即返回。</li>
        <li>客户端收到变更通知后重新拉取配置。</li>
        <li>配合 <code>@RefreshScope</code> + <code>@Value</code>，或 <code>@ConfigurationProperties</code> Bean 重新创建，实现 Bean 内属性动态更新。</li>
      </ul>
      <blockquote>Apollo 用类似的 long polling + 推送。长轮询比纯轮询实时、比 WebSocket 简单可靠。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么需要配置中心</strong></p>
      <p>微服务多、配置多，散在各 yml 里难管理。配置中心集中管理、动态刷新（改配置不重启）、多环境、版本回滚、权限管理。</p>
      <p><strong>2. Nacos 动态刷新原理</strong></p>
      <ul>
        <li><strong>启动</strong>：客户端从 Nacos 拉取配置，缓存本地（容灾）。</li>
        <li><strong>长轮询 Long Polling</strong>：客户端定期（默认30s）请求 Nacos 检查配置变化。Nacos 收到请求后：
          <ul>
            <li>配置没变：挂起请求（最长30s）。</li>
            <li>配置变了 / 超时：立即返回变更的 dataId。</li>
          </ul>
        </li>
        <li>客户端收到变更通知，重新拉取具体配置内容。</li>
        <li>发布 ConfigChangeEvent（Spring 的 Environment 变更）。</li>
      </ul>
      <p><strong>3. 为什么用长轮询而不是轮询/WebSocket</strong></p>
      <ul>
        <li><strong>纯轮询</strong>：定时请求，实时性差（最多延迟一个周期）。</li>
        <li><strong>WebSocket</strong>：实时双向，但复杂（需维护连接、心跳、断线重连、服务端连接管理）。</li>
        <li><strong>长轮询</strong>：客户端发请求，服务端 hold 住直到有数据或超时。实时（变更立即返回）+ 简单（基于 HTTP，无需特殊协议）+ 可靠。折中方案，广泛使用。</li>
      </ul>
      <p><strong>4. Spring Bean 如何感知配置变化</strong></p>
      <ul>
        <li><strong>@Value + @RefreshScope</strong>：Bean 标 @RefreshScope，配置变化时 Spring <strong>销毁并重建</strong>该 Bean（CGLIB 代理，下次调用时重新创建），@Value 重新注入。</li>
        <li><strong>@ConfigurationProperties</strong>：配合 @RefreshScope 或 ConfigurationPropertiesRebinder，配置变化时重新绑定属性。</li>
        <li><strong>@EventListener(RefreshScopeRefreshedEvent)</strong>：监听刷新事件做自定义处理。</li>
      </ul>
      <p><strong>5. Apollo vs Nacos</strong></p>
      <ul>
        <li>Apollo（携程）：功能全（权限、灰度、回滚），长轮询+推送，独立部署重。</li>
        <li>Nacos（阿里）：注册+配置一体，轻量，Spring Cloud Alibaba 主推。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>配置中心集中管理+动态刷新。Nacos 用长轮询（客户端请求服务端hold住，变更或超时返回，实时+简单）。Bean感知变化用@RefreshScope(重建Bean)或@ConfigurationProperties。长轮询比轮询实时、比WebSocket简单。Apollo功能全但重，Nacos轻量集成注册。</p>`},

  // ---------- 算法补充 ----------
  {c:"数据结构与算法",d:"★★",q:"手写一个 LRU 缓存？",
   a:`<p>要求：get/put 都 O(1)，容量满时淘汰最久未使用。</p>
      <p><strong>方案</strong>：HashMap + 双向链表。HashMap 存 key→node 实现 O(1) 查找；双向链表维护访问顺序，最近访问的移到头部，尾部是最久未用的。</p>
      <pre><code>class LRUCache {
    class Node {
        int k, v; Node prev, next;
        Node(int k,int v){this.k=k;this.v=v;}
    }
    int cap; Map&lt;Integer,Node&gt; map=new HashMap&lt;&gt;();
    Node head=new Node(0,0), tail=new Node(0,0);
    LRUCache(int cap){this.cap=cap; head.next=tail; tail.prev=head;}
    void remove(Node n){n.prev.next=n.next; n.next.prev=n.prev;}
    void addFirst(Node n){n.next=head.next; n.next.prev=n; head.next=n; n.prev=head;}
    public int get(int k){
        if(!map.containsKey(k)) return -1;
        Node n=map.get(k); remove(n); addFirst(n); return n.v;
    }
    public void put(int k,int v){
        if(map.containsKey(k)){Node n=map.get(k);n.v=v;remove(n);addFirst(n);return;}
        if(map.size()==cap){Node l=tail.prev;remove(l);map.remove(l.k);}
        Node n=new Node(k,v); addFirst(n); map.put(k,n);
    }
}</code></pre>
      <blockquote>面试常考。Java 中可直接继承 LinkedHashMap 重写 removeEldestEntry 实现。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. LRU 的设计要求</strong>：get/put 都 O(1)，容量满时淘汰最久未使用。</p>
      <p><strong>2. 为什么用 HashMap + 双向链表</strong>：HashMap 提供 O(1) 查找（key→node）；双向链表维护访问顺序（最近访问的移到头部，尾部是最久未用的），O(1) 移动节点。单向链表无法 O(1) 删除节点（要找前驱）。</p>
      <p><strong>3. get/put 的流程</strong></p>
      <ul>
        <li>get(key)：HashMap 找 node，找到则移到链表头部，返回 value；找不到返回 -1。</li>
        <li>put(key, value)：存在则更新 + 移头部；不存在则新建加头部，超容量则删尾部（最久未用）。</li>
      </ul>
      <p><strong>4. 哨兵节点</strong>：用 head/tail 虚拟节点简化边界处理（不用判空）。</p>
      <p><strong>5. LinkedHashMap 简易实现</strong></p>
      <pre><code>class LRUCache extends LinkedHashMap&lt;Integer,Integer&gt;{
    private final int capacity;
    public LRUCache(int cap){ super(cap,0.75f,true); capacity=cap; }
    protected boolean removeEldestEntry(Map.Entry e){ return size()&gt;capacity; }
}</code></pre>
      <p>accessOrder=true 开启访问顺序，removeEldestEntry 超容量淘汰。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>HashMap(key→node，O(1)查找) + 双向链表(O(1)移动节点维护顺序)。get/put访问后移头部，满则删尾部。哨兵节点简化边界。或继承LinkedHashMap(accessOrder=true+removeEldestEntry)。</p>`},
  {c:"数据结构与算法",d:"★★",q:"求 TopK 问题（海量数据中最大的 K 个数）？",
   a:`<p><strong>方法一：小顶堆</strong>（推荐）。</p>
      <p>维护大小为 K 的最小堆，遍历数据时比堆顶大则替换并下沉。时间 O(nlogk)，空间 O(k)。适合海量数据/流式数据。</p>
      <p><strong>方法二：快速选择</strong>（QuickSelect，基于快排划分）。</p>
      <p>平均 O(n)，最坏 O(n²)。找出第 K 大后，右边的都是 TopK。适合数据能全部放进内存。</p>
      <p><strong>方法三：分治 + 堆</strong>（海量数据无法一次加载）。</p>
      <p>数据分片 → 每片求 TopK → 合并所有 TopK 再求总 TopK。</p>
      <blockquote>求"最大的 K 个"用<strong>小顶堆</strong>（堆顶是最小的，方便淘汰）；求"最小的 K 个"用<strong>大顶堆</strong>。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三种方案</strong></p>
      <ul>
        <li><strong>小顶堆（推荐）</strong>：维护大小 K 的最小堆。遍历数据：比堆顶大则替换堆顶并下沉。最终堆里就是最大的 K 个。O(nlogk)。优点：不用全部加载（适合流式/海量数据）、内存 O(k)。求最大K用小顶堆（堆顶最小，方便淘汰比它小的）。</li>
        <li><strong>快速选择 QuickSelect</strong>：基于快排的 partition。选 pivot 分区，pivot 位置 == K 则右侧就是 TopK。平均 O(n)，最坏 O(n²)。优点：快（平均线性）。缺点：要全加载、最坏慢。</li>
        <li><strong>分治 + 堆（海量数据）</strong>：数据分片（文件/机器）→ 每片求 TopK（小顶堆）→ 合并所有片的 TopK 再求总 TopK。MapReduce 思想。</li>
      </ul>
      <p><strong>2. 堆的选择</strong></p>
      <ul>
        <li>求<strong>最大</strong>的 K 个 → 用<strong>小顶堆</strong>（堆顶是当前 K 个中最小的，新来的比它大就替换）。</li>
        <li>求<strong>最小</strong>的 K 个 → 用<strong>大顶堆</strong>（堆顶是最大的，新来的比它小就替换）。</li>
        <li>Java 用 PriorityQueue（默认小顶堆，大顶堆传 Collections.reverseOrder）。</li>
      </ul>
      <p><strong>3. 面试标准答法</strong></p>
      <p>求最大K用小顶堆(堆顶最小方便淘汰，O(nlogk)适合海量/流式)。快速选择(基于partition平均O(n)，需全加载)。海量数据分片求TopK再合并。Java PriorityQueue。最大K用小顶堆，最小K用大顶堆。</p>`},
  {c:"数据结构与算法",d:"★★",q:"二叉树的前中后序遍历（递归和非递归）？",
   a:`<p><strong>递归</strong>（最简单）：</p>
      <pre><code>void preOrder(Node r){
    if(r==null) return;
    visit(r);        // 前:访问放最前
    preOrder(r.left);  // 中:放中间
    preOrder(r.right); // 后:放最后
}</code></pre>
      <p><strong>前序非递归（栈）</strong>：</p>
      <pre><code>Deque&lt;Node&gt; stack=new ArrayDeque&lt;&gt;();
Node cur=root;
while(cur!=null||!stack.isEmpty()){
    while(cur!=null){visit(cur);stack.push(cur);cur=cur.left;}
    cur=stack.pop().right;
}</code></pre>
      <p>中序：访问时机改为弹栈时；后序：需记录上一次访问的节点判断右子树是否访问过。</p>
      <blockquote>层序遍历用<strong>队列</strong>（BFS）。面试常考递归改非递归。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 前中后序的定义</strong></p>
      <ul>
        <li><strong>前序</strong>：根→左→右。先访问根。</li>
        <li><strong>中序</strong>：左→根→右。根在中间。BST 中序遍历是有序的。</li>
        <li><strong>后序</strong>：左→右→根。根最后。用于删除（先删子树）、表达式求值。</li>
      </ul>
      <p><strong>2. 递归实现</strong>：调整 visit 的位置即可（前序visit在前，中序在中，后序在后）。</p>
      <p><strong>3. 非递归（栈模拟递归）</strong></p>
      <ul>
        <li><strong>前序</strong>：栈，先访问→push→走左，弹栈走右。</li>
        <li><strong>中序</strong>：栈，走左入栈到头，弹栈访问→走右。访问在弹栈时。</li>
        <li><strong>后序</strong>：栈 + 记录 lastVisited。弹栈时判断右子树是否已访问（lastVisited==右子），否则先走右。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>前序(根左右)、中序(左根右，BST有序)、后序(左右根)。递归调visit位置。非递归用栈：前序访问后push走左，中序弹栈时访问，后序记录last判断右子是否访问。层序用队列BFS。</p>`},
  {c:"数据结构与算法",d:"★★",q:"二叉树层序遍历（BFS）？",
   a:`<p>用<strong>队列</strong>实现：</p>
      <pre><code>List&lt;List&lt;Integer&gt;&gt; levelOrder(Node root){
    List&lt;List&lt;Integer&gt;&gt; res=new ArrayList&lt;&gt;();
    if(root==null) return res;
    Queue&lt;Node&gt; q=new LinkedList&lt;&gt;();
    q.offer(root);
    while(!q.isEmpty()){
        int size=q.size();
        List&lt;Integer&gt; level=new ArrayList&lt;&gt;();
        for(int i=0;i&lt;size;i++){
            Node n=q.poll();
            level.add(n.val);
            if(n.left!=null) q.offer(n.left);
            if(n.right!=null) q.offer(n.right);
        }
        res.add(level);
    }
    return res;
}</code></pre>
      <blockquote>关键：每层开始前记录 size，循环 size 次取出当层节点。变体：锯齿形遍历（奇偶层交替反转）、右视图（每层最后一个）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 层序遍历（BFS）</strong></p>
      <p>按层从上到下、每层从左到右访问。用<strong>队列（FIFO）</strong>实现。</p>
      <p><strong>2. 核心技巧：size 记录每层节点数</strong></p>
      <p>每层开始前记录 queue.size()（当前层的节点数），循环 size 次取出当层所有节点，再把子节点入队（下一层）。这样能把结果分层。</p>
      <p><strong>3. 常见变体</strong></p>
      <ul>
        <li><strong>分层返回</strong>：List&lt;List&lt;Integer&gt;&gt;（每层一个子列表）。用 size 技巧。</li>
        <li><strong>锯齿形层序（Zigzag）</strong>：奇数层正序、偶数层逆序（或用双端队列）。</li>
        <li><strong>右视图</strong>：每层最后一个节点（size 循环到最后一个时记录）。</li>
        <li><strong>平均值</strong>：每层求平均。</li>
        <li><strong>最大宽度</strong>：每层节点数。</li>
      </ul>
      <p><strong>4. BFS vs DFS</strong></p>
      <p>层序是 BFS（广度优先，队列）。前中后序是 DFS（深度优先，栈/递归）。求最短路径/层信息用 BFS，求路径/深度用 DFS。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>用队列BFS。每层前记录size，循环size次取当层节点，子节点入队。分层返回List&lt;List&gt;。变体：锯齿形(奇偶层反转)、右视图(每层最后)、平均值。BFS队列，DFS栈/递归。</p>`},
