<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#4f46e5">
<title>资料</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --text:#e2e8f0;
    --muted:#94a3b8; --brand:#6366f1; --brand2:#818cf8; --accent:#22c55e;
    --warn:#f59e0b; --danger:#ef4444; --line:#334155;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7; min-height:100vh;
    padding-bottom:120px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    padding:20px 16px; text-align:center; position:sticky; top:0; z-index:10;
    box-shadow:0 2px 12px rgba(0,0,0,.3);
  }
  header h1{margin:0;font-size:20px;font-weight:700;color:#fff;letter-spacing:1px}
  header .sub{color:#c7d2fe;font-size:13px;margin-top:4px}

  /* 进度条 */
  .progress{background:var(--panel);padding:12px 16px;border-radius:12px;margin-top:14px}
  .progress-bar{height:8px;background:#0f172a;border-radius:4px;overflow:hidden;margin-top:6px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .4s;width:0}
  .progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

  /* 分类筛选 */
  .filters{margin:14px 0}
  .filter-title{font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
    font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;user-select:none;
  }
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip:active{transform:scale(.96)}

  /* 卡片 */
  .card{
    background:var(--panel);border-radius:16px;padding:20px;margin-top:14px;
    border:1px solid var(--line);
  }
  .q-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .tag{
    display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;
    background:#312e81;color:#a5b4fc;
  }
  .tag.c-基础{background:#065f46;color:#6ee7b7}
  .tag.c-集合{background:#92400e;color:#fcd34d}
  .tag.c-并发{background:#7c2d12;color:#fdba74}
  .tag.c-JVM{background:#5b21b6;color:#c4b5fd}
  .tag.c-Spring{background:#155e75;color:#67e8f9}
  .tag.c-MySQL{background:#7f1d1d;color:#fca5a5}
  .tag.c-Redis{background:#134e4a;color:#5eead4}
  .tag.c-网络{background:#3730a3;color:#a5b4fc}
  .tag.c-框架{background:#713f12;color:#fde047}
  .tag.c-分布式{background:#581c87;color:#e9d5ff}
  .tag.c-数据结构与算法{background:#1e3a8a;color:#93c5fd}
  .tag.c-场景实战{background:#831843;color:#fbcfe8}
  .difficulty{font-size:12px;color:var(--warn)}
  .q-num{font-size:12px;color:var(--muted)}
  .question{font-size:18px;font-weight:600;margin:14px 0;letter-spacing:.3px}

  /* 答案区 */
  .answer-wrap{
    margin-top:14px;display:none;
    background:var(--panel2);border-radius:12px;padding:16px;
    border-left:3px solid var(--brand2);
  }
  .answer-wrap.show{display:block;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
  .answer-wrap h4{margin:0 0 8px;color:var(--brand2);font-size:14px}
  .answer-body{font-size:14px;color:#cbd5e1}
  .answer-body p{margin:8px 0}
  .answer-body ul,.answer-body ol{margin:8px 0;padding-left:22px}
  .answer-body li{margin:4px 0}
  .answer-body code{
    background:#0f172a;padding:1px 6px;border-radius:4px;font-size:13px;
    font-family:"SF Mono",Consolas,Monaco,monospace;color:#fbbf24;
  }
  .answer-body pre{
    background:#0f172a;padding:12px;border-radius:8px;
    font-size:12.5px;line-height:1.5;
    white-space:pre-wrap;word-wrap:break-word;word-break:break-all;
    overflow-wrap:break-word;
  }
  .answer-body pre code{background:none;padding:0;color:#86efac}
  .answer-body strong{color:#fff}
  .answer-body blockquote{
    border-left:3px solid var(--warn);margin:10px 0;padding:4px 12px;
    color:#fcd34d;background:rgba(245,158,11,.08);border-radius:0 6px 6px 0;
  }

  /* 八股文详解切换 */
  .bagwen-toggle{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .btn-bagwen{
    width:100%;padding:11px;background:linear-gradient(135deg,#7c3aed,#db2777);
    color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-bagwen:active{transform:scale(.98)}
  .bagwen-body{display:none;margin-top:14px;padding:14px;background:rgba(124,58,237,.06);
    border:1px solid rgba(124,58,237,.25);border-radius:12px;animation:fade .3s}
  .bagwen-body.show{display:block}
  .bagwen-body h5{margin:0 0 10px;color:#c4b5fd;font-size:13px;letter-spacing:.5px}
  .bagwen-body p{margin:8px 0;font-size:14px;color:#cbd5e1;line-height:1.7}
  .bagwen-body ul,.bagwen-body ol{margin:8px 0;padding-left:22px}
  .bagwen-body li{margin:5px 0;font-size:14px;color:#cbd5e1;line-height:1.7}
  .bagwen-body strong{color:#fff}
  .bagwen-body code{background:#0f172a;padding:1px 6px;border-radius:4px;color:#fbbf24;font-size:13px}
  .bagwen-body pre{background:#0f172a;padding:12px;border-radius:8px;font-size:12.5px;white-space:pre-wrap;word-wrap:break-word;word-break:break-all;overflow-wrap:break-word}
  .bagwen-body pre code{background:none;padding:0;color:#86efac}

  /* 简版/深入/易错 分段样式 */
  .seg{margin:14px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
  .seg h5{
    margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.5px;
    display:flex;align-items:center;gap:6px;
  }
  .seg-simple{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.25)}
  .seg-simple h5{color:#4ade80}
  .seg-deep{background:rgba(99,102,241,.06);border-color:rgba(99,102,241,.25)}
  .seg-deep h5{color:#818cf8}
  .seg-trap{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.25)}
  .seg-trap h5{color:#f87171}
  .seg p:first-child{margin-top:0}
  .seg p:last-child{margin-bottom:0}

  /* 复习列表弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;backdrop-filter:blur(2px)}
  .modal-mask.show{display:block;animation:fade .2s}
  .modal-box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:92%;max-width:680px;max-height:80vh;background:var(--panel);border-radius:16px;z-index:101;display:none;flex-direction:column;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-box.show{display:flex;animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .modal-box .modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .modal-box .modal-head h3{margin:0;font-size:17px;color:#fff}
  .modal-box .modal-head .modal-close{background:var(--panel2);border:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .modal-box .modal-close:active{transform:scale(.9)}
  .modal-box .modal-body{flex:1;overflow-y:auto;padding:8px 16px 20px;-webkit-overflow-scrolling:touch}
  .review-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel2);border:1px solid transparent;border-radius:10px;cursor:pointer;transition:.12s;margin-bottom:6px}
  .review-item:active{transform:scale(.99)}
  .review-item:hover{border-color:var(--brand)}
  .review-item .r-tag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;white-space:nowrap}
  .review-item .r-text{flex:1;font-size:14px;color:var(--text);line-height:1.5}
  .review-item .r-status{font-size:12px;color:var(--muted);white-space:nowrap}
  .review-item.done{background:rgba(34,197,94,.07)}
  .review-empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
  .seg table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
  .seg th,.seg td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .seg th{background:#0f172a;color:var(--brand2)}

  /* 按钮 */
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  button.btn{
    flex:1;min-width:110px;padding:12px 16px;border:none;border-radius:10px;
    font-size:14px;font-weight:600;cursor:pointer;transition:.15s;color:#fff;
  }
  button.btn:active{transform:scale(.97)}
  .btn-primary{background:var(--brand)}
  .btn-answer{background:var(--accent)}
  .btn-skip{background:var(--panel2);color:var(--muted)}
  .btn-mastered{background:var(--warn)}
  .btn-reset{background:transparent;border:1px solid var(--line)!important;color:var(--muted);flex:0 0 auto;min-width:auto;padding:8px 14px}

  /* 底部固定栏 */
  .footer{
    position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--line);padding:12px 16px;
    display:flex;gap:10px;justify-content:center;z-index:20;
  }
  .footer .wrap{padding:0;max-width:860px}
  .footer button{flex:1;max-width:200px}

  /* 题目列表弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(0,0,0,.65);
    z-index:100;display:none;backdrop-filter:blur(2px);
  }
  .modal-mask.show{display:block;animation:fade .2s}
  .modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:92%;max-width:760px;height:85vh;background:var(--panel);
    border-radius:16px;z-index:101;display:none;flex-direction:column;
    border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal.show{display:flex;animation:pop .25s}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  .modal-head{
    padding:16px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--panel);border-radius:16px 16px 0 0;z-index:2;
  }
  .modal-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .modal-head h3{margin:0;font-size:17px;color:#fff}
  .modal-close{
    background:var(--panel2);border:none;color:var(--muted);
    width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .modal-close:active{transform:scale(.9)}
  .modal-search{
    width:100%;margin-top:12px;padding:9px 14px;background:#0f172a;
    border:1px solid var(--line);border-radius:10px;color:var(--text);
    font-size:14px;box-sizing:border-box;
  }
  .modal-search:focus{outline:none;border-color:var(--brand)}
  .modal-search::placeholder{color:#475569}
  .modal-body{flex:1;overflow-y:auto;padding:8px 16px 20px;-webkit-overflow-scrolling:touch}
  .cat-group{margin-top:14px}
  .cat-title{
    font-size:13px;color:var(--brand2);font-weight:700;margin:6px 0 8px;
    letter-spacing:.5px;display:flex;align-items:center;gap:8px;
  }
  .cat-title .cnt{color:var(--muted);font-weight:400;font-size:12px}
  .qlist{display:flex;flex-direction:column;gap:6px}
  .qitem{
    display:flex;align-items:center;gap:10px;padding:11px 14px;
    background:var(--panel2);border:1px solid transparent;border-radius:10px;
    cursor:pointer;transition:.12s;
  }
  .qitem:active{transform:scale(.99)}
  .qitem:hover{border-color:var(--brand)}
  .qitem .qtext{flex:1;font-size:14px;color:var(--text);line-height:1.5}
  .qitem .qmark{
    flex-shrink:0;width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;
  }
  .qitem .qmark.done{background:#22c55e;color:#fff}
  .qitem .qmark.mastered{background:var(--warn);color:#fff}
  .qitem .qmark.todo{background:#334155;color:var(--muted)}
  .qitem.done{background:rgba(34,197,94,.07)}
  .qempty{text-align:center;color:var(--muted);padding:40px;font-size:14px}

  /* 全部题目按钮 */
  .btn-list{
    width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;
    cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-list:active{transform:scale(.98)}


  .empty{text-align:center;padding:40px;color:var(--muted)}

  /* 统计面板 */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat{background:var(--panel);border-radius:10px;padding:12px;text-align:center;border:1px solid var(--line)}
  .stat .num{font-size:22px;font-weight:700;color:var(--brand2)}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}

  @media(max-width:520px){
    .question{font-size:16px}
    .card{padding:16px}
    .stats{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">总题数</div></div>
    <div class="stat" style="cursor:pointer" onclick="openReview('mastered')"><div class="num" id="statMastered" style="color:#4ade80">0</div><div class="lbl">📋 已掌握</div></div>
    <div class="stat" style="cursor:pointer" onclick="openReview('seen')"><div class="num" id="statSeen" style="color:#818cf8">0</div><div class="lbl">📋 已练习</div></div>
  </div>

  <div class="progress">
    <div class="progress-text">
      <span>学习进度</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="filters">
    <div class="filter-title">📚 选择专题</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card" id="card">
    <div class="q-meta">
      <span id="qTag" class="tag"></span>
      <span><span class="difficulty" id="qLevel"></span> · <span class="q-num" id="qNum"></span></span>
    </div>
    <div class="question" id="question">点击下方"开始练习"出题</div>
    <div class="answer-wrap" id="answerWrap">
      <h4>💡 参考答案</h4>
      <div class="answer-body" id="answer"></div>
      <div class="bagwen-toggle" id="bagwenToggle" style="display:none">
        <button class="btn-bagwen" id="bagwenBtn" onclick="toggleBagwen()">📖 查看八股文详解</button>
        <div class="bagwen-body" id="bagwenBody"></div>
      </div>
    </div>
    <div class="actions" id="actions" style="display:none">
      <button class="btn btn-answer" onclick="toggleAnswer()">👁 查看答案</button>
      <button class="btn btn-mastered" onclick="markMastered()">✅ 标记掌握</button>
      <button class="btn btn-skip" onclick="prev()">⬅ 上一题</button>
      <button class="btn btn-skip" onclick="next()">⏭ 下一题</button>
    </div>
  </div>

</div>

<div class="footer">
  <div class="wrap" style="display:flex;gap:10px">
    <button class="btn btn-primary" onclick="next()">🎲 随机一题</button>
    <button class="btn btn-primary" onclick="resetAll()" style="background:var(--panel2)">🔁 重置</button>
  </div>
</div>

<!-- 复习列表弹窗 -->
<div class="modal-mask" id="reviewMask" onclick="closeReview()"></div>
<div class="modal-box" id="reviewModal">
  <div class="modal-head">
    <h3 id="reviewTitle">复习列表</h3>
    <button class="modal-close" onclick="closeReview()">✕</button>
  </div>
  <div class="modal-body" id="reviewBody"></div>
</div>

<script>
// ============ 题库 ============
const QUESTIONS = [
  // ---------- Java 基础 ----------
  {c:"基础",d:"★★",q:"== 和 equals() 的区别是什么？",
   a:`<p><code>==</code> 比的是<strong>地址</strong>（是不是同一个对象）；<code>equals()</code> 默认也比地址，但像 String、Integer 这些类已经改写过，比的是<strong>内容</strong>。</p>
      <p>所以判断两个字符串内容是否一样，要用 <code>equals()</code>，不能用 <code>==</code>。</p>
      <blockquote>两个坑：① <code>new String("ab")</code> 可能创建 1 个或 2 个对象（看常量池里有没有 "ab"）；② Integer 在 -128~127 之间有缓存，超出范围 <code>==</code> 就不可靠了。包装类比较<strong>统一用 equals</strong>。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 本质区别</strong></p>
      <p><code>==</code> 是运算符：对于<strong>基本类型</strong>比较的是<strong>值</strong>，对于<strong>引用类型</strong>比较的是<strong>内存地址</strong>（是否指向堆中同一个对象）。</p>
      <p><code>equals()</code> 是 Object 的方法，默认实现就是 <code>return (this == obj)</code>，即默认也比较地址。但 String、Integer 等重写了它来比较内容。</p>
      <p><strong>2. String 的 equals 源码</strong>（JDK 8）</p>
      <pre><code>public boolean equals(Object anObject) {
    if (this == anObject) return true;  // 先比地址，快速判断
    if (anObject instanceof String) {
        String anotherString = (String) anObject;
        int n = value.length;
        if (n == anotherString.value.length) {
            char v1[] = value;
            char v2[] = anotherString.value;
            int i = 0;
            while (n-- != 0) {  // 逐字符比较
                if (v1[i] != v2[i]) return false;
                i++;
            }
            return true;
        }
    }
    return false;
}</code></pre>
      <p><strong>3. Integer 缓存机制（高频考点）</strong></p>
      <p>IntegerCache 默认缓存 <strong>-128 ~ 127</strong>，<code>Integer.valueOf()</code> 在这个范围内返回缓存对象，超出范围才 new。所以 <code>Integer a=127,b=127</code> 是同一对象（== 为 true），<code>Integer a=128,b=128</code> 是两个对象（== 为 false）。</p>
      <p>上限可通过 <code>-XX:AutoBoxCacheMax=N</code> 调整，下限 -128 固定不可改。Byte、Short、Long 缓存也是 -128~127 但不可配。</p>
      <p><strong>4. String 常量池</strong></p>
      <ul>
        <li>JDK 6 常量池在永久代；<strong>JDK 7+ 移到堆</strong>。</li>
        <li><code>new String("ab")</code> 创建对象数：常量池有 "ab" 则只创建堆对象（1个）；没有则常量池 + 堆对象（2个）。</li>
        <li>JDK 9+（JEP 254）String 内部从 <code>char[]</code> 改为 <code>byte[]</code> + coder，节省约 50% 内存。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>对于基本类型，== 比较值；对于引用类型，== 比较地址。equals 默认也比地址，但多数类（如 String、Integer）重写后比较内容。包装类比较一律用 equals，避免缓存机制带来的坑。</p>`},
  {c:"基础",d:"★★",q:"String、StringBuilder、StringBuffer 的区别？",
   a:`<p><strong>String</strong> 是不可变的，一旦创建改不了，每次拼接都会生成新对象。<strong>StringBuilder</strong> 和 <strong>StringBuffer</strong> 都是可变的，能在原对象上改，拼接更高效。</p>
      <p>两者的区别只在于线程安全：<strong>StringBuffer</strong> 加了 synchronized 是线程安全的，<strong>StringBuilder</strong> 没加，性能更好。</p>
      <blockquote>用法：单线程拼接用 StringBuilder，多线程共享用 StringBuffer。<strong>千万别在循环里用 + 拼 String</strong>——每次循环都会 new 一个 StringBuilder，效率极差，应该手动用 StringBuilder.append()。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 不可变性原理</strong></p>
      <p>String 不可变靠两点保证：<code>final class String</code>（类不可继承）+ <code>private final byte[] value</code>（数组引用不可变且 private 没有暴露修改方法）。JDK 9+ 用 byte[] + coder 替代 char[]。</p>
      <p>不可变的好处：① 线程安全；② 可缓存 hashCode；③ 字符串常量池复用；④ 安全（防篡改，作 HashMap key）。</p>
      <p><strong>2. + 拼接的编译优化</strong></p>
      <p>纯常量拼接 <code>"a"+"b"</code> 编译期折叠成 <code>"ab"</code>（1个对象）；含变量的拼接在 <strong>JDK 8</strong> 编译为 StringBuilder.append() 链，<strong>JDK 9+</strong> 改用 invokedynamic + StringConcatFactory（JEP 280）。</p>
      <p><strong>3. 循环拼接的性能陷阱（高频追问）</strong></p>
      <p>循环里用 <code>+</code>，每次迭代都会 new 一个 StringBuilder 对象。实测 10 万次循环：用 + 约 18301ms，用 append 约 5ms，相差约 3600 倍。<strong>循环拼接必须手动用 StringBuilder</strong>。</p>
      <p><strong>4. 三者对比表</strong></p>
      <ul>
        <li>String：不可变，线程安全，性能最差（频繁拼接）。</li>
        <li>StringBuilder：可变，非线程安全，性能最好，JDK 1.5 引入。</li>
        <li>StringBuffer：可变，线程安全（方法 synchronized），性能中等，JDK 1.0。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>String 不可变每次拼接生成新对象；StringBuilder 和 StringBuffer 可变。区别在于 StringBuffer 加了 synchronized 保证线程安全，性能比 StringBuilder 略低。单线程用 StringBuilder，多线程用 StringBuffer，循环拼接绝不用 String 的 +。</p>`},
  {c:"基础",d:"★★★",q:"Java 中的 hashCode() 和 equals() 之间有什么关系？",
   a:`<p>核心就一句话：<strong>equals 相等的两个对象，hashCode 必须也相等</strong>。反过来不成立——hashCode 相等的两个对象，equals 不一定相等（这叫哈希冲突）。</p>
      <p>为什么这么规定？因为 HashMap、HashSet 先用 hashCode 算出存放在哪个桶，再用 equals 比对。如果两个"逻辑相等"的对象 hashCode 不一样，就会被放到不同的桶里，找不到了。</p>
      <blockquote>所以重写 equals 时<strong>必须同时重写 hashCode</strong>，否则在 HashMap 里会出 bug——明明相等的对象却存成了两条记录。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Object 官方契约（JDK 文档原文）</strong></p>
      <p>equals 五契约：自反性（x.equals(x) 为 true）、对称性、传递性、一致性（多次调用结果一致）、非空性（x.equals(null) 为 false）。</p>
      <p>hashCode 三契约：① 同一对象多次调用必须返回相同值（一致性）；② <strong>equals 相等 ⇒ hashCode 必须相等</strong>（硬约束）；③ equals 不等时 hashCode 不等能提升哈希性能（非强制）。</p>
      <p><strong>2. HashMap 中的作用链（为什么必须配合）</strong></p>
      <p>HashMap 查找过程：<code>hash(key.hashCode())</code> 算出桶下标 → 在桶内（链表/红黑树）用 <code>equals()</code> 比对。两步缺一不可。</p>
      <p><strong>3. 只重写 equals 不重写 hashCode 的后果</strong></p>
      <p>Object 默认 hashCode 基于内存地址，两个 new 出来属性相同的对象 hashCode 不同 → 落入<strong>不同的桶</strong> → get() 永远返回 null，contains() 永远 false。</p>
      <p><strong>4. 标准实现示例</strong></p>
      <pre><code>@Override
public boolean equals(Object o) {
    if (this == o) return true;
    if (o == null || getClass() != o.getClass()) return false;
    Person p = (Person) o;
    return Objects.equals(name, p.name) && age == p.age;
}
@Override
public int hashCode() {
    return Objects.hash(name, age);  // 用相同字段算
}</code></pre>
      <p>注意：equals 用了哪些字段，hashCode 就用哪些字段，保证一致性。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>equals 相等 hashCode 必须相等，这是官方契约。因为 HashMap 先用 hashCode 定位桶再用 equals 比对，所以重写 equals 必须同时重写 hashCode，否则哈希容器会出 bug。</p>`},
  {c:"基础",d:"★★",q:"接口和抽象类有什么区别？",
   a:`<p><strong>抽象类</strong>像亲爹，只能单继承（一个子类只能有一个爹）；<strong>接口</strong>像技能，可以多实现（一个人可以会多种技能）。抽象类有构造器、能有各种成员变量；接口没有构造器，变量只能是常量。</p>
      <p>设计语义上：抽象类表示"是什么"（is-a），接口表示"能做什么"（can-do）。比如鸟 extends 动物（抽象类），implements 飞行（接口）。</p>
      <blockquote>版本演进：Java 8 起接口能写 default 方法（有方法体），Java 9 起能写 private 方法（给 default 方法复用代码用）。所以现在接口和抽象类的界限变模糊了。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心区别对比</strong></p>
      <ul>
        <li><strong>继承关系</strong>：抽象类单继承（一个子类只能继承一个抽象类）；接口可多实现（一个类可实现多个接口，接口之间也可多继承）。</li>
        <li><strong>构造器</strong>：抽象类有构造器（供子类 super 调用）；接口没有。</li>
        <li><strong>成员变量</strong>：抽象类可有任意类型的实例变量和静态变量；接口的变量默认是 <code>public static final</code> 常量。</li>
        <li><strong>方法</strong>：抽象类可有抽象方法和具体方法；接口 Java 8 前只能有抽象方法。</li>
      </ul>
      <p><strong>2. 接口的版本演进（高频考点）</strong></p>
      <ul>
        <li><strong>Java 8</strong>：新增 <code>default</code> 方法（有方法体，为了向后兼容，给接口加方法不影响老实现类）、<code>static</code> 方法。</li>
        <li><strong>Java 9</strong>：新增 <code>private</code> 方法（实例/静态均可），目的是让多个 default 方法之间<strong>代码复用</strong>，不暴露给实现类。</li>
      </ul>
      <p><strong>3. 菱形继承冲突</strong></p>
      <p>当实现多个接口有同名的 default 方法时，子类必须 override 该方法，并在方法内用 <code>接口名.super.方法名()</code> 显式指定调用哪个接口的实现。</p>
      <p><strong>4. 设计语义</strong></p>
      <p>抽象类表示 "is-a" 关系（强耦合，子类是父类的一种），接口表示 "can-do" 关系（松耦合，具备某种能力）。比如 <code>AbstractList</code>（抽象类）vs <code>Runnable</code>（接口）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>抽象类单继承有构造器可含各种变量，接口多实现无构造器变量是常量。语义上抽象类是 is-a，接口是 can-do。Java 8 后接口有 default 方法，Java 9 有 private 方法，两者界限趋近模糊，但单继承 vs 多实现这个本质区别还在。</p>`},
  {c:"基础",d:"★★★",q:"Java 的异常体系是怎样的？",
   a:`<p>顶层是 <code>Throwable</code>，下面分两支：</p>
      <ul>
        <li><strong>Error</strong>：JVM 级别的严重错误，比如内存溢出 OOM、栈溢出，程序基本救不回来，别去 catch。</li>
        <li><strong>Exception</strong>：分两种——
          <ul>
            <li><strong>受检异常（Checked）</strong>：编译器逼着你处理（try-catch 或 throws），比如 IOException，通常是外部环境问题。</li>
            <li><strong>运行时异常（RuntimeException）</strong>：编译器不强制处理，比如空指针 NPE，通常是程序自己写错了。</li>
          </ul>
        </li>
      </ul>
      <blockquote>关闭资源优先用 try-with-resources（Java 7+），比手写 finally 优雅多了，资源实现 AutoCloseable 即可。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 完整体系结构</strong></p>
      <p>Throwable 是顶层父类，有两个核心方法：<code>getMessage()</code> 获取错误信息、<code>printStackTrace()</code> 打印堆栈。</p>
      <ul>
        <li><strong>Error</strong>：JVM 内部错误或资源耗尽，程序无法也无需处理。如 OutOfMemoryError（堆溢出）、StackOverflowError（栈溢出）、NoClassDefFoundError。</li>
        <li><strong>Exception</strong>：
          <ul>
            <li><strong>Checked Exception</strong>（受检）：编译期强制 try-catch 或 throws，代表<strong>外部可恢复问题</strong>。如 IOException、SQLException、ClassNotFoundException。</li>
            <li><strong>RuntimeException</strong>（非受检）：编译器不强制，代表<strong>程序逻辑错误</strong>。如 NullPointerException、ArrayIndexOutOfBoundsException、ClassCastException、IllegalArgumentException。</li>
          </ul>
        </li>
      </ul>
      <p><strong>2. try-with-resources 原理（Java 7+）</strong></p>
      <p>资源需实现 AutoCloseable（或 Closeable）接口。本质是编译期语法糖，编译后展开为 try-finally，在 finally 中调 close()。</p>
      <ul>
        <li>多资源关闭顺序：与声明顺序<strong>相反</strong>（栈式，后开的先关）。</li>
        <li><strong>异常抑制</strong>：若 try 块和 close() 都抛异常，close() 抛的会被抑制，通过 <code>addSuppressed()</code> 附加到主异常，用 <code>getSuppressed()</code> 获取。</li>
      </ul>
      <p><strong>3. throw 和 throws 的区别</strong></p>
      <p>throw 是语句，主动抛出一个异常对象；throws 是方法声明，表示该方法可能抛出哪些异常，交给调用者处理。</p>
      <p><strong>4. finally 执行时机（易错点）</strong></p>
      <p>finally 一定执行（即使 try 里有 return，也先执行 finally 再 return），除非 <code>System.exit()</code> 或 JVM 崩溃。如果 finally 里也有 return，会覆盖 try 的 return。</p>
      <p><strong>5. 自定义异常</strong></p>
      <p>继承 Exception（受检）或 RuntimeException（非受检），提供带 message 和 cause 的构造方法。</p>`},
  {c:"基础",d:"★★",q:"Java 中的自动装箱和拆箱是什么？有什么坑？",
   a:`<p>简单说：<strong>装箱</strong>就是基本类型自动转成包装类（int → Integer），编译器帮你调 valueOf()；<strong>拆箱</strong>反过来（Integer → int），调 intValue()。</p>
      <p>有几个坑要知道：</p>
      <ul>
        <li>Integer 在 -128~127 之间有缓存，所以 <code>Integer a=127, b=127</code> 用 <code>==</code> 比较是 true，但 128 就不是了。</li>
        <li>拆箱时如果包装类对象是 null，会抛空指针异常。</li>
        <li>循环里频繁装箱会创建大量临时对象，影响性能。</li>
      </ul>
      <blockquote>三元运算符也有坑：<code>Integer a=null; int b = flag ? a : 0;</code> 会拆箱导致 NPE，因为两个分支类型不一致时编译器会自动拆箱。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 装箱拆箱的编译原理</strong></p>
      <p>装箱：<code>Integer i = 100</code> 编译为 <code>Integer.valueOf(100)</code>。</p>
      <p>拆箱：<code>int n = i</code> 编译为 <code>i.intValue()</code>。各包装类对应 xxxValue()。</p>
      <p><strong>2. IntegerCache 源码</strong></p>
      <pre><code>public static Integer valueOf(int i) {
    if (i &gt;= IntegerCache.low && i &lt;= IntegerCache.high)
        return IntegerCache.cache[i + (-IntegerCache.low)];
    return new Integer(i);
}</code></pre>
      <p>范围 -128~127，<strong>下限固定不可改，上限可通过 <code>-XX:AutoBoxCacheMax=N</code> 或 <code>-Djava.lang.Integer.IntegerCache.high=N</code> 调整</strong>。Byte、Short、LongCache 也是 -128~127 但不可配；CharacterCache 是 0~127；BooleanCache 是 TRUE/FALSE。</p>
      <p><strong>3. 三元运算符 NPE 陷阱（阿里手册强调）</strong></p>
      <p>当三元运算符两个分支类型不一致（包装类 vs 基本类型）时，编译器做<strong>类型对齐</strong>，对包装类自动拆箱，若为 null 则 NPE：</p>
      <pre><code>Map&lt;String,Long&gt; map = new HashMap&lt;&gt;();
Long r = map.get("key") != null ? map.get("key") : 0L;  // 第二个分支是 long，map.get 返回 Long → 拆箱 → NPE</code></pre>
      <p>解决：两分支统一类型，如 <code>Long.valueOf(0L)</code>，或用 <code>Objects.requireNonNullElse()</code>。</p>
      <p><strong>4. 性能问题</strong></p>
      <p>循环中频繁装箱（如 <code>Integer sum=0; for(...) sum+=i;</code>）每次 += 都会拆箱再装箱，创建大量临时对象。应用基本类型 int 或 int[]。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>装箱拆箱是编译期的语法糖，装箱调 valueOf（有缓存），拆箱调 xxxValue。坑有三：IntegerCache 导致 == 不稳定、null 拆箱 NPE、三元运算符自动拆箱、循环装箱性能差。</p>`},
  {c:"基础",d:"★★",q:"Java 是值传递还是引用传递？",
   a:`<p><strong>Java 只有值传递，没有引用传递</strong>。</p>
      <p>基本类型传的是值的副本，方法里怎么改都不影响外面；对象传的也是"引用的副本"——相当于把写着地址的纸条<strong>复印了一份</strong>给方法。</p>
      <p>所以方法里 <code>obj.setXxx()</code> 能改对象内部属性（因为指向同一个对象），但方法里 <code>obj = new Obj()</code> 改不了外面那个引用（你改的是复印件，原件没动）。</p>
      <blockquote>区分点：方法里能不能让外面的变量指向一个新对象？Java 做不到。这才是真正的"引用传递"（C++ 才有）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 形参和实参</strong></p>
      <p>实参：调用方法时传入的变量；形参：方法定义中声明的参数。方法调用时，<strong>实参的值被拷贝一份赋给形参</strong>。</p>
      <p><strong>2. 值传递的本质</strong></p>
      <p>Java 方法调用时，<strong>永远是把实参的"值"复制一份传给形参</strong>。对基本类型，复制的是数据值；对引用类型，复制的是"指向堆对象的地址值"（引用本身）。所以 Java 是值传递。</p>
      <p><strong>3. 两种情形分析</strong></p>
      <ul>
        <li><strong>基本类型</strong>：方法内修改形参，不影响外部实参（因为只是副本）。</li>
        <li><strong>引用类型</strong>：方法内通过形参修改对象属性（如 <code>obj.setXxx()</code>），外部能看到变化（因为形参和实参指向同一个对象）；但方法内让形参重新指向新对象（<code>obj = new Obj()</code>），不影响外部实参（改的是副本的指向）。</li>
      </ul>
      <p><strong>4. 为什么说"对象传引用"是错误的</strong></p>
      <p>C++ 的引用传递（int& ref）能让方法内修改形参直接影响外部实参，包括让外部变量指向新对象。Java 做不到这点（方法内无法改变外部引用指向），所以不是引用传递。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Java 只有值传递。基本类型传值副本，引用类型传引用地址的副本。所以方法内能改对象内部状态，但不能改变外部引用指向。区分值传递和引用传递的关键：方法内能否修改外部变量本身的指向。</p>`},
  {c:"基础",d:"★★",q:"说说你对 Java 反射的理解。应用场景和缺点？",
   a:`<p>反射就是在<strong>程序运行的时候</strong>，动态地拿到一个类的信息、创建对象、调用方法、访问字段，全靠 Class 对象。</p>
      <p><strong>典型场景</strong>：Spring 帮你 new Bean（读注解、反射实例化）、MyBatis 把数据库字段映射到对象、JDBC 加载驱动、动态代理生成 AOP。</p>
      <p><strong>缺点</strong>：比直接调用慢一些、能突破 private 访问限制（破坏封装）、编译期发现不了类型错误。</p>
      <blockquote>性能优化小技巧：把 Method、Field 对象<strong>缓存起来</strong>复用，别每次都重新 getMethod，能快几十倍。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 获取 Class 对象的三种方式</strong></p>
      <ul>
        <li><code>类名.class</code>：编译期已知，性能最好。</li>
        <li><code>对象.getClass()</code>：运行时有实例。</li>
        <li><code>Class.forName("全限定名")</code>：运行时动态加载（JDBC 加载驱动用这种），会触发类初始化。</li>
      </ul>
      <p><strong>2. 反射核心操作</strong></p>
      <ul>
        <li>创建实例：<code>clazz.getDeclaredConstructor().newInstance()</code>（Java 9+ 替代过时的 newInstance()）。</li>
        <li>调用方法：<code>method.invoke(obj, args)</code>。</li>
        <li>访问字段：<code>field.set(obj, value)</code> / <code>field.get(obj)</code>。</li>
        <li>访问 private 需先 <code>setAccessible(true)</code>。</li>
      </ul>
      <p><strong>3. Method.invoke 的 inflation 机制（性能深入）</strong></p>
      <p>反射调用委托给 MethodAccessor，有两种实现按调用次数切换：</p>
      <ul>
        <li>前 <strong>15 次</strong>（<code>-Dsun.reflect.inflationThreshold</code> 默认 15）：用 NativeMethodAccessorImpl（JNI 实现，慢）。</li>
        <li>第 16 次起：触发 inflation，用 <strong>ASM 动态生成字节码</strong> GeneratedMethodAccessorN（快，接近直接调用）。</li>
      </ul>
      <p><code>setAccessible(true)</code> 不仅绕过权限检查，还跳过每次调用的校验开销，附带性能收益。</p>
      <p><strong>4. 应用场景</strong></p>
      <ul>
        <li>Spring IoC：扫描注解，反射创建 Bean、注入依赖。</li>
        <li>动态代理：JDK Proxy / CGLIB 生成 AOP 代理。</li>
        <li>ORM（MyBatis/Hibernate）：结果集字段映射到对象。</li>
        <li>JDBC：Class.forName 加载驱动。</li>
        <li>注解处理：运行时读取注解信息。</li>
      </ul>
      <p><strong>5. 缺点与优化</strong></p>
      <p>缺点：性能开销（比直接调用慢）、破坏封装（访问 private）、编译期丢失类型检查。优化：<strong>缓存 Method/Field 对象</strong>避免重复 getMethod（实测可提升 20-30 倍）。</p>`},

  // ---------- 集合 ----------
  {c:"集合",d:"★★★",q:"HashMap 的底层原理？JDK1.8 做了什么优化？",
   a:`<p>JDK1.8：数组 + 链表 + <strong>红黑树</strong>。</p>
      <ol>
        <li>默认初始容量 16，负载因子 0.75，扩容阈值 = 容量×0.75。</li>
        <li>put 时：先 hash(key) 算桶下标，空则直接放；有元素则判断 key 相等就覆盖，否则尾插法挂链表。</li>
        <li>链表长度 ≥8 且数组长度 ≥64 时，转红黑树（&lt;6 退化为链表）。</li>
        <li>元素超过阈值则扩容为 2 倍，重新 hash 分配。</li>
      </ol>
      <blockquote>1.8 优化：① 链表改尾插（1.7 头插扩容会成环死循环）；② 引入红黑树解决哈希冲突下的查询退化（O(n)→O(logn)）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 数据结构</strong></p>
      <p>JDK 1.8：数组 + 链表 + 红黑树。数组是主体（table），每个槽位叫桶（bucket）。key 的 hash 决定放哪个桶，冲突的元素用链表串起来，链表过长（≥8）转红黑树。</p>
      <p><strong>2. 重要参数</strong></p>
      <ul>
        <li>初始容量 16（必须 2 的幂）。</li>
        <li>负载因子 0.75（空间和时间的折衷）。</li>
        <li>扩容阈值 threshold = capacity × loadFactor（默认 12），超过就扩容。</li>
        <li>树化阈值 8（链表长度≥8 且数组≥64 才树化），退化阈值 6。</li>
      </ul>
      <p><strong>3. 为什么 1.8 引入红黑树</strong></p>
      <p>恶意构造的 hash 冲突会让 HashMap 退化成链表，查询从 O(1) 变 O(n)，引发 DoS 攻击（如 Tomcat 的参数解析）。红黑树把最坏查询降到 O(logn)。</p>
      <p><strong>4. 1.7 vs 1.8 的两个关键优化</strong></p>
      <ul>
        <li><strong>链表插入方式</strong>：1.7 头插法（扩容时可能形成环形链表，get 时死循环 CPU 100%）；1.8 改尾插法，解决死循环。</li>
        <li><strong>引入红黑树</strong>：解决哈希冲突下的查询退化。</li>
        <li>扩容时元素位置计算优化：1.7 重新 hash；1.8 用 e.hash & oldCap 判断，要么留原位要么移到原位+oldCap。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>1.8 是数组+链表+红黑树。put 时 hash 定位桶，冲突则尾插链表，链表≥8且数组≥64 转红黑树。元素超阈值（容量×0.75）扩容 2 倍。相比 1.7 修复了头插死循环、引入红黑树优化冲突查询。</p>`},
  {c:"集合",d:"★★★",q:"HashMap 为什么是线程不安全的？多线程下用什么？",
   a:`<p>HashMap 并发问题：</p>
      <ul>
        <li>1.7 扩容头插可能形成环形链表，导致 CPU 100% 死循环。</li>
        <li>1.8 虽修复了死循环，但仍会<strong>数据丢失</strong>（两个线程同时 put 覆盖）、size 不准、扩容期间 get 到 null。</li>
      </ul>
      <p><strong>替代方案</strong>：</p>
      <ul>
        <li>ConcurrentHashMap（首选）：1.8 用 CAS + synchronized 锁单个桶，并发度高。</li>
        <li>Collections.synchronizedMap：用一把全局锁，性能差。</li>
        <li>HashTable：全表锁，已淘汰。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 1.7 的死循环问题（经典）</strong></p>
      <p>1.7 扩容时用头插法迁移元素，多线程下可能形成环形链表。后续 get 遃到这个桶会陷入死循环（next 指来指去），CPU 100%。这是 HashMap 在并发下最严重的问题。</p>
      <p><strong>2. 1.8 虽修复死循环，但仍有问题</strong></p>
      <ul>
        <li><strong>数据覆盖/丢失</strong>：两个线程同时 put 到同一空桶，CAS 之外无保护，后写的覆盖先写的。</li>
        <li><strong>size 不准</strong>：size++ 不是原子操作。</li>
        <li><strong>扩容并发问题</strong>：多线程同时触发扩容可能丢数据。</li>
        <li>get 到 null：put 过程中值还没设置好就被读到。</li>
      </ul>
      <p><strong>3. 替代方案对比</strong></p>
      <ul>
        <li><strong>ConcurrentHashMap（首选）</strong>：1.7 分段锁，1.8 CAS + synchronized 锁桶头节点，并发度高，读无锁。</li>
        <li><strong>Collections.synchronizedMap</strong>：包装类，每个方法加 synchronized（锁整个 this），并发度低。</li>
        <li><strong>Hashtable</strong>：方法级 synchronized 全表锁，性能最差，已淘汰。还不允许 null。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>1.7 并发扩容头插成环导致死循环，1.8 改尾插修复了死循环但仍有数据丢失、size 不准等问题。并发场景必须用 ConcurrentHashMap（CAS+synchronized 锁桶），不要用 Hashtable 或 synchronizedMap。</p>`},
  {c:"集合",d:"★★★",q:"ConcurrentHashMap 在 JDK1.7 和 1.8 的实现区别？",
   a:`<p><strong>1.7</strong>：Segment 分段锁。整个 Map 分成 N 个 Segment（默认16，继承 ReentrantLock），每个 Segment 内部是 HashEntry 数组+链表。锁粒度是 Segment，最大并发度=Segment 数。</p>
      <p><strong>1.8</strong>：废弃 Segment，改成 Node 数组 + 链表/红黑树，锁粒度细化到<strong>桶头节点</strong>。</p>
      <ul>
        <li>空桶用 <strong>CAS</strong> 插入。</li>
        <li>非空桶用 <code>synchronized(头节点)</code>，锁住该桶链表。</li>
        <li>get 完全无锁（volatile 读 Node 的 val、next）。</li>
      </ul>
      <blockquote>优势：并发度更高、内存占用更小、size 用 LongAdder 思想分槽统计。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. JDK 1.7：Segment 分段锁</strong></p>
      <ul>
        <li>结构：ConcurrentHashMap 由 Segment[] 组成，每个 Segment 继承 ReentrantLock，内部是 HashEntry 数组 + 链表。</li>
        <li>锁粒度：Segment（默认 16 个），put 时锁住对应 Segment。</li>
        <li>并发度 = Segment 数（默认 16，初始化后不可变）。</li>
        <li>get 无锁：HashEntry 的 value 是 volatile。</li>
        <li>缺点：并发度固定、Segment 占内存、两次 hash 定位。</li>
      </ul>
      <p><strong>2. JDK 1.8：CAS + synchronized + Node 数组</strong></p>
      <ul>
        <li>废弃 Segment，直接用 Node 数组（类似 HashMap）。</li>
        <li><strong>put 流程</strong>：hash 定位桶 → 空桶用 CAS（casTabAt）写入 → 非空桶 synchronized 锁住头节点 → 链表尾插或红黑树插入。</li>
        <li><strong>get 完全无锁</strong>：Node 的 val、next 是 volatile，保证可见性。</li>
        <li>支持红黑树（链表≥8 转）。</li>
        <li>size 用 LongAdder 思想：baseCount + CounterCell[] 分槽计数，减少竞争。</li>
      </ul>
      <p><strong>3. 为什么 1.8 改用 synchronized 而不是 ReentrantLock</strong></p>
      <ul>
        <li>1.6 后 synchronized 经过偏向锁、轻量级锁优化，性能不输 ReentrantLock。</li>
        <li>synchronized 是 JVM 内置，锁升级有优化空间（锁记录、monitor）。</li>
        <li>粒度从 Segment 细化到桶头节点，并发度大幅提升。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>1.7 用 Segment 分段锁（ReentrantLock），并发度=Segment 数（16）；1.8 废弃 Segment，用 CAS + synchronized 锁桶头节点，并发度等于桶数，get 无锁（volatile 读），支持红黑树。</p>`},
  {c:"集合",d:"★★",q:"ArrayList 和 LinkedList 的区别？分别适用什么场景？",
   a:`<ul>
        <li><strong>底层</strong>：ArrayList 是 Object 数组；LinkedList 是双向链表（也实现了 Deque）。</li>
        <li><strong>随机访问</strong>：ArrayList O(1)；LinkedList O(n)。</li>
        <li><strong>增删</strong>：ArrayList 尾部 O(1)，中间 O(n)（要移动元素）；LinkedList 在已定位节点处 O(1)。</li>
        <li><strong>内存</strong>：LinkedList 每个节点要额外存前后指针，更占内存。</li>
      </ul>
      <blockquote>实际上 LinkedList 几乎没有性能优势（遍历定位本身是 O(n)），日常开发 90% 用 ArrayList。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 底层数据结构</strong></p>
      <ul>
        <li><strong>ArrayList</strong>：Object[] 数组，连续内存。实现 RandomAccess 接口（标记接口，表示支持快速随机访问）。</li>
        <li><strong>LinkedList</strong>：双向链表，每个 Node 有 prev/next/item。同时实现 List 和 Deque（可当队列/栈用）。</li>
      </ul>
      <p><strong>2. 时间复杂度对比</strong></p>
      <ul>
        <li><strong>随机访问 get(i)</strong>：ArrayList O(1)（数组下标）；LinkedList O(n)（要从头遍历）。</li>
        <li><strong>尾部增删 add/remove(尾)</strong>：ArrayList 均摊 O(1)（偶尔扩容）；LinkedList O(1)。</li>
        <li><strong>中间增删</strong>：ArrayList O(n)（要移动后面元素）；LinkedList O(n)（定位 O(n) + 修改指针 O(1)）。</li>
      </ul>
      <p><strong>3. 内存占用</strong></p>
      <p>LinkedList 每个 Node 额外要存 prev、next 两个引用（16 字节/节点），内存占用远高于 ArrayList。ArrayList 是连续内存，对 CPU 缓存友好。</p>
      <p><strong>4. 为什么实际多用 ArrayList</strong></p>
      <ul>
        <li>LinkedList 中间增删也是 O(n)（定位本身要遍历），并不比 ArrayList 快。</li>
        <li>ArrayList 随机访问快、内存紧凑、CPU 缓存命中率高。</li>
        <li>LinkedList 优势仅在"头部增删"场景，但那种场景用 ArrayDeque 更好。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>ArrayList 数组随机访问 O(1) 增删 O(n)，LinkedList 链表随机访问 O(n) 增删 O(1)。ArrayList 内存紧凑缓存友好，实际开发 90% 用它。LinkedList 内存开销大且优势不明显，多被 ArrayDeque 替代。</p>`},
  {c:"集合",d:"★★",q:"ArrayList 的扩容机制是怎样的？",
   a:`<p>初始容量 10（首次 add 时才创建数组）。当元素数 > 当前容量时扩容：</p>
      <ol>
        <li>新容量 = 旧容量 + 旧容量 &gt;&gt; 1（即 1.5 倍）。</li>
        <li>Arrays.copyOf 复制到新数组。</li>
      </ol>
      <blockquote>建议：已知大小用 new ArrayList&lt;&gt;(n) 预分配，避免多次扩容。扩容是 O(n) 的操作。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 初始容量</strong></p>
      <p>无参构造时，初始是<strong>空数组</strong>（DEFAULTCAPACITY_EMPTY_ELEMENTDATA），首次 add 时才扩容到默认容量 10（懒初始化，避免空 ArrayList 浪费内存）。</p>
      <p>有参构造 new ArrayList&lt;&gt;(n) 直接分配 n 大小。</p>
      <p><strong>2. 扩容时机</strong></p>
      <p>add 时检查 size+1 是否大于当前数组长度，是则触发扩容。</p>
      <p><strong>3. 扩容大小</strong></p>
      <p>新容量 = 旧容量 + (旧容量 &gt;&gt; 1) = <strong>1.5 倍</strong>。源码：</p>
      <pre><code>int newCapacity = oldCapacity + (oldCapacity &gt;&gt; 1);
elementData = Arrays.copyOf(elementData, newCapacity);</code></pre>
      <p>为什么是 1.5 倍（而不是 HashMap 的 2 倍）：ArrayList 是要拷贝数组的，1.5 倍在内存占用和扩容次数间更平衡。</p>
      <p><strong>4. addAll 的大批量扩容</strong></p>
      <p>如果一次 addAll 很多元素，新容量 = max(1.5倍, size+新增数)，保证能装下。</p>
      <p><strong>5. trimToSize</strong></p>
      <p>把数组缩小到实际 size，释放多余内存（elementData = Arrays.copyOf(elementData, size)）。</p>
      <p><strong>6. 优化建议</strong></p>
      <ul>
        <li>已知大小用 new ArrayList&lt;&gt;(n) 预分配，避免多次扩容（每次扩容 O(n) 拷贝）。</li>
        <li>用完用 trimToSize 回收内存。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>无参构造首次 add 才初始化为 10。元素超容量时扩容 1.5 倍（oldCap + oldCap&gt;&gt;1），Arrays.copyOf 拷贝。建议预分配大小避免频繁扩容。</p>`},
  {c:"集合",d:"★★",q:"HashMap 和 Hashtable 的区别？",
   a:`<ul>
        <li><strong>线程安全</strong>：HashMap 不安全；Hashtable 线程安全（方法加 synchronized，全表锁，性能差，已淘汰）。</li>
        <li><strong>null 支持</strong>：HashMap 允许 key/value 为 null（最多一个 null key）；Hashtable 不允许。</li>
        <li><strong>初始容量</strong>：HashMap 16；Hashtable 11。扩容：HashMap 2倍；Hashtable 2n+1。</li>
        <li><strong>hash 算法</strong>：HashMap 用扰动 (h = key.hashCode()) ^ (h &gt;&gt;&gt; 16)。</li>
      </ul>
      <blockquote>并发场景用 ConcurrentHashMap，不要用 Hashtable。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 详细对比</strong></p>
      <ul>
        <li><strong>线程安全</strong>：HashMap 非线程安全；Hashtable 线程安全（每个方法加 synchronized，锁整个 this，即全表锁，并发度低）。</li>
        <li><strong>null 支持</strong>：HashMap 允许 1 个 null key 和多个 null value（null 的 hash 当 0 处理）；Hashtable 完全不允许 null（key/value 都不行，会 NPE）。</li>
        <li><strong>初始容量</strong>：HashMap 16；Hashtable 11（质数，旧 hash 算法遗留）。</li>
        <li><strong>扩容</strong>：HashMap 2 倍（保持 2 的幂）；Hashtable 2n+1。</li>
        <li><strong>hash 算法</strong>：HashMap 用扰动 (hashCode ^ hashCode&gt;&gt;&gt;16) + 位运算定位；Hashtable 直接 hashCode % length。</li>
        <li><strong>继承关系</strong>：HashMap 继承 AbstractMap；Hashtable 继承 Dictionary（老旧类）。</li>
        <li><strong>迭代器</strong>：HashMap fail-fast；Hashtable 的 Enumeration 不是 fail-fast。</li>
      </ul>
      <p><strong>2. 为什么 Hashtable 淘汰了</strong></p>
      <ul>
        <li>全表锁性能差（一次只能一个线程操作）。</li>
        <li>Dictionary 继承体系老旧。</li>
        <li>ConcurrentHashMap 完美替代（高并发 + 线程安全）。</li>
      </ul>
      <p><strong>3. 面试标准答法</strong></p>
      <p>HashMap 非线程安全允许 null 容量16扩容2倍，Hashtable 线程安全（全表锁）不允许 null 容量11扩容2n+1。Hashtable 已淘汰，并发用 ConcurrentHashMap。</p>`},

  // ---------- 并发 ----------
  {c:"并发",d:"★★★",q:"创建线程有几种方式？哪个推荐？",
   a:`<p>常见说法（面试八股）：</p>
      <ol>
        <li>继承 Thread 类，重写 run()。</li>
        <li>实现 Runnable 接口（更灵活，无单继承限制）。</li>
        <li>实现 Callable + FutureTask（有返回值、可抛异常）。</li>
        <li>线程池 ExecutorService（<strong>生产推荐</strong>）。</li>
      </ol>
      <blockquote>本质都是 Thread，前三种只是描述任务的方式。生产中<strong>必须用线程池</strong>，避免频繁创建销毁线程，统一管理和监控。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 四种方式及本质</strong></p>
      <ul>
        <li><strong>继承 Thread</strong>：重写 run()，new MyThread().start()。单继承限制，不推荐。</li>
        <li><strong>实现 Runnable</strong>：new Thread(runnable).start()。解耦任务和线程，无返回值。</li>
        <li><strong>实现 Callable + FutureTask</strong>：有返回值（call 返回 V）、可抛 checked 异常。FutureTask.get() 阻塞取结果。</li>
        <li><strong>线程池 ExecutorService</strong>：submit(Runnable/Callable)，生产推荐。</li>
      </ul>
      <p><strong>2. 本质都是 Thread</strong></p>
      <p>Runnable/Callable 只是任务描述，真正执行的还是 Thread。Runnable 用 final Thread 的 target 字段持有，run() 里调 target.run()。Callable 借 FutureTask 适配成 Runnable（FutureTask 实现 RunnableFuture）。</p>
      <p><strong>3. 为什么生产用线程池</strong></p>
      <ul>
        <li><strong>减少开销</strong>：线程创建/销毁开销大（涉及内核态），线程池复用线程。</li>
        <li><strong>控制并发</strong>：避免无限制创建线程导致 OOM 或系统崩溃。</li>
        <li><strong>统一管理</strong>：监控、调优、命名、拒绝策略。</li>
        <li><strong>解耦</strong>：任务提交和执行分离。</li>
      </ul>
      <p>阿里规约：线程资源必须通过线程池提供，不允许自行显式创建线程。</p>
      <p><strong>4. start 和 run 的区别</strong></p>
      <p>start() 启动新线程并调 run()；直接调 run() 是普通方法调用，不新建线程。start() 只能调一次，重复调抛 IllegalThreadStateException。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>4 种：继承 Thread、实现 Runnable、Callable+FutureTask、线程池。本质都是 Thread，生产必须用线程池复用线程、控制并发、统一管理。start 才是启动新线程，run 只是方法。</p>`},
  {c:"并发",d:"★★★",q:"线程池的核心参数有哪些？工作流程是怎样的？",
   a:`<p>ThreadPoolExecutor 7 个参数：</p>
      <ol>
        <li><strong>corePoolSize</strong>：核心线程数（默认不销毁）。</li>
        <li><strong>maximumPoolSize</strong>：最大线程数。</li>
        <li><strong>keepAliveTime</strong>：非核心线程空闲存活时间。</li>
        <li><strong>unit</strong>：时间单位。</li>
        <li><strong>workQueue</strong>：任务队列（如 LinkedBlockingQueue）。</li>
        <li><strong>threadFactory</strong>：线程工厂（建议自定义命名）。</li>
        <li><strong>handler</strong>：拒绝策略。</li>
      </ol>
      <p><strong>执行流程</strong>：核心线程满 → 进队列 → 队列满 → 扩到最大线程 → 还满 → 执行拒绝策略。</p>
      <blockquote>阿里规范：不要用 Executors.newFixedThreadPool（无界队列易 OOM），要用 new ThreadPoolExecutor 手动配置。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 七个参数详解</strong></p>
      <ul>
        <li><strong>corePoolSize</strong>：核心线程数。默认常驻不销毁（除非 allowCoreThreadTimeOut(true)）。</li>
        <li><strong>maximumPoolSize</strong>：线程池最大线程数。队列满后才会扩容到这个上限。</li>
        <li><strong>keepAliveTime + unit</strong>：非核心线程（或开启回收后核心线程）空闲存活时间。</li>
        <li><strong>workQueue</strong>：阻塞队列，缓存待执行任务。常用 ArrayBlockingQueue（有界）、LinkedBlockingQueue（默认无界，坑）、SynchronousQueue（直接交接）。</li>
        <li><strong>threadFactory</strong>：创建线程的工厂。建议自定义命名（如 pool-1-thread-1），方便排查。</li>
        <li><strong>handler</strong>：拒绝策略，队列满且线程达上限时触发。</li>
      </ul>
      <p><strong>2. 执行流程（重点顺序，易错）</strong></p>
      <p>execute(task) 的逻辑：<strong>核心 → 队列 → 最大 → 拒绝</strong></p>
      <ol>
        <li>线程数 &lt; corePoolSize：新建核心线程执行。</li>
        <li>线程数 ≥ corePoolSize：任务入 workQueue 排队。</li>
        <li>队列满 且 线程数 &lt; maximumPoolSize：新建非核心线程执行。</li>
        <li>队列满 且 线程数 = maximumPoolSize：执行拒绝策略。</li>
      </ol>
      <p><strong>注意顺序</strong>：是先填满队列再扩容线程，不是先扩满线程！这点经常考。</p>
      <p><strong>3. 为什么 FixedThreadPool 会 OOM</strong></p>
      <p>newFixedThreadPool(n) 用 LinkedBlockingQueue（无界），队列永远不满 → 不会触发拒绝 → 任务堆积导致 OOM。newCachedThreadPool 最大线程 Integer.MAX_VALUE → 创建大量线程 OOM。</p>
      <p><strong>4. 合理配置参数</strong></p>
      <ul>
        <li>CPU 密集型：corePoolSize = N+1（N=CPU 核数）。</li>
        <li>IO 密集型：corePoolSize = 2N 或 N×(1+等待时间/计算时间)。</li>
        <li>队列必须有界，否则 OOM。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>7 参数：核心数、最大数、存活时间、单位、队列、工厂、拒绝策略。执行流程：核心→队列→最大→拒绝（注意是先满队列再扩容）。手动创建 ThreadPoolExecutor，别用 Executors。</p>`},
  {c:"并发",d:"★★★",q:"线程池的拒绝策略有哪些？",
   a:`<p>JDK 提供 4 种：</p>
      <ol>
        <li><strong>AbortPolicy</strong>（默认）：抛 RejectedExecutionException。</li>
        <li><strong>CallerRunsPolicy</strong>：让提交任务的线程自己执行（降级保护，常用于削峰）。</li>
        <li><strong>DiscardPolicy</strong>：直接丢弃新任务，不抛异常。</li>
        <li><strong>DiscardOldestPolicy</strong>：丢弃队列最老的任务，再尝试提交。</li>
      </ol>
      <blockquote>真实业务常自定义策略：记录日志、持久化到 MQ/DB 后续补偿。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 触发时机</strong></p>
      <p>execute 提交任务时，如果<strong>队列已满 且 线程数已达 maximumPoolSize</strong>，触发拒绝策略 handler.rejectedExecution(task, this)。</p>
      <p><strong>2. 四种内置策略</strong></p>
      <ul>
        <li><strong>AbortPolicy（默认）</strong>：抛 RejectedExecutionException。调用方需 try-catch 处理，否则异常向上抛。适合任务不能丢的场景（如核心业务）。</li>
        <li><strong>CallerRunsPolicy</strong>：让提交任务的线程（调用者）自己执行该任务。效果：① 降低提交速度（背压）；② 不丢任务。适合可容忍降速的场景。</li>
        <li><strong>DiscardPolicy</strong>：默默丢弃新任务，不抛异常。慎用（无声丢任务难排查），适合可丢的次要任务。</li>
        <li><strong>DiscardOldestPolicy</strong>：丢弃队列头部最老的任务，再 execute 重试提交新任务。适合新任务更重要（如最新数据）的场景。</li>
      </ul>
      <p><strong>3. 自定义策略</strong></p>
      <p>实现 RejectedExecutionHandler。常见做法：记录日志告警、持久化到 DB/MQ 后续补偿、降级返回默认值。生产中必须有兜底，不能裸用 Abort 导致系统雪崩。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>队列满且达最大线程数触发。四种：Abort（默认抛异常）、CallerRuns（调用者自己跑，降速）、Discard（丢新不报）、DiscardOldest（丢老的）。生产多自定义（日志/持久化/降级）。</p>`},
  {c:"并发",d:"★★★",q:"synchronized 和 ReentrantLock 的区别？",
   a:`<table>对比表：</table>
      <ul>
        <li><strong>性质</strong>：synchronized 是 JVM 关键字（monitorenter/monitorexit）；ReentrantLock 是 JDK API（基于 AQS）。</li>
        <li><strong>锁释放</strong>：synchronized 自动释放；ReentrantLock 必须手动 finally unlock，否则死锁。</li>
        <li><strong>响应中断</strong>：synchronized 不支持；ReentrantLock 支持 lockInterruptibly()。</li>
        <li><strong>公平锁</strong>：synchronized 非公平；ReentrantLock 可选公平/非公平。</li>
        <li><strong>条件变量</strong>：synchronized 一个 wait/notify；ReentrantLock 可多个 Condition。</li>
        <li><strong>尝试获取</strong>：synchronized 阻塞；ReentrantLock 有 tryLock(timeout)。</li>
      </ul>
      <blockquote>1.6 后 synchronized 引入偏向锁、轻量级锁、锁升级，性能和 ReentrantLock 差距已很小。简单场景优先 synchronized。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 详细对比</strong></p>
      <ul>
        <li><strong>实现层面</strong>：synchronized 是 JVM 关键字（monitorenter/monitorexit 指令，对象头 Mark Word 存锁状态）；ReentrantLock 是 java.util.concurrent 的类（基于 AQS）。</li>
        <li><strong>锁释放</strong>：synchronized 自动（出同步块/异常）；ReentrantLock 必须手动 unlock，且要放 finally，否则死锁。</li>
        <li><strong>响应中断</strong>：synchronized 不响应中断（死等）；ReentrantLock 可 lockInterruptibly() 被中断。</li>
        <li><strong>公平性</strong>：synchronized 非公平；ReentrantLock 构造参数选 fair（公平）/非公平。</li>
        <li><strong>条件变量</strong>：synchronized 配合 Object 的 wait/notify（单条件）；ReentrantLock 用 Condition（可多个，await/signal）。</li>
        <li><strong>尝试获取</strong>：synchronized 阻塞获取；ReentrantLock 有 tryLock()（立即返回）、tryLock(timeout)。</li>
        <li><strong>可重入</strong>：两者都可重入（同线程可多次获取，计数器累加）。</li>
      </ul>
      <p><strong>2. 性能对比</strong></p>
      <p>JDK 1.6 后 synchronized 引入偏向锁、轻量级锁（CAS 自旋）、锁升级，性能和 ReentrantLock 接近，简单场景甚至更快（JVM 内置优化）。竞争激烈时两者相当。</p>
      <p><strong>3. 选择建议</strong></p>
      <ul>
        <li>简单同步、不需高级功能：用 synchronized（简洁、自动释放、JVM 优化）。</li>
        <li>需要可中断、超时、公平、多条件、尝试获取：用 ReentrantLock。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>synchronized 是 JVM 关键字自动释放不响应中断非公平单条件；ReentrantLock 是 API 手动释放可中断可公平多条件可 tryLock。1.6 后两者性能接近，简单用 synchronized，需高级功能用 ReentrantLock。</p>`},
  {c:"并发",d:"★★★",q:"volatile 关键字的作用和原理？",
   a:`<p>两大作用：</p>
      <ol>
        <li><strong>保证可见性</strong>：写 volatile 变量时会强制刷回主内存，读时强制从主内存读，使其他线程立即可见。底层是<strong>内存屏障</strong> + CPU 缓存一致性协议（MESI）。</li>
        <li><strong>禁止指令重排序</strong>：通过插入内存屏障（LoadLoad/StoreStore/LoadStore/StoreLoad）。</li>
      </ol>
      <blockquote>注意：volatile <strong>不保证原子性</strong>（如 i++ 仍不安全）。要原子性用 synchronized 或 AtomicInteger（基于 CAS）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. volatile 的两大语义</strong></p>
      <ul>
        <li><strong>可见性</strong>：写 volatile 变量后，新值立即刷回主内存，并使其他线程工作内存中该变量的缓存行失效（强制重新读主内存）。其他线程读 volatile 总能拿到最新值。</li>
        <li><strong>禁止指令重排序</strong>：编译器/CPU 不会把 volatile 变量的读写和前后的语句重排。</li>
      </ul>
      <p><strong>2. 底层原理：内存屏障</strong></p>
      <p>volatile 写之前插入 StoreStore 屏障（禁止前面写和 volatile 写重排），写之后插入 StoreLoad 屏障（禁止 volatile 写和后续读/写重排）。volatile 读后插入 LoadLoad 和 LoadStore 屏障。</p>
      <p>硬件层面：x86 用 lock 前缀指令（锁缓存行 + 触发 MESI 协议刷主内存）。</p>
      <p><strong>3. 为什么不保证原子性</strong></p>
      <p>i++ 是"读-改-写"三步，volatile 只保证每次读到最新值，但三步之间可能被其他线程打断。如两个线程同时读到 i=1，各自 +1 写回 2，丢失一次更新。要原子性用 synchronized 或 AtomicInteger（CAS）。</p>
      <p><strong>4. volatile 的典型应用</strong></p>
      <ul>
        <li><strong>状态标志位</strong>：boolean running，一个线程改一个线程读，保证可见。</li>
        <li><strong>DCL 单例</strong>：double-checked locking 的实例变量必须 volatile，防止"构造未完成就发布"（new 对象的非原子操作被重排）。</li>
        <li><strong>轻量级读写分离</strong>：一个写线程 + 多个读线程。</li>
      </ul>
      <p><strong>5. happens-before 中的 volatile 规则</strong></p>
      <p>对 volatile 变量的写 happens-before 后续对它的读。这是 JMM 给开发者的保证。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>volatile 保证可见性（内存屏障+MESI）和禁止重排序，但不保证原子性（i++ 不安全）。适用状态标志、DCL 单例。要原子性用 Atomic 或 synchronized。</p>`},
  {c:"并发",d:"★★★",q:"什么是 CAS？有什么问题？",
   a:`<p><strong>CAS（Compare And Swap）</strong>：乐观锁核心思想，无锁同步。三个操作数：内存值 V、期望值 A、新值 B。当 V==A 时才把 V 改成 B，否则重试。底层是 CPU 的 cmpxchg 指令。</p>
      <p>Java 通过 sun.misc.Unsafe 类提供，AtomicXXX 系列、AQS、ConcurrentHashMap 都用它。</p>
      <p><strong>三个问题</strong>：</p>
      <ul>
        <li><strong>ABA 问题</strong>：值从 A→B→A，CAS 检测不到。解决：版本号 AtomicStampedReference。</li>
        <li><strong>自旋开销</strong>：竞争激烈时反复重试空耗 CPU。解决：自适应自旋、退化为锁。</li>
        <li><strong>只能保证一个变量原子</strong>：多个变量要 AtomicReference 封装对象。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. CAS 原理</strong></p>
      <p>Compare And Swap：比较并交换。三个操作数——内存位置 V、期望旧值 A、新值 B。当且仅当 V==A 时，把 V 更新为 B，返回 true；否则返回 false（说明已被别人改过）。整个过程是<strong>CPU 原子指令</strong>（x86 的 cmpxchg + lock 前缀）。</p>
      <p>Java 通过 sun.misc.Unsafe（Java 9+ 是 VarHandle）提供 compareAndSwapXxx。AtomicInteger.incrementAndGet() 就是 CAS 自旋实现。</p>
      <pre><code>// AtomicInteger 的 incrementAndGet 简化
public final int incrementAndGet() {
    for (;;) {
        int current = get();
        int next = current + 1;
        if (compareAndSet(current, next))  // CAS
            return next;
    }
}</code></pre>
      <p><strong>2. CAS 的三个问题</strong></p>
      <ul>
        <li><strong>ABA 问题</strong>：值 A→B→A，CAS 认为"没变过"，实际变过。<br>影响：栈操作（A 节点出栈又入栈）可能误判。<br>解决：AtomicStampedReference（加版本号）或 AtomicMarkableReference（布尔标记）。</li>
        <li><strong>自旋开销</strong>：CAS 失败就重试（自旋），竞争激烈时大量线程空转，CPU 飙高。<br>解决：自适应自旋（JVM 根据历史成功率调整自旋次数）、限制自旋次数后退化为锁。</li>
        <li><strong>只能保证单个变量原子</strong>：多个变量的原子操作 CAS 搞不定。<br>解决：把多个变量封装成对象，用 AtomicReference CAS 整个对象引用。</li>
      </ul>
      <p><strong>3. CAS 应用</strong></p>
      <p>AtomicXXX 系列、LongAdder、AQS（state 的 CAS）、ConcurrentHashMap（空桶 CAS）、数据库乐观锁（version 字段）。</p>
      <p><strong>4. CAS vs synchronized</strong></p>
      <p>CAS 是乐观锁（假设无冲突，冲突重试），无阻塞，竞争小时性能高；synchronized 是悲观锁（直接加锁），竞争大时 CAS 自旋浪费 CPU，synchronized 更稳。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>CAS 是 Compare And Swap，CPU 原子指令实现无锁同步。三问题：ABA（版本号解决）、自旋开销（自适应自旋）、单变量（封装对象）。Java 用 Unsafe/VarHandle 提供，Atomic、AQS、ConcurrentHashMap 都基于它。</p>`},
  {c:"并发",d:"★★★",q:"AQS（AbstractQueuedSynchronizer）原理？",
   a:`<p>AQS 是并发包的核心基础框架，ReentrantLock、Semaphore、CountDownLatch、ReentrantReadWriteLock 都基于它。</p>
      <p><strong>核心设计</strong>：</p>
      <ul>
        <li>一个 <strong>volatile int state</strong> 表示同步状态（重入锁的次数 / 信号量许可数 / 计数器）。</li>
        <li>一个 <strong>FIFO 双向队列（CLH 变体）</strong> 管理等待线程的 Node 节点。</li>
        <li>两种模式：<strong>独占</strong>（ReentrantLock）和 <strong>共享</strong>（Semaphore、CountDownLatch）。</li>
      </ul>
      <p>模板方法：子类重写 tryAcquire/tryRelease 等，AQS 负责入队、阻塞、唤醒（用 LockSupport.park/unpark）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. AQS 是什么</strong></p>
      <p>AbstractQueuedSynchronizer，Doug Lea 写的同步框架。是 JUC 同步器的基础：ReentrantLock、Semaphore、CountDownLatch、ReentrantReadWriteLock、ThreadPoolExecutor 的 Worker 都基于它。</p>
      <p><strong>2. 核心组成</strong></p>
      <ul>
        <li><strong>state（volatile int）</strong>：同步状态。不同同步器语义不同：ReentrantLock 表示重入次数；Semaphore 表示剩余许可数；CountDownLatch 表示计数。</li>
        <li><strong>CLH 变体双向队列</strong>：FIFO 等待队列，管理获取锁失败后阻塞的线程。节点是 Node（封装了线程引用、等待状态、前后指针）。</li>
        <li><strong>exclusiveOwnerThread</strong>：独占模式下持有锁的线程。</li>
      </ul>
      <p><strong>3. 两种模式</strong></p>
      <ul>
        <li><strong>独占模式</strong>：同一时刻只有一个线程能获取资源（ReentrantLock）。模板方法：tryAcquire/tryRelease、acquire/release。</li>
        <li><strong>共享模式</strong>：允许多个线程同时获取（Semaphore、CountDownLatch、读写锁的读锁）。模板方法：tryAcquireShared/tryReleaseShared。</li>
      </ul>
      <p><strong>4. acquire 流程（独占）</strong></p>
      <ol>
        <li>tryAcquire（子类实现）：尝试 CAS 获取 state，成功则设置 ownerThread 返回。</li>
        <li>失败则 addWaiter 入队（CAS 加到队尾）。</li>
        <li>acquireQueued：自旋 + park。前驱是 head 时再 tryAcquire，成功出队；否则 LockSupport.park 阻塞。</li>
        <li>前驱节点释放锁时 unpark 后继节点。</li>
      </ul>
      <p><strong>5. 公平 vs 非公平</strong></p>
      <p>公平：tryAcquire 前先 hasQueuedPredecessors 检查队列有无前驱，有则排队。<br>非公平：直接 tryAcquire 抢（可能插队）。非公平吞吐量高，公平无饥饿。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>AQS 用 volatile state 表示同步状态 + CLH 双向队列管理等待线程。模板方法模式，子类重写 tryAcquire/tryRelease。分独占（ReentrantLock）和共享（Semaphore）。公平/非公平靠是否检查队列。ReentrantLock、Semaphore、CountDownLatch 都基于它。</p>`},
  {c:"并发",d:"★★",q:"什么是死锁？产生条件？如何避免？",
   a:`<p><strong>死锁</strong>：两个或多个线程互相等待对方释放资源，永远阻塞。</p>
      <p><strong>四个必要条件</strong>（Coffman）：</p>
      <ol>
        <li>互斥：资源同一时刻只能被一个线程用。</li>
        <li>占有并等待：拿着资源不放还请求新资源。</li>
        <li>不可剥夺：不能强行抢占。</li>
        <li>循环等待：形成等待环。</li>
      </ol>
      <p><strong>避免</strong>：① 统一加锁顺序；② 设置超时 tryLock；③ 死锁检测算法。</p>
      <blockquote>排查：jstack 打印线程 dump，会直接标出 "Found one Java-level deadlock"。或用 arthas、JConsole。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 死锁定义</strong></p>
      <p>两个或多个线程互相持有对方需要的资源且不释放，导致永久阻塞。如线程 A 持有锁 1 等锁 2，线程 B 持有锁 2 等锁 1。</p>
      <p><strong>2. 四个必要条件（Coffman，缺一不可）</strong></p>
      <ul>
        <li><strong>互斥</strong>：资源同一时刻只能被一个线程占用。</li>
        <li><strong>占有并等待</strong>：线程持有资源的同时等待其他资源。</li>
        <li><strong>不可剥夺</strong>：资源不能被强行抢走，只能持有者主动释放。</li>
        <li><strong>循环等待</strong>：存在线程的循环等待链。</li>
      </ul>
      <p>破坏任一条件即可避免死锁。</p>
      <p><strong>3. 避免方法</strong></p>
      <ul>
        <li><strong>统一加锁顺序（破坏循环等待）</strong>：所有线程按相同顺序获取锁（如按锁的 hash 升序）。</li>
        <li><strong>设置超时（破坏不可剥夺）</strong>：用 tryLock(timeout)，超时放弃并释放已持有的锁。</li>
        <li><strong>一次性获取所有资源（破坏占有并等待）</strong>：要么全拿到要么都不拿。</li>
        <li><strong>死锁检测 + 恢复</strong>：定期检测，发现死锁后回滚或杀线程（数据库常用）。</li>
      </ul>
      <p><strong>4. 排查工具</strong></p>
      <ul>
        <li><strong>jstack PID</strong>：打印线程堆栈，会标注 "Found one Java-level deadlock"，列出死锁线程和锁。</li>
        <li><strong>JConsole/VisualVM</strong>：图形界面看线程，直接检测死锁。</li>
        <li><strong>arthas</strong>：thread -b 找阻塞线程，thread 查死锁。</li>
      </ul>
      <p><strong>5. 经典代码示例</strong></p>
      <pre><code>// 死锁：A 持有 lock1 等 lock2，B 持有 lock2 等 lock1
new Thread(() -> { synchronized(lock1){ synchronized(lock2){...} } }).start();
new Thread(() -> { synchronized(lock2){ synchronized(lock1){...} } }).start();</code></pre>
      <p><strong>6. 面试标准答法</strong></p>
      <p>死锁是线程互相等待对方资源永久阻塞。四必要条件：互斥、占有等待、不可剥夺、循环等待。避免：统一加锁顺序、tryLock 超时、一次获取所有。排查用 jstack 看 "Found deadlock"。</p>`},
  {c:"并发",d:"★★",q:"ThreadLocal 的原理？内存泄漏问题？",
   a:`<p>ThreadLocal 让每个线程拥有<strong>变量副本</strong>，实现线程隔离。</p>
      <p><strong>结构</strong>：每个 Thread 有一个 ThreadLocalMap，key 是 ThreadLocal 的弱引用，value 是变量值。</p>
      <p><strong>内存泄漏</strong>：key 是弱引用，GC 后变 null；但 value 是强引用，Entry 不被回收，线程长期存活（如线程池）就会泄漏。</p>
      <blockquote>解决：用完务必 <code>threadLocal.remove()</code>，尤其在线程池场景。InheritableThreadLocal 可让子线程继承父线程的值。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ThreadLocal 的作用</strong></p>
      <p>提供线程局部变量，每个线程独立一份副本，实现线程隔离。典型场景：用户上下文（登录信息）、数据库连接、SimpleDateFormat（非线程安全）、事务管理。</p>
      <p><strong>2. 核心结构（注意方向）</strong></p>
      <p>关键：ThreadLocal 不存数据，<strong>每个 Thread 持有一个 ThreadLocalMap</strong>。ThreadLocalMap 的 key 是 ThreadLocal（弱引用），value 是变量值（强引用）。</p>
      <pre><code>class Thread {
    ThreadLocal.ThreadLocalMap threadLocals;  // 每个线程一个
}
class ThreadLocalMap {
    Entry[] table;  // key 是 ThreadLocal 的弱引用，value 是强引用
    static class Entry extends WeakReference&lt;ThreadLocal&gt; {
        Object value;
    }
}</code></pre>
      <p>所以 threadLocal.get() 实际是：当前线程.threadLocals.get(this ThreadLocal)。</p>
      <p><strong>3. 内存泄漏问题</strong></p>
      <p>Entry 的 key 是弱引用（ThreadLocal 被回收后变 null），但 value 是强引用。如果线程长期存活（如线程池的线程），即使 ThreadLocal 已被回收，<strong>value 仍被 Entry 强引用无法回收</strong>，导致内存泄漏。</p>
      <p><strong>4. 为什么 key 用弱引用</strong></p>
      <p>如果 key 是强引用，ThreadLocal 对象即使外部没引用了，也会被 ThreadLocalMap 持有无法回收，泄漏更严重。弱引用至少让 ThreadLocal 本身可被回收。但 value 仍可能泄漏。</p>
      <p><strong>5. 解决方案</strong></p>
      <ul>
        <li><strong>用完 remove()</strong>：threadLocal.remove() 删除 Entry，根本解决。尤其在线程池场景（线程复用）必须 remove。</li>
        <li><strong>JDK 的兜底</strong>：get/set/remove 时会顺带清理 key 为 null 的 Entry（expungeStaleEntry），但不能完全依赖。</li>
      </ul>
      <p><strong>6. InheritableThreadLocal</strong></p>
      <p>ThreadLocal 的子线程取不到父线程的值。InheritableThreadLocal 在 Thread 创建时把父线程的值复制给子线程。但线程池场景（线程复用，非新建）失效，要用 TransmittableThreadLocal（阿里开源）。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>每个 Thread 持有 ThreadLocalMap，key 是 ThreadLocal 弱引用 value 强引用。内存泄漏：ThreadLocal 被回收后 value 仍强引用，线程池场景泄漏。解决：用完 remove()。子线程继承用 InheritableThreadLocal，线程池用 TransmittableThreadLocal。</p>`},
  {c:"并发",d:"★★",q:"synchronized 的锁升级过程是怎样的？",
   a:`<p>1.6 后 synchronized 的优化，锁存储在对象头 Mark Word 中：</p>
      <ol>
        <li><strong>无锁</strong>：对象刚创建。</li>
        <li><strong>偏向锁</strong>：第一个线程访问，记录线程 ID。下次同线程直接进入（CAS 都省了）。</li>
        <li><strong>轻量级锁</strong>：出现竞争，撤销偏向，用 CAS 自旋获取。</li>
        <li><strong>重量级锁</strong>：自旋失败多次，升级为 monitor，未获取的线程进入内核态阻塞。</li>
      </ol>
      <blockquote>升级不可逆。JDK15 默认关闭偏向锁。竞争激烈直接上重量级锁，反而自旋更耗 CPU。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 锁存储位置：对象头 Mark Word</strong></p>
      <p>HotSpot 对象头的 Mark Word（64bit）记录锁状态。不同锁状态下 Mark Word 存不同信息（hash、线程 ID、锁标志位、指向 monitor 的指针等）。</p>
      <p><strong>2. 锁升级过程（1.6 引入）</strong></p>
      <ul>
        <li><strong>无锁（001）</strong>：对象刚创建，未被任何线程访问。</li>
        <li><strong>偏向锁（101）</strong>：第一个线程访问，CAS 把自己的线程 ID 写入 Mark Word。之后同一线程进入同步块<strong>无需任何同步操作</strong>（连 CAS 都省）。适合单线程反复进入的场景。</li>
        <li><strong>轻量级锁（00）</strong>：出现多线程竞争（第二个线程来），撤销偏向。线程在栈帧创建 Lock Record，CAS 把 Mark Word 复制到 Lock Record 并尝试指向它。成功则获锁；失败则自旋重试。</li>
        <li><strong>重量级锁（10）</strong>：自旋超过阈值（自适应自旋）仍失败，升级为 monitor（ObjectMonitor）。Mark Word 指向 monitor。未获取锁的线程进入 monitor 的 EntryList <strong>内核态阻塞</strong>（park）。</li>
      </ul>
      <p><strong>3. 升级不可逆</strong></p>
      <p>偏向→轻量级→重量级，只能升级不能降级。一旦升级到重量级，即使后来没竞争也不会降。</p>
      <p><strong>4. 自适应自旋</strong></p>
      <p>轻量级锁竞争时，自旋等待（不阻塞，空转循环尝试 CAS）。JVM 根据历史成功率自适应调整自旋次数：之前自旋成功过则增加次数，失败则减少甚至跳过。</p>
      <p><strong>5. JDK 15 关闭偏向锁</strong></p>
      <p>JDK 15（JEP 374）默认禁用偏向锁（-XX:-UseBiasedLocking）。原因：偏向锁维护成本高（撤销需要 safepoint），现代应用多线程竞争多，收益小。HotSpot 逐步废弃。</p>
      <p><strong>6. 为什么需要锁升级</strong></p>
      <p>不同竞争强度用不同锁：无竞争（偏向锁，几乎零开销）→ 轻度竞争（轻量级锁，CAS 自旋）→ 激烈竞争（重量级锁，阻塞）。避免一开始就用重量级锁的内核态开销。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>锁存在对象头 Mark Word。升级：无锁→偏向锁（记录线程ID，同线程免同步）→轻量级锁（CAS 自旋）→重量级锁（monitor 内核态阻塞）。升级不可逆，自适应自旋。JDK15 默认禁用偏向锁。</p>`},

  // ---------- JVM ----------
  {c:"JVM",d:"★★★",q:"JVM 的内存区域划分（运行时数据区）？",
   a:`<p>分两大类：<strong>线程私有</strong>和<strong>线程共享</strong>。</p>
      <p><strong>线程私有</strong>：</p>
      <ul>
        <li><strong>程序计数器（PC）</strong>：记录当前执行字节码地址。唯一不会 OOM 的区域。</li>
        <li><strong>虚拟机栈</strong>：每个方法对应一个栈帧（局部变量表、操作数栈、动态链接、返回地址）。StackOverflowError / OOM。</li>
        <li><strong>本地方法栈</strong>：服务 native 方法。</li>
      </ul>
      <p><strong>线程共享</strong>：</p>
      <ul>
        <li><strong>堆（Heap）</strong>：存放对象实例和数组，GC 主战场。分新生代（Eden+S0+S1）+ 老年代。</li>
        <li><strong>方法区</strong>：类信息、常量池、静态变量。JDK8 由<strong>元空间（Metaspace）</strong>实现，使用本地内存。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 运行时数据区（JVM 规范定义 5 个）</strong></p>
      <p><strong>线程私有（随线程生灭）：</strong></p>
      <ul>
        <li><strong>程序计数器 PC Register</strong>：记录当前线程执行字节码的地址（分支、循环、异常处理靠它）。线程切换后能恢复。唯一<strong>不会 OOM</strong>的区域。</li>
        <li><strong>虚拟机栈 VM Stack</strong>：每个方法调用创建一个<strong>栈帧</strong>（局部变量表存基本类型和对象引用、操作数栈、动态链接、方法出口）。方法调用即入栈，返回即出栈。栈深超限 StackOverflowError（递归太深），无法分配 OOM。</li>
        <li><strong>本地方法栈 Native Method Stack</strong>：服务于 native 方法，HotSpot 把它和虚拟机栈合二为一。</li>
      </ul>
      <p><strong>线程共享：</strong></p>
      <ul>
        <li><strong>堆 Heap</strong>：存对象实例和数组，<strong>GC 主战场</strong>。物理上不连续，逻辑上连续。分代：新生代（Eden + Survivor0 + Survivor1，比例 8:1:1）+ 老年代。OOM 时报 "Java heap space"。</li>
        <li><strong>方法区 Method Area</strong>：存类信息（类的字段/方法/构造器）、常量池、静态变量、JIT 编译后的代码。<strong>JDK 8 前用永久代实现（堆的一部分），JDK 8 改用元空间（本地内存）</strong>。</li>
      </ul>
      <p><strong>2. 直接内存（非运行时数据区）</strong></p>
      <p>NIO 的 DirectByteBuffer 用的堆外内存，不受 -Xmx 限制（受 -XX:MaxDirectMemorySize）。减少一次拷贝，但回收靠 Full GC，用多可能 OOM。</p>
      <p><strong>3. JDK 版本变迁</strong></p>
      <ul>
        <li>JDK 7：字符串常量池从永久代移到堆。</li>
        <li>JDK 8：永久代废除，改元空间（用本地内存，不易 OOM）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>5 个区域：PC（唯一不 OOM）、虚拟机栈、本地方法栈（线程私有）；堆、方法区（线程共享）。栈存栈帧，堆存对象，方法区（JDK8 元空间）存类信息常量静态变量。直接内存是 NIO 用的堆外内存。</p>`},
  {c:"JVM",d:"★★★",q:"对象创建的过程是怎样的？",
   a:`<ol>
        <li><strong>类加载检查</strong>：常量池能否定位到符号引用，类是否已加载。</li>
        <li><strong>分配内存</strong>：指针碰撞（内存规整）或空闲列表（碎片化）。TLAB 让线程在堆内分配私有缓冲，避免竞争。</li>
        <li><strong>内存初始化</strong>：分配空间清零（不含对象头）。</li>
        <li><strong>设置对象头</strong>：Mark Word（hash、GC 分代年龄、锁状态）+ 类元数据指针。数组还有长度。</li>
        <li><strong>执行 &lt;init&gt;</strong>：构造函数赋值。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 类加载检查</strong></p>
      <p>new 指令对应一个常量池的类符号引用，检查是否已加载、解析、初始化。没加载就先执行类加载。</p>
      <p><strong>2. 分配内存</strong></p>
      <p>在堆中划分出确定大小的内存。两种方式：</p>
      <ul>
        <li><strong>指针碰撞</strong>：堆内存规整（用复制/整理算法，如 Serial/ParNew），分配指针向空闲方向移动对象大小。</li>
        <li><strong>空闲列表</strong>：堆碎片化（CMS 用标记清除），JVM 维护哪些块空闲，找合适的分配。</li>
      </ul>
      <p><strong>并发安全</strong>：</p>
      <ul>
        <li><strong>CAS + 失败重试</strong>：保证分配指针原子更新。</li>
        <li><strong>TLAB（Thread Local Allocation Buffer）</strong>：每个线程在 Eden 预分配一小块私有内存，线程内分配无竞争（默认开启，-XX:+UseTLAB）。绝大多数对象在 TLAB 分配。</li>
      </ul>
      <p><strong>3. 内存空间初始化（清零）</strong></p>
      <p>分配到的空间清零（不含对象头）。这步保证了 Java 字段无需初始化也能用（默认值 0/null）。</p>
      <p><strong>4. 设置对象头</strong></p>
      <ul>
        <li><strong>Mark Word</strong>：哈希码、GC 分代年龄、锁状态位、偏向线程 ID 等。</li>
        <li><strong>类型指针</strong>：指向类元数据（确定是哪个类的实例）。</li>
        <li>数组还有<strong>数组长度</strong>（数组对象特有）。</li>
      </ul>
      <p><strong>5. 执行 &lt;init&gt;（构造函数）</strong></p>
      <p>设置对象头后，对象在 JVM 层面已创建，但还没执行程序员写的初始化。执行 &lt;init&gt;（构造方法）给字段赋值，对象才完全可用。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>类加载检查 → 分配内存（指针碰撞/空闲列表，TLAB+CAS 保证并发）→ 清零 → 设置对象头（Mark Word + 类型指针）→ 执行构造方法。</p>`},
  {c:"JVM",d:"★★★",q:"对象的访问定位有哪两种方式？",
   a:`<p>Java 程序通过栈上的 reference 操作堆中对象，有两种实现：</p>
      <ol>
        <li><strong>句柄</strong>：堆划一块句柄池，reference 指向句柄，句柄含对象实例和类型数据地址。对象移动（GC 时常见）只改句柄，reference 不变。</li>
        <li><strong>直接指针</strong>：reference 直接指向对象（HotSpot 用这种）。对象头里存类元数据指针。访问快，少一次寻址。</li>
      </ol>
      <blockquote>HotSpot 用直接指针；权衡：速度 vs GC 移动成本。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 背景</strong></p>
      <p>Java 程序通过栈帧局部变量表里的 reference 数据操作堆中对象，但 JVM 规范没规定 reference 怎么定位对象。两种主流实现：</p>
      <p><strong>2. 句柄访问</strong></p>
      <p>堆中划一块<strong>句柄池</strong>，reference 存句柄地址。句柄里含两个指针：对象实例数据地址、对象类型数据地址（方法区）。</p>
      <ul>
        <li>优点：对象被 GC 移动（复制/整理）时只改句柄里的实例指针，reference 不变 → GC 稳。</li>
        <li>缺点：多一次寻址（reference→句柄→对象），访问慢。</li>
      </ul>
      <p><strong>3. 直接指针（HotSpot 用）</strong></p>
      <p>reference 直接存对象地址。对象头里存类型数据指针（指向方法区类元数据）。</p>
      <ul>
        <li>优点：访问快（少一次寻址），Sun HotSpot 选这种追求速度。</li>
        <li>缺点：对象移动时所有 reference 都要更新，GC 复杂度高（但 GC 本来就要遍历，影响小）。</li>
      </ul>
      <p><strong>4. 权衡</strong></p>
      <p>句柄：访问慢、GC 简单；直接指针：访问快、GC 复杂。HotSpot 选直接指针（访问频繁，速度优先）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>两种：句柄（reference 指句柄池，句柄指对象和类型数据，GC 移动对象只改句柄）、直接指针（reference 直接指对象，HotSpot 用，访问快）。权衡是速度 vs GC 移动成本。</p>`},
  {c:"JVM",d:"★★★",q:"说一下 JVM 的垃圾回收机制（GC）。如何判断对象死亡？",
   a:`<p><strong>判断算法</strong>：</p>
      <ul>
        <li><strong>引用计数法</strong>：循环引用问题，JVM 不用。</li>
        <li><strong>可达性分析</strong>（HotSpot 用）：从 GC Roots 出发遍历对象图，不可达即死亡。GC Roots：栈中引用、静态变量、常量引用、JNI 引用、活动线程、同步锁持有对象等。</li>
      </ul>
      <p><strong>真正回收</strong>：第一次标记 → 若覆盖 finalize() 且未调用过 → 放入 F-Queue → Finalizer 线程执行 → 第二次标记后才回收（finalize 已不推荐使用）。</p>
      <p><strong>引用强度</strong>：强 &gt; 软（内存不足回收）&gt; 弱（下次 GC 回收）&gt; 虚（随时回收，跟踪回收时机）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 判断对象死亡的方法</strong></p>
      <ul>
        <li><strong>引用计数法</strong>：对象被引用+1，引用失效-1，为 0 死亡。简单但<strong>循环引用问题</strong>（A 引用 B、B 引用 A，都不为 0 但实际都该回收）。主流 JVM 不用。</li>
        <li><strong>可达性分析（HotSpot 用）</strong>：从 GC Roots 出发，沿引用链遍历，不可达的对象标记为死亡。</li>
      </ul>
      <p><strong>2. GC Roots（可达性分析起点）</strong></p>
      <ul>
        <li>虚拟机栈中引用的对象（方法局部变量）。</li>
        <li>方法区中类静态属性引用的对象。</li>
        <li>方法区中常量引用的对象。</li>
        <li>本地方法栈 JNI 引用。</li>
        <li>Java 虚拟机内部引用（基本类型 Class、常驻异常、类加载器）。</li>
        <li>被 synchronized 持有的对象。</li>
        <li>JMXBean、JVMTI 等。</li>
      </ul>
      <p><strong>3. 真正回收：两次标记 + finalize</strong></p>
      <ul>
        <li>第一次标记：不可达且无必要执行 finalize（未覆盖或已执行过）→ 直接回收。</li>
        <li>有 finalize 且未执行：放入 F-Queue，Finalizer 线程执行 finalize。对象可在 finalize 里"自救"（重新建立引用链）。</li>
        <li>第二次标记：finalize 执行后再次判断，仍不可达才回收。</li>
      </ul>
      <p>finalize 已废弃（不确定、慢、易死锁），生产别用。try-with-resources 或 Cleaner 替代。</p>
      <p><strong>4. 四种引用（影响回收）</strong></p>
      <ul>
        <li><strong>强引用 Strong</strong>：new，永不回收（即使 OOM）。</li>
        <li><strong>软引用 Soft</strong>：SoftReference，内存不足时回收。适合内存敏感缓存。</li>
        <li><strong>弱引用 Weak</strong>：WeakReference，下次 GC 必回收。WeakHashMap、ThreadLocal key 用它。</li>
        <li><strong>虚引用 Phantom</strong>：PhantomReference + ReferenceQueue，get 永远 null，跟踪对象回收时机（NIO 直接内存释放）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>用可达性分析（从 GC Roots 遍历）判断死亡，不用引用计数（循环引用）。GC Roots：栈引用、静态、常量、JNI、锁持有。两次标记 + finalize（已废弃）。四种引用：强不回收、软内存不足、弱下次GC、虚跟踪回收。</p>`},
  {c:"JVM",d:"★★★",q:"常见的垃圾回收算法有哪些？",
   a:`<ul>
        <li><strong>标记-清除</strong>：标记存活→清除死亡。缺点：碎片。</li>
        <li><strong>标记-复制</strong>：分两块，存活对象复制到另一块。适合新生代（存活少）。缺点：空间利用率 50%。</li>
        <li><strong>标记-整理</strong>：清除后整理到一端。适合老年代，无碎片但慢。</li>
        <li><strong>分代收集</strong>：新生代用复制（Eden:S0:S1=8:1:1），老年代用标记-清除/整理。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 标记-清除（Mark-Sweep）</strong></p>
      <p>两个阶段：① 从 GC Roots 标记所有存活对象；② 清除未标记的。<strong>缺点</strong>：① 产生内存碎片（不连续），大对象分配可能触发提前 GC；② 效率不稳定（对象多时慢）。CMS 用这个。</p>
      <p><strong>2. 标记-复制（Copying）</strong></p>
      <p>把内存分两块，每次只用一块。GC 时把存活对象复制到另一块，然后清空原块。<strong>优点</strong>：无碎片、分配快（指针碰撞）；<strong>缺点</strong>：空间利用率 50%。</p>
      <p>优化（Appel式）：新生代分 Eden + 2 个 Survivor（8:1:1），每次只浪费 10%。因为新生代 98% 对象朝生夕死，存活少，复制开销小。<strong>适合新生代</strong>。</p>
      <p><strong>3. 标记-整理（Mark-Compact）</strong></p>
      <p>标记后，让存活对象向一端移动，清理边界外内存。<strong>优点</strong>：无碎片；<strong>缺点</strong>：移动对象开销大（更新所有引用），慢。适合<strong>老年代</strong>（存活对象多，复制不划算）。</p>
      <p><strong>4. 分代收集算法（综合）</strong></p>
      <p>不同代用不同算法：</p>
      <ul>
        <li><strong>新生代</strong>（Eden+S0+S1）：复制算法。因为大部分对象很快死亡，存活少，复制高效。</li>
        <li><strong>老年代</strong>：标记-清除（CMS）或标记-整理（Serial Old、Parallel Old）。存活多，复制不划算。</li>
      </ul>
      <p><strong>5. 为什么分代</strong></p>
      <p>不同生命周期对象用不同算法，整体最优。IBM 研究：98% 对象朝生夕死，分代配合复制算法高效。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>标记-清除（碎片）、标记-复制（无碎片但费空间，新生代用，8:1:1）、标记-整理（无碎片但慢，老年代用）。分代收集综合：新生代复制，老年代清除/整理。</p>`},
  {c:"JVM",d:"★★★",q:"常见的垃圾收集器有哪些？怎么选？",
   a:`<p>按时代演进：</p>
      <ul>
        <li><strong>Serial / Serial Old</strong>：单线程，STW。客户端模式。</li>
        <li><strong>Parallel Scavenge / Parallel Old</strong>：多线程吞吐量优先。JDK8 默认。</li>
        <li><strong>CMS</strong>：老年代，低延迟。初始标记→并发标记→重新标记→并发清除。缺点：碎片（用标记清除）、浮动垃圾、Concurrent Mode Failure。</li>
        <li><strong>G1</strong>：JDK9 默认。堆分成 Region，预测停顿模型，整体标记-整理+局部复制。适合大堆低延迟。</li>
        <li><strong>ZGC / Shenandoah</strong>：超低延迟（&lt;10ms），染色指针、读屏障、并发整理。TB 级堆。</li>
      </ul>
      <blockquote>选择：吞吐量优先用 Parallel；低延迟用 G1；超大堆+极低延迟用 ZGC。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 演进与关系</strong></p>
      <ul>
        <li><strong>Serial / Serial Old</strong>：单线程 GC，STW。客户端或小堆。简单。</li>
        <li><strong>ParNew</strong>：Serial 多线程版，配合 CMS。</li>
        <li><strong>Parallel Scavenge / Parallel Old</strong>：多线程，<strong>吞吐量优先</strong>（JDK 8 默认）。可设 -XX:MaxGCPauseMillis 和 GCTimeRatio。</li>
        <li><strong>CMS（Concurrent Mark Sweep）</strong>：老年代，低停顿。四阶段：初始标记（STW）→ 并发标记 → 重新标记（STW）→ 并发清除。缺点：CPU 敏感、浮动垃圾、碎片（标记清除）、Concurrent Mode Failure（退化为 Serial Old）。JDK 9 废弃，14 移除。</li>
        <li><strong>G1（Garbage First）</strong>：JDK 9 默认。堆分 Region（Eden/Survivor/Old/Humongous），预测停顿模型（-XX:MaxGCPauseMillis）。整体标记-整理 + 局部复制，无碎片。Mixed GC 优先回收垃圾最多的 Region（Garbage First）。适合 6GB+ 大堆低延迟。</li>
        <li><strong>ZGC</strong>：JDK 11 实验，15 生产。停顿 &lt;10ms（甚至 &lt;1ms），支持 TB 级堆。核心技术：染色指针（Colored Pointer）、读屏障、并发整理。不分代（目前）。</li>
        <li><strong>Shenandoah</strong>：RedHat 主导，并发整理（Brooks Pointer），和 ZGC 类似超低延迟。</li>
      </ul>
      <p><strong>2. 关键概念</strong></p>
      <ul>
        <li><strong>吞吐量</strong>：用户时间/(用户时间+GC时间)。</li>
        <li><strong>STW（Stop-The-World）</strong>：暂停所有用户线程，GC 期间。</li>
        <li><strong>并发</strong>：GC 线程和用户线程同时跑。</li>
      </ul>
      <p><strong>3. 选择建议</strong></p>
      <ul>
        <li>JDK 8 默认 Parallel（吞吐优先）。</li>
        <li>JDK 9+ 默认 G1（平衡）。</li>
        <li>大堆（&gt;16GB）+ 极低延迟：ZGC。</li>
        <li>小堆/客户端：Serial。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Serial→Parallel（JDK8默认吞吐）→CMS（低停顿，14移除）→G1（JDK9默认，Region+预测停顿）→ZGC/Shenandoah（&lt;10ms 超低延迟）。吞吐选 Parallel，平衡选 G1，超大堆低延迟选 ZGC。</p>`},
  {c:"JVM",d:"★★★",q:"类加载的过程是怎样的？双亲委派模型？",
   a:`<p>加载→验证→准备→解析→初始化（使用、卸载）。</p>
      <ul>
        <li><strong>准备</strong>：为静态变量分配内存并赋<strong>零值</strong>（final 常量在编译期赋值）。</li>
        <li><strong>初始化</strong>：执行 &lt;clinit&gt;，即静态变量赋值和 static 块。</li>
      </ul>
      <p><strong>双亲委派</strong>：类加载请求先委派给父加载器，父加载失败才自己加载。</p>
      <p>层级：BootstrapClassLoader（rt.jar）→ ExtClassLoader/PlatformClassLoader → AppClassLoader → 自定义。</li>
      <blockquote>好处：① 防止核心类被篡改（自己写的 java.lang.String 不会被加载）；② 避免重复加载。Tomcat 打破双亲委派实现 webapp 隔离。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 类加载的 5 个阶段</strong></p>
      <ul>
        <li><strong>加载 Loading</strong>：通过全限定名获取二进制字节流（从 jar/class/网络/动态生成），转为方法区的运行时数据结构，生成 Class 对象作为访问入口。</li>
        <li><strong>验证 Verification</strong>：文件格式、元数据、字节码、符号引用验证，确保 class 安全合规。</li>
        <li><strong>准备 Preparation</strong>：为<strong>静态变量</strong>分配内存并赋<strong>零值</strong>（int 为 0）。final static 常量在此赋实际值（ConstantValue 属性）。</li>
        <li><strong>解析 Resolution</strong>：常量池符号引用替换为直接引用（方法/字段的内存地址）。可在初始化前或运行时（延迟解析）。</li>
        <li><strong>初始化 Initialization</strong>：执行 <strong>&lt;clinit&gt;</strong>（静态变量赋值 + static 块按源码顺序）。JVM 保证 &lt;clinit&gt; 线程安全（同步）。</li>
      </ul>
      <p><strong>2. 类初始化触发时机</strong></p>
      <ul>
        <li>new 实例、访问静态字段（非 final）、调用静态方法。</li>
        <li>反射 Class.forName。</li>
        <li>初始化子类时父类先初始化。</li>
        <li>主类（main 所在类）。</li>
      </ul>
      <p><strong>3. 双亲委派模型</strong></p>
      <p>类加载请求先委派父加载器，父加载失败（找不到）才自己加载。源码在 ClassLoader.loadClass。</p>
      <pre><code>protected Class&lt;?&gt; loadClass(String name) {
    Class&lt;?&gt; c = findLoadedClass(name);  // 1. 已加载？
    if (c == null) {
        c = parent.loadClass(name);  // 2. 委派父加载器
        if (c == null) c = findClass(name);  // 3. 父失败，自己找
    }
    return c;
}</code></pre>
      <p>层级：BootstrapClassLoader（C++，加载 rt.jar 核心）→ ExtClassLoader/PlatformClassLoader（扩展）→ AppClassLoader（classpath）→ 自定义。</p>
      <p><strong>4. 双亲委派的好处</strong></p>
      <ul>
        <li><strong>防止核心类被篡改</strong>：自己写的 java.lang.String 会被 Bootstrap 加载核心的，自定义的不生效。</li>
        <li><strong>避免重复加载</strong>：父加载器已加载的子加载器不再加载。</li>
      </ul>
      <p><strong>5. 打破双亲委派的场景</strong></p>
      <ul>
        <li><strong>JDBC</strong>：Bootstrap 加载 Driver 接口，但实现在 classpath，用线程上下文类加载器（TCCL）反向加载。</li>
        <li><strong>Tomcat</strong>：每个 WebAppClassLoader 优先自己加载，实现 webapp 隔离。</li>
        <li><strong>OSGi</strong>：网状加载结构。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>加载→验证→准备（静态变量赋零值）→解析→初始化（执行&lt;clinit&gt;）。双亲委派：先委派父加载器，失败才自己加载。层级 Bootstrap→Ext→App→自定义。好处：防篡改核心类、避免重复加载。JDBC/Tomcat 打破它。</p>`},
  {c:"JVM",d:"★★",q:"JVM 调优常用参数和工具？",
   a:`<p><strong>常用参数</strong>：</p>
      <ul>
        <li><code>-Xms / -Xmx</code>：堆初始/最大大小（生产建议相同，避免扩容抖动）。</li>
        <li><code>-Xmn</code>：新生代大小。</li>
        <li><code>-XX:MetaspaceSize / MaxMetaspaceSize</code>：元空间。</li>
        <li><code>-XX:+UseG1GC</code>：选用 G1。</li>
        <li><code>-XX:+PrintGCDetails -Xloggc:</code>：GC 日志。</li>
      </ul>
      <p><strong>排查工具</strong>：jps、jstat（GC 统计）、jmap（dump 堆）、jstack（线程）、arthas（在线诊断）、JProfiler/MAT（堆分析）。</p>
      <blockquote>常见问题：Full GC 频繁（老年代太小 / 内存泄漏）、CPU 高（找占 CPU 的线程 jstack）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 堆相关参数</strong></p>
      <ul>
        <li><strong>-Xms / -Xmx</strong>：堆初始/最大。生产建议相同（避免运行时扩容/收缩抖动）。如 -Xms4g -Xmx4g。</li>
        <li><strong>-Xmn</strong>：新生代大小。或 -XX:NewRatio=2（老:新=2:1）。</li>
        <li><strong>-XX:SurvivorRatio=8</strong>：Eden:Survivor=8:1:1。</li>
        <li><strong>-XX:MetaspaceSize / -XX:MaxMetaspaceSize</strong>：元空间初始/最大（本地内存）。</li>
        <li><strong>-XX:MaxDirectMemorySize</strong>：直接内存上限。</li>
      </ul>
      <p><strong>2. GC 相关</strong></p>
      <ul>
        <li><strong>-XX:+UseG1GC / UseParallelGC / UseConcMarkSweepGC</strong>：选收集器。</li>
        <li><strong>-XX:MaxGCPauseMillis=200</strong>：G1 目标停顿时间。</li>
        <li><strong>-XX:+PrintGCDetails -Xloggc:gc.log -XX:+PrintGCDateStamps</strong>：GC 日志（JDK 9+ 用 -Xlog:gc*）。</li>
        <li><strong>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heap.hprof</strong>：OOM 自动 dump。</li>
      </ul>
      <p><strong>3. JDK 自带工具</strong></p>
      <ul>
        <li><strong>jps</strong>：列 Java 进程。</li>
        <li><strong>jstat -gcutil PID 1000</strong>：每秒看各区使用率、GC 次数时间。</li>
        <li><strong>jmap -dump:format=b,file=heap.hprof PID</strong>：dump 堆；-histo 看对象统计。</li>
        <li><strong>jstack PID</strong>：线程堆栈（排查死锁、CPU 高）。</li>
        <li><strong>jinfo</strong>：看/改 JVM 参数。</li>
        <li><strong>jconsole / jvisualvm</strong>：图形化监控。</li>
      </ul>
      <p><strong>4. 第三方工具</strong></p>
      <ul>
        <li><strong>arthas</strong>：阿里开源，在线诊断神器（watch/trace/thread/dashboard）。</li>
        <li><strong>MAT（Memory Analyzer）</strong>：分析 heap dump，找内存泄漏（支配树、leak suspects）。</li>
        <li><strong>JProfiler / YourKit</strong>：商业化性能分析。</li>
        <li><strong>GCEasy</strong>：在线分析 GC 日志。</li>
      </ul>
      <p><strong>5. 常见调优场景</strong></p>
      <ul>
        <li>Full GC 频繁：老年代太小（调大 -Xmx 或 NewRatio）、内存泄漏（MAT 分析）。</li>
        <li>GC 停顿长：换 G1/ZGC，调 MaxGCPauseMillis。</li>
        <li>CPU 高：jstack 找占 CPU 线程。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>-Xms/-Xmx 设堆大小（生产相等），-Xmn 新生代，-XX:+UseG1GC 选收集器，OOM 自动 dump。工具：jps/jstat/jmap/jstack + arthas 在线诊断 + MAT 分析堆。常见调优：Full GC 频繁（老年代小/泄漏）、停顿长（换 G1）。</p>`},
  {c:"JVM",d:"★★",q:"什么情况下会发生 OOM？怎么排查？",
   a:`<p>常见 OOM 类型：</p>
      <ul>
        <li><strong>Java heap space</strong>：堆内存不足，对象太多或内存泄漏。</li>
        <li><strong>GC overhead limit</strong>：GC 花费 &gt;98% 时间但回收 &lt;2% 内存。</li>
        <li><strong>Metaspace</strong>：动态加载类太多（如 CGLIB 代理）。</li>
        <li><strong>Direct buffer memory</strong>：NIO 直接内存超限。</li>
        <li><strong>unable to create new native thread</strong>：线程数超过系统限制。</li>
      </ul>
      <p><strong>排查</strong>：-XX:+HeapDumpOnOutOfMemoryError 自动 dump → MAT 分析支配树找大对象 → 看引用链定位泄漏点。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 常见 OOM 类型</strong></p>
      <ul>
        <li><strong>java.lang.OutOfMemoryError: Java heap space</strong>：堆内存不足。原因：对象太多（大集合/大文件）、内存泄漏、堆设太小。</li>
        <li><strong>GC overhead limit exceeded</strong>：GC 花费 &gt;98% 时间但回收 &lt;2% 内存（连续 5 次）。本质是快 OOM 的预警。可 -XX:-UseGCOverheadLimit 关闭（不建议）。</li>
        <li><strong>Metaspace</strong>：元空间（本地内存）不足。原因：动态生成大量类（CGLIB、Groovy 脚本）、加载太多 jar。</li>
        <li><strong>Direct buffer memory</strong>：NIO 直接内存超限（-XX:MaxDirectMemorySize）。DirectByteBuffer 回收靠 Full GC，用太快堆积。</li>
        <li><strong>unable to create new native thread</strong>：线程数超系统限制（ulimit -u）或内存不够创建线程栈。</li>
        <li><strong>StackOverflowError</strong>：栈溢出（递归太深），严格说不算 OOM 但相关。</li>
      </ul>
      <p><strong>2. 排查步骤</strong></p>
      <ol>
        <li><strong>预防</strong>：启动加 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath，OOM 时自动 dump 堆快照。</li>
        <li><strong>拿到 dump</strong>：jmap -dump 或自动 dump 的 hprof 文件。</li>
        <li><strong>MAT 分析</strong>：
          <ul>
            <li>看 <strong>Leak Suspects</strong> 报告，直接定位嫌疑。</li>
            <li>看<strong>支配树（Dominator Tree）</strong>找占内存最大的对象。</li>
            <li>看<strong>引用链（GC Roots 到大对象的路径）</strong>，定位泄漏源头。</li>
          </ul>
        </li>
        <li><strong>jstat 实时监控</strong>：jstat -gcutil 看各区使用率，老年代持续涨不降 = 泄漏。</li>
        <li><strong>arthas</strong>：dashboard 看内存，heapdump 在线 dump。</li>
      </ol>
      <p><strong>3. 内存泄漏常见原因</strong></p>
      <ul>
        <li>静态集合不断 put 不 remove（生命周期 = JVM）。</li>
        <li>ThreadLocal 没 remove（线程池场景）。</li>
        <li>监听器/回调没注销。</li>
        <li>资源（连接/流）没关。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>OOM 类型：Java heap space（堆不足/泄漏）、GC overhead（回收不动）、Metaspace（类太多）、Direct buffer（NIO）、native thread（线程超限）。排查：-XX:+HeapDumpOnOutOfMemoryError 自动 dump → MAT 分析支配树和引用链定位泄漏。</p>`},
