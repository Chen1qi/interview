  {c:"框架",d:"★★",q:"Spring Bean 的循环依赖三级缓存，为什么要三级？",
   a:`<p>核心问题：A 依赖 B，B 依赖 A。Spring 需要<strong>提前暴露未完成初始化的半成品</strong>。</p>
      <p><strong>三级缓存的作用</strong>：</p>
      <ul>
        <li>一级 singletonObjects：完整的成品 Bean。</li>
        <li>二级 earlySingletonObjects：半成品 Bean（已实例化，未完成属性注入和初始化）。</li>
        <li>三级 singletonFactories：ObjectFactory 工厂，<strong>必要时才生成代理对象</strong>。</li>
      </ul>
      <p>为什么三级而非两级？因为如果 Bean 需要 AOP 代理，必须保证<strong>其他 Bean 注入的是代理对象而非原始对象</strong>。三级缓存延迟到真正被注入时才决定是否生成代理（调用 SmartInstantiationAwareBeanProcessor.getEarlyBeanReference），保证一致性。</p>
      <blockquote>注意：只能解决<strong>单例 setter 注入</strong>的循环依赖。构造器注入无法解决（实例都还没创建）。SpringBoot 2.6+ 默认 spring.main.allow-circular-references=false。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么三级而非两级（核心问题）</strong></p>
      <p>为了 AOP。如果只有两级，要么提前把所有 Bean 都代理了（违反按需代理），要么无法在循环依赖场景保证代理对象一致性。</p>
      <p><strong>2. 三级缓存存什么</strong></p>
      <ul>
        <li><strong>一级 singletonObjects</strong>：完整成品 Bean。</li>
        <li><strong>二级 earlySingletonObjects</strong>：提前暴露的早期引用（可能是代理）。</li>
        <li><strong>三级 singletonFactories</strong>：<strong>ObjectFactory 工厂</strong>（Lambda），不是 Bean 实例。</li>
      </ul>
      <p><strong>3. 流程</strong></p>
      <p>A 实例化后把 ObjectFactory 放三级 → 注入 B → B 注入 A 时从三级调工厂 getObject() → 触发 getEarlyBeanReference（若有 AOP 提前生成代理）→ 产生的早期引用放二级，三级移除 → 保证全局唯一代理。B 完成 → A 完成。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>三级缓存存ObjectFactory(工厂)。三级非两级为AOP：工厂延迟到被引用时才生成代理(按需)，二级缓存缓存代理保证唯一。流程：A实例化放三级→B注入A调工厂getEarlyBeanReference生成代理放二级→B完成→A完成。只解单例setter，构造器无解。</p>`},
  {c:"框架",d:"★★",q:"Spring 中的 @Autowired 和 @Resource 区别？",
   a:`<ul>
        <li><strong>来源</strong>：@Autowired 是 Spring 注解；@Resource 是 JSR-250 标准注解（javax）。</li>
        <li><strong>匹配方式</strong>：
          <ul>
            <li>@Autowired 默认按<strong>类型</strong>注入，多个同类型 Bean 时配合 @Qualifier 按名字。</li>
            <li>@Resource 默认按<strong>名字</strong>注入（name 属性），找不到再按类型。可指定 name/type。</li>
          </ul>
        </li>
        <li><strong>适用</strong>：@Autowired 可用于构造器、方法、字段、参数；@Resource 只能字段和 setter。</li>
        <li><strong>required</strong>：@Autowired 有 required=false；@Resource 没有此属性。</li>
      </ul>
      <blockquote>推荐：Spring 项目用 @Autowired + @Qualifier；跨框架通用性考虑用 @Resource。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 来源</strong>：@Autowired 是 Spring（org.springframework）特有注解；@Resource 是 JSR-250 标准（javax.annotation），Java 规范，任何符合规范的容器都支持。</p>
      <p><strong>2. 匹配方式（核心区别）</strong></p>
      <ul>
        <li><strong>@Autowired</strong>：默认<strong>按类型（byType）</strong>匹配。多个同类型 Bean 时：① 配合 @Qualifier("name") 指定；② 字段名/参数名匹配 Bean 名；③ @Primary 标注的优先；④ 都不行报错。</li>
        <li><strong>@Resource</strong>：默认<strong>按名字（byName）</strong>。① 先按 name 属性（或字段名）找；② 找不到再按 type；③ 可显式指定 name 或 type。</li>
      </ul>
      <p><strong>3. 其他区别</strong></p>
      <ul>
        <li>@Autowired 可用于构造器、方法、字段、参数；@Resource 只能字段和 setter（不能构造器）。</li>
        <li>@Autowired 有 required=false（找不到不报错）；@Resource 没有此属性（找不到必报错）。</li>
        <li>@Autowired 是 Spring 的，功能更强（支持 @Primary、@Qualifier）；@Resource 是标准，通用性好。</li>
      </ul>
      <p><strong>4. 推荐</strong>：Spring 项目用 @Autowired + @Qualifier；要和 Spring 解耦/跨框架用 @Resource。Spring Boot 4.3+ 构造器注入可省 @Autowired。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>@Autowired(Spring，按类型，多Bean用@Qualifier/@Primary，有required=false，可构造器)。@Resource(JSR-250标准，按名字优先再类型，只能字段/setter)。Spring项目用@Autowired，通用性用@Resource。</p>`},
  {c:"框架",d:"★★",q:"MyBatis 的一级缓存和二级缓存？",
   a:`<ul>
        <li><strong>一级缓存</strong>（SqlSession 级别，默认开启）：
          <ul>
            <li>同一个 SqlSession 内，相同查询走缓存。</li>
            <li>执行 update/insert/delete 或 commit/close 会清空。</li>
            <li>Spring 中每个请求通常新建 SqlSession，一级缓存基本失效。</li>
          </ul>
        </li>
        <li><strong>二级缓存</strong>（Mapper namespace 级别，需手动开启）：
          <ul>
            <li>跨 SqlSession 共享。</li>
            <li>实体必须实现 Serializable。</li>
            <li>粒度粗，更新一个表整个 namespace 缓存失效。</li>
          </ul>
        </li>
      </ul>
      <blockquote>生产中通常不用 MyBatis 二级缓存，而是用 Redis 做应用层缓存，更灵活可控。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 一级缓存（SqlSession 级别，默认开启）</strong></p>
      <ul>
        <li>作用域：同一个 SqlSession 内。key = statementId + 参数 + 分页。</li>
        <li>相同查询直接返回缓存结果（不走 DB）。</li>
        <li>失效：执行 insert/update/delete（任何修改操作）、commit/close、clearCache 会清空整个一级缓存。</li>
        <li><strong>Spring 集成下基本失效</strong>：Spring 每次 Mapper 方法调用通常创建新 SqlSession（方法级），所以一级缓存几乎用不上。除非同一事务内多次查询同一数据（同 SqlSession）。</li>
      </ul>
      <p><strong>2. 二级缓存（Mapper namespace 级别，需手动开启）</strong></p>
      <ul>
        <li>作用域：跨 SqlSession，整个 namespace（Mapper）共享。</li>
        <li>开启：实体实现 Serializable + Mapper 加 @CacheNamespace 或 XML 加 &lt;cache/&gt;。</li>
        <li>存储：默认 PerpetualCache（内存），可配 Ehcache、Redis 等。</li>
        <li><strong>粒度粗</strong>：namespace 内任何 insert/update/delete 会清空整个 namespace 缓存（不是单条）。</li>
        <li>脏读风险：多表 join 查询时，关联表更新不会清缓存（除非 &lt;cache-ref&gt;）。</li>
      </ul>
      <p><strong>3. 为什么生产少用二级缓存</strong></p>
      <ul>
        <li>粒度粗（整个 namespace 失效），命中率低。</li>
        <li>分布式下各实例缓存独立（不一致），除非用 Redis。</li>
        <li>更灵活可控的是<strong>应用层 Redis 缓存</strong>（手动控制 key、过期、粒度）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>一级缓存(SqlSession级默认开启，Spring下基本失效因每次新建SqlSession)。二级缓存(namespace级需手动开启，跨SqlSession，实体Serializable，粒度粗更新清空整个namespace)。生产多用Redis应用层缓存替代。</p>`},
  {c:"框架",d:"★★",q:"Dubbo 的工作流程？服务调用原理？",
   a:`<p><strong>角色</strong>：Provider（提供者）、Consumer（消费者）、Registry（注册中心，Zookeeper/Nacos）、Monitor（监控）。</p>
      <p><strong>流程</strong>：</p>
      <ol>
        <li>Provider 启动时把自己的服务地址注册到 Registry。</li>
        <li>Consumer 启动时从 Registry 订阅服务，Registry 推送地址列表（Consumer 本地缓存）。</li>
        <li>Consumer 调用时根据负载均衡选一个 Provider，<strong>直接发起 RPC</strong>（默认 Netty + Dubbo 协议），不经过注册中心。</li>
        <li>Provider 处理后返回结果。</li>
        <li>Provider/Consumer 定时向 Monitor 上报调用统计。</li>
      </ol>
      <p><strong>特性</strong>：NIO 异步、长连接、序列化（默认 Hessian2）、负载均衡（Random/RoundRobin/LeastActive/ConsistentHash）、集群容错（Failover/Failfast/Failsafe/Forking）。</p>
      <blockquote>Dubbo 是 RPC，比 HTTP（Feign）性能高、更适合内部服务调用。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 四个角色</strong></p>
      <ul>
        <li><strong>Provider（提供者）</strong>：暴露服务的应用，注册到注册中心。</li>
        <li><strong>Consumer（消费者）</strong>：调用服务的应用，从注册中心订阅。</li>
        <li><strong>Registry（注册中心）</strong>：ZooKeeper / Nacos。存服务地址列表，推送变更。</li>
        <li><strong>Monitor（监控中心）</strong>：统计调用次数、耗时（可选）。</li>
      </ul>
      <p><strong>2. 工作流程</strong></p>
      <ol>
        <li>Provider 启动 → 把服务接口、地址（IP:port）注册到 Registry。</li>
        <li>Consumer 启动 → 从 Registry 订阅所需服务，Registry 推送 Provider 地址列表。Consumer <strong>缓存到本地</strong>。</li>
        <li>Consumer 调用时：<strong>基于本地缓存的地址列表</strong>，负载均衡选一个 Provider，<strong>直接发起 RPC</strong>（Netty 长连接 + Dubbo 协议），不经过 Registry。</li>
        <li>Provider 接收请求，反序列化，反射调真实方法，返回结果。</li>
        <li>Provider/Consumer 定时向 Monitor 上报调用统计。</li>
      </ul>
      <p>关键：Registry 只在地址变更时通知，调用是<strong>点对点直连</strong>（不经过注册中心，性能高）。</p>
      <p><strong>3. 服务调用原理（Consumer 侧）</strong></p>
      <p>Consumer 调 interface.method() → 实际调<strong>动态代理（Invoker 代理）</strong> → 集群容错（Cluster）→ 负载均衡（LoadBalance）选 Provider → 协议（Protocol，默认 dubbo）→ 序列化参数 → Netty 发送 → Provider 处理返回 → 反序列化结果。</p>
      <p><strong>4. 核心特性</strong></p>
      <ul>
        <li><strong>序列化</strong>：默认 Hessian2（二进制，快，跨语言）。也支持 Kryo、Protobuf、JSON。</li>
        <li><strong>通信</strong>：Netty（NIO）长连接，多路复用。Dubbo 协议（头部 + body）。</li>
        <li><strong>负载均衡</strong>：Random（默认）、RoundRobin、LeastActive、ConsistentHash、ShortestResponse。客户端负载均衡。</li>
        <li><strong>集群容错</strong>：Failover（失败重试，默认）、Failfast（快速失败）、Failsafe（忽略异常）、Forking（并行调用多个）、Broadcast（广播）。</li>
        <li><strong>SPI 扩展</strong>：所有组件（协议、序列化、负载均衡等）都是 SPI 扩展点，可灵活替换。</li>
      </ul>
      <p><strong>5. vs Spring Cloud（HTTP/Feign）</strong></p>
      <p>Dubbo：自定义协议 + 二进制序列化 + 长连接，<strong>性能高</strong>（约 HTTP 的 2-10 倍），适合<strong>内部服务</strong>调用。Feign：标准 HTTP + JSON，通用、跨语言友好，但性能略低。Dubbo 3.x 支持 Triple（基于 HTTP/2 + Protobuf，兼容 gRPC）。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>四角色：Provider/Consumer/Registry/Monitor。流程：Provider注册→Consumer订阅缓存地址→调用时直连Provider(RPC不经Registry)→Monitor统计。调用：代理→集群容错→负载均衡→序列化→Netty发送。特性：Hessian序列化、Netty长连接、客户端负载均衡、Failover容错、SPI扩展。比HTTP性能高。</p>`},

  // ============ 基础补充 ============
  {c:"基础",d:"★★",q:"面向对象的三大特性是什么？",
   a:`<ul>
        <li><strong>封装</strong>：把属性和方法装到类里，private 隐藏内部细节，对外提供 public 方法访问。好处是安全和好维护。</li>
        <li><strong>继承</strong>：子类继承父类，复用父类的属性和方法。Java 是单继承。</li>
        <li><strong>多态</strong>：同一个方法调用，因为对象不同而表现不同。靠"父类引用指向子类对象"+ 方法重写实现。</li>
      </ul>
      <blockquote>多态的三个前提：继承、重写、父类引用指向子类对象（<code>Animal a = new Dog();</code>）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 封装（Encapsulation）</strong></p>
      <p>把对象的属性私有化（private），对外提供 public 的 getter/setter 访问。好处：隐藏实现细节、数据可控（在 setter 里校验）、降低耦合。JavaBean 就是封装的典型体现。</p>
      <p><strong>2. 继承（Inheritance）</strong></p>
      <p>子类用 extends 继承父类，获得父类的非 private 属性和方法，实现代码复用。Java 是<strong>单继承</strong>（一个类只能 extends 一个父类），但可以多层继承（A→B→C），接口可多实现。子类不能继承父类的构造方法、private 成员。</p>
      <p><strong>3. 多态（Polymorphism）</strong></p>
      <p>同一操作作用于不同对象产生不同行为。三个必要条件：<strong>继承、方法重写、父类引用指向子类对象</strong>（向上转型 <code>Animal a = new Dog();</code>）。</p>
      <p><strong>多态的实现原理（动态绑定）</strong>：编译时看左边（父类类型），运行时看右边（实际对象）。JVM 通过对象的<strong>虚方法表（vtable）</strong>在运行时确定调用哪个实现。调用实例方法时，JVM 根据对象实际类型查 vtable 找到正确的方法。</p>
      <p><strong>4. 多态的体现</strong>：方法重写（运行时多态）、方法重载（编译时多态）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>封装隐藏细节、继承复用代码、多态（基于动态绑定）实现"同一调用不同表现"。多态三前提：继承、重写、向上转型。</p>`},
  {c:"基础",d:"★★",q:"重载（Overload）和重写（Override）的区别？",
   a:`<p><strong>重载</strong>：发生在<strong>同一个类</strong>里，方法名相同但<strong>参数列表不同</strong>（个数、类型、顺序），跟返回值无关。是编译时的多态。</p>
      <p><strong>重写</strong>：发生在<strong>父子类</strong>之间，子类重新定义父类的方法，方法名、参数列表必须完全一样，返回值和异常要小于等于父类。是运行时的多态。</p>
      <blockquote>口诀：重载是"同名不同参"，重写是"子改父的方法"。private、static、final 方法不能被重写。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 重载（Overload）规则</strong></p>
      <ul>
        <li>方法名必须相同。</li>
        <li>参数列表必须不同（个数、类型、顺序至少一项不同）。</li>
        <li>返回类型、访问修饰符、抛出异常可以相同也可以不同（<strong>不能仅靠返回值区分重载</strong>）。</li>
        <li>发生在<strong>同一个类</strong>或父子类之间。</li>
        <li>是<strong>静态分派</strong>，编译期确定调哪个（编译时多态）。</li>
      </ul>
      <p><strong>2. 重写（Override）规则（两同两小一大）</strong></p>
      <ul>
        <li><strong>两同</strong>：方法名相同、参数列表相同。</li>
        <li><strong>两小</strong>：子类返回值类型 ≤ 父类（协变返回）、子类抛出异常 ≤ 父类。</li>
        <li><strong>一大</strong>：子类访问修饰符 ≥ 父类（不能比父类更严格）。</li>
      </ul>
      <p><strong>3. 不能被重写的方法</strong></p>
      <ul>
        <li><strong>private</strong>：子类访问不到，谈不上重写。</li>
        <li><strong>static</strong>：属于类，子类的同名方法只是隐藏（hide）不是重写。</li>
        <li><strong>final</strong>：明确禁止重写。</li>
      </ul>
      <p><strong>4. @Override 注解的作用</strong></p>
      <p>让编译器帮你检查是不是真的重写了父类方法（方法签名对不对），避免手滑写成重载。建议重写时都加上。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>重载是同类内同名不同参（编译时多态），重写是子类重定义父类方法（运行时多态，遵循两同两小一大）。private/static/final 方法不能重写。</p>`},
  {c:"基础",d:"★★★",q:"static 关键字有什么作用？",
   a:`<p>static 表示"静态"，修饰的东西<strong>属于类而不是对象</strong>，在类加载时就存在了，不用 new 对象也能用。</p>
      <ul>
        <li><strong>修饰变量</strong>（静态变量/类变量）：所有对象共享一份。</li>
        <li><strong>修饰方法</strong>（静态方法）：可以直接用类名调用，但<strong>只能访问静态成员，不能用 this/super</strong>。</li>
        <li><strong>修饰代码块</strong>（静态代码块）：类加载时执行一次，常用于初始化静态资源。</li>
      </ul>
      <blockquote>执行顺序：父类静态代码块 → 子类静态代码块 → 父类构造代码块 → 父类构造方法 → 子类构造代码块 → 子类构造方法。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. static 的四种用法</strong></p>
      <ul>
        <li><strong>静态变量</strong>（类变量）：被类的所有实例共享，在方法区/元空间存类信息，JDK 8 后存在堆。类加载时分配，默认初始化。</li>
        <li><strong>静态方法</strong>：属于类，用类名直接调用。只能访问静态成员，不能用 this/super（因为不依赖对象）。</li>
        <li><strong>静态代码块</strong>：类加载时执行一次，常用于初始化静态资源（如加载配置、注册驱动）。一个类可有多个，按顺序执行。</li>
        <li><strong>静态内部类</strong>：不依赖外部实例，最常用（如 HashMap.Node）。</li>
      </ul>
      <p><strong>2. 类加载和初始化时机</strong></p>
      <p>static 修饰的成员在<strong>类加载的初始化阶段</strong>执行（执行 &lt;clinit&gt;，即静态变量赋值 + 静态代码块）。触发类初始化的情况：new 实例、访问静态字段/方法、反射 Class.forName、子类初始化触发父类初始化。</p>
      <p><strong>3. 完整初始化顺序（高频考点）</strong></p>
      <p>父类静态变量+静态块 → 子类静态变量+静态块 → 父类普通成员变量+构造块 → 父类构造方法 → 子类普通成员变量+构造块 → 子类构造方法。</p>
      <p><strong>4. static 为什么不能用 this</strong></p>
      <p>this 指向当前对象，而 static 在对象创建前（类加载时）就存在了，此时还没有 this。同理 super 也不行。</p>
      <p><strong>5. 静态方法能被重写吗</strong></p>
      <p>不能。静态方法是类级别的，子类定义同名静态方法叫<strong>隐藏（hide）</strong>不是重写，调用时看引用类型（编译时绑定），不满足多态。</p>`},
  {c:"基础",d:"★★",q:"this 和 super 的区别？",
   a:`<p><strong>this</strong> 指向<strong>当前对象</strong>本身；<strong>super</strong> 指向<strong>当前对象的父类部分</strong>。</p>
      <ul>
        <li>this() 调本类其他构造方法，super() 调父类构造方法。</li>
        <li>this. 访问本类成员，super. 访问父类成员（常用于子类重写后还想调父类方法）。</li>
      </ul>
      <blockquote>注意：this() 和 super() <strong>都必须在构造方法的第一行</strong>，所以两者不能同时出现。子类构造方法如果不写 super()，编译器会默认帮你加一个无参的 super()。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. this 的三种用法</strong></p>
      <ul>
        <li><strong>this.属性</strong>：区分成员变量和局部变量（参数名相同时必须用 this，否则赋值给自己）。</li>
        <li><strong>this.方法()</strong>：调本类其他方法（一般可省略）。</li>
        <li><strong>this(参数)</strong>：调本类其他构造方法，必须在构造方法第一行。</li>
      </ul>
      <p><strong>2. super 的三种用法</strong></p>
      <ul>
        <li><strong>super.属性</strong>：访问父类被隐藏的属性。</li>
        <li><strong>super.方法()</strong>：调用父类被重写的方法。</li>
        <li><strong>super(参数)</strong>：调用父类构造方法，必须在子类构造方法第一行。</li>
      </ul>
      <p><strong>3. 为什么 this()/super() 必须在第一行</strong></p>
      <p>对象的初始化必须按顺序：先初始化父类部分（super），再初始化子类部分。如果允许在其他位置，可能导致子类代码在父类初始化前就使用了父类成员，引发错误。</p>
      <p><strong>4. 子类构造方法默认 super()</strong></p>
      <p>子类构造方法如果不显式写 this()/super()，编译器默认插入一个无参 super()。<strong>如果父类没有无参构造方法，子类必须显式调用 super(参数)</strong>，否则编译报错。这也是为什么建议父类保留无参构造。</p>
      <p><strong>5. this 和 super 不能共存</strong></p>
      <p>构造方法里 this() 和 super() 都必须在第一行，所以不能同时出现。用了 this() 调别的构造方法，那个构造方法里会有 super()。</p>`},
  {c:"基础",d:"★★",q:"Java 的基本数据类型有哪些？各占多少字节？",
   a:`<p>8 种基本数据类型：</p>
      <ul>
        <li><strong>整型</strong>：byte(1字节)、short(2)、int(4)、long(8)</li>
        <li><strong>浮点型</strong>：float(4)、double(8)</li>
        <li><strong>字符型</strong>：char(2)</li>
        <li><strong>布尔型</strong>：boolean（理论上1位，JVM 中一般当1字节处理）</li>
      </ul>
      <blockquote>对应的包装类：Byte、Short、Integer、Long、Float、Double、Character、Boolean。基本类型默认值是 0/false，包装类默认是 null。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 八大基本类型及取值范围</strong></p>
      <ul>
        <li><strong>byte</strong>：1 字节，-128~127。</li>
        <li><strong>short</strong>：2 字节，-32768~32767。</li>
        <li><strong>int</strong>：4 字节，-2^31~2^31-1（约 ±21 亿）。整数字面量默认 int。</li>
        <li><strong>long</strong>：8 字节，字面量要加 L 后缀。</li>
        <li><strong>float</strong>：4 字节，单精度，字面量加 F 后缀。</li>
        <li><strong>double</strong>：8 字节，双精度，浮点字面量默认 double。</li>
        <li><strong>char</strong>：2 字节，无符号 0~65535，存 Unicode（能存中文）。</li>
        <li><strong>boolean</strong>：理论上 1 位，JVM 实现中通常按 1 字节处理（或编译后用 int 表示）。</li>
      </ul>
      <p><strong>2. 自动类型转换（隐式）</strong></p>
      <p>小容量 → 大容量自动转换：byte→short→int→long→float→double，char→int。注意 long(8字节) 能转 float(4字节) 是因为 float 表数范围更大（指数位）。</p>
      <p><strong>3. 强制类型转换（显式）</strong></p>
      <p>大→小需要强转 <code>(int)</code>，可能丢失精度或溢出。如 <code>(byte) 128 = -128</code>（溢出）。</p>
      <p><strong>4. 浮点数精度问题（高频考点）</strong></p>
      <p>float/double 用二进制无法精确表示某些十进制小数（如 0.1），<code>0.1+0.2 != 0.3</code>。金额计算必须用 <strong>BigDecimal</strong>（用 String 构造，别用 double 构造）。</p>`},
  {c:"基础",d:"★★",q:"基本类型和包装类型有什么区别？什么时候用包装类？",
   a:`<ul>
        <li><strong>存储位置</strong>：基本类型存栈（局部变量）或堆（成员变量）；包装类型是对象，存堆。</li>
        <li><strong>默认值</strong>：基本类型是 0/false，包装类型是 null。</li>
        <li><strong>泛型</strong>：泛型只能用包装类，不能用基本类型（List&lt;Integer&gt; 不能写 List&lt;int&gt;）。</li>
      </ul>
      <p><strong>什么时候用包装类</strong>：POJO 实体类（数据库字段可能为 null）、集合泛型、方法返回值可能为空时。局部变量优先用基本类型（省内存）。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心区别对比</strong></p>
      <ul>
        <li><strong>本质</strong>：基本类型是值，包装类型是对象（引用）。</li>
        <li><strong>存储</strong>：基本类型局部变量存栈、成员变量随对象存堆；包装类型对象存堆，引用存栈。</li>
        <li><strong>默认值</strong>：基本类型 0/0.0/false；包装类型 null（这是关键区别，数据库 null 字段用包装类才能对应）。</li>
        <li><strong>泛型</strong>：泛型只能用包装类（类型擦除为 Object，基本类型不行）。</li>
        <li><strong>比较</strong>：基本类型用 ==，包装类型应该用 equals（缓存机制坑）。</li>
      </ul>
      <p><strong>2. 自动装箱拆箱</strong></p>
      <p>基本 ↔ 包装 自动转换（编译期调 valueOf/xxxValue），有缓存机制（IntegerCache -128~127）和 NPE 风险。</p>
      <p><strong>3. 什么时候用包装类</strong></p>
      <ul>
        <li><strong>POJO/实体类</strong>：数据库字段可能为 null，用包装类才能表示 null（int 默认 0 会掩盖问题）。阿里规范强制 POJO 用包装类。</li>
        <li><strong>集合泛型</strong>：List&lt;Integer&gt;。</li>
        <li><strong>方法返回值</strong>：可能为空时用包装类，调用方能判断 null。</li>
        <li><strong>RPC 参数</strong>：远程调用用包装类，区分"未传"和"传了 0"。</li>
      </ul>
      <p><strong>4. 什么时候用基本类型</strong></p>
      <p>局部变量、循环计数、高频计算场景——省内存、避免装箱开销、无 NPE 风险。</p>
      <p><strong>5. 阿里规约</strong></p>
      <p>POJO 类必须用包装类（区分默认值和 null）；局部变量用基本类型。</p>`},
  {c:"基础",d:"★★★",q:"String 为什么设计成不可变的？有什么好处？",
   a:`<p>String 不可变指的是：一旦创建，里面的字符序列就不能改了。源码上 String 类是 final 的，里面的 value 数组也是 final 的。</p>
      <p>好处：</p>
      <ul>
        <li><strong>线程安全</strong>：不可变对象天然线程安全，可自由共享。</li>
        <li><strong>可缓存 hashCode</strong>：算一次就行，做 HashMap 的 key 特别合适。</li>
        <li><strong>字符串常量池</strong>：可以复用相同字符串，省内存。</li>
        <li><strong>安全</strong>：防止被恶意篡改，比如数据库 URL、类加载器用的字符串。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 不可变的实现原理（双重保证）</strong></p>
      <ul>
        <li><code>public final class String</code>：类是 final 的，不能被继承，防止子类破坏不可变性。</li>
        <li><code>private final byte[] value</code>（JDK 9+）/ <code>private final char[] value</code>（JDK 8）：存储字符的数组是 final 且 private，没有暴露修改方法。所有"修改"操作（substring/concat/replace）都是返回新 String 对象。</li>
      </ul>
      <p>JDK 9（JEP 254 Compact Strings）：value 从 char[] 改为 byte[] + byte coder（LATIN1/UTF16），纯 ASCII 字符串省一半内存，<code>-XX:+CompactStrings</code> 默认开启。</p>
      <p><strong>2. 不可变的好处</strong></p>
      <ul>
        <li><strong>线程安全</strong>：不可变对象天然线程安全，多线程可自由共享，无需同步。</li>
        <li><strong>缓存 hashCode</strong>：String 重写的 hashCode 会缓存（hash 字段），不可变保证算一次就行，做 HashMap 的 key 高效。</li>
        <li><strong>字符串常量池复用</strong>：相同内容的字符串可共享同一实例，节省内存。</li>
        <li><strong>安全性</strong>：类加载器、数据库 URL、网络连接参数用 String，防止被恶意篡改（如果是可变的，攻击者改了 String 内容会引发安全问题）。</li>
      </ul>
      <p><strong>3. 反射能破坏 String 不可变吗</strong></p>
      <p>理论上用反射获取 String 的 value 字段并 setAccessible(true) 后能修改，但这属于<strong>不规范操作</strong>，会导致不可预期的问题（缓存、常量池共享受影响），实际中绝不这么做。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>String 不可变靠 final class + final byte[] value 双重保证。好处是线程安全、可缓存 hashCode、支持常量池复用、安全性高。</p>`},
  {c:"基础",d:"★★★",q:"String s = new String(\"abc\") 创建了几个对象？",
   a:`<p>答案是<strong>1 个或 2 个</strong>：</p>
      <ul>
        <li>如果字符串常量池里已经有 "abc"，只在堆里 new 了一个对象 → <strong>1 个</strong>。</li>
        <li>如果常量池里没有 "abc"，先在常量池创建 "abc"，再在堆里 new 一个 → <strong>2 个</strong>。</li>
      </ul>
      <blockquote>注意：JDK 7 以后字符串常量池从永久代移到了堆里。建议面试时答"最多2个，看常量池有没有"，并补充说明常量池位置的变化。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 字面量 "abc" 的来源</strong></p>
      <p>字符串字面量在类编译时就写入 class 文件的常量池，类加载时进入<strong>字符串常量池</strong>。所以 <code>"abc"</code> 这个字面量在代码中出现，类加载时可能已经创建。</p>
      <p><strong>2. new String("abc") 的过程</strong></p>
      <ul>
        <li>先看字符串常量池有没有 "abc"：没有则创建一个常量池对象。</li>
        <li>然后在<strong>堆</strong>中 new 一个 String 对象，value 指向常量池的 char[]/byte[]。</li>
      </ul>
      <p>所以答案：<strong>常量池已有 "abc" 则 1 个（只堆 new），没有则 2 个（常量池 + 堆）</strong>。如果考虑类加载阶段字面量已入池，那运行时只剩 1 个堆对象。</p>
      <p><strong>3. 字符串常量池位置变迁</strong></p>
      <ul>
        <li><strong>JDK 6 及之前</strong>：字符串常量池在<strong>永久代（PermGen）</strong>。</li>
        <li><strong>JDK 7 开始</strong>：移到<strong>Java 堆</strong>中。原因是永久代大小固定易 OOM，移到堆可动态扩展，intern 也不易出问题。</li>
      </ul>
      <p><strong>4. 经典面试题验证</strong></p>
      <pre><code>String s1 = new String("a");  // 堆 + 常量池
String s2 = "a";
System.out.println(s1 == s2);  // false，s1是堆对象，s2是常量池
System.out.println(s1.intern() == s2);  // JDK7+ true，intern返回常量池引用</code></pre>
      <p><strong>5. 面试标准答法</strong></p>
      <p>最多创建 2 个：堆中的 String 对象 + 常量池的字面量（如果常量池已有则 1 个）。JDK 7 后常量池在堆不在永久代。</p>`},
  {c:"基础",d:"★★",q:"String.intern() 方法的作用？JDK 6 和 7+ 有什么区别？",
   a:`<p>intern() 的作用：如果常量池里有这个字符串，就返回常量池里的引用；如果没有，就把它放进去再返回引用。</p>
      <p>目的是让相同内容的字符串复用同一个引用，节省内存。</p>
      <blockquote>JDK 版本区别：JDK 6 intern 时如果常量池没有，会<strong>复制一份</strong>字符串到永久代；JDK 7 以后改成只存<strong>堆对象的引用</strong>，不复制了。这导致某些 intern 的判断结果在 6 和 7+ 上不一样。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. intern() 源码语义</strong></p>
      <p>native 方法，文档说明：返回字符串的规范表示。如果常量池已包含 equals 此 String 的字符串，返回常量池中的引用；否则将此 String 添加到常量池并返回其引用。</p>
      <p><strong>2. JDK 6 vs JDK 7+ 的关键区别</strong></p>
      <ul>
        <li><strong>JDK 6</strong>：常量池在永久代。intern 时若不存在，会<strong>复制一份</strong>字符串对象到永久代。所以堆对象和 intern 结果是两个对象。</li>
        <li><strong>JDK 7+</strong>：常量池在堆。intern 时若不存在，<strong>只存堆对象的引用</strong>（不复制）。所以 intern 结果可能就是原堆对象。</li>
      </ul>
      <p><strong>3. 经典面试题（结果在 6 和 7+ 不同）</strong></p>
      <pre><code>String s1 = new String("a");
s1.intern();
String s2 = "a";
System.out.println(s1 == s2);
// JDK 6: false（intern复制到永久代，s1是堆对象）
// JDK 7+: true（intern存的是s1的引用，s2也指向它）</code></pre>
      <p><strong>4. intern 的使用场景</strong></p>
      <ul>
        <li>大量重复字符串的场景（如日志、状态码），intern 后复用节省内存。</li>
        <li>但慎用：JDK 6 下常量池在永久代，intern 太多会 OOM。JDK 7+ 在堆但也要注意 GC。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>intern 返回常量池中的字符串引用，目的是复用。JDK 6 intern 会复制对象到永久代，JDK 7+ 只存引用不复制，导致相同代码在两版本下 == 结果可能不同。</p>`},
  {c:"基础",d:"★★",q:"什么是序列化和反序列化？",
   a:`<p><strong>序列化</strong>：把 Java 对象转成字节序列（可以存到文件、通过网络传输）。反序列化就是反过来，把字节序列还原成对象。</p>
      <p>用法：实现 <code>Serializable</code> 接口（标记接口，没有方法），然后用 ObjectOutputStream/ObjectInputStream 读写。</p>
      <ul>
        <li><strong>transient</strong> 关键字：标记的字段不参与序列化（比如密码、临时数据）。</li>
        <li><strong>serialVersionUID</strong>：版本号，反序列化时会比对，不一致就报错。建议显式指定，避免自动生成导致兼容问题。</li>
      </ul>
      <blockquote>实际开发中 Java 原生序列化很少用（效率低、跨语言差），多用 JSON（Jackson/Fastjson）或 Protobuf。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 序列化的本质</strong></p>
      <p>把对象的状态（字段值）转成可存储/可传输的格式（字节流、JSON 等），需要时再还原成对象。用于持久化（存文件/数据库）、网络传输（RPC、缓存）。</p>
      <p><strong>2. Java 原生序列化用法</strong></p>
      <ul>
        <li>类实现 <code>java.io.Serializable</code> 标记接口（无方法，只是声明可序列化）。</li>
        <li>用 <code>ObjectOutputStream.writeObject(obj)</code> 序列化。</li>
        <li>用 <code>ObjectInputStream.readObject()</code> 反序列化。</li>
        <li>不实现 Serializable 会抛 NotSerializableException。</li>
      </ul>
      <p><strong>3. 关键字段</strong></p>
      <ul>
        <li><strong>transient</strong>：标记的字段不参与序列化（如密码、临时计算字段）。反序列化时是默认值（null/0）。</li>
        <li><strong>static</strong>：静态字段不参与序列化（属于类不属于对象）。</li>
        <li><strong>serialVersionUID</strong>：序列化版本号。反序列化时比对字节流中的 UID 和当前类的 UID，不一致抛 InvalidClassException。建议显式指定，否则编译器根据类结构自动生成（类改动后变化，导致反序列化失败）。</li>
      </ul>
      <p><strong>4. Java 原生序列化的缺点</strong></p>
      <ul>
        <li>无法跨语言（只有 Java 能读）。</li>
        <li>序列化后体积大（带类信息）。</li>
        <li>性能一般，有安全问题（反序列化漏洞）。</li>
      </ul>
      <p><strong>5. 实际开发用啥</strong></p>
      <p>跨语言、通用：JSON（Jackson、Fastjson、Gson）。高性能 RPC：Protobuf、Hessian、Kryo。Redis 缓存：JSON 或 Protobuf。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>序列化是对象↔字节流转换，用于持久化和传输。Java 用 Serializable 接口，transient 排除字段，serialVersionUID 保证版本兼容。实际多用 JSON/Protobuf 替代原生序列化。</p>`},
  {c:"基础",d:"★★",q:"Lambda 表达式是什么？和匿名内部类有什么区别？",
   a:`<p>Lambda 是 Java 8 引入的，本质是一段<strong>可以传递的代码</strong>（函数式编程），常用来简化代码，尤其是替代繁琐的匿名内部类。</p>
      <p>语法：<code>(参数) -> {方法体}</code></p>
      <p><strong>和匿名内部类的区别</strong>：</p>
      <ul>
        <li>Lambda 只能用于<strong>函数式接口</strong>（只有一个抽象方法的接口），匿名内部类可用于任何接口或类。</li>
        <li>Lambda 里的 this 指向外部类，匿名内部类的 this 指向自己。</li>
        <li>Lambda 编译后不生成额外的 .class 文件（用 invokedynamic），匿名内部类会生成。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Lambda 语法</strong></p>
      <p><code>(参数列表) -> {方法体}</code>。简化规则：单参数可省括号、单语句可省花括号和 return、可省参数类型（类型推断）。</p>
      <p><strong>2. Lambda 本质（invokedynamic）</strong></p>
      <p>Lambda 不是匿名内部类的语法糖。编译后<strong>不生成额外的内部类 .class 文件</strong>，而是在运行时通过 <code>invokedynamic</code> 指令 + LambdaMetafactory 动态生成实现。性能更好、启动更快。</p>
      <p><strong>3. 和匿名内部类的核心区别</strong></p>
      <ul>
        <li><strong>使用范围</strong>：Lambda 只能实现函数式接口（一个抽象方法）；匿名内部类可实现任意接口（多个方法）或继承类。</li>
        <li><strong>this 指向</strong>：Lambda 的 this 指向<strong>外部类实例</strong>（词法作用域）；匿名内部类的 this 指向匿名类实例自己。</li>
        <li><strong>编译产物</strong>：Lambda 不生成 .class，匿名内部类生成 ClassName$N.class。</li>
        <li><strong>状态</strong>：Lambda 不能定义自己的实例变量（只能引用外部 final 变量）；匿名内部类可以有自己的字段。</li>
      </ul>
      <p><strong>4. 闭包与 effectively final</strong></p>
      <p>Lambda 引用的外部局部变量必须是 final 或 effectively final（事实 final，只赋值一次）。原理和匿名内部类一样：捕获的是变量值副本。</p>
      <p><strong>5. 方法引用（Lambda 的简写）</strong></p>
      <p>四种形式：类名::静态方法、对象::实例方法、类名::实例方法（第一个参数作为接收者）、类名::new（构造引用）。</p>`},
  {c:"基础",d:"★★",q:"什么是函数式接口？@FunctionalInterface 的作用？",
   a:`<p><strong>函数式接口</strong>就是<strong>只有一个抽象方法</strong>的接口（可以有多个 default 或 static 方法）。Lambda 表达式的类型就是函数式接口。</p>
      <p><code>@FunctionalInterface</code> 是个注解，加上之后编译器会帮你检查：如果接口里抽象方法不是正好一个，编译就报错。它类似于 @Override 的检查作用，不是必须加，但推荐加。</p>
      <blockquote>JDK 内置的四大函数式接口：Function（有入参有返回）、Predicate（有入参返回 boolean）、Consumer（有入参无返回）、Supplier（无入参有返回）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 函数式接口的定义</strong></p>
      <p>有且仅有一个抽象方法的接口（Object 的 public 方法不算，如 equals）。可以有任意多个 default、static、private（Java 9+）方法。函数式接口是 Lambda 表达式和方法引用的目标类型。</p>
      <p><strong>2. @FunctionalInterface 的作用</strong></p>
      <p>标记注解（可省略），加在接口上后编译器强制检查：抽象方法数必须正好 1 个，否则编译报错。类似 @Override 的防御性检查。建议自定义函数式接口都加上，防止误加方法破坏函数式特性。</p>
      <p><strong>3. JDK 内置函数式接口（java.util.function）</strong></p>
      <ul>
        <li><strong>Function&lt;T,R&gt;</strong>：T→R，apply。有 compose（前组合）、andThen（后组合）。</li>
        <li><strong>Predicate&lt;T&gt;</strong>：T→boolean，test。有 and/or/negate。</li>
        <li><strong>Consumer&lt;T&gt;</strong>：T→void，accept。有 andThen。</li>
        <li><strong>Supplier&lt;T&gt;</strong>：()→T，get。工厂模式常用。</li>
        <li>衍生：BiFunction（两参）、UnaryOperator（同类型）、BinaryOperator（同类型两参）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>函数式接口是只有一个抽象方法的接口，是 Lambda 的目标类型。@FunctionalInterface 让编译器检查。JDK 内置四大核心：Function、Predicate、Consumer、Supplier。</p>`},
  {c:"基础",d:"★★",q:"Stream API 的常用操作有哪些？",
   a:`<p>Stream 是对集合进行函数式操作的工具，分两类：</p>
      <ul>
        <li><strong>中间操作</strong>（返回 Stream，可以链式调用，惰性求值）：filter 过滤、map 转换、sorted 排序、distinct 去重、limit/skip 截取。</li>
        <li><strong>终端操作</strong>（触发真正执行，返回结果）：forEach 遍历、collect 收集成集合、count 计数、reduce 归约、min/max。</li>
      </ul>
      <blockquote>注意：Stream 是"惰性求值"，只有遇到终端操作才会真正执行。流只能消费一次，用完就关。并行流 parallelStream 底层用 ForkJoinPool，数据量大时才用。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Stream 的特点</strong></p>
      <ul>
        <li><strong>不是数据结构</strong>，是对数据源的视图/计算管道。不存数据、不改源。</li>
        <li><strong>惰性求值</strong>：中间操作不立即执行，遇到终端操作才一次性触发。</li>
        <li><strong>只能消费一次</strong>：流操作完就关闭，不能重复用。</li>
      </ul>
      <p><strong>2. 操作分类</strong></p>
      <ul>
        <li><strong>中间操作</strong>（返回 Stream，惰性）：filter、map、flatMap、sorted、distinct、limit、skip、peek。</li>
        <li><strong>终端操作</strong>（触发执行，返回结果）：forEach、collect、count、reduce、min、max、anyMatch、findFirst。</li>
        <li><strong>短路操作</strong>：findFirst、anyMatch、limit 遇到满足条件的就停止。</li>
      </ul>
      <p><strong>3. collect 和 Collectors</strong></p>
      <p>collect 是最常用的终端操作，配合 Collectors 工具类：toList、toSet、toMap、groupingBy（分组）、partitioningBy（分区）、joining（拼接）、counting、summarizingInt（统计）。</p>
      <p><strong>4. 并行流 parallelStream（易错点）</strong></p>
      <ul>
        <li>底层用 ForkJoinPool.commonPool()，默认线程数 = CPU 核数 - 1。</li>
        <li>适合数据量大、元素计算耗时的场景；数据量小反而更慢（线程切换开销）。</li>
        <li><strong>线程安全</strong>：操作共享变量要保证原子（用 collect 不用 forEach 改外部变量）；源要用线程安全的。</li>
        <li>顺序问题：forEach 顺序不保证，forEachOrdered 保证。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Stream 分中间操作（filter/map/sorted，惰性）和终端操作（collect/forEach/reduce，触发执行）。特点是惰性求值、只能消费一次。并行流注意线程安全和适用场景。</p>`},
  {c:"基础",d:"★★",q:"Optional 类是做什么的？",
   a:`<p>Optional 是一个容器对象，用来<strong>优雅地处理 null</strong>，避免到处写 if(xxx != null) 的空指针判断。</p>
      <p>常用方法：</p>
      <ul>
        <li><code>Optional.of(obj)</code>：obj 不能为 null，否则 NPE。</li>
        <li><code>Optional.ofNullable(obj)</code>：obj 可以为 null（推荐用这个）。</li>
        <li><code>orElse(默认值)</code>：为空时返回默认值。</li>
        <li><code>orElseGet(() -> 生成默认值)</code>：为空时调 Supplier 生成。</li>
        <li><code>ifPresent(obj -> 操作)</code>：不为空时执行。</li>
        <li><code>map/filter</code>：链式处理。</li>
      </ul>
      <blockquote>orElse vs orElseGet：orElse 不管是不是空都会计算默认值；orElseGet 只在为空时才调用，性能更好。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Optional 的设计目的</strong></p>
      <p>让方法返回值显式表达"可能为空"，把 NPE 从运行时错误变成编译期可感知的问题。建议作为<strong>方法返回值</strong>（而非字段或参数），配合链式调用替代 null 检查。</p>
      <p><strong>2. 创建 Optional</strong></p>
      <ul>
        <li><code>Optional.empty()</code>：空的 Optional。</li>
        <li><code>Optional.of(T)</code>：T 不能为 null，否则 NPE。用于确定非 null 的场景。</li>
        <li><code>Optional.ofNullable(T)</code>：T 可为 null（推荐，最常用）。</li>
      </ul>
      <p><strong>3. 常用方法</strong></p>
      <ul>
        <li><strong>isPresent()/isEmpty()</strong>：判断有没有值。</li>
        <li><strong>get()</strong>：取值，没有则抛 NoSuchElementException（不推荐直接用）。</li>
        <li><strong>orElse(默认值)</strong>：空则返回默认值。</li>
        <li><strong>orElseGet(Supplier)</strong>：空则调 Supplier 生成。</li>
        <li><strong>orElseThrow(Supplier)</strong>：空则抛指定异常。</li>
        <li><strong>map/flatMap/filter</strong>：链式转换/过滤。</li>
        <li><strong>ifPresent(Consumer)</strong>：有值则执行。</li>
      </ul>
      <p><strong>4. orElse vs orElseGet（高频考点）</strong></p>
      <p>orElse(默认值)：默认值<strong>总是被计算</strong>（不管 Optional 是否为空），因为参数在方法调用前就求值了。orElseGet(() -> 值)：默认值<strong>只在为空时才计算</strong>（Supplier 延迟执行）。</p>
      <p>当默认值计算昂贵（如查 DB、new 对象）时，必须用 orElseGet，否则即使有值也白算一次。</p>
      <p><strong>5. 最佳实践</strong></p>
      <ul>
        <li>作为返回类型，明确表达"可能为空"。</li>
        <li>不要用作字段（Optional 不可序列化）。</li>
        <li>不要用作方法参数（增加复杂性）。</li>
        <li>避免 isPresent + get，优先用 map/orElse/ifPresent。</li>
      </ul>`},
  {c:"基础",d:"★★",q:"Java 8/11/17/21 各有什么重要新特性？",
   a:`<ul>
        <li><strong>Java 8</strong>（最重要）：Lambda、Stream、Optional、新日期 API（LocalDate）、默认方法。</li>
        <li><strong>Java 11</strong>（LTS）：var 局部变量类型推断、HTTP Client、String 新方法（isBlank/strip/lines）。</li>
        <li><strong>Java 17</strong>（LTS）：密封类 sealed、Record 记录类、模式匹配 instanceof、文本块 """ """。</li>
        <li><strong>Java 21</strong>（LTS）：<strong>虚拟线程</strong>（最重要）、序列化集合、switch 模式匹配。</li>
      </ul>
      <blockquote>实际开发中 8 用得最多，但 17/21 在新项目里越来越多。虚拟线程是 21 最大的亮点，能大幅提升并发能力。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Java 8（里程碑版本，最广泛使用）</strong></p>
      <ul>
        <li>Lambda 表达式 + 函数式接口。</li>
        <li>Stream API（集合的函数式操作）。</li>
        <li>Optional（空值处理）。</li>
        <li>新日期时间 API（java.time：LocalDate/LocalDateTime，线程安全、不可变）。</li>
        <li>接口 default 方法、static 方法。</li>
        <li>方法引用、CompletableFuture。</li>
      </ul>
      <p><strong>2. Java 11（LTS）</strong></p>
      <ul>
        <li><strong>var</strong> 局部变量类型推断（var list = new ArrayList&lt;&gt;()）。</li>
        <li>标准 HTTP Client（替代 HttpURLConnection，支持 HTTP/2、WebSocket）。</li>
        <li>String 新方法：isBlank、strip、lines、repeat。</li>
        <li>集合不可变工厂：List.of()、Map.of()。</li>
      </ul>
      <p><strong>3. Java 17（LTS）</strong></p>
      <ul>
        <li><strong>密封类 Sealed</strong>：sealed + permits，限制哪些类能继承。</li>
        <li><strong>Record 记录类</strong>：简化 POJO，自动生成构造/getter/equals/hashCode/toString，不可变。</li>
        <li><strong>模式匹配 instanceof</strong>：if (obj instanceof String s) 直接绑定变量。</li>
        <li>文本块 Text Block（""" """，多行字符串）。</li>
        <li>switch 表达式（yield、箭头语法）。</li>
      </ul>
      <p><strong>4. Java 21（最新 LTS）</strong></p>
      <ul>
        <li><strong>虚拟线程 Virtual Thread</strong>（最重要）：轻量级线程，百万级并发。</li>
        <li>序列集合 Sequenced Collections（getFirst/getLast）。</li>
        <li>switch 模式匹配（case 支持类型模式）。</li>
        <li>Record Patterns（解构 Record）。</li>
      </ul>
      <p><strong>5. Record vs Lombok @Data</strong></p>
      <p>Record 是语言级支持、不可变、无继承；Lombok @Data 是编译期增强、可变、可继承、功能更全（@Builder 等）。简单不可变 DTO 用 Record，复杂实体用 Lombok。</p>`},
  {c:"基础",d:"★★",q:"什么是虚拟线程（Virtual Thread）？JDK 21 的新特性",
   a:`<p>虚拟线程是 JDK 21 正式发布的轻量级线程，由 JVM 而不是操作系统管理。</p>
      <p><strong>特点</strong>：</p>
      <ul>
        <li><strong>极轻量</strong>：一个应用可以创建<strong>百万级</strong>虚拟线程（平台线程通常只能几千个）。</li>
        <li><strong>非阻塞</strong>：虚拟线程在 IO 阻塞时会自动让出载体线程给其他虚拟线程用。</li>
        <li><strong>用法不变</strong>：API 跟普通线程一样（Thread.startVirtualThread），同步代码风格。</li>
      </ul>
      <p><strong>适合场景</strong>：IO 密集型（网络请求、数据库查询），吞吐量大幅提升。不适合 CPU 密集型。</p>
      <blockquote>一句话理解：以前线程池是为了复用昂贵的系统线程，虚拟线程便宜到不用池化，请求来了就新建一个，用完就丢。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 虚拟线程 vs 平台线程</strong></p>
      <ul>
        <li><strong>平台线程（传统线程）</strong>：1:1 对应操作系统线程，创建/切换成本高，数量受限于系统（通常几千个）。</li>
        <li><strong>虚拟线程</strong>：N:M 模型，多个虚拟线程跑在少数载体线程（平台线程）上。由 JVM 调度，极轻量（几 KB），可创建百万级。</li>
      </ul>
      <p><strong>2. 工作原理（Continuation + 调度）</strong></p>
      <p>虚拟线程执行时跑在载体线程上。遇到<strong>阻塞 IO 操作</strong>（网络、文件、锁等待）时，JVM 会<strong>卸载（unmount）</strong>它，把载体线程让给其他虚拟线程；IO 完成后再<strong>挂载（mount）</strong>恢复执行。整个过程用 Continuation 保存/恢复栈帧。</p>
      <p>注意：synchronized 块或 native 方法阻塞时，虚拟线程会<strong>钉住（pin）</strong>载体线程，无法卸载，失去优势。建议用 ReentrantLock 替代 synchronized。</p>
      <p><strong>3. 用法</strong></p>
      <pre><code>// 方式1：直接启动
Thread.startVirtualThread(() -> { ... });

// 方式2：用执行器（每任务一线程，推荐）
try (var executor = Executors.newVirtualThreadPerTaskExecutor()) {
    executor.submit(() -> { ... });
}</code></pre>
      <p>API 和普通线程一致，Local、同步、try-catch 都照常用，<strong>无需改成异步代码</strong>。</p>
      <p><strong>4. 适用场景</strong></p>
      <ul>
        <li><strong>IO 密集型</strong>（推荐）：Web 服务、数据库查询、RPC 调用。吞吐量大幅提升，用同步代码达到异步效果。</li>
        <li><strong>不适合 CPU 密集型</strong>：CPU 计算占着线程，虚拟线程的"IO 让出"优势用不上。</li>
      </ul>
      <p><strong>5. 和线程池的关系</strong></p>
      <p>虚拟线程不用池化（newVirtualThreadPerTaskExecutor 每任务新建）。因为虚拟线程廉价，池化反而增加复杂度。但<strong>仍需限制并发数</strong>（用 Semaphore），防止压垮下游（如数据库连接）。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>虚拟线程是 JDK 21 的轻量级线程，由 JVM 调度，N:M 映射到平台线程。遇到 IO 自动卸载让出载体线程，可创建百万级。用同步代码风格达到异步 IO 的吞吐。适合 IO 密集型，注意 synchronized 会钉住线程。</p>`},
  {c:"基础",d:"★★",q:"JVM、JDK、JRE 三者有什么区别？",
   a:`<ul>
        <li><strong>JVM</strong>（Java 虚拟机）：运行字节码的虚拟机，是"一次编写到处运行"的关键。</li>
        <li><strong>JRE</strong>（Java 运行环境）= JVM + 核心类库（rt.jar 等）。只运行 Java 程序需要它。</li>
        <li><strong>JDK</strong>（Java 开发工具包）= JRE + 开发工具（javac 编译器、jstack、jmap 等）。开发 Java 程序需要它。</li>
      </ul>
      <blockquote>包含关系：JDK ⊃ JRE ⊃ JVM。开发用 JDK，运行用 JRE 就行。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. JVM（Java Virtual Machine）</strong></p>
      <p>Java 虚拟机，是运行 Java 字节码的抽象计算机。它解释/编译执行 .class 文件，屏蔽了底层操作系统差异，是"一次编写，到处运行"的根本原因。不同平台（Windows/Linux/Mac）有不同的 JVM 实现（HotSpot 为主）。</p>
      <p>JVM 组成：类加载器、运行时数据区（堆、栈、方法区等）、执行引擎（解释器 + JIT）。</p>
      <p><strong>2. JRE（Java Runtime Environment）</strong></p>
      <p>Java 运行环境 = JVM + 核心类库（rt.jar、java.lang.* 等）。运行已编译的 Java 程序只需要 JRE。<strong>JDK 11 起不再单独提供 JRE</strong>，用 jlink 定制运行时。</p>
      <p><strong>3. JDK（Java Development Kit）</strong></p>
      <p>Java 开发工具包 = JRE + 开发工具（javac 编译器、javadoc、jar 打包、jdb 调试、jstack/jmap/jstat 诊断工具等）。开发 Java 程序需要 JDK。</p>
      <p><strong>4. 包含关系</strong></p>
      <p>JDK ⊃ JRE ⊃ JVM。开发用 JDK，部署运行环境只需 JRE（或定制 runtime）。</p>
      <p><strong>5. Java 跨平台原理</strong></p>
      <p>Java 源码（.java）经 javac 编译成平台无关的字节码（.class），由各平台的 JVM 解释/编译执行。不同系统装对应的 JVM 即可运行同一份字节码。注意 JVM 本身是平台相关的。</p>
      <p><strong>6. Oracle JDK vs OpenJDK</strong></p>
      <p>OpenJDK 是开源版本，Oracle JDK 是 Oracle 商业版本（基于 OpenJDK 代码，加少量商业特性）。JDK 11 起两者功能基本一致，生产多用 OpenJDK（如 Adoptium/Temurin）。</p>`},
  {c:"基础",d:"★",q:"i++ 和 ++i 的区别？i = i++ 的值是什么？",
   a:`<p><strong>i++</strong> 先用后加（先用 i 的值，再把 i 加 1）；<strong>++i</strong> 先加后用（先把 i 加 1，再用新值）。</p>
      <p><code>i = i++</code> 的值：i 还是原来的值！因为先把 i 的值暂存，然后 i 自增，最后把暂存的值赋回 i，相当于没变。这是个经典陷阱，实际开发别这么写。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. i++（后置自增）</strong></p>
      <p>先使用 i 的当前值参与运算，然后 i 加 1。例如 <code>int a = i++;</code>，a 得到 i 自增前的值，i 本身变成 i+1。</p>
      <p><strong>2. ++i（前置自增）</strong></p>
      <p>先把 i 加 1，再使用 i 的新值参与运算。例如 <code>int a = ++i;</code>，i 先变成 i+1，a 得到 i+1。</p>
      <p><strong>3. i = i++ 的陷阱</strong></p>
      <p>分步执行：① 把 i 的当前值暂存到临时变量 temp；② i 自增（i = i+1）；③ 把 temp 赋值给 i。结果 i 还是原值，相当于没变化。</p>
      <pre><code>int i = 0;
i = i++;  // 步骤：temp=0 → i=1 → i=temp=0
System.out.println(i);  // 输出 0</code></pre>
      <p><strong>4. 性能（C++ 才显著，Java 无差异）</strong></p>
      <p>C++ 中 ++i 对复杂对象（迭代器）性能略好（i++ 要拷贝一份旧值）；Java 基本类型两者性能完全一样。</p>
      <p><strong>5. 字节码层面</strong></p>
      <p>单独的 i++ 和 ++i 编译后字节码相同（都是 iinc 指令）。区别只在表达式上下文（参与赋值/运算）时才体现。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>i++ 先用后加，++i 先加后用。<code>i = i++</code> 因为暂存原值再赋回，结果 i 不变。实际开发中避免写 i = i++ 这种反直觉代码。</p>`},

  {c:"基础",d:"★★★",q:"BigDecimal 怎么用？为什么浮点数计算要用它？",
   a:`<p>float/double 用二进制无法精确表示某些十进制小数（如 0.1），<code>0.1+0.2 != 0.3</code>。<strong>金额计算必须用 BigDecimal</strong>。</p>
      <p><strong>关键用法</strong>：</p>
      <ul>
        <li><strong>用 String 构造</strong>：<code>new BigDecimal("0.1")</code>，别用 <code>new BigDecimal(0.1)</code>（double 构造还是有精度问题）。</li>
        <li>加减乘除：<code>add/subtract/multiply/divide</code>。divide 要指定 scale（小数位）和 RoundingMode，否则除不尽会抛异常。</li>
        <li><strong>比较用 compareTo，别用 equals</strong>：equals 会比较 scale（2.0 和 2.00 不等），compareTo 只比值。</li>
      </ul>
      <blockquote>面试标准答法：浮点数精度丢失（IEEE 754），金额用 BigDecimal(String构造)，比较用 compareTo。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么浮点数不精确</strong>：计算机用二进制存小数，0.1 在二进制是无限循环（类似十进制的 1/3），截断后丢失精度。</p>
      <p><strong>2. BigDecimal 的正确用法</strong></p>
      <pre><code>// ✅ 正确：用 String 构造
BigDecimal a = new BigDecimal("0.1");
BigDecimal b = BigDecimal.valueOf(0.1);  // 内部也是 toString
// ❌ 错误：double 构造仍不精确
BigDecimal c = new BigDecimal(0.1);  // 0.1000000000000000055511151231257827021181583404541015625

// 运算（不可变，返回新对象）
a.add(b);       // 加
a.subtract(b);  // 减
a.multiply(b);  // 乘
a.divide(b, 2, RoundingMode.HALF_UP);  // 除：指定精度和舍入模式

// 比较
a.compareTo(b) == 0  // ✅ 只比值
a.equals(b)          // ❌ 还比 scale，2.0 ≠ 2.00</code></pre>
      <p><strong>3. 舍入模式 RoundingMode</strong>：HALF_UP（四舍五入，最常用）、DOWN（截断）、CEILING、FLOOR、HALF_EVEN（银行家舍入）。</p>
      <p><strong>4. 注意事项</strong>：BigDecimal 不可变（运算返回新对象）；性能比 double 差（对象+精确计算），非金额场景不用。</p>`},
  {c:"基础",d:"★★",q:"深拷贝和浅拷贝的区别？怎么实现深拷贝？",
   a:`<p><strong>浅拷贝</strong>：复制对象，基本类型复制值，<strong>引用类型只复制引用</strong>（指向同一对象）。改拷贝的引用字段会影响原对象。clone() 默认是浅拷贝。</p>
      <p><strong>深拷贝</strong>：完全复制，<strong>引用类型也递归复制</strong>（创建新对象）。改拷贝不影响原对象。</p>
      <p><strong>实现深拷贝</strong>：① 手动递归 clone 引用字段；② 序列化/反序列化（对象实现 Serializable，序列化再反序列化得到全新对象）；③ JSON 序列化（Jackson/Gson 转一圈）。</p>
      <blockquote>面试标准答法：浅拷贝引用共享，深拷贝完全独立。深拷贝用序列化实现最方便。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 引用拷贝</strong>：只是复制引用（指向同一对象），如 Person p2 = p1。根本不是拷贝。</p>
      <p><strong>2. 浅拷贝</strong>：创建新对象，基本类型复制值，引用类型复制引用（共享）。实现 Cloneable + super.clone()。</p>
      <p><strong>3. 深拷贝</strong>：所有层级都复制，完全独立。</p>
      <p><strong>4. 深拷贝实现方式</strong></p>
      <ul>
        <li><strong>手动递归 clone</strong>：重写 clone()，对每个引用字段也调 clone()。嵌套深时代码繁琐。</li>
        <li><strong>序列化</strong>：实现 Serializable，用 ObjectOutputStream 序列化 → ObjectInputStream 反序列化。最通用。</li>
        <li><strong>JSON 序列化</strong>：object → JSON string → new object。简单但性能差。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong>：浅拷贝引用共享（改了互相影响），深拷贝完全独立。clone() 默认浅拷贝。深拷贝用序列化（最通用）或手动递归 clone。引用拷贝只是复制指针。</p>`},
  {c:"基础",d:"★★",q:"创建对象有哪些方式？",
   a:`<ol>
        <li><strong>new</strong>：最常见，调用构造方法。</li>
        <li><strong>反射</strong>：Class.newInstance()（已废弃）/ Constructor.newInstance()。</li>
        <li><strong>clone()</strong>：实现 Cloneable，不调用构造方法。</li>
        <li><strong>反序列化</strong>：ObjectInputStream.readObject()，不调用构造方法。</li>
        <li><strong>Unsafe.allocateInstance()</strong>：底层 API，不调用构造方法。</li>
      </ol>
      <blockquote>除了 new 和反射会调构造方法，clone/反序列化/Unsafe 都不调用构造方法。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 五种创建方式</strong></p>
      <ul>
        <li><strong>new</strong>：最常用。new Person("张三")。调用构造方法。</li>
        <li><strong>反射</strong>：clazz.getDeclaredConstructor().newInstance()。Spring 创建 Bean 用这种。Class.newInstance() 已废弃（不处理 checked 异常）。</li>
        <li><strong>clone()</strong>：实现 Cloneable 接口 + 重写 clone()。<strong>不调用构造方法</strong>，内存复制。浅拷贝。</li>
        <li><strong>反序列化</strong>：ObjectInputStream.readObject()。<strong>不调用构造方法</strong>，直接从字节流恢复对象。</li>
        <li><strong>Unsafe.allocateInstance()</strong>：sun.misc.Unsafe 的底层方法，分配内存不调构造（非常危险，基本不用）。</li>
      </ul>
      <p><strong>2. 面试标准答法</strong>：new（调构造）、反射 Constructor.newInstance（Spring用）、clone（不调构造，浅拷贝）、反序列化（不调构造）、Unsafe（底层，不调构造）。</p>`},
  {c:"基础",d:"★★",q:"注解的本质是什么？常见元注解有哪些？",
   a:`<p><strong>注解</strong>本质是一个继承了 Annotation 接口的接口，编译后是 interface。运行时通过反射读取注解信息。</p>
      <p><strong>四个元注解</strong>（注解的注解）：</p>
      <ul>
        <li><strong>@Retention</strong>：保留策略。SOURCE（编译丢弃，如 @Override）、CLASS（class 文件保留，默认）、RUNTIME（运行时可反射读取，最常用）。</li>
        <li><strong>@Target</strong>：能标在哪。TYPE（类）、METHOD、FIELD、PARAMETER 等。</li>
        <li><strong>@Documented</strong>：生成 javadoc 时包含。</li>
        <li><strong>@Inherited</strong>：子类可继承父类的注解。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 注解的本质</strong></p>
      <p>@interface 定义注解，编译后是一个继承了 java.lang.annotation.Annotation 的接口。注解本身不做事，只是标记，靠<strong>反射</strong>或<strong>注解处理器</strong>（APT）读取后执行逻辑。</p>
      <p><strong>2. @Retention 保留策略（重要）</strong></p>
      <ul>
        <li><strong>SOURCE</strong>：只存源码，编译后丢弃。如 @Override、@SuppressWarnings。Lombok 用这个（编译期生成代码）。</li>
        <li><strong>CLASS</strong>：存到 class 文件，但运行时 JVM 不加载。默认值。</li>
        <li><strong>RUNTIME</strong>：运行时可反射读取。Spring 的 @Component/@Autowired 用这个。</li>
      </ul>
      <p><strong>3. 自定义注解 + 反射读取</strong></p>
      <pre><code>@Retention(RetentionPolicy.RUNTIME)
@Target(ElementType.METHOD)
public @interface MyAnnotation { String value() default ""; }

// 反射读取
Method method = clazz.getMethod("doSomething");
if(method.isAnnotationPresent(MyAnnotation.class)){
    MyAnnotation a = method.getAnnotation(MyAnnotation.class);
    String value = a.value();
}</code></pre>
      <p><strong>4. 面试标准答法</strong>：注解本质是继承Annotation的接口，靠反射/APT读取。元注解：@Retention(SOURCE/CLASS/RUNTIME保留策略)、@Target(标注位置)、@Documented、@Inherited。自定义注解配合反射使用。</p>`},
  {c:"基础",d:"★",q:"Java 的访问修饰符有哪些？作用范围？",
   a:`<table><tr><th>修饰符</th><th>本类</th><th>同包</th><th>子类</th><th>其他包</th></tr>
      <tr><td>private</td><td>✅</td><td>❌</td><td>❌</td><td>❌</td></tr>
      <tr><td>默认(default)</td><td>✅</td><td>✅</td><td>❌</td><td>❌</td></tr>
      <tr><td>protected</td><td>✅</td><td>✅</td><td>✅</td><td>❌</td></tr>
      <tr><td>public</td><td>✅</td><td>✅</td><td>✅</td><td>✅</td></tr></table>
      <blockquote>protected 可跨包给子类访问，default 不行。这是常考区别。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p>四个访问级别（从小到大）：private → default(包级私有) → protected → public。</p>
      <p><strong>易错点</strong>：protected 跨包的子类可以访问（通过子类引用），但不是任意跨包类都能访问。default 只限同包（即使子类不同包也不行）。</p>
      <p><strong>类的修饰符</strong>：外部类只能 public 或 default（不能 private/protected）。内部类可以四种都行。</p>`},
  {c:"基础",d:"★",q:"final、finally、finalize 的区别？",
   a:`<p>三个完全不同的东西，只是名字像：</p>
      <ul>
        <li><strong>final</strong>：修饰符。类不能继承、方法不能重写、变量不能重新赋值。</li>
        <li><strong>finally</strong>：try-catch-finally 的 finally 块，<strong>一定执行</strong>（不管有没有异常），用于关闭资源。</li>
        <li><strong>finalize</strong>：Object 的方法，GC 回收前调用。<strong>已废弃（JDK 9+）</strong>，不可靠、慢，别用。用 Cleaner 或 try-with-resources 替代。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. final</strong>：修饰类（不可继承，如 String）、方法（不可重写）、变量（常量/引用不可变）。</p>
      <p><strong>2. finally</strong>：异常处理的 finally 块。无论是否异常都执行（除 System.exit）。用于资源关闭。finally 中 return 会覆盖 try 的 return（别这么写）。</p>
      <p><strong>3. finalize()</strong>：Object 方法，对象被回收前 JVM 调用。用于清理资源。但<strong>已废弃</strong>（@Deprecated since 9，移除于 18）：① 不确定何时调用（GC 时机不定）；② 可能导致复活（finalize 里重新建立引用）；③ 性能差。替代：try-with-resources、Cleaner。</p>
      <p><strong>4. 面试标准答法</strong>：final修饰(类/方法/变量)，finally异常处理必执行，finalize已废弃的GC前回调(用try-with-resources/Cleaner替代)。三者无关只是名字像。</p>`},
  {c:"基础",d:"★★",q:"BIO、NIO、AIO 的区别？",
   a:`<ul>
        <li><strong>BIO（同步阻塞）</strong>：一个连接一个线程，连接不做事也占线程。传统 IO（InputStream/OutputStream）。</li>
        <li><strong>NIO（同步非阻塞）</strong>：多路复用（Selector + Channel + Buffer），一个线程管理多个连接。Netty 底层用 NIO。</li>
        <li><strong>AIO（异步非阻塞）</strong>：IO 操作由 OS 完成，完成后回调通知。Windows IOCP 支持好，Linux 支持不完善（Netty 用 NIO）。</li>
      </ul>
      <blockquote>BIO 适合连接少，NIO 适合连接多且短，AIO 理论最优但 Linux 支持差。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. BIO（Blocking IO）</strong></p>
      <ul>
        <li>同步阻塞。ServerSocket.accept() 阻塞等连接，InputStream.read() 阻塞等数据。</li>
        <li>一个连接占一个线程（线程浪费在等待上）。连接数多时线程爆炸。</li>
        <li>适合连接数少、固定的场景。</li>
      </ul>
      <p><strong>2. NIO（Non-blocking IO，Java 1.4）</strong></p>
      <ul>
        <li>同步非阻塞。三大核心：<strong>Channel</strong>（双向通道）、<strong>Buffer</strong>（数据缓冲区）、<strong>Selector</strong>（多路复用器）。</li>
        <li>一个 Selector 线程管理多个 Channel（连接），哪个有事件（读/写就绪）就处理哪个。 epoll 实现。</li>
        <li>一个线程处理大量连接。Netty、Tomcat（8+ NIO 模式）都用。</li>
      </ul>
      <p><strong>3. AIO（Async IO，Java 7）</strong></p>
      <ul>
        <li>异步非阻塞。发起 IO 后不阻塞，OS 完成后回调 CompletionHandler。</li>
        <li>Windows IOCP 支持好，Linux AIO 不完善（Netty 弃用 AIO）。</li>
        <li>理论上最优（真正的异步），但实际 Linux 支持差，生产多用 NIO。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：BIO同步阻塞(一连接一线程)，NIO同步非阻塞(Selector多路复用一线程管多连接，Netty用)，AIO异步非阻塞(OS完成后回调，Linux支持差)。生产多用NIO。</p>`},
  {c:"基础",d:"★",q:"& 和 && 有什么区别？",
   a:`<p><strong>&</strong>：位运算符（按位与），也是逻辑与（<strong>不短路</strong>，两边都计算）。</p>
      <p><strong>&&</strong>：逻辑与（<strong>短路</strong>），左边 false 时右边不计算（短路优化）。</p>
      <p>例：<code>a != null && a.length() &gt; 0</code> 用 && 短路防 NPE。用 & 则 a 为 null 时会 NPE。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. & 的两种含义</strong>：① 按位与（整数运算，如 5 & 3 = 1）；② 逻辑与（布尔运算，不短路，两边都算）。</p>
      <p><strong>2. && 短路与</strong>：左边 false 则直接返回 false，右边不计算。效率高、防 NPE。</p>
      <p><strong>3. | 和 || 同理</strong>：| 不短路或，|| 短路或。</p>
      <p><strong>4. 面试标准答法</strong>：& 是位与/非短路逻辑与(两边都算)，&& 是短路与(左false则不算右边，防NPE)。|和||同理。</p>`},
  {c:"基础",d:"★",q:"switch 支持哪些数据类型？",
   a:`<p>支持的类型：<strong>byte、short、char、int</strong>（Java 5+ <strong>枚举</strong>、<strong>包装类</strong> Byte/Short/Character/Integer）、Java 7+ <strong>String</strong>。</p>
      <p><strong>不支持</strong>：long、float、double、boolean。</p>
      <blockquote>String 的 switch 底层是先 hashCode 比较，再 equals 确认（防哈希冲突）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>支持</strong>：byte/short/char/int 及对应包装类（5+）、枚举（5+）、String（7+）。</p>
      <p><strong>不支持</strong>：long/float/double/boolean（switch 设计为精确匹配，浮点数不适合）。</p>
      <p><strong>String switch 原理</strong>：编译后先比较 hashCode（switch int），hashCode 相同再 equals 确认。</p>
      <p><strong>Java 14+ switch 表达式</strong>：支持 yield 返回值、箭头语法、模式匹配。</p>`},
  {c:"基础",d:"★★",q:"try-catch-finally 的执行顺序？finally 一定执行吗？",
   a:`<p>执行顺序：<strong>try →（异常时）catch → finally</strong>。finally 在 return 之前执行。</p>
      <p><strong>finally 不执行的情况</strong>：① System.exit() 退出 JVM；② JVM 崩溃；③ 当前线程被 kill（InterruptedException 也不一定执行完）；④ 守护线程的非 finally 代码块执行到一半 JVM 退出。</p>
      <p><strong>陷阱</strong>：finally 里的 return 会覆盖 try 的 return。finally 里修改基本类型不影响 try 返回的值（返回值在 return 时已确定）。</p>
      <blockquote>Java 7+ 用 try-with-resources 自动关闭资源，替代 finally 手动 close。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 执行顺序</strong>：try 正常→finally；try 异常→catch→finally。finally 总在方法返回前执行。</p>
      <p><strong>2. finally 不执行的特例</strong>：System.exit()、JVM 崩溃、线程被强杀。</p>
      <p><strong>3. finally 中 return 的坑</strong>：finally 有 return 会<strong>覆盖</strong> try/catch 的 return。编译器会警告。实际别在 finally 里 return。</p>
      <p><strong>4. finally 修改基本类型不影响返回值</strong>：JVM 在执行 return 时先把返回值压入栈，再执行 finally，最后弹出返回值。所以 finally 里改局部变量不影响已入栈的返回值（但引用类型修改对象内部字段会影响，因为是同一引用）。</p>
      <p><strong>5. try-with-resources（7+）</strong>：资源实现 AutoCloseable，自动在"隐式 finally"中 close()，且异常抑制（close 的异常附加到主异常）。多资源关闭顺序与声明相反。</p>`},
  {c:"基础",d:"★",q:"Java IO 流有哪些分类？",
   a:`<p>按<strong>数据类型</strong>：<strong>字节流</strong>（InputStream/OutputStream，读写二进制）和<strong>字符流</strong>（Reader/Writer，读写文本，自动处理编码）。</p>
      <p>按<strong>功能</strong>：<strong>节点流</strong>（直接连数据源，如 FileInputStream）和<strong>处理流/缓冲流</strong>（包装节点流增强功能，如 BufferedInputStream）。</p>
      <p><strong>常用流</strong>：FileInputStream/FileOutputStream、BufferedReader/BufferedWriter、InputStreamReader（字节转字符+指定编码）、ObjectInputStream（序列化）。</p>
      <blockquote>IO 用了装饰器模式：BufferedInputStream 装饰 FileInputStream。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 字节流 vs 字符流</strong></p>
      <ul>
        <li><strong>字节流</strong>：InputStream/OutputStream。读写字节（8bit），适合二进制文件（图片/视频/压缩包）。</li>
        <li><strong>字符流</strong>：Reader/Writer。读写字符（按编码解析），适合文本文件。InputStreamReader 桥接字节→字符（可指定编码）。</li>
      </ul>
      <p><strong>2. 节点流 vs 处理流</strong></p>
      <ul>
        <li><strong>节点流</strong>：直接连数据源。FileInputStream、SocketInputStream、ByteArrayInputStream。</li>
        <li><strong>处理流</strong>：包装节点流，增强功能。BufferedInputStream（缓冲）、DataInputStream（基本类型读写）、ObjectInputStream（序列化）。装饰器模式。</li>
      </ul>
      <p><strong>3. 常用流</strong></p>
      <ul>
        <li><strong>文件读写</strong>：FileReader/FileWriter（文本）、FileInputStream/FileOutputStream（字节）。</li>
        <li><strong>缓冲</strong>：BufferedReader（readLine()）、BufferedInputStream（减少 IO 次数）。</li>
        <li><strong>字节转字符</strong>：InputStreamReader/OutputStreamWriter（指定编码）。</li>
        <li><strong>序列化</strong>：ObjectInputStream/ObjectOutputStream。</li>
        <li><strong>打印</strong>：PrintStream（System.out）、PrintWriter。</li>
      </ul>
      <p><strong>4. NIO（Java 1.4）</strong>：Channel + Buffer + Selector，面向缓冲、非阻塞。和传统 IO（面向流、阻塞）不同。</p>
      <p><strong>5. 面试标准答法</strong>：字节流(InputStream/OutputStream二进制)vs字符流(Reader/Writer文本带编码)。节点流(直连源)vs处理流(包装增强，装饰器模式)。BufferedReader/InputStreamReader常用。IO用装饰器模式。</p>`},
  {c:"基础",d:"★",q:"Arrays.asList() 有什么坑？",
   a:`<p>两个大坑：</p>
      <ul>
        <li><strong>不能 add/remove</strong>：返回的是 Arrays 内部类 ArrayList（不是 java.util.ArrayList），<strong>固定大小</strong>，调 add 抛 UnsupportedOperationException。</li>
        <li><strong>基本类型数组的坑</strong>：<code>Arrays.asList(new int[]{1,2,3})</code> 返回 <code>List&lt;int[]&gt;</code>（1个元素），不是 List&lt;Integer&gt;（3个元素）。因为 int[] 是一个对象。</li>
      </ul>
      <p>正确用法：<code>new ArrayList&lt;&gt;(Arrays.asList(...))</code> 包装成真正的 ArrayList。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 返回的不是 java.util.ArrayList</strong></p>
      <p>Arrays.asList() 返回的是 Arrays$ArrayList（内部类），继承 AbstractList 但<strong>没实现 add/remove/clear</strong>（AbstractList 的这些方法抛 UnsupportedOperationException）。所以是<strong>固定大小</strong>的 List。</p>
      <p><strong>2. 修改会影响原数组</strong></p>
      <p>asList 返回的 List 和原数组<strong>共享底层数组</strong>。修改 List（set）会影响原数组，反之亦然。</p>
      <p><strong>3. 基本类型数组陷阱</strong></p>
      <pre><code>int[] arr = {1, 2, 3};
List list = Arrays.asList(arr);
// list.size() == 1 ！（List&lt;int[]&gt;，一个元素是整个数组）
// Integer[] 才正常
Integer[] arr2 = {1, 2, 3};
List list2 = Arrays.asList(arr2);  // size==3 ✅</code></pre>
      <p><strong>4. 正确转换方式</strong></p>
      <ul>
        <li><code>new ArrayList&lt;&gt;(Arrays.asList(array))</code>：包装成可变的 ArrayList。</li>
        <li>Java 9+：<code>List.of(1,2,3)</code>（不可变）。</li>
        <li>Stream：<code>Arrays.stream(array).boxed().collect(toList())</code>。</li>
      </ul>`},
  {c:"基础",d:"★",q:"静态代理和动态代理的区别？",
   a:`<p><strong>静态代理</strong>：手动写代理类（编译期确定），代理类和目标类实现相同接口。代码冗余（每个接口一个代理）。</p>
      <p><strong>动态代理</strong>：运行时动态生成代理类，不用手写。两种：① <strong>JDK 动态代理</strong>（基于接口，Proxy.newProxyInstance）；② <strong>CGLIB</strong>（基于继承，生成子类）。</p>
      <p>Spring AOP 底层就是动态代理。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 静态代理</strong>：代理类在编译期就写好。目标接口和代理类实现同一接口，代理持有目标引用，在方法前后加逻辑。</p>
      <pre><code>class UserServiceProxy implements UserService {
    private UserService target;
    public void save() { log(); target.save(); log(); }
}</code></pre>
      <p>缺点：每个接口都要手写代理类，接口方法多时代码爆炸。</p>
      <p><strong>2. JDK 动态代理</strong>：运行时生成代理类（实现目标接口）。Proxy.newProxyInstance + InvocationHandler。</p>
      <pre><code>Object proxy = Proxy.newProxyInstance(
    loader, new Class[]{UserService.class},
    (p, method, args) -> { log(); Object r = method.invoke(target, args); log(); return r; }
);</code></pre>
      <p>优点：通用（一个 handler 代理所有方法）。缺点：目标类必须有接口。</p>
      <p><strong>3. CGLIB 动态代理</strong>：运行时生成目标类的子类（ASM 字节码）。MethodInterceptor 拦截。不需要接口。不能代理 final 类/方法。</p>
      <p><strong>4. 对比</strong></p>
      <table><tr><th></th><th>静态代理</th><th>JDK 动态</th><th>CGLIB</th></tr>
      <tr><td>时机</td><td>编译期</td><td>运行时</td><td>运行时</td></tr>
      <tr><td>要求</td><td>同接口</td><td>有接口</td><td>无接口(继承)</td></tr>
      <tr><td>性能</td><td>最快</td><td>中</td><td>快(生成慢调用快)</td></tr></table>
      <p><strong>5. 面试标准答法</strong>：静态代理编译期手写(代码冗余)。动态代理运行时生成：JDK(基于接口Proxy+InvocationHandler)、CGLIB(基于继承生成子类，不能代理final)。Spring AOP用动态代理。</p>`},

  // ---------- Spring 补充2 ----------
  {c:"Spring",d:"★★★",q:"Spring 中用到了哪些设计模式？",
   a:`<ul>
        <li><strong>单例</strong>：Bean 默认 singleton。</li>
        <li><strong>工厂</strong>：BeanFactory/FactoryBean 创建对象。</li>
        <li><strong>代理</strong>：AOP（JDK/CGLIB 动态代理）。</li>
        <li><strong>模板方法</strong>：JdbcTemplate、RestTemplate、AbstractApplicationContext.refresh()。</li>
        <li><strong>观察者</strong>：ApplicationEvent 事件机制。</li>
        <li><strong>适配器</strong>：HandlerAdapter（MVC）、AdvisorAdapter。</li>
        <li><strong>责任链</strong>：Filter、Interceptor。</li>
        <li><strong>装饰器</strong>：BeanWrapper。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>Spring 中的设计模式应用</strong></p>
      <ul>
        <li><strong>单例（Singleton）</strong>：IoC 容器中的 Bean 默认单例。实现：ConcurrentHashMap 缓存。</li>
        <li><strong>工厂（Factory）</strong>：BeanFactory 是顶层工厂接口；FactoryBean 用于创建复杂对象（如 SqlSessionFactoryBean）。</li>
        <li><strong>代理（Proxy）</strong>：AOP 用 JDK 动态代理或 CGLIB。AnnotationAwareAspectJAutoProxyCreator 生成代理。</li>
        <li><strong>模板方法（Template Method）</strong>：JdbcTemplate/RestTemplate 定义骨架，子类/回调实现细节。AbstractApplicationContext.refresh() 定义启动流程骨架。</li>
        <li><strong>观察者（Observer）</strong>：ApplicationEvent + ApplicationListener/@EventListener。事件发布订阅。</li>
        <li><strong>适配器（Adapter）</strong>：HandlerAdapter 适配不同类型的 Handler（@RequestMapping、HttpRequestHandler）。Spring MVC 用。</li>
        <li><strong>责任链（Chain of Responsibility）</strong>：Filter 链、Interceptor 链。请求依次经过。</li>
        <li><strong>装饰器（Decorator）</strong>：BeanWrapper 包装 Bean 做属性访问；TransactionAwareCacheDecorator。</li>
        <li><strong>策略（Strategy）</strong>：Resource 接口不同实现（ClassPathResource、FileSystemResource）；InstantiationStrategy。</li>
      </ul>
      <p><strong>面试标准答法</strong>：单例(Bean)、工厂(BeanFactory/FactoryBean)、代理(AOP JDK/CGLIB)、模板方法(JdbcTemplate/refresh)、观察者(ApplicationEvent)、适配器(HandlerAdapter)、责任链(Filter/Interceptor)、装饰器(BeanWrapper)。</p>`},
  {c:"Spring",d:"★★",q:"@PathVariable、@RequestParam、@RequestBody 有什么区别？",
   a:`<ul>
        <li><strong>@PathVariable</strong>：取 URL 路径中的变量。如 <code>/user/{id}</code> → <code>@PathVariable("id") Long id</code>。</li>
        <li><strong>@RequestParam</strong>：取查询参数（URL ? 后面）或表单参数。如 <code>?name=张三</code> → <code>@RequestParam("name") String name</code>。</li>
        <li><strong>@RequestBody</strong>：取请求体（JSON），反序列化成对象。用于 POST/PUT 传 JSON。Content-Type: application/json。</li>
      </ul>
      <blockquote>@PathVariable 从路径取，@RequestParam 从查询串取，@RequestBody 从 body 取 JSON。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. @PathVariable（路径变量）</strong></p>
      <pre><code>@GetMapping("/user/{id}")
public User get(@PathVariable("id") Long id) { ... }</code></pre>
      <p>从 RESTful 路径取变量。支持多个：/user/{userId}/order/{orderId}。</p>
      <p><strong>2. @RequestParam（查询参数/表单参数）</strong></p>
      <pre><code>@GetMapping("/search")
public List search(@RequestParam("keyword") String kw,
                   @RequestParam(value="page", defaultValue="1") int page)</code></pre>
      <p>从 URL 查询串（?keyword=xxx&page=1）或 form-urlencoded 表单取。支持默认值、必填/可选。</p>
      <p><strong>3. @RequestBody（请求体）</strong></p>
      <pre><code>@PostMapping("/user")
public User create(@RequestBody UserDTO dto) { ... }</code></pre>
      <p>从请求体取 JSON，用 HttpMessageConverter（如 Jackson）反序列化成对象。Content-Type 必须是 application/json。一个方法只能有一个 @RequestBody。</p>
      <p><strong>4. 其他常用</strong></p>
      <ul>
        <li><strong>@RequestHeader</strong>：取请求头。@CookieValue：取 Cookie。</li>
        <li><strong>@ModelAttribute</strong>：表单绑定到对象（自动匹配字段名）。</li>
        <li><strong>不加注解</strong>：简单类型自动当 @RequestParam，对象自动当 @ModelAttribute。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong>：@PathVariable取路径变量(/user/{id})、@RequestParam取查询串/表单参数(?key=value)、@RequestBody取请求体JSON(POST，反序列化成对象)。@RequestHeader取请求头，@CookieValue取Cookie。</p>`},
  {c:"Spring",d:"★",q:"@RestController 和 @Controller 有什么区别？",
   a:`<p><strong>@Controller</strong>：MVC 控制器，方法返回<strong>视图名</strong>（页面渲染）。如果要返回 JSON 需要方法上加 @ResponseBody。</p>
      <p><strong>@RestController = @Controller + @ResponseBody</strong>：所有方法默认返回 JSON（直接写响应体），不走视图解析器。<strong>前后端分离用 @RestController</strong>。</p>
      <blockquote>前后端分离项目几乎全用 @RestController。需要返回页面（JSP/Thymeleaf）才用 @Controller。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. @Controller</strong>：标记为 MVC Controller。方法返回字符串被 ViewResolver 解析为视图名（如 "user/list" → /WEB-INF/jsp/user/list.jsp）。如果方法加了 @ResponseBody 或类加了 @ResponseBody，则不走视图解析，直接写响应体。</p>
      <p><strong>2. @RestController（4+）</strong>：组合注解 = @Controller + @ResponseBody。所有方法<strong>默认返回 JSON</strong>（通过 HttpMessageConverter 序列化）。不走 ViewResolver。</p>
      <p><strong>3. 什么时候用哪个</strong></p>
      <ul>
        <li><strong>前后端分离 / RESTful API</strong>：@RestController（返回 JSON）。</li>
        <li><strong>服务端渲染（JSP/Thymeleaf/Freemarker）</strong>：@Controller（返回视图名）。部分方法加 @ResponseBody 返回 JSON。</li>
      </ul>
      <p><strong>4. @ResponseBody 原理</strong>：HandlerAdapter 检测到 @ResponseBody，用 RequestResponseBodyMethodProcessor，通过 HttpMessageConverter（如 MappingJackson2HttpMessageConverter）把返回对象序列化成 JSON 写入响应。</p>`},
  {c:"Spring",d:"★★",q:"@Transactional 注解有哪些重要参数？",
   a:`<ul>
        <li><strong>rollbackFor</strong>：指定回滚的异常类型。默认只回滚 RuntimeException+Error，设 Exception.class 则所有异常都回滚。</li>
        <li><strong>propagation</strong>：事务传播行为。默认 REQUIRED。</li>
        <li><strong>isolation</strong>：事务隔离级别。默认用数据库的。</li>
        <li><strong>timeout</strong>：超时时间（秒），超时自动回滚。</li>
        <li><strong>readOnly</strong>：只读事务（优化提示，数据库可能优化）。</li>
        <li><strong>noRollbackFor</strong>：指定不回滚的异常。</li>
      </ul>
      <blockquote>最常用：rollbackFor = Exception.class（让 checked 异常也回滚）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. @Transactional 七个参数</strong></p>
      <ul>
        <li><strong>propagation</strong>：传播行为。REQUIRED（默认）、REQUIRES_NEW、NESTED 等。详见传播行为题。</li>
        <li><strong>isolation</strong>：隔离级别。DEFAULT（用DB的）、READ_UNCOMMITTED、READ_COMMITTED、REPEATABLE_READ、SERIALIZABLE。</li>
        <li><strong>timeout</strong>：事务超时秒数（默认 -1 不超时）。超时自动回滚+释放锁。</li>
        <li><strong>readOnly</strong>：true 表示只读事务。Hibernate 会优化（不查脏数据、FlushMode.MANUAL）。MySQL InnoDB 对只读无特别优化但语义清晰。</li>
        <li><strong>rollbackFor</strong>：指定触发回滚的异常<strong>类数组</strong>。默认只回滚 RuntimeException 和 Error。写 rollbackFor = Exception.class 让 checked 异常也回滚。</li>
        <li><strong>rollbackForClassName</strong>：同上，用类名字符串。</li>
        <li><strong>noRollbackFor / noRollbackForClassName</strong>：指定<strong>不回滚</strong>的异常。</li>
      </ul>
      <p><strong>2. 最常用的写法</strong></p>
      <pre><code>@Transactional(rollbackFor = Exception.class)  // 所有异常都回滚
@Transactional(readOnly = true)               // 只读查询方法
@Transactional(propagation = Propagation.REQUIRES_NEW)  // 独立事务</code></pre>
      <p><strong>3. 面试标准答法</strong>：propagation(传播行为默认REQUIRED)、isolation(隔离级别)、timeout(超时)、readOnly(只读)、rollbackFor(回滚异常默认Runtime+Error，配Exception.class全回滚)、noRollbackFor(不回滚)。最常用rollbackFor=Exception.class。</p>`},
  {c:"Spring",d:"★★",q:"Spring 参数校验（@Valid、@Validated）怎么用？",
   a:`<p>用 <strong>Bean Validation</strong>（JSR 303）做参数校验，Spring 集成了 Hibernate Validator。</p>
      <p><strong>常用校验注解</strong>：@NotNull（非null）、@NotBlank（非空白字符串）、@NotEmpty（非null且非空）、@Min/@Max、@Size、@Email、@Pattern（正则）。</p>
      <p><strong>用法</strong>：DTO 字段加注解，Controller 方法参数加 <code>@Valid</code> 或 <code>@Validated</code>。校验失败抛 MethodArgumentNotValidException。</p>
      <pre><code>@PostMapping("/user")
public User create(@Valid @RequestBody UserDTO dto) { ... }

class UserDTO {
    @NotBlank(message="姓名不能为空") private String name;
    @Min(value=0, message="年龄不能为负") private Integer age;
    @Email(message="邮箱格式错") private String email;
}</code></pre>
      <blockquote>@Valid（JSR标准，支持嵌套校验）vs @Validated（Spring扩展，支持分组校验）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 校验注解大全</strong></p>
      <ul>
        <li>空值：@Null、@NotNull、@NotBlank（字符串非空白）、@NotEmpty（集合/数组/Map非空）。</li>
        <li>数值：@Min、@Max、@DecimalMin、@DecimalMax、@Positive、@Negative。</li>
        <li>长度：@Size（集合/字符串/数组长度范围）、@Length（Hibernate扩展，字符串）。</li>
        <li>格式：@Email、@Pattern（正则）、@Past（过去日期）、@Future（未来日期）。</li>
      </ul>
      <p><strong>2. @Valid vs @Validated</strong></p>
      <ul>
        <li><strong>@Valid</strong>（JSR 标准）：支持<strong>嵌套校验</strong>（对象里的对象字段标 @Valid 递归校验）。不支持分组。</li>
        <li><strong>@Validated</strong>（Spring 扩展）：支持<strong>分组校验</strong>（不同场景不同规则，如 Add/Edit）。不支持嵌套（配合 @Valid 用）。</li>
      </ul>
      <p><strong>3. 分组校验</strong></p>
      <pre><code>// 定义分组接口
interface OnCreate {} interface OnUpdate {}
// DTO 字段指定分组
@NotNull(groups = OnUpdate.class) private Long id;  // 更新时校验
// Controller 指定分组
public User update(@Validated(OnUpdate.class) @RequestBody UserDTO dto)</code></pre>
      <p><strong>4. 异常处理</strong>：校验失败抛 MethodArgumentNotValidException（@RequestBody）或 ConstraintViolationException（@RequestParam/@PathVariable）。配合 @ExceptionHandler 统一处理返回友好提示。</p>
      <p><strong>5. 面试标准答法</strong>：JSR303注解(@NotNull/@NotBlank/@Min/@Email等)+@Valid/@Validated触发校验。@Valid支持嵌套，@Validated支持分组。失败抛MethodArgumentNotValidException，配合@ExceptionHandler统一处理。</p>`},
  {c:"Spring",d:"★★",q:"@Qualifier 和 @Primary 解决什么问题？",
   a:`<p>当一个接口有<strong>多个实现 Bean</strong>时，@Autowired 按类型注入会冲突报错。解决：</p>
      <ul>
        <li><strong>@Qualifier("beanName")</strong>：精确指定注入哪个 Bean（按名字）。</li>
        <li><strong>@Primary</strong>：在某个实现类上标 @Primary，多个候选时<strong>优先选它</strong>。</li>
      </ul>
      <blockquote>@Qualifier 更精确（每次指定），@Primary 更全局（设默认）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 多 Bean 冲突的场景</strong>：接口 DataSource 有两个实现（主库、从库），都注册为 Bean。@Autowired DataSource 会报 NoUniqueBeanDefinitionException。</p>
      <p><strong>2. @Qualifier（精确指定）</strong></p>
      <pre><code>@Autowired
@Qualifier("masterDataSource")  // 指定注入名为 masterDataSource 的 Bean
private DataSource dataSource;</code></pre>
      <p><strong>3. @Primary（设默认优先）</strong></p>
      <pre><code>@Bean
@Primary  // 多个候选时优先选这个
public DataSource masterDataSource() { ... }</code></pre>
      <p><strong>4. 其他解决方式</strong></p>
      <ul>
        <li>变量名匹配：@Autowired DataSource masterDataSource（变量名 == Bean 名）。</li>
        <li>组合：@Primary 设默认 + @Qualifier 特殊场景覆盖。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong>：多Bean冲突时，@Qualifier("name")精确指定注入哪个，@Primary标在某Bean上设默认优先。@Qualifier精确，@Primary全局默认。也可用变量名匹配。</p>`},
  {c:"Spring",d:"★",q:"Spring Boot 的 @SpringBootApplication 注解包含什么？",
   a:`<p><strong>@SpringBootApplication</strong> = <strong>@SpringBootConfiguration + @EnableAutoConfiguration + @ComponentScan</strong></p>
      <ul>
        <li><strong>@SpringBootConfiguration</strong>：就是 @Configuration，标记配置类。</li>
        <li><strong>@EnableAutoConfiguration</strong>：开启自动配置（根据 classpath 自动注册 Bean）。</li>
        <li><strong>@ComponentScan</strong>：扫描当前包及子包的 @Component/@Service/@Controller 等。</li>
      </ul>
      <blockquote>这就是 Spring Boot 一个注解启动整个应用的核心。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三个核心注解的组合</strong></p>
      <ul>
        <li><strong>@SpringBootConfiguration</strong>：本质是 @Configuration（Full 模式，CGLIB 代理），标记启动类为配置类，里面可定义 @Bean。</li>
        <li><strong>@EnableAutoConfiguration</strong>：核心！通过 @Import(AutoConfigurationImportSelector) 加载自动配置类（从 spring.factories / AutoConfiguration.imports），根据 @Conditional 决定哪些生效。</li>
        <li><strong>@ComponentScan</strong>：扫描启动类所在包及子包的 @Component/@Service/@Controller/@Repository/@Configuration。所以启动类要放根包。</li>
      </ul>
      <p><strong>2. 常用参数</strong></p>
      <ul>
        <li><strong>exclude/excludeName</strong>：排除某个自动配置（如不想用 DataSourceAutoConfiguration）。</li>
        <li><strong>scanBasePackages</strong>：指定扫描包（默认启动类所在包）。</li>
      </ul>
      <p><strong>3. 面试标准答法</strong>：@SpringBootApplication=@SpringBootConfiguration(配置类)+@EnableAutoConfiguration(自动配置)+@ComponentScan(组件扫描)。exclude排除自动配置，scanBasePackages指定扫描包。</p>`},
  {c:"Spring",d:"★★",q:"@Value 和 @ConfigurationProperties 读取配置有什么区别？",
   a:`<ul>
        <li><strong>@Value</strong>：读取<strong>单个配置项</strong>，标在字段上。如 <code>@Value("\${server.port}")</code>。支持 SpEL。简单少量用。</li>
        <li><strong>@ConfigurationProperties</strong>：读取<strong>一组配置</strong>，绑定到一个 Bean。如把所有 xxx.* 配置绑定到 Properties 类。支持松散绑定（驼峰/下划线）、校验。</li>
      </ul>
      <blockquote>少量散落配置用 @Value，一组结构化配置用 @ConfigurationProperties。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. @Value（单个配置）</strong></p>
      <pre><code>@Value("\${app.name:默认值}")  // 支持默认值
private String appName;
@Value("\${app.timeout}")
private long timeout;</code></pre>
      <p>支持 SpEL（\#{...}）。不支持松散绑定、不支持校验。</p>
      <p><strong>2. @ConfigurationProperties（批量绑定）</strong></p>
      <pre><code>@ConfigurationProperties(prefix = "app")
@Component
public class AppConfig {
    private String name;      // app.name
    private int port;         // app.port
    private List&lt;String&gt; servers;  // app.servers
    // getter/setter
}</code></pre>
      <p><strong>3. @ConfigurationProperties 的优势</strong></p>
      <ul>
        <li><strong>批量绑定</strong>：一组配置自动映射到字段。</li>
        <li><strong>松散绑定</strong>：app.user-name 对应 userName（下划线/中划线自动映射驼峰）。</li>
        <li><strong>支持校验</strong>：配合 @Validated + @NotNull 等。</li>
        <li><strong>支持复杂类型</strong>：List、Map、Duration、嵌套对象。</li>
        <li><strong>IDE 提示</strong>：配合 spring-boot-configuration-processor 生成元数据。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong>：@Value读单个配置(支持SpEL和默认值)。@ConfigurationProperties批量绑定一组配置到Bean(prefix，松散绑定，支持List/Map/嵌套/校验)。少量用@Value，结构化用@ConfigurationProperties。</p>`},
  {c:"Spring",d:"★★",q:"@Async 异步方法怎么用？有什么坑？",
   a:`<p><strong>用法</strong>：① 启动类加 <code>@EnableAsync</code>；② 方法加 <code>@Async</code>，方法会在<strong>独立线程</strong>异步执行。</p>
      <p><strong>坑</strong>：</p>
      <ul>
        <li><strong>自调用失效</strong>：同类内部调用 @Async 方法不生效（和 @Transactional 一样，this 不是代理）。</li>
        <li><strong>方法必须 public</strong>：代理只能拦截 public。</li>
        <li><strong>默认用 SimpleAsyncTaskExecutor</strong>：每次新建线程，没复用！要<strong>自定义线程池</strong>。</li>
        <li><strong>返回值</strong>：无返回值（void）或 Future/CompletableFuture。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. @Async 原理</strong>：和 @Transactional 一样基于 AOP 代理。方法被 @Async 标注后，代理对象拦截调用，把方法提交到<strong>异步线程池</strong>执行（不阻塞调用者）。</p>
      <p><strong>2. 用法</strong></p>
      <pre><code>@EnableAsync  // 启动类
@Service
public class EmailService {
    @Async
    public void sendEmail(String to) { ... }  // 异步执行
    
    @Async
    public CompletableFuture&lt;Result&gt; sendAsync(String to) { ... }  // 带返回值
}</code></pre>
      <p><strong>3. 自定义线程池（推荐）</strong></p>
      <pre><code>@Bean
public Executor taskExecutor() {
    ThreadPoolTaskExecutor e = new ThreadPoolTaskExecutor();
    e.setCorePoolSize(5);
    e.setMaxPoolSize(20);
    e.setQueueCapacity(100);
    e.setThreadNamePrefix("async-");
    return e;
}
// 方法上指定：@Async("taskExecutor")</code></pre>
      <p><strong>4. 失效场景</strong></p>
      <ul>
        <li><strong>自调用</strong>：同类内部调用（this 不是代理）。解决：自我注入/拆类。</li>
        <li><strong>非 public</strong>：private/protected 方法不代理。</li>
        <li><strong>没加 @EnableAsync</strong>。</li>
        <li><strong>默认线程池 SimpleAsyncTaskExecutor</strong>：不复用线程（每次 new），生产必须自定义。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong>：@EnableAsync+@Async，基于AOP代理异步执行。坑：自调用失效(this非代理)、非public、默认SimpleAsyncTaskExecutor不复用线程(要自定义ThreadPoolTaskExecutor)。返回void或CompletableFuture。</p>`},
