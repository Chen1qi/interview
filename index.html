  {c:"MySQL",d:"★★★",q:"联合索引的最左匹配原则是什么？",
   a:`<p>联合索引 (a, b, c) 会按 a→b→c 的顺序建立 B+ 树。最左匹配原则意思是：查询<strong>必须从最左边的列开始用</strong>，中间不能断。</p>
      <ul>
        <li><code>where a=? and b=? and c=?</code> ✅ 全部用到。</li>
        <li><code>where a=? and c=?</code> 只用到 a（b 断了，c 用不上）。</li>
        <li><code>where b=? and c=?</code> 完全用不到（没从 a 开始）。</li>
      </ul>
      <p><strong>范围查询会中断</strong>：<code>where a&gt;? and b=?</code>，a 用范围后，b 就用不上索引了（因为 a 是范围，b 在 a 内部无序）。</p>
      <blockquote>所以建联合索引时，把<strong>等值查询的列放前面、范围查询的列放后面</strong>，能让索引利用率最大化。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 最左匹配的本质</strong></p>
      <p>联合索引 (a,b,c) 的 B+ 树按 a 排序，a 相同按 b 排序，b 相同按 c 排序。所以只有从 a 开始才能利用排序特性（二分/范围），跳过 a 直接用 b 无法定位。</p>
      <p><strong>2. 匹配规则</strong></p>
      <ul>
        <li>必须从最左列开始，可跳过中间列（但跳过的列后面的列用不上）。</li>
        <li>MySQL 优化器会自动调整 where 条件顺序（where b=? and a=? 等价于 where a=? and b=?，都能用索引）。</li>
        <li><strong>范围查询（&gt; &lt; between like 'x%' in）会中断</strong>后续列的索引使用。</li>
        <li>等值（=）不中断。</li>
      </ul>
      <p><strong>3. 范围查询中断的原因</strong></p>
      <p>a 用范围后，结果集里 a 是多个值，b 在每个 a 内有序但整体无序，所以 b 无法用索引定位。把范围列放联合索引最后，避免影响前面的等值列。</p>
      <p><strong>4. 索引下推（ICP）的补充</strong></p>
      <p>虽然范围后 b 不能用于索引"定位"，但配合 ICP，b 仍可在索引层"过滤"（减少回表），不是完全没用。</p>
      <p><strong>5. 建联合索引的原则</strong></p>
      <ul>
        <li>等值查询列在前，范围查询列在后。</li>
        <li>区分度高（cardinality 大）的列在前，过滤效果好。</li>
        <li>把经常一起查询的列组合成联合索引，比多个单列索引更高效（覆盖索引）。</li>
        <li>列数不宜过多（一般不超过 5 个）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>最左匹配：联合索引从最左列开始用，中间不能断（否则后面列失效）。范围查询（&gt;/&lt;/between/like 'x%'）会中断。建索引把等值列放前、范围列放后、高区分度列放前。</p>`},
  {c:"MySQL",d:"★★★",q:"什么是覆盖索引？为什么能避免回表？",
   a:`<p><strong>覆盖索引</strong>：一个查询需要的所有字段，都能从索引里直接拿到，<strong>不用再回表</strong>查主键索引拿完整数据。</p>
      <p>比如索引 (name, age)，查询 <code>select name, age from user where name='张三'</code>，索引里就有 name 和 age，直接返回，不用回表。</p>
      <p><strong>好处</strong>：少一次回表（一次 B+ 树查找），大幅提升查询速度，是常用的优化手段。</p>
      <blockquote>用 explain 看，Extra 字段显示 <strong>Using index</strong> 就说明用了覆盖索引。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 覆盖索引的定义</strong></p>
      <p>不是一种索引类型，而是一种"查询的字段全部被索引覆盖"的现象。如果查询的列（select、where、order by 等）都在某个索引里，就不用回表查聚簇索引，直接从二级索引返回。</p>
      <p><strong>2. 为什么能避免回表</strong></p>
      <p>二级索引的叶子节点存"索引列值 + 主键值"。如果查询只要这些字段（如 select name, age, id），索引里全有，直接返回。如果还要其他字段（如 select *），就必须用主键回表查聚簇索引拿完整行。</p>
      <p><strong>3. 例子</strong></p>
      <pre><code>-- 联合索引 (name, age)
select name, age, id from user where name='张三';
-- Extra: Using index（覆盖索引，不回表）

select * from user where name='张三';
-- 需要回表（要的字段索引里没有）</code></pre>
      <p><strong>4. 覆盖索引的好处</strong></p>
      <ul>
        <li><strong>减少 IO</strong>：避免回表（一次额外的随机 IO 查聚簇索引）。</li>
        <li><strong>提升性能</strong>：尤其在大表、高并发下效果明显。</li>
      </ul>
      <p><strong>5. 如何使用</strong></p>
      <ul>
        <li>建联合索引时，把查询涉及的列都加进去（但要权衡索引大小）。</li>
        <li>避免 select *，只查需要的列。</li>
        <li>注意索引列数量，太多会占空间、影响写性能。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>覆盖索引是查询字段全在索引里，不用回表查聚簇索引。因为二级索引叶子存了索引列+主键，要这些就够。Extra 显示 Using index。优化：避免 select *，把高频查询列建联合索引。</p>`},
  {c:"MySQL",d:"★★",q:"MySQL 索引有哪些分类？",
   a:`<ul>
        <li><strong>按数据结构</strong>：B+ 树索引（默认）、Hash 索引（Memory 引擎）、全文索引。</li>
        <li><strong>按物理存储</strong>：聚簇索引（叶子存完整数据，即主键索引）、二级索引/非聚簇索引（叶子存主键值）。</li>
        <li><strong>按字段特性</strong>：主键索引、唯一索引、普通索引、前缀索引（字符串前 N 个字符）。</li>
        <li><strong>按字段个数</strong>：单列索引、联合索引。</li>
      </ul>
      <blockquote>覆盖索引不是一种索引类型，是一种"查询刚好被索引覆盖"的现象。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 按数据结构分</strong></p>
      <ul>
        <li><strong>B+ 树索引</strong>：InnoDB/MyISAM 默认，支持等值、范围、排序。最常用。</li>
        <li><strong>Hash 索引</strong>：Memory 引擎原生支持，等值查询 O(1) 但不支持范围/排序。InnoDB 有"自适应哈希索引"（AHI）自动优化热点。</li>
        <li><strong>全文索引 FULLTEXT</strong>：倒排索引，用于全文搜索（MATCH AGAINST）。一般用 ElasticSearch 替代。</li>
        <li><strong>R-Tree（空间索引）</strong>：地理位置数据。</li>
      </ul>
      <p><strong>2. 按物理存储分（InnoDB）</strong></p>
      <ul>
        <li><strong>聚簇索引（主键索引）</strong>：叶子存完整数据行。一张表一个。</li>
        <li><strong>二级索引（非聚簇）</strong>：叶子存"索引列 + 主键"。可有多个。</li>
      </ul>
      <p><strong>3. 按字段特性分</strong></p>
      <ul>
        <li><strong>主键索引 PRIMARY KEY</strong>：唯一且非空，一张表一个，自动建聚簇索引。</li>
        <li><strong>唯一索引 UNIQUE</strong>：值唯一（允许 NULL）。</li>
        <li><strong>普通索引 INDEX</strong>：无约束。</li>
        <li><strong>前缀索引</strong>：对字符串前 N 个字符建索引，省空间。</li>
        <li><strong>全文索引</strong>：见数据结构。</li>
      </ul>
      <p><strong>4. 按字段个数分</strong></p>
      <ul>
        <li><strong>单列索引</strong>：一个字段。</li>
        <li><strong>联合索引（复合索引）</strong>：多个字段，遵循最左匹配。</li>
      </ul>
      <p><strong>5. 注意</strong></p>
      <ul>
        <li>覆盖索引不是独立类型，是现象。</li>
        <li>主键只能有一个，二级索引可以有多个。</li>
        <li>索引不是越多越好（占空间、影响写性能、优化器选择困难）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>按结构：B+树（默认）、Hash、全文。按存储：聚簇（主键，存数据）、二级（存主键）。按特性：主键、唯一、普通、前缀。按个数：单列、联合。覆盖索引是现象不是类型。</p>`},
  {c:"MySQL",d:"★★",q:"count(*)、count(1)、count(列名) 有什么区别？",
   a:`<ul>
        <li><strong>count(\*)</strong>：统计<strong>所有行数</strong>（包括 NULL），InnoDB 会选最小的索引扫描来优化。MySQL 官方推荐。</li>
        <li><strong>count(1)</strong>：也是统计所有行数，性能和 count(*) 几乎一样（InnoDB 优化后没区别）。</li>
        <li><strong>count(列名)</strong>：统计该列<strong>非 NULL</strong>的行数，会忽略 NULL 值。</li>
      </ul>
      <p>性能：count(*) ≈ count(1) &gt; count(主键列) &gt; count(普通列)。优先用 count(*)。</p>
      <blockquote>InnoDB 没有维护总行数（不像 MyISAM），所以 count(*) 要扫描，大表会很慢。优化方案：估算值（show table status）、维护计数表、用 Redis 计数。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三者的语义</strong></p>
      <ul>
        <li><strong>count(\*)</strong>：统计行数，<strong>不忽略 NULL</strong>。MySQL 专门优化，不会逐列判断，直接数行。</li>
        <li><strong>count(1)</strong>：相当于给每行加个常量 1 然后数非 NULL 的，因为 1 永远非 NULL，所以等价于数行数。</li>
        <li><strong>count(列)</strong>：统计该列<strong>非 NULL</strong>的行数，NULL 被忽略。</li>
      </ul>
      <p><strong>2. count(*) 和 count(1) 性能</strong></p>
      <p>MySQL 官方优化后两者基本一样。InnoDB 会选择扫描最小的索引（辅助索引比聚簇索引小）来 count。早期版本 count(1) 略快，现在没区别。官方推荐 count(*)。</p>
      <p><strong>3. count(列) 性能</strong></p>
      <p>count(列) 要判断每行的该列是否为 NULL，且如果列不在索引里还要回表取值。性能：count(*) ≈ count(1) &gt; count(主键) &gt; count(普通列)。</p>
      <p><strong>4. 为什么 InnoDB 的 count(*) 慢</strong></p>
      <p>InnoDB 因为 MVCC，不同事务看到的行数不同，<strong>无法维护一个精确的总数</strong>（MyISAM 没有 MVCC，直接维护了总数，count(*) O(1)）。所以 InnoDB 要扫描，大表慢。</p>
      <p><strong>5. 大表 count 优化</strong></p>
      <ul>
        <li><strong>show table status</strong>：Rows 字段是估算值（不精确，可能偏差 10-50%）。</li>
        <li><strong>维护计数表</strong>：单独表存总数，插入/删除时更新（注意事务一致）。</li>
        <li><strong>Redis 计数</strong>：incr/decr，但和 DB 不保证一致。</li>
        <li><strong>information_schema.tables.TABLE_ROWS</strong>：估算值。</li>
        <li><strong>业务妥协</strong>：展示"约 1.2 万条"而非精确数。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>count(*) 和 count(1) 都数行不忽略NULL（性能几乎一样，官方推荐 count(*)），count(列) 只数非NULL。InnoDB 因 MVCC 无法存总数要扫描（慢），优化用 show table status 估算、计数表、Redis。</p>`},
  {c:"MySQL",d:"★",q:"char 和 varchar 有什么区别？怎么选？",
   a:`<ul>
        <li><strong>char(n)</strong>：定长字符串，固定占 n 个字符空间，不足补空格。适合长度固定的（如手机号、身份证、状态码）。</li>
        <li><strong>varchar(n)</strong>：变长字符串，按实际长度存储 + 1~2 字节记录长度。适合长度不固定的（如姓名、地址）。</li>
      </ul>
      <p>char 存取快（不用算长度），varchar 省空间。一般用 varchar 居多。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. char(n) 定长</strong></p>
      <p>n 是字符数（不是字节）。固定占 n×字符集字节数的空间，<strong>不足补空格</strong>（查询时去掉尾部空格）。如 char(10) 存 'abc' 实际占 10 个字符空间。</p>
      <p>优点：存取快（长度固定，定位方便）；不易碎片。缺点：浪费空间（短数据补空格）。</p>
      <p>适合：长度固定的字段（手机号、身份证号、MD5、状态码、性别）。</p>
      <p><strong>2. varchar(n) 变长</strong></p>
      <p>按实际长度存储，<strong>额外 1~2 字节记录长度</strong>（长度≤255 用1字节，否则2字节）。如 varchar(10) 存 'abc' 实际占 3+1 字节。</p>
      <p>优点：省空间。缺点：存取稍慢（要算实际长度）；update 变长可能引发页分裂。</p>
      <p>适合：长度不固定的字段（姓名、地址、邮箱、备注）。</p>
      <p><strong>3. 注意 n 的含义</strong></p>
      <p>n 是<strong>字符数</strong>不是字节数。varchar(10) 在 utf8mb4 下最多存 10 个字符（最多 40 字节）。MySQL 5.0+ 行格式下 varchar 总长度受单行最大字节数限制（65535）。</p>
      <p><strong>4. InnoDB 中的存储</strong></p>
      <p>char 在 InnoDB 中（COMPACT 行格式）实际也按变长处理（不补空格），和 varchar 行为类似，但定义语义不同。</p>
      <p><strong>5. 选择建议</strong></p>
      <ul>
        <li>长度固定用 char（手机号、UUID、状态码）。</li>
        <li>长度变化用 varchar（绝大多数字符串）。</li>
        <li>大文本用 text（但不建议，建议拆表或用 ES）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>char 定长补空格省不了空间但存取快，varchar 变长省空间要记长度字节。n 是字符数。固定长度用 char，变化长度用 varchar。</p>`},
  {c:"MySQL",d:"★",q:"truncate、delete、drop 有什么区别？",
   a:`<table><tr><th></th><th>delete</th><th>truncate</th><th>drop</th></tr>
      <tr><td>类型</td><td>DML</td><td>DDL</td><td>DDL</td></tr>
      <tr><td>作用</td><td>删除行（可带 where）</td><td>清空整张表</td><td>删除表结构+数据</td></tr>
      <tr><td>回滚</td><td>可回滚</td><td>不可回滚</td><td>不可回滚</td></tr>
      <tr><td>自增列</td><td>不重置</td><td>重置为1</td><td>-</td></tr>
      <tr><td>速度</td><td>慢（逐行）</td><td>快</td><td>最快</td></tr></table>
      <blockquote>记忆：delete 是"逐行删能回滚"，truncate 是"清空表重置自增"，drop 是"连表结构一起删"。truncate 删数据，drop 删表。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. delete（DML）</strong></p>
      <ul>
        <li>删除行，可带 where 删部分。</li>
        <li>逐行删除，记录 undo log，<strong>可回滚</strong>（事务内）。</li>
        <li>不释放空间（行被标记删除，可复用）。</li>
        <li>自增列不重置。</li>
        <li>触发 delete 触发器。</li>
        <li>速度慢（逐行 + 日志）。</li>
      </ul>
      <p><strong>2. truncate（DDL）</strong></p>
      <ul>
        <li>清空整张表的数据（不能带 where）。</li>
        <li>直接删除并重建表（DROP + CREATE），<strong>不可回滚</strong>（自动提交）。</li>
        <li>释放空间。</li>
        <li>自增列<strong>重置为1</strong>。</li>
        <li>不触发触发器。</li>
        <li>速度快。</li>
      </ul>
      <p><strong>3. drop（DDL）</strong></p>
      <ul>
        <li>删除<strong>表结构 + 数据 + 索引 + 约束</strong>。</li>
        <li>不可回滚（自动提交）。</li>
        <li>最彻底，表都没了。</li>
        <li>速度最快。</li>
      </ul>
      <p><strong>4. 速度对比</strong></p>
      <p>drop &gt; truncate &gt; delete。因为 drop/truncate 是 DDL（直接改数据文件），delete 是 DML（逐行+日志）。</p>
      <p><strong>5. 使用场景</strong></p>
      <ul>
        <li>删部分数据：delete from t where ...。</li>
        <li>清空表数据但保留表结构：truncate table t。</li>
        <li>不要表了：drop table t。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>delete 是 DML 可带 where 逐行删能回滚不重置自增；truncate 是 DDL 清空整表不可回滚重置自增释放空间；drop 是 DDL 删除表结构+数据不可回滚。速度 drop&gt;truncate&gt;delete。</p>`},
  {c:"MySQL",d:"★★",q:"一条 SQL 语句在 MySQL 里的执行流程是怎样的？",
   a:`<p>MySQL 分 <strong>Server 层</strong>和<strong>存储引擎层</strong>。一条查询 SQL 的流程：</p>
      <ol>
        <li><strong>连接器</strong>：建立连接、验证账号密码。</li>
        <li><strong>查询缓存</strong>（MySQL 8.0 已移除）：之前会先查缓存。</li>
        <li><strong>分析器</strong>：词法/语法分析，检查 SQL 语句对不对。</li>
        <li><strong>优化器</strong>：生成执行计划，选择用哪个索引、表连接顺序等。</li>
        <li><strong>执行器</strong>：调用存储引擎接口真正执行，返回结果。</li>
      </ol>
      <blockquote>Server 层是通用的（所有引擎共用），存储引擎层（InnoDB/MyISAM）负责数据的实际存储和读取，是可插拔的。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. MySQL 架构（两层）</strong></p>
      <ul>
        <li><strong>Server 层</strong>：连接器、查询缓存、分析器、优化器、执行器等。所有存储引擎共用。</li>
        <li><strong>存储引擎层</strong>：负责数据的存储和提取，可插拔（InnoDB/MyISAM/Memory）。</li>
      </ul>
      <p><strong>2. 查询 SQL 的执行流程</strong></p>
      <ol>
        <li><strong>连接器</strong>：建立 TCP 连接，验证账号密码权限，获取连接（长连接/短连接）。</li>
        <li><strong>查询缓存</strong>（5.7 及之前）：以 SQL 为 key 查缓存，命中直接返回。但表更新缓存就失效，命中率低，<strong>8.0 移除</strong>。</li>
        <li><strong>分析器</strong>：词法分析（识别关键字、表名列名）+ 语法分析（检查 SQL 语法，错则报错）。</li>
        <li><strong>优化器</strong>：生成执行计划。决定用哪个索引、join 表的顺序、是否用临时表等。基于成本估算（CBO）。</li>
        <li><strong>执行器</strong>：调用存储引擎接口，按执行计划真正执行，收集结果返回客户端。有权限校验。</li>
      </ol>
      <p><strong>3. 更新 SQL 的额外流程（redo/binlog/undo）</strong></p>
      <p>更新还涉及：① 用 undo log 记录旧值（回滚用）；② 更新数据；③ 写 redo log（prepare）；④ 写 binlog；⑤ redo log commit（两阶段提交）。</p>
      <p><strong>4. 执行器和存储引擎的交互</strong></p>
      <p>执行器调存储引擎 API（如 InnoDB 的 handler 接口）。如 select：执行器调 engine.fetch_first/fetch_next 逐行取，过滤后返回。所以过滤逻辑在执行器，存储引擎负责按索引取数据。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Server 层 + 存储引擎层。流程：连接器（建连鉴权）→ 查询缓存（8.0 移除）→ 分析器（词法语法）→ 优化器（执行计划、选索引）→ 执行器（调引擎执行）。更新还涉及 redo/binlog/undo 两阶段提交。</p>`},
  {c:"MySQL",d:"★★",q:"深度分页（limit 深度大）为什么慢？怎么优化？",
   a:`<p><code>select * from t limit 1000000, 10</code> 这种深度分页很慢，因为 MySQL 要先扫描前 100 万行，然后扔掉，只返回最后 10 行。</p>
      <p><strong>优化方案</strong>：</p>
      <ul>
        <li><strong>子查询/延迟关联</strong>：先查主键，再关联：<code>select * from t where id &gt;= (select id from t limit 1000000,1) limit 10</code>，走覆盖索引快。</li>
        <li><strong>游标分页（推荐）</strong>：记住上一页最后一条的 id，<code>where id &gt; 上次最大id limit 10</code>。</li>
        <li>产品层面：禁止跳页，只允许"下一页"。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么慢</strong></p>
      <p>limit 1000000, 10 的语义：从第 1000001 条开始取 10 条。MySQL 的实现是<strong>扫描前 1000010 行，丢弃前 100 万行，返回后 10 行</strong>。所以扫描了 100 万行却只返回 10 行，绝大部分是无效 IO。</p>
      <p>如果是 select * 还要回表 100 万次（每次随机 IO），更慢。</p>
      <p><strong>2. 优化方案一：延迟关联（子查询）</strong></p>
      <p>先在覆盖索引上查出主键，再用主键关联取数据：</p>
      <pre><code>select * from t 
where id &gt;= (select id from t order by create_time limit 1000000, 1) 
order by create_time limit 10;</code></pre>
      <p>子查询走覆盖索引（快），只对最终 10 条回表。比直接 limit 1000000,10 快很多。</p>
      <p><strong>3. 优化方案二：游标分页（推荐，性能最好）</strong></p>
      <p>记住上一页最后一条的 id（或排序字段值），下次查询从那之后取：</p>
      <pre><code>-- 第一页
select * from t order by id limit 10;
-- 第二页（id &gt; 上一页最后的 id）
select * from t where id &gt; #{last_id} order by id limit 10;</code></pre>
      <p>每次只扫描 10 行，O(limit) 而非 O(offset)。缺点：不支持跳页（只能上一页/下一页）。</p>
      <p><strong>4. 优化方案三：产品层妥协</strong></p>
      <ul>
        <li>限制最大翻页数（如只让翻前 100 页）。</li>
        <li>用"加载更多"替代传统分页。</li>
        <li>提供跳转到指定页但用搜索条件缩小范围。</li>
      </ul>
      <p><strong>5. 优化方案四：使用 between ... and</strong></p>
      <p>如果知道每页的 id 范围：where id between 100 and 110。要求 id 连续，局限性大。</p>
      <p><strong>6. 注意排序分页</strong></p>
      <p>带 order by 的分页更慢（要排序）。游标分页要求排序字段有序且唯一（如 id 或 (create_time, id)）。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>深度分页慢因为扫描了 offset 行但丢弃。优化：① 延迟关联（子查询走覆盖索引取主键再 join）；② 游标分页（记 last_id 用 where id&gt;last_id，性能最好但不支持跳页）；③ 产品限制翻页数。</p>`},
  {c:"MySQL",d:"★★",q:"InnoDB 和 MyISAM 有什么区别？",
   a:`<table><tr><th></th><th>InnoDB</th><th>MyISAM</th></tr>
      <tr><td>事务</td><td>支持</td><td>不支持</td></tr>
      <tr><td>锁粒度</td><td>行锁（支持高并发）</td><td>表锁</td></tr>
      <tr><td>外键</td><td>支持</td><td>不支持</td></tr>
      <tr><td>索引</td><td>聚簇索引（数据和主键索引在一起）</td><td>非聚簇（数据和索引分离）</td></tr>
      <tr><td>count(*)</td><td>要扫描（慢）</td><td>维护了总数（快）</td></tr>
      <tr><td>崩溃恢复</td><td>支持（redo log）</td><td>不支持</td></tr></table>
      <blockquote>结论：现在<strong>默认都是 InnoDB</strong>（MySQL 5.5 起），MyISAM 基本淘汰了。除非是只读的统计表才考虑 MyISAM。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心区别对比</strong></p>
      <ul>
        <li><strong>事务</strong>：InnoDB 支持 ACID 事务；MyISAM 不支持。</li>
        <li><strong>锁粒度</strong>：InnoDB 行锁（默认，高并发）；MyISAM 表锁（并发差）。</li>
        <li><strong>外键</strong>：InnoDB 支持；MyISAM 不支持。</li>
        <li><strong>索引结构</strong>：InnoDB 聚簇索引（数据和主键索引在一起）；MyISAM 非聚簇（.MYI 索引 + .MYD 数据分离，索引叶子存数据行地址）。</li>
        <li><strong>count(*)</strong>：MyISAM 维护了表总行数，count(*) O(1)；InnoDB 因 MVCC 要扫描。</li>
        <li><strong>崩溃恢复</strong>：InnoDB 有 redo log，崩溃后能恢复；MyISAM 无，损坏后修复困难。</li>
        <li><strong>全文索引</strong>：MyISAM 早期支持，InnoDB 5.6+ 也支持。</li>
      </ul>
      <p><strong>2. 文件存储</strong></p>
      <ul>
        <li>InnoDB：.frm（表结构）、.ibd（数据+索引，每表一个文件）。</li>
        <li>MyISAM：.frm（表结构）、.MYD（数据）、.MYI（索引）。</li>
      </ul>
      <p><strong>3. 适用场景</strong></p>
      <ul>
        <li>InnoDB：需要事务、高并发读写、数据完整性要求高。99% 场景。MySQL 5.5+ 默认。</li>
        <li>MyISAM：只读或读多写少、不需要事务、统计为主（如日志表、报表）。基本被淘汰。</li>
      </ul>
      <p><strong>4. 为什么 InnoDB 成为主流</strong></p>
      <p>事务 + 行锁（并发）+ 崩溃恢复 + 外键，这些是企业级应用必须的。MyISAM 的优势（count 快、全文索引）已不突出。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>InnoDB 支持事务+行锁+外键+聚簇索引+崩溃恢复（redo log），count 要扫描；MyISAM 不支持事务+表锁+非聚簇+count O(1)。MySQL 5.5 默认 InnoDB，MyISAM 基本淘汰。</p>`},
  {c:"MySQL",d:"★★",q:"当前读和快照读有什么区别？",
   a:`<ul>
        <li><strong>快照读</strong>：普通的 select，读的是<strong>历史版本（快照）</strong>，不加锁。通过 MVCC 实现，避免了读写冲突。例如 <code>select * from t</code>。</li>
        <li><strong>当前读</strong>：读取的是<strong>最新提交的数据</strong>，并加锁。比如 <code>select ... for update</code>、<code>update</code>、<code>delete</code>、<code>insert</code>。</li>
      </ul>
      <p>为什么 update 要当前读？因为要修改，必须拿到最新数据，否则基于旧快照修改会丢数据。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 快照读（Snapshot Read）</strong></p>
      <p>普通的 select，读取的是 MVCC 的<strong>一致性视图（历史版本快照）</strong>，<strong>不加锁</strong>。</p>
      <ul>
        <li>RC：每次 select 生成新 ReadView，读最新已提交数据。</li>
        <li>RR：复用第一次的 ReadView，可重复读。</li>
      </ul>
      <p>例子：select * from user where id=1。</p>
      <p><strong>2. 当前读（Current Read）</strong></p>
      <p>读取的是<strong>最新已提交的数据</strong>（不是快照），并<strong>加锁</strong>（行锁/间隙锁）。</p>
      <ul>
        <li>select ... lock in share mode：加 S 锁。</li>
        <li>select ... for update：加 X 锁。</li>
        <li>update/delete/insert：隐式当前读（要先读到最新数据再改），加 X 锁。</li>
      </ul>
      <p><strong>3. 为什么 update/delete 要当前读</strong></p>
      <p>修改操作必须基于<strong>最新数据</strong>。如果用快照读（旧版本），两个事务都基于旧值 +1，会丢失更新（一个事务的修改被覆盖）。当前读+加锁保证串行修改。</p>
      <p><strong>4. 当前读的加锁范围（RR）</strong></p>
      <ul>
        <li>等值查询唯一索引命中：记录锁。</li>
        <li>等值查询非唯一索引/未命中：临键锁（记录+间隙）。</li>
        <li>范围查询：临键锁。</li>
      </ul>
      <p>这就是 RR 用 next-key lock 解决幻读的原理（当前读加间隙锁阻止插入）。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>快照读是普通 select 读 MVCC 历史版本不加锁；当前读读最新数据并加锁（select for update/update/delete/insert）。update 要当前读是因为修改必须基于最新值，否则丢更新。RR 的当前读用 next-key lock 防幻读。</p>`},
  {c:"MySQL",d:"★★",q:"两阶段提交是什么？为什么需要？",
   a:`<p>两阶段提交是 MySQL 保证 <strong>redo log 和 binlog 一致性</strong>的机制（用于主从复制、崩溃恢复）。</p>
      <p>流程：</p>
      <ol>
        <li><strong>准备阶段</strong>：写 redo log，标记为 prepare 状态。</li>
        <li><strong>提交阶段</strong>：写 binlog，然后把 redo log 标记为 commit。</li>
      </ol>
      <p>崩溃恢复时：如果 redo log 是 commit，直接提交；如果是 prepare，看 binlog 有没有写完，写完了就提交，没写完就回滚。这样保证两个日志要么都成功要么都失败。</p>
      <blockquote>不这么做的问题：如果先写 redo 后写 binlog，redo 写完崩溃，binlog 没写，主库恢复后数据在，但从库没有这条数据，导致主从不一致。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么需要两阶段提交</strong></p>
      <p>redo log（InnoDB，保证持久性）和 binlog（Server，主从复制+归档）是两个独立的日志。如果不保证一致性，崩溃后可能出现主从不一致。</p>
      <p><strong>2. 不做两阶段提交的后果（举例）</strong></p>
      <ul>
        <li><strong>先 redo 后 binlog</strong>：redo 写完崩溃，binlog 没写。主库恢复后 redo 有数据（提交），但 binlog 没有这条 → 从库同步不到 → <strong>主有从无</strong>。</li>
        <li><strong>先 binlog 后 redo</strong>：binlog 写完崩溃，redo 没写。主库恢复后 redo 没有数据（回滚），但 binlog 有 → 从库同步了 → <strong>从有主无</strong>。</li>
      </ul>
      <p>两阶段提交解决这个不一致。</p>
      <p><strong>3. 两阶段提交流程</strong></p>
      <ol>
        <li><strong>Prepare 阶段</strong>：InnoDB 写 redo log，标记为 <strong>prepare</strong> 状态。</li>
        <li>Server 层写 <strong>binlog</strong>（写入 binlog 文件并 fsync）。</li>
        <li><strong>Commit 阶段</strong>：InnoDB 把 redo log 标记为 <strong>commit</strong> 状态。</li>
      </ol>
      <p><strong>4. 崩溃恢复的判断逻辑</strong></p>
      <ul>
        <li>扫描 redo log，找 prepare 状态的：</li>
        <li>redo log 已是 commit → <strong>提交</strong>（事务完成）。</li>
        <li>redo log 是 prepare：
          <ul>
            <li>检查对应事务的 binlog 是否<strong>完整（已写入）</strong>：完整则<strong>提交</strong>（binlog 写了说明要给从库，必须提交）。</li>
            <li>binlog 不完整 → <strong>回滚</strong>（事务没真正完成）。</li>
          </ul>
        </li>
      </ul>
      <p><strong>5. 为什么用 redo 的 prepare + binlog 完整性判断</strong></p>
      <p>因为 redo 是 prepare 说明 InnoDB 改了数据但未最终确认；binlog 完整说明 Server 层记录了（要从库同步），此时应提交保证主从一致；binlog 不完整说明没成功，回滚保证主库一致。</p>
      <p><strong>6. 组提交（Group Commit）</strong></p>
      <p>优化：多个事务的 binlog 一起 fsync（一次磁盘写），减少 IO。5.7+ 支持组提交。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>两阶段提交保证 redo 和 binlog 一致。流程：redo log prepare → 写 binlog → redo log commit。崩溃恢复：redo 是 commit 直接提交；是 prepare 看对应 binlog 是否完整——完整则提交，不完整回滚。不做会导致主从不一致。</p>`},
  {c:"MySQL",d:"★",q:"binlog 有哪几种格式？有什么区别？",
   a:`<ul>
        <li><strong>Statement</strong>：记 SQL 语句原文。日志小，但有些函数（如 now()）在主从执行结果可能不一致。</li>
        <li><strong>Row</strong>：记每行数据的变更（改前改后）。数据一致性好，但日志量大（特别是批量更新）。</li>
        <li><strong>Mixed</strong>：混合模式，普通用 statement，有风险的用 row。</li>
      </ul>
      <blockquote>推荐用 row（MySQL 5.7+ 默认），数据最可靠。缺点是占空间，可以通过 binlog_row_image=MINIMAL 优化。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Statement 格式（记 SQL）</strong></p>
      <ul>
        <li>记录 SQL 语句原文（如 update t set x=1 where id=5）。</li>
        <li><strong>优点</strong>：日志小（一条 SQL）；可读性好。</li>
        <li><strong>缺点</strong>：有些函数/语句在主从执行结果可能不一致，如 now()（时间不同）、uuid()、user()、依赖自增列顺序的语句、limit 无 order by（顺序不确定）。导致主从数据不一致。</li>
      </ul>
      <p><strong>2. Row 格式（记行变更）</strong></p>
      <ul>
        <li>记录每行数据的变更（改前改后的值），不是 SQL。</li>
        <li><strong>优点</strong>：数据一致性最好（精确到行）；能清楚知道改了什么；CDC（如 Canal、Debezium）基于 row 解析。</li>
        <li><strong>缺点</strong>：日志量大（批量 update 几百万行，每行都记）。</li>
        <li>优化：binlog_row_image=MINIMAL（只记必要字段）、FULL（全字段）。</li>
      </ul>
      <p><strong>3. Mixed 格式（混合）</strong></p>
      <ul>
        <li>MySQL 自动判断：普通 SQL 用 statement（省空间），有不确定函数/语句的用 row（保证一致）。</li>
        <li>折中方案。</li>
      </ul>
      <p><strong>4. 选择建议</strong></p>
      <ul>
        <li>5.7+ 默认 Row，推荐。</li>
        <li>需要 CDC（Canal 同步到 ES/缓存）必须用 Row。</li>
        <li>Statement 适合对一致性要求不高的简单场景。</li>
      </ul>
      <p><strong>5. 查看/设置</strong></p>
      <pre><code>SHOW VARIABLES LIKE 'binlog_format';
SET GLOBAL binlog_format = 'ROW';</code></pre>
      <p><strong>6. binlog 在主从复制和 CDC 的作用</strong></p>
      <p>主从复制：从库读 binlog 重放。CDC（Canal 伪装成 slave）：解析 Row 格式 binlog 得到数据变更，同步到 ES/Kafka/Redis。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>Statement 记 SQL 小但有函数不一致问题；Row 记行变更一致性好但大；Mixed 自动选择。5.7+ 默认 Row，CDC（Canal）需要 Row。</p>`},

  // ============ Redis 补充 ============
  {c:"Redis",d:"★★★",q:"Redis 的跳表（SkipList）原理？为什么用跳表不用红黑树？",
   a:`<p>跳表是 ZSet（有序集合）的底层结构之一。本质是<strong>多层链表</strong>：最底层是完整链表，上层每隔几个节点抽一个，形成"快速通道"，查找时从上层往下跳，类似二分，时间复杂度 O(logN)。</p>
      <p><strong>为什么 ZSet 用跳表不用红黑树</strong>：</p>
      <ul>
        <li>实现简单，代码好维护。</li>
        <li>范围查询友好（链表天然支持，遍历就行）。</li>
        <li>插入删除只需改相邻节点指针，红黑树要旋转调整。</li>
      </ul>
      <blockquote>每个节点层高是随机的（抛硬币决定），整体保持概率上的平衡。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 跳表的结构</strong></p>
      <p>多层有序链表。最底层（level 0）是完整链表，包含所有节点。上层每层从下层抽样（约一半），形成"索引层"。查找时从最高层开始，向右走，走不动就下一层，类似二分查找，时间复杂度 O(logN)。</p>
      <p><strong>2. 节点层高的确定</strong></p>
      <p>每个节点插入时，层高随机生成（抛硬币：连续正面的次数+1）。概率上每层节点数是下层的一半，整体保持平衡（期望高度 logN）。不需要像红黑树那样调整结构。</p>
      <p><strong>3. 时间复杂度</strong></p>
      <ul>
        <li>查找/插入/删除：O(logN)（期望）。</li>
        <li>范围查询：定位起点 O(logN) + 顺着链表遍历，高效。</li>
      </ul>
      <p><strong>4. 为什么 ZSet 用跳表不用红黑树（Redis 作者的解释）</strong></p>
      <ul>
        <li><strong>实现简单</strong>：跳表代码比红黑树简单得多，易维护、不易出 bug。</li>
        <li><strong>范围操作友好</strong>：ZSet 常用 ZRANGE（范围查询），跳表底层是链表，定位起点后顺着 next 指针遍历即可，O(logN + M)。红黑树范围查询要中序遍历，较复杂。</li>
        <li><strong>内存可控</strong>：每个节点只需多个 forward 指针，比红黑树的左右子+父指针+颜色灵活。</li>
        <li><strong>并发友好</strong>：跳表局部修改（改相邻指针）比红黑树旋转更易加锁（虽然 Redis 单线程不涉及）。</li>
      </ul>
      <p><strong>5. ZSet 的完整底层</strong></p>
      <p>ZSet = <strong>跳表（skiplist） + 哈希表（dict）</strong>。跳表支持有序操作（范围、排名），哈希表支持 O(1) 单元素查找（按 member 找 score）。两者配合，内存换性能。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>跳表是多层链表，查找从高到低类似二分 O(logN)。层高随机生成保持概率平衡。ZSet 用跳表而非红黑树：实现简单、范围查询友好（链表遍历）、插入删除改指针即可。ZSet 底层是跳表+哈希表。</p>`},
  {c:"Redis",d:"★★",q:"Redis 的 SDS（简单动态字符串）是什么？比 C 字符串好在哪？",
   a:`<p>SDS 是 Redis 自己实现的字符串，结构里有<strong>长度字段</strong>、<strong>剩余空间字段</strong>和字符数组。比 C 原生字符串好处：</p>
      <ul>
        <li><strong>O(1) 获取长度</strong>：C 字符串要遍历找 '\\0'，SDS 直接读长度字段。</li>
        <li><strong>二进制安全</strong>：SDS 靠长度字段判断结尾，不靠 '\\0'，可以存图片、序列化数据等二进制内容。</li>
        <li><strong>空间预分配</strong>：扩容时多分配空间，减少内存重分配次数。</li>
        <li><strong>缓冲区溢出保护</strong>：修改前检查空间够不够。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. SDS 结构</strong></p>
      <pre><code>struct sdshdr {
    int len;      // 已使用长度
    int alloc;    // 总分配空间（不含头和\0）
    char flags;   // 类型（区分 sdshdr5/8/16/32/64）
    char buf[];   // 实际字符数据
};</code></pre>
      <p>相比 C 字符串（char[]，以 '\\0' 结尾），SDS 多了 len 和 alloc 字段。</p>
      <p><strong>2. SDS 的优势</strong></p>
      <ul>
        <li><strong>O(1) 获取长度</strong>：直接读 len 字段。C 字符串 strlen 要遍历找 '\\0'，O(n)。</li>
        <li><strong>二进制安全</strong>：SDS 用 len 判断结束，不依赖 '\\0'。所以能存含 '\\0' 的二进制数据（图片、protobuf）。C 字符串遇到 '\\0' 就截断，不能存二进制。</li>
        <li><strong>杜绝缓冲区溢出</strong>：拼接前 SDS 检查空间是否足够，不够会自动扩容。C 字符串 strcat 不检查，可能溢出覆盖相邻内存。</li>
        <li><strong>空间预分配</strong>：扩容时不仅分配所需空间，还多分配（修改后 len &lt; 1M 则分配 2×len；≥1M 则多分配 1M）。减少连续修改时的内存重分配次数。</li>
        <li><strong>惰性空间释放</strong>：缩短时不立即释放多余空间（留作下次扩容用），避免频繁内存操作。需要时可手动 sdsRemoveFreeSpace。</li>
        <li><strong>兼容部分 C 字符串函数</strong>：buf 末尾仍保留 '\\0'，能直接用 printf("%s") 等。</li>
      </ul>
      <p><strong>3. SDS 的多种类型</strong></p>
      <p>Redis 3.2 后 SDS 有 5 种子类型（sdshdr5/8/16/32/64），len/alloc 用不同大小的整数（1/2/4字节等），短字符串省内存。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>SDS 比 C 字符串好：O(1)取长度（有len字段）、二进制安全（不靠\0）、防缓冲区溢出（自动检查扩容）、空间预分配+惰性释放减少内存操作。结构是 len+alloc+buf。</p>`},
  {c:"Redis",d:"★★",q:"Redis 字典的渐进式 rehash 是什么？",
   a:`<p>Redis 字典（Hash）扩容或缩容时，要把所有元素重新 hash 到新数组。如果数据量大，一次性 rehash 会让服务卡顿。</p>
      <p><strong>渐进式 rehash</strong>：不是一次性搬完，而是<strong>分多次、每次搬一小部分</strong>。每次字典操作（增删改查）时顺便搬一个桶，后台定时任务也在慢慢搬。</p>
      <p>rehash 期间，字典同时持有新旧两个哈希表，查找时两个都查，新增只往新表加。</p>
      <blockquote>好处：避免一次性 rehash 导致 Redis 阻塞，保持服务响应。这是 Redis 单线程下保证性能的关键设计。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 字典结构</strong></p>
      <p>Redis 字典 dict 有两个哈希表 ht[0]（当前用）和 ht[1]（rehash 时用），一个 rehashidx 字段（rehash 进度，-1 表示未 rehash）。</p>
      <p><strong>2. 为什么需要 rehash</strong></p>
      <p>哈希表的负载因子（元素数/桶数）过高时冲突多、性能下降，需要扩容（翻倍）；过低浪费内存，需要缩容。扩缩容都要把元素重新 hash 到新数组。</p>
      <p><strong>3. 为什么不能一次性 rehash</strong></p>
      <p>Redis 单线程，如果字典有几百万元素，一次性 rehash 会阻塞几秒，期间所有命令都无法处理。这违反 Redis 的低延迟原则。</p>
      <p><strong>4. 渐进式 rehash 流程</strong></p>
      <ol>
        <li>触发 rehash：分配新表 ht[1]（扩容翻倍或缩容），rehashidx 置 0。</li>
        <li><strong>每次字典操作（增删改查）时</strong>，顺便把 ht[0] 中 rehashidx 位置的一个桶的所有元素 rehash 到 ht[1]，rehashidx++。</li>
        <li>后台定时任务（serverCron）也会定期搬一批（每次 1ms 内搬 100 个桶）。</li>
        <li>全部搬完后，释放 ht[0]，ht[1] 变成 ht[0]，rehashidx 置 -1。</li>
      </ol>
      <p><strong>5. rehash 期间的读写规则</strong></p>
      <ul>
        <li><strong>读（查找）</strong>：先查 ht[0]，没有再查 ht[1]。</li>
        <li><strong>写（新增）</strong>：只往 ht[1] 加（ht[0] 不再加新元素）。</li>
        <li><strong>删/改</strong>：两个表都要处理。</li>
      </ul>
      <p><strong>6. 触发 rehash 的时机</strong></p>
      <ul>
        <li>扩容：负载因子 ≥ 1（没 BGSAVE）或 ≥ 5（有 BGSAVE，提高阈值避免和持久化抢内存）。</li>
        <li>缩容：元素少/桶多（负载因子 &lt; 0.1）。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>渐进式 rehash 是 Redis 字典扩缩容时分多次搬运元素，避免单线程一次性 rehash 阻塞。每次字典操作顺便搬一个桶，后台也搬。期间双表并存：读查两表、新增只入新表。触发：负载因子高扩容、低缩容。</p>`},
  {c:"Redis",d:"★★★",q:"Redis 6.0 的多线程是什么意思？还是单线程吗？",
   a:`<p><strong>Redis 6.0 引入多线程，但只用于"网络 IO"，命令执行仍然是单线程。</strong></p>
      <p>之前单线程的瓶颈不在 CPU（Redis 操作很快），而在<strong>网络 IO</strong>（读写 socket 数据）。6.0 用多线程处理网络数据的读取和写回，命令执行还是单线程串行，所以<strong>没有并发安全问题</strong>。</p>
      <blockquote>开启方式：io-threads-do-reads yes + io-threads N。本质：把耗时的网络 IO 多线程化，保留单线程命令执行的简洁和安全。所以"Redis 是单线程"这个说法在 6.0 后要修正。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么 6.0 引入多线程</strong></p>
      <p>Redis 单线程 + 内存操作，命令执行极快，CPU 不是瓶颈。但在高并发（几十万 QPS）下，<strong>网络 IO（读写 socket）成了瓶颈</strong>——单线程既要读请求、执行命令、又要写响应，网络读写占用大量时间。6.0 用多线程并行处理网络 IO 提升吞吐。</p>
      <p><strong>2. 6.0 多线程的范围</strong></p>
      <ul>
        <li><strong>网络 IO 多线程</strong>：读取客户端请求（read socket 解析协议）、写回响应（write socket）用多线程。</li>
        <li><strong>命令执行仍单线程</strong>：所有命令在一个主线程串行执行，保证数据安全（无并发问题）。</li>
      </ul>
      <p><strong>3. 工作流程</strong></p>
      <ol>
        <li>主线程（IO 线程）用 epoll 监听连接。</li>
        <li>有请求时，主线程把<strong>读取任务</strong>分发给 IO 线程组（并行读取+解析协议）。</li>
        <li>读取完成后，<strong>主线程串行执行命令</strong>（命令执行不并行）。</li>
        <li>执行完成后，主线程把<strong>写回任务</strong>分发给 IO 线程组（并行写回客户端）。</li>
      </ol>
      <p><strong>4. 为什么命令仍单线程</strong></p>
      <ul>
        <li><strong>避免并发安全问题</strong>：Redis 数据结构（如 list、hash）不是线程安全的，多线程执行命令要加锁，复杂且性能下降。</li>
        <li><strong>保持简洁</strong>：单线程执行避免了锁、上下文切换的复杂性和开销。</li>
        <li>命令执行本身就快（内存操作），单线程够用，瓶颈在网络而非计算。</li>
      </ul>
      <p><strong>5. 开启和配置</strong></p>
      <pre><code>io-threads 4              # IO 线程数（建议 CPU 核数，不超过8）
io-threads-do-reads yes   # 读也用多线程（默认只写多线程）</code></pre>
      <p>注意：对小数据量、低并发场景，多线程反而慢（线程切换开销）。适合高并发大数据场景。</p>
      <p><strong>6. "Redis 是单线程"还准确吗</strong></p>
      <p>严格说不完全准确：6.0 前"命令执行单线程"准确；6.0 后"网络 IO 多线程、命令执行单线程"。但核心数据操作仍单线程，所以一般仍说"单线程模型"，只是补充网络多线程。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>6.0 网络IO多线程（读请求、写响应并行），命令执行仍单线程（保证安全无锁）。因为高并发下网络IO成瓶颈而非CPU。开启 io-threads。"单线程"指命令执行，6.0后网络IO多线程。</p>`},
  {c:"Redis",d:"★★",q:"Redis 的事务（MULTI/EXEC）是什么？支持回滚吗？",
   a:`<p>Redis 事务用 MULTI 开启，把多条命令排队，EXEC 时一次性顺序执行。特点：</p>
      <ul>
        <li><strong>顺序执行</strong>：事务内的命令按顺序、不被其他客户端命令插入。</li>
        <li><strong>不支持回滚</strong>：如果某条命令运行时出错（比如对字符串做 INCR），后续命令<strong>仍会继续执行</strong>，不会回滚。</li>
        <li><strong>编译期错误会全部不执行</strong>：比如命令名拼错，整个事务都不会执行。</li>
      </ul>
      <p>WATCH 实现乐观锁：WATCH 一个 key，事务执行前如果这个 key 被改了，整个事务放弃执行。</p>
      <blockquote>Redis 事务更像是"批量执行"，不像 MySQL 事务那样保证 ACID。要保证原子性建议用 Lua 脚本。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Redis 事务的命令</strong></p>
      <ul>
        <li><strong>MULTI</strong>：开启事务，之后的命令进入队列（返回 QUEUED）。</li>
        <li><strong>EXEC</strong>：执行队列里的所有命令，返回每条的结果。</li>
        <li><strong>DISCARD</strong>：取消事务，清空队列。</li>
        <li><strong>WATCH key</strong>：监视 key（乐观锁），EXEC 前若 key 被修改，事务放弃（返回 nil）。</li>
        <li><strong>UNWATCH</strong>：取消监视。</li>
      </ul>
      <p><strong>2. 事务的特性</strong></p>
      <ul>
        <li><strong>顺序性</strong>：EXEC 执行期间命令不被其他客户端插入（Redis 单线程保证）。</li>
        <li><strong>排他性</strong>：事务执行期间独占。</li>
      </ul>
      <p><strong>3. 错误处理（重点，和 MySQL 不同）</strong></p>
      <ul>
        <li><strong>语法错误（命令名错、参数数错）</strong>：在入队时就能发现（2.6.5+）。EXEC 时<strong>整个事务都不执行</strong>（所有命令放弃）。</li>
        <li><strong>运行时错误（类型错误，如对字符串 INCR）</strong>：EXEC 时该条报错，但<strong>其他命令继续执行，不回滚</strong>。这是和 MySQL 事务最大的区别。</li>
      </ul>
      <p><strong>4. 为什么不支持回滚</strong></p>
      <p>Redis 作者的设计哲学：① Redis 命令错误通常是编程错误（bug），不应在生产发生，回滚没必要；② 不支持回滚保持内部简单、快速；③ 错误应该靠开发测试避免。</p>
      <p><strong>5. WATCH 乐观锁</strong></p>
      <p>场景：扣减库存，要先读再判断再改，保证不被覆盖。</p>
      <pre><code>WATCH stock        // 监视
val = GET stock
MULTI
SET stock val-1
EXEC               // 如果 stock 被改了，返回 nil，事务放弃，客户端重试</code></pre>
      <p><strong>6. Redis 事务 vs MySQL 事务</strong></p>
      <ul>
        <li>Redis：顺序执行 + 不回滚 + 无隔离级别概念。更像"批量执行"。</li>
        <li>MySQL：ACID + 隔离级别 + 回滚。真正的事务。</li>
      </ul>
      <p><strong>7. 替代方案：Lua 脚本</strong></p>
      <p>要保证原子性（多条命令要么全成功要么全失败的效果），用 Lua 脚本（执行期间不被打断），比事务更可靠。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>MULTI 开启命令入队，EXEC 顺序执行（不被插入）。语法错全部不执行，运行时错不回滚（继续执行）——这是和 MySQL 最大区别。WATCH 实现乐观锁。要原子性用 Lua 脚本。</p>`},
  {c:"Redis",d:"★★",q:"Redis 用 Lua 脚本有什么用？",
   a:`<p>Lua 脚本在 Redis 里执行时是<strong>原子</strong>的（因为 Redis 单线程，脚本执行期间不会被其他命令打断）。</p>
      <p>主要用途：</p>
      <ul>
        <li><strong>保证多条命令的原子性</strong>：比如"判断+删除"这种操作（实现分布式锁的解锁）。</li>
        <li>复杂业务逻辑（限流、库存扣减、排行榜更新）一次性完成，减少网络往返。</li>
      </ul>
      <p>用法：EVAL 脚本 key 参数，或 EVALSHA（传脚本 hash，省带宽）。</p>
      <blockquote>注意：脚本别写太复杂（会阻塞 Redis），要做的操作最好本地先测好。生产中分布式锁、限流常用 Lua 实现。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Lua 脚本的原子性</strong></p>
      <p>Redis 单线程，Lua 脚本执行期间不会被其他命令打断，所以脚本内的多条命令是<strong>原子执行</strong>的。这是 Lua 的核心价值——比事务（不支持回滚）更可靠的原子性。</p>
      <p><strong>2. 用法</strong></p>
      <pre><code>-- EVAL 脚本 numkeys key... arg...
EVAL "if redis.call('get', KEYS[1]) == ARGV[1] then return redis.call('del', KEYS[1]) else return 0 end" 1 lock_key uuid</code></pre>
      <ul>
        <li><strong>EVAL</strong>：执行脚本，传脚本内容 + key 列表 + 参数。</li>
        <li><strong>EVALSHA</strong>：先 SCRIPT LOAD 加载脚本得到 SHA1，之后用 EVALSHA + SHA1 调用，省去传脚本内容的带宽。Redisson 内部用这种。</li>
        <li>脚本内用 <code>redis.call</code>（出错中断）或 <code>redis.pcall</code>（出错返回错误对象）调 Redis 命令。</li>
        <li>KEYS[1]、ARGV[1] 接收外部参数（便于集群找 key，key 必须明确传）。</li>
      </ul>
      <p><strong>3. 典型应用</strong></p>
      <ul>
        <li><strong>分布式锁解锁</strong>：判断 value 是自己的再删除（GET + DEL 原子）。</li>
        <li><strong>限流</strong>：计数 + 判断 + 过期，原子完成（防并发超额）。</li>
        <li><strong>库存扣减</strong>：判断库存足够再扣减。</li>
        <li><strong>复杂原子操作</strong>：如"检查+更新+记录日志"原子完成。</li>
      </ul>
      <p><strong>4. 注意事项</strong></p>
      <ul>
        <li><strong>不要写耗时脚本</strong>：脚本执行期间 Redis 阻塞（其他命令等待），长脚本会导致卡顿。脚本应短小快速（&lt;几 ms）。</li>
        <li><strong>集群下的 key 限制</strong>：脚本操作的 key 必须在同一槽（用 hash tag），否则报错。</li>
        <li><strong>纯函数性</strong>：脚本不应有副作用（不要依赖外部状态、随机数等），因为可能重放（持久化恢复、主从复制）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Lua 脚本在 Redis 原子执行（单线程保证）。用途：分布式锁解锁（判断+删除原子）、限流、库存扣减。用法 EVAL/EVALSHA。注意脚本要短（防阻塞）、集群 key 同槽、纯函数。</p>`},
  {c:"Redis",d:"★★",q:"Redis 哨兵（Sentinel）是怎么工作的？怎么选主？",
   a:`<p>哨兵的作用：<strong>监控</strong>主从节点、自动<strong>故障转移</strong>（主挂了选个从当新主）、通知客户端。</p>
      <p><strong>故障转移流程</strong>：</p>
      <ol>
        <li><strong>主观下线</strong>：单个哨兵发现主节点没响应（ping 超时）。</li>
        <li><strong>客观下线</strong>：超过半数（quorum）哨兵都认为主挂了，确认下线。</li>
        <li><strong>选 Leader 哨兵</strong>：哨兵之间投票选一个负责故障转移。</li>
        <li><strong>选新主</strong>：从剩余从节点里选——优先级高的 &gt; 复制 offset 大的（数据新）&gt; runid 小的。</li>
        <li>把其他从节点指向新主，通知客户端。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Sentinel 的三大功能</strong></p>
      <ul>
        <li><strong>监控 Monitoring</strong>：定期 ping master/slave/sentinel，检测存活。</li>
        <li><strong>通知 Notification</strong>：故障时通知运维或客户端（订阅频道）。</li>
        <li><strong>自动故障转移 Automatic Failover</strong>：master 挂了，选新 master，让 slave 跟新 master，通知客户端。</li>
        <li><strong>配置提供 Configuration Provider</strong>：客户端连 Sentinel 获取 master 地址。</li>
      </ul>
      <p><strong>2. 监控机制</strong></p>
      <p>每个 Sentinel 定期（每秒）：① ping master/slave（判断存活）；② 向 master/slave 发 INFO 获取拓扑；③ 和其他 Sentinel 交换信息（pub/sub + PING）。</p>
      <p><strong>3. 故障转移详细流程</strong></p>
      <ol>
        <li><strong>主观下线（SDOWN）</strong>：单个 Sentinel 发现 master 在 down-after-milliseconds（如 30s）内无响应，标记为主观下线。</li>
        <li><strong>客观下线（ODOWN）</strong>：该 Sentinel 询问其他 Sentinel，超过 <strong>quorum</strong>（配置，如 2）个都认为下线 → 客观下线（确认真的挂了）。</li>
        <li><strong>选举 Leader Sentinel</strong>：需要故障转移，Sentinel 之间用 <strong>Raft 协议</strong>选一个 Leader 负责（先到先得，多数同意）。</li>
        <li><strong>Leader 执行故障转移</strong>：
          <ul>
            <li>从 slave 里<strong>选新 master</strong>（见下）。</li>
            <li>对新 master 发 SLAVEOF NO ONE（升级为主）。</li>
            <li>对其他 slave 发 SLAVEOF 新master，让它们复制新 master。</li>
            <li>更新配置，通知客户端（通过 pub/sub）。</li>
          </ul>
        </li>
      </ol>
      <p><strong>4. 选新 master 的规则</strong></p>
      <p>Leader 按优先级筛选 slave：</p>
      <ul>
        <li>过滤：断线的、长时间未响应的 slave 排除。</li>
        <li><strong>slave-priority 值小的优先</strong>（0 永不选为主，可配）。运维可手动指定优先级。</li>
        <li>优先级相同，选<strong>复制 offset 最大</strong>的（数据最新，丢失少）。</li>
        <li>offset 也相同，选 <strong>runid 字典序最小</strong>的（确定性，避免随机）。</li>
      </ul>
      <p><strong>5. 客户端如何感知</strong></p>
      <p>客户端连接 Sentinel（不是直连 master），获取 master 地址并缓存。master 变更时 Sentinel 通过订阅频道通知客户端更新。客户端重连时找 Sentinel 确认新地址。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Sentinel 监控主从、自动故障转移、通知客户端。流程：主观下线（单个判断）→ 客观下线（quorum 多数确认）→ Raft 选 Leader Sentinel → 选新master（priority小&gt;offset大&gt;runid小）→ slaveof no one + 通知。客户端连 Sentinel 获取 master 地址。</p>`},
  {c:"Redis",d:"★★",q:"Redis Cluster 的槽位（16384 槽）机制是怎样的？",
   a:`<p>Redis Cluster 把数据分散到多个节点，用<strong>哈希槽</strong>分区：</p>
      <ul>
        <li>一共 <strong>16384 个槽</strong>，均匀分配到各个主节点（比如 3 个主节点各分 0~5460、5461~10922、10923~16383）。</li>
        <li>存 key 时：<code>槽位 = CRC16(key) % 16384</code>，定位到对应节点。</li>
        <li>客户端缓存路由表，直接连对应节点。如果 key 不在该节点，返回 MOVED 重定向。</li>
      </ul>
      <p><strong>为什么是 16384</strong>：作者权衡的——太小心跳包大、太多浪费内存；16384 个槽，每个节点用 2KB 位图就能表示自己负责哪些槽，心跳包小。</p>
      <blockquote>注意：跨槽的多键操作受限（mset 多个 key 要在不同槽会失败），可以用 hash tag {} 让相关 key 路由到同一槽。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 数据分片：16384 哈希槽</strong></p>
      <p>Cluster 把数据分散到多个 master，每个 master 负责一部分哈希槽。</p>
      <ul>
        <li>一共 <strong>16384（2^14）个槽</strong>，分配到各 master。如 3 个 master：节点A 槽 0-5460，节点B 5461-10922，节点C 10923-16383。</li>
        <li>key 定位：<strong>slot = CRC16(key) mod 16384</strong>。CRC16 是哈希算法，分布均匀。</li>
        <li>槽是逻辑单位，可动态迁移（扩缩容时移动槽到新节点）。</li>
      </ul>
      <p><strong>2. 为什么是 16384（作者 Antirez 解释）</strong></p>
      <ul>
        <li><strong>心跳包大小</strong>：节点间定期发心跳带"我负责的槽位图"。16384 位 = 2KB，合理。如果 65536 位 = 8KB，心跳大。</li>
        <li><strong>集群规模</strong>：Redis 建议集群节点不超过 1000。16384 槽足够（每节点平均 16 槽），更多槽没必要。</li>
        <li><strong>压缩</strong>：实际节点少时位图可压缩传输。</li>
      </ul>
      <p><strong>3. 节点通信（Gossip 协议）</strong></p>
      <p>Cluster 是<strong>去中心化</strong>的（无中心代理），节点间用 Gossip 协议（PING/PONG/MEET）交换状态、槽位信息、故障信息。每个节点都存完整的集群路由表。</p>
      <p><strong>4. 客户端路由和重定向</strong></p>
      <ul>
        <li>客户端缓存槽位路由表（slot → node 映射），直接连对应节点。</li>
        <li>如果 key 不在当前节点，返回 <strong>MOVED 重定向</strong>（带正确节点地址），客户端更新路由表重试。</li>
        <li>槽迁移期间返回 <strong>ASK 临时重定向</strong>（不更新路由表，只本次重试）。</li>
      </ul>
      <p><strong>5. Hash Tag（让多 key 在同槽）</strong></p>
      <p>Cluster 限制：跨槽的多 key 操作（如 MGET、事务）会失败。要让相关 key 在同槽，用 <strong>hash tag {}</strong>：</p>
      <pre><code>SET {user:1000}:name "张三"
SET {user:1000}:age 20
// CRC16 只对 {} 内的 "user:1000" 计算，两个 key 都在同一槽</code></pre>
      <p>常用于需要原子操作的多 key 场景（用户的多字段、订单关联数据）。</p>
      <p><strong>6. 故障转移</strong></p>
      <p>master 挂了，它的 slave 被<strong>选举</strong>为新 master（类似 Sentinel 但集成在 Cluster）。其他节点通过 Gossip 发现并标记下线，多数确认后 slave 升级。</p>
      <p><strong>7. 扩缩容</strong></p>
      <p>扩容：新节点加入，从现有节点迁移一部分槽过去（槽迁移：标记 migrating/importing → 命令逐个迁移 → 更新路由）。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>16384 槽分配到各 master，CRC16(key)%16384 定位。16384 是心跳包(2KB位图)和集群规模的权衡。去中心化 Gossip 通信。MOVED/ASK 重定向。hash tag {} 让多 key 同槽支持原子操作。master 挂 slave 选举升级。</p>`},
  {c:"Redis",d:"★★",q:"布隆过滤器原理？能解决什么问题？",
   a:`<p>布隆过滤器是一种<strong>概率型数据结构</strong>，能高效判断"某个元素一定不存在或可能存在"。原理：一个很长的位数组 + 多个哈希函数。加入元素时，用多个哈希函数算出多个位置，把这些位置都置为 1。查询时，如果所有位置都是 1，说明"可能存在"；只要有任一位是 0，说明"一定不存在"。</p>
      <p><strong>特点</strong>：有误判率（说存在可能不存在），但不会漏判（说不存在就一定不存在）。不能删除。</p>
      <p><strong>解决缓存穿透</strong>：请求来先过布隆过滤器，不存在直接返回，不打到数据库。</p>
      <blockquote>误判率可以通过增大位数组、增加哈希函数降低。Redisson 提供了布隆过滤器的实现。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 布隆过滤器的原理</strong></p>
      <p>组成：一个 m 位的位数组（初始全 0）+ k 个哈希函数。</p>
      <ul>
        <li><strong>加入元素</strong>：用 k 个哈希函数对元素计算，得到 k 个位置，把位数组这些位置置 1（已是 1 保持）。</li>
        <li><strong>查询元素</strong>：同样 k 个哈希函数算位置。如果<strong>所有位置都是 1</strong> → "可能存在"（有误判）；如果<strong>任一位置是 0</strong> → "一定不存在"（不会漏判）。</li>
      </ul>
      <p><strong>2. 为什么有误判</strong></p>
      <p>不同元素的哈希位置可能重叠。元素 A 把某些位置 1，元素 B 的位置恰巧被 A（或其他元素）置 1 了，查询 B 时所有位都是 1，误判为存在。元素越多，误判率越高。</p>
      <p><strong>3. 为什么不会漏判</strong></p>
      <p>如果元素真的加入了，它对应的所有位置一定被置 1（不会变回 0），所以查询时所有位一定是 1，不会漏判为不存在。</p>
      <p><strong>4. 不能删除</strong></p>
      <p>因为多个元素共享位（哈希冲突），删一个元素清 0 会影响其他元素。改进：Counting Bloom Filter（用计数器代替位，可减，但更占内存）。</p>
      <p><strong>5. 误判率控制</strong></p>
      <p>误判率取决于：位数组大小 m、哈希函数数 k、元素数 n。增大 m（位数组）、增加 k（适当）可降低误判率。给定 n 和期望误判率 p，有公式算最优 m、k。</p>
      <p>一般：100 万元素、1% 误判率，约需 1.2MB 位数组、7 个哈希函数。</p>
      <p><strong>6. 应用场景</strong></p>
      <ul>
        <li><strong>缓存穿透</strong>：请求先过布隆过滤器，不存在直接拒绝（防 DB 被打）。</li>
        <li><strong>URL 去重</strong>：爬虫已爬过的 URL 判断。</li>
        <li><strong>邮件/账号去重</strong>：判断是否已存在。</li>
        <li><strong>恶意网站/黑名单</strong>：判断 URL 是否在黑名单。</li>
      </ul>
      <p><strong>7. Redis 中的实现</strong></p>
      <p>Redis 4.0+ 有 RedisBloom 模块（BF.ADD/BF.EXISTS）。或用 Redisson 的 RBloomFilter（基于 Redis 位图实现）。</p>
      <p><strong>8. 面试标准答法</strong></p>
      <p>位数组+k哈希函数。加入：k位置1。查询：全1可能存在（误判），有0一定不存在（不漏判）。不能删除（共享位）。解决缓存穿透（不存在直接拒）。误判率靠增大位数组、增加哈希函数降低。</p>`},
  {c:"Redis",d:"★★",q:"用 Redis 怎么实现排行榜？",
   a:`<p>用 <strong>ZSet（有序集合）</strong>实现，天然支持按分数排序。</p>
      <ul>
        <li><strong>更新分数</strong>：<code>ZINCRBY rank:game 100 用户ID</code>（加分）。</li>
        <li><strong>查 Top N</strong>：<code>ZREVRANGE rank:game 0 9 WITHSCORES</code>（取前10名，分数从高到低）。</li>
        <li><strong>查排名</strong>：<code>ZREVRANK rank:game 用户ID</code>（查某用户第几名）。</li>
        <li><strong>查分数</strong>：<code>ZSCORE rank:game 用户ID</code>。</li>
      </ul>
      <p>底层是跳表 + 哈希表，插入和排名查询都是 O(logN)，性能很好。</p>
      <blockquote>变体：实时排行榜用 ZSet，历史排行榜可以定期归档到数据库。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 为什么用 ZSet</strong></p>
      <p>ZSet（有序集合）每个元素关联一个 score，按 score 排序。底层<strong>跳表 + 哈希表</strong>：跳表支持有序范围查询 O(logN)，哈希表支持 O(1) 按元素查 score。完美契合排行榜需求。</p>
      <p><strong>2. 核心命令</strong></p>
      <pre><code>-- 加分 / 初始化
ZADD rank:game 1000 用户A        -- 设置分数
ZINCRBY rank:game 100 用户A      -- 加分（增量）

-- 查 Top N（从高到低）
ZREVRANGE rank:game 0 9 WITHSCORES   -- 前10名，返回 [用户,分数]

-- 查某用户排名
ZREVRANK rank:game 用户A         -- 第几名（0开始，从高到低）

-- 查某用户分数
ZSCORE rank:game 用户A

-- 范围查询（分数区间，如 500-1000 分的用户）
ZRANGEBYSCORE rank:game 500 1000

-- 删除
ZREM rank:game 用户A</code></pre>
      <p><strong>3. 复杂度</strong></p>
      <ul>
        <li>ZADD/ZINCRBY：O(logN)。</li>
        <li>ZREVRANGE：O(logN + M)（M 是返回数）。</li>
        <li>ZREVRANK/ZSCORE：O(logN)（哈希表 O(1) + 跳表定位）。</li>
      </ul>
      <p>百万级数据下毫秒级响应。</p>
      <p><strong>4. 实际设计要点</strong></p>
      <ul>
        <li><strong>key 设计</strong>：rank:{业务}:{周期}，如 rank:game:202401（月榜）。</li>
        <li><strong>member 用 ID</strong>（用户ID/商品ID），score 用积分/分数/时间。</li>
        <li><strong>相同分数处理</strong>：score 可加时间戳小数（如 score = 积分 + (1 - 时间戳/当前)/因子），让后达到的同分排前/后。</li>
        <li><strong>实时 + 历史分离</strong>：实时榜用 ZSet，历史榜定期归档到 MySQL。</li>
        <li><strong>集群注意</strong>：单个 ZSet 在一个槽，量极大时按维度拆分（如分区榜）。</li>
      </ul>
      <p><strong>5. 进阶场景</strong></p>
      <ul>
        <li><strong>多维度排行</strong>：日榜、周榜、月榜用不同 key，可用 ZUNIONSTORE 合并。</li>
        <li><strong>附近的人</strong>：用 GEO（基于 ZSet，score 是 GeoHash）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>用 ZSet：ZADD/ZINCRBY 加分，ZREVRANGE 查 TopN，ZREVRANK 查排名，ZSCORE 查分。底层跳表+哈希表 O(logN)。注意 score 同分处理、实时/历史分离、集群单槽限制。</p>`},
  {c:"Redis",d:"★★",q:"用 Redis 怎么实现限流？",
   a:`<p>常见几种方案：</p>
      <ul>
        <li><strong>固定窗口计数</strong>：每个时间窗口用一个 key，INCR 后判断是否超限。简单但有临界点突刺问题。</li>
        <li><strong>滑动窗口</strong>：用 ZSet，score 存时间戳，每次请求先清理过期（ZREMRANGEBYSCORE），再 ZCARD 数量判断，最后添加新请求。</li>
        <li><strong>令牌桶</strong>：用 Lua 脚本实现，按时速放入令牌，请求消费令牌。</li>
      </ul>
      <p>关键：<strong>判断+操作要用 Lua 脚本保证原子性</strong>，否则并发下会出问题。</p>
      <blockquote>生产中一般用现成方案：Redis + Lua、阿里 Sentinel、Resilience4j、或者网关层限流。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 限流的需求</strong></p>
      <p>控制单位时间内的请求数，保护系统（如每秒 100 次、每用户每分钟 10 次）。Redis 适合分布式限流（多实例共享计数）。</p>
      <p><strong>2. 方案一：固定窗口计数器</strong></p>
      <p>每个时间窗口用一个 key，计数。如每分钟限 100 次：key=rate:user:1:2024010115（含分钟），INCR 后判断。</p>
      <pre><code>INCR rate:{userId}:{minute}    // +1
EXPIRE ... 60                  // 设过期
if count &gt; 100 → 拒绝</code></pre>
      <p><strong>缺点：临界点突刺</strong>。如 0:59 来 100 个、1:01 又 100 个，窗口切换瞬间实际 200 个/2秒。可用但精度低。</p>
      <p><strong>3. 方案二：滑动窗口（推荐）</strong></p>
      <p>用 ZSet，member 唯一（请求ID）、score 是时间戳。</p>
      <pre><code>-- Lua 原子执行
local now = tonumber(ARGV[1])
ZREMRANGEBYSCORE key 0 now-60000   -- 清理60秒前的
local count = ZCARD key              -- 当前数量
if count &gt;= 100 then return 0 end    -- 超限拒绝
ZADD key now requestId               -- 添加本次
EXPIRE key 60
return 1</code></pre>
      <p>精确控制任意 60 秒窗口内最多 100 次，无临界突刺。</p>
      <p><strong>4. 方案三：令牌桶</strong></p>
      <p>按速率放入令牌（如每秒 10 个），桶有容量上限（如 100）。请求取一个令牌，没有则拒绝。允许突发（桶满时一次取多个）。</p>
      <p>用 Lua 实现：记录上次补充时间和令牌数，每次请求按时间差补充令牌，再判断够不够。</p>
      <p><strong>5. 关键：Lua 保证原子性</strong></p>
      <p>判断 + 计数 + 添加必须原子（Lua 脚本），否则并发下多个请求同时判断通过、同时计数，超额。</p>
      <p><strong>6. 生产方案</strong></p>
      <ul>
        <li>Redis + Lua 自定义（灵活）。</li>
        <li><strong>spring-cloud-starter-alibaba-sentinel</strong>（Sentinel 持久化规则到 Redis/文件）。</li>
        <li><strong>resilience4j-ratelimiter</strong>（应用内限流）。</li>
        <li><strong>网关层</strong>（Nginx limit_req、Spring Cloud Gateway RequestRateLimiter）。</li>
        <li><strong>Redis-Cell 模块</strong>（CL.THROTTLE 原子限流）。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>固定窗口（INCR+EXPIRE，有临界突刺）、滑动窗口（ZSet按时间戳，清理过期再判断）、令牌桶（Lua补充令牌消费）。关键是判断+计数用 Lua 保证原子。生产用 Sentinel/Gateway/Redis+Lua。</p>`},
  {c:"Redis",d:"★★",q:"Redis 和 Memcached 有什么区别？",
   a:`<table><tr><th></th><th>Redis</th><th>Memcached</th></tr>
      <tr><td>数据类型</td><td>丰富（String/List/Hash/Set/ZSet 等）</td><td>只有 String</td></tr>
      <tr><td>持久化</td><td>支持 RDB/AOF</td><td>不支持，重启数据丢</td></tr>
      <tr><td>集群</td><td>原生支持 Cluster</td><td>需客户端一致性哈希</td></tr>
      <tr><td>线程模型</td><td>单线程（6.0 网络多线程）</td><td>多线程</td></tr>
      <tr><td>单 value 大小</td><td>512MB</td><td>1MB</td></tr></table>
      <blockquote>结论：Redis 功能全面，基本是首选。Memcached 只在纯 KV 缓存、多线程场景有一点优势，现在用得少了。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 详细对比</strong></p>
      <table><tr><th>维度</th><th>Redis</th><th>Memcached</th></tr>
      <tr><td>数据类型</td><td>丰富（String/List/Hash/Set/ZSet/Bitmap/Geo...）</td><td>只有 String（纯 KV）</td></tr>
      <tr><td>持久化</td><td>RDB + AOF</td><td>不支持，重启数据丢失</td></tr>
      <tr><td>集群</td><td>原生 Cluster（16384 槽）</td><td>无原生集群，客户端一致性哈希分片</td></tr>
      <tr><td>线程模型</td><td>单线程（6.0 网络 IO 多线程）</td><td>多线程（master + worker）</td></tr>
      <tr><td>单 value</td><td>最大 512MB</td><td>默认 1MB</td></tr>
      <tr><td>事务</td><td>MULTI/EXEC（弱事务）</td><td>无</td></tr>
      <tr><td>过期策略</td><td>惰性 + 定期 + 多种淘汰</td><td>惰性删除（无淘汰策略）</td></tr>
      <tr><td>发布订阅</td><td>支持</td><td>不支持</td></tr>
      <tr><td>数据结构优化</td><td>SDS、跳表、ziplist 等丰富</td><td>简单 slab 分配</td></tr>
      <tr><td>内存管理</td><td>自己管理（jemalloc）</td><td>slab allocation（预分配）</td></tr></table>
      <p><strong>2. Memcached 的优势</strong></p>
      <ul>
        <li><strong>多线程</strong>：充分利用多核 CPU（Redis 单核，但 6.0 网络多线程缓解）。</li>
        <li><strong>纯内存极快</strong>：无持久化开销，纯 KV 操作很快。</li>
        <li><strong>简单稳定</strong>：功能少，bug 少。</li>
        <li>每 key 内存利用率高（无 Redis 的元数据开销）。</li>
      </ul>
      <p><strong>3. Redis 的优势</strong></p>
      <ul>
        <li>丰富的数据结构（支持复杂业务）。</li>
        <li>持久化（数据安全）。</li>
        <li>原生集群 + 高可用（哨兵/Cluster）。</li>
        <li>事务、Lua、发布订阅、过期、淘汰策略。</li>
      </ul>
      <p><strong>4. 选择</strong></p>
      <ul>
        <li>99% 场景选 Redis（功能全面）。</li>
        <li>Memcached 适合：纯 KV 大规模缓存、不需要持久化、多核利用、内存绝对敏感。如大公司的基础缓存层（部分场景）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>Redis 数据类型丰富、支持持久化、原生集群、单线程(6.0网络多线程)、单值512MB；Memcached 只有String、无持久化、客户端分片、多线程、单值1MB。Redis 功能全面基本首选，Memcached 在纯KV大缓存多核场景有少量优势。</p>`},
