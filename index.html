  {c:"网络",d:"★★★",q:"从浏览器输入 URL 到页面展示的全过程？",
   a:`<p>这是综合题，考察网络全栈：</p>
      <ol>
        <li><strong>DNS 解析</strong>：域名 → IP（本地缓存→本地 DNS→递归查询根/顶级/权威）。</li>
        <li><strong>建立 TCP 连接</strong>：三次握手。</li>
        <li>（HTTPS）<strong>TLS 握手</strong>：协商加密套件、交换证书和密钥。</li>
        <li><strong>发送 HTTP 请求</strong>：构造请求行、请求头、请求体。</li>
        <li><strong>服务器处理</strong>：反向代理（Nginx）→ 应用服务器（Tomcat）→ 业务逻辑 → 查 DB → 返回响应。</li>
        <li><strong>浏览器渲染</strong>：解析 HTML 构建 DOM、CSS 构建 CSSOM、合成渲染树、布局 layout、绘制 paint、合成。</li>
        <li><strong>断开连接</strong>：四次挥手（或 keep-alive 复用）。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. URL 解析</strong></p>
      <p>浏览器解析 URL（协议、域名、端口、路径、参数）。如果是搜索词则用默认搜索引擎。</p>
      <p><strong>2. DNS 解析（域名→IP）</strong></p>
      <p>① 浏览器 DNS 缓存 → ② 操作系统 DNS 缓存（hosts 文件）→ ③ 本地 DNS 服务器（如运营商）→ ④ 本地 DNS 递归查询：根域名服务器（→顶级 .com → 权威域名服务器）→ 拿到 IP → 缓存（按 TTL）→ 返回。</p>
      <p><strong>3. 建立 TCP 连接（三次握手）</strong></p>
      <p>客户端和服务端（IP+端口443/80）三次握手建立 TCP 连接（SYN→SYN+ACK→ACK）。</p>
      <p><strong>4. TLS 握手（HTTPS）</strong></p>
      <p>如 HTTPS，TCP 连接后做 TLS 握手：交换证书、协商加密套件、生成会话密钥。详见 HTTPS 题。</p>
      <p><strong>5. 发送 HTTP 请求</strong></p>
      <p>构造 HTTP 请求（请求行 GET /path HTTP/1.1、请求头、请求体），通过 TCP 发送。</p>
      <p><strong>6. 服务器处理并响应</strong></p>
      <p>请求 → 负载均衡/反向代理（Nginx）→ 应用服务器（Tomcat/Spring）→ DispatcherServlet → Controller → Service → DAO → DB → 返回。响应（状态行、响应头、响应体/HTML）。</p>
      <p><strong>7. 浏览器渲染</strong></p>
      <ol>
        <li><strong>解析 HTML 构建 DOM 树</strong>。</li>
        <li><strong>解析 CSS 构建 CSSOM 树</strong>。</li>
        <li>DOM + CSSOM 合成<strong>渲染树（Render Tree）</strong>（不可见元素如 display:none 不入）。</li>
        <li><strong>布局 Layout（回流）</strong>：计算每个元素的位置大小。</li>
        <li><strong>绘制 Paint</strong>：绘制像素。</li>
        <li><strong>合成 Composite</strong>：GPU 合成图层。</li>
        <li>期间遇到 CSS/JS/图片等资源会<strong>并行下载</strong>（JS 可能阻塞）。</li>
      </ol>
      <p><strong>8. 断开连接（四次挥手）</strong></p>
      <p>数据传完后四次挥手断开 TCP（或 keep-alive 复用连接）。</p>
      <p><strong>9. 面试标准答法</strong></p>
      <p>DNS解析→TCP三次握手→(HTTPS)TLS握手→发HTTP请求→服务器处理响应→浏览器渲染(HTML解析→DOM/CSSOM→渲染树→布局→绘制→合成)→TCP四次挥手。涉及网络全栈。</p>`},
  {c:"网络",d:"★★★",q:"TCP 三次握手和四次挥手？为什么是三次和四次？",
   a:`<p><strong>三次握手</strong>（建立连接）：</p>
      <ol>
        <li>客户端 → SYN, seq=x → 服务端。</li>
        <li>服务端 → SYN+ACK, seq=y, ack=x+1 → 客户端。</li>
        <li>客户端 → ACK, ack=y+1 → 服务端。</li>
      </ol>
      <p>为什么三次：确认双方都有发送和接收能力；防止历史失效连接请求让服务端白白建连。</p>
      <p><strong>四次挥手</strong>（断开）：</p>
      <ol>
        <li>客户端 → FIN → 服务端。</li>
        <li>服务端 → ACK（此时可能还有数据没发完）。</li>
        <li>服务端 → FIN。</li>
        <li>客户端 → ACK，进入 TIME_WAIT 等 2MSL 后关闭。</li>
      </ol>
      <p>为什么四次：TCP 全双工，每个方向关闭需独立 FIN+ACK。</p>
      <blockquote>TIME_WAIT 存在原因：① 确保最后 ACK 到达（丢失可重发）；② 让旧连接报文消失，避免影响新连接。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三次握手（建立 TCP 连接）</strong></p>
      <ol>
        <li><strong>客户端 → SYN, seq=x</strong>：客户端发 SYN（同步）包，进入 SYN_SENT。</li>
        <li><strong>服务端 → SYN+ACK, seq=y, ack=x+1</strong>：服务端确认并发 SYN，进入 SYN_RCVD。</li>
        <li><strong>客户端 → ACK, ack=y+1</strong>：客户端确认，双方 ESTABLISHED。</li>
      </ol>
      <p><strong>2. 为什么是三次（不是两次/四次）</strong></p>
      <ul>
        <li><strong>确认双向收发能力</strong>：① 客户端发 SYN（证明客户端能发）；② 服务端回 SYN+ACK（证明服务端能收能发）；③ 客户端回 ACK（证明客户端能收）。三次才能确认双向链路通。</li>
        <li><strong>防止历史失效连接</strong>：客户端发了 SYN 后网络延迟，旧的 SYN 到服务端，服务端回 SYN+ACK 建连。如果是两次握手，连接就建立了（白占资源）。三次握手时客户端收到 SYN+ACK 发现是自己不想建的（历史），回 RST 拒绝。</li>
        <li><strong>同步序列号</strong>：双方要同步初始序列号（ISN），三次才能双方都确认。</li>
      </ul>
      <p><strong>3. 四次挥手（断开连接）</strong></p>
      <ol>
        <li><strong>客户端 → FIN, seq=u</strong>：客户端表示没数据要发了，进入 FIN_WAIT_1。</li>
        <li><strong>服务端 → ACK, ack=u+1</strong>：服务端确认收到 FIN。但服务端<strong>可能还有数据没发完</strong>，进入 CLOSE_WAIT（半关闭）。</li>
        <li><strong>服务端 → FIN, seq=v</strong>：服务端数据发完了，发 FIN，进入 LAST_ACK。</li>
        <li><strong>客户端 → ACK, ack=v+1</strong>：客户端确认，进入 <strong>TIME_WAIT</strong>，等 2MSL 后 CLOSED。服务端收到 ACK 后 CLOSED。</li>
      </ol>
      <p><strong>4. 为什么是四次（不是三次）</strong></p>
      <p>TCP 是<strong>全双工</strong>（双向独立传输）。关闭是<strong>每个方向独立</strong>关闭：客户端 FIN（关客户端→服务端方向）+ 服务端 ACK。然后服务端 FIN（关服务端→客户端方向）+ 客户端 ACK。因为服务端收到 FIN 时可能还有数据要发（不能立即 FIN），所以 ACK 和 FIN 分开发（中间可能间隔）。所以是四次。</p>
      <p><strong>5. TIME_WAIT 的作用（2MSL）</strong></p>
      <ul>
        <li>① <strong>保证最后的 ACK 到达</strong>：如果客户端的 ACK 丢了，服务端会重发 FIN，客户端在 TIME_WAIT 还能收到重发的 FIN 并重发 ACK。如果客户端直接关闭，就收不到重发的 FIN，服务端一直重试。</li>
        <li>② <strong>让旧报文消失</strong>：等待 2MSL（最大报文生存时间），让本次连接的所有报文在网络中过期消失，防止影响复用同端口的新连接。</li>
      </ul>
      <p>缺点：主动关闭方会有 TIME_WAIT，大量短连接会产生大量 TIME_WAIT（占端口）。</p>
      <p><strong>6. SYN 攻击（半连接）</strong></p>
      <p>攻击者发大量伪造 SYN，服务端回 SYN+ACK 后等第三次 ACK（半连接队列满），正常请求进不来。防御：SYN Cookie（不分配资源直到 ACK）、SYN 队列限制。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>三次握手：SYN→SYN+ACK→ACK。三次因：确认双向收发能力、防历史失效连接、同步序列号。四次挥手：FIN→ACK→FIN→ACK。四次因：全双工每方向独立关闭，ACK和FIN分开（服务端可能还有数据）。TIME_WAIT(2MSL)保证ACK到达+旧报文消失。</p>`},
  {c:"网络",d:"★★★",q:"TCP 和 UDP 的区别？各适用什么场景？",
   a:`<table>对比：</table>
      <ul>
        <li><strong>TCP</strong>：面向连接、可靠（确认重传、滑动窗口、流量控制、拥塞控制）、有序、字节流、头部 20 字节。</li>
        <li><strong>UDP</strong>：无连接、不可靠、无序、数据报、头部 8 字节、快。</li>
      </ul>
      <p><strong>场景</strong>：</p>
      <ul>
        <li>TCP：HTTP/HTTPS、FTP、SMTP、SSH、数据库连接。</li>
        <li>UDP：DNS、视频/语音直播、游戏、QUIC（HTTP/3 基于 UDP）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 核心区别</strong></p>
      <table><tr><th></th><th>TCP</th><th>UDP</th></tr>
      <tr><td>连接</td><td>面向连接（三次握手建立）</td><td>无连接</td></tr>
      <tr><td>可靠性</td><td>可靠（确认、重传、校验）</td><td>不可靠（尽力而为）</td></tr>
      <tr><td>有序性</td><td>有序（按序到达）</td><td>无序</td></tr>
      <tr><td>传输</td><td>字节流（无边界）</td><td>数据报（有边界）</td></tr>
      <tr><td>流量/拥塞控制</td><td>有（滑动窗口、拥塞控制）</td><td>无</td></tr>
      <tr><td>头部</td><td>20 字节（最小）</td><td>8 字节</td></tr>
      <tr><td>速度</td><td>较慢（握手+确认）</td><td>快（无连接无确认）</td></tr>
      <tr><td>一对一</td><td>一对一</td><td>一对一/多播/广播</td></tr></table>
      <p><strong>2. TCP 的可靠传输机制</strong></p>
      <ul>
        <li><strong>序列号 + 确认</strong>：每个字节有序号，接收方 ACK 确认。</li>
        <li><strong>重传</strong>：超时未收到 ACK 重传；快重传（3个重复ACK）。</li>
        <li><strong>校验和</strong>：检测数据损坏。</li>
        <li><strong>滑动窗口</strong>：流量控制（接收方通告窗口）。</li>
        <li><strong>拥塞控制</strong>：慢启动、拥塞避免、快重传、快恢复。</li>
        <li>保证有序、不丢、不重、不坏。</li>
      </ul>
      <p><strong>3. 适用场景</strong></p>
      <ul>
        <li><strong>TCP</strong>：要求可靠传输——HTTP/HTTPS、FTP（文件）、SMTP（邮件）、SSH、数据库连接、RPC。数据要完整准确。</li>
        <li><strong>UDP</strong>：要求实时/高效/可丢——DNS（查询快）、视频/语音直播（丢几帧无所谓但卡顿不行）、游戏（实时性）、物联网、QUIC（HTTP/3，UDP+可靠性）。</li>
      </ul>
      <p><strong>4. 为什么视频用 UDP</strong></p>
      <p>视频实时性要求高，TCP 的重传会导致延迟（丢失的帧重传后已过期）。UDP 丢了就丢了（画面短暂花屏），保持流畅。当然现在有些用 TCP（如 HLS）+ 缓冲。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>TCP 面向连接可靠有序字节流(头部20B)，有确认重传/滑动窗口/拥塞控制，慢但可靠，用于HTTP/SSH/DB。UDP 无连接不可靠无序数据报(头部8B)，快但可能丢，用于DNS/视频/游戏/QUIC。TCP保证可靠，UDP保证实时高效。</p>`},
  {c:"网络",d:"★★★",q:"HTTP 和 HTTPS 的区别？HTTPS 的握手过程？",
   a:`<p><strong>HTTP</strong>：明文传输、端口 80、无身份认证、无完整性校验。</p>
      <p><strong>HTTPS = HTTP + TLS/SSL</strong>：加密、端口 443、用证书验证身份、防篡改。</p>
      <p><strong>TLS 握手（以 TLS 1.2 为例）</strong>：</p>
      <ol>
        <li>ClientHello：客户端发送支持的 TLS 版本、加密套件、随机数。</li>
        <li>ServerHello：服务端选定套件，返回随机数 + 证书。</li>
        <li>客户端验证证书（CA 签名链），生成 pre-master secret，用服务端公钥加密发送。</li>
        <li>双方根据三个随机数生成会话密钥。</li>
        <li>后续通信用对称加密（性能好）。</li>
      </ol>
      <blockquote>核心：非对称加密交换密钥，对称加密传输数据。兼顾安全和性能。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. HTTP vs HTTPS</strong></p>
      <table><tr><th></th><th>HTTP</th><th>HTTPS</th></tr>
      <tr><td>传输</td><td>明文</td><td>加密（TLS/SSL）</td></tr>
      <tr><td>端口</td><td>80</td><td>443</td></tr>
      <tr><td>证书</td><td>无</td><td>需要 CA 证书</td></tr>
      <tr><td>身份验证</td><td>无</td><td>有（证书）</td></tr>
      <tr><td>完整性</td><td>无</td><td>有（MAC 校验）</td></tr>
      <tr><td>安全</td><td>易被窃听/篡改/伪造</td><td>安全</td></tr>
      <tr><td>性能</td><td>快</td><td>略慢（TLS 握手+加密）</td></tr></table>
      <p>HTTPS = HTTP + TLS。TLS 提供：加密（保密）、证书（身份）、MAC（完整性）。</p>
      <p><strong>2. TLS 握手过程（TLS 1.2，2 RTT）</strong></p>
      <ol>
        <li><strong>ClientHello</strong>（1 RTT 开始）：客户端发支持的 TLS 版本、加密套件列表、客户端随机数（Client Random）。</li>
        <li><strong>ServerHello + Certificate + ServerHelloDone</strong>：服务端选定套件，返回服务端随机数（Server Random）+ <strong>证书</strong>（含公钥）。</li>
        <li><strong>客户端验证证书</strong>：检查 CA 签名链（信任 CA → 验签）、域名、有效期。不信任则警告。</li>
        <li><strong>客户端生成 pre-master secret</strong>，用<strong>服务端公钥（RSA）加密</strong>发送（或用 ECDHE 密钥交换）。服务端用私钥解密得到。</li>
        <li>双方用<strong>三个随机数</strong>（Client Random + Server Random + Pre-master）生成<strong>相同的会话密钥（Master Secret）</strong>。</li>
        <li>双方发 Finished（用会话密钥加密的握手摘要），验证握手无误。</li>
        <li><strong>后续通信用对称加密（会话密钥）</strong>。</li>
      </ol>
      <p>TLS 1.3 简化为 1 RTT（甚至 0-RTT 恢复），更安全更快。</p>
      <p><strong>3. 为什么用非对称+对称组合</strong></p>
      <ul>
        <li><strong>非对称加密（RSA/ECDHE）</strong>：用于<strong>密钥交换</strong>（安全地传递会话密钥）。因为非对称加密慢，只用来交换密钥。</li>
        <li><strong>对称加密（AES）</strong>：用于<strong>数据传输</strong>（双方用相同密钥）。因为对称加密快。</li>
        <li>这样兼顾安全（密钥交换安全）和性能（数据传输快）。</li>
      </ul>
      <p><strong>4. 证书的作用（防中间人）</strong></p>
      <p>证书由受信任的 CA（证书颁发机构）签名，含服务端公钥和身份。客户端内置 CA 公钥，能验签。中间人无法伪造 CA 签名，所以无法冒充。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>HTTP明文80端口不安全，HTTPS=HTTP+TLS加密443端口有证书。TLS握手：ClientHello(版本/套件/随机数)→ServerHello+证书(随机数)→验证书→客户端生成pre-master用公钥加密发→双方用三随机数生成会话密钥→后续对称加密传输。非对称换密钥，对称传数据兼顾安全性能。</p>`},
  {c:"网络",d:"★★",q:"HTTP 常见状态码？GET 和 POST 的区别？",
   a:`<p><strong>状态码</strong>：</p>
      <ul>
        <li>2xx 成功：200 OK、201 Created、204 No Content。</li>
        <li>3xx 重定向：301 永久、302 临时、304 Not Modified（协商缓存）。</li>
        <li>4xx 客户端错误：400 参数错、401 未认证、403 无权限、404 不存在、405 方法不允许、429 限流。</li>
        <li>5xx 服务端错误：500 内部错误、502 网关错误、503 不可用、504 网关超时。</li>
      </ul>
      <p><strong>GET vs POST</strong>：</p>
      <ul>
        <li>语义：GET 获取（幂等、可缓存）；POST 提交（非幂等）。</li>
        <li>参数位置：GET 在 URL（长度受限、被记录）；POST 在 body。</li>
        <li>安全：GET 不应改数据。</li>
      </ul>
      <blockquote>本质上都是 TCP 请求，区别是约定和浏览器/服务器行为。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. HTTP 状态码分类</strong></p>
      <ul>
        <li><strong>1xx 信息</strong>：100 Continue。少见。</li>
        <li><strong>2xx 成功</strong>：200 OK（标准成功）、201 Created（创建成功，POST 新建）、202 Accepted（异步任务已接收）、204 No Content（成功无返回体，DELETE）。</li>
        <li><strong>3xx 重定向</strong>：301 Moved Permanently（永久重定向，会缓存）、302 Found（临时重定向）、304 Not Modified（协商缓存命中，资源没变，用本地缓存）。</li>
        <li><strong>4xx 客户端错误</strong>：400 Bad Request（请求格式/参数错）、401 Unauthorized（未认证/未登录）、403 Forbidden（认证了但无权限）、404 Not Found（资源不存在）、405 Method Not Allowed（方法不允许，如对只支持 GET 的接口发 POST）、429 Too Many Requests（限流）。</li>
        <li><strong>5xx 服务端错误</strong>：500 Internal Server Error（服务端异常）、502 Bad Gateway（网关收不到上游有效响应，如上游挂了）、503 Service Unavailable（服务不可用，超载/维护）、504 Gateway Timeout（网关等待上游超时）。</li>
      </ul>
      <p>重点：200/201/204、301/302/304、400/401/403/404、500/502/503/504。</p>
      <p><strong>2. GET vs POST</strong></p>
      <table><tr><th></th><th>GET</th><th>POST</th></tr>
      <tr><td>语义</td><td>获取资源</td><td>提交/创建资源</td></tr>
      <tr><td>幂等</td><td>幂等（多次执行结果一样）</td><td>非幂等（每次提交可能创建新资源）</td></tr>
      <tr><td>参数</td><td>在 URL 查询串（?key=value）</td><td>在请求体（body）</td></tr>
      <tr><td>长度</td><td>URL 长度有限（浏览器限制，如 2KB）</td><td>body 几乎无限制</td></tr>
      <tr><td>缓存</td><td>可缓存（浏览器历史、CDN）</td><td>一般不缓存</td></tr>
      <tr><td>安全</td><td>参数暴露在 URL（被记录、收藏）</td><td>相对安全（在 body，但明文 HTTP 还是会被截获）</td></tr>
      <tr><td>类型</td><td>应只读不改数据</td><td>改数据（提交）</td></tr></table>
      <p><strong>3. 本质</strong></p>
      <p>GET 和 POST 底层都是 TCP 请求，技术上 GET 也能带 body、POST 也能用 URL 参数。区别是<strong>语义约定</strong>和浏览器/服务器的行为处理（如 GET 不 body 的规范）。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>状态码：200/201/204成功、301/302重定向、304协商缓存、400/401/403/404客户端错、500/502/503/504服务端错。GET幂等参数在URL可缓存只读，POST非幂等参数在body不缓存提交。本质都是TCP，区别是语义约定。</p>`},
  {c:"网络",d:"★★",q:"什么是对称加密和非对称加密？",
   a:`<ul>
        <li><strong>对称加密</strong>：加密和解密用<strong>同一个密钥</strong>（如 AES、DES）。快，但密钥分发是难题。</li>
        <li><strong>非对称加密</strong>：公钥加密，私钥解密（或反之签名）。如 RSA、ECC。慢，但解决密钥分发。</li>
      </ul>
      <blockquote>实际组合使用：HTTPS 用非对称加密交换对称密钥，之后通信用对称加密。数字签名：私钥签名、公钥验签，保证不可否认。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 对称加密</strong></p>
      <ul>
        <li>加密和解密用<strong>同一个密钥</strong>。双方共享密钥。</li>
        <li>算法：AES（主流，安全快）、DES（淘汰，56位不安全）、3DES、ChaCha20。</li>
        <li><strong>优点</strong>：速度快，适合大量数据加密。</li>
        <li><strong>缺点</strong>：<strong>密钥分发难题</strong>——双方怎么安全地把密钥给对方？密钥泄露就完了。</li>
      </ul>
      <p><strong>2. 非对称加密</strong></p>
      <ul>
        <li>一对密钥：<strong>公钥（public）和私钥（private）</strong>。公钥加密只能私钥解密；私钥加密（签名）只能公钥解密（验签）。</li>
        <li>算法：RSA（主流，慢）、ECC（椭圆曲线，更短密钥同等安全）、DSA、国密 SM2。</li>
        <li><strong>优点</strong>：解决密钥分发（公钥可公开，私钥保密）、支持数字签名。</li>
        <li><strong>缺点</strong>：<strong>慢</strong>（比对称慢100-1000倍），不适合大量数据。</li>
      </ul>
      <p><strong>3. 两者结合（HTTPS 的做法）</strong></p>
      <ul>
        <li>用<strong>非对称加密</strong>安全地交换<strong>对称密钥</strong>（会话密钥）。</li>
        <li>之后用<strong>对称加密</strong>传输数据（快）。</li>
        <li>兼顾安全（密钥交换安全）和性能（数据传输快）。</li>
      </ul>
      <p><strong>4. 数字签名（防篡改、防否认）</strong></p>
      <ul>
        <li>发送方用<strong>私钥签名</strong>（加密摘要），接收方用<strong>公钥验签</strong>（解密摘要对比）。</li>
        <li>作用：① 防篡改（内容改了签名对不上）；② 防否认（只有私钥持有者能签）；③ 身份认证（公钥对应某人）。</li>
        <li>HTTPS 证书用这个：CA 用私钥给证书签名，客户端用 CA 公钥验签。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>对称：同密钥加解密(AES)，快但密钥分发难。非对称：公私钥对(RSA)，公钥加密私钥解密，慢但解决密钥分发+支持签名。组合：非对称换对称密钥，对称传数据(HTTPS)。签名：私钥签公钥验，防篡改防否认。</p>`},
  {c:"网络",d:"★★",q:"浏览器缓存机制？强缓存和协商缓存？",
   a:`<p><strong>强缓存</strong>（不询问服务器，直接用本地）：</p>
      <ul>
        <li>Cache-Control: max-age=3600（HTTP1.1 优先）。</li>
        <li>Expires: 绝对时间（HTTP1.0）。</li>
      </ul>
      <p><strong>协商缓存</strong>（强缓存过期后问服务器是否变化）：</p>
      <ul>
        <li>Last-Modified / If-Modified-Since（精度秒）。</li>
        <li>ETag / If-None-Match（基于内容 hash，更精确）。</li>
        <li>未变化返回 304。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 浏览器缓存的作用</strong></p>
      <p>减少重复请求、降低服务器压力、加快页面加载、节省带宽。</p>
      <p><strong>2. 缓存流程</strong></p>
      <p>请求资源时：① 查<strong>强缓存</strong>（本地有效？有效直接用，200 from cache）；② 过期走<strong>协商缓存</strong>（问服务器，没变返回 304 用本地，变了返回 200 + 新资源）；③ 都没有则正常请求。</p>
      <p><strong>3. 强缓存（不发请求，直接用本地）</strong></p>
      <ul>
        <li><strong>Cache-Control（HTTP/1.1，优先）</strong>：
          <ul>
            <li>max-age=秒：缓存有效期（相对时间，如 3600 秒）。</li>
            <li>no-cache：不直接用强缓存（每次走协商缓存，确认是否变化）。</li>
            <li>no-store：完全不缓存（每次都重新请求）。</li>
            <li>public/private：是否允许中间代理缓存。</li>
          </ul>
        </li>
        <li><strong>Expires（HTTP/1.0，绝对时间）</strong>：过期时间点（Expires: Wed, 09 Aug 2026 00:00:00 GMT）。缺点：依赖客户端时间，不准。</li>
        <li>两者都有时，Cache-Control 优先。</li>
      </ul>
      <p>命中强缓存时，浏览器<strong>不发请求</strong>，直接用本地，状态 200（from disk/memory cache）。</p>
      <p><strong>4. 协商缓存（发请求问服务器，没变返回304）</strong></p>
      <p>强缓存过期后，浏览器发请求（带缓存标识）问服务器资源是否变化：</p>
      <ul>
        <li><strong>Last-Modified / If-Modified-Since（HTTP/1.0）</strong>：服务器返回 Last-Modified（资源最后修改时间）。下次请求带 If-Modified-Since。服务器对比，没变返回 304（用本地），变了返回 200+新资源+新 Last-Modified。<strong>精度秒</strong>（1秒内改多次检测不到）。</li>
        <li><strong>ETag / If-None-Match（HTTP/1.1，优先）</strong>：服务器返回 ETag（资源内容的 hash/版本）。下次请求带 If-None-Match。服务器对比 ETag，没变返回 304，变了返回 200+新资源+新 ETag。<strong>基于内容，精确</strong>（内容变了 ETag 变）。</li>
        <li>两者都有，ETag 优先。</li>
      </ul>
      <p><strong>5. 缓存决策示例</strong></p>
      <ul>
        <li>HTML 等入口文件：no-cache（每次协商，及时更新）。</li>
        <li>带 hash 的静态资源（如 app.a1b2c3.js）：max-age=31536000（一年强缓存，内容变 hash 变，引用更新）。</li>
        <li>敏感数据：no-store。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>强缓存(不发请求直接用)：Cache-Control(max-age/no-cache/no-store)优先于Expires。协商缓存(发请求问服务器)：Last-Modified/If-Modified-Since(秒精度)和ETag/If-None-Match(内容hash精确，优先)，未变返回304。流程：强缓存有效→直接用，过期→协商缓存→304用本地/200新资源。</p>`},

  // ---------- 分布式 / 微服务 ----------
  {c:"分布式",d:"★★★",q:"CAP 理论和 BASE 理论是什么？",
   a:`<p><strong>CAP</strong>：分布式系统最多满足其中两个：</p>
      <ul>
        <li><strong>C 一致性</strong>（Consistency）：所有节点数据一致。</li>
        <li><strong>A 可用性</strong>（Availability）：每个请求都有响应（不保证最新）。</li>
        <li><strong>P 分区容错</strong>（Partition tolerance）：网络分区时仍能工作。</li>
      </ul>
      <blockquote>分布式 P 必选，只能在 CP（如 ZK、etcd、Redis 主从切换时）和 AP（如 Eureka、Redis 集群日常）间选。</blockquote>
      <p><strong>BASE</strong>（对 CAP 中 AP 的延伸）：</p>
      <ul>
        <li>Basically Available 基本可用（降级、限流）。</li>
        <li>Soft state 软状态（允许中间状态）。</li>
        <li>Eventually consistent 最终一致性。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. CAP 定理</strong></p>
      <p>分布式系统在<strong>网络分区（P）发生时</strong>，只能在一致性（C）和可用性（A）间二选一：</p>
      <ul>
        <li><strong>C 一致性</strong>：所有节点同一时刻看到的数据一致（强一致）。写操作要同步到所有节点才返回成功。</li>
        <li><strong>A 可用性</strong>：每个请求都能得到非错误响应（不保证最新数据）。</li>
        <li><strong>P 分区容错</strong>：网络分区（节点间通信失败）时系统仍能运行。</li>
      </ul>
      <p><strong>2. 为什么 P 必选</strong></p>
      <p>分布式系统网络不可能永远正常，分区必然发生。所以 P 必选。当 P 发生时，要么牺牲 C（允许部分节点数据旧，保证可用），要么牺牲 A（部分节点拒绝服务，保证一致）。</p>
      <p><strong>3. CP vs AP 选型</strong></p>
      <ul>
        <li><strong>CP（强一致）</strong>：ZooKeeper、etcd、Redis 主从切换时（写要多数确认）。适合配置管理、分布式锁。</li>
        <li><strong>AP（高可用）</strong>：Eureka、Cassandra、Redis 集群日常。适合注册中心、缓存。</li>
        <li>Nacos 默认 AP（临时实例），可切换 CP（持久实例）。</li>
      </ul>
      <p>注意：CAP 不是"三选二"那么简单，是"分区时 C 和 A 二选一"。无分区时三者都可。</p>
      <p><strong>4. BASE 理论（CAP 中 AP 的延伸）</strong></p>
      <p>互联网场景追求高可用，放弃强一致，走向最终一致：</p>
      <ul>
        <li><strong>Basically Available 基本可用</strong>：故障时允许降级（响应慢、返回兜底数据、限流），保证核心可用。</li>
        <li><strong>Soft State 软状态</strong>：允许数据存在中间状态（如复制延迟、支付中），不要求时刻强一致。</li>
        <li><strong>Eventually Consistent 最终一致</strong>：数据最终会一致（同步完成），但不保证实时。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>CAP：分区时 C 和 A 二选一，P 必选。CP（ZK/etcd 强一致）vs AP（Eureka/Redis 高可用）。BASE 是 AP 的延伸：基本可用、软状态、最终一致。互联网多用 BASE 牺牲强一致换高可用。</p>`},
  {c:"分布式",d:"★★",q:"分布式事务有哪些解决方案？",
   a:`<ol>
        <li><strong>2PC（两阶段提交）</strong>：协调者 prepare→commit。强一致但阻塞、单点、性能差。XA 协议。</li>
        <li><strong>TCC（Try-Confirm-Cancel）</strong>：业务侵入大，每个操作写补偿。性能好。</li>
        <li><strong>本地消息表</strong>：业务表+消息表同库事务，定时扫消息表发 MQ。最终一致。</li>
        <li><strong>事务消息</strong>（RocketMQ）：半消息→本地事务→commit/rollback。最终一致。</li>
        <li><strong>Saga</strong>：长事务拆成一系列子事务，失败时执行补偿。适合长流程。</li>
        <li><strong>Seata</strong>：阿里开源，支持 AT（默认，无侵入，基于 undo log 回滚）、TCC、Saga、XA 模式。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 2PC（两阶段提交 / XA 协议）</strong></p>
      <ul>
        <li>协调者发 prepare，各参与者准备（写 undo/redo，锁资源）；都 yes 则 commit，否则 rollback。</li>
        <li><strong>优点</strong>：强一致。</li>
        <li><strong>缺点</strong>：同步阻塞（资源锁定）、协调者单点、参与者超时问题、性能差。</li>
        <li>用于数据库 XA、Seata XA 模式。少用。</li>
      </ul>
      <p><strong>2. TCC（Try-Confirm-Cancel）</strong></p>
      <ul>
        <li>Try（预留资源，如冻结余额）→ 全部成功 Confirm（确认提交）→ 任一失败 Cancel（回滚预留）。</li>
        <li><strong>优点</strong>：性能好（不长期锁资源）、最终一致。</li>
        <li><strong>缺点</strong>：业务侵入大（每个操作要写 Try/Confirm/Cancel 三个方法）、要保证幂等、处理空回滚/悬挂。</li>
      </ul>
      <p><strong>3. 本地消息表（可靠消息最终一致）</strong></p>
      <ul>
        <li>业务库里有"业务表 + 消息表"，业务操作和写消息表在<strong>同一本地事务</strong>。后台定时扫消息表把消息发到 MQ（失败重试）。消费方消费后更新业务。</li>
        <li><strong>优点</strong>：保证业务和消息一致（同事务）、最终一致。</li>
        <li><strong>缺点</strong>：业务库耦合消息表、定时扫描有延迟。</li>
      </ul>
      <p><strong>4. 事务消息（RocketMQ）</strong></p>
      <ul>
        <li>半消息（消费者看不到）→ 执行本地事务 → commit（半消息转正常）/ rollback（删除）。有回查机制。</li>
        <li>和本地消息表类似，但消息一致性交给 MQ 保证。详见框架分类的 RocketMQ 事务消息题。</li>
      </ul>
      <p><strong>5. Saga</strong></p>
      <ul>
        <li>长事务拆成一系列正向操作 T1,T2...Tn，任一失败执行反向补偿 Cn...C1。</li>
        <li>无全局锁，最终一致。适合长流程业务（如旅行预订：机票+酒店+租车）。</li>
        <li>缺点：补偿逻辑复杂、中间状态可见。</li>
      </ul>
      <p><strong>6. Seata（阿里开源，主流）</strong></p>
      <ul>
        <li><strong>AT 模式（默认）</strong>：无侵入。基于本地 ACID + undo log。第一阶段：业务 + 记录 undo log + 提交本地事务（释放锁，快）。第二阶段：成功删除 undo log，失败用 undo log 反向回滚。有全局锁保证写隔离。</li>
        <li><strong>TCC 模式</strong>：手写 Try/Confirm/Cancel。</li>
        <li><strong>Saga 模式</strong>：长流程补偿。</li>
        <li><strong>XA 模式</strong>：强一致，2PC。</li>
        <li>三个角色：TC（事务协调者）、TM（事务管理器）、RM（资源管理器）。</li>
      </ul>
      <p><strong>7. 选型</strong></p>
      <ul>
        <li>强一致、性能不敏感：XA。</li>
        <li>高并发、最终一致：AT（无侵入首选）或 RocketMQ 事务消息。</li>
        <li>长流程：Saga。</li>
        <li>非 Java/复杂场景：本地消息表。</li>
      </ul>
      <p><strong>8. 面试标准答法</strong></p>
      <p>2PC（强一致但阻塞）、TCC（侵入大但性能好）、本地消息表（业务+消息表同事务）、RocketMQ事务消息（半消息+回查）、Saga（补偿）、Seata（AT默认无侵入基于undo log，TCC/Saga/XA）。生产多用 AT 或事务消息。</p>`},
  {c:"分布式",d:"★★",q:"分布式 ID 生成方案有哪些？",
   a:`<ul>
        <li><strong>UUID</strong>：简单，无序（B+ 树插入差），太长。</li>
        <li><strong>数据库自增</strong>：简单，单点瓶颈。可分库分表用步长。</li>
        <li><strong>号段模式</strong>（美团 Leaf）：DB 批量取一段缓存到内存，发完再取。性能高。</li>
        <li><strong>雪花算法 Snowflake</strong>：64 位 = 1 符号位 + 41 时间戳 + 10 机器ID + 12 序列号。单机每秒百万级。问题：时钟回拨。</li>
        <li><strong>Redis incr</strong>：性能好但依赖 Redis 可用性。</li>
        <li><strong>Zookeeper</strong>：顺序节点。性能低。</li>
      </ul>
      <blockquote>主流：Leaf、Tinyid（滴滴）、雪花算法变种。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 分布式 ID 的要求</strong></p>
      <p>全局唯一、趋势递增（B+树友好）、高性能、高可用、安全（不易被猜测）。</p>
      <p><strong>2. 方案对比</strong></p>
      <ul>
        <li><strong>UUID</strong>：本地生成，无中心，简单。缺点：无序（B+树插入碎片多、页分裂）、太长（128位）、不可读。适合不需要排序的场景。</li>
        <li><strong>数据库自增（单库）</strong>：简单、有序。缺点：单点瓶颈、暴露业务量。分库分表时用<strong>步长</strong>（如库1%2=0开始，库2%2=1开始，步长2）。</li>
        <li><strong>号段模式（Segment）</strong>：DB 一次分配一段（如 1000-2000）缓存到应用内存，发完再取下一段。减少 DB 访问，高性能。美团 Leaf-Segment 用这个。</li>
        <li><strong>雪花算法 Snowflake（主流）</strong>：64 位 long：1 符号位 + 41 位时间戳（约69年）+ 10 位机器 ID（1024 节点）+ 12 位序列号（每毫秒 4096 个）。单机每秒 400 万+。优点：有序、高性能、去中心化。缺点：<strong>时钟回拨</strong>（机器时间倒退，可能重复）。</li>
        <li><strong>Redis INCR</strong>：原子自增，性能好。缺点：依赖 Redis 可用性、ID 连续（暴露量）。可用 Redis 集群分段。</li>
        <li><strong>Zookeeper 顺序节点</strong>：创建顺序节点拿到序号。缺点：性能低（ZK 写慢）、依赖 ZK。</li>
      </ul>
      <p><strong>3. 雪花算法的时钟回拨问题</strong></p>
      <p>机器时间被 NTP 同步回退，可能导致同一毫秒序列号重复。解决：① 拒绝回拨（时间小于上次则报错/等待）；② 拨回小范围用历史时间 + 序列扩展；③ 百度 UidGenerator 用未来时间预分配。</p>
      <p><strong>4. 主流开源方案</strong></p>
      <ul>
        <li><strong>Leaf（美团）</strong>：支持 Segment（号段）+ Snowflake 双模式。</li>
        <li><strong>Tinyid（滴滴）</strong>：号段模式，多 DB 支持。</li>
        <li><strong>UidGenerator（百度）</strong>：雪花算法变种，解决回拨。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>UUID（无序长）、DB自增（单点）、号段模式（批量取段缓存，Leaf）、雪花算法（64位=时间+机器+序列，主流但要处理时钟回拨）、Redis/ZK。生产用 Leaf/Tinyid/雪花。</p>`},
  {c:"分布式",d:"★★",q:"负载均衡有哪些算法？",
   a:`<ul>
        <li><strong>轮询</strong> Round Robin：依次分配。</li>
        <li><strong>加权轮询</strong>：按服务器性能分配权重（Nginx 默认）。</li>
        <li><strong>随机</strong>。</li>
        <li><strong>加权随机</strong>。</li>
        <li><strong>IP 哈希</strong>：同一 IP 固定到同一服务器（会话保持）。</li>
        <li><strong>最少连接</strong> Least Connections：选当前连接最少的。</li>
        <li><strong>一致性哈希</strong>：解决节点增减时大面积缓存失效。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 常见算法</strong></p>
      <ul>
        <li><strong>轮询 Round Robin</strong>：按顺序 1,2,3,1,2,3... 平均分配。简单，但没考虑服务器性能差异。</li>
        <li><strong>加权轮询 Weighted Round Robin</strong>：按权重分配（性能好的权重大，分到更多请求）。Nginx 默认。</li>
        <li><strong>随机 Random</strong>：随机选一个。简单。</li>
        <li><strong>加权随机</strong>：按权重概率随机。</li>
        <li><strong>IP Hash</strong>：对客户端 IP 哈希，同一 IP 固定到同一服务器。用于<strong>会话保持</strong>（Session 粘性）。缺点：服务器增减会导致大量重映射。</li>
        <li><strong>最少连接 Least Connections</strong>：选当前活跃连接数最少的服务器。动态，适合请求耗时不均。</li>
        <li><strong>一致性哈希 Consistent Hash</strong>：把服务器和请求都映射到哈希环，顺时针找节点。节点增减只影响相邻段。用于<strong>缓存/分布式存储</strong>（如 Memcached、Redis 客户端分片）。</li>
      </ul>
      <p><strong>2. 客户端负载均衡 vs 服务端负载均衡</strong></p>
      <ul>
        <li><strong>服务端</strong>：Nginx、F5、LVS。独立的负载均衡器，请求先到它，再转发。客户端不感知后端。</li>
        <li><strong>客户端</strong>：Ribbon、Spring Cloud LoadBalancer。客户端从注册中心拉服务列表，自己选一个调用。无中间层，少一跳。Dubbo、Feign+Ribbon 用这种。</li>
      </ul>
      <p><strong>3. 各场景的选择</strong></p>
      <ul>
        <li>Web 反向代理（Nginx）：加权轮询、IP Hash。</li>
        <li>RPC（Dubbo）：随机（默认）、轮询、最少活跃数、一致性哈希、最短响应。</li>
        <li>缓存（Redis/Memcached）：一致性哈希（+虚拟节点）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>轮询、加权轮询（Nginx默认）、随机、加权随机、IP Hash（会话保持）、最少连接、一致性哈希（缓存场景，节点增减影响小）。分客户端（Ribbon）和服务端（Nginx）负载均衡。</p>`},
  {c:"分布式",d:"★★",q:"限流算法有哪些？怎么实现？",
   a:`<ul>
        <li><strong>计数器</strong>：单位时间内计数，超了拒绝。临界点会有突刺。</li>
        <li><strong>滑动窗口</strong>：把时间切成小格滑动，平滑计数（Sentinel 用）。</li>
        <li><strong>漏桶</strong> Leaky Bucket：请求进桶，固定速率漏出。平滑但无法应对突发。</li>
        <li><strong>令牌桶</strong> Token Bucket：固定速率往桶里放令牌，请求拿令牌。允许突发（Guava RateLimiter、Nginx）。</li>
      </ul>
      <blockquote>实现：单机用 Guava RateLimiter、Caffeine；分布式用 Redis+Lua 或 Sentinel、Resilience4j。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 计数器（固定窗口）</strong></p>
      <p>每个时间窗口（如1秒）维护计数，超阈值拒绝，窗口结束重置。<strong>缺点：临界突刺</strong>——0.9s 来 100 个、1.1s 又 100 个，2 秒内 200 个（窗口切换瞬间翻倍）。</p>
      <p><strong>2. 滑动窗口</strong></p>
      <p>把窗口分成小格（如 1 秒分 10 个 100ms 格），窗口随时间滑动。统计当前窗口内所有格的总量。<strong>解决临界突刺</strong>，更平滑。Sentinel 用这个。</p>
      <p><strong>3. 漏桶（Leaky Bucket）</strong></p>
      <p>请求像水滴进入漏桶，桶以<strong>固定速率</strong>漏水（处理请求）。桶满则拒绝（溢出）。</p>
      <ul>
        <li>特点：<strong>平滑输出</strong>，无论请求多突发，处理速率恒定。</li>
        <li>缺点：<strong>无法应对突发</strong>（突发流量被丢弃）。</li>
        <li>适合：保护下游处理能力固定的系统（如调第三方 API）。</li>
      </ul>
      <p><strong>4. 令牌桶（Token Bucket，最常用）</strong></p>
      <p>以固定速率往桶里放令牌（满则丢弃），请求来时拿一个令牌，拿不到拒绝。</p>
      <ul>
        <li>特点：<strong>允许突发</strong>——桶里累积的令牌可一次性消费（短暂突发流量通过）。</li>
        <li>适合：限制平均速率但允许短时突发（如 API 限流）。</li>
        <li>Guava RateLimiter、Nginx limit_req（漏桶/令牌桶）、Sentinel 用令牌桶。</li>
      </ul>
      <p><strong>5. 漏桶 vs 令牌桶</strong></p>
      <ul>
        <li>漏桶：固定速率<strong>出水</strong>（处理），平滑，不允突发。</li>
        <li>令牌桶：固定速率<strong>放令牌</strong>，允许突发（攒令牌）。</li>
        <li>多数业务场景用令牌桶（允许合理突发）。</li>
      </ul>
      <p><strong>6. 实现</strong></p>
      <ul>
        <li><strong>单机</strong>：Guava RateLimiter（令牌桶）、Java Semaphore、Bucket4j。</li>
        <li><strong>分布式</strong>：Redis + Lua（原子）、Sentinel（集群限流）、Resilience4j、Spring Cloud Gateway RequestRateLimiter（基于 Redis）。</li>
        <li><strong>网关层</strong>：Nginx limit_req/limit_conn。</li>
      </ul>
      <p><strong>7. 面试标准答法</strong></p>
      <p>计数器（临界突刺）、滑动窗口（平滑）、漏桶（固定速率出水，不允突发）、令牌桶（固定速率放令牌，允许突发，最常用）。实现：单机 Guava，分布式 Redis+Lua/Sentinel/Gateway。</p>`},

  // ---------- 数据结构与算法 ----------
  {c:"数据结构与算法",d:"★★",q:"常见排序算法的时间复杂度和稳定性？",
   a:`<table>总结：</table>
      <ul>
        <li><strong>冒泡</strong> O(n²) 稳定。</li>
        <li><strong>选择</strong> O(n²) 不稳定。</li>
        <li><strong>插入</strong> O(n²) 稳定，小数据量最快。</li>
        <li><strong>快排</strong> 平均 O(nlogn)，最坏 O(n²)，不稳定。分区思想。</li>
        <li><strong>归并</strong> O(nlogn) 稳定，需要 O(n) 额外空间。</li>
        <li><strong>堆排</strong> O(nlogn) 不稳定，原地排序。</li>
        <li><strong>希尔</strong> O(n^1.3) 不稳定，插入排序改进。</li>
        <li><strong>基数/计数</strong> 非比较排序，O(n+k)，对数据有要求。</li>
      </ul>
      <blockquote>Arrays.sort() 对基本类型用双轴快排，对象用 TimSort（归并+插入）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 各排序算法对比</strong></p>
      <table><tr><th>算法</th><th>平均</th><th>最坏</th><th>空间</th><th>稳定</th><th>特点</th></tr>
      <tr><td>冒泡</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>稳定</td><td>简单，可优化（加标志位）</td></tr>
      <tr><td>选择</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>不稳定</td><td>交换次数少，但不稳定</td></tr>
      <tr><td>插入</td><td>O(n²)</td><td>O(n²)</td><td>O(1)</td><td>稳定</td><td>小数据量/近乎有序最快</td></tr>
      <tr><td>快排</td><td>O(nlogn)</td><td>O(n²)</td><td>O(logn)</td><td>不稳定</td><td>实际最快，分区+递归</td></tr>
      <tr><td>归并</td><td>O(nlogn)</td><td>O(nlogn)</td><td>O(n)</td><td>稳定</td><td>稳定且最坏也是nlogn，外部排序</td></tr>
      <tr><td>堆排</td><td>O(nlogn)</td><td>O(nlogn)</td><td>O(1)</td><td>不稳定</td><td>原地，但缓存不友好</td></tr>
      <tr><td>希尔</td><td>O(n^1.3)</td><td>O(n²)</td><td>O(1)</td><td>不稳定</td><td>插入的改进（分组缩小步长）</td></tr>
      <tr><td>计数/基数/桶</td><td>O(n+k)</td><td>-</td><td>O(k)</td><td>稳定</td><td>非比较，有数据要求</td></tr></table>
      <p><strong>2. 稳定性的意义</strong></p>
      <p>稳定排序：相等元素相对顺序不变。多字段排序有用（先按A排，再按B稳定排，B相同时保持A的顺序）。</p>
      <p><strong>3. 工程中的排序</strong></p>
      <ul>
        <li><strong>Arrays.sort()（基本类型）</strong>：双轴快速排序（Dual-Pivot QuickSort）。</li>
        <li><strong>Arrays.sort()（对象）/Collections.sort()</strong>：TimSort（归并+插入的混合，稳定）。对象要求稳定（Comparator 语义）。</li>
        <li><strong>大数据外部排序</strong>：归并排序（分块排序后归并）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>冒泡/选择/插入(O(n²)，插入小数据快)、快排(平均nlogn最坏n²不稳定实际最快)、归并(nlogn稳定需O(n)空间)、堆排(nlogn不稳定原地)、希尔(插入改进)、计数/基数/桶(非比较O(n+k))。Arrays.sort基本类型双轴快排，对象TimSort。</p>`},
  {c:"数据结构与算法",d:"★★",q:"二分查找的条件和写法？",
   a:`<p><strong>条件</strong>：数组有序、支持随机访问。</p>
      <p>时间 O(logn)。注意<strong>边界和死循环</strong>：</p>
      <pre><code>int l = 0, r = n - 1;
while (l &lt;= r) {
    int mid = l + (r - l) / 2;  // 防溢出
    if (a[mid] == target) return mid;
    else if (a[mid] &lt; target) l = mid + 1;
    else r = mid - 1;
}
return -1;</code></pre>
      <blockquote>变种：找第一个/最后一个 >=target 的位置（lower_bound / upper_bound）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 适用条件</strong></p>
      <ul>
        <li><strong>数组有序</strong>（单调递增/递减）。</li>
        <li><strong>支持随机访问</strong>（数组，链表不行）。</li>
        <li>有明确的单调性可二分。</li>
      </ul>
      <p><strong>2. 标准写法（注意边界）</strong></p>
      <pre><code>int l = 0, r = n - 1;
while (l &lt;= r) {  // 闭区间 [l, r]
    int mid = l + (r - l) / 2;  // 防溢出，不用 (l+r)/2
    if (a[mid] == target) return mid;
    else if (a[mid] &lt; target) l = mid + 1;
    else r = mid - 1;
}
return -1;</code></pre>
      <p><strong>关键</strong>：mid = l + (r-l)/2 防 l+r 溢出；l=mid+1、r=mid-1 防死循环。</p>
      <p><strong>3. 变种（高频）</strong></p>
      <ul>
        <li><strong>lower_bound</strong>：找<strong>第一个 ≥ target</strong> 的位置。l&lt;r 循环，a[mid]&lt;target 则 l=mid+1，否则 r=mid。</li>
        <li><strong>upper_bound</strong>：找<strong>第一个 &gt; target</strong> 的位置。</li>
        <li>找最后一个 ≤ target、旋转数组查找、求平方根等。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>条件：有序数组+随机访问。O(logn)。mid=l+(r-l)/2防溢出。变种：lower_bound(第一个≥target)、upper_bound(第一个>target)。注意边界l=mid+1/r=mid-1防死循环。</p>`},
  {c:"数据结构与算法",d:"★★",q:"链表反转怎么做？",
   a:`<p><strong>迭代法</strong>（推荐，O(n) O(1)）：</p>
      <pre><code>ListNode prev = null, cur = head;
while (cur != null) {
    ListNode next = cur.next;
    cur.next = prev;
    prev = cur;
    cur = next;
}
return prev;</code></pre>
      <p><strong>递归法</strong>：</p>
      <pre><code>if (head == null || head.next == null) return head;
ListNode newHead = reverse(head.next);
head.next.next = head;  // 后继指向自己
head.next = null;
return newHead;</code></pre>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 迭代法（推荐）</strong></p>
      <p>用三个指针 prev/cur/next，遍历链表，逐个翻转指针方向。</p>
      <pre><code>ListNode prev = null, cur = head;
while (cur != null) {
    ListNode next = cur.next;  // 暂存下一个
    cur.next = prev;           // 翻转指向
    prev = cur;                // prev 前进
    cur = next;                // cur 前进
}
return prev;  // prev 是新的头</code></pre>
      <p>时间 O(n)，空间 O(1)。</p>
      <p><strong>2. 递归法</strong></p>
      <pre><code>ListNode reverse(ListNode head) {
    if (head == null || head.next == null) return head;
    ListNode newHead = reverse(head.next);  // 递归反转后面的
    head.next.next = head;  // 后继节点指向自己
    head.next = null;       // 断开原方向
    return newHead;
}</code></pre>
      <p>递归到尾，回溯时翻转。时间 O(n)，空间 O(n)（递归栈）。</p>
      <p><strong>3. 区间反转（LeetCode 92）</strong></p>
      <p>反转 [left, right] 区间。找到 left 前驱，反转区间，重新连接。头插法。</p>
      <p><strong>4. K 个一组反转（LeetCode 25）</strong></p>
      <p>每 k 个节点一组反转，不足 k 不反转。先数 k 个，反转这一组，递归/迭代处理剩余。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>迭代：prev/cur/next 三指针，cur.next=prev翻转，prev/cur前进，O(n)O(1)。递归：reverse(head.next)后head.next.next=head翻转。变种：区间反转、k个一组反转(先数k个再反转)。</p>`},
  {c:"数据结构与算法",d:"★★",q:"HashMap 用红黑树而不是 AVL 树，为什么？",
   a:`<p>红黑树和 AVL 都是有序二叉平衡树，但平衡严格度不同：</p>
      <ul>
        <li><strong>AVL 树</strong>：高度差不超过 1，<strong>严格平衡</strong>。查询快但插入/删除旋转多。</li>
        <li><strong>红黑树</strong>：弱平衡（最长路径不超过最短的 2 倍）。插入删除旋转少。</li>
      </ul>
      <p>HashMap 中冲突后是<strong>频繁增删</strong>的场景，红黑树的综合性能（增删查）更均衡。AVL 查询多但维护成本高。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. AVL 树和红黑树都是自平衡二叉搜索树</strong></p>
      <ul>
        <li><strong>AVL 树</strong>：<strong>严格平衡</strong>，任一节点左右子树高度差 ≤ 1。查询快（高度最低），但插入/删除时<strong>旋转多</strong>（可能一路旋到根）。</li>
        <li><strong>红黑树</strong>：<strong>弱平衡</strong>，靠红黑着色规则保证最长路径不超过最短的 2 倍。插入/删除<strong>旋转少</strong>（最多 3 次），但查询略慢于 AVL（高度可能高一点）。</li>
      </ul>
      <p><strong>2. 为什么 HashMap 选红黑树</strong></p>
      <ul>
        <li>HashMap 的桶（冲突链表转树后）是<strong>频繁增删</strong>的场景（put/remove），红黑树增删时旋转少，综合性能（增删查）更均衡。</li>
        <li>AVL 查询快但增删旋转多，在增删频繁的 HashMap 中维护成本高。</li>
        <li>红黑树实现相对简单（C++ STL、Linux 内核、Java TreeMap 都用红黑树）。</li>
      </ul>
      <p><strong>3. 两者对比</strong></p>
      <table><tr><th></th><th>AVL</th><th>红黑树</th></tr>
      <tr><td>平衡度</td><td>严格（高差≤1）</td><td>弱（最长≤2×最短）</td></tr>
      <tr><td>查询</td><td>快（高度低）</td><td>略慢</td></tr>
      <tr><td>增删旋转</td><td>多</td><td>少（最多3次）</td></tr>
      <tr><td>适用</td><td>查询多增删少</td><td>增删频繁（综合好）</td></tr></table>
      <p><strong>4. 面试标准答法</strong></p>
      <p>AVL严格平衡(高差≤1)查询快但增删旋转多。红黑树弱平衡(最长≤2倍最短)增删旋转少(最多3次)。HashMap冲突后频繁增删，红黑树综合性能(增删查)更均衡，所以选红黑树。</p>`},

  {c:"框架",d:"★★",q:"单例模式的实现方式？哪种最好？",
   a:`<ol>
        <li><strong>饿汉式</strong>：类加载就创建。线程安全，但浪费内存。</li>
        <li><strong>懒汉式（双重检查锁）</strong>：
          <pre><code>if (instance == null) {
    synchronized (Singleton.class) {
        if (instance == null)
            instance = new Singleton(); // volatile 防指令重排
    }
}</code></pre>
        </li>
        <li><strong>静态内部类</strong>（推荐）：
          <pre><code>private static class Holder {
    static final Singleton INSTANCE = new Singleton();
}
public static Singleton getInstance() { return Holder.INSTANCE; }</code></pre>
          利用类加载机制保证线程安全，延迟加载。
        </li>
        <li><strong>枚举</strong>（Effective Java 推荐）：天然防反射和反序列化攻击。</li>
      </ol>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 各种实现方式</strong></p>
      <ul>
        <li><strong>饿汉式</strong>：类加载时初始化（final static）。线程安全（类加载保证），但<strong>无法延迟加载</strong>（不用也占内存）。</li>
        <li><strong>懒汉式（synchronized）</strong>：getInstance 加 synchronized。线程安全但<strong>性能差</strong>（每次调用都同步）。</li>
        <li><strong>双重检查锁 DCL</strong>：两次判空 + 锁。第一次判空避免无锁开销，第二次防并发重复创建。<strong>instance 必须 volatile</strong>（防 new 的指令重排：分配内存→赋值引用→初始化，重排会导致拿到未初始化对象）。</li>
        <li><strong>静态内部类（推荐）</strong>：利用类加载机制（Holder 类在 getInstance 首次调用时才加载，线程安全）实现懒加载 + 线程安全，代码简洁。</li>
        <li><strong>枚举（Effective Java 最推荐）</strong>：天然单例（枚举实例 JVM 保证唯一），<strong>防反射攻击</strong>、<strong>防反序列化创建新对象</strong>。缺点：不能延迟加载、不能继承。</li>
      </ul>
      <p><strong>2. DCL 为什么要 volatile</strong></p>
      <p>new Singleton() 不是原子操作，分三步：① 分配内存；② 调构造初始化；③ 引用指向内存。JVM 可能重排成①③②，另一线程在③后②前判读到 instance!=null 但对象未初始化，使用出错。volatile 禁止重排。</p>
      <p><strong>3. 推荐：枚举 &gt; 静态内部类 &gt; DCL</strong>。枚举最安全（防反射/序列化），静态内部类简洁优雅。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>饿汉(类加载创建)、DCL双重检查(需volatile防new重排)、静态内部类(类加载保证安全+懒加载)、枚举(防反射防序列化最推荐)。DCL volatile防指令重排。推荐枚举&gt;静态内部类&gt;DCL。</p>`},
  {c:"框架",d:"★★",q:"说说你了解的设计模式？",
   a:`<p><strong>创建型</strong>（对象创建）：单例、工厂方法、抽象工厂、建造者、原型。</p>
      <p><strong>结构型</strong>（组合）：适配器、装饰器、代理、外观、桥接、组合、享元。</p>
      <p><strong>行为型</strong>（交互）：策略、观察者、模板方法、责任链、状态、命令、迭代器、中介者、备忘录、访问者。</p>
      <blockquote>实际开发高频：工厂（Spring BeanFactory）、代理（AOP）、责任链（Filter/Interceptor）、策略（替代 if-else）、模板方法（JdbcTemplate、RestTemplate）、单例（Bean）、观察者（事件机制 ApplicationEvent）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三大类（GoF 23种）</strong></p>
      <p><strong>创建型（5种）</strong>：单例、工厂方法、抽象工厂、建造者、原型。</p>
      <p><strong>结构型（7种）</strong>：适配器、装饰器、代理、外观、桥接、组合、享元。</p>
      <p><strong>行为型（11种）</strong>：策略、观察者、模板方法、责任链、状态、命令、迭代器、中介者、备忘录、访问者、解释器。</p>
      <p><strong>2. Spring 中的设计模式</strong></p>
      <ul>
        <li><strong>单例</strong>：Bean 默认单例。</li>
        <li><strong>工厂</strong>：BeanFactory/FactoryBean 创建对象。</li>
        <li><strong>代理</strong>：AOP（JDK/CGLIB 动态代理）。</li>
        <li><strong>责任链</strong>：Filter、Interceptor、Pipeline。</li>
        <li><strong>模板方法</strong>：JdbcTemplate、RestTemplate、refresh()。</li>
        <li><strong>观察者</strong>：ApplicationEvent 事件机制。</li>
        <li><strong>适配器</strong>：HandlerAdapter（MVC）。</li>
        <li><strong>装饰器</strong>：Java IO（BufferedInputStream 包装）。</li>
        <li><strong>策略</strong>：Resource 接口不同实现。</li>
      </ul>
      <p><strong>3. 开闭原则</strong>：对扩展开放，对修改关闭。模式让新增功能不改老代码。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>三类23种。Spring实战：单例(Bean)、工厂(BeanFactory)、代理(AOP)、责任链(Filter/Interceptor)、策略(替代if-else)、模板方法(JdbcTemplate)、观察者(ApplicationEvent)、适配器(HandlerAdapter)、装饰器(IO)。</p>`},
  {c:"框架",d:"★★",q:"MyBatis 的 #{} 和 ${} 区别？",
   a:`<p><strong>#{}</strong>：预编译，会替换成 ?，参数用 PreparedStatement 设置。<strong>防 SQL 注入</strong>。默认首选。</p>
      <p><strong>\${}</strong>：字符串拼接，直接替换。有 SQL 注入风险。用于<strong>动态表名、列名、order by</strong> 这种不能用占位符的场景。</p>
      <blockquote>只要值能用 #{}，就别用 \${}。排序字段如果是用户传入，要白名单校验。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. #{}（预编译占位符）</strong>：替换成 JDBC 的 ?，参数用 PreparedStatement.setXxx 设置，<strong>防 SQL 注入</strong>。会自动加引号处理字符串、有类型转换（TypeHandler）。预编译语句可被 DB 缓存执行计划。</p>
      <p><strong>2. \${}（字符串拼接）</strong>：直接把参数值<strong>字符串替换</strong>到 SQL 里（拼接），<strong>有 SQL 注入风险</strong>。不加引号、无类型转换。用于<strong>动态表名、列名、order by</strong>（这些不能用 ? 占位符，因为占位符只能用于值不能用于标识符）。</p>
      <p><strong>3. 为什么动态表名不能用 #</strong>：PreparedStatement 的 ? 只能用于<strong>值</strong>（where id=?），不能用于表名/列名/关键字。所以只能用 \${}。</p>
      <p><strong>4. \${} 的安全处理</strong>：必须<strong>白名单校验</strong>（表名/列名只允许字母数字下划线，order by 字段必须在允许集合内），绝不直接拼接用户输入。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>#{}预编译(替换成?，防注入，默认首选)。\${}字符串拼接(有注入风险，用于动态表名/列名/order by等不能用占位符的)。能用#别用\$，\$必须白名单校验。</p>`},

  {c:"框架",d:"★★",q:"Spring Cloud 和 Spring Cloud Alibaba 有哪些核心组件？",
   a:`<p><strong>Spring Cloud（Netflix，部分已停更）</strong>：</p>
      <ul>
        <li>Eureka 注册中心、Ribbon 负载均衡、Feign 声明式调用、Hystrix 熔断、Zuul 网关、Config 配置中心。</li>
      </ul>
      <p><strong>Spring Cloud Alibaba（主流）</strong>：</p>
      <ul>
        <li><strong>Nacos</strong>：注册中心 + 配置中心（替代 Eureka+Config）。</li>
        <li><strong>Sentinel</strong>：熔断限流降级（替代 Hystrix）。</li>
        <li><strong>Dubbo</strong>：RPC 通信（替代 Feign）。</li>
        <li><strong>RocketMQ</strong>：消息队列。</li>
        <li><strong>Seata</strong>：分布式事务。</li>
        <li><strong>Gateway</strong>：网关（Spring 官方）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Spring Cloud Netflix（第一代，已逐步停更）</strong></p>
      <ul>
        <li><strong>Eureka</strong>：注册中心（AP）。2.x 停止维护。</li>
        <li><strong>Ribbon</strong>：客户端负载均衡。停更，被 LoadBalancer 替代。</li>
        <li><strong>Feign/OpenFeign</strong>：声明式 HTTP 调用。OpenFeign 仍维护。</li>
        <li><strong>Hystrix</strong>：熔断降级。停更，被 Resilience4j/Sentinel 替代。</li>
        <li><strong>Zuul</strong>：网关。停更，被 Gateway 替代。</li>
        <li><strong>Config</strong>：配置中心。仍维护。</li>
      </ul>
      <p><strong>2. Spring Cloud Alibaba（第二代，国内主流）</strong></p>
      <ul>
        <li><strong>Nacos</strong>：注册中心 + 配置中心二合一，AP/CP 可选，主流。</li>
        <li><strong>Sentinel</strong>：熔断限流降级 + 系统保护，可视化控制台。</li>
        <li><strong>Dubbo</strong>：高性能 RPC（替代 HTTP 的 Feign）。</li>
        <li><strong>RocketMQ</strong>：消息队列（事务消息、顺序消息）。</li>
        <li><strong>Seata</strong>：分布式事务（AT/TCC/Saga）。</li>
        <li><strong>Spring Cloud Gateway</strong>：网关（Spring 官方，异步非阻塞）。</li>
      </ul>
      <p><strong>3. 选型</strong>：新项目首选 Alibaba 套件（阿里背书、中文文档好、社区活跃）。Netflix 套件大部分停更，不推荐新项目用。两者可混用（Gateway + Nacos + OpenFeign + Sentinel）。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Netflix(停更)：Eureka/Ribbon/Feign/Hystrix/Zuul/Config。Alibaba(主流)：Nacos(注册+配置)/Sentinel(熔断限流)/Dubbo(RPC)/RocketMQ(MQ)/Seata(事务)/Gateway(网关)。新项目首选Alibaba。</p>`},
  {c:"框架",d:"★★",q:"什么是熔断、降级、限流？",
   a:`<ul>
        <li><strong>限流</strong>：控制请求速率，保护系统不被压垮（令牌桶/漏桶）。在流量入口。</li>
        <li><strong>熔断</strong>：下游服务故障率/慢调用超阈值时，<strong>快速失败</strong>不再调用，防止级联雪崩。有半开状态自动探测恢复。</li>
        <li><strong>降级</strong>：服务不可用时返回<strong>兜底数据</strong>（默认值、缓存、友好提示），保证主流程。</li>
      </ul>
      <blockquote>三者配合：限流防过载、熔断防雪崩、降级保体验。Sentinel、Hystrix、Resilience4j 实现。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 限流（Rate Limiting）</strong></p>
      <ul>
        <li><strong>作用</strong>：控制请求速率，保护系统不被流量压垮。在流量入口（网关、接口）做。</li>
        <li><strong>算法</strong>：计数器、滑动窗口、漏桶（固定速率处理，不允突发）、令牌桶（固定速率放令牌，允许突发）。</li>
        <li><strong>触发后</strong>：拒绝（返回429/限流提示）、排队等待。</li>
      </ul>
      <p><strong>2. 熔断（Circuit Breaker）</strong></p>
      <ul>
        <li><strong>作用</strong>：下游故障（错误率高/慢调用）达阈值时，熔断器打开快速失败不再调用，防级联雪崩。</li>
        <li><strong>三种状态</strong>：Closed（正常统计失败率）→ Open（达阈值熔断快速失败）→ Half-Open（休眠后放少量试探，成功恢复/失败继续熔断）。</li>
        <li><strong>触发条件</strong>：异常比例、异常数、慢调用比例（RT 阈值）。</li>
      </ul>
      <p><strong>3. 降级（Fallback）</strong></p>
      <ul>
        <li><strong>作用</strong>：服务不可用时返回兜底数据（默认值、缓存、友好提示），保证核心功能可用、用户体验。</li>
        <li><strong>例子</strong>：评价服务挂了返回"评价加载中"，推荐挂了返回热门商品。</li>
      </ul>
      <p><strong>4. 三者关系</strong>：限流防过载（流量大拒绝部分）、熔断防雪崩（下游挂了快速失败）、降级保体验（出问题给兜底）。常配合：熔断触发后走降级。</p>
      <p><strong>5. 面试标准答法</strong></p>
      <p>限流(控制速率防过载)、熔断(下游故障达阈值快速失败防雪崩，Closed/Open/Half-Open三态)、降级(兜底数据保体验)。配合使用。Sentinel主流。</p>`},
  {c:"框架",d:"★★",q:"消息队列（Kafka/RocketMQ/RabbitMQ）的使用场景和选型？",
   a:`<p><strong>三大场景</strong>：异步解耦、削峰填谷、异步通信。</p>
      <p><strong>选型</strong>：</p>
      <ul>
        <li><strong>Kafka</strong>：吞吐量极高（百万级），日志收集、大数据流处理。功能简单，可靠性要求中。</li>
        <li><strong>RocketMQ</strong>：阿里出品，金融级可靠。支持事务消息、顺序消息、定时消息。电商订单首选。</li>
        <li><strong>RabbitMQ</strong>：协议丰富（AMQP），路由灵活，延迟低。企业应用、复杂路由。</li>
      </ul>
      <p><strong>常见问题</strong>：消息丢失（生产端 confirm + 持久化 + 消费端手动 ack）、重复消费（业务幂等）、顺序消费（同 key 同队列）、消息积压。</p>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三大场景</strong>：异步解耦（下单后异步发通知/扣库存）、削峰填谷（秒杀流量进队列，消费者按节奏处理）、异步通信（系统间通过消息通信）。</p>
      <p><strong>2. 三大 MQ 对比</strong></p>
      <ul>
        <li><strong>Kafka</strong>：吞吐极高（百万级），日志收集、大数据流处理。功能简单，可靠性中。Scala/Java。</li>
        <li><strong>RocketMQ</strong>：阿里出品，金融级可靠。支持事务消息、顺序、定时。电商订单首选。Java。</li>
        <li><strong>RabbitMQ</strong>：协议丰富（AMQP），路由灵活（Exchange），延迟低。企业应用、复杂路由。Erlang。</li>
      </ul>
      <p><strong>3. 引入 MQ 的问题</strong>：可用性降低（MQ 挂影响业务，需集群）、复杂度增加（一致性问题）、消息丢失（confirm+持久化+手动ack）、重复消费（业务幂等）、顺序（同key同队列）、积压（扩消费者）。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>场景：异步解耦、削峰、异步通信。Kafka(吞吐极高，日志/大数据)、RocketMQ(金融级，事务/顺序/延时，电商)、RabbitMQ(路由灵活延迟低，企业应用)。问题：丢失/重复/顺序/积压。</p>`},
  {c:"框架",d:"★★",q:"如何保证接口的幂等性？",
   a:`<p><strong>幂等</strong>：多次执行结果一致。</p>
      <ol>
        <li><strong>唯一索引</strong>：数据库层防重复插入。</li>
        <li><strong>token 机制</strong>：请求前先获取 token，提交时校验+删除。</li>
        <li><strong>乐观锁</strong>：version 字段，update where version=?。</li>
        <li><strong>分布式锁</strong>：业务 ID 加锁。</li>
        <li><strong>状态机</strong>：订单状态流转校验。</li>
        <li><strong>防重表</strong>：记录已处理的请求 ID。</li>
      </ol>
      <blockquote>天然幂等：查询、删除、唯一索引插入。需要保证的：更新、转账、下单。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 幂等性定义</strong>：多次执行同一操作结果一致（重复请求安全）。防网络重试、用户连点、MQ 重复消费。</p>
      <p><strong>2. 天然幂等</strong>：查询、删除（by id）、唯一索引插入、绝对值更新（set x=1）。</p>
      <p><strong>3. 需要保证的</strong>：更新（count+1 非幂等）、转账扣款、下单。</p>
      <p><strong>4. 方案</strong></p>
      <ul>
        <li><strong>唯一索引（推荐）</strong>：业务唯一字段（订单号）建唯一索引，重复插入报错。防重复创建。</li>
        <li><strong>token 机制</strong>：请求前拿 token（存Redis），提交时校验+删除（原子）。第二次提交 token 没了拒绝。</li>
        <li><strong>乐观锁（version）</strong>：update set version=version+1 where id=? and version=原值。重复请求 version 变了更新0行。</li>
        <li><strong>分布式锁</strong>：业务 ID 加锁，重复请求拿不到锁。</li>
        <li><strong>状态机</strong>：状态流转校验（待支付→已支付），重复支付时状态已变不处理。</li>
        <li><strong>防重表</strong>：单独表记录已处理请求 ID（唯一索引）。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>幂等=多次执行结果一致。方案：唯一索引(订单号)、token(请求前拿提交时校验删除)、乐观锁(version)、分布式锁(业务ID)、状态机(状态流转)、防重表(请求ID)。天然幂等：查询/删除/唯一索引插入。</p>`},

  // ---------- 并发补充 ----------
  {c:"并发",d:"★★",q:"CountDownLatch、CyclicBarrier、Semaphore 的区别？",
   a:`<ul>
        <li><strong>CountDownLatch</strong>：计数器递减，等 N 个任务完成（如等待 5 个线程都加载完）后主线程继续。<strong>一次性</strong>，不能重置。</li>
        <li><strong>CyclicBarrier</strong>：N 个线程互相等待，都到达屏障后再一起继续。<strong>可循环</strong>（reset 复用），适合多阶段计算。</li>
        <li><strong>Semaphore</strong>：信号量，控制同时访问的线程数（许可证）。常用于<strong>限流</strong>、资源池（如数据库连接池）。</li>
      </ul>
      <blockquote>记忆：CountDownLatch 是"一个人等多个人"，CyclicBarrier 是"多个人互等"，Semaphore 是"停车场车位"。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. CountDownLatch（倒计时闩）</strong></p>
      <ul>
        <li>基于 AQS 共享模式。构造传 count，countDown() 让 state 减 1，await() 在 state=0 时返回。</li>
        <li>用途：主线程等多个子任务完成。<strong>一次性</strong>，count 归零后不能 reset（要再用得 new 一个）。</li>
        <li>典型：服务启动时并行初始化多个组件，主线程 await 等全部就绪。</li>
      </ul>
      <p><strong>2. CyclicBarrier（循环屏障）</strong></p>
      <ul>
        <li>基于 ReentrantLock + Condition。构造传 parties（线程数）。await() 到达屏障，未到 parties 个时阻塞；到齐后所有线程被唤醒继续。</li>
        <li><strong>可循环</strong>：reset() 复用，适合多阶段任务（如多轮迭代计算）。</li>
        <li>支持 barrierAction：线程到齐后先执行一个动作（如汇总）。</li>
        <li>异常：任一线程 await 时被中断或超时，所有等待线程抛 BrokenBarrierException，屏障损坏。</li>
      </ul>
      <p><strong>3. Semaphore（信号量）</strong></p>
      <ul>
        <li>基于 AQS 共享模式。构造传 permits（许可证数）。acquire() 取许可证（state-1，不够则阻塞），release() 还（state+1）。</li>
        <li>用途：<strong>限流</strong>（限制并发访问数）、资源池（连接池、对象池）。</li>
        <li>支持公平/非公平。</li>
      </ul>
      <p><strong>4. 三者对比</strong></p>
      <ul>
        <li>CountDownLatch：一对多等待（一个等 N 个），一次性，不可 reset。</li>
        <li>CyclicBarrier：多对多互等（N 个互等），可循环 reset。</li>
        <li>Semaphore：控制并发数（N 个许可证），可重复 acquire/release。</li>
      </ul>
      <p><strong>5. 面试标准答法</strong></p>
      <p>CountDownLatch 倒计数一次性（一等多），CyclicBarrier 屏障可循环（多互等），Semaphore 信号量限流（控制并发数）。底层都基于 AQS。</p>`},
  {c:"并发",d:"★★",q:"线程有哪几种状态？",
   a:`<p>Thread.State 枚举 <strong>6 种状态</strong>：</p>
      <ol>
        <li><strong>NEW</strong>：new 出来还没 start。</li>
        <li><strong>RUNNABLE</strong>：可运行（就绪 + 运行中，Java 把这两个合一了）。</li>
        <li><strong>BLOCKED</strong>：等待 synchronized 锁。</li>
        <li><strong>WAITING</strong>：无限期等待（wait/join/LockSupport.park 无超时）。</li>
        <li><strong>TIMED_WAITING</strong>：限时等待（sleep/wait(timeout)/join(timeout)）。</li>
        <li><strong>TERMINATED</strong>：执行结束。</li>
      </ol>
      <blockquote>注意：Java 没有"运行中"单独状态；阻塞锁特指 synchronized，Lock 阻塞是 WAITING（park）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 六种状态（Thread.State 枚举）</strong></p>
      <ul>
        <li><strong>NEW</strong>：已 new 但未 start。线程对象存在但未启动。</li>
        <li><strong>RUNNABLE</strong>：可运行。Java 把"就绪"（等 CPU 时间片）和"运行中"（正在执行）合并成一个 RUNNABLE。所以 Java 线程看似在 RUNNABLE，实际可能在等 CPU 或在 IO 阻塞。</li>
        <li><strong>BLOCKED</strong>：阻塞于<strong>synchronized 锁</strong>（等待 monitor）。特指 synchronized，不包括 Lock。</li>
        <li><strong>WAITING</strong>：无限期等待。调用无超时的 wait()/join()/LockSupport.park()。需要被显式唤醒（notify/notifyAll/unpark）。</li>
        <li><strong>TIMED_WAITING</strong>：限时等待。sleep(ms)/wait(ms)/join(ms)/parkNanos。超时自动唤醒。</li>
        <li><strong>TERMINATED</strong>：run() 执行完毕（正常结束或异常退出）。</li>
      </ul>
      <p><strong>2. 状态转换（重要）</strong></p>
      <ul>
        <li>NEW --start()--&gt; RUNNABLE。</li>
        <li>RUNNABLE --wait()--&gt; WAITING --notify()--&gt; RUNNABLE（需先重新获锁）。</li>
        <li>RUNNABLE --wait(ms)/sleep(ms)--&gt; TIMED_WAITING --超时/notify--&gt; RUNNABLE。</li>
        <li>RUNNABLE --等 synchronized 锁--&gt; BLOCKED --获得锁--&gt; RUNNABLE。</li>
        <li>RUNNABLE --run 结束--&gt; TERMINATED。</li>
      </ul>
      <p><strong>3. 易错点</strong></p>
      <ul>
        <li>Java 没有"运行中"独立状态，RUNNABLE 涵盖就绪和运行。</li>
        <li>BLOCKED 只针对 synchronized。ReentrantLock 竞争时线程状态是 WAITING（park），不是 BLOCKED。</li>
        <li>IO 阻塞（如 socket read）在 Java 层也是 RUNNABLE（操作系统层面是阻塞，但 JVM 不感知）。</li>
        <li>线程一旦 TERMINATED 不能再 start（抛 IllegalThreadStateException）。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>6 种：NEW（未start）、RUNNABLE（就绪+运行）、BLOCKED（等synchronized锁）、WAITING（无超时等待）、TIMED_WAITING（限时等待）、TERMINATED（结束）。注意 BLOCKED 只针对 synchronized，Lock 是 WAITING。</p>`},
  {c:"并发",d:"★★",q:"CompletableFuture 是什么？解决了什么问题？",
   a:`<p>CompletableFuture 是 Java 8 的<strong>异步编排</strong>工具，Future 的增强版。</p>
      <p><strong>Future 的不足</strong>：get() 阻塞、不能链式回调、不能组合多个任务。</p>
      <p><strong>CompletableFuture 优势</strong>：</p>
      <ul>
        <li>支持回调（thenApply/thenAccept/thenRun）。</li>
        <li>支持组合（thenCombine 合并两个、allOf/anyOf 等多个）。</li>
        <li>支持异常处理（exceptionally/handle）。</li>
        <li>可指定线程池（避免 ForkJoinPool.commonPool 共用）。</li>
      </ul>
      <blockquote>场景：商品详情页并行查基础信息、价格、库存、评价，最后合并。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. Future 的不足</strong></p>
      <ul>
        <li>get() 阻塞获取结果，不能主动通知。</li>
        <li>isDone() 轮询低效。</li>
        <li>不能链式：任务 A 完成后自动执行 B。</li>
        <li>不能组合：多个 Future 合并、任一完成、全部完成。</li>
        <li>不能回调处理异常。</li>
      </ul>
      <p><strong>2. CompletableFuture 的能力</strong></p>
      <ul>
        <li><strong>回调（非阻塞）</strong>：thenApply（转换结果）、thenAccept（消费结果）、thenRun（执行动作，不要结果）、thenCompose（串联另一个 CF）。</li>
        <li><strong>组合</strong>：thenCombine（合并两个 CF 结果）、allOf（等所有完成）、anyOf（任一完成）。</li>
        <li><strong>异常处理</strong>：exceptionally（异常时返回默认）、handle（正常异常都处理）、whenComplete（类似 finally）。</li>
        <li><strong>线程池</strong>：所有方法有 Async 版本（thenApplyAsync），可传 Executor 指定线程池。</li>
      </ul>
      <p><strong>3. 创建方式</strong></p>
      <ul>
        <li>supplyAsync(Supplier)/runAsync(Runnable)：异步执行，默认 ForkJoinPool.commonPool。</li>
        <li>completedFuture(value)：已完成的，用于测试或包装。</li>
      </ul>
      <p><strong>4. 典型场景：商品详情页并行</strong></p>
      <pre><code>CompletableFuture&lt;Info&gt; info = CompletableFuture.supplyAsync(() -&gt; queryInfo(id), pool);
CompletableFuture&lt;Price&gt; price = CompletableFuture.supplyAsync(() -&gt; queryPrice(id), pool);
CompletableFuture&lt;Stock&gt; stock = CompletableFuture.supplyAsync(() -&gt; queryStock(id), pool);
CompletableFuture.allOf(info, price, stock).join();  // 等全部完成
return new Detail(info.get(), price.get(), stock.get());  // 合并</code></pre>
      <p>三个查询并行，总耗时 ≈ max(三个)，而非 sum。</p>
      <p><strong>5. 注意事项</strong></p>
      <ul>
        <li>默认线程池是 ForkJoinPool.commonPool（CPU 核数-1），IO 任务要<strong>自定义线程池</strong>，否则会拖垮其他并行流。</li>
        <li>异常会传播，记得用 exceptionally 兜底。</li>
        <li>join() 和 get()：join 抛 unchecked，get 抛 checked。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>CompletableFuture 解决 Future 不能回调、不能组合、不能链式的问题。支持 thenApply 链式、allOf/anyOf 组合、exceptionly 异常。生产要自定义线程池（默认 commonPool 不够）。适合并行编排（商品详情页多查询合并）。</p>`},
  {c:"并发",d:"★★",q:"ForkJoin 框架的原理？",
   a:`<p>ForkJoin 用于<strong>分治任务</strong>，把大任务拆（fork）成子任务并行执行，再合并（join）结果。</p>
      <p><strong>核心</strong>：工作窃取算法（work-stealing）。每个线程有自己的双端队列，自己 push/pop 用 LIFO，空闲时从其他线程队列<strong>尾部</strong>窃取任务（FIFO），减少竞争。</p>
      <blockquote>应用：Stream 并行流（parallelStream）底层就是 ForkJoinPool.commonPool()。适合 CPU 密集、可拆分的任务（如归并排序、大数组求和）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. ForkJoin 的设计思想</strong></p>
      <p>分治：把大任务 fork 成若干小任务（直到小于阈值），多线程并行执行小任务，最后 join 合并结果。适合 CPU 密集、可递归拆分的任务（如大数组求和、归并排序、矩阵运算）。</p>
      <p><strong>2. 核心组件</strong></p>
      <ul>
        <li><strong>ForkJoinTask</strong>：任务抽象。RecursiveTask（有返回值）、RecursiveAction（无返回值）、CountedCompleter。</li>
        <li><strong>ForkJoinPool</strong>：线程池。每个工作线程有<strong>自己的双端任务队列</strong>（不是共享队列）。</li>
        <li><strong>ForkJoinWorkerThread</strong>：工作线程。</li>
      </ul>
      <p><strong>3. 工作窃取（Work-Stealing）算法</strong></p>
      <ul>
        <li>每个线程维护自己的双端队列存任务。</li>
        <li>线程处理自己队列用 <strong>LIFO（后进先出）</strong>：从尾部 push/pop，缓存友好（刚 fork 的子任务数据还在缓存）。</li>
        <li>线程空闲（自己队列空）时，从<strong>其他线程队列的头部</strong>窃取任务（FIFO）。</li>
        <li>好处：① 减少线程间竞争（各自操作队列不同端）；② 负载均衡（忙的线程任务多，闲的来偷）。</li>
      </ul>
      <p><strong>4. 使用示例（大数组求和）</strong></p>
      <pre><code>class SumTask extends RecursiveTask&lt;Long&gt; {
    long[] array; int start, end;
    protected Long compute() {
        if (end - start &lt; THRESHOLD) return directSum();  // 小于阈值直接算
        int mid = (start + end) / 2;
        SumTask left = new SumTask(array, start, mid);
        SumTask right = new SumTask(array, mid, end);
        left.fork();  // 异步执行左半
        long r = right.compute();  // 当前线程算右半
        return left.join() + r;  // 合并
    }
}</code></pre>
      <p><strong>5. 应用场景</strong></p>
      <ul>
        <li><strong>parallelStream</strong>：底层用 ForkJoinPool.commonPool()。</li>
        <li>大集合并行计算、分治算法。</li>
        <li>不适合 IO 密集（会占用宝贵的 commonPool 线程阻塞）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>ForkJoin 用分治思想，fork 拆任务、join 合并结果。核心是工作窃取算法：每线程自己双端队列 LIFO 处理，空闲时从别人队列头部 FIFO 偷。parallelStream 底层用它。适合 CPU 密集可拆分任务。</p>`},

  // ---------- Java 基础补充 ----------
  {c:"基础",d:"★★★",q:"Java 泛型的通配符 ? extends 和 ? super 有什么区别？",
   a:`<p>记住一个口诀就行：<strong>PECS——频繁读取用 extends，经常插入用 super</strong>（Producer Extends, Consumer Super）。</p>
      <ul>
        <li><strong>? extends T</strong>（上界，T 或 T 的子类）：只能<strong>读</strong>不能写。适合当数据源（提供数据给你读）。</li>
        <li><strong>? super T</strong>（下界，T 或 T 的父类）：只能<strong>写</strong>不能读（读出来只能当 Object）。适合当接收器（接收你写的数据）。</li>
      </ul>
      <blockquote>经典例子：<code>Collections.copy(dest, src)</code>——src 是数据源用 extends，dest 是接收器用 super。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. PECS 原则</strong></p>
      <p>Producer Extends, Consumer Super——如果参数是"生产者"（提供数据给你读），用 ? extends T；如果是"消费者"（接收你写的数据），用 ? super T。</p>
      <p><strong>2. 为什么 ? extends 只读不写</strong></p>
      <p>编译器知道泛型是 T 或其子类，但不知道具体哪个子类。如果允许写入，你写了 Integer，实际容器可能是 List&lt;Number&gt; 或 List&lt;Double&gt;，类型不安全。读出来的一定是 T 或子类，可安全当 T 使用。</p>
      <p><strong>3. 为什么 ? super 只写不读</strong></p>
      <p>编译器知道泛型是 T 或其父类，但不知道具体哪个父类层级，读出来无法确定类型，只能当 Object。但写入 T 及其子类一定安全（父类引用可指向子类）。</p>
      <p><strong>4. 经典体现</strong></p>
      <pre><code>public static &lt;T&gt; void copy(
    List&lt;? super T&gt; dest,   // 消费者，接收 T
    List&lt;? extends T&gt; src)  // 生产者，提供 T
)</code></pre>
      <p><strong>5. 面试标准答法</strong></p>
      <p>遵循 PECS 原则：频繁读取（生产者）用 ? extends T，只能读不能写；频繁插入（消费者）用 ? super T，只能写不能读。两者都是为了类型安全。</p>`},
  {c:"基础",d:"★★★",q:"什么是泛型擦除？有什么影响？",
   a:`<p>Java 的泛型只在<strong>编译时</strong>起作用，编译完进 JVM 后类型信息就被<strong>抹掉</strong>了，统一变成上界（没写上界就是 Object）。</p>
      <p>所以 <code>List&lt;String&gt;</code> 和 <code>List&lt;Integer&gt;</code> 在运行时其实是同一个类型 List，没法用 instanceof 区分。</p>
      <blockquote>带来的限制：不能 new T()、不能 new T[]、static 方法里不能用类的泛型参数。Java 当年这么设计是为了兼容老代码。虽然擦除了，但反射还是能通过一些手段拿到泛型信息。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 擦除规则</strong></p>
      <ul>
        <li>无边界 <code>T</code> 擦除为 Object。</li>
        <li><code>T extends Bound</code> 擦除为 Bound。</li>
        <li>多边界 <code>T extends A &amp; B</code> 擦除为<strong>最左</strong>的限定类型 A。</li>
        <li>擦除时机：编译期，进 JVM 前完成。</li>
      </ul>
      <p><strong>2. 为什么擦除</strong></p>
      <p>Java 5 引入泛型时，为了和 1.4 及之前的老代码兼容，让编译后的 class 文件不带泛型信息，新老代码能互操作。</p>
      <p><strong>3. 桥接方法（Bridge Method）</strong></p>
      <p>子类重写泛型父类方法时，擦除后父子方法签名在字节码层面不一致，编译器自动生成桥接方法（内部 checkcast 后调真正方法）维持多态。</p>
      <p><strong>4. 为什么擦除后反射还能拿到泛型</strong></p>
      <p>泛型信息以 <strong>Signature 属性</strong>保留在 class 文件中（对 JVM 是非功能性 tag，但反射 API 会读取）。通过 <code>Class.getGenericSuperclass()</code> → <code>ParameterizedType.getActualTypeArguments()</code> 获取。经典用法：抽象基类 Repository&lt;T&gt;，子类继承时反射拿到 T 的真实类型。</p>
      <p><strong>5. 擦除的限制</strong></p>
      <p>不能 new T()、new T[]、instanceof T、catch 泛型异常类；static 方法/字段不能用类的泛型参数；基本类型不能作泛型参数。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>Java 泛型是编译期特性，运行时类型参数被擦除为上界，是为了兼容老代码。限制是不能 new T/instanceof T 等。但泛型信息通过 class 的 Signature 属性保留，反射可通过 getGenericSuperclass 恢复。</p>`},
  {c:"基础",d:"★★",q:"final 关键字有哪些用法？",
   a:`<p>三种用法：</p>
      <ul>
        <li><strong>修饰类</strong>：不能被继承（比如 String、Integer）。</li>
        <li><strong>修饰方法</strong>：不能被重写（可以被重载）。</li>
        <li><strong>修饰变量</strong>：只能赋值一次。基本类型的话值不能改；引用类型的话引用不能改（不能指向别的对象），但对象内部的内容<strong>还能改</strong>。</li>
      </ul>
      <blockquote>注意：final 修饰的引用类型，指向不变但对象内部可变。比如 final List，你还是能 add 元素。<strong>final 引用 + 不可变对象（如 String）才算真正不可变</strong>。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 三种用法</strong></p>
      <ul>
        <li><strong>修饰类</strong>：不能被继承，如 String、Integer、Math。所有包装类都是 final。</li>
        <li><strong>修饰方法</strong>：不能被子类重写（可重载）。private 方法隐式是 final。</li>
        <li><strong>修饰变量</strong>：只能赋值一次。局部变量、成员变量、形参都可修饰。</li>
      </ul>
      <p><strong>2. final 变量的初始化</strong></p>
      <ul>
        <li>静态 final：声明时或静态代码块里初始化。</li>
        <li>实例 final：声明时、实例代码块、构造方法里初始化。</li>
        <li>必须在使用前完成初始化。</li>
      </ul>
      <p><strong>3. JMM 中 final 字段的特殊语义（JLS §17.5）</strong></p>
      <p><strong>初始化安全（initialization safety）</strong>：在构造函数中对 final 字段的写操作，<strong>禁止与对象引用发布重排序</strong>（在构造函数结束前 freeze）。效果：只要对象被安全发布，其他线程即使<strong>无同步</strong>也能看到 final 字段完全构造好的值，还能延伸到 final 字段引用的对象/数组。</p>
      <p><strong>前提条件</strong>：构造函数中<strong>不允许 this 引用逃逸</strong>（如赋给静态字段、注册到监听器）。一旦逃逸，初始化安全保证失效。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>final 修饰类不可继承、方法不可重写、变量不可重新赋值。引用类型 final 只是引用不变，对象内部仍可变。final 字段有 JMM 的初始化安全保证（构造完成后其他线程可见），但前提是 this 不逃逸。</p>`},
  {c:"基础",d:"★★",q:"Java 内部类有哪几种？",
   a:`<p>四种：</p>
      <ol>
        <li><strong>成员内部类</strong>：依附于外部类实例，能访问外部类的所有成员。</li>
        <li><strong>静态内部类</strong>：不依赖外部类实例（最常用，比如 HashMap.Node），推荐用这种减少耦合。</li>
        <li><strong>局部内部类</strong>：定义在方法里。</li>
        <li><strong>匿名内部类</strong>：没有名字，常用于回调、事件监听、创建线程。</li>
      </ol>
      <blockquote>一个高频考点：局部内部类和匿名内部类访问外部局部变量时，那个变量必须是 final（Java 8 后"事实 final"也行）。原因是内部类其实是拷贝了一份变量值，final 能保证两边一致。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 四种内部类</strong></p>
      <ul>
        <li><strong>成员内部类</strong>：依附外部实例，能访问外部所有成员（含 private）。</li>
        <li><strong>静态内部类</strong>：不依赖外部实例，最常用（如 HashMap.Node），推荐减少耦合。</li>
        <li><strong>局部内部类</strong>：定义在方法或作用域内。</li>
        <li><strong>匿名内部类</strong>：没有名字，用于回调、监听、线程创建。</li>
      </ul>
      <p><strong>2. 匿名内部类访问 final 的字节码原理</strong></p>
      <p>Java 内部类是"残缺闭包"，捕获的是<strong>值的副本</strong>而非变量引用。字节码层面：</p>
      <ul>
        <li><strong>局部变量副本</strong>：被访问的外部局部变量作为<strong>构造函数参数</strong>传入，保存为内部类的 final 成员字段。为保证内外一致性，要求原变量 final（Java 8+ 也接受 effectively final）。</li>
        <li><strong>this$0 合成字段</strong>：编译器为非静态内部类自动生成，指向外部类实例，在调用父类构造器<strong>之前</strong>赋值，使内部类可访问外部类（含 private）成员。</li>
        <li><strong>access$xxx 合成方法</strong>：访问外部 private 成员时，编译器生成静态桥接方法间接访问。</li>
      </ul>
      <p><strong>3. 与 JS 闭包区别</strong></p>
      <p>JS 闭包直接捕获变量引用（可修改），Java 只捕获值副本（不可改）。所以 Java 内部类访问的局部变量必须 final。</p>
      <p><strong>4. 面试标准答法</strong></p>
      <p>四种：成员、静态、局部、匿名。重点理解匿名内部类访问局部变量必须 final，原理是内部类拷贝了变量值副本，final 保证一致性；通过 this$0 合成字段访问外部类成员。</p>`},
  {c:"基础",d:"★★",q:"Object 类有哪些常用方法？",
   a:`<ul>
        <li><strong>equals()</strong> / <strong>hashCode()</strong>：判断相等和算哈希码，两者绑定。</li>
        <li><strong>clone()</strong>：克隆对象，是<strong>浅拷贝</strong>（引用类型只复制引用），要实现 Cloneable 接口。</li>
        <li><strong>toString()</strong> / <strong>getClass()</strong>：转字符串、获取运行时类（反射入口）。</li>
        <li><strong>wait() / notify() / notifyAll()</strong>：线程间通信用的，<strong>必须在 synchronized 块里调用</strong>，否则报错。</li>
        <li><strong>finalize()</strong>：对象被回收前调用（已经废弃，不推荐用）。</li>
      </ul>
      <blockquote>重点说两点：① clone 是浅拷贝，深拷贝得自己实现或用序列化；② wait/notify 必须配合 synchronized 用，wait 会释放锁，notify 不会马上释放（要等同步块结束）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 方法清单</strong></p>
      <ul>
        <li><strong>getClass()</strong>：final 方法，返回运行时 Class 对象（反射入口）。</li>
        <li><strong>equals(Object)</strong> / <strong>hashCode()</strong>：相等判断与哈希码，契约绑定。</li>
        <li><strong>clone()</strong>：克隆，浅拷贝，需实现 Cloneable 标记接口，否则抛 CloneNotSupportedException。</li>
        <li><strong>toString()</strong>：默认返回 "类名@哈希值"，建议重写。</li>
        <li><strong>wait() / wait(long) / notify() / notifyAll()</strong>：线程间通信。</li>
        <li><strong>finalize()</strong>：GC 回收前调用（JDK 9 标记废弃，不推荐）。</li>
      </ul>
      <p><strong>2. clone 浅拷贝 vs 深拷贝</strong></p>
      <p>浅拷贝：基本类型复制值，引用类型只复制引用（指向同一对象）。深拷贝：重写 clone() 手动克隆内部可变对象，或用序列化实现。必须实现 Cloneable 标记接口。</p>
      <p><strong>3. wait/notify 与 monitor（监视器锁）的关系</strong></p>
      <p>底层操作对象关联的 monitor：</p>
      <ul>
        <li><strong>必须先持有该对象的锁</strong>（synchronized 块内）才能调用，否则抛 IllegalMonitorStateException（JVM 硬约束）。</li>
        <li><code>wait()</code>：线程<strong>释放锁</strong>并进入 monitor 的 _waitSet 等待；唤醒后需重新竞争锁。</li>
        <li><code>notify()</code>：把 _waitSet 中一个线程移到 _EntryList，但<strong>不立即释放锁</strong>，要等 synchronized 块结束。</li>
        <li>调用 wait/notify 会触发 synchronized 锁<strong>膨胀为重量级锁</strong>。</li>
      </ul>
      <p><strong>4. 面试标准答法</strong></p>
      <p>Object 有 getClass、equals/hashCode、clone、toString、wait/notify/notifyAll、finalize。重点：clone 是浅拷贝；wait/notify 必须在 synchronized 块内（持有 monitor），wait 释放锁而 notify 不立即释放。</p>`},

  {c:"集合",d:"★★",q:"TreeMap 的底层原理？为什么用红黑树？",
   a:`<p>TreeMap 基于<strong>红黑树</strong>，键有序（自然顺序或 Comparator）。</p>
      <ul>
        <li>put/get/remove 都是 O(logn)。</li>
        <li>key 必须可比较（实现 Comparable 或传 Comparator），否则 ClassCastException。</li>
        <li>不允许 null key（比较时 NPE）。</li>
      </ul>
      <blockquote>用红黑树而非 AVL：增删频繁时红黑树旋转少，综合性能好。需要排序遍历（如按 key 范围查）用 TreeMap。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 数据结构</strong></p>
      <p>TreeMap 基于红黑树（自平衡二叉搜索树）。键按自然顺序（key 实现 Comparable）或构造时传入的 Comparator 排序。中序遍历得到有序序列。</p>
      <p><strong>2. 时间复杂度</strong></p>
      <p>put/get/remove/containsKey 都是 O(logn)（红黑树高度 logn）。相比 HashMap 的 O(1) 慢，但优势是有序。</p>
      <p><strong>3. 红黑树的特性（五个性质）</strong></p>
      <ul>
        <li>每个节点是红或黑。</li>
        <li>根节点是黑。</li>
        <li>叶子节点（NIL）是黑。</li>
        <li>红节点的子节点必须是黑（不能连续两个红）。</li>
        <li>从任一节点到其叶子节点的所有路径，包含相同数目的黑节点（黑高相同）。</li>
      </ul>
      <p>这些性质保证最长路径不超过最短路径的 2 倍，所以高度是 O(logn)。</p>
      <p><strong>4. 为什么用红黑树不用 AVL 树</strong></p>
      <p>AVL 是严格平衡（高度差≤1），查询略快；但插入删除时旋转多（维护成本高）。红黑树是弱平衡，增删时旋转少，<strong>综合性能</strong>（增删查）更好。集合的增删场景多，所以选红黑树。</p>
      <p><strong>5. 使用场景</strong></p>
      <ul>
        <li>需要按 key 排序遍历、范围查询（如找出 18~30 岁的用户）。</li>
        <li>key 必须可比较（Comparable 或 Comparator），否则 ClassCastException。</li>
        <li>不允许 null key（比较时 NPE）。</li>
      </ul>
      <p><strong>6. 面试标准答法</strong></p>
      <p>TreeMap 基于红黑树，key 有序，操作 O(logn)。选红黑树而非 AVL 是因为增删旋转少综合性能好。适合需要排序/范围查询的场景，key 必须可比较。</p>`},
  {c:"集合",d:"★★",q:"LinkedHashMap 怎么实现 LRU 缓存？",
   a:`<p>LinkedHashMap = HashMap + 双向链表，维护<strong>插入顺序</strong>或<strong>访问顺序</strong>。</p>
      <p>构造方法 <code>accessOrder=true</code> 开启访问顺序：get/put 时把节点移到链表尾部（最近使用）。</p>
      <p>实现 LRU：重写 <code>removeEldestEntry</code>，当 size &gt; 容量时返回 true，自动淘汰链表头部（最久未用）。</p>
      <pre><code>new LinkedHashMap&lt;K,V&gt;(cap, 0.75f, true){
  protected boolean removeEldestEntry(Map.Entry eldest){
    return size() &gt; MAX;
  }
};</code></pre>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. LinkedHashMap 结构</strong></p>
      <p>继承 HashMap，每个 Entry 额外有 before/after 指针，组成双向链表。HashMap 的数组+链表保证查找 O(1)，双向链表维护访问顺序。</p>
      <p><strong>2. 两种迭代顺序</strong></p>
      <ul>
        <li><strong>插入顺序</strong>（accessOrder=false，默认）：按 put 的先后顺序。</li>
        <li><strong>访问顺序</strong>（accessOrder=true）：get/put 时把访问的节点移到链表尾部。头部就是最久未访问。</li>
      </ul>
      <p><strong>3. 实现 LRU 的原理</strong></p>
      <p>accessOrder=true 时，每次访问（get/put）会把节点 afterNodeAccess 移到链表尾部，链表头部就是最久未用的。重写 removeEldestEntry 在 put 后判断是否超容量，返回 true 则自动删除链表头部节点（evict）。</p>
      <p><strong>4. 完整实现示例</strong></p>
      <pre><code>public class LruCache&lt;K,V&gt; extends LinkedHashMap&lt;K,V&gt; {
    private final int capacity;
    public LruCache(int capacity) {
        super(capacity, 0.75f, true);  // accessOrder=true
        this.capacity = capacity;
    }
    @Override
    protected boolean removeEldestEntry(Map.Entry&lt;K,V&gt; eldest) {
        return size() &gt; capacity;  // 超容量淘汰头部
    }
}</code></pre>
      <p><strong>5. 注意事项</strong></p>
      <ul>
        <li>非线程安全，多线程要 Collections.synchronizedMap 包装或自己加锁。</li>
        <li>LRU 精确，但访问顺序维护有开销。生产中也常用 Caffeine（更先进，W-TinyLFU 算法）。</li>
      </ul>`},
  {c:"集合",d:"★★",q:"什么是 fail-fast 机制？",
   a:`<p><strong>fail-fast</strong>：遍历集合时如果发现<strong>结构性修改</strong>（add/remove 改了 modCount），立即抛出 ConcurrentModificationException。</p>
      <p>原理：迭代器开始时记录 expectedModCount，每次 next() 比较与 modCount 是否相等。</p>
      <p>注意：</p>
      <ul>
        <li>只是"尽力检测"，不能保证并发安全（多线程下 modCount 操作非原子）。</li>
        <li>单线程下用迭代器自身的 remove() 不会报错（会同步更新 expectedModCount）。</li>
        <li>CopyOnWriteArrayList 是 fail-safe（复制遍历），不会抛异常但有弱一致性。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. fail-fast 原理</strong></p>
      <p>集合内部维护一个 modCount 字段，记录结构性修改次数（add/remove/clear 等）。迭代器创建时把 modCount 拷贝到 expectedModCount，每次 next() 检查 checkForComodification：两者不等就抛 ConcurrentModificationException。</p>
      <p><strong>2. 触发场景</strong></p>
      <ul>
        <li>用 for-each 或迭代器遍历时，<strong>用集合自身的 add/remove 修改</strong>（而不是迭代器的 remove）。</li>
        <li>多线程下，一个遍历、另一个修改。</li>
      </ul>
      <p><strong>3. 单线程正确删除</strong></p>
      <p>用<strong>迭代器的 remove()</strong>（iterator.remove()），它会同步更新 expectedModCount，不会报错。Java 8+ 也可用 list.removeIf(...)。</p>
      <p><strong>4. fail-fast 不是并发安全保证</strong></p>
      <p>modCount 的检查和自增不是原子的，多线程下可能检测不到修改（异常不一定抛）。它是"尽力而为"的错误检测，不能依赖它做并发控制。</p>
      <p><strong>5. fail-safe 集合</strong></p>
      <p>CopyOnWriteArrayList、ConcurrentHashMap 的迭代器是 fail-safe：遍历的是副本或弱一致视图，修改不影响遍历，但可能读不到最新数据。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>fail-fast 通过 modCount 检测遍历中的结构性修改，抛 ConcurrentModificationException。原理是迭代器比对 expectedModCount 和 modCount。遍历时删除要用迭代器 remove 或 removeIf。fail-safe（CopyOnWriteArrayList）遍历副本不抛异常但有弱一致性。</p>`},
  {c:"集合",d:"★★",q:"HashSet 的底层原理？",
   a:`<p>HashSet <strong>底层就是 HashMap</strong>，value 统一用一个 static 的 PRESENT 对象占位。所有方法都委托给 HashMap。</p>
      <ul>
        <li>add(e) → map.put(e, PRESENT)。</li>
        <li>remove(e) → map.remove(e)。</li>
        <li>contains(e) → map.containsKey(e)。</li>
      </ul>
      <p>所以 HashSet 的去重、性能特性、null 支持都和 HashMap 一致。</p>
      <blockquote>自定义对象存 HashSet 必须重写 hashCode 和 equals，否则逻辑相等的对象会被当成不同对象。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. HashSet 实现</strong></p>
      <p>HashSet 内部持有一个 HashMap，所有元素作为 HashMap 的 key 存储，value 统一是 PRESENT（一个 static final 的 Object 占位对象）。</p>
      <pre><code>public class HashSet&lt;E&gt; {
    private transient HashMap&lt;E,Object&gt; map;
    private static final Object PRESENT = new Object();
    public boolean add(E e) { return map.put(e, PRESENT)==null; }
    public boolean contains(Object o) { return map.containsKey(o); }
    public boolean remove(Object o) { return map.remove(o)==PRESENT; }
}</code></pre>
      <p><strong>2. 为什么这么设计</strong></p>
      <p>HashSet 的本质就是"不存重复元素的集合"，而 HashMap 的 key 天然不重复（靠 hashCode+equals 判重）。复用 HashMap 避免重复造轮子。</p>
      <p><strong>3. 特性（继承自 HashMap）</strong></p>
      <ul>
        <li>允许 1 个 null 元素。</li>
        <li>无序（hash 顺序）。</li>
        <li>add/contains/remove 都是 O(1)（哈希）。</li>
        <li>非线程安全。</li>
        <li>初始容量 16，负载因子 0.75。</li>
      </ul>
      <p><strong>4. 自定义对象存 HashSet 的关键</strong></p>
      <p>必须重写 hashCode 和 equals，否则用 Object 默认的（基于地址），逻辑相等的两个对象会被当成不同对象存进去。</p>
      <p><strong>5. LinkedHashSet 和 TreeSet</strong></p>
      <ul>
        <li><strong>LinkedHashSet</strong>：底层 LinkedHashMap，维护插入顺序。</li>
        <li><strong>TreeSet</strong>：底层 TreeMap（红黑树），元素有序，O(logn)。</li>
      </ul>`},

  {c:"MySQL",d:"★★",q:"分库分表怎么做？什么时候要分？",
   a:`<p><strong>何时分</strong>：单表数据千万级、写入瓶颈、单库连接数/磁盘瓶颈。</p>
      <p><strong>方式</strong>：</p>
      <ul>
        <li><strong>垂直分库</strong>：按业务拆库（订单库、用户库）。</li>
        <li><strong>垂直分表</strong>：把宽表的冷热列拆开。</li>
        <li><strong>水平分库分表</strong>：按 sharding key（如 user_id）路由到不同库/表。</li>
      </ul>
      <p><strong>分片策略</strong>：范围分片、hash 取模、一致性 hash。</p>
      <p><strong>带来的问题</strong>：</p>
      <ul>
        <li>跨库 JOIN 难（冗余字段、应用层组装）。</li>
        <li>分布式事务。</li>
        <li>分布式 ID（雪花算法）。</li>
        <li>跨库分页排序复杂。</li>
      </ul>
      <blockquote>中间件：ShardingSphere（Sharding-JDBC）、MyCat。能不分就不分，优先优化索引/SQL/架构（读写分离、缓存）。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 什么时候要分</strong></p>
      <ul>
        <li><strong>数据量</strong>：单表数据超过千万级，B+ 树变高，查询变慢。</li>
        <li><strong>写入瓶颈</strong>：单库写 TPS 打满（数据库连接数、IO）。</li>
        <li><strong>运维瓶颈</strong>：单库备份、DDL 时间长。</li>
      </ul>
      <p><strong>2. 垂直拆分</strong></p>
      <ul>
        <li><strong>垂直分库</strong>：按业务把不同的表拆到不同库（用户库、订单库、商品库）。解决库级别表太多、耦合问题。</li>
        <li><strong>垂直分表</strong>：把一张宽表按字段拆成多张（把不常用的大字段如 TEXT/BLOB 拆出去）。解决单表字段太多、IO 浪费。</li>
      </ul>
      <p><strong>3. 水平拆分（重点）</strong></p>
      <p>把同一张表的数据按规则分散到多个库/表。</p>
      <ul>
        <li><strong>范围分片</strong>：如 id 1-1000万 在表1，1000万-2000万 在表2。容易热点（新数据集中写一张）。</li>
        <li><strong>Hash 取模</strong>：user_id % N 路由到 N 个库/表。分布均匀，但扩容（改 N）要迁移大量数据。</li>
        <li><strong>一致性 Hash</strong>：扩容只影响相邻节点，数据迁移少。</li>
      </ul>
      <p><strong>4. 分库分表带来的问题</strong></p>
      <ul>
        <li><strong>跨库 JOIN</strong>：无法直接 join。解决：冗余字段、应用层组装、ElasticSearch 宽表。</li>
        <li><strong>分布式事务</strong>：跨库操作的一致性。用 Seata、消息事务。</li>
        <li><strong>分布式 ID</strong>：自增主键失效。用雪花算法、号段模式。</li>
        <li><strong>跨库分页/排序</strong>：limit 10,5 要在各库各取前 15 再合并，深度分页更难。</li>
        <li><strong>跨库聚合</strong>：count/sum 要汇总。</li>
      </ul>
      <p><strong>5. 中间件</strong></p>
      <ul>
        <li><strong>ShardingSphere（Sharding-JDBC）</strong>：JDBC 层增强，应用内集成，无额外部署，主流。</li>
        <li><strong>MyCat</strong>：独立代理层，应用无感知，但多一层网络。</li>
      </ul>
      <p><strong>6. 决策原则</strong></p>
      <p>能不分就不分！优先：优化索引/SQL → 读写分离 → 加缓存 → 实在不行再分库分表。分了就考虑 NoSQL（ES 处理搜索、MongoDB 处理文档）。</p>
      <p><strong>7. 面试标准答法</strong></p>
      <p>单表千万级/写瓶颈时分。垂直分库（按业务）、垂直分表（拆字段）、水平分库分表（sharding key 路由，范围/hash/一致性hash）。带来跨库join、分布式事务、分布式ID、跨库分页问题。中间件 ShardingSphere。能不分就不分，优先优化。</p>`},
  {c:"MySQL",d:"★★",q:"EXPLAIN 执行计划中哪些字段重要？",
   a:`<ul>
        <li><strong>id</strong>：执行顺序，id 大的先执行，相同 id 从上往下。</li>
        <li><strong>select_type</strong>：SIMPLE/PRIMARY/SUBQUERY/DERIVED 等。</li>
        <li><strong>type</strong>（最关键）：访问类型，从好到差 system&gt;const&gt;eq_ref&gt;ref&gt;range&gt;index&gt;ALL。生产至少到 <strong>range/ref</strong>。</li>
        <li><strong>possible_keys</strong>：可能用到的索引。</li>
        <li><strong>key</strong>：实际用到的索引（NULL 表示没走索引）。</li>
        <li><strong>key_len</strong>：索引使用的字节数，判断联合索引用了几个字段。</li>
        <li><strong>rows</strong>：预估扫描行数，越少越好。</li>
        <li><strong>filtered</strong>：过滤后剩余比例。</li>
        <li><strong>Extra</strong>：Using index（覆盖索引，好）/ Using where / Using filesort（需优化）/ Using temporary（需优化）/ Using index condition（索引下推）。</li>
      </ul>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. id（执行序号）</strong></p>
      <p>标识 SELECT 的序号。id 相同：从上往下执行；id 不同：id 大的先执行（子查询先于外层）。NULL 表示 UNION 合并的临时表。</p>
      <p><strong>2. select_type（查询类型）</strong></p>
      <ul>
        <li>SIMPLE：简单查询，无子查询/UNION。</li>
        <li>PRIMARY：复杂查询的最外层。</li>
        <li>SUBQUERY：子查询。</li>
        <li>DERIVED：派生表（from 子句的子查询）。</li>
        <li>UNION/UNION RESULT：UNION 中的第二个及合并结果。</li>
      </ul>
      <p><strong>3. type（访问类型，最关键）</strong></p>
      <p>性能从好到差：</p>
      <ul>
        <li><strong>system</strong>：表只有一行（系统表）。</li>
        <li><strong>const</strong>：主键/唯一索引等值查询，最多一行。极快。</li>
        <li><strong>eq_ref</strong>：join 时用主键/唯一索引，一对一。最好的 join 类型。</li>
        <li><strong>ref</strong>：普通索引等值查询，可能多行。常见且好。</li>
        <li><strong>range</strong>：范围扫描（&gt; &lt; between in）。常见。</li>
        <li><strong>index</strong>：扫描整个索引树（比 ALL 好，因为索引比数据小）。如 count(*)、没 where 但有 order by 索引列。</li>
        <li><strong>ALL</strong>：全表扫描，最差。必须优化。</li>
      </ul>
      <p>生产 SQL 至少要达到 range 或 ref。</p>
      <p><strong>4. possible_keys（可能用的索引）</strong></p>
      <p>优化器考虑的索引列表。可能有多个。</p>
      <p><strong>5. key（实际用的索引）</strong></p>
      <p>优化器最终选的。NULL = 没用索引（全表扫描）。和 possible_keys 对比能看出优化器的选择。</p>
      <p><strong>6. key_len（索引长度）</strong></p>
      <p>使用的索引字节数。判断联合索引用了几列：key_len = 各用到的列长度之和（int=4、bigint=8、char(n)=n×字符集、varchar(n)=n×字符集+2、允许 NULL +1）。</p>
      <p><strong>7. rows（预估扫描行数）</strong></p>
      <p>优化器估算要扫描的行数。越少越好，是评估 SQL 性能的核心指标。</p>
      <p><strong>8. filtered（过滤比例）</strong></p>
      <p>经过条件过滤后剩余的百分比。rows × filtered ≈ 实际返回行数。</p>
      <p><strong>9. Extra（额外信息，重要）</strong></p>
      <ul>
        <li><strong>Using index</strong>：覆盖索引，不回表，好。</li>
        <li><strong>Using where</strong>：server 层过滤，一般。</li>
        <li><strong>Using index condition</strong>：索引下推（ICP）。</li>
        <li><strong>Using filesort</strong>：额外排序（order by 没用索引），<strong>需优化</strong>。</li>
        <li><strong>Using temporary</strong>：用了临时表（group by/distinct），<strong>需优化</strong>。</li>
        <li><strong>Using MRR</strong>：多范围读优化。</li>
      </ul>
      <p><strong>10. 面试标准答法</strong></p>
      <p>重点看 type（至少 range/ref，避免 ALL）、key（实际索引）、key_len（联合索引用了几列）、rows（扫描行数越少越好）、Extra（Using index 好，filesort/temporary 需优化）。id 判断 join 执行顺序。</p>`},
  {c:"MySQL",d:"★★",q:"什么是索引下推（ICP，Index Condition Pushdown）？",
   a:`<p>MySQL 5.6 引入的优化。在没有 ICP 时，存储引擎按索引找到主键 → 回表取整行 → server 层过滤。</p>
      <p><strong>有 ICP</strong>：把<strong>能用索引列判断的 where 条件下推到存储引擎</strong>，先在索引上过滤，再回表，减少回表次数。</p>
      <p>例子：联合索引 (name, age)，<code>where name like '张%' and age=20</code>。name 用范围走索引，age 在 server 层过滤会回很多表；ICP 在索引层就用 age 过滤，大幅减少回表。</p>
      <blockquote>EXPLAIN 看到 <strong>Using index condition</strong> 就是用了索引下推。</blockquote>`,
   b:`<h5>📐 八股文详解</h5>
      <p><strong>1. 没有 ICP 时的流程（5.6 前）</strong></p>
      <p>联合索引 (name, age)，查询 <code>select * from t where name like '张%' and age=20</code>：</p>
      <ol>
        <li>存储引擎按 name 索引找到所有 name like '张%' 的记录的主键。</li>
        <li><strong>逐条回表</strong>取完整数据行。</li>
        <li>server 层再用 age=20 过滤。</li>
      </ol>
      <p>问题：即使很多行 age≠20，也要全部回表，浪费大量随机 IO。</p>
      <p><strong>2. 有 ICP 的流程（5.6+）</strong></p>
      <p>把 age=20 这个<strong>能用索引列判断的条件</strong>下推到存储引擎层：</p>
      <ol>
        <li>存储引擎按 name 索引找到 name like '张%' 的记录。</li>
        <li><strong>在索引上直接判断 age=20</strong>（age 在联合索引里），只对满足的才回表。</li>
        <li>大幅减少回表次数。</li>
      </ol>
      <p><strong>3. 为什么能下推</strong></p>
      <p>因为联合索引 (name, age) 的叶子节点<strong>同时有 name 和 age</strong>。虽然 age 因 name 用了范围而不能用于索引定位（最左前缀中断），但<strong>可以从索引里读到 age 值做过滤</strong>，不用回表。</p>
      <p><strong>4. 适用条件</strong></p>
      <ul>
        <li>联合索引，且部分条件因前面用范围而无法走索引定位。</li>
        <li>InnoDB、MyISAM 引擎。</li>
        <li>子查询的某些情况不支持。</li>
      </ul>
      <p><strong>5. 如何验证</strong></p>
      <p>EXPLAIN 的 Extra 显示 <strong>Using index condition</strong> 就是用了 ICP。对比没有 ICP 时是 Using where。</p>
      <p><strong>6. 面试标准答法</strong></p>
      <p>ICP 是 5.6 优化。把能用索引列判断的 where 条件下推到存储引擎层，先在索引上过滤再回表，减少回表次数。典型场景：联合索引 (name,age)，where name like '张%' and age=20，ICP 用 age 在索引层过滤。Extra 显示 Using index condition。</p>`},
